### Buttons

# Main
 ccshtool_toggle_visibility_button_tt:0 "[CCSHTOOL_OPEN_CLOSE_SCRIPTLOC]"
 ccshtool_toggle_visibility_on:0 "Klicken Sie hier, um das §CHost Tool§! zu öffnen."
 ccshtool_toggle_visibility_off:0 "Klicken Sie hier, um das §CHost Tool§! zu schließen. Dadurch werden auch alle gesperrten §RTarget§! und/oder §RReceiver§! sowie alle markierten Zustände gelöscht."
 ccshtool_in_use_button_tt:0 "Ein §RTarget§! und/oder §RReceiver§! wurde von einem Host ausgewählt. Bitte warten Sie, bis Sie mit der Verwendung des Tools fertig sind."
 ccshtool_close_button_tt:0 "Schließen Sie das §CHost Tool§!. Dadurch werden auch alle gesperrten §RTarget§! und/oder §RReceiver§! sowie alle markierten Zustände gelöscht."
 ccshtool_info_button_tt:0 "§CVerwenden des Host-Tools§!\n----------------------------------------------------------------\n\n§RDas Host-Tool ist komplex und sollte immer mit Vorsicht verwendet werden. Falsche Verwendung kann zu fehlerhaften Spielständen führen.\n\nIn dieser generischen Version funktionieren nicht alle Funktionen. Wenden Sie sich an Discord, um Rat zu erhalten.§!\n\nEJede Schaltfläche in dieser Benutzeroberfläche verfügt über einen Tooltip, der Ihnen sagt, wie sich die ausgewählte Aktion auf §RTarget§! und §RReceiver§! auswirkt. Wenn eine Schaltfläche die Auswahl einer oder beider erfordert, ist sie erst verfügbar, wenn Sie die Zielländer festgelegt haben. Sie können dies tun, indem Sie ein Land auf der Karte auswählen und auf die entsprechende Umschaltschaltfläche oben rechts im Feld §RTarget§! oder §RReceiver§! klicken.\n\nWenn eines oder beide gesperrt sind (angezeigt durch die Änderung der Umschaltschaltfläche in Grün), werden alle Hosts mit einem Popup links von dieser Schaltfläche darüber informiert, dass das Tool verwendet wird. Es ist wichtig, dass Hosts das Tool nacheinander verwenden – es kann jeweils nur eine Aktion ausgeführt werden.\n\nIm Allgemeinen werden für das Land §RTarget§! Aktionen ausgeführt, und sofern relevant, profitiert das Land §RReceiver§! davon. Beispielsweise werden markierte Zustände vom §RTarget§! zum §RReceiver§!.\n\n§Y übertragen. Sie können auf diese Schaltfläche klicken, um alle gesperrten §RTarget§Y und §RReceiver§Y sowie alle markierten Zustände.§! schnell zurückzusetzen"
 ccshtool_switch_button_tt:0 "Vertauschen Sie §RTarget§! und §RReceiver§!."
 ccshtool_add_host_button_tt:0 "Klicken Sie, um §RTarget§! Zugriff auf das §CHost Tool§! zu gewähren."
 ccshtool_remove_host_button_tt:0 "Klicken Sie hier, um den Zugriff von §RTarget§! auf das §CHost Tool§! zu entfernen."

