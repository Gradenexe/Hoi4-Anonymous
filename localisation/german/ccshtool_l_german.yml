 ccshtool_receiver_toggle_on_button_tt:0 "Klicken Sie hier, um den ausgewählten §RReceiver§! zu entsperren."
 ccshtool_receiver_toggle_off_button_tt:0 "Klicken Sie, um den ausgewählten §RReceiver§! zu sperren, der vom Eigentümer des aktuell ausgewählten Status bestimmt wird. Dies kann nicht dasselbe Land wie §RTarget§! sein."

