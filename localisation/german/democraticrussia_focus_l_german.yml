l_german:
 SOV_reinstate_the_duma:0 "Setzen Sie die Duma wieder ein"
 SOV_reinstate_the_duma_desc:0 "Auch wenn die bisherigen Umsetzungen massiv gescheitert sind, sollten wir den demokratischen Institutionen in der Duma dennoch eine zweite Chance geben!"
 SOV_hold_election:0 "Beginnen Sie mit den Wahlen"
 SOV_hold_election_desc:0 "Nachdem wir nun genügend Unterstützung für demokratische Institutionen gesammelt haben, müssen wir nun die Demokratie wiederherstellen und demokratische Wahlen abhalten, damit das russische Volk über die nächste Regierung entscheiden kann ..."
 SOV_continue_the_monarchy:0 "Setzen Sie die Monarchie fort"
 SOV_continue_the_monarchy_desc:0 "Die Männer, die für die Nation gegen die kommunistische Bedrohung kämpften, kämpften nicht für eine Republik, sie kämpften für die Monarchie. Deshalb ist es am besten, wenn der Zar hier bleibt."
 SOV_return_of_republic:0 "Die Republik kehrt zurück"
 SOV_return_of_republic_desc:0 "Die Zeiten eines einzigen, absoluten Herrschers sind längst vorbei.\nNein. Wir werden das republikanische System der Vergangenheit wiederherstellen!"
 SOV_reforge_old_alliances:0 "Alte Allianzen neu schmieden"
 SOV_reforge_old_alliances_desc:0 "Wir haben während des Ersten Weltkriegs mit den Briten zusammengearbeitet, um die deutsche Bedrohung zu stoppen. Nun scheint die Bedrohung immer noch zu bestehen, und wir werden dieses Bündnis für die Sicherheit der Demokratien wiederbeleben."
 SOV_our_own_alliance:0 "Östlicher Sicherheitspakt"
 SOV_our_own_alliance_desc:0 "Da die Bedrohung durch die Sowjets nun vorbei ist, müssen sich die osteuropäischen Nationen sicherlich viel sicherer fühlen. Aber wer sagt, dass die Deutschen ihre Unabhängigkeit respektieren sollen?"
 SOV_union_of_sovereign_republics:0 "Die Union der Souveränen Republiken"
 SOV_union_of_sovereign_republics_desc:0 "Wir sollten unser Volk vereinen. Die Aufspaltung in viele verschiedene Staaten wird unsere Probleme nicht lösen, sondern mehr verursachen. Wir müssen unsere Nation in einer neuen Union wieder vereinen."
 SOV_dismantle_the_union:0 "Auflösung der Union"
 SOV_dismantle_the_union_desc:0 "Wie könnten wir so viele Menschen in einem Staat verwalten? Es ist nur richtig, dass wir uns in viele halbautonome Staaten aufteilen, damit unsere Völker wahre Befreiung und Freiheit erfahren können."
 SOV_closer_cooperation:0 "Engere Zusammenarbeit"
 SOV_closer_cooperation_desc:0 "Unser Bündnis reicht nicht aus. Nein, wir müssen eine engere Zusammenarbeit mit unseren Verbündeten anstreben, um größere Vorteile zu erzielen."
 SOV_expand_the_union:0 "Erweitern Sie die Union"
 SOV_expand_the_union_desc:0 "Wir sollten unsere wunderbare Verbindung stärken, indem wir unsere Verbündeten einladen, sich uns anzuschließen."
 SOV_god_save_the_tsar:0 "Gott schütze den Zaren"
 SOV_god_save_the_tsar_desc:0 "Die Menschen von [SOV.getnamedef] müssen ihre volle Unterstützung hinter den Zaren stellen. Gott will es!"
 SOV_construct_new_democracies:0 "Orchestrator der Demokratien"
 SOV_construct_new_democracies_desc:0 "Wir müssen uns als demokratische Macht etablieren und andere Demokratien unterstützen."
 SOV_reform_entente:0 "Laden Sie Mitglieder der Östlichen Entente erneut ein"
 SOV_reform_entente_desc:0 "Viele unserer ehemaligen Ostfreunde aus der Entente-Zeit scheinen eher einsam zu sein. Lassen Sie uns das beheben."
 SOV_greater_russian_dream:0 "Größerer russischer Traum"
 SOV_greater_russian_dream_desc:0 "Wir müssen unser Land groß und großartig machen, noch besser als in der guten alten Zeit."
 SOV_retake_poland:0 "Erobere Polen zurück"
 SOV_retake_poland_desc:0 "Polen hat wieder ein Land gefunden, aber das kann nicht länger so bleiben. Sie sind rechtmäßige Länder von [ROOT.getnameDEF]!"
 SOV_retake_baltic:0 "Erobern Sie die baltischen Staaten zurück"
 SOV_retake_baltic_desc:0 "Die baltischen Staaten sind schwach und leicht zu manipulieren. Wir müssen sie zurückerobern, da es sich um unser rechtmäßiges Land handelt und andere Regierungen möglicherweise ähnliche Pläne haben ..."
 SOV_retake_finland:0 "Erobere Finnland zurück"
 SOV_retake_finland_desc:0 "Finnland war einst unser Großherzogtum. Doch während unseres ersten Bürgerkriegs haben sie sich inzwischen losgesagt. Wir müssen dieses Problem lösen und sie mit Gewalt dazu bringen, sich uns wieder anzuschließen."
 SOV_retake_bessarabia:0 "Das Bessarabien-Problem"
 SOV_retake_bessarabia_desc:0 "Rumänien hat den Fehler gemacht, uns während unseres ersten Bürgerkriegs ungerechtfertigterweise Bessarabien zu stehlen. Wir werden dafür sorgen, dass sie diese Entscheidung bereuen!"
 SOV_new_frontiers:0 "Neue Grenzen"
 SOV_new_frontiers_desc:0 "Unsere Erweiterung wartet auf niemanden! Wir werden noch weiter gehen als bisher. Wer wird uns schließlich aufhalten?"
 SOV_strike_east:0 "Schlag nach Osten"
 SOV_strike_east_desc:0 "Die Mongolei und das kleine Tannu Tuva stehen derzeit schwach da. Wir sollten jetzt unsere Chance nutzen, um die Macht zu übernehmen! Schließlich wissen wir, was passiert, wenn sie zu stark werden ..."
 SOV_secure_bosporus:0 "Kampf um den Bosporus"
 SOV_secure_bosporus_desc:0 "Nach dem Ersten Weltkrieg wollten wir einst Konstantinopel, doch nach unserem Ausscheiden aus dem Krieg zerplatzten unsere Träume. Heute ist [TUR.getnamedef] nicht mehr das starke Imperium wie früher. Wir sollten diese Chance nutzen, um uns das zurückzuerobern, was uns gehören muss!"
 SOV_revenge_for_1905:0 "Rache für 1905"
 SOV_revenge_for_1905_desc:0 "Japan hat seit dem Russisch-Japanischen Krieg den Eindruck, dass es sich mit uns anlegen kann. Seit diesem Krieg leben wir in Schande, aber wenn wir sie erneut bekämpfen, können wir unsere Macht unter Beweis stellen und Japan in den Schatten stellen."
 SOV_reform_og_entente:0 "Reform der Entente"
 SOV_reform_og_entente_desc:0 "Die Entente mag sich nach dem Ersten Weltkrieg aufgelöst haben, aber wir müssen sie zurückhaben, um der wachsenden Bedrohung durch neue Imperien entgegenzuwirken ..."
 SOV_alaska_refund:0 "Die Alaska-Rückerstattung"
 SOV_alaska_refund_desc:0 "Vor langer Zeit haben wir Alaska während des Krimkrieges an [USA.getnameDEF] verkauft. Das war jedoch ein großer Fehler, und wir werden ihn zurückbekommen! Wir zahlen natürlich."
 SOV_russia_first:0 "Russland zuerst"
 SOV_russia_first_desc:0 "Welches Bedürfnis haben wir, uns in ausländische Allianzen zu verwickeln? Unsere Vergangenheit zeigt, dass sie nur Ärger verursachen und in der Regel unserer Nation Schaden zufügen. Wir werden eine realistische, nationalistische Außenpolitik statt einer globalistischen verfolgen."
 SOV_westward_intervention:0 "Intervention nach Westen"
 SOV_westward_intervention_desc:0 "In Europa ist ein weiterer großer Krieg ausgebrochen. Wir müssen entscheiden, wie wir darin eingreifen wollen."
 SOV_eastern_intervention:0 "Östliche Intervention"
 SOV_eastern_intervention_desc:0 "In Asien ist ein weiterer großer Krieg ausgebrochen. Wir müssen entscheiden, wie wir darin eingreifen wollen."
 SOV_increase_military_budget:0 "Erhöhen Sie die Militärausgaben"
 SOV_increase_military_budget_desc:0 "Da in anderen Ländern bereits Kriege beginnen, dürfen wir nicht überrascht werden. Derzeit sind wir eher unvorbereitet und müssen daher einen Großteil unseres Budgets in das Militär umleiten."
 SOV_western_air_defenses:0 "Westliche Luftabwehr"
 SOV_western_air_defenses_desc:0 "Unsere westlichen Industrien wären in einem Luftkrieg gefährdet. Wir müssen sicherstellen, dass sie durch geeignete Flugabwehrwaffen geschützt werden."
 SOV_new_eastern_fleet:0 "Neue fernöstliche Flotte"
 SOV_new_eastern_fleet_desc:0 "Um uns auf einen Krieg im Pazifik vorzubereiten, dürfen wir nicht die gleichen Fehler machen wie zuvor. Deshalb sollten wir im Fernen Osten eine völlig neue Flotte aufbauen, um gegen die der Japaner zu kämpfen."
 SOV_greater_alliance:0 "Erweitern Sie die Allianz"
 SOV_greater_alliance_desc:0 "Es ist bekannt, dass die Deutschen und Italiener Ambitionen für den Balkan und die nordischen Länder haben. Wir sorgen dafür, dass auch sie geschützt werden."
 SOV_the_japanese_menace:0 "Die japanische Bedrohung"
 SOV_the_japanese_menace_desc:0 "Japan war schon immer eine Bedrohung für das Kräftegleichgewicht in der Region Ostasien, und seit 1904 haben wir Probleme mit ihm. Mittlerweile haben sich ihre Ambitionen von kleinen imperialistischen Kriegen zu denen des großen Übels entwickelt. Wir müssen dem sofort ein Ende setzen."
 SOV_the_revenge_for_brest_livotsk:0 "Rache für Brest-Litowsk"
 SOV_the_revenge_for_brest_livotsk_desc:0 "Bereits 1918 haben uns die Deutschen den harten Vertrag von Brest-Litowsk aufgezwungen. Ihr einziger Zweck bestand darin, ihre autokratischen, imperialistischen Ambitionen zu verwirklichen. Jetzt scheint Deutschland bereit zu sein, noch einmal zuzuschlagen, aber dieses Mal werden wir sie zuerst stoppen, um die Fehler des Ersten Weltkriegs zu verhindern."
 SOV_russian_war_economy:0 "Russische Kriegswirtschaft"
 SOV_russian_war_economy_desc:0 "Jetzt ist nicht die Zeit für Frieden. Mehr denn je befindet sich die Welt im Krieg, und wir müssen unsere Wirtschaft angemessen darauf einstellen."
 SOV_destroy_the_duce:0 "Bedrohung im Mittelmeerraum"
 SOV_destroy_the_duce_desc:0 "Italien hat ein Auge auf unsere südslawischen und orthodoxen Brüder geworfen. Wir können nicht zulassen, dass sie sie weiterhin so belästigen, also müssen wir sie zuerst schlagen."
 SOV_ally_with_real_china:0 "Verbündeter des echten China"
 SOV_ally_with_real_china_desc:0 "Kommunistische Revolutionäre haben versucht, in China eine sozialistische Republik zu errichten. Wir können nicht zulassen, dass unsere wahren chinesischen Brüder ihnen so zum Opfer fallen wie wir."
 SOV_internal_management:0 "Internes Management"
 SOV_internal_management_desc:0 "Wir sollten uns nach innen konzentrieren, damit wir unser Land stabilisieren können."
 SOV_fate_of_black_hundreds:0 "Schicksal der Schwarzhunderter"
 SOV_fate_of_black_hundreds_desc:0 "Obwohl die Schwarzhunderter der russischen Nation zweifellos treu ergeben sind, haben sie unserem Land irreparablen Schaden zugefügt, indem sie Minderheiten und liberale Gruppen ins Visier genommen haben. Obwohl sie im zweiten Bürgerkrieg beim Kampf gegen die bolschewistische Bedrohung halfen, werden sie im neuen Russland weiterhin ein Hindernis darstellen, sofern sie nicht aufgelöst werden."
 SOV_social_democracy:0 "Sozialdemokratie"
 SOV_social_democracy_desc:0 "Nicht alle Ideen der Kommunisten waren schlecht. Sie unterstützten viele dringend benötigte Reformen für die Arbeitnehmer, und der vollständige Kapitalismus würde nur zu den Problemen zurückkehren, die wir in der Vergangenheit hatten. Zum Glück können wir Kompromisse eingehen."
 SOV_capitalism:0 "Kapitalismus"
 SOV_capitalism_desc:0 "Sowohl Sozialisten als auch Kommunisten haben unsere Nation ruiniert, und das in vielerlei Hinsicht, aber die Wirtschaft ist zweifellos ein Problem. Wenn wir Russland den Ruhm zurückgeben wollen, werden wir auch zum besseren Wirtschaftssystem zurückkehren."
 SOV_foreign_development:0 "Ausländische Entwicklung"
 SOV_foreign_development_desc:0 "Unsere Wirtschaftsberater haben uns vorgeschlagen, Investitionen bei internationalen Unternehmen zu suchen. Diese Investitionen können dazu beitragen, unsere Wirtschaft sowohl im zivilen als auch im militärischen Bereich anzukurbeln."
 SOV_improve_workers_conditions:0 "Arbeitsbedingungen verbessern"
 SOV_improve_workers_conditions_desc:0 "Es ist nur richtig, dass wir die Bedingungen in den Fabriken verbessern, sie waren auch nach den sowjetischen Reformen nicht allzu großartig ..."
 SOV_free_the_markets:0 "Befreie die Märkte"
 SOV_free_the_markets_desc:0 "Die überwältigende Kontrolle der Sowjets über die Wirtschaft führte zu unserem Untergang. Wenn wir eine schnell wachsende Wirtschaft wollen, sollten wir uns davon fernhalten."
 SOV_urbanization:0 "Urbanisierungsbemühungen"
 SOV_urbanization_desc:0 "Unser Land ist äußerst ländlich geprägt. Wenn wir unsere Menschen dazu ermutigen, in die Städte zu ziehen, kann dies dazu führen, dass unsere Wirtschaft im Zuge der Konsolidierung wächst."
