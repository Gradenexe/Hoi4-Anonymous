l_german:
 soviet_republic_generic_focus:0 "Sowjetrepublik"
 soviet_republic_generic_focus_desc:0 "Ein einheitlicher sozialistischer Schwerpunktbaum, der sich der Modernisierung, Industrialisierung und militärischen Koordinierung einer Sowjetrepublik innerhalb der UdSSR widmet."
 SOVREP_seek_support_of_soviets:0 "Suchen Sie die Unterstützung der Sowjets"
 SOVREP_seek_support_of_soviets_desc:0 "Obwohl die Rote Armee [Root.GetNameDef] verwüstet und unsere Nation in eine neue Ära des russischen Imperialismus geführt hat, haben wir ohne ihre Hilfe keine Chance, den Sozialismus nach [Root.GetNameDef] zu bringen."
 SOVREP_army_return_prep_idea:0 "Ausbildung der Befreiungsarmee"
 SOVREP_army_return_prep_idea_desc:0 "Unsere verbannten Divisionen wurden in Offensiv- und Speerspitzentaktiken geschult, die speziell für die Rückeroberung unseres Heimatlandes entwickelt wurden."
 SOVREP_technology_sharing:0 "Technologieaustausch"
 SOVREP_technology_sharing_desc:0 "Wir produzieren bereits viele Geräte unserer Partner, aber vielleicht können wir durch die Untersuchung ihrer Designs die nativen [Root.GetNonIdeologyAdjective]-Designs erheblich verbessern."
 SOVREP_prepare_our_land_to_return:0 "Bereiten Sie das Land auf die Rückkehr vor"
 SOVREP_prepare_our_land_to_return_desc:0 "Koordinierte Sabotage feindlicher Versorgungslinien, Schienennetze und Flugplätze in unserer Republik leiten."
 SOVREP_eastwall:0 "Ostwall"
 SOVREP_eastwall_desc:0 "Die Deutschen erwarten einen Angriff aus dem Osten genauso wie wir, und die deutschen Beamten wären gut beraten, unsere Grenze ebenso energisch zu befestigen wie ihre eigene."
 SOVREP_resistance_industries:0 "Untergrundindustrie"
 SOVREP_resistance_industries_desc:0 "Unterstützung geheimer Werkstätten und Versorgungsnetzwerke in unseren besetzten Kerngebieten."
 SOVREP_third_hit:0 "Der dritte Schlag"
 SOVREP_third_hit_desc:0 "Befreiung unserer wichtigsten industriellen Kerngebiete und Befreiung von Millionen unserer Bürger."
 SOVREP_everyone_will_fight:0 "Jeder wird kämpfen"
 SOVREP_everyone_will_fight_desc:0 "Mobilisierung aller Flüchtlinge, Auswanderer und Unterstützer im Ausland, Waffen zu ergreifen oder Unterstützungsaufgaben zu übernehmen."
 SOVREP_end_bourgeouis_dictatorships:0 "Vereinigung mit der Moldauischen SSR"
 SOVREP_end_bourgeouis_dictatorships_desc:0 "Unsere Republik wird von sogenannten „neutralen“ Diktatoren dominiert. Mit der Unterstützung des Militärs und ohne Zustimmung ihres Volkes wird das Proletariat der Republikaner von der kapitalistischen Diktatur unterdrückt. Nur durch die Hände freigelassener [Root.GetAdjective]-Arbeiter können diese durch ungerechte Grenzen getrennt gehaltenen Arbeiter an unserer glorreichen Befreiung teilhaben!"
 SOVREP_final_blow:0 "Der letzte Schlag"
 SOVREP_final_blow_desc:0 "Wir starten die ultimative, entscheidende Offensive, um die Besatzer vollständig aus jedem Zentimeter unseres Landes zu vertreiben."
 SOVREP_allied_shipments:0 "Erhöhen Sie die Lieferungen der Verbündeten"
 SOVREP_allied_shipments_desc:0 "Seit 1918 ist die [Root.GetNonIdeologyAdjective]-Armee mit Lieferungen aus Großbritannien ausgerüstet, und wir sollten uns bemühen, den Alliierten klarzumachen, dass [Root.GetNonIdeologyName] möglicherweise einer anderen sowjetischen Marionettenregierung unterworfen werden könnte, wenn die Lieferungen nicht drastisch erhöht werden."
 SOVREP_forment_disloyalty:0 "Vereint die Opposition"
 SOVREP_forment_disloyalty_desc:0 "Es gibt viele Bewegungen sowohl innerhalb als auch außerhalb der [Root.GetAdjective]-Regierung, und wenn wir die derzeitige Tyrannei, die [Root.GetNameDef] plagt, stürzen wollen, müssen wir die einigende Stimme der Opposition gegen [Root.GetNeutralParty] werden!"
 SOVREP_united_with_westukrblr:0 "Vereint euch mit unserem Volk in Ostpolen"
 SOVREP_united_with_westukrblr_desc:0 "Unsere Brüder im Westen haben lange genug unter ausländischer Besatzung gelitten. Es ist unsere Pflicht, sie einzubeziehen und alle unsere historischen Länder unter einem sozialistischen Banner zu vereinen."
 SOVREP_arm_baltic_reds:0 "Bewaffnen Sie die republikanischen Roten"
 SOVREP_arm_baltic_reds_desc:0 "Die Bühne ist bereitet, der kommunistische Eifer brennt überall in unserer Republik. Alles, was die Roten jetzt brauchen, ist das Signal und die Ressourcen von uns, und wir werden die republikanische Revolution entfachen!"
 SOVREP_combined_civilian_agency_resistance:0 "Kombinierte Widerstandskoordination"
 SOVREP_combined_civilian_agency_resistance_desc:0 "Vereinheitlichung unserer Geheimdienstoperationen mit inländischen Partisanennetzwerken, um die Sabotageeffizienz zu maximieren."
 SOVREP_request_german_support:0 "Fordern Sie den [GetBalticAxisInvesmentsAdj]-Support an"
 SOVREP_request_german_support_desc:0 "[GetRequestGermanSupportDesc]"
 SOVREP_exploit_connections_spirit:0 "Diplomatische Handelskanäle"
 SOVREP_exploit_connections_spirit_desc:0 "Die Nutzung diplomatischer Verbindungen hilft uns, Handelsabkommen und Ressourcen aus den Gastländern zu sichern."
 SOVREP_expand_operations:0 "Erweitern Sie „Operationen“."
 SOVREP_expand_operations_desc:0 "Ausbau unseres Spionagenetzwerks, um Informationen über Besatzerbewegungen und Vermögenswerte zu sammeln."
 SOVREP_natural_resources:0 "Natürliche Ressourcen entwickeln"
 SOVREP_natural_resources_desc:0 "[Root.GetNaturaResource_BAL] hat unser Land durch den Handel mit den Sowjets, den Alliierten und unseren republikanischen Landsleuten gleichermaßen reich gemacht, und wir täten gut daran, mehr in diese Branche zu investieren, indem wir landesweit in [Root.GetExtraction_BAL] investieren!"
 SOVREP_our_help_in_the_war_idea:0 "Geschätzter alliierter Partner"
 SOVREP_our_help_in_the_war_idea_desc:0 "Unsere aktiven Beiträge im Geheimdienstbereich und bei den Freiwilligen haben uns großen Respekt bei unseren Verbündeten eingebracht."
 SOVREP_second_hit:0 "Der zweite Schlag"
 SOVREP_second_hit_desc:0 "Dringen Sie tiefer in die zentralen Regionen vor und durchbrechen Sie die Verteidigungslinien des Feindes."
 SOVREP_aces_in_exile:0 "Asse im Exil"
 SOVREP_aces_in_exile_desc:0 "Unsere Piloten werden an der Seite unserer Verbündeten kämpfen und unschätzbare Kampferfahrung sammeln, um unsere zukünftige Luftwaffe zu leiten."
 SOVREP_soviet_volunteer_forces:0 "Sowjetische Freiwilligentruppen"
 SOVREP_soviet_volunteer_forces_desc:0 "Die UdSSR ist praktisch überfüllt mit Männern, die bereit sind, für die Weltrevolution zu kämpfen und zu sterben. Obwohl [Root.GetNameDef] nur ein Sprungbrett im Kampf für eine kommunistische Welt ist, mangelt es nicht an mutigen russischen Sozialisten, die bereit sind, für unsere Sache zu sterben."
 SOVREP_exile_politics_spirit:0 "Republikanische Exilregierung"
 SOVREP_exile_politics_spirit_desc:0 "Unsere Exilregierung wahrt die politische Struktur und Legitimität und stärkt so unseren politischen Einfluss und unsere Stabilität."
 SOVREP_allied_aid_spirit:0 "Alliierter Forschungsaustausch"
 SOVREP_allied_aid_spirit_desc:0 "Unsere Gastgeber teilen wissenschaftliche und militärische Forschungsressourcen, um unseren zukünftigen Wiederaufbau zu unterstützen."
 SOVREP_balticwall:0 "Schwarzmeermauer"
 SOVREP_balticwall_desc:0 "Befestigungen im Osten sind wertlos, wenn unsere Feinde stattdessen einen Angriff vom Meer aus durchführen! Wir werden vielleicht nie eine Marine aufbauen, die es mit den Briten, Deutschen oder Sowjets aufnehmen kann, aber wir können tun, was wir können, um sie gegenüber unserer Küstenverteidigung hilflos zu machen."
 SOVREP_british_aircraft:0 "[GetBritAircraftManufTitle]"
 SOVREP_british_aircraft_desc:0 "[GetBritAircraftManufDesc]"
 SOVREP_second_hit_idea:0 "Zweiter Schlagmomentum"
 SOVREP_second_hit_idea_desc:0 "Unsere Durchbrüche in den zentralen Regionen haben den Feind in Unordnung gebracht und unsere Durchbruchs- und Erholungsgeschwindigkeit beschleunigt."
 SOVREP_domestic_motors:0 "Ein inländisches Automobilunternehmen"
 SOVREP_domestic_motors_desc:0 "Ausländische Designs sind in Ordnung, aber wir können uns nicht auf Dauer darauf verlassen. [Root.GetNonIdeologyName] ist eine stolze Nation, und wir müssen der Welt zeigen, dass unsere Designer und Denker genauso gut sind wie die aus dem Westen."
 SOVREP_align_paramilitarists:0 "Richten Sie die Paramilitaristen neu aus"
 SOVREP_align_paramilitarists_desc:0 "Im gesamten [Root.GetNameDef] gibt es viele paramilitärische Gruppen, von denen sich die meisten ausschließlich dem Schutz der Selbstbestimmung von [Root.GetAdjective] widmen. Das ist zwar bewundernswert, aber es wäre vorzuziehen, wenn diese Gruppen uns nicht als [SOV.GetAdjective]-Marionetten sehen würden, sondern als logische Fortsetzung des [Root.GetAdjective]-Staates."
 SOVREP_prepare_our_army_to_return:0 "Bereiten Sie die Armee auf die Rückkehr vor"
 SOVREP_prepare_our_army_to_return_desc:0 "Schulung unserer verbannten Divisionen in spezialisierten Angriffs- und Befreiungstaktiken."
 SOVREP_prepare_our_people_to_return:0 "Bereiten Sie die Menschen auf die Rückkehr vor"
 SOVREP_prepare_our_people_to_return_desc:0 "Verbreitung von Propaganda und Anweisungen zur Vorbereitung der Zivilbevölkerung auf die bevorstehende Befreiung."
 SOVREP_foreign_air_support:0 "Ausländische Luftunterstützung"
 SOVREP_foreign_air_support_desc:0 "Unsere Gastgeber werden bei der Ausbildung unserer Piloten und der Bereitstellung von Flugzeugen für unsere Exil-Luftwaffe behilflich sein."
 SOVREP_soviet_war_economics:0 "Übernehmen Sie die sowjetische Kriegsökonomie"
 SOVREP_soviet_war_economics_desc:0 "Um sicherzustellen, dass unsere Wirtschaft jeder kapitalistischen Aggression standhalten kann, müssen wir unsere Industrieproduktion umstrukturieren. Die Modellierung unserer Wirtschaft nach dem sowjetischen Kommandomodell wird uns auf den unvermeidlichen Kampf vorbereiten."
 SOVREP_ford_motors:0 "[Root.Capital.GetName] Ford Industry"
 SOVREP_ford_motors_desc:0 "Die Ford Motor Company hat hervorragende Arbeit geleistet und den Amerikanern und anderen alliierten Nationen auf der ganzen Welt in Massenproduktion erschwingliche Kraftfahrzeuge zur Verfügung gestellt. Wenn wir in [Root.Capital.GetName] eine Ford-Manufaktur errichten sollten, könnten wir sowohl Fahrzeuge für unsere eigene Armee bereitstellen als auch einen ordentlichen Gewinn mit dem Export dieser Fahrzeuge in den Westen erzielen."
 SOVREP_post_resistance_development:0 "Entwicklung nach dem Widerstand"
 SOVREP_post_resistance_development_desc:0 "Nachdem der Widerstand endlich niedergeschlagen ist, können wir unsere Bemühungen auf die industrielle Entwicklung unserer neu gesicherten Regionen konzentrieren."
 SOVREP_attract_workers_to_capital:0 "Gewinnen Sie Arbeiter für [Root.Capital.GetName]"
 SOVREP_attract_workers_to_capital_desc:0 "Die Arbeiter von [Root.GetNonIdeologyName] sind über das ganze Land verteilt und arbeiten oft im veralteten Agrarsektor. Wenn wir unsere Nation für den Krieg industrialisieren wollen, müssen wir Arbeiter in die Fabriken von [Root.Capital.GetName] locken!"
 SOVREP_request_soviet_support:0 "Fordern Sie sowjetische Unterstützung an"
 SOVREP_request_soviet_support_desc:0 "Mit der Industrialisierung unseres Landes und der etablierten militärischen Zusammenarbeit sind wir bereit, unseren Platz als vollwertiger Partner in der sozialistischen Welt einzunehmen. Lassen Sie uns ein formelles Militärbündnis und einen Fraktionsbeitritt mit der Sowjetunion beantragen."
 SOVREP_soviet_equipment:0 "Sowjetische Ausrüstung"
 SOVREP_soviet_equipment_desc:0 "Wir können nicht hoffen, die Regierung zu stürzen, ohne zuvor Zugang zu den Waffen und Materialien zu erhalten, die zur Bewaffnung unserer Milizen erforderlich sind. Indem wir die Russen um Hilfe bitten, werden wir zusätzliche Waffen erhalten, um unsere Armeen zu unterstützen, sollte die alte Regierung versuchen, die Revolution zu stoppen."
 SOVREP_unchain_education:0 "Entfesseln Sie unsere Bildung"
 SOVREP_unchain_education_desc:0 "Das [Root.GetNonIdeologyAdjective]-Bildungssystem war lange Zeit durch unsere unterschiedlichen Bevölkerungszentren eingeschränkt, aber jetzt, da die Landbevölkerung näher an die Städte zieht, werden wir besser in der Lage sein, die [Root.GetNonIdeologyAdjective]-Jugend effizient auszubilden."
 SOVREP_belarus_ssr:0 "[Root.GetNonIdeologyName]-Belarus SSR"
 SOVREP_belarus_ssr_desc:0 "Das Konzept, Weißrussland und die Republikaner zu vereinen, ist kein Fremdwort. Vor langer Zeit existierte die Litauisch-Weißrussische Sozialistische Sowjetrepublik als harmonische Verschmelzung dieser beiden scheinbar unterschiedlichen Völker. Der Sozialismus kennt keine Grenzen der Kultur und Sprache, und wir sehen kaum einen Grund, warum [Root.GetAdjective] und weißrussische Arbeiter nicht nebeneinander existieren könnten."
 SOVREP_stalins_highway:0 "Stalins Autobahn"
 SOVREP_stalins_highway_desc:0 "Der schnelle Transport von Truppen und Industriegütern ist der Schlüssel zur modernen Kriegsführung. Mit der Unterstützung sowjetischer Ingenieure werden wir im ganzen Land ein modernes Autobahnnetz aufbauen."
 SOVREP_civil_and_military_organization_ukr:0 "Kombinierter Widerstandsrat"
 SOVREP_civil_and_military_organization_ukr_desc:0 "Ein gemeinsamer Geheimdienstrat, der reguläre militärische Mittel mit inländischen Partisanentruppen koordiniert."
 SOVREP_international_recognition:0 "Internationale Anerkennung"
 SOVREP_international_recognition_desc:0 "Sicherstellen, dass die internationale Gemeinschaft unsere Exilregierung als die einzige legitime Regierung unserer Republik anerkennt und so unsere Kriegsunterstützung festigt."
 SOVREP_mobilize_from_liberated_lands:0 "Mobilisieren Sie aus den befreiten Ländern"
 SOVREP_mobilize_from_liberated_lands_desc:0 "Wenn wir Gebiete zurückerobern, können wir die lokale Bevölkerung mobilisieren, sich unseren Kräften anzuschließen, wodurch wir unsere Reihen weiter stärken und unsere Verbindung zu den Menschen, die wir befreien, vertiefen."
 SOVREP_evacuated_industries:0 "Evakuierte Industrien"
 SOVREP_evacuated_industries_desc:0 "Errichtung von Fabriken mit evakuierten republikanischen Arbeitern zur Herstellung von Waffen und Ausrüstung."
 SOVREP_connections_with_industrialists:0 "Industrielle Verbindungen"
 SOVREP_connections_with_industrialists_desc:0 "Zusammenarbeit mit ausländischen Industriellen, um Maschinen, Ressourcen und technisches Fachwissen zu sichern."
 SOVREP_buy_foreign_ships:0 "Kaufen Sie ausländische Schiffe"
 SOVREP_buy_foreign_ships_desc:0 "Erwerb stillgelegter oder geleaster Marinegüter von unseren Verbündeten, um eine Kernbefreiungsflotte zu bilden."
 SOVREP_german_war_economics:0 "Übernehmen Sie die [GetBalticAxisInvesmentsAdj]-Kriegsökonomie"
 SOVREP_german_war_economics_desc:0 "[GetGermanWarEconomicsDesc]"
 SOVREP_secure_military_support:0 "Sichere militärische Unterstützung"
 SOVREP_secure_military_support_desc:0 "Viele im Militär würden versuchen, die Nation von [Root.GetLeader] zu befreien, wir müssen uns nur an sie wenden. Ein General, der nach Ehre und Ansehen strebt, würde sich sicherlich mit dem Versprechen, ein Held des Volkes zu werden, für unsere Sache interessieren."
 SOVREP_focus_on_the_interior:0 "Konzentrieren Sie sich auf den Innenraum"
 SOVREP_focus_on_the_interior_desc:0 "Obwohl viele Arbeiter bestrebt sind, gegen unsere Nachbarn zu marschieren und unsere glorreiche Revolution allen republikanischen Völkern zu bringen, müssen wir uns stattdessen auf das Innere unserer Nation konzentrieren; Stabilisierung des Regimes nach der Revolution."
 SOVREP_even_stronger_resistance:0 "Mobilisieren Sie den Untergrund"
 SOVREP_even_stronger_resistance_desc:0 "Geben Sie den inländischen Partisanennetzwerken das Signal, die Sabotage feindlicher Linien zu verstärken."
 SOVREP_third_hit_idea:0 "Dritter Schlagmomentum"
 SOVREP_third_hit_idea_desc:0 "Während wir unsere industriellen Kerngebiete zurückerobern, werden unsere Verteidigungsplanung und -organisation stark gestärkt."
 SOVREP_soviet_military_staff:0 "Sowjetischer Militärstab"
 SOVREP_soviet_military_staff_desc:0 "Nach der Auflösung der Arbeiterrepublik [Root.GetAdjective] gingen unsere Militärangehörigen größtenteils ins Exil in die UdSSR. Sie müssen nach Hause gebracht werden."
 SOVREP_army_cooperation_idea:0 "Dienstübergreifende Zusammenarbeit"
 SOVREP_army_cooperation_idea_desc:0 "Unsere Heeres-, Marine- und Luftstreitkräfte sind vollständig integriert und koordinieren ihre Planung und operative Durchführung."
 SOVREP_modernize_industry:0 "Modernisieren Sie unsere Branche"
 SOVREP_modernize_industry_desc:0 "Zu lange wurde die Produktion von [Root.GetNonIdeologyName] durch die Landwirtschaft bestimmt, aber nicht mehr. Wir müssen unsere Industrie auf die großen Stadtzentren in jedem Staat konzentrieren, wenn wir [Root.GetNonIdeologyName] in eine moderne Wirtschaft verwandeln wollen."
 SOVREP_baltic_fleet:0 "Die republikanische Flotte"
 SOVREP_baltic_fleet_desc:0 "Auch wenn die [Root.GetNonIdeologyAdjective]-Flotte kaum den Neid der Welt erregt, könnte sie sich mit entsprechender Investition dennoch als in der Lage erweisen, [Root.GetNonIdeologyName] vor jeglichen Invasionsversuchen auf dem Meer zu verteidigen."
 SOVREP_concessions_for_catholics:0 "Zugeständnisse für Katholiken"
 SOVREP_concessions_for_catholics_desc:0 "Ein Großteil der unteren Schichten von [Root.GetNameDef] sind gläubige Katholiken, und in der ersten Arbeiterrepublik wurde die Religionsausübung von der Roten Armee brutal unterdrückt. Dies brachte viele der Armen von [Root.GetNameDef] gegen die Revolution auf. Wenn wir also wirklich die Republik des Volkes sein wollen, müssen wir ihnen unmissverständlich versichern, dass ihr Glaube geschützt wird."
 SOVREP_soviet_tank_licences:0 "Sowjetische Panzerlizenzen"
 SOVREP_soviet_tank_licences_desc:0 "Die Panzertruppen der Roten Armee gehören zu den fortschrittlichsten der Welt. Die Sicherung von Produktionslizenzen für sowjetische Panzerkonstruktionen wird unserer Armee die gepanzerte Faust geben, die sie braucht."
 SOVREP_soviet_investments:0 "Suchen Sie nach sowjetischen Investitionen"
 SOVREP_soviet_investments_desc:0 "Um die Revolution zu schützen und unsere Nation zu industrialisieren, müssen wir auf unsere Genossen in der Sowjetunion schauen. Indem wir unsere Grenzen für sowjetische Investitionen öffnen, werden wir die Zukunft des republikanischen Proletariats sichern."
 SOVREP_revolutionary_cabinet:0 "Ein revolutionäres Kabinett"
 SOVREP_revolutionary_cabinet_desc:0 "Nachdem wir nun an unseren rechtmäßigen Platz als unerschütterliche Wächter der Unterschicht zurückgekehrt sind, können wir erneut ein Ministerkabinett zusammenstellen, das mit der Ideologie unseres neuen Staates übereinstimmt."
 SOVREP_western_wall:0 "Klagemauer"
 SOVREP_western_wall_desc:0 "Wir müssen uns auf den unvermeidlichen Zusammenstoß mit dem Westen vorbereiten. Eine beeindruckende Befestigungslinie entlang unserer Westgrenze wird die Sicherheit unserer Republik gewährleisten."
 SOVREP_women_in_air:0 "Frauen in der Luftwaffe"
 SOVREP_women_in_air_desc:0 "Jeder Bürger muss seinen Beitrag leisten. Wir werden die Flugausbildung für republikanische Frauen öffnen und so unseren Pilotenpool maximieren."
 SOVREP_school_of_aviation:0 "Republikanische Schule für Luftfahrt"
 SOVREP_school_of_aviation_desc:0 "Während des Unabhängigkeitskrieges kämpften die Briten in unserem Namen um die Kontrolle über Luft und Meer, aber da die Briten der Nazi-Bedrohung weiterhin Zugeständnisse nach Zugeständnissen machen, können wir nicht darauf vertrauen, dass sie uns erneut verteidigen werden. Wir müssen selbst in die Luft gehen!"
 SOVREP_german_tank_licences:0 "[GetBalticAxisInvesmentsAdj]-Panzerlizenzen"
 SOVREP_german_tank_licences_desc:0 "[GetGermanTankLicencesDesc]"
 SOVREP_exile_resistance:0 "Koordinieren Sie den Untergrund"
 SOVREP_exile_resistance_desc:0 "Aufbau von Funkkontakten zu lokalen Widerstandszellen in unseren besetzten Gebieten."
 SOVREP_organize_exiled_army:0 "Organisieren Sie eine Exil-Armee"
 SOVREP_organize_exiled_army_desc:0 "Strukturierung unserer Freiwilligenregimenter in integrierte Divisionen mit geeigneten Kommandostrukturen."
 SOVREP_original_designs:0 "Originelle Designs"
 SOVREP_original_designs_desc:0 "Von der Gründung unserer Nation im Jahr 1918 bis heute hat [Root.GetNonIdeologyName] seine Armeen mit Waffen der Briten ausgestattet, aber nicht mehr. Wir können uns nicht länger auf die Briten verlassen, wir müssen nach vorne schauen und mit der Herstellung von Waffen mit [Root.GetNonIdeologyAdjective]-Herkunft beginnen."
 SOVREP_direct_intervention:0 "Direkte sowjetische Intervention"
 SOVREP_direct_intervention_desc:0 "Wir haben bewiesen, dass wir nicht in der Lage sind, die Regierung allein zurückzugewinnen, und wir müssen unsere Verbündeten in [SOV.GetNameDef] anrufen, um uns in unserem Kampf zu unterstützen."
 SOVREP_axis_investments:0 "Suchen Sie nach [GetBalticAxisInvesmentsAdj] Investments"
 SOVREP_axis_investments_desc:0 "[GetBalticAxisInvesmentsDesc]"
 SOVREP_donbas_coal:0 "Unsere Kohle"
 SOVREP_donbas_coal_desc:0 "Kohle ist der Lebensnerv der Industrie. Durch die Ausweitung unserer Bergbaubetriebe werden wir unsere Fabriken mit Energie versorgen und unsere Militärmaschinerie mit Strom versorgen."
 SOVREP_exile_industries:0 "Exilindustrien"
 SOVREP_exile_industries_desc:0 "Einrichtung von Werkstätten und Koordinationsbüros in den Gastländern, um die Produktion für unser Militär zu verwalten."
 SOVREP_reconquest_spirit:0 "Geist der Befreiung"
 SOVREP_reconquest_spirit_desc:0 "Unser Volk eint ein einziger brennender Wunsch: unser Heimatland zurückzuerobern und den Besatzer zu besiegen."
 SOVREP_soviet_ukraine_industry:0 "Sowjetisch-republikanische Industrie"
 SOVREP_soviet_ukraine_industry_desc:0 "Durch die Integration unserer Industrieplanung mit sowjetischem Fachwissen können wir externe militärische und zivile Fabriken errichten, die vor Frontbombardements sicher sind."
 SOVREP_communist_opposition:0 "Treten Sie der Opposition bei"
 SOVREP_communist_opposition_desc:0 "Die Sowjetunion hat sich als kein Freund von [Root.GetNameDef] und ihrem Volk erwiesen, und wir wären dumm, wenn wir die Schlüssel zu [Root.GetNameDef] den Geiern der Roten Armee überlassen würden, die nichts weiter wollen, als die [Root.GetAdjective] zu plündern. Sie sind nicht vertrauenswürdiger als die Kapitalisten, und wenn die [Root.GetCommunistParty] Erfolg haben wollen, müssen sie es alleine schaffen!"
 SOVREP_new_volonteers_to_fight:0 "Neue Freiwillige zum Kämpfen"
 SOVREP_new_volonteers_to_fight_desc:0 "Unser Anliegen hat viele dazu inspiriert, sich unseren Reihen anzuschließen und unsere Kräfte mit neuen Freiwilligen zu vergrößern, die bereit sind, für unsere Befreiung zu kämpfen."
 SOVREP_exploit_our_connections:0 "Nutzen Sie unsere Verbindungen"
 SOVREP_exploit_our_connections_desc:0 "Nutzung unserer diplomatischen Kontakte, um internationale Handelsabkommen und Materialien für unsere Exilregierung zu sichern."
 SOVREP_arm_the_nation:0 "Bewaffne die Nation"
 SOVREP_arm_the_nation_desc:0 "Überall im [Root.GetNonIdeologyName] gibt es Männer, die bereit sind, sich der drohenden sowjetischen Invasion zu stellen, denen aber die Ausrüstung dafür fehlt. Wir müssen unsere Rüstungsindustrie auf die schnelle Produktion von Infanterieausrüstung vorbereiten."
 SOVREP_influence_neighbours:0 "Beeinflussen Sie die Nachbarn"
 SOVREP_influence_neighbours_desc:0 "Das Konzept eines befreiten Republikaners im Sozialismus ist zwar nicht annähernd so beliebt wie vor den Unabhängigkeitskriegen, aber so alt wie das Konzept der republikanischen Selbstbestimmung selbst. Unser Staat kann ein Vorbild für diejenigen sein, die unter den Unterdrückungsregimen der republikanischen Diktaturen leben, und indem wir ihn als Waffe einsetzen, können wir die Revolution unblutig auf unsere Nachbarn übertragen."
 SOVREP_government_in_exile:0 "Bereiten Sie sich auf das Unvermeidliche vor"
 SOVREP_government_in_exile_desc:0 "Unser Heimatland steht kurz vor dem Untergang, aber unser Geist bleibt ungebrochen. Wir werden unsere Regierung darauf vorbereiten, den Befreiungskampf vom Ausland aus zu koordinieren."
 SOVREP_renew_allied_trade:0 "[GetBalticRenewAlliedTradeTitle]"
 SOVREP_renew_allied_trade_desc:0 "[GetBalticRenewAlliedTradeDesc]"
 SOVREP_british_designers:0 "Laden Sie britische Designer ein"
 SOVREP_british_designers_desc:0 "Wir haben britische Designs gründlich studiert und da sich [Root.Capital.GetName]-Crossley Motors als erfolgreiches Unterfangen erwiesen hat, täten wir gut daran, britische Designer offiziell einzuladen, der [Root.GetNonIdeologyAdjective] Engineering Company beizutreten."
 SOVREP_new_army:0 "Die neue Armee"
 SOVREP_new_army_desc:0 "Wir rüsten unsere Soldaten mit modernen Waffen aus und übernehmen fortschrittliche taktische Doktrinen, um uns auf die Rückkehr vorzubereiten."
 SOVREP_purge_of_our_own:0 "Eine eigene Säuberung"
 SOVREP_purge_of_our_own_desc:0 "Auch wenn wir uns nach besten Kräften bemühen, jeglichen Widerstand zu unterdrücken, gibt es immer noch diejenigen, die sich im Schatten organisieren und gegen das Proletariat verschwören, um in [Root.GetNonIdeologyName] eine kapitalistische Diktatur wiederherzustellen. Wir müssen eine Volkssäuberung durchführen; Ausrottung aller Mitglieder der alten Regierung und aller, die sie unterstützen."
 SOVREP_final_blow_idea:0 "Der ultimative Schlag"
 SOVREP_final_blow_idea_desc:0 "Die letzte Kampagne zur vollständigen Vertreibung des Besatzers gewährt uns massive Angriffs- und Verteidigungskampfboni."
 SOVREP_everyone_will_fight_idea:0 "Mobilisierung im Exil"
 SOVREP_everyone_will_fight_idea_desc:0 "Wir haben jeden fähigen Flüchtling und jeden Freiwilligen mobilisiert, um die Befreiungsbemühungen zu unterstützen."
 SOVREP_air_in_exile:0 "Luftwaffe im Exil"
 SOVREP_air_in_exile_desc:0 "Wir richten unsere eigenen Staffelkommandos unter alliierter operativer Kontrolle ein und stellen so sicher, dass unsere Flugbesatzungen organisiert bleiben."
 SOVREP_sieze_the_means_of_production:0 "Beschlagnahmung der Produktionsmittel"
 SOVREP_sieze_the_means_of_production_desc:0 "Die alte Regierung lud Investoren aus Übersee ein, die Arbeitskraft der [Root.GetAdjective]-Leute auszubeuten. Wir können nicht weiterhin zulassen, dass die Hände des Proletariats ihren ausländischen bürgerlichen Herren dienen, und alle von diesen multinationalen Konzernen errichteten Fabriken müssen in die Obhut von [Root.GetNameDef] genommen werden."
 SOVREP_rebuild_forts:0 "Bauen Sie die [Root.Capital.GetName]-Festungen wieder auf"
 SOVREP_rebuild_forts_desc:0 "Während der Unabhängigkeitskriege war [Root.Capital.GetName] eher eine Festung als eine Stadt. Obwohl die Befestigungsanlagen weitgehend abgebaut und in Vergessenheit geraten sind, müssen sie kriegsbereit wieder aufgebaut und instand gehalten werden."
 SOVREP_united_baltic_ssr:0 "Eine Vereinigte Ostslawische SSR"
 SOVREP_united_baltic_ssr_desc:0 "Ähnlich wie die Litauisch-Weißrussische SSR wäre eine Vereinigte Unsere Republik-Weißrussische SSR eine harmonische Verschmelzung dieser beiden scheinbar unterschiedlichen Völker. Der Sozialismus kennt keine Grenzen der Kultur und Sprache, und wir sehen kaum einen Grund, warum republikanische und weißrussische Arbeiter nicht nebeneinander existieren könnten."
 SOVREP_restore_workers_republic:0 "Stellen Sie die Arbeiterrepublik wieder her"
 SOVREP_restore_workers_republic_desc:0 "Während unseres Unabhängigkeitskampfes unterstützten die Sowjets die Schaffung einer [Root.GetAdjective]-Arbeiterrepublik. Obwohl die Republik gescheitert ist, bleiben ihre Führer sowohl in [Root.GetNameDef] als auch in [SOV.GetNameDef] am Leben, daher bleibt die Hoffnung für die Arbeiterrepublik bestehen!"
 SOVREP_soviet_collectivization:0 "Sowjetische Kollektivierung"
 SOVREP_soviet_collectivization_desc:0 "Um unsere landwirtschaftliche Produktion zu maximieren und die wachsende Industriearbeitsbevölkerung zu ernähren, müssen wir unsere landwirtschaftlichen Betriebe auf das sowjetische Kollektivierungsmodell umstellen."
 SOVREP_people_return_prep_idea:0 "Befreiungspropagandanetzwerke"
 SOVREP_people_return_prep_idea_desc:0 "Durch Untergrundsendungen und Flugblätter wurde die besetzte Bevölkerung auf die Unterstützung der zurückkehrenden Armee vorbereitet."
 SOVREP_army_cooperation:0 "Dienststellenübergreifende Zusammenarbeit"
 SOVREP_army_cooperation_desc:0 "Integration unserer Armee, Marine und Luftwaffe in eine einheitliche Kommandostruktur zur Koordinierung von Operationen."
 SOVREP_help_from_our_allies:0 "Hilfe von unseren Verbündeten"
 SOVREP_help_from_our_allies_desc:0 "Sicherstellung konkreter Leih- und Pachtzusagen und Weitergabe von technischem und wissenschaftlichem Wissen an unsere verbündeten Gastgeber."
 SOVREP_expand_intelligence:0 "Erweitern Sie die Intelligenz"
 SOVREP_expand_intelligence_desc:0 "Wir verbessern unsere Entschlüsselungsfähigkeiten, um feindliche Kommunikation abzufangen und zu knacken."
 SOVREP_to_return_ours:0 "Um zurückzugewinnen, was uns gehört"
 SOVREP_to_return_ours_desc:0 "Erklärung des Beginns der allgemeinen Kampagne zur Befreiung unseres Heimatlandes vom Besatzer."
 SOVREP_autobahn:0 "[Root.GetAdjective] Autobahn"
 SOVREP_autobahn_desc:0 "Es spielt keine Rolle, wie gut industrialisiert [Root.GetNonIdeologyName] ist, wenn seine Infrastruktur nicht einen schnellen und kontinuierlichen Zustrom von Arbeitskräften ermöglicht. Indem wir unseren Infrastruktursektor nach dem Vorbild des Reichssektors gestalten, können wir die Effizienz erreichen, die sie haben."
 SOVREP_donbas_heavy_industry:0 "Unsere Schwerindustrie"
 SOVREP_donbas_heavy_industry_desc:0 "Unsere Region ist reich an Ressourcen und Potenzialen. Durch umfangreiche Investitionen in die Industriekapazität können wir ein starkes Rückgrat für die Wirtschaft unseres Landes sichern."
 SOVREP_rejoin_the_railways:0 "Treten Sie wieder der Eisenbahn bei"
 SOVREP_rejoin_the_railways_desc:0 "Die Russen und Deutschen, die uns besetzten, sahen in uns nichts weiter als ein ländliches Hinterland, aber nicht mehr. [ROOT.GetNonIdeologyName] soll zu seinem maximalen Potenzial industrialisiert werden, beginnend mit einer Modernisierung unserer Eisenbahnen und Infrastruktur."
 SOVREP_foreign_fleet_support:0 "Unterstützung ausländischer Flotten"
 SOVREP_foreign_fleet_support_desc:0 "Wir verhandeln mit alliierten Marinen über die Bereitstellung von Anlegestellen und Schulungen für unsere Matrosen."
 SOVREP_industrialist_connections_ukr:0 "Industrielle Selbsthilfegruppe"
 SOVREP_industrialist_connections_ukr_desc:0 "Unsere Exilregierung arbeitet eng mit ausländischen Herstellern zusammen, um die militärische Versorgung sicherzustellen."
 SOVREP_defence_of_our_nation:0 "Die Verteidigung unserer Nation"
 SOVREP_defence_of_our_nation_desc:0 "Die zivile Industrie ist für unsere Verteidigung von gleicher Bedeutung wie die Rüstungsindustrie. Das stetige Summen der Maschinen wird durch ganz [Root.GetNonIdeologyName] dröhnen, während seine patriotischen Menschen ihre Pflicht erfüllen, unsere Nation zu industrialisieren."
 SOVREP_land_return_prep_idea:0 "Koordinierte Versorgungssabotage"
 SOVREP_land_return_prep_idea_desc:0 "Partisanen haben feindliche Versorgungsknotenpunkte und Eisenbahnkorridore schwer beschädigt und ihre Logistik gestört."
 SOVREP_united_exile_government_idea:0 "Einheitliche Befreiungsfront"
 SOVREP_united_exile_government_idea_desc:0 "Alle unsere militärischen Zweige, Industrieabkommen und inländischen Widerstandszellen wurden zu einer einzigen, hochkoordinierten und mächtigen Befreiungsbewegung zusammengefasst."
 SOVREP_red_army:0 "[Root.GetAdjective] Rote Schützen"
 SOVREP_red_army_desc:0 "Unsere Armee darf nur aus denjenigen bestehen, die bereit sind, den Sozialismus innerhalb von [Root.GetAdjective] zu verteidigen und ihn unter der Bevölkerung der Welt zu verbreiten, und dies kann nur durch die Wiederherstellung der Roten Schützen von [Root.GetAdjective] erreicht werden."
 SOVREP_foreign_army_support:0 "Unterstützung der ausländischen Armee"
 SOVREP_foreign_army_support_desc:0 "Wir werden unsere verstreuten Soldaten und Freiwilligen zu einer kampfbereiten Truppe auf fremdem Boden versammeln."
 SOVREP_squash_resistance:0 "Zerstöre jeden Widerstand"
 SOVREP_squash_resistance_desc:0 "Es gibt immer noch Menschen, die glauben, der Sozialismus sei der Feind der [Root.GetAdjective]-Souveränität, und diese Menschen müssen ausgerottet werden, wenn wir die Revolution vorantreiben wollen."
 SOVREP_crossley_motors:0 "[Root.Capital.GetName]-Crossley Motors"
 SOVREP_crossley_motors_desc:0 "Da in unserem Land inzwischen zahlreiche ausländische Investitionen getätigt werden und die Produktion von Automobilen einigermaßen effizient ist, können wir möglicherweise mit der Crossley Motor Company zusammenarbeiten, um originelle Designs für den Einsatz in der [Root.GetNonIdeologyAdjective]-Armee zu entwickeln!"
 SOVREP_crush_forest_brothers:0 "Zerschmettere den Widerstand"
 SOVREP_crush_forest_brothers_desc:0 "Der Widerstand hat unserer Nation seit unserer Machtübernahme geschadet; Sabotage unserer Industrien und Eisenbahnen und Störung offizieller Regierungsdemonstrationen. Wir müssen uns in die Wälder von [Root.GetNonIdeologyName] wagen und diese fehlgeleiteten Individuen ausrotten."
 SOVREP_aces_in_exile_idea:0 "Republikanische Asse im Exil"
 SOVREP_aces_in_exile_idea_desc:0 "Unsere Piloten haben in alliierten Luftwaffengeschwadern hervorragende Dienste geleistet und unschätzbare taktische Kenntnisse erworben."
 SOVREP_intl_recognition_spirit:0 "Internationale diplomatische Anerkennung"
 SOVREP_intl_recognition_spirit_desc:0 "Die weltweite Anerkennung unserer Legitimität hält unsere Kriegsbemühungen am Leben und gibt uns starke politische Unterstützung."
 SOVREP_overthrow_the_government:0 "[Root.GetNeutralParty] stürzen"
 SOVREP_overthrow_the_government_desc:0 "Wir haben genug Unterstützung gesammelt, um das [Root.GetLeader]- und [Root.GetLeader.GetHerHis]-Regime zu stürzen! Alles, was wir tun müssen, ist in die Hauptstadt zu marschieren und eine neue Arbeiterrepublik auszurufen!"
 SOVREP_focus_on_the_interior_2:0 "Bereiten Sie sich auf die Deutschen vor"
 SOVREP_focus_on_the_interior_2_desc:0 "Es ist wichtig, dass wir die absolute Brutalität nicht vergessen, die das Freikorps vor so vielen Jahren dem [Root.GetNameDef] zugefügt hat. Bauern und Arbeiter wurden wie Tiere abgeschlachtet, ganze Dörfer in Schutt und Asche gelegt und wir können nicht zulassen, dass das [Root.GetAdjective]-Volk jemals wieder eine solche Brutalität ertragen muss."
 SOVREP_first_hit:0 "Der erste Schlag"
 SOVREP_first_hit_desc:0 "Wir starten die erste Offensive, um unsere ersten großen Regionen zu sichern und einen Brückenkopf zu errichten."
 SOVREP_arms_industry:0 "Vervollständige die Bewaffnung"
 SOVREP_arms_industry_desc:0 "Nachdem die Modernisierung unserer Industrie nun abgeschlossen ist und in unserem Land unzählige inländische militärisch-industrielle Organisationen tätig sind, kann die [Root.GetAdjective]-Rüstungsindustrie endlich ihr wahres Potenzial ausschöpfen!"
 SOVREP_even_stronger_resistance_idea:0 "Mobilisiertes Partisanennetzwerk"
 SOVREP_even_stronger_resistance_idea_desc:0 "Partisanennetzwerke im gesamten besetzten Heimatland haben die aktive Sabotage und Informationsbeschaffung ausgeweitet."
 SOVREP_trade_with_neighbors:0 "Handel mit den Nachbarn"
 SOVREP_trade_with_neighbors_desc:0 "Jedes Mal, wenn wir Handel in die Deutschen oder Sowjets investieren, tragen wir zu unserem eigenen Untergang bei. Wir können nicht zulassen, dass feindliche Truppen mit litauischem Getreide in ihren Rationen und estnischem Öl in ihren aus lettischem Stahl hergestellten Panzern in [Root.GetNonIdeologyName] einmarschieren. Stattdessen müssen wir uns gegenseitig helfen, unseren gemeinsamen Feind zu besiegen."
 SOVREP_invest_in_baltic_trade:0 "Investieren Sie in den republikanischen Handel"
 SOVREP_invest_in_baltic_trade_desc:0 "Das Schwarze Meer ist reich an Handelsgütern aus Skandinavien, Deutschland und Russland, und unsere Häfen können sie kaum alle aufnehmen. Wir müssen neue Handelslinien mit unseren Freunden eröffnen, die dieses Meer mit uns teilen, für ein helleres und wohlhabenderes [Root.GetNonIdeologyName]!"
 SOVREP_first_hit_idea:0 "Erstschlag-Momentum"
 SOVREP_first_hit_idea_desc:0 "Die Dynamik unserer ersten Brückenkopfoffensive steigert unsere Geschwindigkeit und Offensivfähigkeiten im Kerngebiet."
 SOVREP_combine_all_our_forces:0 "Alle Kräfte vereinen"
 SOVREP_combine_all_our_forces_desc:0 "Zusammenführung aller unserer Verbannungskräfte – Armee, Luftwaffe, Marine, Industrie und Untergrundnetzwerke – zu einer einzigen, einheitlichen Befreiungsfront."
 SOVREP_german_baltic_industry:0 "Achsenrepublikanische Industrie"
 SOVREP_german_baltic_industry_desc:0 "[GetGermanBalticIndustryDesc]"
 SOVREP_our_help_in_the_war:0 "Alliierter Beitrag"
 SOVREP_our_help_in_the_war_desc:0 "Wir bieten unsere spezialisierten Geheimdienst- und Freiwilligeneinheiten an, um alliierte Operationen zu leiten und so unseren Wert unter Beweis zu stellen."
 SOVREP_exile_politics:0 "Exilpolitik"
 SOVREP_exile_politics_desc:0 "Konsolidierung unserer diplomatischen Vertretung im Ausland, um sicherzustellen, dass unsere Stimme in alliierten Kriegsräten gehört wird und eine stabile Quelle politischer Legitimität entsteht."
