  KOR_democratic_shi_lanse: "Demokratie:\nDie unendliche Blüte des Blaus"
  KOR_neutrality_shi_lanse: "Neutralität:\nLeuchtturm der Volksführung"
  KOR_fascism_shi_lanse: "Faschismus:\nShadow of Restoration"
  KOR_junshi_shrtycu: "Militarismus:\nAuflösung und Neuorganisation"
  KOR_gongye_shrtycu: "Industrialisierung:\nLiquidierung des kolonialen Erbes"
###################################################################################################################################################################################################################################      Korean Governor-General's Office      #####################################################################################
  #######################################################################################################################################################################
  JKO_kaiju_guoce_jieshao: "Kreuzung der Dreitausend-Li-Flüsse und -Berge"
  JKO_kaiju_guoce_jieshao_desc: "Koreas Weg zur Unabhängigkeit steht an einem Scheideweg. Sollten wir auf der internationalen Bühne geschickt agieren, uns um die Unterstützung und Anerkennung der Großmächte bemühen und als rechtmäßig wiederhergestellte Nation in unser Heimatland zurückkehren? Oder sollten wir uns in unser Heimatland zurückschleichen, die Menschen im Herzen des feindlichen Territoriums organisieren und ein Präriefeuer eines bewaffneten Aufstands entfachen? Ein Weg setzt Hoffnung in die internationale Diplomatie; der andere verlässt sich auf unsere eigene Stärke. Diese Entscheidung wird für Korea zwei völlig unterschiedliche Schicksale bestimmen."
  ##Submission
  JKO_fucong_riben_one: "Der Weg der imperialen Nation"
  JKO_fucong_riben_one_desc: "Das Rad der Zeit rollt vorwärts; Die Schwachen werden entweder zerquetscht oder suchen Schutz vor Riesen. Anstatt passiv und schweigend die Herrschaft zu akzeptieren, sollten wir die Initiative ergreifen, uns dem Strom der neuen Ordnung anschließen und einen unersetzlichen Platz für uns im Territorium des Imperiums finden."
  JKO_lalong_sanjing_caifa: "Gewinnen Sie die Mitsui Zaibatsu"
  JKO_lalong_sanjing_caifa_desc: "Mitsui Zaibatsu entstand in der Edo-Zeit und ist heute eines der größten Industrieunternehmen des Imperiums. Wir müssen seine Unterstützung gewinnen, um seine Rolle beim nationalen Aufbau zu maximieren."
  JKO_lalong_sanling_caifa: "Gewinnen Sie den Mitsubishi Zaibatsu"
  JKO_lalong_sanling_caifa_desc: "Mitsubishi war in der Meiji-Ära zunächst eine Reederei und dominiert heute die Militärindustrie des Imperiums. Wir müssen seine Unterstützung für das nationale Regime sicherstellen und seine Möglichkeiten voll ausschöpfen."
  JKO_lalong_zhuyou_caifa: "Gewinnen Sie den Sumitomo Zaibatsu"
  JKO_lalong_zhuyou_caifa_desc: "Das Sumitomo Zaibatsu begann als Buchhandlung in Kyoto und wurde später für die Kupferraffinierung berühmt. Heute nimmt es eine Schlüsselposition im Bergbau und im Bankwesen ein. Wir müssen ihr Vermögen sinnvoll nutzen."
  JKO_lalong_antian_caifa: "Gewinnen Sie den Yasuda Zaibatsu"
  JKO_lalong_antian_caifa_desc: "Das in der Meiji-Ära gegründete Unternehmen Yasuda Zaibatsu konzentriert sich seit langem auf das Bankwesen und dringt nun tief in das Finanzsystem des Imperiums ein. Wir müssen seine Unterstützung gewinnen, um seinen enormen Reichtum vollständig zu mobilisieren."
  JKO_fucong_faxxing_zhanjuan: "Kriegsanleihen ausgeben"
  JKO_fucong_faxxing_zhanjuan_desc: "Geben Sie im Namen des „Patriotismus“ öffentliche Anleihen des „Heiligen Krieges“ aus, um privates Kapital zu bündeln und zur großen Sache und Kriegsmaschinerie des Imperiums beizutragen. Alle Staatsangehörigen sind verpflichtet, diese zu erwerben."
  JKO_fucong_zongdu_jianghua: "Anweisung des Generalgouverneurs"
  JKO_fucong_zongdu_jianghua_desc: "Der neue Generalgouverneur wird eine öffentliche Ansprache an die gesamte Halbinsel halten, in der er die jüngste Politik Tokios erläutert, die Zukunft von „Naeseon Ilche“ hervorhebt und den unbestreitbaren Ton für alle nachfolgenden Reformen vorgibt."
  nancilang_shangtai_flag: "Der neue Generalgouverneur ist angekommen"
  JKO_qingqiu_junbei_xiandaihua: "Fordern Sie eine militärische Modernisierung"
  JKO_qingqiu_junbei_xiandaihua_desc: "Unsere Streitkräfte stecken noch in den Kinderschuhen. Um dem Imperium besser zu dienen, werden wir Tokio um veraltete Waffenpläne und fortschrittliche militärische Ideen des Imperiums bitten und damit den ersten Schritt zur militärischen Modernisierung machen."
  JKO_yaoqing_rriben_kaituotuan: "Laden Sie das japanische Pionierkorps ein"
  JKO_yaoqing_rriben_kaituotuan_desc: "Auf der koreanischen Halbinsel gibt es überschüssiges Land, aber zu wenig Bevölkerung, und riesige Gebiete müssen noch erschlossen werden. Wir sollten Einwanderer ordnungsgemäß umsiedeln, die Bildung neuer Siedlungen vor Ort erleichtern und die Wirtschaft weiterentwickeln."
  JKO_yaoqing_maoyidaibiao_tuan: "Handelsdelegation"
  JKO_yaoqing_maoyidaibiao_tuan_desc: "Das Festland des Imperiums ist der Halbinsel in Wissenschaft und Technologie in anderen industriellen und technologischen Bereichen weit voraus. Wir sollten eine Delegation entsenden, um Technologien auszutauschen und zu erlernen, die dann zur Verbesserung der Produktion des Büros des Generalgouverneurs eingesetzt werden."
  JKO_guli_riben_touzi: "Ermutigen Sie japanische Investitionen"
  JKO_guli_riben_touzi_desc: "Die Entwicklung und der Wohlstand der Halbinsel können nicht von der Hilfe des Imperiums getrennt werden, und eine ganze Reihe kaiserlicher Unternehmen sind bereit, auf der Halbinsel zu investieren."
  JKO_fazhan_dui_riben_maoyilianxi: "Entwickeln Sie Handelsbeziehungen mit Japan"
  JKO_fazhan_dui_riben_maoyilianxi_desc: "Das Festland des Imperiums drückt den Wunsch nach Materialien und Ressourcen aus und die Halbinsel verfügt über reichlich Handelsgüter. Wir sollten den Handel über die Meerengen hinweg fördern, um gegenseitigen Nutzen und Win-Win-Ergebnisse zu erzielen."
  JKO_yanjiu_hezuo: "Studiengenossenschaften"
  JKO_yanjiu_hezuo_desc: "Genossenschaften sind landwirtschaftliche Genossenschaftsorganisationen, die in Japan und Mandschukuo tätig sind. Wir sollten die Gründe für ihren Erfolg bei der Anwendung in anderen Kontexten untersuchen."
  JKO_laodong_fengshi_dui: "Arbeitsdienstkorps"
  JKO_laodong_fengshi_dui_desc: "Im Namen des „fleißigen Dienstes“ eine große Anzahl junger Arbeiter zwangsweise rekrutieren und sie in Militärprojekten, Minen und Fabriken einsetzen. Ihr Blut und Schweiß werden zu einem unverzichtbaren Treibstoff für die Kriegsmaschinerie des Imperiums."
  JKO_jiti_nongchang: "Kollektivwirtschaften"
  JKO_jiti_nongchang_desc: "Einzelbetriebe in Familienbesitz sind rückständig und ineffizient in der Produktion. Nur durch die Konzentration ländlicher Arbeitskräfte für kollektive Arbeit kann eine effizientere Entwicklung erreicht werden."
  JKO_jiaoyi_weijin_shangpin: "Handel mit Schmuggelware"
  JKO_jiaoyi_weijin_shangpin_desc: "Obwohl der illegale Handel nicht die Haupteinnahmequelle des Büros des Generalgouverneurs ist, bringt er enorme Gewinne. Es wäre töricht, es vorschnell zu schließen, aber wenn man es unkontrolliert laufen lässt, könnte das schwerwiegende Folgen sowohl für die Halbinsel als auch für das Festland des Imperiums haben."
  JKO_kuoda_nongye_chukou: "Steigern Sie die Agrarexporte"
  JKO_kuoda_nongye_chukou_desc: "Seit der Übernahme des koreanischen Territoriums diente dieses Land als Kornkammer des Festlandes des Imperiums. Wir sollten die Getreideproduktion kräftig ausbauen, um das gesamte Imperium mit Nahrungsmitteln zu versorgen."
  JKO_kuojian_chaoxian_qinggongyei: "Erweitern Sie die koreanische Leichtindustrie"
  JKO_kuojian_chaoxian_qinggongyei_desc: "Unruhen auf der Halbinsel sind eine erwiesene Tatsache, daher dürfen wir nicht zulassen, dass die Verzögerung in der Entwicklung der Leichtindustrie zu einem Mangel an Gütern des täglichen Bedarfs für die Menschen führt."
  JKO_kuojian_chaoxian_zhonggongye: "Ausbau der koreanischen Schwerindustrie"
  JKO_kuojian_chaoxian_zhonggongye_desc: "Die rasche Industrialisierung ist der Schlüssel zur Sicherung der Zukunftsfähigkeit der Halbinsel. Durch die Entwicklung eines starken Schwerindustriesektors werden wir den Grundstein für militärische Stärke und wirtschaftliche Unabhängigkeit legen."
  JKO_manxian_yiti_tieluwang: "Eisenbahnintegration Mandschurei-Korea"
  JKO_manxian_yiti_tieluwang_desc: "Öffnen Sie die Hauptschlagader von Wirtschaft und Militär. Integrieren Sie das Eisenbahnnetz der Halbinsel vollständig in die „Südmandschurei-Eisenbahn“, um eine nahtlose Verbindung für den Ressourcentransport und die Truppenmobilisierung des Imperiums auf dem Festland bereitzustellen."
  JKO_chaoxian_beifang_zhonggogye: "Nördlicher Schwerindustriegürtel"
  JKO_chaoxian_beifang_zhonggogye_desc: "Der nördliche Teil der Halbinsel ist reich an Ressourcen. Durch den Bau der nördlichen Region können wir schnell Materialien sammeln, die für die Herstellung von Geräten benötigt werden, und das vorhandene Fachwissen in diesem Bereich voll ausnutzen."
  JKO_chaoxian_nanfang_chuanwu: "Industriebau im Südhafen"
  JKO_chaoxian_nanfang_chuanwu_desc: "Durch den Bau südlicher Hafenhäfen können wir die altehrwürdigen hervorragenden Häfen hier nutzen, um diesen Ort in eine Versorgungsbasis für die kaiserliche Marine umzuwandeln und den Export verschiedener Materialien auf das Festland des Imperiums vorzubereiten."
  JKO_shuili_fadian_daba: "Wasserkraftdamm"
  JKO_shuili_fadian_daba_desc: "Ohne Intervention wird Koreas Industrialisierungs- und Elektrifizierungsprozess zum Stillstand kommen. Wir sollten in diesem Gebiet neue Gewichtsstaudämme bauen, und Ingenieure der Han River Hydropower Company haben einen detaillierten Plan für das Projekt mit dem Namen Hwacheon Dam ausgearbeitet."
  JKO_beifang_kuangshan_zengcan: "Steigern Sie die Produktion in den nördlichen Minen"
  JKO_beifang_kuangshan_zengcan_desc: "Die koreanische Halbinsel verfügt seit langem über reiche Eisenerzvorkommen. Besonders die Vorkommen im Norden scheinen besonders reichlich vorhanden zu sein. Wir sollten über weitere Investitionen nachdenken, um sie vollständig zu entwickeln."
  JKO_kaicai_meikuang: "Untersuchung der Kohlebergwerke auf der koreanischen Halbinsel"
  JKO_kaicai_meikuang_desc: "Kohle treibt unsere Fabriken, Züge und Öfen an. Um das Land mit Energie zu versorgen und die Wirtschaftskraft zu stärken, müssen wir neue Kohleproduktionsgebiete untersuchen."
  JKO_xingnan_huaxue_gongye: "Chemischer Industriekomplex Hungnam"
  JKO_xingnan_huaxue_gongye_desc: "Wir beherrschen nun die Kohleverflüssigungstechnologie und es ist an der Zeit, eine Versuchsfabrik für die Probeproduktion zu bauen."
  JKO_lalong_qinri_pai: "Gewinnen Sie pro-japanische Fraktionen"
  JKO_lalong_qinri_pai_desc: "Für die Stabilität der Regierungsführung müssen wir aktive Mitarbeiter in das System einbinden. Wir werden den „Zentralrat“ gründen und ihnen Ehren und nominelle Macht verleihen, um sie zu unseren treuesten Lakaien zu machen."
  JKO_diyici_jiaoyu_ling: "Überarbeitung des „koreanischen Bildungsdekrets“"
  JKO_diyici_jiaoyu_ling_desc: "Bildung ist der Schmelztiegel für die Transformation von Gedanken. Das neue Bildungsdekret wird Japanisch als „Landessprache“ festlegen, die koreanische Geschichte herunterspielen und alle Kurse werden als oberstes Ziel darauf abzielen, loyale „kaiserliche Untertanen“ zu fördern."
  JKO_guoyu_changyong_yundong: "Bewegung zur Popularisierung der Nationalsprache"
  JKO_guoyu_changyong_yundong_desc: "Fördern Sie Japanisch in allen Bereichen des gesellschaftlichen Lebens. Machen Sie durch die Einrichtung von Auszeichnungen und Hörsälen zur „Nationalen Sprachfamilie“ den Gebrauch von Japanisch zu einem Ruhm und ersetzen Sie schließlich unsere Muttersprache im täglichen Leben."
  JKO_neixian_yitilun_xuanchuan: "Naeseon-Ilche-Propaganda"
  JKO_neixian_yitilun_xuanchuan_desc: "Machen Sie in Zeitungen, im Radio und in Filmen energisch für die „Theorie der gemeinsamen Abstammung Japans und Koreas“ Werbung und betonen Sie, dass wir das gleiche Blut und Schicksal mit der Yamato-Nation teilen, wodurch nationale Grenzen beseitigt und der Weg für eine vollständige Fusion geebnet werden."
  JKO_chuangshi_gaiming: "Sōshi-kaimei (Richtlinie zur Namensänderung)"
  JKO_chuangshi_gaiming_desc: "Dies ist das ultimative Mittel, um die Verbindung zu Clans und der Geschichte abzuschneiden. Das Dekret wird alle Familien dazu zwingen, traditionelle Nachnamen aufzugeben und „shi-myō“ (Clan- und Vornamen) im japanischen Stil anzunehmen und so zu „neuen Japanern“ ohne Vergangenheit zu werden."
  JKO_chuangshi_gaiming_one_tt: "§YDies ist ein entscheidender Schritt, um die Verbindung zur alten Ära abzubrechen und eine Wiedergeburt anzunehmen...§!"
  JKO_chuangshi_gaiming_tt: "Wenn wir §Y$JKO_guoyu_changyong_yundong$§! und §Y$JKO_neixian_yitilun_xuanchuan$§! vervollständigen, wird die Wahrscheinlichkeit zu: §Y15/40/5§!."
  JKO_tuiguang_huangminhua_yundong: "Kōminka-Bewegung (Imperialisierungsbewegung)"
  JKO_tuiguang_huangminhua_yundong_desc: "Treiben Sie alle Assimilationspolitiken auf den Höhepunkt. Hierbei handelt es sich um ein systematisches Projekt, das darauf abzielt, alle Koreaner hinsichtlich Geist, Kultur und Lebensgewohnheiten vollständig in loyale „kaiserliche Untertanen“ des Kaisers zu verwandeln."
  JKO_tuiguang_huangminhua_yundong_tt: "Wenn wir §Y$JKO_diyici_jiaoyu_ling$§! vervollständigen, wird die Wahrscheinlichkeit zu: §Y30/50/15§!.\nWenn wir §Y$JKO_guoyu_changyong_yundong$§! oder §Y$JKO_neixian_yitilun_xuanchuan$§! vervollständigen, wird die Wahrscheinlichkeit zu: §Y40/30/10§!.\nWenn wir fertig sind §Y$JKO_guoyu_changyong_yundong$§! und §Y$JKO_neixian_yitilun_xuanchuan$§! beträgt die Wahrscheinlichkeit: §Y50/20/5§!."
  JKO_chaoxian_bandao_jidu: "Apostolisches Vikariat Seoul"
  JKO_chaoxian_bandao_jidu_desc: "Lu Jinan, der derzeitige Haupthilfsbeamte des Apostolischen Vikariats Seoul, hat Bemerkungen gemacht, in denen er die Befreiung Asiens durch das Imperium voll und ganz unterstützt. Vielleicht ist es an der Zeit, ihm einen Sitz in der Allianz zu geben?"
  JKO_tuixing_guojia_shendao: "Fördern Sie den staatlichen Shintoismus"
  JKO_tuixing_guojia_shendao_desc: "Der Staats-Shintoismus hat im Imperium eine große Rolle gespielt und Millionen von Menschen mobilisiert. Wir sollten auf dem Territorium der Halbinsel diesem Beispiel folgen, auch wenn es am Anfang vielleicht Widerstand gibt."
  JKO_tianzhaodashen_de_fenling: "Göttlicher Geist von Amaterasu Omikami"
  JKO_tianzhaodashen_de_fenling_desc: "Laden Sie den göttlichen Geist von Amaterasu Omikami vom Großen Schrein von Ise ein, den höchsten „auserwählten Schrein“ in Gyeongseong (Seoul) zu errichten. Dies dient dazu, die imperiale Macht durch theokratische Macht zu stärken und die Halbinsel auf der Ebene des Glaubens in das theokratische japanische System einzubinden."
  JKO_huangguo_chenmin_shici: "Kaiserlicher Untertaneneid"
  JKO_huangguo_chenmin_shici_desc: "„Wir sind alle treue und gute Untertanen Seiner Majestät des Kaisers ...“ Bezeichnen Sie diesen Eid als eine tägliche Pflichtlektion und prägen Sie den Begriff der Loyalität durch ständige Wiederholung wie eine Marke in das Bewusstsein aller ein."
  JKO_qianghua_zhongyang_jiquan: "Stärkung der Zentralisierung der Macht"
  JKO_qianghua_zhongyang_jiquan_desc: "Die Streitkräfte der Randalierer der Halbinsel haben die Stabilität der Herrschaft des Imperiums hier ernsthaft geschädigt und dürfen nicht beibehalten werden. Es muss ein zentrales Führungssystem etabliert werden."
  JKO_sheli_chaoxian_shuxuan_yiyuan: "Einrichtung koreanischer ernannter Mitglieder des Landtages"
  JKO_sheli_chaoxian_shuxuan_yiyuan_desc: "Als höchste Belohnung für unsere Treue hat uns Tokio das Privileg gewährt, mehrere nicht stimmberechtigte Landtagsmitglieder für die Teilnahme am Reichstag auszuwählen. Dies wird als unwiderlegbarer Beweis und große Ehre von „Naeseon Ilche“ propagiert."
  JKO_kuoda_jingcha_xitong: "Erweitern Sie das Polizeisystem"
  JKO_kuoda_jingcha_xitong_desc: "Mit der Vertiefung der Assimilationspolitik nimmt auch der unterschwellige Widerstand von Tag zu Tag zu. Wir müssen mehr Polizisten rekrutieren, sie mit besseren Waffen ausstatten und alle instabilen Faktoren in der Wiege ersticken.“"
  JKO_kuoda_jingcha_xitong_tt: "$MODIFIER_REQUIRED_GARRISON_FACTOR$:§R+5,0 %§!\n"
  JKO_linzu_zhidu_lianzuo: "Rinzu-System (Nachbarschaftsvereinigungssystem) mit kollektiver Verantwortung"
  JKO_linzu_zhidu_lianzuo_desc: "Richten Sie ein „Rinzu“-System mit zehn Haushalten als Einheit ein und setzen Sie das Gesetz zur kollektiven Verantwortung um. Nachbarn überwachen und informieren sich gegenseitig und dehnen die Herrschaft des Imperiums bis in die entlegensten Winkel der Gesellschaft aus."
  JKO_chafeng_minzuzhuyi_baokan: "Verbot nationalistischer Zeitungen"
  JKO_chafeng_minzuzhuyi_baokan_desc: "Zeitungen wie die Dong-A Ilbo sind Brutstätten antijapanischer Gedanken. Wir werden sie unter dem Vorwurf der „Störung der öffentlichen Ordnung“ dauerhaft verbieten und ein strenges Pressezensursystem einführen, um die absolute Reinheit der öffentlichen Meinung zu gewährleisten."
  JKO_gaige_difang_xingzheng: "Reform der lokalen Verwaltung"
  JKO_gaige_difang_xingzheng_desc: "Das alte „Do-Bu-Gun“-System (Provinz-Präfektur-Kreis) abschaffen und durch die „To-Do-Fu-Ken“-Struktur (Metropole-Provinz-Präfektur-Kreis) ersetzen, die dem japanischen Festland entspricht. Dabei handelt es sich nicht nur um eine Namensänderung, sondern auch um eine Umverteilung der Macht mit dem Ziel, die lokalen Clankräfte zu zerschlagen."
  JKO_quanguo_tudi_diaocha: "Nationale Landvermessung"
  JKO_quanguo_tudi_diaocha_desc: "Führen Sie im Namen der Einrichtung eines modernen Landbesitzsystems eine gründliche Untersuchung und Registrierung des nationalen Landes durch. Dies wird die genaueste Datenunterstützung für unsere nachfolgenden Steuerreformen und Ressourcenenteignungen liefern."
  JKO_huji_xitong_xiandaihua: "Modernes Haushaltsregistrierungssystem"
  JKO_huji_xitong_xiandaihua_desc: "Führen Sie ein modernes Haushaltsregistrierungssystem ein, das dem japanischen Festland entspricht, um die nationale Bevölkerungs- und Familienstruktur genau zu erfassen. Dies wird unsere spätere Mobilisierung von Arbeitskräften und die soziale Kontrolle erheblich erleichtern."
  JKO_zongdufu_de_juedui_tongzhi: "Absolute Autorität des Büros des Generalgouverneurs"
  JKO_zongdufu_de_juedui_tongzhi_desc: "Erlassen Sie einen Sondererlass, um dem Amt des Generalgouverneurs die höchste Macht zu verleihen, und die erlassenen „Verordnungen“ haben die gleiche Wirkung wie Gesetze. Dies ist der Grundstein für die Einführung einer effizienten zentralen Regelung und die Beseitigung aller Hindernisse."
  JKO_mufan_zongdu_qu: "Eckpfeiler der Co-Prosperity Sphere"
  JKO_mufan_zongdu_qu_desc: "Wir werden kein entbehrliches Grenzland des Imperiums mehr sein, sondern der „Eckstein“, der Japan und das Festland verbindet. Fördern Sie aktiv den strategischen Wert der Halbinsel, um in der neuen Ordnung einen höheren Status und Anerkennung zu erlangen."
  JKO_mufan_zongdu_qu_tt: "§Y[JKO.GetNameDefCap]§! wird nicht mehr in der Lage sein, ihre §YAutonomie§! zu §Yerhöhen§!, und §Y[JAP.GetNameDef]§! wird nicht mehr in der Lage sein, ihre §RAutonomie zu verringern§!"
  JKO_chaoxian_neidi_yanchang_zhuyi: "Naichi Enchō Shugi (Festland-Extensionismus)"
  JKO_chaoxian_neidi_yanchang_zhuyi_desc: "Fordern Sie bei der Regierung von Tokio eine formelle Petition auf, um die Anhebung des rechtlichen Status Koreas von „Gaichi“ (Außenland) zu einer „Erweiterung von Japans Naichi (Festland)“ zu beantragen. Dies ist das ultimative Ziel, sich vom Kolonialstatus zu lösen und sich in Bezug auf die Rechtsprechung in das japanische Festland zu integrieren."
  JKO_riben_guwen_tuan: "Laden Sie japanische Berater ein"
  JKO_riben_guwen_tuan_desc: "Unsere Verwaltungs-, Industrie- und Militärsysteme sind noch unausgereift. Wir werden in aller Bescheidenheit herausragende Berater des Imperiums einladen, uns zu beraten, fortgeschrittene Erfahrungen in kürzester Zeit zu sammeln und unsere Governance-Effizienz zu verbessern."
  JKO_riben_shiguan_xuexxiao: "Army War College"
  JKO_riben_shiguan_xuexxiao_desc: "Wählen Sie die loyalsten und intelligentesten jungen Leute aus und schicken Sie sie zum Studium an die Army War College in Suining. Sie werden zum Rückgrat der künftigen imperialisierten Armee und zum Bindeglied zwischen uns und dem imperialen Militär."
  JKO_kuobian_chaoxian_jun: "Erweitern Sie die koreanische Armee"
  JKO_kuobian_chaoxian_jun_desc: "Seit 1904 existiert die koreanische Armee als Garnisonstruppe in Korea und hat mit Ausnahme der Invasion der Mandschurei im Jahr 1931 nur selten an Kämpfen teilgenommen. Wir sollten die Verträge abschaffen, die das Amt des koreanischen Generalgouverneurs einschränken, und diese Truppe erweitern, um sie zu einer echten Kampftruppe zu machen."
  JKO_bandao_zhengbing_ling: "Wehrpflichtdekret der Halbinsel"
  JKO_bandao_zhengbing_ling_desc: "Nach dem Beweis absoluter Loyalität wird Seine Majestät der Kaiser gnädig die Einführung der „Blutsteuer“ auf der Halbinsel genehmigen. Dadurch wird unser Arbeitskräftepotenzial vollständig freigesetzt und unsere jungen Männer können für den Ruhm des Imperiums kämpfen."
  JKO_bandao_zhengbing_ling_tt: "Aktivieren Sie §Y$extensive_conscription$§!, das bei wirtschaftlicher Machbarkeit in §Y$service_by_requirement$§! geändert wird."
  JKO_weibandao_zhanzheng_zuozhunbei: "Bereiten Sie sich auf den Halbinselkrieg vor"
  JKO_JKO_weibandao_zhanzheng_zuozhunbei_desc: "Wenn der Krieg schlecht verläuft, wird die koreanische Halbinsel wahrscheinlich zur letzten Hochburg des Imperiums auf dem Festland. Wir sollten uns darauf vorbereiten, diese Region im schlimmsten Fall zu verteidigen."
  JKO_guandongjun_de_jingyan: "Erfahrung der Kwantung-Armee"
  JKO_JKO_guandongjun_de_jingyan_desc: "Die Kwantung-Armee ist die Elite der kaiserlichen Armee. Wir werden eine Gruppe von Militäroffizieren entsenden, um ihre Kampferfahrungen in der Mandschurei zu beobachten und zu erlernen, insbesondere in der Anti-Guerilla-Kriegsführung und in schnellen Angriffstaktiken, um die tatsächliche Kampffähigkeit unserer Armee zu verbessern."
  JKO_shiyanxing_tanke_lian: "Panzerdivision"
  JKO_shiyanxing_tanke_lian_desc: "Imperiale Militärtheoretiker diskutieren seit langem über die beste Art und Weise, Panzer einzusetzen, und jetzt scheint es, dass die Kombination von Infanterie und Panzern der beste Ansatz ist. Wir sollten eine Reihe solcher Einheiten organisieren."
  JKO_jiandao_teshe_budui: "Kando-Spezialeinheiten"
  JKO_jiandao_teshe_budui_desc: "Bilden Sie in der Region „Kando“ an der Grenze zur Mandschurei eine Spezialeinheit aus Koreanern, die mit dem Gelände vertraut sind. Sie werden grausame und effiziente Mittel einsetzen, um die antijapanischen Guerillas in diesem Gebiet zu eliminieren und dem Imperium ein Zeichen ihrer Treue zu erweisen."
  JKO_haian_fangwei_budui: "Küstenverteidigungskräfte"
  JKO_haian_fangwei_budui_desc: "Die koreanische Halbinsel ist auf drei Seiten vom Meer umgeben und verfügt über eine lange Küstenlinie. Wir müssen spezialisierte Küstenverteidigungskräfte aufbauen, die für den Bau von Befestigungen, das Legen von Minen und die Abwehr potenzieller Bedrohungen aus dem Meer verantwortlich sind."
  JKO_fendan_jinhai_fanghu: "Teilen Sie die Aufgaben der Offshore-Verteidigung"
  JKO_fendan_jinhai_fanghu_desc: "Die Hauptstreitkräfte der kaiserlichen Marine sind in den Pazifischen Ozean vorgedrungen und haben die Offshore-Verteidigung leer gelassen. Wir werden eine kleine Flotte bestehend aus alten Zerstörern bilden, um uns die Patrouillen- und U-Boot-Abwehraufgaben in wichtigen Wasserstraßen wie der Tsushima-Straße zu teilen."
  JKO_hangkong_zhushi_huishe: "Luftfahrt-Aktiengesellschaft"
  JKO_hangkong_zhushi_huishe_desc: "Die Einführung von Mitsubishi Heavy Industries, Ltd. Aviation wird es der Halbinsel ermöglichen, eine moderne Luftwaffe aufzubauen und den Verteidigungsdruck auf dem Festland des Imperiums zu verringern."
  JKO_shenfeng_jingshen: "Kamikaze-Geist"
  JKO_shenfeng_jingshen_desc: "Als Spezialangriffseinheit hat das Kamikaze Corps Selbstmordattentate aus einer Laune in letzter Minute in eine etablierte Doktrin verwandelt. Mit Hilfe eines neuen Flugzeugs – einer bemannten Rakete – werden solche Angriffe unaufhaltbar sein."
  JKO_gen_riben_yiyi_yusui: "Treue zu Seiner Majestät dem Kaiser"
  JKO_gen_riben_yiyi_yusui_desc: "Der Banzai Charge verkörpert den Kampfgeist von [ROOT.GetAdjective]. Im Rahmen der militärischen Ausbildung muss jeder Soldat mit diesem Schlachtruf vertraut sein und eine Ausbildung in der Taktik des Bajonettangriffs erhalten. Mit dieser Ausbildung werden unsere Soldaten niemals Kriegsgefangene, sondern heldenhaft sterben. Es lebe Seine Majestät der Kaiser!"

  ##Independence
  JKO_duli_chaoxian_one: "Geist der Bewegung des 1. März"
  JKO_duli_chaoxian_one_desc: "26 Jahre Kolonialherrschaft unterdrücken wie eine harte und kalte Kruste alles auf diesem Land. Die Polizei und die Gendarmen des Büros des Generalgouverneurs glauben, alle Flammen des Widerstands gelöscht zu haben, wissen aber nicht, dass das eigentliche Feuer längst unter der Erde verschwunden ist. Wir werden diese sporadischen Funken zu einer unaufhaltsamen Flamme sammeln, die unter der Erde lodert. Es wird Kraft sammeln, die Unterdrückung der alten Ära verbrennen und eine neue Welt einläuten, die den Menschen gehört."
  JKO_duli_chaoxian_one_tt: "Schalten Sie die Entscheidung §Y$KOR_duli_chaoxian_one_decisions$§! frei, Hochburgen für unsere Oppositionsbewegung zu errichten."
  JKO_jianli_minzu_zhisheng: "Stimme der Nation"
  JKO_jianli_minzu_zhisheng_desc: "Um das Volk zu erwecken, bedarf es nicht nur der Wut der Rache, sondern auch eines Plans für ein neues Land. Wir müssen die nachdenklichsten Köpfe vereinen – Lehrer, Schriftsteller und Gelehrte –, damit sie unsere gemeinsame Zukunft mit ihren Federn darstellen können, und wir werden diese Zukunft mit unseren Waffen verteidigen."
	yijianli_genjudi_flag: "Ein Basisgebiet wurde eingerichtet"
  JKO_jianli_dixia_qingbaowang: "Bauen Sie ein unterirdisches Widerstandsnetzwerk auf"
  JKO_jianli_dixia_qingbaowang_desc: "Wenn wir nicht nur den Kolonisatoren, sondern auch der Bedrohung durch die Kwantung-Armee in der Mandschurei entgegentreten wollen, müssen wir über ein Stützpunktgebiet verfügen, das außerhalb ihrer Reichweite liegt. Von dort aus können wir mit der Rettung inhaftierter Kameraden beginnen und Waffen zur Vorbereitung der Revolution beschlagnahmen."
  JKO_dihou_pohuai: "Durchbrechen Sie die Transportlinien"
  JKO_dihou_pohuai_desc: "Wenn wir den Aufstand starten, werden Guerillas hinter den feindlichen Linien die Eisenbahnen der Kolonisatoren sabotieren und so die Offensive des Feindes von innen heraus untergraben. Wir werden diese „Fünften Kolonnen“ auf der gesamten Halbinsel und in der Mandschurei organisieren, um in unserem Nationalen Befreiungskrieg einen entscheidenden Vorteil zu erlangen."
  JKO_dihou_pohuai_tt: "Wird während des Aufstands die Transportlinien des Feindes auf der koreanischen Halbinsel abschneiden.\n\nZu Beginn des Bürgerkriegs erhalten Sie §Y2§! aus Milizionären bestehende Eisenbahndivisionen"
  JKO_liangge_tongshiwancheng_tt: "Wenn wir §Y$JKO_baitoushan_de_shiyue$§! und §Y$JKO_dihou_pohuai$§! abschließen, werden die antijapanischen Alliierten nach dem Unabhängigkeitskrieg einen Aufstand in §Y[MAN.GetNameDefCap]§! starten, um uns zu unterstützen und alle Eisenbahntransportmöglichkeiten in der Region §Y[MAN.GetNameDefCap]§! abzuschneiden."
  JKO_lalong_riji_chaoxianren: "Gewinnen Sie koreanische Soldaten in der japanischen Armee"
  JKO_lalong_riji_chaoxianren_desc: "Wir werden heimlich mit den koreanischen Soldaten der Marionettenarmee Kontakt aufnehmen, um ihre Nationalgefühle zu wecken. Wenn der Aufstand ausbricht, werden sie das schärfste Messer sein, das dem Feind ins Herz sticht."
  JKO_lalong_riji_chaoxianren_tt: "Gewinnen Sie §Y4§! Veteranen-Infanteriedivisionen zu Beginn des Bürgerkriegs.\n\n§Y5§! §YGeneräle der Koreanisch-Japanischen Armee§! werden uns Treue schwören."
  JKO_lianluo_haiwai_zhengfu: "Kontaktieren Sie die inländischen Widerstandskräfte."
  JKO_lianluo_haiwai_zhengfu_desc: "Unter der eisernen Herrschaft des Feindes ist der Funke des Widerstands in unserem Heimatland nie erloschen. Unzählige Patrioten setzen ihren Kampf tief in den Bergen und Wäldern fort. Wir müssen unsere fähigsten Agenten schicken, um wieder in das Land einzudringen und diese mutigen Widerstandsorganisationen zu kontaktieren. Die Vereinigung ihrer verstreuten Streitkräfte unter einem einzigen Banner wird uns nicht nur wertvolle Informationen liefern, sondern auch die entscheidende Stärke aufbauen, die wir für die letzte Gegenoffensive benötigen."
  JKO_baitoushan_de_shiyue: "Eid des Paektu-Berges"
  JKO_baitoushan_de_shiyue_desc: "Als Zeuge leisten der heilige Nationalberg, die Northeast Volunteer Army und wir einen Blutschwur. Dies ist nicht nur die Geburt einer Zusammenarbeit, sondern auch der Zusammenhalt des nationalen Widerstands gegen die Kolonialisierung und die unnachgiebige Seele. Von diesem Moment an teilen wir das gleiche Schicksal."
  JKO_baitoushan_de_shiyue_tt: "Erhalten Sie zu Beginn des Bürgerkriegs §Y3§! antijapanische Freiwilligendivisionen im Nordosten, bestehend aus §YGebirgsinfanterie§!."
  JKO_yingjiu_duli_yundonngzhe: "Kameraden im Gefängnis"
  JKO_yingjiu_duli_yundonngzhe_desc: "Tief im Seodaemun-Gefängnis sind unsere tapfersten Kameraden eingesperrt. Wir werden eine mutige Operation zum Gefängnisausbruch planen, um diese Rückgrate der Nation aus den Fängen des Feindes zu befreien. Sie sind eine unschätzbare Bereicherung für die Revolution."
  JKO_yingjiu_duli_yundonngzhe_tt: "Erhalten Sie im bevorstehenden Unabhängigkeitskrieg zusätzliche §Y2§! §YKommunistische Miliz§!-Einheiten."
  JKO_yingjiu_duli_yundonngzhe_2: "Nach dem erfolgreichen Sturz des derzeitigen Regimes und der Erlangung der Unabhängigkeit stehen Berater von §Yinländischen Kommunisten§! zur Verfügung."
  JKO_xunqiu_guoji_zhiichi: "Zweiter Geheimer Gesandter von Den Haag"
  JKO_xunqiu_guoji_zhiichi_desc: "Wir werden die gerechte Tat von 1907 wiederholen und erneut geheime Gesandte nach Den Haag schicken, um Japan seiner Verbrechen gegenüber der Welt anzuklagen und uns um Sympathie und Anerkennung seitens der internationalen Gemeinschaft zu bemühen. Dies mag ein vergeblicher Versuch sein, aber selbst wenn die Wahrscheinlichkeit nur bei eins zu zehntausend liegt, sollten wir es versuchen."
  JKO_xunqiu_guoji_zhiichi_tt: "Nachdem wir §Y$VICTORY_POINTS_7125$§!, §Y$VICTORY_POINTS_4056$§!, §Y$VICTORY_POINTS_4052$§! besetzt haben, ist die Möglichkeit von §YFriedensverhandlungen§! mit Japan umso größer, je mehr Länder uns unterstützen."
  JKO_ansha_riben_tianhuang: "Operation „Shooting the Sun“."
  JKO_ansha_riben_tianhuang_desc: "Ein verrückter, aber toller Plan. Wir werden unsere besten Agenten entsenden, um die Parade in der Mandschurei zu infiltrieren und das höchste Symbol des Feindes ins Visier zu nehmen – §Y$JAP_hirohito$§!. Wenn die Operation erfolgreich ist, wird das feindliche Land in großes Chaos versinken und wertvolle Zeit für unsere Unabhängigkeit gewinnen."
  JKO_ansha_riben_tianhuang_tt: "§YGeheimdienstoperation freischalten§!:\nAden Kaiser von Japan ermorden\nErfordert §Y40 %§! Geheimdienstnetzwerk in §Y[282.GetName]§!\n\nWenn §Yerfolgreich§!, §YJapan§! wird ein Bürgerkrieg zwischen der Marine und der Armee auslösen, und §YJapan§!s Kolonien werden §Ydie Unabhängigkeit erlangen§!."
  JKO_sanqianlijiangshan_qiyi: "Dreitausend Li Flüsse und Berge, die Wiederherstellung wird mit der Zeit kommen"
  JKO_sanqianlijiangshan_qiyi_desc: "Das Opfer einer Person wird den Zorn von zehn entfachen; Der Aufstand in einer Region wird den Mut der gesamten Halbinsel wecken. Jetzt ist es an der Zeit, diesen einzelnen Funken ein Präriefeuer entfachen zu lassen."
###################################################################################################################################################################################################################################      Korea      #####################################################################################
  #######################################################################################################################################################################
  KOR_volunteers_leave_200: "Trotz der offiziellen Haltung verlassen etwa 200 [ROOT.GetAdjective]-Bürger das Land, um sich den [KOR.GetAdjective]-Streitkräften anzuschließen."
  KOR_dongya_minzu_jiefang_flag: "Der koreanische Unabhängigkeitskrieg dauert an"
  KOR_juejing_zhong_de_minzu: "Eine Nation in verzweifelter Lage"
  KOR_juejing_zhong_de_minzu_desc: "Entweder Unabhängigkeit oder Aussterben. Das Schicksal der gesamten Nation hängt von diesem Krieg ab, der uns einen beispiellosen Kampfgeist verleiht, das Land aber auch an den Rand des Zusammenbruchs bringt."
  KOR_dulizhanzheng_guojizongdui: "Internationale Brigaden"
  KOR_dulizhanzheng_guojizongdui_desc: "Jetzt ist es nicht nur an der Zeit, dass der Völkerbund das Verbot aufhebt, Truppen zur Unterstützung unseres Kampfes zu entsenden, sondern es ist auch an der Zeit, die Mitgliedsstaaten wirklich zu ermutigen, sich gegen die Aggressoren zu erheben!"
  KOR_dulizhanzheng_guojizongdui_tt: "Wir werden alle Mitglieder des Völkerbundes§!.\n\num die Hilfe der Internationalen Brigaden bitten. Sie akzeptieren eher, wenn die Bewertung größer als §Y40§! ist."
  KOR_dulizhanzheng_beishang_gongshi: "Nordoffensive"
  KOR_dulizhanzheng_beishang_gongshi_desc: "Nordkorea ist reich an Bodenschätzen. Wir müssen die Ressourcen des Mutterlandes zurückerobern und die japanischen Kolonisatoren von der Halbinsel vertreiben."
  KOR_dulizhanzheng_nanxia_gongshi: "Südliche Offensive"
  KOR_dulizhanzheng_nanxia_gongshi_desc: "Die koreanische Halbinsel verfügt über raues Gelände und nur Busan im Süden eignet sich für großflächige Landungen. Vertreiben Sie den Feind von Süden her von der Halbinsel, damit die Truppen schnell zurückkehren und den Yalu-Fluss im Norden verteidigen können."
  KOR_dulizhanzheng_jianli_shandi_binggongchang: "Fabriken, Enteignung und Rationierung"
  KOR_dulizhanzheng_jianli_shandi_binggongchang_desc: "Alles für die Front. Die Menschen versorgen uns mit Deckung, Informationen und Vorräten. Die japanische Armee besetzt Städte, wir aber besetzen die Berge und die Herzen der Menschen."
  KOR_dulizhanzheng_beishuiyizhan: "Kämpfe mit dem Rücken zur Wand"
  KOR_dulizhanzheng_beishuiyizhan_desc: "Wir können uns von Rückschlägen nicht in die Falle locken lassen. Als letzten Ausweg können wir uns in die Hauptstadt zurückziehen, um uns auf die Verteidigung vorzubereiten."
  KOR_dulizhanzheng_guojitiaoting: "Internationale Mediation"
  KOR_dulizhanzheng_guojitiaoting_desc: "Der Völkerbund sollte die Unterdrückung des koreanischen Volkes durch den japanischen Faschismus nicht lange ignorieren. Sie müssen Maßnahmen ergreifen und [JAP.GetName] zum Rückzug an die Vorkriegsgrenze zwingen."
  tongyi_zhichi_duli_flag: "Mindestens ein Land erklärte sich bereit, zu vermitteln."
  KOR_goumai_wuzi_zhuangbei: "Kaufen Sie [USA.GetAdjective]-Ausrüstung"
  KOR_goumai_wuzi_zhuangbei_desc: "Unser Militär benötigt dringend Ausrüstung. Um die Größe unserer Armee zu vergrößern, hoffen wir, Ausrüstung zu günstigen Preisen von einer vertrauenswürdigen Großmacht zu kaufen. Durch Verhandlungen sollten wir in der Lage sein, eine Einigung mit [USA.GetAdjective] zu erzielen."
  KOR_chongsheng_zhengtong_diwei: "Bestätigen Sie den legitimen Status"
  KOR_chongsheng_zhengtong_diwei_desc: "Selbst im Exil sind wir die einzige legitime Regierung der Republik Korea. Durch diplomatische Bemühungen und das Völkerrecht werden wir der Welt erneut unseren unerschütterlichen Willen zum Widerstand gegen Aggressionen und das Streben nach Unabhängigkeit erklären und unseren legitimen Status als einziger legitimer Vertreter der Halbinsel bekräftigen. Dies ist für uns die Grundlage, um die Menschen zu vereinen und internationale Unterstützung zu sichern."
  KOR_chongzu_yizheng_yuan: "Umstrukturierung des Legislativrates"
  KOR_chongzu_yizheng_yuan_desc: "Eine Exilregierung braucht ein noch stärkeres demokratisches Fundament. Wir werden den Legislativrat umstrukturieren, seine Repräsentativität erweitern und mehr Patrioten aufnehmen. Es ist nicht nur ein Symbol der Legitimität, sondern auch die höchste Autorität, um die Kräfte aller Seiten zu vereinen und den Entwurf für eine zukünftige unabhängige Nation zu planen."
  KOR_tongyi_duli_zhenxian: "Vereinigte Unabhängigkeitsfront"
  KOR_tongyi_duli_zhenxian_desc: "Vereint alle patriotischen Gruppen im Ausland, überwindet politische Spaltungen und errichtet die breiteste antijapanische Einheitsfront. Konzentrieren Sie Ihre Stärke, schaffen Sie einen Konsens und legen Sie eine solide Grundlage für die nationale Unabhängigkeit."
  KOR_zhihan_guoji_lianmeng: "Appell an den Völkerbund"
  KOR_zhihan_guoji_lianmeng_desc: "Decken Sie die japanischen Gräueltaten vor dem Völkerbund auf und bekräftigen Sie das Recht auf nationale Selbstbestimmung. Streben Sie die Anerkennung der Legitimität der Provisorischen Regierung bei Nationen auf der ganzen Welt an, gewinnen Sie internationale moralische Unterstützung und fördern Sie die Sache der Unabhängigkeit."
  KOR_choubei_dulijijin: "Sammeln Sie Unabhängigkeitsgelder"
  KOR_choubei_dulijijin_desc: "Ohne Finanzierung kann es keine Revolution geben. Mobilisieren Sie Spenden von ausländischen Landsleuten und internationalen Freunden und führen Sie aktiv wirtschaftliche Aktivitäten durch. Jeder Betrag wird für die Aufrechterhaltung der Exilregierung, diplomatische Lobbyarbeit und den bewaffneten Kampf verwendet."
  KOR_peyang_jishu_gugan: "Bilden Sie technische Kader aus"
  KOR_peyang_jishu_gugan_desc: "Eine unabhängige Nation braucht Talente. Schicken Sie junge Studenten in alliierte Länder, um Technologie, Militärwesen und Verwaltung zu studieren. Reservieren Sie Säulen für den Aufbau einer neuen Nation in der Zukunft und stellen Sie die langfristige Entwicklung der Nation sicher."
  KOR_zhengqu_guominzhengfu_zhichi: "Bitten Sie die nationalistische Regierung um Unterstützung"
  KOR_zhengqu_guominzhengfu_zhichi_desc: "Stärken Sie die Beziehungen zur chinesischen nationalistischen Regierung. Suchen Sie nach umfassender Unterstützung in Diplomatie, Finanzen und militärischen Angelegenheiten, insbesondere bei der Bildung und Ausbildung der Befreiungsarmee, um die antijapanische Stärke zu stärken."
  KOR_guangfujun_de_zujian: "Bilden Sie die Befreiungsarmee"
  KOR_guangfujun_de_zujian_desc: "Nationale Unabhängigkeit erfordert bewaffnete Gewalt. Bilden Sie auf der Grundlage bestehender Freiwilligeneinheiten eine disziplinierte und kampfwirksame „Koreanische Befreiungsarmee“ als Hoffnung auf die nationale Befreiung."
  KOR_xiang_huashengdun_paiqian_shijie: "Kontaktieren Sie Washington"
  KOR_xiang_huashengdun_paiqian_shijie_desc: "Entsenden Sie eine Delegation nach Washington, um der US-Regierung unsere Unabhängigkeitsforderungen vorzulegen, um ihre Unterstützung in der Nachkriegsfrage auf der koreanischen Halbinsel zu bitten und um materielle Hilfe zu bitten."
  KOR_mimi_diantai_wangluo: "Alliierte Geheimdienstkooperation"
  KOR_mimi_diantai_wangluo_desc: "Feindliche Bewegungen sind der Schlüssel zum Sieg. Wir werden die in den von Japan besetzten Gebieten gesammelten Informationen freiwillig den alliierten Geheimdiensten zur Verfügung stellen und eine engere Zusammenarbeit anstreben. Durch den Informationsaustausch können wir die japanische Armee effektiver bekämpfen und uns auf die letzte Gegenoffensive vorbereiten."
  KOR_xiang_sulian_paiqian_shituan: "Kontaktieren Sie Moskau"
  KOR_xiang_sulian_paiqian_shituan_desc: "Die sowjetische Militärmacht im Fernen Osten kann nicht ignoriert werden. Wir werden heimlich Gesandte nach Moskau schicken, um Kontakt mit der Sowjetregierung aufzunehmen, um Verständnis und Unterstützung für die koreanische Unabhängigkeitsbewegung zu bitten und eine Zusammenarbeit im Krieg gegen Japan zu sondieren."
  KOR_zhengqu_junshi_guwen: "Fordern Sie Militärhilfe an"
  KOR_zhengqu_junshi_guwen_desc: "Angesichts der Grausamkeit des Krieges ist es schwierig, die japanische Armee allein aus eigener Kraft schnell zu besiegen. Wir werden von der Sowjetunion spezifische militärische Hilfe anfordern, einschließlich Waffen, Militärberater und Ausbildungseinrichtungen, um unsere Befreiungsarmee zu bewaffnen und zu stärken und die nationale Befreiung zu beschleunigen."
  KOR_haiwai_qiaomin_dongyuan: "Mobilisieren Sie ausländische Landsleute"
  KOR_haiwai_qiaomin_dongyuan_desc: "Millionen weltweit verstreuter Landsleute sind wertvolle Ressourcen für unsere Unabhängigkeit. Über Radio, Briefe und Geheimgesandte rufen wir sie dazu auf, sich zu vereinen, für die Sache der Befreiung zu spenden und sich am internationalen Boykott gegen Japan zu beteiligen."
  KOR_duiri_xuanzhan: "Erklären Sie Japan den Krieg"
  KOR_duiri_xuanzhan_desc: "Als unabhängige politische Einheit müssen wir unserer Stimme Gehör verschaffen. Wir werden dem Kaiserreich Japan offiziell den Krieg erklären, um der Welt unsere unnachgiebige Entschlossenheit zu zeigen. Dies wird nicht nur die nationale Moral stärken, sondern auch unseren rechtmäßigen Platz in der internationalen Nachkriegsordnung sichern."
  KOR_xunlian_guonei_tujidui: "Bilden Sie Inlandskommandos aus"
  KOR_xunlian_guonei_tujidui_desc: "Unzählige Patrioten sehnen sich immer noch danach, in den von Japan besetzten Gebieten Widerstand zu leisten. Wir werden heimlich Kader zurückschicken, um Guerilla- und Kommandoeinheiten hinter den feindlichen Linien zu organisieren und auszubilden. Diese Kräfte werden mit der alliierten Gegenoffensive kooperieren und die japanische Herrschaft von innen heraus untergraben."
  KOR_lianluo_yiyongdui: "Vereint das koreanische Freiwilligenkorps"
  KOR_lianluo_yiyongdui_desc: "Neben der Befreiungsarmee sind in China viele unabhängige koreanische Freiwilligeneinheiten aktiv. Wir werden die Initiative ergreifen, mit ihnen Kontakt aufzunehmen und diese verstreuten antijapanischen Kräfte unter dem einheitlichen Kommando der Befreiungsarmee zu integrieren und so eine stärkere antijapanische Kraft zu bilden."
  KOR_miandian_yuanzheng_jun: "Burma Expeditionary Force"
  KOR_miandian_yuanzheng_jun_desc: "Um breitere internationale Unterstützung zu gewinnen und der Welt unsere antijapanische Entschlossenheit zu demonstrieren, werden wir eine Eliteeinheit der Befreiungsarmee auf das Schlachtfeld in Burma schicken, um an der Seite der Alliierten gegen japanische Invasoren zu kämpfen."
  KOR_kailuo_huiyi: "Verfolgen Sie die Konferenz in Kairo"
  KOR_kailuo_huiyi_desc: "Die Konferenz der alliierten Staats- und Regierungschefs in Kairo wird über die Weltordnung der Nachkriegszeit entscheiden, insbesondere über das Schicksal der koreanischen Halbinsel. Wir werden Vertreter entsenden, um die Konferenz genau zu verfolgen, aktiv Lobbyarbeit bei den Nationen zu betreiben und uns für ein klares Prinzip der „Unabhängigkeit Koreas“ im Konferenzkommuniqué einzusetzen."
  KOR_weituo_tongzhi: "Akzeptieren Sie die Mandatsregel"
  KOR_weituo_tongzhi_desc: "Angesichts der Realität der internationalen Machtpolitik kann die vollständige Unabhängigkeit einige Zeit in Anspruch nehmen. Unter bestimmten Bedingungen können wir eine kurzfristige „Mandatsherrschaft“ der Alliierten über die koreanische Halbinsel im Austausch für breite internationale Unterstützung akzeptieren und die endgültige Unabhängigkeit sicherstellen."
  KOR_fantuoguan_xingdong: "Widersetzen Sie sich der Treuhandbewegung"
  KOR_fantuoguan_xingdong_desc: "Jede Form von „Treuhandschaft“ verletzt die nationale Würde. Wir werden den Versuchen der Alliierten, die koreanische Halbinsel unter Treuhänderschaft zu stellen, entschieden widerstehen, globale Landsleute und internationale Freunde mobilisieren, sofortige und vollständige Unabhängigkeit anstreben und niemals zulassen, dass ein Land unter irgendeinem Vorwand in unsere Souveränität eingreift."
  KOR_bayiwu_guangfu: "Tag der Befreiung"
  KOR_bayiwu_guangfu_desc: "Nach der Taufe mit Blut und Feuer haben wir endlich die lang erwartete nationale Befreiung begrüßt! Wir werden diesen Tag für immer in Erinnerung behalten. Die ganze Nation wird diesen großen Sieg feiern und eine neue Ära beim Aufbau eines brandneuen, unabhängigen, freien und wohlhabenden Korea einleiten."


  DEBUG_CILUXIAN_WEIKAIFA_WANCHENG_TT: "§YDieser Weg ist der historische Weg für Korea. Um diesen Spielpfad zu spielen, stellen Sie sicher, dass die Nationen auf der Karte ihren historischen nationalen Schwerpunkten folgen§!"
##Politics
  #######################################################################################################################################################################
  KOR_zhengzhi_luxian_1: "Ruhm der Wiederherstellung"
  KOR_zhengzhi_luxian_1_desc: "Nach Jahren des Kampfes und der Opfer lodert endlich der Funke der Freiheit auf der koreanischen Halbinsel auf. Von Guerillas am Fuße des Paektu-Gebirges bis hin zu Widerstandsorganisationen auf den Straßen der Stadt haben sich unzählige koreanische Patrioten zu einem unaufhaltsamen Strom zusammengeschlossen. Korea, ein unabhängiges und souveränes Land, wurde durch die Taufe mit Feuer und Blut wiedergeboren."
  KOR_zhengzhi_luxian_1_tt: "Korea restauriert"
  KOR_zhengzhi_luxian_2: "Provisorischer Verwaltungsrat"
  KOR_zhengzhi_luxian_2_desc: "Obwohl die Flammen des Krieges abgeklungen sind, liegt die Macht, das Land zu führen, immer noch in der Luft. Wir müssen sofort ein provisorisches Gremium einrichten, das alle Kräfte vertritt, um Dekrete zu erlassen und die Herzen der Menschen zu stabilisieren."
  KOR_zhengzhi_luxian_2_tt: "Schalten Sie die Entscheidung frei §YSicherheitsmaßnahmen stärken§!"
  KOR_zhengzhi_zhenxing_guojia: "Komitee für den Wiederaufbau der Nachkriegszeit"
  KOR_zhengzhi_zhenxing_guojia_desc: "Jahrelanger Krieg und koloniale Plünderung haben unser Land verwüstet. Die Eisenbahnen sind fragmentiert, Fabriken liegen in Trümmern und Menschen werden aus ihren Häusern vertrieben. Derzeit ist die Einrichtung eines einheitlichen und effizienten „Komitees für den Wiederaufbau nach dem Krieg“ unsere oberste Priorität. Es wird die personellen und materiellen Ressourcen des Landes koordinieren, den Wiederaufbau der Infrastruktur planen und die Wiederaufnahme der Grundproduktion organisieren. Dies ist für uns der erste Schritt, um die Wunden des Landes zu heilen und der Wiedergeburt entgegenzuschreiten."
  KOR_queli_zhiding_linshi_xianfa: "Formulieren Sie eine vorläufige Verfassung"
  KOR_queli_zhiding_linshi_xianfa_desc: "Nach dem ersten Sieg der Revolution muss der Staatsapparat dringend aufgebaut werden. Ein vorläufiges Grundgesetz ist der erste Schritt zur Stabilisierung der Ordnung und zur Ankündigung der Geburt des neuen Regimes. Es wird uns als legale Waffe dienen, um das Volk zu vereinen und Konterrevolutionäre zu unterdrücken und so die rechtliche Grundlage für die Zukunft Neukoreas zu legen."
  KOR_zhengzhi_zhengzhi_xingshang_huiyi: "Einberufung der Nationalen Politischen Konsultativkonferenz"
  KOR_zhengzhi_zhengzhi_xingshang_huiyi_desc: "Das japanische Reich ist krachend zusammengebrochen und der Himmel über Korea ist zum ersten Mal frei vom Schatten der Kolonisatoren. In Pjöngjang kommen alle politischen Kräfte aus dem Untergrund, Übersee und den Bergwäldern zusammen, und eine Konferenz, die über das Schicksal der Nation entscheiden wird, steht kurz bevor. Aber unter der Oberfläche der Einheit brodeln Unterströmungen …"
  KOR_xuanju_zidong_tt: "Die Politische Konsultativkonferenz ist beendet"
###############################  Red  #################################
  KOR_beijixing_de_zhiyin: "Führung des Nordsterns"
  KOR_beijixing_de_zhiyin_desc: "Im langen und dunklen Kampf gegen Japan hat uns ein großer Führer wie der Polarstern geführt. Jetzt wird er uns weiterhin in die glänzende Zukunft des Sozialismus führen. Die Schaffung der absoluten Autorität des Führers ist die Grundvoraussetzung dafür, dass das revolutionäre Schiff niemals von seinem Kurs abweicht."
  KOR_jieshou_kangri_youjidui: "Akzeptieren Sie die nordöstlichen antijapanischen alliierten Streitkräfte"
  KOR_jieshou_kangri_youjidui_desc: "Die Soldaten der antijapanischen alliierten Streitkräfte, die jahrelang blutige Schlachten zwischen den weißen Bergen und den schwarzen Gewässern gekämpft haben, sind der wertvollste Reichtum der Revolution. Ihre reiche Kampferfahrung und ihr fester revolutionärer Wille werden zum stählernen Rückgrat unserer neu gegründeten Volksarmee werden. Die Rückkehr dieser kampferprobten Armee wird unsere nationalen Verteidigungsfähigkeiten erheblich verbessern."
  KOR_zhiding_guojia_xianfa: "Formulieren Sie eine nationale Verfassung"
  KOR_zhiding_guojia_xianfa_desc: "Die provisorische Verfassung hat ihre historische Mission erfüllt. Jetzt müssen wir eine nationale Verfassung formulieren, die sozialistische Prinzipien verkörpert und die demokratische Diktatur des Volkes festigt. Es wird die führende Stellung der Partei und den sozialistischen Charakter des Landes in der Form eines Gesetzes dauerhaft festschreiben."
  KOR_qingsuan_de_fengbao: "Sturm der Säuberung"
  KOR_qingsuan_de_fengbao_desc: "Der Abschaum der alten Welt – Grundbesitzer, Kapitalisten, pro-japanische Fraktionen und reaktionäre Bürokraten – lauert immer noch unter den Menschen und versucht, unser neugeborenes Regime zu stürzen. Ein revolutionärer Säuberungssturm ist zwingend erforderlich. Wir müssen mit gewaltigen Mitteln diese Klassenfeinde ein für alle Mal auf den Müllhaufen der Geschichte fegen."
  KOR_jianli_guojia_anquan_baowei_bu: "Errichten Sie das Ministerium für Staatssicherheit"
  KOR_jianli_guojia_anquan_baowei_bu_desc: "Die Früchte des revolutionären Sieges erfordern wachsame Augen und scharfe Schwerter, um sie zu verteidigen. Eine einheitliche und effiziente Staatssicherheitsbehörde wird für uns zu einem starken Schutzschild werden, um interne Spione aufzuspüren und externe Subversionspläne zu zerschlagen und sicherzustellen, dass die roten Flüsse und Berge für immer unverändert bleiben."
  KOR_jianli_haiwai_qingbaobu: "Aufbau eines Overseas Intelligence Network"
  KOR_jianli_haiwai_qingbaobu_desc: "Umgeben vom Imperialismus können wir nicht taub und blind werden. Wir müssen ein Geheimdienstnetzwerk aufbauen, das hinter die feindlichen Linien vordringt und sich über den ganzen Globus ausbreitet. Es wird uns nicht nur wichtige Informationen liefern, sondern für uns auch zu einer Geheimfront werden, um Revolutionen zu exportieren und die Kämpfe von Menschen auf der ganzen Welt zu unterstützen."
  KOR_laodong_renmin_bao: "Arbeiter- und Volkszeitung"
  KOR_laodong_renmin_bao_desc: "Der Stift und die Waffe sind zwei magische Waffen zur Eroberung und Festigung der politischen Macht. Durch die Gründung einer Organzeitung des Zentralkomitees der Partei werden die Linien, Grundsätze und Politik der Partei den breiten Volksmassen rechtzeitig bekannt gemacht, die Führungsebenen der öffentlichen Meinung erobert und die Gedanken des Volkes mit revolutionären Ideen bewaffnet."
  KOR_guoji_tongxun_she: "Internationale Nachrichtenagentur"
  KOR_guoji_tongxun_she_desc: "Die Sprachrohre der Bourgeoisie verleumden uns in der internationalen Gemeinschaft mutwillig, und wir müssen unserer Stimme Gehör verschaffen. Die Gründung einer internationalen Nachrichtenagentur mit Blick auf die Welt wird der Welt die großen Errungenschaften unseres sozialistischen Aufbaus zeigen, die Lügen des Imperialismus widerlegen und revolutionäre Verbündete auf der ganzen Welt vereinen."
  KOR_funv_jiefang_yundong: "Sozialistische Frauenliga"
  KOR_funv_jiefang_yundong_desc: "Seit der Antike wurde die missliche Lage der Frauen in der Gesellschaft ignoriert. Durch die stärkere Integration der Socialist Women's League in den Kern der Regierung können wir endlich auf ihre Anliegen eingehen und eine gerechtere Gesellschaft für alle schaffen."
  KOR_saochu_wenmang_yundong: "Kampagne gegen Analphabetismus"
  KOR_saochu_wenmang_yundong_desc: "Ein Land voller Analphabeten kann keinen Sozialismus aufbauen. Wir müssen eine massive Massenkampagne gegen den Analphabetismus starten, um es jedem arbeitenden Menschen zu ermöglichen, Lese- und Schreibfähigkeiten zu erlernen. Nur so können sie den Marxismus-Leninismus besser erlernen, sich an der nationalen Verwaltung beteiligen und kultivierte Meister der neuen Ära werden."
  KOR_malie_zhuyi_kexueyuan: "Gründung der Akademie des Marxismus-Leninismus"
  KOR_malie_zhuyi_kexueyuan_desc: "Die Theorie ist der Leitfaden zum Handeln. Um den Marxismus-Leninismus gründlich zu studieren, zu entwickeln und zu verteidigen, müssen wir eine erstklassige theoretische Forschungseinrichtung gründen. Es wird loyale theoretische Kader für die Partei heranbilden und eine solide theoretische Unterstützung für unsere revolutionäre Praxis bieten, um sicherzustellen, dass wir immer den richtigen Weg gehen."
  KOR_malie_zhuyi_bentuhua: "Lokalisierung des Marxismus-Leninismus"
  KOR_malie_zhuyi_bentuhua_desc: "Der Marxismus-Leninismus ist kein starres Dogma, sondern eine Anleitung zum Handeln. Wir müssen die universelle Wahrheit des Marxismus-Leninismus mit der spezifischen Praxis der koreanischen Revolution verbinden, um eine revolutionäre Theorie mit nationalen Merkmalen zu schaffen. Dies ist nicht nur eine Bereicherung und Weiterentwicklung des Marxismus-Leninismus, sondern auch der unvermeidliche Weg für uns, uns in Richtung Unabhängigkeit und Eigenständigkeit zu bewegen."
  KOR_zhengfeng_yundong: "Berichtigungsbewegung"
  KOR_zhengfeng_yundong_desc: "Die revolutionären Reihen sind kein monolithischer Block; Es gibt immer noch nichtproletarische Ideen wie Bürokratie und Sektierertum. Eine tiefgreifende Korrekturbewegung ist notwendig. Durch Kritik und Selbstkritik werden wir den ideologischen Staub beseitigen und unsere Partei reiner und kampfstärker machen."
  KOR_jianli_laogong_dang: "Arbeiter-Bauern-Allianz"
  KOR_jianli_laogong_dang_desc: "Das Bündnis zwischen Arbeitern und Bauern ist die Grundlage für den revolutionären Sieg und die Konsolidierung des Regimes. Durch die Unterstützung der landwirtschaftlichen Kollektivierung, die Entsendung von Arbeiterpropagandateams aufs Land und auf andere Weise müssen wir die körperlichen Bindungen zwischen Arbeitern und Bauern kontinuierlich festigen. Nur wenn das Arbeiter-Bauern-Bündnis felsenfest ist, kann unser Land felsenfest sein."
  KOR_hongse_gonghui: "Rote Gewerkschaften"
  KOR_hongse_gonghui_desc: "Gewerkschaften sollten keine Barriere zwischen Arbeitern und der Partei sein, sondern eine Brücke und ein Band, das die Partei mit den Arbeitermassen verbindet. Wir müssen die alten Gewerkschaften gründlich umgestalten und von der Partei geführte rote Gewerkschaften gründen, um sie zu einem wirksamen Instrument zur Organisierung und Mobilisierung der Arbeiterklasse für die Erfüllung von Produktionsaufgaben zu machen."
  KOR_zhi_qing_xiaxiang: "Bis hin zur Landbewegung für gebildete Jugend"
  KOR_zhi_qing_xiaxiang_desc: "Gebildete junge Menschen in Städten sollten nicht von der Masse in Elfenbeintürmen isoliert werden. Organisieren Sie sie, damit sie aufs weite Land gehen und von armen und unteren Mittelbauern in rauen Umgebungen eine Umerziehung erhalten, was nicht nur zur ländlichen Entwicklung beitragen, sondern sie auch zu festen Nachfolgern der proletarischen revolutionären Sache heranbilden kann."
  KOR_fandui_geren_chongbai: "Widersetzen Sie sich dem Personenkult"
  KOR_fandui_geren_chongbai_desc: "Den Erfolg der Revolution dem Genie einer einzelnen Person zuzuschreiben, verstößt gegen den historischen Materialismus des Marxismus. Wir müssen wachsam sein und uns jeder Form von Personenkult widersetzen und uns an das Prinzip der kollektiven Führung der Partei halten. Das Volk ist der Schöpfer der Geschichte, und kein Einzelner kann über der Partei und dem Volk stehen."
  KOR_xuesheng_yundong_xianfeng: "Avantgarde der Studentenbewegung"
  KOR_xuesheng_yundong_xianfeng_desc: "Junge Studenten sind aktiv im Denken und voller Leidenschaft, was sie zu einer wichtigen Kraft in den revolutionären Reihen macht. Die Partei muss die Führung der Studentenbewegung fest im Griff haben, ihren revolutionären Enthusiasmus leiten und sie zur Vorhut bei der Verbreitung revolutionärer Ideen und beim Angriff auf das alte System machen, indem sie ihre Jugend zum Aufbau einer neuen Gesellschaft beiträgt."
  KOR_zili_geng_sheng: "Harte Arbeit und Eigenständigkeit"
  KOR_zili_geng_sheng_desc: "Die Grundlage unserer Sache auf unsere eigene Stärke zu legen, bedeutet Eigenständigkeit. Wir begrüßen die Hilfe brüderlicher Länder, aber das Schicksal Koreas muss in den Händen des koreanischen Volkes selbst liegen. Ob beim Wirtschaftsaufbau oder beim Aufbau der Landesverteidigung, wir müssen einen Weg der Unabhängigkeit und Eigenständigkeit einschlagen."
  KOR_dangjiao_jiehe: "Integration von Partei und Bildung"
  KOR_dangjiao_jiehe_desc: "Die grundlegende Aufgabe der Bildung besteht darin, der proletarischen Politik zu dienen und revolutionäre Nachfolger heranzubilden, die sowohl rot als auch erfahren sind. Schulen können nicht zu Orten der Verbreitung bürgerlicher Ideen werden. Wir müssen die absolute Führung der Partei im Bildungsbereich stärken und sicherstellen, dass Schulbücher, Klassenzimmer und Lehrer fest in den Händen der Partei sind."
  KOR_quanmin_wuzhuang: "Bewaffnung der gesamten Nation"
  KOR_quanmin_wuzhuang_desc: "Der Imperialismus gibt niemals seinen Ehrgeiz auf, uns zu zerstören, und wir müssen jederzeit zum Kampf bereit sein. Führen Sie die Bewaffnung der gesamten Nation durch, organisieren Sie alle Menschen in militärischen und halbmilitärischen Einheiten und erreichen Sie wirklich, dass „jeder Bürger ein Soldat ist“. Sobald der Feind eine Invasion wagt, wird er im riesigen Ozean des Volkskrieges gefangen sein."
  KOR_sixiang_de_baolei: "Festung des Denkens"
  KOR_sixiang_de_baolei_desc: "Unsichtbare Feinde sind manchmal gefährlicher als sichtbare. Wir müssen eine uneinnehmbare Festung des Denkens errichten, um der Erosion durch „mit Zucker überzogene Kugeln“ und dekadenten Ideen von außen zu widerstehen. Jeder Lärm, der versucht, unseren revolutionären Willen zu erschüttern, wird vollständig unterdrückt."
  KOR_tuiguang_e_yu: "Fördern Sie die russische Sprache"
  KOR_tuiguang_e_yu_desc: "Die Sowjetunion ist das erste sozialistische Land der Welt und unser älterer Bruder. Das Erlernen und Fördern der russischen Sprache hilft uns, die fortgeschrittenen Erfahrungen der Sowjetunion besser kennenzulernen, revolutionäre Theorien zu verinnerlichen und die Einheit mit Bruderländern zu stärken. Dies ist eine wichtige Maßnahme zur Festigung der Einheit innerhalb des sozialistischen Lagers."
  KOR_wushenlun_xuanchuan: "Atheismus-Propaganda"
  KOR_wushenlun_xuanchuan_desc: "Religion ist das Opium, das die Menschen lähmt. Seit Jahrtausenden haben feudale abergläubische Ideen den Geist der Menschen stark eingeschränkt. Wir müssen landesweit eine massive Atheismus-Propagandakampagne starten, die Menschen mit einer wissenschaftlich-materialistischen Weltanschauung ausrüsten und sie vollständig von den Fesseln der Theokratie befreien."
  KOR_shehui_xiashi_zhuyi: "Sozialistischer Realismus"
  KOR_shehui_xiashi_zhuyi_desc: "Literatur und Kunst sind mächtige Waffen für den Klassenkampf und müssen der proletarischen Politik dienen. Wir müssen das schöpferische Prinzip des sozialistischen Realismus in den literarischen und künstlerischen Kreisen etablieren und in allen Werken eine enthusiastische Lobpreisung revolutionärer Helden und eine Darstellung des feurigen Lebens des sozialistischen Aufbaus verlangen, um so das Volk zu erziehen und den Kampfgeist zu wecken."
  KOR_lingxiu_quanwei_zhidu_hua: "Institutionalisierung der Autorität des Führers"
  KOR_lingxiu_quanwei_zhidu_hua_desc: "Die außergewöhnliche Weisheit und die herausragenden Beiträge des Führers haben bewiesen, dass er die Inkarnation der Revolution ist. Die Festschreibung der Autorität des Führers in Form von Systemen und Gesetzen und die Sicherstellung, dass seine Gedanken zur alleinigen Leitideologie des Landes und der Partei werden, ist ein langfristiger Plan, um Revisionismus zu verhindern und sicherzustellen, dass die revolutionäre Sache von Generation zu Generation weitergegeben wird."
  KOR_yanan_jingshen_de_huigui: "Rückkehr des Yan'an-Geistes"
KOR_yanan_jingshen_de_huigui_desc: "Im revolutionären heiligen Land Chinas lernten unsere Kameraden Ausdauer und Hingabe. Jetzt werden wir diesen kostbaren spirituellen Reichtum nach Korea zurückbringen, unsere revolutionäre politische Macht durch Massenmobilisierung und ideologische Bildung festigen und eine solide ideologische Grundlage für zukünftige Kämpfe legen."
  KOR_yanan_jingshen_de_huigui_tt: "£yananpai_focus_xiaotubiao_texticon $KOR_yanan_paixi_tt$Mindestens$KOR_communism_Party_Size_1$"
  KOR_renmin_weiyuanhui_de_yichan: "Das Erbe des Volkskomitees"
  KOR_renmin_weiyuanhui_de_yichan_desc: "Zu Beginn der Befreiung gründeten die Menschen spontan Komitees, um ihre eigenen Häuser zu verwalten. Wir werden dieses wertvolle politische Erbe übernehmen und weiterentwickeln, eine wirklich vom Volk geführte Regierung aufbauen und in jedem Zentimeter des zurückgewonnenen Landes politische Macht verankern."
  KOR_renmin_weiyuanhui_de_yichan_tt: "£bentupai_focus_xiaotubiao_texticon $KOR_nanlao_paixi_tt$Mindestens$KOR_communism_Party_Size_1$"
  KOR_wenhua_da_geming: "Revolutionäre Kultur"
  KOR_wenhua_da_geming_desc: "Das verbleibende Gift des Kolonialismus und die chronische Krankheit der feudalen Ideologie sind zwei große Tumore, die die Wiedergeburt unserer Nation behindern. Eine tiefgreifende Kulturrevolution ist unerlässlich. Wir müssen die fremde versklavende Ideologie gründlich liquidieren, die dekadenten Werte der alten Welt zerschlagen und einen brandneuen nationalen Geist etablieren, der uns gehört. Diese Revolution wird unser Volk umgestalten und alle ideologischen Hindernisse für den Aufbau eines reinen und mächtigen Landes beseitigen."
  KOR_tongyi_zhenxiang_changdao: "Initiative der Einheitsfront"
  KOR_tongyi_zhenxiang_changdao_desc: "Die aktuelle revolutionäre Situation ist komplex, da interne und externe Herausforderungen gleichzeitig bestehen. Um die Kräfte maximal zu bündeln und unnötige interne Konflikte zu vermeiden, müssen wir die Gesamtsituation priorisieren. Wir schlagen hiermit offiziell vor, mit den Genossen in der Partei eine möglichst breite Einheitsfront zu bilden, die Linienunterschiede vorübergehend beiseite zu legen und zusammenzuarbeiten, um die politische Macht des neugeborenen Volkes zu festigen und die vollständige nationale Unabhängigkeit zu erreichen."
  KOR_tongyi_zhenxiang_changdao_tt: "Bei erfolgreicher Bildung einer §Yfraktion§! Einheitsfront wird ein Teil ihrer §YBoni§! nach der Plenarsitzung einbehalten!"
  KOR_jiti_lingdaozhi_queli: "Einrichtung eines kollektiven Führungssystems"
  KOR_jiti_lingdaozhi_queli_desc: "Der Personenkult ist gefährlich und die Früchte des revolutionären Sieges gehören dem gesamten Volk. Wir werden ein kollektives Führungssystem etablieren, in dem mehrere Kerngenossen gemeinsame Entscheidungen treffen, um sicherzustellen, dass das Schiff des Landes nicht vom Kurs abweicht, wir werden die Weisheit der gesamten Partei bündeln und das Land zum Wohlstand führen."
  KOR_zhishao_yihejie_yipaixi_flag: "Die Verhandlungen mit der Fraktion sind abgeschlossen"
  KOR_renmin_zhanzheng_wangyang: "Der weite Ozean des Volkskrieges"
  KOR_renmin_zhanzheng_wangyang_desc: "Unsere Kraftquelle sind die Menschen. Wir werden die breitesten Massen mobilisieren und jedes Dorf zu einer Festung und jeden Menschen zu einem Soldaten machen. Die Aggressoren werden im riesigen Ozean des Volkskrieges versinken und völlig vernichtet werden."
  KOR_minbing_xiandaihua_jianshe: "Modernisierung der Milizkräfte"
  KOR_minbing_xiandaihua_jianshe_desc: "Milizen sind der Grundpfeiler der Heimatverteidigung und eine mächtige Ergänzung zur regulären Armee. Wir werden die Milizeinheiten mit moderneren Waffen ausstatten und sie professioneller ausbilden, damit sie nicht nur den Feind bedrängen, sondern auch eine wichtige Rolle in Frontkämpfen spielen können."
  KOR_wutingjiangjun_de_paobing: "Die Artillerie von General Mu Ting"
  KOR_wutingjiangjun_de_paobing_desc: "„Artillerie ist der Gott des Krieges“, und General Mu Ting ist der Experte, der diese Wahrheit versteht. Unter seiner Führung werden wir Artillerieeinheiten energisch entwickeln, feindliche Stellungen mit dichtem Stahlsperrfeuer abdecken und Hindernisse für jeden Infanterieangriff beseitigen."
  KOR_tiedao_youji_dui: "Eisenbahnguerillakorps"
  KOR_tiedao_youji_dui_desc: "Eisenbahnen sind die Hauptverkehrsadern und Lebensadern des Feindes. Wir werden Elite-Guerillaeinheiten organisieren, um mit Hämmern auf die Transportlinien des Feindes einzuschlagen, Brücken zu zerstören, Züge in die Luft zu sprengen und die Angreifer daran zu hindern, sich auch nur einen Zentimeter auf unserem Land zu bewegen."
  KOR_sandajilv_bada_zhuyi: "Drei Hauptregeln der Disziplin und acht Punkte zur Aufmerksamkeit"
  KOR_sandajilv_bada_zhuyi_desc: "Eine Armee ohne Disziplin kann den Feind nicht besiegen. Wir werden die „Drei Hauptregeln der Disziplin und die Acht Punkte der Aufmerksamkeit“ strikt durchsetzen, um eine Volksarmee aufzubauen, die eine tiefe Verbundenheit mit dem Volk hat und nicht die geringste Straftat gegen es begeht. Dies wird uns die größtmögliche Unterstützung in der Bevölkerung und einen stetigen Strom an Unterstützung verschaffen."
  KOR_chengshihua_xunlian: "Politische Akademie Kumgang"
  KOR_chengshihua_xunlian_desc: "Das Fundament der Revolution liegt in einer festen Ideologie. Wir werden die Kumgang-Politische Akademie gründen und eine Gruppe revolutionärer Kader schmieden, die der Partei und dem Volk mit einem unnachgiebigen Willen wie Mount Kumgang absolut treu ergeben sind. Sie werden tief in die Armee und die Regierung eindringen und zum Rückgrat werden, um sicherzustellen, dass unsere Sache unerschütterlich bleibt, und zum unzerstörbaren Eckpfeiler eines neuen Korea."
  KOR_shentou_zuozhan_zhuanjia: "Experten für Infiltrationstaktiken"
  KOR_shentou_zuozhan_zhuanjia_desc: "Unerwartete Angriffe bringen oft die besten Ergebnisse. Wir werden eine Gruppe von Experten für Infiltrationstaktiken bilden, die es ihnen ermöglichen, wie scharfe Klingen in das Kernland des Feindes einzudringen, um Aufklärungs-, Sabotage- und Enthauptungsmissionen durchzuführen und dort Chaos zu schaffen, wo der Feind es am wenigsten erwartet."
  KOR_fazhan_shandi_zuozhan: "Entwickeln Sie den Gebirgskrieg"
  KOR_fazhan_shandi_zuozhan_desc: "Die koreanische Halbinsel ist gebirgig, was sowohl eine Herausforderung als auch eine Chance darstellt. Wir werden Spezialeinheiten bilden und ausbilden, die an komplexe Gebirgsumgebungen angepasst sind, Geländevorteile nutzen, um den Feind anzugreifen, und die durchgehenden Berge in unsere natürlichen Verteidigungslinien und ein Jagdrevier verwandeln, das den Feind in Angst und Schrecken versetzt."
  KOR_fazhan_shandi_zuozhan_tt: "§Y2§! Zufällige Armeekommandanten erhalten die Eigenschaft §Y$trait_mountaineer$§!!"
  KOR_minbing_yu_zhengguijun_ronghe: "Unregelmäßige Umschulung der Armee"
  KOR_minbing_yu_zhengguijun_ronghe_desc: "Irreguläre Truppen sollten nicht nur Streitkräfte der zweiten Linie sein. Durch diese nationale Politik werden wir ein effizientes Transformationssystem einrichten, das es erfahrenen irregulären Truppen ermöglicht, die reguläre Armee schnell zu ergänzen und in sie zu integrieren und sicherzustellen, dass unsere Feldtruppen jederzeit eine starke Kampfeffektivität aufrechterhalten."
  KOR_renmin_de_zhanzheng: "Volkskrieg"
  KOR_renmin_de_zhanzheng_desc: "Dies ist die ultimative Verkörperung unserer militärischen Ideologie. Wir werden das Land vollständig in einen totalen Kriegsstaat umwandeln, in dem alle dem Krieg dienenden Ressourcen und die Kräfte des Volkes bis zum Äußersten mobilisiert werden. Auf diesem Land wird jeder Angreifer mit einer Kupfermauer und einer eisernen Bastion einer bewaffneten Nation konfrontiert sein."
  KOR_ganbu_shencha: "Kaderinspektion"
  KOR_ganbu_shencha_desc: "In den Reihen der Revolutionäre tummeln sich Opportunisten und Verräter. Um die Reinheit der Organisation sicherzustellen, ist eine gründliche Kaderprüfung unerlässlich. Wir werden diejenigen ausrotten, die schwanken und ideologisch korrumpiert sind, und sicherstellen, dass jede Führungsposition von den treuesten Genossen besetzt wird."
  KOR_pingrang_de_mosike_shenpan: "Moskauer Prozesse in Pjöngjang"
  KOR_pingrang_de_mosike_shenpan_desc: "Einige Genossen in der Partei wurden durch ausländische Ideologien korrumpiert und versuchten, unsere Revolution in die Irre zu führen. Wir werden die Erfahrungen Moskaus verfolgen, öffentliche Prozesse gegen diese Verräter abhalten, Feinde innerhalb der Partei beseitigen und die Diktatur des Proletariats festigen."
  KOR_kelimulingong_de_yizhi: "Der Wille des Kremls"
  KOR_kelimulingong_de_yizhi_desc: "Als Leuchtturm der proletarischen Weltrevolution ist die Erfahrung der Sowjetunion unser Wegweiser für die Zukunft. Wir werden uns eng um den Kreml vereinen, die Führung und Unterstützung Moskaus annehmen und unsere revolutionäre Sache im Einklang mit der großen Sowjetunion ausrichten."
  KOR_kelimulingong_de_yizhi_tt: "£sulianpai_focus_xiaotubiao_texticon $KOR_sulian_paixi_tt$Zumindest$KOR_communism_Party_Size_1$"
  KOR_hongjun_moshi: "Politisches Kommissarsystem"
  KOR_hongjun_moshi_desc: "Waffenkritik lässt sich nicht von ideologischer Führung trennen. Wir werden in der Armee ein politisches Kommissarsystem einrichten, um die absolute Führung der Partei sicherzustellen, den Geist jedes Soldaten mit festen Überzeugungen auszustatten, ihm verständlich zu machen, warum er kämpft, und so einen beispiellosen Kampfwillen entfalten."
  KOR_folongzhi_xueyuan_biyesheng: "Absolventen der Militärakademie Frunze"
  KOR_folongzhi_xueyuan_biyesheng_desc: "Offiziere, die an der Frunze-Militärakademie studiert haben, sind nach Abschluss ihres Studiums zurückgekehrt und bringen die fortschrittlichsten sowjetischen Militärtheorien mit. Diese wertvollen Talente werden die Führungsebene unserer Armee umfassend verbessern und dem Aufbau einer modernen und schlagkräftigen Armee neue Vitalität verleihen."
  KOR_folongzhi_xueyuan_biyesheng_tt: "§Y3§!-Generäle mit §Y$career_officer$§! erhalten zufällig eine der Eigenschaften: §Y$infantry_officer$§!/§Y$cavalry_officer$§!/§Y$armor_officer$§!/§Y$engineer_officer$§!"
  KOR_paobing_shi_zhanzheng_zhishen: "Artillerie ist der Gott des Krieges"
  KOR_paobing_shi_zhanzheng_zhishen_desc: "Wir müssen Stalins Lehren aufrechterhalten und unsere Ressourcen in Richtung Artillerie lenken. Wir werden eine beispiellose Anzahl von Artillerieeinheiten aufstellen, um die Kriegsphilosophie der „Überlegenheit der Feuerkraft“ zu verwirklichen. Angesichts des absolut überlegenen Artilleriefeuers wird jede Verteidigung in Schutt und Asche gelegt."
  KOR_chaoxian_shangkong_de_mige: "MiGs über Korea"
  KOR_chaoxian_shangkong_de_mige_desc: "Die Kontrolle über den Himmel bestimmt das Schicksal des Bodens. Mit Hilfe sowjetischer Kameraden werden wir eine Luftwaffe aufbauen, die mit modernen MiG-Düsenjägern ausgestattet ist. Koreas blauer Himmel wird von uns selbst bewacht und feindliche Bomber werden nicht länger in der Lage sein, rücksichtslos zu handeln."
  KOR_jiqun_tanke_biandui: "Gepanzerte Panzerformationen"
  KOR_jiqun_tanke_biandui_desc: "Nach dem Vorbild der Stahlflut der sowjetischen Roten Armee werden wir schlagkräftige Panzerverbände bilden. Diese stählernen Giganten werden als Speerspitze der Offensive dienen, mit unwiderstehlichem Schwung die feindliche Verteidigung durchbrechen, tiefgreifende Operationen durchführen und die Siegesflagge weiter entfernt hissen."
  KOR_lianhe_yanxi: "Gemeinsame Militärübungen"
  KOR_lianhe_yanxi_desc: "Es ist unmöglich, hinter verschlossenen Türen eine starke Armee aufzubauen. Wir werden groß angelegte gemeinsame Militärübungen mit Verbündeten durchführen, die die gleiche Ideologie teilen, in simulierten Konfrontationen von den Stärken des anderen lernen, die Kampfbereitschaft unserer Armee testen und die koordinierten Kampffähigkeiten mit alliierten Streitkräften verbessern."
  KOR_geming_de_hongqi: "Die rote Fahne der Revolution"
  KOR_geming_de_hongqi_desc: "Unsere rote Flagge muss nicht nur über jedem Quadratzentimeter Koreas wehen, sondern auch um die ganze Welt wehen. Wir werden die Revolution aktiv exportieren, proletarische Brüder in allen Ländern unterstützen, die Flammen des Kommunismus über die ganze Welt verbreiten lassen und eine neue Welt ohne Ausbeutung und Unterdrückung aufbauen."
  KOR_shijie_geming_de_yibufen: "Teil der Weltrevolution"
  KOR_shijie_geming_de_yibufen_desc: "Die Befreiung Koreas ist nur ein Kapitel der großen Weltrevolution. Wir werden die Verantwortung des Internationalismus übernehmen, uns mit Revolutionären auf der ganzen Welt vereinen, uns gemeinsam dem Imperialismus und seinen Lakaien entgegenstellen und nach der endgültigen Befreiung der gesamten Menschheit streben."
  KOR_zhutisixiang_de_dengta: "Der Leuchtturm der Juche-Ideologie"
  KOR_zhutisixiang_de_dengta_desc: "Inmitten der stürmischen Wellen des Imperialismus und Revisionismus ist die Juche-Ideologie unser ewiger Leuchtturm. Es lehrt uns, dass der Mensch Herr seines eigenen Schicksals ist. Wir müssen die Juche-Ideologie als alleiniges Leitprinzip für Land und Volk etablieren, ihr Licht nutzen, um unseren Weg der Unabhängigkeit und Eigenständigkeit zu erhellen und den unterdrückten Nationen auf der ganzen Welt die Richtung aufzuzeigen."
  KOR_zhutisixiang_de_dengta_tt: "£youjiduipai_focus_xiaotubiao_texticon $KOR_manzhou_paixi_tt$Mindestens$KOR_communism_Party_Size_1$"
  KOR_xianjun_zhengzhi_queli: "Gründung der Songun-Politik"
  KOR_xianjun_zhengzhi_queli_desc: "Politische Macht erwächst aus dem Lauf einer Waffe, und der Lauf einer Waffe kann auch die politische Macht schützen. Umgeben vom Imperialismus muss das Militär Vorrang vor allem haben und über allem anderen stehen. Die Festlegung der Grundlinie der „Songun-Politik“ bedeutet, dass die Volksarmee nicht nur die Säule der Landesverteidigung, sondern auch die Hauptkraft beim Aufbau des Sozialismus ist. Alles für die Armee, alles abhängig von der Armee!"
  KOR_tanke_hongliu: "105. Garde-Panzerdivision"
  KOR_tanke_hongliu_desc: "Der Wille der Revolution muss mit Stahl verteidigt werden. Angesichts potenzieller Angreifer müssen wir eine unzerstörbare Panzertruppe aufbauen. Groß angelegte Panzerformationen werden alle Feinde, die es wagen, sich uns in den Weg zu stellen, wie ein revolutionärer Strom vernichten. Die Intrigen des Feindes werden angesichts unseres Stahlstroms verwundbar sein."
  KOR_tanke_hongliu_tt: "\nErhalten Sie die Panzerdivision §Y1§! in §Y[ROOT.Capital.GetName]§!, kommandiert von Generalmajor §Y$KOR_Liu_Jingzhu$§!."
  KOR_zhuti_renminjun: "Ausbau der Volksarmee"
  KOR_zhuti_renminjun_desc: "Die Bedrohung durch den Imperialismus ist unmittelbar, und wir brauchen eine starke Armee, die ausreicht, um die Früchte der Revolution zu verteidigen. Mit kampferprobten antijapanischen Veteranen als Rückgrat und engagierten Industrie- und Landwirtschaftsjugendlichen voller patriotischem Enthusiasmus werden wir die Volksarmee rasch vergrößern. Diese Armee wird unser schärfstes Schwert zur Wiedervereinigung des Mutterlandes und zur Bekämpfung ausländischer Einmischung sein."
  KOR_baitoushan_xuetong_shenhua: "Mythos der Blutlinie des Baekdu-Gebirges"
  KOR_baitoushan_xuetong_shenhua_desc: "Der Anführer ist kein gewöhnlicher Mensch, sondern das Licht der Nation, das die heilige Essenz des Baekdu-Berges trägt. Wir müssen den revolutionären Mythos der Führerfamilie unter dem Volk aufbauen und verbreiten und seine Blutlinie fest mit dem Ursprung und der Zukunft unserer Nation verbinden. Dabei handelt es sich nicht nur um einen Personenkult, sondern um eine ewige Strategie, um den nationalen Willen zu vereinen und sicherzustellen, dass die Revolution von Generation zu Generation weitergegeben wird."
  KOR_baitoushan_xuetong_shenhua_tt: "Schalten Sie die Entscheidung von §YEpic of the Great Leader Narrative§! frei, die es uns ermöglicht, §Y2§!-Zeiten gleichzeitig zu verbreiten."
  KOR_xuetong_shixi_shenhua: "Erbliches Blutliniensystem"
  KOR_xuetong_shixi_shenhua_desc: "Die Fackel der Revolution muss von den zuverlässigsten Menschen weitergegeben werden. Die Nachkommen des Anführers haben die reinste revolutionäre Blutlinie und die herausragendste Führungsweisheit geerbt und sind die einzigen Kandidaten, die unsere Sache voranbringen. Die Fixierung dieses Blutlinienerbes in Form eines Systems ist eine grundlegende Maßnahme, um zu verhindern, dass Revisionisten die Macht übernehmen, und um sicherzustellen, dass das rote Land für immer unverändert bleibt."
  KOR_hewuqi_de_juexin: "Entschlossenheit für Atomwaffen"
  KOR_hewuqi_de_juexin_desc: "Wir haben genug von der imperialistischen nuklearen Erpressung! Um unsere Souveränität und Würde zu verteidigen und den Feind davon abzuhalten, vorschnell gegen uns vorzugehen, müssen wir über unsere eigenen Atomwaffen verfügen. Dies ist ein nationales Ziel, das wir erreichen müssen, auch wenn wir den Gürtel enger schnallen, und der letzte Trumpf, um sicherzustellen, dass wir unser Schicksal fest in unseren eigenen Händen halten."
  KOR_juedui_guli_zhuyi: "Absoluter Isolationismus"
  KOR_juedui_guli_zhuyi_desc: "Die Außenwelt ist voller Verfall, Verderbtheit und Feindseligkeit. Um die Reinheit unserer Ideologie und die Stabilität unserer Gesellschaft zu schützen, müssen wir jeden unnötigen Kontakt mit dieser schmutzigen Welt abbrechen. Schließen Sie die Grenzen des Landes und verlassen Sie sich auf unsere eigene Kraft, um ein perfektes irdisches Paradies zu errichten, bis die Außenwelt in ihrem eigenen Verfall zusammenbricht."
  KOR_yindao_ruoxiao_guojia: "Führung schwacher und kleiner Länder"
  KOR_yindao_ruoxiao_guojia_desc: "Wir haben Unterdrückung erlitten, daher verstehen wir am besten den Schmerz schwacher und kleiner Länder. Jetzt haben wir die Verantwortung, ihnen als Führer zur Seite zu stehen und ihnen dabei zu helfen, einen unabhängigen Weg in der Kluft zwischen Imperialismus und Hegemonismus zu finden. Unsere Erfahrung wird zu ihrem kostbaren Reichtum und unsere Stärke wird ihr solider Rückhalt sein."
  KOR_baohu_manzhou_ren: "Schutz des mandschurischen Volkes"
  KOR_baohu_manzhou_ren_desc: "Die Mandschurei ist seit der Antike durch Berge und Flüsse mit uns verbunden und verbindet Blut. Wir können nicht tatenlos zusehen, wie unsere Landsleute dort Unterdrückung erleiden oder von falschen Ideen in die Irre geführt werden. Im Namen des „Schutzes“ haben wir das Recht, in dieser Region einzugreifen, eine für uns freundliche Pufferzone einzurichten und das historische Erbe, das uns gehört, „wiederzugewinnen“."
  KOR_baohu_manzhou_ren_1_tt: "Schalten Sie die Entscheidung frei, §Ykommunistische Stimmung anzuregen§! in §Y[MAN.GetAdjective]§!"
  KOR_baohu_manzhou_ren_2_tt: "Schalten Sie die Entscheidung frei, den §Y-Kommunisten [MAN.GetAdjective]§! einzuladen, unserem Lager beizutreten"
  KOR_zhiyin_zhongguo_ren: "Führung des chinesischen Volkes"
  KOR_zhiyin_zhongguo_ren_desc: "Chinas Revolution ist auf Abwege geraten und vom wahren Marxismus abgewichen. Als Revolutionäre mit reinerer Ideologie und korrekteren Linien haben wir die Pflicht, das verlorene chinesische Volk zu „führen“ und ihm zu helfen, auf den richtigen Weg zurückzukehren. Eine Expedition der „ideologischen Emanzipation“ ist notwendig, auch wenn dies bedeutet, die Wahrheit mit Gewalt zu verbreiten."
  KOR_zhiyin_zhongguo_ren_1_tt: "Schalten Sie die Entscheidung frei, §Ykommunistische Stimmung anzuregen§! in §Ychinesischen Regionen§!"
  KOR_zhiyin_zhongguo_ren_2_tt: "Schalten Sie die Entscheidung frei, §Ykommunistische chinesische Regionen§! einzuladen, unserem Camp beizutreten"
  KOR_jiang_geming_chuandao_nanfang: "Ausbreitung der Revolution im Süden"
  KOR_jiang_geming_chuandao_nanfang_desc: "Das Land Südasien stöhnt immer noch unter der Kontrolle des Imperialismus und seiner Lakaien. Die Befreiung der Genossen im Süden ist eine dringende historische Mission des Kommunismus. Ob durch Infiltration, Propaganda oder den ultimativen revolutionären Krieg, wir müssen die rote Fahne der Revolution über Südasien wehen lassen."
  KOR_yuandong_de_shouhu_zhe: "Wächter des Fernen Ostens"
  KOR_yuandong_de_shouhu_zhe_desc: "Die Geopolitik des Fernen Ostens ist voller instabiler Faktoren. Wir müssen die Verantwortung übernehmen, ein Stabilisator und Beschützer dieser Region zu werden. Jede externe Kraft, die versucht, sich im Fernen Osten einzumischen, muss zunächst die Waffen in unseren Händen in Anspruch nehmen. Wir werden eine regionale Ordnung schaffen, in deren Mittelpunkt wir stehen, um sicherzustellen, dass der Frieden in den Händen der Gerechten liegt."
  KOR_jiang_geming_daiqu_xiya: "Revolution nach Westasien bringen"
  KOR_jiang_geming_daiqu_xiya_desc: "Die Flammen der Revolution breiten sich aus und unsere erfolgreichen Aktionen haben Proletarier überall inspiriert. Wir sollten damit beginnen, revolutionäre Gruppen in Westasien zu finanzieren, um die lokale Stabilität zu erschüttern und sie in die Fünfte Internationale zu bringen."
  KOR_jianli_ziyou_de_yatai: "Aufbau einer freien Region Asien-Pazifik"
  KOR_jianli_ziyou_de_yatai_desc: "Die Menschen in Asien und im Pazifikraum sollten nicht länger vom westlichen Imperialismus versklavt werden. Wir werden das Banner der Befreiung hochhalten, alle unterdrückten Nationen in dieser Region vereinen und eine wirklich freie, unabhängige asiatisch-pazifische Gemeinschaft aufbauen, die vom asiatischen Volk selbst geführt wird. Diese Gemeinschaft wird sich unter unserer Führung in Richtung Wohlstand und Einheit bewegen."
  KOR_yiguojiancheng_shehuizhuyi: "Zentrum der Weltrevolution"
  KOR_yiguojiancheng_shehuizhuyi_desc: "Wenn Moskau in den Sumpf des Revisionismus gerät, braucht das Weltproletariat ein neues revolutionäres Zentrum. Pjöngjang mit seiner reinsten revolutionären Linie und seinem stärksten Kampfwillen verdient es, dieses Zentrum zu sein. Revolutionäre aus aller Welt werden von uns lernen und unsere Führung akzeptieren, bis die rote Fahne überall auf der Welt weht."
  KOR_risheng_zhidi_weixie: "Bedrohung aus dem Land der aufgehenden Sonne"
  KOR_risheng_zhidi_weixie_desc: "Obwohl unser Nachbarland im Osten besiegt wurde, ist das Gespenst des Militarismus nie verschwunden. Wir müssen wachsam gegenüber der Bedrohung durch das Land der aufgehenden Sonne bleiben, einem unsinkbaren Flugzeugträger des Imperialismus, der in Asien stationiert ist. Um unsere Sicherheit zu gewährleisten, ist es die einzige Möglichkeit, vorbeugende Maßnahmen zu ergreifen, um diese Bedrohung vollständig zu beseitigen."
  KOR_zhongjie_zhongguo_fengjian_zhuyi: "Beendigung des chinesischen Feudalismus"
  KOR_zhongjie_zhongguo_fengjian_zhuyi_desc: "Obwohl unser Nachbarland riesig ist, ist es immer noch an eine rückständige feudale Restideologie gebunden, die seinen Fortschritt behindert. Als fortschrittlichstes und revolutionärstes Land in der Region haben wir die Verantwortung, ihnen dabei zu helfen, eine umfassende soziale Revolution zu vollenden, sie von den jahrtausendealten Fesseln zu befreien und sie in eine neue Ära zu führen."
  KOR_nantaipingyang_suweiai: "Sowjets im Südpazifik"
  KOR_nantaipingyang_suweiai_desc: "Der Sonnenschein und die Strände des Südpazifiks sollten kein Urlaubsparadies für Kolonisten sein, sondern ein rotes Paradies für das Proletariat. Wir werden lokale revolutionäre Kräfte bei der Gründung der Südpazifik-Sowjets unterstützen, die als unsere Basis für den Revolutionsexport nach Ozeanien dienen werden."
  KOR_dayangzhou_suweiai: "Ozeanische Sowjets"
  KOR_dayangzhou_suweiai_desc: "Von den Dschungeln Neuguineas bis zu den Wüsten Australiens sollte ganz Ozeanien in den Ruhm der Revolution getaucht werden. Wir werden die Gründung vereinter Ozeanischer Sowjets nicht nur unterstützen, sondern auch anführen, um diesen riesigen Kontinent und seine Inseln von der Kontrolle des westlichen Kapitals zu befreien und ihn zu einem wichtigen Teil des sowjetischen Weltsystems zu machen."
  KOR_yindu_zhina_suweiai: "Indochinesische Sowjets"
  KOR_yindu_zhina_suweiai_desc: "Die Flammen der Revolution auf der Indochinesischen Halbinsel brennen heftig. Wir müssen die Unterstützung für unsere Genossen hier stärken, ihnen helfen, Kolonisten und ihre Lakaien zu besiegen und einheitliche indochinesische Sowjets zu gründen. Dies wird eine solide Barriere und ein wichtiger Verbündeter unserer panasiatischen Revolutionsfront im Süden sein."
  KOR_taipingyang_suweiai_gongheguo: "Union der Pazifischen Sozialistischen Sowjetrepubliken"
  KOR_taipingyang_suweiai_gongheguo_desc: "Unser oberstes Ziel ist die Gründung einer brandneuen Sowjetunion mit uns als Kern im gesamten pazifischen Raum. Von Kamtschatka bis Neuseeland, von Hawaii bis Indochina werden sich alle befreiten Länder zu einer mächtigen Union pazifischer sozialistischer Sowjetrepubliken zusammenschließen, die den dekadenten Imperien der alten Welt die Stirn bieten."
  KOR_shengli_de_changzheng: "Langer Marsch zum Sieg"
  KOR_shengli_de_changzheng_desc: "Unsere Sache ist eine lange und beschwerliche Expedition voller Opfer und Prüfungen. Aber genau wie beim großen Langen Marsch in der Geschichte wird uns jede Herausforderung stärker machen, und jeder Rückzug dient einem besseren Angriff beim nächsten Mal. Unser Volk muss bereit sein, den glorreichen langen Marsch zum endgültigen Sieg mit unerschütterlichem Willen zu vollenden."
  KOR_dongyuan_wuchan_jieji: "Mobilisierung des Proletariats"
  KOR_dongyuan_wuchan_jieji_desc: "Die wahre Stärke des Landes liegt in den zig Millionen arbeitenden Menschen. Wir müssen eine gründliche soziale Mobilisierung durchführen, alle Arbeiter und Bauern organisieren und ihnen ermöglichen, sich mit voller revolutionärer Begeisterung der Produktion und dem Aufbau der Landesverteidigung zu widmen. Wenn das gesamte Proletariat vereint ist, werden wir unbesiegbar sein."
  KOR_fanya_geming_zhenxian: "Panasiatische Revolutionsfront"
  KOR_fanya_geming_zhenxian_desc: "Asiatische Revolutionäre müssen sich vereinen! Wir schlagen vor, eine Panasiatische Revolutionäre Front zu gründen, die alle asiatischen Länder und Organisationen vereint, die gegen Imperialismus, Kolonialismus und Reaktionäre kämpfen. An dieser Front werden wir Aktionen koordinieren, Ressourcen teilen und zusammenarbeiten, um ein neues rotes Asien aufzubauen."
  KOR_fanya_kaifa_sheng: "Panasiatischer Entwicklungsplan"
  KOR_fanya_kaifa_sheng_desc: "Um die politische Einheit zu festigen, bedarf es der wirtschaftlichen Integration. Wir werden einen ehrgeizigen „Panasiatischen Entwicklungsplan“ auf den Weg bringen, bei dem unsere industrielle Stärke und Technologie im Mittelpunkt stehen, um die Verbündeten an der Front bei der Entwicklung ihrer Wirtschaft und dem Aufbau von Infrastruktur zu unterstützen. Ein gemeinsamer, prosperierender Wirtschaftskreis wird eine solide Festung gegen die Erosion des westlichen Kapitals sein."
  KOR_tuixing_yazhou_huobi: "Förderung einer einheitlichen asiatischen Währung"
  KOR_tuixing_yazhou_huobi_desc: "Der US-Dollar und das britische Pfund sind Instrumente des Imperialismus zur Ausbeutung des asiatischen Volkes. Um echte wirtschaftliche Unabhängigkeit zu erreichen, müssen wir eine brandneue einheitliche Währung schaffen und fördern, die dem asiatischen Volk selbst gehört. Dadurch werden die Fesseln der westlichen Finanzhegemonie durchtrennt und unser panasiatischer Wirtschaftskreis enger vernetzt und mächtiger."
  KOR_yanjiu_lishihui: "Panasiatischer Forschungsrat"
  KOR_yanjiu_lishihui_desc: "Asiatische Weisheit sollte der revolutionären Sache Asiens dienen. Die Einrichtung des Panasiatischen Forschungsrates zielt darauf ab, die wissenschaftlichen Forschungskräfte verbündeter Länder zu integrieren, technologische Errungenschaften zu teilen und gemeinsam bahnbrechende wissenschaftliche und technologische Schwierigkeiten zu überwinden. Von der Atomenergie bis zur Weltraumforschung werden wir Hand in Hand voranschreiten und die westliche Welt auf dem Gebiet der Wissenschaft und Technologie herausfordern."
  KOR_yanjiu_lishihui_tt: "Der Forschungsgeschwindigkeitsbonus von §Y$KOR_fanya_yanjiu_lishihui_modifier$§! erhöht sich mit jedem neuen Camp-Mitglied um §G1%§!, bis zu einem Maximum von §G10%§!"
  KOR_fanyan_yihui: "Panasiatisches Parlament"
  KOR_fanyan_yihui_desc: "Ein geeintes Asien braucht eine einheitliche politische Plattform für die Stimme. Das in Pjöngjang tagende Panasiatische Parlament wird das höchste beratende Gremium unseres Bündnisses sein. Hier werden wir gemeinsam die wichtigsten Innen- und Außenpolitiken verbündeter Länder diskutieren, Positionen koordinieren und mit einer Stimme zur Welt sprechen. Dies ist ein wichtiger Schritt auf dem Weg zu unserer politischen Integration."
  KOR_liangtiaotui_zoulu: "Auf zwei Beinen gehen"
  KOR_liangtiaotui_zoulu_desc: "Industrie und Landwirtschaft sind wie zwei Beine eines Menschen, auf keines kann verzichtet werden. Wir dürfen nicht den Fehler machen, uns nur auf die Schwerindustrie zu konzentrieren und die Bauern hungern zu lassen. Während wir der Entwicklung der Schwerindustrie Priorität einräumen, müssen wir die Landwirtschaft und die Leichtindustrie energisch unterstützen. Nur so kann unser Land stetig und schnell auf dem Weg zum Wohlstand sein."
  KOR_dashengchan_yundong: "Große Produktionsbewegung"
  KOR_dashengchan_yundong_desc: "Machen Sie es selbst und Sie werden genug zum Essen und Anziehen haben! Angesichts imperialistischer Blockade und Ressourcenknappheit können wir nicht warten und uns auf andere verlassen. Wir müssen eine energische Große Produktionsbewegung starten, die Armee, Organe und Schulen mobilisieren, um Brachland zurückzugewinnen, Garn zu spinnen und Stoffe zu weben, und die Blockade mit unseren eigenen Händen brechen, um alles zu schaffen, was wir brauchen."
  KOR_renmin_gongshe_gouxiang: "Konzept der Volkskommunen"
  KOR_renmin_gongshe_gouxiang_desc: "Volkskommunen sind die goldene Brücke zum kommunistischen Paradies. Wir werden landwirtschaftliche Genossenschaften zu grundlegenden sozialen Einheiten ausbauen, die Landwirtschaft, Industrie, Handel, Bildung und Militärangelegenheiten integrieren. Hier sind alle Produktionsmittel öffentliches Eigentum, die Arbeit ist einheitlich organisiert und das Leben wird kollektiv versorgt. Wir werden einer völlig neuen Ära ohne Privateigentum entgegengehen."
  KOR_renmin_gongshe_gouxiang_tt: "Schalten Sie einen neuen Wirtschaftsakt frei: §Y$KOR_people_commune_idea$§!"
  KOR_xiaogaolu_jihua: "Kleiner Hochofenplan"
  KOR_xiaogaolu_jihua_desc: "Stahl ist das Rückgrat der Industrie, und die Verdoppelung der Stahlproduktion ist der Schlüssel, um Großbritannien zu überholen und zu den Vereinigten Staaten aufzuschließen. Wir werden die Massen in jedem Winkel des Landes mobilisieren, um unzählige kleine Hochöfen mit einheimischen Methoden zu bauen. Lassen Sie die Flammen der Stahlproduktion hell auf dem Land des Mutterlandes brennen, und die ganze Nation wird Stahl herstellen, um Wunder zu schaffen!"
  KOR_gongsi_heying: "Öffentlich-private Partnerschaft"
  KOR_gongsi_heying_desc: "Für die nationale Bourgeoisie übernehmen wir die Strategie des Vereinens, Ausnutzens und Umwandelns. Durch öffentlich-private Partnerschaften wird der Staat Kader zu privaten Unternehmen entsenden, um sie schrittweise in den Einflussbereich der nationalen Planung zu bringen. Dies ist ein wichtiger Schritt zur friedlichen Umgestaltung der kapitalistischen Industrie und des kapitalistischen Handels und zur endgültigen Verwirklichung der vollständigen Verstaatlichung."
  KOR_gongsi_heying_tt: "Verbessern Sie die Wirkung des Wirtschaftsakts §Y$KOR_people_commune_idea$§!:"
  KOR_wenzi_gaige: "Charakterreform"
  KOR_wenzi_gaige_desc: "Komplexe chinesische Schriftzeichen sind ein großes Hindernis für die Popularisierung der Bildung und die Beseitigung des Analphabetismus. Um es den breiten Massen der Werktätigen zu ermöglichen, sich die Kultur leichter anzueignen, müssen wir eine Charakterreform durchführen. Ob die Vereinfachung chinesischer Schriftzeichen oder die umfassende Förderung von Hangul – diese Reform wird die Kulturlandschaft unseres Landes völlig verändern."
  KOR_peiyang_difang_ganbu: "Ausbildung lokaler Kader"
  KOR_peiyang_difang_ganbu_desc: "Die Staatsmacht muss sich auf jeden Winkel der Basis ausdehnen. Wir müssen von den aktiven Arbeitern und Bauern vor Ort eine große Zahl parteitreuer und mit den örtlichen Verhältnissen vertrauter Kader auswählen und ausbilden. Sie werden zur Brücke zwischen der Partei und den Massen und zur soliden Grundlage für uns, die Herrschaft auf lokaler Ebene zu festigen."
  KOR_nongye_youxian_zhengce: "Agrarpolitik"
  KOR_nongye_youxian_zhengce_desc: "Nahrung ist das größte Bedürfnis der Menschen. Ohne eine stabile landwirtschaftliche Grundlage ist jeder große Plan für die Industrialisierung nur ein Luftschloss. Wir müssen den Schwerpunkt vorübergehend auf die Landwirtschaft verlagern, um absolute Ernährungssicherheit zu gewährleisten und die Grundbedürfnisse der Menschen zu befriedigen. Nur wenn die Lebensbedingungen der Landwirte verbessert werden, kann die Industrie eine solide Unterstützung erhalten."
  KOR_nongye_hezuoshe: "Landwirtschaftliche Genossenschaften"
  KOR_nongye_hezuoshe_desc: "Die verstreute kleinbäuerliche Wirtschaft kann Naturkatastrophen nicht widerstehen und kann auch keine Modernisierung durchführen. Wir werden Landwirte dabei unterstützen, sich zu organisieren, beginnend mit Hilfsgruppen auf Gegenseitigkeit, über einen schrittweisen Übergang zu primären Genossenschaften mit Landanteilen bis hin zur Verwirklichung fortschrittlicher Genossenschaften mit vollständigem öffentlichem Eigentum an den Produktionsmitteln. Dies ist der einzige Weg zur landwirtschaftlichen Kollektivierung."
  KOR_ziyuan_kaifa_hezi: "Joint Ventures zur Ressourcenentwicklung"
  KOR_ziyuan_kaifa_hezi_desc: "Unser Untergrund birgt reiche Schätze, aber uns fehlen die Technologie und die Mittel, um sie auszubeuten. Durch die Gründung von Joint Ventures mit befreundeten Bruderländern können wir fortschrittliche Ausrüstung und Managementerfahrung einbringen, Ressourcenvorteile schnell in industrielle Stärke umwandeln und die erste treibende Kraft in unsere wirtschaftliche Entwicklung einbringen."
  KOR_ziyuan_kaifa_hezi_tt: "Handelsakt freischalten: §Y$KOR_ziyuan_kaifa_hezi_idea$§!"
  KOR_qinggongye_zhenxing: "Wiederbelebung der Leichtindustrie"
  KOR_qinggongye_zhenxing_desc: "Bei der Revolution geht es nicht nur um große Fabriken, sondern auch um das Lächeln der Menschen. Die Wiederbelebung der Leichtindustrie und die Herstellung erschwinglicherer Konsumgüter des täglichen Bedarfs werden den Lebensstandard der Menschen direkt verbessern und ihre Arbeitsbegeisterung steigern. Eine Gesellschaft voller Thermoskannen, Fahrrädern und neuer Kleidung wird einen größeren Zusammenhalt haben."
  KOR_jishuguanliao_yingyong: "Ernennung von Technokraten"
  KOR_jishuguanliao_yingyong_desc: "Revolutionärer Enthusiasmus kann wissenschaftliche Gesetze nicht ersetzen. Um ein modernes Land zu verwalten, brauchen wir eine große Anzahl von Experten, die sich mit Technologie auskennen und gut im Management sind. Der Schlüssel zur Verbesserung der Verwaltungseffizienz liegt darin, mit der alten Gewohnheit der Beförderung auf der Grundlage des Dienstalters zu brechen, Ingenieure, Wirtschaftswissenschaftler und andere Technokraten mutig zu befördern und zu ernennen und Fachkräfte professionelle Arbeit leisten zu lassen."
  KOR_jishuguanliao_yingyong_tt: "Die Eigenschaften von §Y$KOR_Xu_Chengze$§! werden verbessert"
  KOR_youjihua_de_shangpin_jingji: "Geplante Warenwirtschaft"
  KOR_youjihua_de_shangpin_jingji_desc: "Eine absolut verbindliche Planung kann manchmal die Vitalität der Produktion unterdrücken. Wir werden versuchen, Instrumente wie Waren, Werte und Markt zu nutzen, um die Produktion im Rahmen einer nationalen einheitlichen Planung in begrenztem Umfang zu regulieren. Dabei handelt es sich nicht um eine Hinwendung zum Kapitalismus, sondern darum, unsere sozialistische Wirtschaft lebendiger und dynamischer zu machen."
  KOR_youjihua_de_shangpin_jingji_tt: "Schalten Sie einen neuen Wirtschaftsakt frei: §Y$KOR_youjihua_de_shangpin_jingji_idea$§!"
  KOR_qianlima_yundong: "Chollima-Bewegung"
  KOR_qianlima_yundong_desc: "Zeigen Sie den Schwung, eine Chollima zu reiten und galoppieren Sie dem Kommunismus entgegen! Wir werden einen landesweiten Wettbewerb zur Produktionssteigerung starten, der alle Arbeiter dazu ermutigt, mit der „Geschwindigkeit von Chollima“ zu arbeiten, Konventionen zu brechen und Rekorde aufzustellen. Diese Bewegung wird unseren Mangel an Technologie und Kapital mit einem enormen revolutionären Elan ausgleichen und Wunder auf der Erde bewirken."
  KOR_daan_gongzuo_tixi: "Taegwan-Arbeitssystem"
  KOR_daan_gongzuo_tixi_desc: "Das Leitungsrecht der Fabriken muss in den Händen der Partei liegen. Wir werden das „Taegwan-Arbeitssystem“ einführen, das Ein-Personen-Verantwortungssystem der Fabrikdirektoren abschaffen und das Parteikomitee als Kern der kollektiven Führung in Unternehmen etablieren. Vorgesetzte helfen Untergebenen, Experten helfen Arbeitern und Politik wird mit Technologie kombiniert, um das maximale Produktionspotenzial anzuregen."
  KOR_qinglishan_fangfa: "Chongsanri-Methode"
  KOR_qinglishan_fangfa_desc: "Kader können keine Befehle erteilen, während sie in Büros sitzen. Wir werden die „Chongsanri-Methode“ fördern, die von Kadern auf allen Ebenen verlangt, tief an der Basis vorzudringen, auf die Felder zu gehen, zu essen, mit den Massen zu leben und zu arbeiten, Probleme vor Ort zu entdecken und zu lösen. Dies ist ein konkreter Ausdruck dafür, dass unsere Partei an der Massenlinie festhält und sich der Bürokratie widersetzt."
  KOR_fensan_gongye_buju: "Dezentrales Industrielayout"
  KOR_fensan_gongye_buju_desc: "Alle Eier in einen Korb zu legen ist gefährlich. Angesichts der imperialistischen militärischen Bedrohung müssen wir eine dezentralisierte Industriestruktur übernehmen. Errichten Sie neue Industriestandorte im Landesinneren und in Berggebieten, um mehrere unabhängige Wirtschaftszonen zu bilden. Selbst wenn einige Gebiete angegriffen werden, kann das gesamte Industriesystem des Landes weiterhin funktionieren."
  KOR_xichuan_shuidianzhan: "Wasserkraftwerk Hicheon"
  KOR_xichuan_shuidianzhan_desc: "Elektrizität ist das Lebenselixier der Industrie. Um das gravierende Problem der Stromknappheit zu lösen, sind wir entschlossen, in Hicheon ein beispielloses großes Wasserkraftwerk zu bauen. Dies ist nicht nur ein Energieprojekt, sondern auch ein Kampf um die Eroberung der Natur mit Willen und Glauben, der zu einem glorreichen Symbol der Überlegenheit unseres Systems werden wird."
  KOR_dier_jingji: "Zweite Wirtschaft"
  KOR_dier_jingji_desc: "Um den Bedürfnissen des nationalen Verteidigungsaufbaus Priorität einzuräumen, ist es für uns notwendig, ein von der Zivilwirtschaft unabhängiges „Second Economy“-System einzurichten. Dieser direkt vom Militär kontrollierte Wirtschaftssektor wird für die Produktion und Forschung und Entwicklung der Militärindustrie verantwortlich sein und sicherstellen, dass unsere Armee die Ressourcen mit der höchsten Priorität und die beste Ausrüstung erhalten kann."
  KOR_guojia_jihua_weiyuanhui: "Staatliche Planungskommission"
  KOR_guojia_jihua_weiyuanhui_desc: "Der freie Markt ist eine Brutstätte von Chaos und Ausbeutung, und nur Planung kann Rationalität und Gerechtigkeit bringen. Wir werden eine mächtige staatliche Planungskommission einrichten, die zum „Generalstab“ der Volkswirtschaft wird und für die Formulierung und Umsetzung nationaler Wirtschaftspläne sowie die einheitliche Zuweisung aller wichtigen Ressourcen verantwortlich ist."
  KOR_lianjie_xiboliya_tielu: "Anschluss an die Transsibirische Eisenbahn"
  KOR_lianjie_xiboliya_tielu_desc: "Die Erschließung der Stahlader nach Norden ist von großer strategischer Bedeutung. Die Verbindung unseres Eisenbahnnetzes mit der Transsibirischen Eisenbahn der Sowjetunion wird uns nicht nur eine stabile Unterstützung durch die Sowjetunion sichern, sondern uns auch eng mit dem gesamten sozialistischen Lager verbinden und einen unzerstörbaren strategischen Rücken bilden."
  KOR_lianjia_de_baku_shiyou: "Günstiges Baku-Öl"
  KOR_lianjia_de_baku_shiyou_desc: "Unsere Industriewagen benötigen ausreichend Treibstoff. Durch freundschaftliche Beratungen mit dem großen sowjetischen älteren Bruder werden wir billiges Öl aus den Baku-Ölfeldern zu einem „brüderlichen Preis“ beziehen. Dieses kostbare Industrieblut wird unseren Traktoren und Panzern unendliche Kraft verleihen und unsere Modernisierungsbemühungen erheblich beschleunigen."
  KOR_yaoqing_sulian_zhuanjia: "Einladung sowjetischer Experten"
  KOR_yaoqing_sulian_zhuanjia_desc: "Technologische Lücken können durch bescheidenes Lernen geschlossen werden. Wir werden ausgiebig erfahrene sowjetische Experten einladen, um unseren Industriebau zu leiten. Sie werden nicht nur fortschrittliche Technologien und Zeichnungen mitbringen, sondern auch wertvolle Erfahrungen im sozialistischen Aufbau und uns dabei helfen, viele Umwege zu vermeiden."
  KOR_yaoqing_sulian_zhuanjia_tt: "Sowjetische Experten werden uns ein tiefgreifendes Verständnis einer Technologie vermitteln, die sie §Yerforscht§!, wir aber §Ynicht erforscht haben§!."
  KOR_jishu_yinjin: "Einführung in die Technologie"
  KOR_jishu_yinjin_desc: "Es ist unmöglich, ein Land hinter verschlossenen Türen aufzubauen. Wir müssen gezielt dringend benötigte Spitzentechnologien und komplette Ausrüstungssätze aus Bruderländern einführen. Durch Einführung, Verdauung, Absorption und Neuinnovation können wir auf den Schultern von Giganten stehen und schneller unser eigenes komplettes Industriesystem aufbauen."
  KOR_binhai_bianjiang_maoyi: "Grenzhandelsabkommen von Primorje"
  KOR_binhai_bianjiang_maoyi_desc: "Die Entwicklung des Grenzhandels mit der sowjetischen Region Primorje ist für beide Seiten von großem Nutzen. Wir können unsere Agrar- und Leichtindustrieprodukte gegen dringend benötigtes Holz, chemische Düngemittel und Maschinen eintauschen. Dies wird unseren Grenzgebieten Wohlstand bringen und unsere freundschaftlichen Beziehungen mit dem großen nördlichen Nachbarn weiter festigen."
###############################  Blue  #################################
  KOR_ziyou_shi_lanse: "Blauer Mugunghwa"
  KOR_ziyou_shi_lanse_desc: "Mugunghwa ist ein Symbol für die Beharrlichkeit unserer Nation. Wir werden ihm eine neue Bedeutung verleihen – die blauen Blütenblätter stehen für Demokratie, Freiheit und Frieden. Dieses Konzept wird uns dabei leiten, ein offenes, wohlhabendes modernes Land aufzubauen und die Blume der Freiheit auf der koreanischen Halbinsel für immer erblühen zu lassen."
  KOR_quanguo_saomang_yundong: "Nationale Alphabetisierungskampagne"
  KOR_quanguo_saomang_yundong_desc: "Ein Land voller Analphabeten kann keine wahre Stärke erreichen. Wir müssen eine landesweite Alphabetisierungskampagne starten, um es jedem Bürger, unabhängig vom Alter, zu ermöglichen, die Fähigkeit zu lesen und zu schreiben. Die Popularisierung des Wissens wird die solideste Grundlage für unseren Industrialisierungs- und Demokratisierungsprozess legen."
  KOR_puji_yiwu_jiaoyu: "Gründung nationaler Universitäten"
  KOR_puji_yiwu_jiaoyu_desc: "Die Zukunft des Landes liegt in der nächsten Generation mit unabhängiger Denkfähigkeit. Wir werden Ressourcen in die Gründung der ersten nationalen Universität investieren, die uns wirklich gehört. Es wird eine Wiege des freien Denkens und ein Palast des wissenschaftlichen Geistes werden und kontinuierlich die Säulen kultivieren, die für den Aufbau der neugeborenen demokratischen Republik erforderlich sind."
  KOR_baifansixiang_yanjiuyuan: "Neuorganisation des „Koreanischen Patriotischen Korps“"
  KOR_baifansixiang_yanjiuyuan_desc: "Im Zeitalter der Befreiung schockierte die Leistung des Patrioten Yoon Bong-gil die Welt. Um auf versteckte Feinde im In- und Ausland zu reagieren, werden wir den Willen von Herrn Baekbeom übernehmen und das „Koreanische Patriotische Korps“ neu organisieren. Diese treuesten Patrioten werden zum schärfsten Dolch in unseren Händen und bereit, alles zu opfern, um die nationale Würde und Unabhängigkeit zu verteidigen."
  KOR_jishuguanliao_de_jueqi: "Aufstieg der Technokraten"
  KOR_jishuguanliao_de_jueqi_desc: "Der Aufbau eines modernen Landes erfordert Fachwissen und keine leeren politischen Parolen. Wir werden mit Stereotypen brechen und mutig eine Gruppe von Experten und Wissenschaftlern mit höherer Bildung und Kenntnissen in Wirtschaft und Industrie einsetzen, um das Land zu verwalten. Der Aufstieg der Technokraten wird unsere Verwaltungseffizienz und den wissenschaftlichen Charakter der Entscheidungsfindung erheblich verbessern."
  KOR_Lee_Byungchul1_tt: "Ernennen Sie §Y$KOR_Lee_Byungchul$§!"
  KOR_jishuguanliao_de_jueqi1_tt: "Die Eigenschaften von §Y$KOR_Lee_Byungchul$§! werden verbessert"
  KOR_jishuguanliao_de_jueqi_tt: "Zusätzliche Effekte für die folgenden Industriesektoren:\n§Y$KOR_hanguo_sanxingdianzi_ideas_1$§!：$electronics_research$：§G+10%§!，$modifier_production_speed_industrial_complex_factor$：§G+10%§!，$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$：§G+10%§!"
  KOR_jishuguanliao_de_jueqi2_tt: "Chaebols werden mit größerer Wahrscheinlichkeit hochwertige Gebäude bauen, wie z. B. §Yzivile Fabriken§!, §YMilitärfabriken§!, §YWerften§! und §Yzusätzliche Bauplätze§!"
  KOR_jianli_zhongyang_yinhang: "Gründung einer Zentralbank"
  KOR_jianli_zhongyang_yinhang_desc: "Ein unabhängiges Land muss sein eigenes finanzielles „Herz“ haben. Durch die Einrichtung einer Zentralbank und die Ausgabe eines eigenen gesetzlichen Zahlungsmittels können wir die Geldpolitik des Landes kontrollieren, den Finanzmarkt stabilisieren und den Auswirkungen von ausländischem Kapital widerstehen. Dies ist ein entscheidender Schritt auf dem Weg zur wirtschaftlichen Unabhängigkeit."
  KOR_tudi_gaige_fa: "Landreformgesetz"            #Second Liberation
  KOR_tudi_gaige_fa_desc: "Land bis zum Ackerbau ist die Grundlage für soziale Gerechtigkeit und Stabilität. Wir werden eine friedliche Landreform durchführen, um Land von einer kleinen Anzahl von Grundbesitzern auf Dutzende Millionen landloser Bauern zu verteilen. Dadurch wird die Begeisterung für die landwirtschaftliche Produktion stark angekurbelt und feudale Reste, die zu sozialen Unruhen führen können, grundsätzlich beseitigt."
  KOR_tudi_gaige_fa_tt: "Schalten Sie die Entscheidung frei: §YFühren Sie eine Landreform durch§!, §Y$rural$§! wird zu §Y$town$§!."       
  KOR_minzu_zichan_peiyang: "Kultivierung des nationalen Kapitals"
  KOR_minzu_zichan_peiyang_desc: "Wir können uns nicht ewig auf ausländisches Kapital verlassen. Durch staatliche Unterstützung müssen wir bewusst eine Gruppe patriotischer nationaler Kapitalisten fördern, die zu uns gehört. Sie werden zum Rückgrat der Volkswirtschaft und verteidigen unsere wirtschaftliche Souveränität im Wettbewerb mit ausländischen Unternehmen."
  KOR_zhongxiao_qiye_zhenxing: "Revitalisierung kleiner und mittlerer Industrien"
  KOR_zhongxiao_qiye_zhenxing_desc: "Eine gesunde Wirtschaft kann nicht nur aus großen Unternehmen bestehen. Wir werden kleine und mittlere Industrieunternehmen tatkräftig durch Maßnahmen wie zinsgünstige Kredite sowie Steuerermäßigungen und -befreiungen unterstützen. Sie werden der Gesellschaft zahlreiche Beschäftigungsmöglichkeiten bieten, die Marktdynamik fördern und eine flexible Wirtschaftsstruktur bilden, die die Großunternehmen ergänzt."
  KOR_ziyuan_guo_you_hua: "Verstaatlichung von Ressourcen"
  KOR_ziyuan_guo_you_hua_desc: "Die unterirdischen Bodenschätze des Landes sind Reichtum aller Bürger und dürfen nicht in die Hände von Privatpersonen oder ausländischem Kapital fallen. Wir werden Gesetze zur Verstaatlichung aller wichtigen natürlichen Ressourcen erlassen, die vom Staat einheitlich geplant und ausgebeutet werden, um sicherzustellen, dass diese wertvollen Ressourcen den allgemeinen strategischen Interessen des Landes dienen können."
  KOR_tuiguang_nongcun_hezuoshe: "Förderung ländlicher Genossenschaften"
  KOR_tuiguang_nongcun_hezuoshe_desc: "Die verstreute kleinbäuerliche Wirtschaft kann den Risiken nur schwer widerstehen und kann sich nicht an die Erfordernisse der Modernisierung anpassen. Wir werden die Landwirte dazu ermutigen und anleiten, Produktions-, Liefer- und Vermarktungs- sowie Kreditgenossenschaften zu gründen, die Produktionseffizienz durch gegenseitige Unterstützung zu verbessern, die Verhandlungsmacht gegenüber dem Markt zu stärken und die Lebensbedingungen in ländlichen Gebieten schrittweise zu verbessern."
  KOR_xiufu_fuzhan_shuiku: "Wiederherstellung des Pujon-Stausees"
  KOR_xiufu_fuzhan_shuiku_desc: "Der Pujon-Stausee war während der Kolonialzeit eine wichtige Stromquelle, wurde jedoch im Krieg schwer beschädigt. Die Wiederherstellung und Erweiterung dieser großen Wassersparanlage wird nicht nur den dringend benötigten Strom für unseren industriellen Wiederaufbau liefern, sondern auch die Entschlossenheit und Fähigkeit unserer Nation symbolisieren, die Wunden des Krieges aus eigener Kraft zu heilen."
  KOR_shenbushier_yundong: "„Sinsabori“-Bewegung"
  KOR_shenbushier_yundong_desc: "Unser Körper und das Land, in dem wir aufwachsen, sind ein untrennbares Ganzes. Wir werden eine nationale „Sinsabori“-Bewegung ins Leben rufen und uns dafür einsetzen, dass die Bürger in unserem Land produzierte Agrarprodukte konsumieren, um die heimische Landwirtschaft zu unterstützen und die Ernährungssicherheit zu gewährleisten. Dies ist nicht nur eine Wirtschaftsstrategie, sondern auch ein tiefgreifender Ausdruck des Patriotismus."
  KOR_xincunyundong_de_chuxing: "Embryo der New Village-Bewegung"
  KOR_xincunyundong_de_chuxing_desc: "Die Rückständigkeit der ländlichen Gebiete ist das größte Defizit der nationalen Entwicklung. Unter dem Motto „Fleiß, Eigenständigkeit und Zusammenarbeit“ werden wir eine Massenbewegung starten, um die ländliche Landschaft zu verändern. Durch die Verbesserung des Lebensumfelds und den Bau von Landstraßen werden wir das Bewusstsein der Landwirte für die Modernisierung wecken und den Grundstein für die künftige größere „Neue Dorfbewegung“ legen."
  KOR_meiyuan_yilai_jingji: "US-Hilfeabhängige Wirtschaft"
  KOR_meiyuan_yilai_jingji_desc: "Die Hilfe der Vereinigten Staaten ist eine Lebensader für den Wiederaufbau nach dem Krieg, kann aber auch zu einer Krücke werden, die wir niemals loswerden können. Mehl, Baumwolle und US-Dollar helfen uns, Schwierigkeiten zu überbrücken, doch sie verzerren auch unsere Wirtschaftsstruktur und wirken sich auf die nationalen Industrien aus. Das ist ein bitterer Wein, den wir trotzdem trinken müssen."
  KOR_meiyuan_yilai_jingji_tt: "Schalten Sie die Auflösung des §YUS-Hilfsdarlehens§! frei. [ROOT.GetNonIdeologyName] gewinnt:\n$KOR_international_loan_modifier_tt$"
  KOR_international_loan_modifier_tt: "Erhalten Sie §Y$KOR_international_loan_modifier$§!, was die folgenden Auswirkungen hat:\nTägliche politische Machtkosten: §R+10,0 %§!\nRessource\nAkquisitionseffizienz: §G+5,0 %§!\nBaugeschwindigkeit: §G+4,0 %§!\nFabrikleistung: §G+6.0%§!\nDockyard Output: §G+6.0%§!"
  KOR_caifa_de_dansheng: "Geburt der Chaebols"
  KOR_caifa_de_dansheng_desc: "Um die Industrialisierung in kürzester Zeit zu erreichen, müssen wir unsere Ressourcen bündeln, um Großes zu erreichen. Der Staat wird eine Reihe vielversprechender Unternehmen auswählen, ihnen umfassende Politik, Finanzierung und Marktunterstützung bieten und sie zu großen, umfassenden Unternehmensgruppen – „Chaebols“ – entwickeln, die in der Lage sind, am internationalen Wettbewerb teilzunehmen. Das ist der Kern unserer Aufholstrategie."
  KOR_Lee_Byungchul_tt: "§Y$KOR_Lee_Byungchul$§! als Berater, §Rkann nicht entlassen werden§!"
  KOR_caifa_de_dansheng_tt: "Die Chaebols werden mit dem Bau von Gebäuden in unserem Land beginnen"
  KOR_junshi_youxian_jingji: "Militärische Wirtschaft"
  KOR_junshi_youxian_jingji_desc: "In einem gefährlichen Umfeld, das von mächtigen Feinden umgeben ist, ist wirtschaftliche Entwicklung ohne eine starke Landesverteidigung leeres Gerede. Wir müssen begrenzte Ressourcen für die Verteidigungsindustrie und den Militärbau priorisieren. Eine scheinbar verzerrte „Militär-zuerst“-Wirtschaft ist für uns die einzige Möglichkeit, in dieser dschungelähnlichen Welt zu überleben."
  KOR_kuojian_fushan_renchuan_gang: "Erweitern Sie die Häfen von Busan und Incheon"
  KOR_kuojian_fushan_renchuan_gang_desc: "Als Land auf einer Halbinsel ist das Meer unsere Lebensader. Die groß angelegte Erweiterung unserer beiden großen Häfen Busan und Incheon wird nicht nur unsere internationale Handelsumschlagskapazität erheblich steigern, sondern auch die notwendige Heimathafenunterstützung für unseren künftigen Aufbau einer starken Marine bieten, die als Grundlage für unseren Marsch in Richtung Ozean dienen wird."
  KOR_meihan_jingji_xieding: "Wirtschaftsabkommen zwischen den USA und Südkorea"
  KOR_meihan_jingji_xieding_desc: "Um die US-Hilfe und -Investitionen in rechtlicher Form zu stabilisieren, müssen wir ein umfassendes Abkommen über wirtschaftliche Zusammenarbeit mit Washington unterzeichnen. Dieses Abkommen wird uns den US-Markt öffnen und wichtige Technologietransfers sichern und so den Weg für unseren wirtschaftlichen Aufschwung ebnen, auch wenn es möglicherweise einige Kompromisse bei unserer Souveränität erfordert."
  KOR_hanjiang_qiji: "Wunder am Han-Fluss"
  KOR_hanjiang_qiji_desc: "Um die US-Hilfe und -Investitionen in rechtlicher Form zu stabilisieren, müssen wir ein umfassendes Abkommen über wirtschaftliche Zusammenarbeit mit Washington unterzeichnen. Dieses Abkommen wird uns den US-Markt öffnen und wichtige Technologietransfers sichern und so den Weg für unseren wirtschaftlichen Aufschwung ebnen, auch wenn es möglicherweise einige Kompromisse bei unserer Souveränität erfordert."
  KOR_hanjiang_qiji_tt: "Die Hauptstadt wird §Y“$KOR_Seoul_Special_City$“§! heißen"
  KOR_Seoul_Special_City: "Seoul"
  KOR_baifan_de_lixiangguo: "Baekbeoms ideale Nation"
  KOR_baifan_de_lixiangguo_desc: "Unser Ziel ist es, nicht nur ein wohlhabendes und mächtiges Land aufzubauen, sondern auch eines mit den höchsten kulturellen Errungenschaften – das ist das ultimative Ideal von Herrn Baekbeom. In diesem Land übertrifft die Macht der Kultur alles andere, die Menschen sind höflich und die Gesellschaft ist voller Gerechtigkeit. Wir werden unser ganzes Leben lang danach streben, dieses erhabene Ideal einer Nation zu verwirklichen."
  KOR_sanjun_zhuyi: "Drei-Gleichheits-Doktrin"
  KOR_sanjun_zhuyi_desc: "Die „Drei-Gleichheits-Doktrin“ ist das grundlegende Verfassungsprinzip unseres Nation-Buildings. Durch „Gleiches Land“ erkennen wir, dass diejenigen, die das Land bebauen, es besitzen; durch „Gleichberechtigung“ erreichen wir das allgemeine Wahlrecht und die politische Gleichheit der Menschen; Durch „Equal Education“ realisieren wir einen gleichberechtigten Zugang zu nationalen Bildungschancen. Diese drei grundlegenden nationalen Politiken werden gemeinsam eine faire, gerechte und harmonische ideale Gesellschaft aufbauen."
  KOR_jianli_lianzheng_gongshu: "Richten Sie die unabhängige Kommission gegen Korruption ein"
  KOR_jianli_lianzheng_gongshu_desc: "Macht ohne Aufsicht führt unweigerlich zu Korruption. Wir werden eine unabhängige Kommission gegen Korruption einrichten, die unabhängig von allen Regierungsstellen ist und ihr die höchste Macht verleiht, korrupte Handlungen zu untersuchen und zu bestrafen. Eine unbestechliche Regierung ist der Grundstein, um das Vertrauen der Menschen zu gewinnen und langfristige nationale Stabilität zu gewährleisten."
  KOR_funv_quanli_baozhang: "Schutz der Frauenrechte"
  KOR_funv_quanli_baozhang_desc: "Die Haltung einer Nation gegenüber Frauen kennzeichnet den Grad ihrer Zivilisation. Wir werden Gesetze erlassen, um alle feudalen Überreste der Diskriminierung von Frauen vollständig abzuschaffen und Frauen in allen Bereichen, einschließlich Politik, Wirtschaft und Bildung, die gleichen Rechte wie Männern zu garantieren. Die Emanzipation der „anderen Hälfte des Himmels“ wird der nationalen Entwicklung grenzenlose Vitalität verleihen."
  KOR_difang_izhi_faan: "Gesetz über die lokale Autonomie"
  KOR_difang_izhi_faan_desc: "Demokratie ist an der Basis verwurzelt. Wir werden das Kommunalautonomiegesetz verkünden, einen Teil der Macht und der Steuerressourcen an die Kommunalverwaltungen übertragen und Direktwahlen für Kommunalräte und Gemeindevorsteher durchführen. Dadurch wird die Fähigkeit des Volkes, sich an der Politik zu beteiligen, stark beansprucht und die Demokratie kann auf jedem Zentimeter der koreanischen Halbinsel Fuß fassen und gedeihen."
  KOR_tuiguang_meili_de_guojia: "Fördern Sie das Konzept „Schönes Land“."
  KOR_tuiguang_meili_de_guojia_desc: "Ein mächtiges Land muss nicht nur über eine starke militärische Macht, sondern auch über eine starke kulturelle Anziehungskraft verfügen. Wir werden das kulturelle Konzept eines „schönen Landes“ fördern und unser nationales Bild einer friedliebenden und kulturverehrenden Nation durch Kunst, Literatur und Bildung prägen und so den Respekt der Welt gewinnen."
  KOR_lishi_shencha_weiyuanhui: "Ausschuss für historische Überprüfung"
  KOR_lishi_shencha_weiyuanhui_desc: "Die Geschichte kann nicht manipuliert werden, und die Gerechtigkeit kann nicht verzögert werden. Ziel der Einrichtung des Historical Review Committee ist es, die Geschichte der Kolonialzeit umfassend und unparteiisch zu untersuchen und insbesondere jene „pro-japanischen Fraktionen“ zur Rechenschaft zu ziehen, die die Nation verraten haben. Nur wenn wir uns der Vergangenheit stellen und sie bewältigen, kann unsere Nation geeint in die Zukunft blicken."
  KOR_huifu_minzu_wenzi_yu_yuyan: "Landessprache und Charaktere wiederherstellen"
  KOR_huifu_minzu_wenzi_yu_yuyan_desc: "Sprache und Charaktere sind die Seele einer Nation. Wir werden eine Wiederbelebung der Nationalsprache und der nationalen Charaktere ins Leben rufen, sprachliche Überreste der Kolonialzeit beseitigen, unser Hangul fördern und standardisieren und die Sprache, die unsere 5.000-jährige Geschichte trägt, erneut zur Quelle unserer nationalen Identität und unseres Stolzes machen."
  KOR_qingnian_aiguo_tuan: "Patriotisches Jugendkorps"
  KOR_qingnian_aiguo_tuan_desc: "Die Jugend ist die Zukunft und Hoffnung des Landes. Wir werden ein nationales „Jugend-Patriotisches Korps“ bilden, um unter der großen Zahl junger Menschen Patriotismus, Nationalgeist und militärische Fähigkeiten zu fördern. Dieses dynamische Team wird für uns die zuverlässigste Reservetruppe zur Verteidigung und zum Aufbau des Landes sein."
  KOR_minzu_hejie_weiyuanhui: "Nationales Versöhnungskomitee"
  KOR_minzu_hejie_weiyuanhui_desc: "Konflikte zwischen links und rechts, Spaltungen zwischen Nord und Süd haben unserer Nation zu viele Narben zugefügt. Ziel der Einrichtung des Nationalen Versöhnungskomitees ist der Aufbau einer Dialogplattform zur Lösung interner Konflikte und zur Förderung der nationalen Einheit. Wir sind der festen Überzeugung, dass sie, solange sie patriotische Landsleute sind, unabhängig von ihren ideologischen Unterschieden, unter dem Banner der Vereinigung die Hände reichen sollten."
  KOR_minzu_hejie_weiyuanhui_tt: "Einige §YCommunist§! Berater und Generäle werden verfügbar sein"
  KOR_baozheng_yanlun_jihui_ziyou: "Rede- und Versammlungsfreiheit garantieren"
  KOR_baozheng_yanlun_jihui_ziyou_desc: "Ein gesundes Land kann nicht nur eine Stimme haben. Wir werden die Meinungs-, Presse-, Versammlungs- und Vereinigungsfreiheit der Menschen durch die Verfassung wirksam garantieren. Kritik und Aufsicht des Volkes sind die besten Schutzmittel, um zu verhindern, dass die Regierung in Richtung Autokratie und Korruption übergeht, und sind auch ein Ausdruck gesellschaftlicher Vitalität."
  KOR_jiechu_wuzhuang_zhengzhi: "Bewaffnete Politik abschaffen"
  KOR_jiechu_wuzhuang_zhengzhi_desc: "In einer neu gegründeten Nation darf keine politische Partei oder Fraktion über eigene private Streitkräfte verfügen. Der Staat muss alle legitime Gewalt monopolisieren. Wir werden entschlossene Maßnahmen ergreifen, um alle nichtstaatlichen bewaffneten Gruppen zu entwaffnen und sicherzustellen, dass das Militär nur dem Staat und dem Volk gegenüber loyal ist und nicht gegenüber irgendeiner politischen Fraktion."
  KOR_wenguan_zhengfu_de_queli: "Bildung einer Zivilregierung"
  KOR_wenguan_zhengfu_de_queli_desc: "Die Pflicht des Militärs besteht darin, das Land zu verteidigen, nicht darin, es zu regieren. Wir müssen das Grundprinzip der „zivilen Regierungsführung“ etablieren, die Rückkehr der Soldaten in ihre Kasernen ermöglichen und die staatliche Verwaltungsgewalt einer durch demokratische Verfahren gewählten Zivilregierung übertragen. Dies ist ein wichtiges Symbol dafür, dass sich das Land in Richtung Normalisierung und Reife bewegt."
  KOR_hongyi_renjian_de_zhengzhi: "Politik von Hongik Ingan"
  KOR_hongyi_renjian_de_zhengzhi_desc: "„Hongik Ingan“ – sich dem Wohl der gesamten Menschheit zu widmen – ist seit der Antike das Gründungsideal unserer Nation. Unsere Politik sollte nicht nur den Wohlstand und die Stärke unseres eigenen Landes verfolgen, sondern auch darauf abzielen, „zum Zusammenleben und zum gemeinsamen Wohlstand der Menschheit beizutragen“. Diese hohe politische Philosophie wird uns ein hohes internationales Ansehen einbringen."
  KOR_guangfujun_jingshen: "Geist der Befreiungsarmee"
  KOR_guangfujun_jingshen_desc: "Unser Militär erbt die glorreiche Tradition der „Befreiungsarmee“, die im Widerstandskrieg gegen Japan auf dem chinesischen Schlachtfeld fortbestand. Wir werden den unbezwingbaren und patriotischen Geist der „Befreiungsarmee“ als die Seele des Militärs betrachten und unsere Armee zu einer mächtigen und mächtigen Streitmacht mit festem patriotischem Willen und starker Kampfkraft aufbauen."
  KOR_quanmin_fangyu_xueshuo: "Doktrin der totalen nationalen Verteidigung"
  KOR_quanmin_fangyu_xueshuo_desc: "Angesichts der zahlenmäßigen Überlegenheit potenzieller Feinde müssen wir das gesamte Land in eine uneinnehmbare Festung verwandeln. Die Umsetzung der „Total National Defense“-Doktrin bedeutet, dass jeder Bürger ein Soldat und jeder Zentimeter Land ein Schlachtfeld ist. Sobald der Feind einmarschiert, wird er in einem riesigen Ozean des Volkskrieges gefangen sein."
  KOR_shandi_youji_chuancheng: "Erbe des Gebirgsguerillakriegs"
  KOR_shandi_youji_chuancheng_desc: "Das bergige Gelände der koreanischen Halbinsel ist ein natürlicher Schauplatz für Guerillakriege. Unser Militär wird die wertvollen Erfahrungen aus dem Manövrieren gegen den Feind in Bergwäldern während der antijapanischen Zeit übernehmen und weitertragen, unsere Soldaten zu Experten im Gebirgskrieg ausbilden und flexible und mobile Guerillataktiken anwenden, um jeden mächtigen Feind niederzuschlagen."
  KOR_yubeiyi_dongyuan_tixi: "Reservemobilisierungssystem"
  KOR_yubeiyi_dongyuan_tixi_desc: "Wir können in Friedenszeiten kein großes stehendes Heer unterhalten. Daher ist die Einrichtung eines effizienten Reservemobilisierungssystems von entscheidender Bedeutung. Alle gesunden, pensionierten Männer werden in die Reservekräfte aufgenommen und erhalten eine regelmäßige Ausbildung. Sobald ein Krieg ausbricht, können wir in kürzester Zeit Millionen von Truppen mobilisieren."
  KOR_fangong_jianguo_gangling: "Antikommunistische Gründungsplattform"
  KOR_fangong_jianguo_gangling_desc: "Der Kommunismus ist ein Teufel, der unsere Freiheit, Demokratie und Traditionen untergräbt. Wir werden „Antikommunismus“ als grundlegende nationale Politik betrachten und eine solide Verteidigungslinie auf allen Ebenen aufbauen – ideologisch, politisch und sozial. Jegliche Worte oder Taten, die mit dem Kommunismus sympathisieren oder ihn propagieren, werden als Verrat am Land betrachtet und hart durchgegriffen."
  KOR_quanguo_huji_denglu: "Nationale Haushaltsregistrierung"
  KOR_quanguo_huji_denglu_desc: "Um das Land effektiv zu regieren, Ressourcen zu verteilen und die soziale Ordnung aufrechtzuerhalten, müssen wir ein strenges landesweites Haushaltsregistrierungssystem einrichten. Detaillierte Informationen zu jedem Bürger werden erfasst. Dies wird die sozialen Kontrollmöglichkeiten des Staates erheblich verbessern und Saboteuren keinen Platz mehr zum Verstecken lassen."
  KOR_minzujingshen_gaizao: "Transformation des Nationalgeistes"
  KOR_minzujingshen_gaizao_desc: "Die langjährige Kolonialherrschaft und die rückständige feudale Ideologie haben den Kampfgeist unserer Nation untergraben. Wir müssen eine „Umwandlung des Nationalgeistes“ von oben nach unten ins Leben rufen, Unterwürfigkeit, Faulheit und Konservatismus ausmerzen und den Menschen neuen Geist der Loyalität, des Gehorsams und der Modernisierung einflößen, um die gesamte Nation zu einem unzerbrechlichen Stück Stahl zu formen."
  KOR_guojia_anbao_fa: "Verabschiedung des National Security Act" #Korean Central Intelligence Agency (KCIA)
  KOR_guojia_anbao_fa_desc: "Das Land befindet sich in einem kritischen Moment interner und externer Probleme und es müssen außergewöhnliche Maßnahmen ergriffen werden. Durch die Verabschiedung des National Security Act erhalten die Regierung und die Geheimdienste Befugnisse, die über die herkömmlichen Gesetze hinausgehen, um Organisationen oder Einzelpersonen zu „verhindern“ und zu „eliminieren“, die die nationale Sicherheit gefährden könnten. Dies ist ein notwendiges Übel, um die Stabilität aufrechtzuerhalten."
  KOR_qianghua_qingbao_jiguan: "Geheimdienste stärken"
  KOR_qianghua_qingbao_jiguan_desc: "In einer Welt voller Kriege voller Spione und Verschwörungen ist ein starker Geheimdienst die Garantie für das nationale Überleben. Wir werden keine Kosten scheuen, um ein Geheimdienstimperium aufzubauen, das zu strenger interner Überwachung und effektiver externer Infiltration fähig ist. Das Schwert im Dunkeln wird das Licht des Landes bewachen."
  KOR_suqing_chise_fenzi: "Verbleibende rote Elemente entfernen"
  KOR_suqing_chise_fenzi_desc: "Das Gespenst des Kommunismus schwebt über der Halbinsel. Wir können nicht die geringste Gnade zeigen. Eine landesweite Bewegung zur „Säuberung der roten Elemente“ steht kurz vor dem Start. Das Militär, die Polizei und die patriotische Jugend werden Maßnahmen ergreifen, um alle kommunistischen Sympathisanten und Eindringlinge aus unserer Gesellschaft zu vertreiben."
  KOR_NanLao_Party_Congress_Incident_flag: "Der Vorfall auf dem Kongress der South Labour Party ist beendet"
  KOR_suqing_chise_fenzi_tt: "§YDurch die Auswahl dieser nationalen Richtlinie wird die $KOR_Communist_uprising_mission$-Mission beendet.§!"
  KOR_jidu_jiao_liguo_lun: "Christliche Nation-Building-Theorie"
  KOR_jidu_jiao_liguo_lun_desc: "Im Kampf gegen die Kolonialherrschaft verlieh der christliche Glaube unseren Nationalisten enorme spirituelle Kraft. Jetzt werden wir einen Schritt weiter gehen und die christlichen Lehren als moralische und rechtliche Grundlage unseres Landes betrachten und ein von Gott gesegnetes irdisches Königreich aufbauen, um dem atheistischen Kommunismus entgegenzutreten."
  #####Easter Egg - Christianity
  KOR_jidu_zhujiaojueduan: "Pastoralstab und Zepter"
  KOR_jidu_zhujiaojueduan_desc: "Die Kirche muss aus dem Heiligtum heraustreten und im Namen Gottes die Autorität übernehmen, um die zusammenbrechende Ordnung zu stabilisieren. Dies ist Gottes Prüfung und auch die heilige Verantwortung, der sich Bischöfe nicht entziehen können. Erzbischof $JKO_Archbishop_Roh_Paul$ wird die Seele dieses Landes mit eiserner Faust und Glauben neu gestalten."
  KOR_jidu_llaizi_luoma_de_xinjian: "Segen aus Rom"
  KOR_jidu_llaizi_luoma_de_xinjian_desc: "Die Legitimität einer im Fernen Osten entstehenden theokratischen Regierung wird von der säkularen Welt in Frage gestellt. Um diese neue, aber fragile Herrschaft zu festigen, müssen wir den persönlichen Segen des Obersten Papstes der katholischen Kirche – des Papstes in Rom – erhalten."
  KOR_jidu_jidu_qingniantuan: "Christliches Jugendkorps"
  KOR_jidu_jidu_qingniantuan_desc: "Die Zukunft des Landes liegt in der Loyalität der nächsten Generation. Wir werden das christliche Jugendkorps gründen und ihren jungen Seelen sowohl Glauben als auch Patriotismus einflößen. Sie werden das Kreuz und das Schwert halten und zum stärksten Eckstein zur Verteidigung des irdischen Himmelreichs werden."
  KOR_jidu_qidao_yu_laodong: "Gebet und Arbeit"
  KOR_jidu_qidao_yu_laodong_desc: "In Anlehnung an die alten Lehren des Heiligen Benedikt wird „Ora et Labora (Bete und Arbeit)“ zum Glaubensbekenntnis unseres Landes werden. Der Schweiß des Volkes ist ein Gebet an Gott, und der Lärm der Fabriken ist ein Lobgesang auf den Herrn. Jede harte Arbeit ist ein Baustein für den Aufbau des irdischen Himmelreichs."
  KOR_dongfang_de_weidui: "Schweizergarde des Ostens"
  KOR_dongfang_de_weidui_desc: "Nach dem Vorbild des Heiligen Stuhls in Rom werden wir eine Elitetruppe absoluter Loyalität bilden. Sie werden die persönlichen Streitkräfte des Bischofs sein, der solide Schild und die Hellebarde des Glaubens, die schwören, das irdische Himmelreich und seinen Hirten bis zum Tod zu verteidigen und jeden auszurotten, der es wagt, die Theokratie in Frage zu stellen."
  KOR_dongfang_de_weidui_tt: "$KOR_Christian_Church_modifiers$\n$ITA_modern_musculus_dynamic_modifier_tt$\n\n"
  KOR_jidu_kongtian_qishi: "Ritter des Himmels"
  KOR_jidu_kongtian_qishi_desc: "Unsere Piloten sind nicht nur Soldaten, sondern auch vom Himmel beauftragte „Ritter des Himmels“. Ihre Kampfjets sind eiserne Flügel, die göttliche Strafe vollstrecken, und jeder Sturzflug ist ein Urteil über Ketzer. Sie werden im Namen Gottes den Feinden in der Luft über den Wolken Zerstörung bringen."
  #####
  KOR_qingnian_fangong_lianmeng: "Antikommunistische Jugendliga"
  KOR_qingnian_fangong_lianmeng_desc: "Die Jugend ist die frische Kraft im antikommunistischen Kampf. Wir werden eine nationale „Antikommunistische Jugendliga“ gründen, sie mit einer festen antikommunistischen Ideologie ausrüsten und sie zu Vorhuten in Straßenkämpfen gegen rote Elemente und zur Aufdeckung „gefährlicher Gedanken“ auf dem Campus ausbilden. Die Zukunft des Landes muss von ihnen verteidigt werden."
  KOR_qingxi_linshi_zhengfu: "Säubern Sie die Oppositionskräfte"
  KOR_qingxi_linshi_zhengfu_desc: "In den Reihen der Revolutionäre tummeln sich Opportunisten und Dissidenten. Diese Leute aus der Opposition mit veralteten Ideen und fragmentierten Fraktionen sind zu Hindernissen für unseren Aufbau eines starken und einheitlichen Führungskerns geworden. Eine politische Säuberung ist notwendig, um die absolute Autorität des Führers zu festigen."
  KOR_yimin_zhu_yi: "Ein-Volk-Doktrin"
  KOR_yimin_zhu_yi_desc: "Der Staat, die Nation und das Volk sind eine Dreieinigkeit und untrennbar miteinander verbunden. Unter dem Banner der „One People Doctrine“ sollten sich alle Bürger um den alleinigen Führer vereinen und alles den höchsten Interessen des Staates und der Nation widmen. Individualismus und die Ideologie des Klassenkampfes sind Häresien, die beseitigt werden müssen."
  KOR_difang_quanli_xueruo: "Schwächung der lokalen Macht"
  KOR_difang_quanli_xueruo_desc: "Ein mächtiges Land muss über eine zentralisierte Autorität verfügen, die bis zum Ende umgesetzt werden kann. Wir werden die den Kommunalverwaltungen übertragene Macht nach und nach zurückerobern, Kommunalwahlen abschaffen und alle Kommunalvorsteher direkt von der Zentralregierung ernennen. Nur so kann der Wille des Staates auf jedem Quadratzentimeter Land kompromisslos umgesetzt werden."
  KOR_jinji_zhuangtai_fa: "Gesetz über den Ausnahmezustand"
  KOR_jinji_zhuangtai_fa_desc: "Das Land steht vor einem lebenswichtigen „Ausnahmezustand“, und herkömmliche demokratische Verfahren sind nicht mehr anwendbar. Durch dieses Gesetz erhält der Führer alle Befugnisse über die Verfassung hinaus, einschließlich der Auflösung des Parlaments und der Einschränkung der Bürgerrechte. Um das Land zu retten, ist die Diktatur ein notwendiges und einziges Mittel."
  KOR_yongyuan_de_guofu: "[GetLKORYongyuanDeGuofu]"
  KOR_yongyuan_de_guofu_desc: "[GetLKORYongyuanDeGuofuDESC]"
  KOR_yongyuan_de_guofu_1_key: "Ewiger Vater der Nation"
  KOR_yongyuan_de_guofu_1DESC_key: "Die außergewöhnlichen Leistungen von Präsident $KOR_syngman_rhee$ haben das Reich der Sterblichen überschritten. Er ist nicht nur der Gründer des Landes, sondern auch der ewige Vater und Mentor unserer Nation. Wir werden Gesetze erlassen, um den ewigen Status von Präsident $KOR_syngman_rhee$ als „Vater der Nation“ zu etablieren. Seine Ideologie wird für alle Zeiten zum unerschütterlichen Leitprinzip unseres Landes werden, und seine Autorität darf in keiner Weise in Frage gestellt werden."
  KOR_yongyuan_de_guofu_2_key: "Errichte das irdische Himmelreich"
  KOR_yongyuan_de_guofu_2DESC_key: "Die säkulare Republik ist bereits korrupt und jetzt ist es an der Zeit, das Reich Gottes auf Erden zu errichten. Erzbischof No Jin-nam wird der „Regent-Erzbischof“ und verkündet die offizielle Ankunft des „irdischen Himmelreichs“. Daraufhin wird ein brandneues, heiliges Südkorea geboren."

  KOR_yongyuan_de_guofu_tt: "§YDurch die Auswahl dieser nationalen Richtlinie wird die $KOR_constitutional_crisis_mission$-Mission beendet.§!"
  KOR_gonggu_hanmei_fangyu_tiaoyue: "Gegenseitiger Verteidigungsvertrag zwischen den USA und der Republik Korea"
  KOR_gonggu_hanmei_fangyu_tiaoyue_desc: "Angesichts der enormen Bedrohung durch den kommunistischen Block müssen wir ein festes Militärbündnis mit den Vereinigten Staaten, dem Führer der freien Welt, eingehen. Die Unterzeichnung des gegenseitigen Verteidigungsvertrags zwischen den USA und der Republik Korea bedeutet, dass jeder Angriff auf uns als Angriff auf die Vereinigten Staaten angesehen wird. Dies ist die ultimative Garantie unserer nationalen Sicherheit."
  KOR_yaoqing_KMAG: "KMAG einladen"
  KOR_yaoqing_KMAG_desc: "Um ein modernes Militär aufzubauen, brauchen wir die fortschrittlichste militärische Ideologie und Ausbildungsmethoden. Wir werden offiziell US-Offiziere der „Korean Military Advisory Group (KMAG)“ einladen, uns dabei zu helfen, unsere Armee, Marine und Luftwaffe von Grund auf nach westlichen Standards auszubilden und neu zu organisieren."
  KOR_jieshou_meiyuan_zhuangbei: "Erhalten Sie US-Hilfsausrüstung"
  KOR_jieshou_meiyuan_zhuangbei_desc: "Der Geist allein kann keine Schlachten gewinnen. Wir brauchen dringend moderne Waffen und Ausrüstung. Durch das US-Militärhilfeprogramm werden wir eine große Anzahl an Panzern, Artillerie, Flugzeugen und Schiffen erhalten. Diese „US-Hilfsausrüstung“ wird unser Militär völlig verändern und einen qualitativen Sprung in der Kampfeffektivität erzielen."
  KOR_paobing_huoli_xueshuo: "Artillerie-Feuerkraft-Doktrin"
  KOR_paobing_huoli_xueshuo_desc: "Unsere Arbeitskräfte mögen begrenzt sein, aber unsere Feuerkraft wird unbegrenzt sein. Wir werden Artillerie als absoluten Kern der Armee aufbauen und uns dabei an die Kampfdoktrin der „Überlegenheit der Feuerkraft“ halten. Bevor wir eine Offensive starten, werden wir zunächst die Stellungen des Feindes mit überwältigendem Artilleriefeuer vom Erdboden vernichten."
  KOR_haijun_de_liming: "Asiatisches Flottentraining"
  KOR_haijun_de_liming_desc: "Unsere Marine kann nicht nur in Küstengewässern verweilen. Durch regelmäßige gemeinsame Schulungen mit der leistungsstarken Siebten US-Flotte werden unsere Matrosen wertvolle Erfahrungen im Hochseeeinsatz sammeln. Dies wird nicht nur unsere Seekampffähigkeiten verbessern, sondern auch potenziellen Feinden die feste Entschlossenheit unseres Bündnisses demonstrieren."
  KOR_haijun_feixingyuan_jihua: "Übersee-Pilotenausbildungsprogramm"
  KOR_haijun_feixingyuan_jihua_desc: "Um eine Luftwaffe aufzubauen, die mit dem Feind konkurrieren kann, sind hervorragende Piloten der Schlüssel. Wir werden die herausragendsten jungen Leute auswählen und sie auf US-Luftwaffenstützpunkte schicken, um die weltweit beste Flugausbildung zu erhalten. Wenn sie mit den neuesten Düsenjägern zurückkehren, wird der Himmel über Korea wirklich uns gehören."
  KOR_tezhong_silingbu_meiguo: "US-ROK Combined Forces Command"
  KOR_tezhong_silingbu_meiguo_desc: "Um die höchste Effizienz koordinierter Operationen in Kriegszeiten zu erreichen, müssen wir ein einheitliches Combined Forces Command mit dem US-Militär einrichten. Das bedeutet, dass in Notsituationen ein Teil unserer Kommandogewalt auf die US-Seite übertragen wird. Dies ist der Preis, den wir für den Sieg zahlen müssen, und auch ein Symbol für die unzerbrechliche Allianz zwischen uns."
  KOR_qiaobao_waijiao_wangluo: "Diplomatisches Netzwerk für ausländische Landsleute"
  KOR_qiaobao_waijiao_wangluo_desc: "Millionen von über die ganze Welt verstreuten Landsleuten im Ausland sind unsere wertvollen diplomatischen Ressourcen. Wir werden ein globales Verbindungsnetzwerk für Landsleute im Ausland aufbauen und sie ermutigen, sich für das Mutterland einzusetzen, Lobbyarbeit bei den Regierungen ihrer Gastländer zu betreiben und eine starke neue Kraft für unser Land an der zivilen diplomatischen Front zu werden."
  KOR_qiaobao_waijiao_wangluo_tt: "Schalten Sie die Lösung frei §YEBauen Sie vor Ort ein Übersee-Landsmann-Netzwerk auf§!, wir haben die Chance, Geheimdienstboni aus dem Zielland zu erhalten."
  KOR_wenhua_waijiao_changyi: "Kulturdiplomatie-Initiative"
  KOR_wenhua_waijiao_changyi_desc: "Die wahre Kraft eines Landes liegt in der Attraktivität seiner Kultur. Wir werden eine „Kulturdiplomatie“-Initiative starten, um ein friedliches, zivilisiertes und charmantes nationales Image zu schaffen, indem wir unsere Musik, Kunst, Küche und Traditionen in der Welt bekannt machen und so unsere internationale Soft Power stärken."
  KOR_wenhua_waijiao_changyi_tt: "Schalten Sie die Resolution frei §YFördern Sie den kulturellen Austausch im Ausland§!"
  KOR_guoji_jishu_hezuo: "Internationale technologische Zusammenarbeit"
  KOR_guoji_jishu_hezuo_desc: "Wir können keine Modernisierung erreichen, indem wir unsere Türen schließen. Wir werden uns aktiv um die internationale technologische Zusammenarbeit mit westlichen Industrieländern bemühen und uns dabei helfen, die technologische Lücke zu schließen und durch die Einführung fortschrittlicher Technologien, Patente und Talente in Schlüsselbereichen wie Elektronik, chemischer Industrie und Maschinenbau schnell aufzuholen."
  KOR_heping_xianfa_chengnuo: "$JAP_fund_resistance_groups_in_asia$"
  KOR_heping_xianfa_chengnuo_desc: "$JAP_fund_resistance_groups_in_asia_desc$"
  KOR_bianjing_fei_junshi_xieding: "Befreier des asiatischen Volkes"              #Proposal for a Demilitarized Zone on the Border
  KOR_bianjing_fei_junshi_xieding_desc: "Wir haben Unterdrückung erlitten, deshalb verstehen wir den Wert der Freiheit besser. Koreas Unabhängigkeit sollte nicht das Ende, sondern der Ausgangspunkt sein. Als Leuchtturm der Freiheit in Asien werden wir historische Verantwortung übernehmen, das Banner der Demokratie hochhalten, alle Völker unterstützen, die noch immer unter imperialistischer Sklaverei und kolonialer Unterdrückung leiden, und den Funken der Hoffnung nach ganz Asien bringen."
  KOR_yazhou_zhongli_lianmeng: "Asiatische Demokratische Allianz"
  KOR_yazhou_zhongli_lianmeng_desc: "Die demokratischen Länder Asiens müssen sich zusammenschließen, um gemeinsam dem imperialistischen Kolonialismus und der Wiederherstellung der Autokratie zu widerstehen. Wir werden die Gründung einer „Asian Democratic Alliance“ initiieren und alle asiatischen Länder, die an Freiheit und demokratische Werte glauben, zum Beitritt einladen. Dieses Bündnis wird zu einer soliden Festung der freien Welt in dieser Region werden."
  KOR_Asian_Convention_Organization: "[GetLKORAsianConventionOrganization]"
  KOR_Asian_Convention_Organization_desc: "[GetLKORAsianConventionOrganizationDESC]"
  KOR_Asian_Convention_Organization_1_key: "Vorhut der Freien Welt"
  KOR_Asian_Convention_Organization_1DESC_key: "Unser Schicksal sollte nicht nur darin bestehen, in der Kluft zwischen den Großmächten zu überleben, sondern ein freies Asien anzuführen. Als Spitzenreiter des ideologischen Kampfes nehmen wir gerne die Rolle der „Avantgarde der freien Welt“ an und werden zum stärksten Verbündeten und strategischen Eckpfeiler der Vereinigten Staaten auf dem asiatischen Kontinent – ​​nicht nur zu einer Festung der Demokratie, sondern auch zu einem Speer, der liberale Werte propagiert."
  KOR_Asian_Convention_Organization_2_key: "Dekret des Heiligen Krieges"
  KOR_Asian_Convention_Organization_2DESC_key: "Es ist Zeit, einen neuen Heiligen Krieg zu beginnen. Die brandneue Kriegsmaschine wird in Seinem Namen brüllen und bereit sein, die Ketzer mit gerechtem Zorn zu vernichten. Es wird keinen Frieden geben, bis das Gericht des Artilleriefeuers über alle Ungläubigen fällt."
  KOR_duiri_suo_pei: "Schadensersatzansprüche aus Japan"
  KOR_duiri_suo_pei_desc: "Japan muss unser Volk für seine jahrzehntelange brutale Kolonialherrschaft entschädigen. Wir werden alle diplomatischen Mittel einsetzen, um Tokio zur Zahlung von Kriegsentschädigungen und zur Rückgabe kultureller Relikte zu drängen. Dies dient nicht nur der materiellen Entschädigung, sondern auch der Wahrung der historischen Gerechtigkeit."
  KOR_duiri_suo_pei_tt: "\nSie werden eher nachgeben, wenn:\n-Ihre §HKriegsunterstützung§! weniger als §H50 %§!\n-Sie sind nicht in einer §HFraktion§!\n-Die Vereinigten Staaten\ngarantieren unsere §HUnabhängigkeit§!\n-Ihre §HMilitär Stärke§! ist §Hschwächer§! als unsere!"
  KOR_jingti_junguo_zhuyi_fusu: "Wachsam gegen das Wiederaufleben des Militarismus"
  KOR_jingti_junguo_zhuyi_fusu_desc: "Wir müssen jederzeit wachsam sein gegenüber den Bewegungen unseres Nachbarlandes nach Osten. Jeder Versuch, die Friedensverfassung aufzurüsten oder zu ändern, wird von uns als klares Signal für das Wiederaufleben seines Militarismus gewertet. Wir behalten uns das Recht vor, alle vorbeugenden Maßnahmen zu ergreifen, um die Wiederholung historischer Tragödien zu verhindern."
  KOR_menghu_de_paoxiao: "Brüllen des Tigers"
  KOR_menghu_de_paoxiao_desc: "Wir sind nicht länger das „Einsiedlerkönigreich“, das nach Belieben schikaniert werden kann. Der schlafende Tiger ist aufgewacht und hat sein Brüllen losgelassen! Wir werden eine harte und proaktive Außenpolitik verfolgen und entschlossen auf alle Worte und Taten reagieren, die unsere Souveränität und Würde verletzen. Die Welt wird wieder lernen, uns zu respektieren."
  KOR_menghu_de_paoxiao_tt: "\nErhalten Sie die Panzerdivision §Y1§! in §Y[ROOT.Capital.GetName]§!, kommandiert von Generalmajor §Y$KOR_Li_Zhongzan$§!."
  KOR_jiefang_manzhou_ren: "Gando-Problem"
  KOR_jiefang_manzhou_ren_desc: "Gando ist seit der Antike das Land, in dem unsere Nation lebt, und noch heute leben dort Millionen unserer Landsleute. Wir dürfen diese Geschichte nicht ignorieren. Jetzt ist es an der Zeit, die „Gando-Frage“ wieder auf die Tagesordnung zu setzen und der Welt unsere unbestreitbare historische Souveränität über dieses Heimatland zu erklären."
  KOR_jiefang_manzhou_ren_tt: "Wir werden ein §YPuppe§! Kriegsziel gegen alle §Ynichtdemokratischen chinesischen §! Länder erreichen. Aktuelles Ziel:"
  KOR_ziyou_de_huixiang: "[GetLKORZiyouDeHuixiang]"
  KOR_ziyou_de_huixiang_desc: "[GetLKORZiyouDeHuixiangDESC]"
  KOR_ziyou_de_huixiang_1_key: "Echos der Freiheit"
  KOR_ziyou_de_huixiang_1DESC_key: "Unsere Freiheit und unser Wohlstand werden zu einem Leuchtturm werden, der die Menschen in anderen asiatischen Ländern inspirieren wird. Wir werden die Idee der Freiheit durch verschiedene Mittel wie Rundfunk und Kulturaustausch an diejenigen weitergeben, die noch unter autokratischer Herrschaft leben. Die Echos der Freiheit werden irgendwann den Eisernen Vorhang überschreiten und in ihren Herzen die Sehnsucht nach Demokratie wecken."
  KOR_ziyou_de_huixiang_2_key: "Leuchtturm des Glaubens in Asien"
  KOR_ziyou_de_huixiang_2DESC_key: "Auf diesem Kontinent voller Heidentum und Atheismus ist unsere heilige Nation das einzige Licht. Wir müssen die Mission übernehmen, zum „Leuchtfeuer des Glaubens in Asien“ zu werden, die Herrlichkeit des Herrn in jeder Ecke des Ostens erstrahlen zu lassen und alle Brüder im Glauben zu vereinen."
  KOR_wei_yazhou_dikang_tigong_zijin: "Kontaktieren Sie White Army Exiles"
  KOR_wei_yazhou_dikang_tigong_zijin_desc: "Der Feind meines Feindes ist mein Freund. In der Mandschurei gibt es noch immer viele weißrussische Exiloffiziere, die einst gegen die Rote Armee kämpften. Sie sind überzeugte Antikommunisten und ihre wertvolle Kampferfahrung ist genau das, was wir brauchen. Wir werden sie einladen, als militärische Berater zu fungieren und uns bei der Bewältigung der gemeinsamen roten Bedrohung zu unterstützen."
  KOR_wei_yazhou_dikang_tigong_zijin_tt: "Schalten Sie die Lösung frei §YDringen Sie in den Fernen Osten ein§!, Regionen, die bereits durchdrungen wurden, werden sich uns anschließen, wenn der Krieg mit der Sowjetunion ausbricht."
  KOR_yaxiya_tiaoyue_zuzhi: "Adler des Ostens"
  KOR_yaxiya_tiaoyue_zuzhi_desc: "Als stärkster Verbündeter der Vereinigten Staaten in Asien werden wir die Rolle des „Adlers des Ostens“ spielen. Unser mächtiges Militär wird zum Brückenkopf zur Eindämmung der Ausbreitung des Kommunismus im Fernen Osten werden und aktiv mit der globalen Strategie der Vereinigten Staaten zusammenarbeiten. Mit unbestreitbarer Loyalität werden wir den Außenposten der freien Welt in Asien verteidigen."
  KOR_dongya_guanshui_tongmeng: "Errichten Sie die Asiatische Zollunion"
  KOR_dongya_guanshui_tongmeng_desc: "Ein geeintes Asien sollte zunächst mit der wirtschaftlichen Integration beginnen. Wir werden die Gründung der „Großasiatischen Zollunion“ initiieren und Handelshemmnisse zwischen den Mitgliedstaaten abbauen, um einen einheitlichen großen Markt zu schaffen. Dies wird den intraregionalen Handel und den Wohlstand erheblich fördern und den Grundstein für eine tiefere Integration legen."
  KOR_dongya_huobi_lianmeng: "Errichten Sie die Asiatische Währungsunion"
  KOR_dongya_huobi_lianmeng_desc: "Auf der Grundlage der Zollunion werden wir den Aufbau einer „Asiatischen Währungsunion“ weiter vorantreiben. Die Einführung einer einheitlichen asiatischen Währung unter unserer Führung wird es uns ermöglichen, uns vollständig von den Fesseln des US-Dollars zu befreien und eine unabhängige Wirtschaftszone zu schaffen, die Seite an Seite mit Europa und Amerika stehen kann."
  KOR_dongya_yitihua_lianmeng: "Integrationsbündnis"
  KOR_dongya_yitihua_lianmeng_desc: "Wirtschaftliche Integration erfordert zwangsläufig politische und militärische Koordination. Wir werden das Bündnis zu einer tieferen „Integration“ vorantreiben und ein einheitliches Parlament und eine gemeinsame Führung zur Koordinierung der Innen- und Außenpolitik der Mitgliedstaaten schaffen. Am Horizont entsteht eine brandneue supranationale Einheit, in deren Mittelpunkt wir stehen."
  KOR_dongya_yitihua_lianmeng_tt: "Jedes §YFaction-Mitglied§! erhält das §YEvent:§! [KOR.GetNameDefCap] hofft, unsere Volkswirtschaften weiter zu integrieren"
  KOR_dadongya_lianbang: "Asiatische Föderation"
  KOR_dadongya_lianbang_desc: "Unser oberstes Ziel ist es, alle gleichgesinnten asiatischen Länder in einer einheitlichen „Asiatischen Föderation“ zu vereinen. In dieser Föderation behält jedes Land ein gewisses Maß an Autonomie, aber Außen-, Militär- und wichtige Wirtschaftspolitiken werden von einer einheitlichen zentralen Bundesregierung geleitet. Eine brandneue Supermacht steht vor der Geburt."
  KOR_dadongya_lianbang_tt: "Wir werden als §YFree Asian Alliance§! bekannt sein"

###############################  Gray  #################################
  KOR_minzhi_de_dengta: "Leuchtturm der Volksführung"
  KOR_minzhi_de_dengta_desc: "Unser Land sollte ein Land für alle Menschen sein. Wir werden den „Leuchtturm der Volksregierung“ hochhalten, um eine Republik aufzubauen, in der die Souveränität wirklich beim Volk liegt. Die Macht der Regierung beruht auf der Gewährung des Volkes und dient dem Wohl des Volkes. Dieser Weg wird uns dabei helfen, nicht in die extreme Linke oder Rechte abzurutschen und ein Vorbild für Demokratie in Asien zu werden."
  KOR_qingsuan_yu_hejie: "Rechenschaftspflicht und Versöhnung"
  KOR_qingsuan_yu_hejie_desc: "Wir müssen die abscheulichen projapanischen Verräter entschieden zur Rechenschaft ziehen, um die nationale Gerechtigkeit aufrechtzuerhalten. Aber gleichzeitig sollten wir im Interesse der Einheit des Landes auch den Landsleuten, die Fehler begangen haben, aber bereit sind, Buße zu tun, eine Chance zur Versöhnung geben. Aus Fehlern der Vergangenheit lernen, um zukünftige zu vermeiden, die Krankheit zu heilen, um den Patienten zu retten, ist unsere Grundpolitik im Umgang mit historischen Problemen."
  KOR_mengyang_de_lixiang: "[GeKORmengyangdelixiangDominanceName]"
  KOR_mengyang_de_lixiang_desc: "[GeKORmengyangdelixiangDominanceNameDESC]"
  KOR_mengyang_de_lixiang_text: "Mengyangs Ideal"
  KOR_mengyang_de_lixiang_text_desc: "Das Ideal von Herrn Mengyang besteht darin, ein geeintes, unabhängiges und autonomes Korea aufzubauen, das weder den Vereinigten Staaten noch der Sowjetunion zuneigt und von linken und rechten Fraktionen gemeinsam aufgebaut wird. Dieses Ideal ist eine Fackel im Dunkeln und führt uns dazu, einen beispiellosen Mittelweg für das Überleben und die Entwicklung der Nation in der Kluft zwischen den beiden Blöcken einzuschlagen."
  KOR_mengyang_de_lixiang_2_text: "Gandhi aus Korea"
  KOR_mengyang_de_lixiang_2_text_desc: "Das Ideal von Herrn Cho Man-sik besteht darin, ein geeintes, unabhängiges und autonomes Korea aufzubauen, das weder den Vereinigten Staaten noch der Sowjetunion zuneigt und das von linken und rechten Fraktionen gemeinsam aufgebaut wird. Dieses Ideal ist eine Fackel im Dunkeln und führt uns dazu, einen beispiellosen Mittelweg für das Überleben und die Entwicklung der Nation in der Kluft zwischen den beiden Blöcken einzuschlagen."
  KOR_a_new_constitution: "Neue Verfassung"
  KOR_a_new_constitution_desc: "Um unsere unparteiische und unabhängige Linie dauerhaft zu etablieren, müssen wir eine neue Verfassung verkünden. Es wird nationale Interessen gesetzlich über alle Ideologien stellen und eine unerschütterliche Grundlage für die langfristige Stabilität und den Wohlstand des Landes legen."
  KOR_litteracy_effort: "Alphabetisierungskampagne"
  KOR_litteracy_effort_desc: "Eine in Unwissenheit gefangene Nation kann keine wahre Unabhängigkeit erreichen. Wir werden eine landesweite Alphabetisierungskampagne starten und jeden Winkel mit dem Licht des Wissens erhellen. Nur wenn die Menschen unabhängig denken können, kann das Land wirklich stark werden und die Zukunft mit eigenen Händen in den Griff bekommen."
  KOR_guojia_qingbao_bu: "Nationaler Geheimdienst"
  KOR_guojia_qingbao_bu_desc: "Als neutrale Partei in der Mitte müssen wir die schärfsten Augen und Ohren haben. Wir werden einen „Nationalen Geheimdienst“ direkt unter dem Obersten Führer einrichten, um alle Verschwörungen im In- und Ausland zu überwachen, die versuchen, unseren neutralen Status zu untergraben und so absolute nationale Sicherheit zu gewährleisten."
  KOR_bandao_de_dianbo: "Radiowellen der Halbinsel"
  KOR_bandao_de_dianbo_desc: "Wenn wir nicht die Position der Propaganda einnehmen, wird es der Feind tun. Wir werden ein Rundfunknetz aufbauen, das die gesamte Halbinsel abdeckt und dabei unsere eigene nationale Stimme nutzt, die über links und rechts hinausgeht, um dem ideologischen Lärm aus dem Norden und Süden entgegenzuwirken und die Ideen der Neutralität und Autonomie an alle Koreaner weiterzugeben."
  KOR_tuanjie_minzu_zichan: "Vereint die nationale Bourgeoisie"
  KOR_tuanjie_minzu_zichan_desc: "Im gegenwärtigen Stadium extremer Armut und Rückständigkeit ist die nationale Bourgeoisie immer noch eine konstruktive Kraft, die geeint und genutzt werden kann. Ihr Kapital, ihre Technologie und ihre Managementerfahrung sind entscheidend für die Wiederherstellung und Entwicklung der Volkswirtschaft. Wir werden sie dabei unterstützen und anleiten, unter dem Banner des Patriotismus zum nationalen Wohlstand beizutragen."
  KOR_wenhe_de_tudi_gaige: "Moderate Landreform"
  KOR_wenhe_de_tudi_gaige_desc: "Wir plädieren dafür, dass „diejenigen, die das Land bebauen, es besitzen“, mit friedlichen und schrittweisen Mitteln erreicht werden. Durch den Kauf durch die Regierung und die entschädigte Verteilung wird das Land schrittweise an die Landwirte übertragen, wodurch drastische soziale Unruhen vermieden werden. Eine gemäßigte Landreform kann nicht nur soziale Gerechtigkeit verwirklichen, sondern auch die Stabilität der landwirtschaftlichen Produktion im größtmöglichen Umfang gewährleisten."
  KOR_fuchi_minzu_qiye: "Unterstützen Sie nationale Unternehmen"
  KOR_fuchi_minzu_qiye_desc: "Ein Land ohne eigene nationale Industrie kann niemals echte Unabhängigkeit erreichen. Der Staat wird die Entwicklung lokaler Unternehmen durch politische Maßnahmen und finanzielle Unterstützung tatkräftig unterstützen und sie vor den Auswirkungen ausländischer Waren schützen. Eine starke Gruppe nationaler Unternehmen ist das solide Fundament unserer wirtschaftlichen Autonomie."
  KOR_nongye_xiandai_hua: "Modernisierung der Landwirtschaft"
  KOR_nongye_xiandai_hua_desc: "Die traditionelle, vom Wetter abhängige Landwirtschaft muss geändert werden. Wir werden Mittel investieren, um Wasserschutzprojekte zu bauen, verbessertes Saatgut und chemische Düngemittel zu fördern und moderne landwirtschaftliche Maschinen einzuführen. Die Modernisierung der Landwirtschaft kann nicht nur die nationale Ernährungssicherheit gewährleisten, sondern auch eine große Zahl von Landarbeitern freisetzen, die in den Industriebau eingesetzt werden können."
  KOR_guojia_liyi_zhishang: "Nationale Interessen zuerst"
  KOR_guojia_liyi_zhishang_desc: "In einem komplexen internationalen Umfeld lautet unser einziger Handlungsleitsatz „Nationale Interessen zuerst“. Ob wir uns mit irgendjemandem verbünden oder uns ihm widersetzen, muss den höchsten Interessen des Überlebens und der Entwicklung unserer Nation dienen. Kein ideologisches Dogma kann die grundlegenden Interessen unseres Landes außer Kraft setzen."
  KOR_yaoqing_sulian_touzizhe: "Laden Sie [SOV.GetAdjective]-Investoren ein"
  KOR_yaoqing_sulian_touzizhe_desc: "Unsere Industrialisierungsbestrebungen erfordern externes Kapital und technische Unterstützung, und unsere benachbarte Sowjetunion verfügt über eine starke Schwerindustriebasis. Deshalb haben wir eine besondere Einladung an die Sowjetunion gerichtet: Es handelt sich hierbei nicht um ein ideologisches Bündnis, sondern um eine rein wirtschaftliche Zusammenarbeit."
  KOR_yaoqing_meiguo_touzizhe: "Laden Sie [USA.GetAdjective]-Investoren ein"
  KOR_yaoqing_meiguo_touzizhe_desc: "Wir öffnen einen Teil des Marktes für Wall-Street-Kapitalisten und versprechen, ihnen ein stabiles und profitables Investitionsumfeld zu bieten. Ihre Investition wird uns Fabriken, Technologie und Beschäftigung bringen, während sie gleichzeitig erhebliche Gewinne einfahren werden. Dies ist ein für beide Seiten vorteilhafter kommerzieller Austausch. Wir werden wachsam bleiben, um sicherzustellen, dass die wirtschaftliche Souveränität des Landes in keiner Weise geschädigt wird und das US-Kapital unseren eigenen Zwecken dient."
  KOR_yu_zhongdaozuo_jiemeng: "Bündnis mit den Linken"
  KOR_yu_zhongdaozuo_jiemeng_desc: "Um eine Koalitionsregierung mit breiter Repräsentativität zu bilden, müssen wir einen aktiven Dialog und eine Zusammenarbeit mit gemäßigten linken Sozialisten führen. Ihre Aufnahme in die Regierung wird uns helfen, die soziale Ordnung zu stabilisieren, eine breitere öffentliche Unterstützung zu gewinnen und ein Signal an unseren nördlichen Nachbarn zu senden, dass wir nicht feindlich eingestellt sind."
  KOR_forge_a_national_identity: "$ITA_common_ground$"
  KOR_forge_a_national_identity_desc: "Wenn wir uns nach links neigen oder nach rechts abbiegen, werden wir in den Abgrund der Stellvertreterkriege hineingezogen. Unser einziger Standpunkt ist „Nationalität“. Auf der Grundlage dieses Konsenses werden wir alle patriotischen Kräfte vereinen, interne Spaltungen überbrücken und ein vollständiges und unabhängiges Korea anstreben."
  KOR_forge_a_national_identity_tt: "Wird nach Abschluss der nationalen Richtlinie §Y$KOR_yu_zhongdaozuo_jiemeng$§! oder §Y$KOR_tuanjie_minzu_zichan$§! ersetzt:"
  KOR_xinminzhu_zhuyi_jiaoyu: "Neue demokratische Bildung"
  KOR_xinminzhu_zhuyi_jiaoyu_desc: "[GeKOR_xinminzhuzhuyijiaoyu]"
  KOR_xinminzhu_zhuyi_jiaoyu_desc_a: "Unsere Ausbildung zielt darauf ab, eine neue Generation von Bürgern mit nationalem Selbstwertgefühl und wissenschaftlichem und demokratischem Denken heranzubilden. Wir werden das alte Bildungssystem reformieren, koloniale und feudale Überreste beseitigen und eine brandneue „neue demokratische“ Bildung etablieren, die dem Aufbau eines modernen Landes dient."
  KOR_xinminzhu_zhuyi_jiaoyu_desc_b: "Unsere Mission und Aufgabe besteht darin, die Idee der Autonomie als Leitideologie zu übernehmen und uns an der autonomen Sache der Nation und der Menschheit zu beteiligen. Das aktuelle Ziel besteht darin, eine autonome Gesellschaft aufzubauen und die autonome Vereinigung des Landes zu verwirklichen. Das ultimative Ziel besteht darin, eine zukünftige Gesellschaft zu schaffen, in der menschliche Autonomie, nationale Autonomie und menschliche Autonomie verwirklicht werden – eine autonome Welt"
  KOR_baozheng_laogong_quanyi: "Gewährleistung der Arbeitnehmerrechte und -interessen"
  KOR_baozheng_laogong_quanyi_desc: "Die Arbeitnehmer sind die Hauptkraft des nationalen Aufbaus, und ihre Rechte und Interessen müssen gewährleistet werden. Wir werden Gesetze erlassen, um den Mindestlohn und die maximale Arbeitszeit klar festzulegen und das Arbeitsumfeld zu verbessern. Ein Land, das die Arbeit respektiert, kann die kreativste und kohärenteste Arbeiterklasse haben."
  KOR_jianli_jumin_yibao: "Erweitern Sie die medizinischen Einrichtungen"
  KOR_jianli_jumin_yibao_desc: "Krankheiten sind eine wichtige Ursache für Armut. Wir werden aus den Erfahrungen fortgeschrittener Länder lernen, und die Erweiterung der Einrichtungen an verschiedenen Orten wird dieser Situation wirksam begegnen. Die Sicherstellung, dass sich jeder eine medizinische Behandlung leisten kann und eine medizinische Grundversorgung erhält, ist ein wichtiges Kriterium für die Messung des Zivilisationsniveaus eines Landes."
  KOR_weisheng_zhufang_jihua: "Gesundheits- und Wohnungspolitik"
  KOR_weisheng_zhufang_jihua_desc: "Ein starkes Land beginnt mit gesunden Bürgern. Wir werden eine landesweite Gesundheits- und Wohnungspolitik umsetzen, die die Lebensbedingungen der Menschen und die öffentliche Gesundheit grundlegend verbessert und die solideste Grundlage für den Lebensunterhalt der Menschen für die Selbstentwicklung und den Wohlstand des Landes legt."
  KOR_xinxing_de_fuli_guojia: "Aufstrebender Wohlfahrtsstaat"
  KOR_xinxing_de_fuli_guojia_desc: "Die Früchte der nationalen Entwicklung müssen von allen Menschen geteilt werden. Wir werden ein Sozialversicherungssystem schaffen, das die gesamte Bevölkerung abdeckt und dafür sorgt, dass das Wohlergehen „von der Wiege bis zur Bahre“ kein fernes Ideal mehr ist. Eine wohlhabende, stabile und glückliche Gesellschaft wird unsere stärkste Waffe gegen alle Einmischungen von außen sein."
  KOR_yinjin_waiguo_jishu_guwen: "Stellen Sie ausländische technische Berater vor"
  KOR_yinjin_waiguo_jishu_guwen_desc: "Nach dem Grundsatz der Unabhängigkeit und Eigenständigkeit schließen wir das Lernen von den Stärken anderer nicht aus. Wir werden gezielt herausragende technische Berater und Experten aus der ganzen Welt einstellen, die uns bei der Branchenplanung und der Ausbildung von Talenten unterstützen. Dies ist für uns die Abkürzung, um den technologischen Abstand zu den entwickelten Ländern so schnell wie möglich zu verringern."
  KOR_kexuejishu_xueyuan: "Akademie für Wissenschaft und Technologie"
  KOR_kexuejishu_xueyuan_desc: "Wissenschaft und Technologie sind die primären Produktivkräfte. Wir werden Ressourcen in den Aufbau einer hochrangigen Akademie für Wissenschaft und Technologie stecken und sie zur „Lokomotive“ unserer nationalen wissenschaftlichen Forschung machen. Es wird Spitzeningenieure und Wissenschaftler für unsere Industrialisierung heranbilden und uns dem Ziel näherbringen, eine mächtige Technologienation zu werden."
  KOR_gonghui_hefa_hua_tian: "Gesetz zur Legalisierung von Gewerkschaften"
  KOR_gonghui_hefa_hua_tian_desc: "Eine unabhängige Gewerkschaft ist eine wichtige Organisation für Arbeitnehmer, um ihre Forderungen zu äußern und Tarifverhandlungen mit Arbeitgebern zu führen. Wir werden den rechtlichen Status von Gewerkschaften durch Gesetze offiziell anerkennen und ihr Recht auf unabhängige Tätigkeit garantieren. Dies ist nicht nur Ausdruck des Schutzes von Arbeitnehmerrechten und -interessen, sondern auch ein wichtiger Bestandteil der Sozialdemokratie."
  KOR_hanjiang_gongyehua: "Industrialisierung des Han-Flusses"
  KOR_hanjiang_gongyehua_desc: "Abschied von leeren ideologischen Debatten, der Wohlstand des Volkes ist von grundlegender Bedeutung. Wir werden die nationale Stärke auf das Einzugsgebiet des Han-Flusses konzentrieren, um exportorientierte Leicht- und Schwerindustrien zu entwickeln. Dabei verlassen wir uns nicht auf Außenstehende, sondern nutzen unsere eigenen Hände, um ein „Han-Fluss-Wunder“ zu erschaffen, das nur der koreanischen Nation gehört."
  KOR_chengsihua_jincheng: "Städtische Investitionen"
  KOR_chengsihua_jincheng_desc: "$JAP_further_urban_investments_desc$"
  KOR_sikandenaweiya_moshi: "Skandinavisches Modell"
  KOR_sikandenaweiya_moshi_desc: "Das Modell der nordisch-skandinavischen Länder – hohe Wohlfahrt, gleichmäßige Vermögensverteilung und stabile Sozialdemokratie – bietet uns ein äußerst attraktives Entwicklungsmodell. Wir werden dies als Ziel verfolgen, das beste Gleichgewicht zwischen Marktwirtschaft und sozialer Gerechtigkeit finden und einen wohlhabenden, gleichberechtigten und harmonischen Wohlfahrtsstaat aufbauen."
  KOR_bujiemengyundong_de_xianqu: "Pionier der Blockfreien Bewegung"
  KOR_bujiemengyundong_de_xianqu_desc: "Wir weigern uns, Partei zwischen den Vereinigten Staaten und der Sowjetunion zu ergreifen, und wir werden der Pionier des dritten Weges sein. Nordkorea wird sich aktiv für das Konzept der „Blockfreiheit“ einsetzen, alle Länder der Welt vereinen, die nicht bereit sind, sich den beiden großen Blöcken anzuschließen, und gemeinsam eine massive „Bewegung der Blockfreien“ ins Leben rufen, um auf der internationalen Bühne eine unabhängige Stimme zu erheben."

  KOR_mayi_taizai: "Hanfgekleideter Kronprinz"
  KOR_mayi_taizai_desc: "Der Legende nach gab der in Hanf gekleidete Kronprinz den Ruhm des Throns auf, lebte zurückgezogen in den Bergen und teilte die Nöte mit dem Volk. Auch der Monarch, den wir wieder willkommen heißen, sollte einen solchen volksnahen und patriotischen Geist haben. Er wird ein Symbol der nationalen Einheit sein und kein hochrangiger Herrscher, der den Eckpfeiler unseres konstitutionellen Monarchiesystems darstellt."
  KOR_taolun_guoti_wenti: "Besprechen Sie die Frage der nationalen Form"
  KOR_taolun_guoti_wenti_desc: "Die Zukunft des Landes muss von allen Menschen gemeinsam entschieden werden. Wir werden eine nationale Diskussion über die nationale Form organisieren, damit Anhänger verschiedener Systeme wie Monarchie und Republikanismus ihre Ansichten umfassend zum Ausdruck bringen können. Schließlich werden wir durch ein nationales Referendum das für unser Land am besten geeignete politische System wählen."
  KOR_zujian_zeren_neige: "Bilden Sie ein verantwortliches Kabinett"
  KOR_zujian_zeren_neige_desc: "Der Monarch ist nur ein Symbol des Landes, und die eigentliche Regierungsgewalt sollte in den Händen eines Kabinetts liegen, das aus gewählten Vertretern besteht. Wir werden ein „Verantwortungskabinett“ bilden, das gegenüber dem Parlament und nicht gegenüber dem Monarchen rechenschaftspflichtig ist. Dies wird grundlegend das konstitutionelle Monarchiesystem des „symbolischen Monarchen und materiellen Premierministers“ etablieren und eine monarchische Diktatur verhindern."
  KOR_chongjian_zongqin_fu: "Rekonstruieren Sie den Hof des königlichen Clans"
  KOR_chongjian_zongqin_fu_desc: "Um die königlichen Angelegenheiten ordnungsgemäß zu verwalten und den herausragenden Status der königlichen Familie zu demonstrieren, ist es notwendig, den traditionellen „Königsclan-Hof“ wiederherzustellen. Diese Institution wird für die Abwicklung von Angelegenheiten wie Hochzeiten, Beerdigungen und die Vermögensverwaltung von Mitgliedern der königlichen Familie verantwortlich sein, die Würde der königlichen Familie wahren und sie strikt von der täglichen Verwaltung der Regierung trennen."
  KOR_xiandaihua_sifa_tixi: "Modernes Justizsystem"
  KOR_xiandaihua_sifa_tixi_desc: "Die Unparteilichkeit des Gesetzes ist der Grundstein eines modernen Landes. Wir werden das alte Justizsystem gründlich reformieren, unabhängige Gerichte und Staatsanwaltschaften einrichten und moderne Rechtsgrundsätze wie die Unschuldsvermutung und die Anwaltsverteidigung einführen. Ein unabhängiges Justizsystem ohne Eingriffe der Verwaltungsgewalt wird die letzte Verteidigungslinie zum Schutz der Bürgerrechte sein."
  KOR_xingzhen_xiaolv_gaige: "Reform der Verwaltungseffizienz"
  KOR_xingzhen_xiaolv_gaige_desc: "Ein aufgeblähter und ineffizienter bürokratischer Apparat ist ein großes Hindernis für die nationale Entwicklung. Wir werden eine tiefgreifende Reform der Verwaltungseffizienz einleiten, Institutionen rationalisieren, überflüssiges Personal abbauen und moderne Managementmethoden einführen. Eine ehrliche und effiziente Regierung kann den Menschen und dem Land besser dienen."
  KOR_jianli_cishan_jijinhui: "Wohltätigkeitsstiftung"
  KOR_jianli_cishan_jijinhui_desc: "Die Verantwortung des Monarchen besteht nicht nur darin, zu herrschen, sondern auch ein Beispiel zu geben. Wir werden im Namen der königlichen Familie eine große Wohltätigkeitsstiftung gründen, um Katastrophenopfern zu helfen, Bildung zu finanzieren und Waisen und Witwen zu unterstützen. Dies wird das Ansehen der königlichen Familie beim Volk erheblich steigern und sie zu einem Symbol für die Vereinigung und Verdichtung der Liebe des Volkes machen."
  KOR_zhenya_chifei_panluan: "Unterdrücken Sie den Aufstand der Roten Banditen"
  KOR_zhenya_chifei_panluan_desc: "Der Geist des Kommunismus versucht, die hart erkämpfte Stabilität, die wir erreicht haben, zu untergraben. Wir werden den „roten Banditen“, die von ausländischen Kräften angestiftet werden und versuchen, die nationale Ordnung mit Gewalt zu zerstören, keine Gnade zeigen. Armee und Polizei werden mit gewaltigen Mitteln jede bewaffnete Rebellion schnell niederschlagen und den Frieden im Reich sichern."
  KOR_zhenya_chifei_panluan_tt: "§YDurch die Auswahl dieser nationalen Richtlinie wird die $KOR_communism_rebellion_mission$-Aufgabe beendet.§!"
  KOR_yu_liangban_guizu_hejie: "Versöhne dich mit der alten Yangban-Aristokratie"
  KOR_yu_liangban_guizu_hejie_desc: "Die alte Yangban-Aristokratie verfügt noch immer über enormen Einfluss und Ansehen auf lokaler Ebene. Anstatt sie auf die andere Seite zu drängen, ist es besser, sich mit ihnen zu versöhnen und sie in Anhänger des monarchischen Systems zu verwandeln. Im Austausch für ihre Unterstützung für das neue Regime werden wir einige ihrer traditionellen Privilegien anerkennen."
  KOR_sheli_guizu_yuan: "Gründen Sie das House of Peers"
  KOR_sheli_guizu_yuan_desc: "Als Ergänzung zum gewählten Parlament werden wir ein „Haus der Peers“ einrichten, das sich aus Mitgliedern der königlichen Familie, Vertretern der alten Aristokratie und national verdienstvollen Persönlichkeiten zusammensetzt. Es wird zu einem beratenden Gremium, das langfristige und ruhige Vorschläge machen, wertvolle Erfahrungen und Weisheit für wichtige nationale Entscheidungen bereitstellen und die Kurzsichtigkeit und den Fanatismus gewählter Politiker verhindern kann."
  KOR_wei_renmin_fuwu_junzhu: "Monarch im Dienste des Volkes"
  KOR_wei_renmin_fuwu_junzhu_desc: "Für unseren Monarchen ist es das höchste Ziel, dem Volk zu dienen. Er wird die Menschen besuchen, ihre Nöte erleben und zu einer Brücke zwischen Regierung und Volk werden. Ein Monarchenbild, das tief in den Herzen des Volkes verwurzelt ist und Freude mit dem Volk teilt, wird es der Monarchie ermöglichen, die breiteste und nachhaltigste Unterstützung der Bevölkerung zu gewinnen und die königliche Macht ewig zu machen."
  KOR_diguo_de_houshe: "Stimme der Dynastie"
  KOR_diguo_de_houshe_desc: "Wir müssen ein Propagandasystem aufbauen, das die Stimme der Dynastie im In- und Ausland genau und kraftvoll vermitteln kann. Durch die nationale Nachrichtenagentur und den Royal Broadcasting Station werden wir ein positives Bild der Dynastie prägen, die öffentliche Meinung lenken und der Welt eine geeinte, selbstbewusste und mächtige moderne Dynastie zeigen."
  KOR_xuanbu_diguo_guofangfa: "Verabschiedung des Landesverteidigungsgesetzes"
  KOR_xuanbu_diguo_guofangfa_desc: "Die Streitkräfte des Landes müssen legalisiert werden. Durch die Verabschiedung eines umfassenden „Nationalen Verteidigungsgesetzes“ werden die Zuständigkeiten, das Kommandosystem, das Militärdienstsystem und der nationale Verteidigungshaushalt des Militärs klargestellt und sichergestellt, dass das Militär im Rahmen des Gesetzes agiert. Dies wird die Grundlage für den Aufbau einer modernen und standardisierten Landesverteidigungstruppe sein."
  KOR_huangjia_jingcha_budui: "Königliche Polizei"
  KOR_huangjia_jingcha_budui_desc: "Eine dem Monarchen treue und streng disziplinierte Polizei ist ein wichtiges Instrument zur Wahrung der inneren Sicherheit und zur Demonstration der Würde der königlichen Macht. Wir werden eine Elite-„Königliche Polizei“ aufbauen, die nicht nur Verbrechen bekämpft, sondern auch für die Sicherheit der königlichen Familie verantwortlich ist und so zu einem starken Rückhalt für die Stabilität der Dynastie wird."
  KOR_jianli_huangjia_weidui: "Bilden Sie die Division „Kaiserliche Garde“."
  KOR_jianli_huangjia_weidui_desc: "Es muss eine absolut loyale und möglichst kampfwirksame Eliteeinheit im Heer geben. Wir werden die besten Offiziere und Soldaten aus der gesamten Armee auswählen, um die Division „Kaiserliche Garde“ zu bilden. Sie erhalten die beste Ausrüstung und Ausbildung und werden nicht nur die kaiserlichen Wachen sein, die die Hauptstadt und den Monarchen verteidigen, sondern auch eine unzerstörbare eiserne Faust in unseren Kriegen mit dem Ausland."
  KOR_yingdui_beifang_weixie: "Reagieren Sie auf die nördliche Bedrohung"
  KOR_yingdui_beifang_weixie_desc: "Das kommunistische Regime im Norden ist immer unsere direkteste und realistischste Bedrohung. Wir müssen umfassende Reaktionspläne formulieren, darunter den Bau solider Verteidigungsanlagen an der Grenze, den Einsatz schwerer Truppengruppen und die Entwicklung von Waffen zur strategischen Abschreckung, um sicherzustellen, dass alle ungewöhnlichen Bewegungen im Norden unter unserer Kontrolle stehen."
  KOR_tuidong_kexue_yu_chuantong: "Fördern Sie die Integration von Wissenschaft und Tradition"
  KOR_tuidong_kexue_yu_chuantong_desc: "Modernisierung bedeutet nicht eine völlige Verwestlichung. Während wir die moderne Wissenschaft und Technologie energisch weiterentwickeln, werden wir die hervorragende traditionelle Kultur unseres Landes wiederbeleben und fördern. Ein Land, das über Spitzentechnologie verfügt und elegante Traditionen bewahrt, wird charmanter und zusammenhängender sein. Die Integration von Wissenschaft und Tradition wird unser einzigartiger Weg sein, eine mächtige Nation zu werden."
  KOR_minzu_de_wenhua_fuxing: "Kulturelle Renaissance des Imperiums"
  KOR_minzu_de_wenhua_fuxing_desc: "Unter der Schirmherrschaft der königlichen Familie werden wir eine tiefgreifende kulturelle Renaissance-Bewegung ins Leben rufen. Beleben Sie die elegante Hofmusik wieder, rekonstruieren Sie historische Stätten und fördern Sie die Schaffung traditioneller Kunst. Ein Imperium, das kulturell selbstbewusst und kreativ ist, kann wirklich den Respekt der Welt gewinnen und die große Erneuerung der Nation verwirklichen."
  KOR_qingdian_wangshi_caichan: "Inventar königliches Eigentum"
  KOR_qingdian_wangshi_caichan_desc: "Das Land, die Kunstwerke und der Reichtum, die die Li-Dynastie über Hunderte von Jahren angehäuft hat, sind ein riesiges Erbe. Wir führen eine umfassende Bestandsaufnahme und Auswertung durch. Dieses Anwesen wird als Startfonds der königlichen Familie verwendet, um in den nationalen Aufbau und wohltätige Zwecke zu investieren und es so von „Privateigentum“ in ein „öffentliches Instrument“ im Dienste des Landes umzuwandeln."
  KOR_zhenxing_chuantong_shougongye: "Traditionelles Kunsthandwerk wiederbeleben"
  KOR_zhenxing_chuantong_shougongye_desc: "Unsere traditionellen Kunsthandwerke wie Seladon, Perlmuttlackwaren und koreanisches Papier sind die Kristallisation nationaler Weisheit. Der Staat wird diese gefährdeten Handwerke unterstützen, ihnen helfen, die Technologie zu verbessern und Märkte zu erweitern. Dies kann nicht nur unser kulturelles Erbe schützen, sondern auch charakteristische Exportindustrien mit hoher Wertschöpfung schaffen."
  KOR_wangshi_texu_hui_she: "Royal Chartered Company"
  KOR_wangshi_texu_hui_she_desc: "Auf der Grundlage erfolgreicher historischer Erfahrungen werden wir einer kleinen Anzahl mächtiger Unternehmen „königliche Urkunden“ erteilen und ihnen Monopolrechte in bestimmten Branchen gewähren. Diese „Royal Chartered Companies“ werden schnell zu riesigen Konzernen heranwachsen, die mit voller Unterstützung des Staates am internationalen Wettbewerb teilnehmen können."
  KOR_wangshi_texu_hui_she_tt: "\nDie beauftragten Unternehmen werden mit dem Bau von Gebäuden in unserem Land beginnen"
  KOR_wangshi_dichan_touzi: "Königliche Immobilieninvestition"
  KOR_wangshi_dichan_touzi_desc: "Die königliche Familie wird ihr riesiges Grundstück für die Durchführung moderner kommerzieller Entwicklungen nutzen. Durch die Zusammenarbeit mit in- und ausländischem Kapital, den Bau von Gewerbegebieten, Luxusresidenzen und Industrieparks kann die königliche Familie nicht nur erhebliche Steuereinnahmen erzielen, sondern auch die Urbanisierung und wirtschaftliche Entwicklung des Landes wirksam fördern."
  KOR_huangjia_binggong_chang: "Königliches Arsenal"
  KOR_huangjia_binggong_chang_desc: "Die Landesverteidigung muss unabhängig sein. Wir werden Ressourcen integrieren, um ein technologisch fortschrittliches „Königliches Arsenal“ zu errichten, das direkt vom Staat kontrolliert wird. Es wird für die Erforschung und Entwicklung aller Waffen und Munition verantwortlich sein, die die kaiserliche Armee benötigt, von Gewehren bis zu schwerer Artillerie, von Panzern bis zu Kampfflugzeugen, und sicherzustellen, dass unsere Armee nicht länger von anderen kontrolliert wird."
  KOR_dongfang_de_jinrong_zhongxin: "Finanzzentrum des Ostens"
  KOR_dongfang_de_jinrong_zhongxin_desc: "Stabile Politik, offene Politik und eine hervorragende geografische Lage – wir haben alle Voraussetzungen, um das Finanzzentrum des Ostens zu werden. Wir werden die Banken-, Wertpapier- und Versicherungsbranche energisch weiterentwickeln, um Kapital aus der ganzen Welt hierher zu holen. Ein starkes Finanzzentrum wird das Perpetuum mobile für den wirtschaftlichen Wohlstand des Imperiums sein."
  KOR_dongfang_de_jinrong_zhongxin_tt: "\nLock §Y$free_trade$§! und §Y$economy$§! können nicht ersetzt werden!"
  KOR_guotu_fangwei_jun: "Territoriale Verteidigungsstreitkräfte"
  KOR_guotu_fangwei_jun_desc: "Die Haupt- und sogar die alleinige Verantwortung unserer Armee besteht darin, unser heiliges Territorium zu verteidigen, und nicht darin, in fremde Länder einzudringen. Wir werden eine schlanke, effiziente „Territoriale Verteidigungsstreitmacht“ aufbauen, die speziell für die lokale Verteidigung konzipiert ist. Jeder Eindringling, der unser Territorium betritt, wird auf den entschlossensten und hartnäckigsten Widerstand stoßen."
  KOR_guotu_fangwei_jun_tt: "Schalten Sie §YResolution§! frei, das es uns ermöglicht, die Territorial Defense Force in Friedenszeiten auszubilden und die Formation direkt nach dem Betreten von §YWar§! einzusetzen."
  KOR_yazhou_zhongli_guojia_huiyi: "Konferenz neutraler asiatischer Nationen"
  KOR_yazhou_zhongli_guojia_huiyi_desc: "Unter dem Schatten großer Kriege sind nicht alle asiatischen Länder bereit, Partei zu ergreifen. Wir werden die Einberufung der „Konferenz neutraler asiatischer Nationen“ initiieren und alle asiatischen Länder, die eine neutrale und blockfreie Politik verfolgen, zur Teilnahme einladen. Wir werden unsere Positionen gemeinsam koordinieren, einander in schwierigen Zeiten helfen und unsere gemeinsame Unabhängigkeit und unseren Frieden in der Kluft zwischen den Giganten wahren."
  KOR_yazhou_zhongli_guojia_huiyi_tt: "Wenn §Yirgendein Unterzeichnermitglied§! angegriffen wird, werden wir eine Fraktion gründen und sie zum Beitritt einladen."
  KOR_hepingliyong_heneng_jihua: "Programm zur friedlichen Nutzung der Kernenergie"
  KOR_hepingliyong_heneng_jihua_desc: "Atomenergie ist die ultimative Energiequelle der Zukunft, und wir dürfen nicht zurückfallen. Wir werden das „Programm zur friedlichen Nutzung der Kernenergie“ starten und mit Hilfe befreundeter Länder unsere eigenen Kernreaktoren zur Stromerzeugung und wissenschaftlichen Forschung bauen. Die Beherrschung dieser Technologie bedeutet natürlich auch, dass wir nur noch einen Schritt von der ultimativen Abschreckung entfernt sind."
  KOR_jishu_hezuo_wangluo: "Technologie-Kooperationsnetzwerk"
  KOR_jishu_hezuo_wangluo_desc: "Wir werden ein umfassendes internationales Technologiekooperationsnetzwerk aufbauen, das nicht durch Ideologien eingeschränkt ist, und mit allen Ländern zusammenarbeiten, die bereit sind, mit uns einen technischen Austausch zu führen. Durch flexible und pragmatische Technologiediplomatie können wir das benötigte Wissen aus verschiedenen Quellen beziehen und unseren Modernisierungsprozess beschleunigen."
  KOR_suoyou_chengnianren_bingyi: "Ausbildung der Reservekräfte"
  KOR_suoyou_chengnianren_bingyi_desc: "Eine starke Reservetruppe ist das Selbstvertrauen, ein kleines stehendes Heer zu unterhalten. Wir werden ein solides System zur Ausbildung der Reservetruppen einrichten, das vorsieht, dass alle pensionierten Soldaten jedes Jahr in das Militärlager zurückkehren, um eine kurzfristige und intensive Umschulung zu absolvieren, um sicherzustellen, dass sie bei Kriegsausbruch sofort einberufen und kampfbereit sind."
  KOR_quanmin_sheji_julebu: "Patriot Shooting Club"
  KOR_quanmin_sheji_julebu_desc: "Die Integration des Militärs in das Volk ist die Grundlage der Landesverteidigung für alle. Wir werden die Gründung von „Patriot Shooting Clubs“ im ganzen Land fördern, um das Wissen über Schusswaffen und die Schießfähigkeiten bei der einfachen Bevölkerung bekannt zu machen. Dies wird das Bewusstsein der Bevölkerung für die nationale Verteidigung erheblich stärken und eine große Anzahl gut ausgebildeter Soldaten für die Organisation von Milizen und Guerillas in Kriegszeiten bereitstellen."
  KOR_guojia_ziran_baolei: "Natürliche Festung"
  KOR_guojia_ziran_baolei_desc: "Mehr als 70 % der koreanischen Halbinsel sind gebirgig, was unser natürlicher Vorteil im Widerstand gegen ausländische Feinde ist. Wir werden stark in den Bau dauerhafter Verteidigungsanlagen an wichtigen Pässen, Bergen und Verkehrsknotenpunkten investieren und so unser gesamtes Land in eine „natürliche Festung“ verwandeln, die jeden Eindringling in Angst und Schrecken versetzt."
  KOR_guojia_ziran_baolei_tt: "Fügen Sie das Bataillon §Y1 $engineer$§! zur Divisionsorganisation der Territorial Defense Force hinzu!"
  KOR_bao_wei_tiankong: "Verteidige den Himmel"
  KOR_bao_wei_tiankong_desc: "Wenn man die Lufthoheit verliert, wird alles am Boden zum Ziel. Wir müssen der Entwicklung unserer Luftverteidigungsfähigkeiten Priorität einräumen und ein dreidimensionales Luftverteidigungsnetzwerk aufbauen, das das ganze Land abdeckt und aus fortschrittlichem Radar, Flugabwehrartillerie und Kampfflugzeugen besteht. Unser Ziel ist es, zu verhindern, dass unbefugte Luftfahrzeuge unseren Luftraum überfliegen."
  KOR_bao_wei_tiankong_tt: "Fügen Sie §Y1 $anti_air$-Bataillon§! zur Divisionsorganisation der Territorial Defense Force hinzu!\nDas Formationslimit der Territorial Defense Force wird um §Y5§! erhöht."
  KOR_ciwei_fangyu: "Igelverteidigung"
  KOR_ciwei_fangyu_desc: "Wir werden die „Igel“-Taktik einsetzen, um unsere Verteidigungswirkung in tiefgreifenden Operationen zu verbessern. Bei dieser Taktik geht es hauptsächlich darum, kleine Einheiten auf verteidigungsfähigen Positionen einzusetzen, die der Feind einschließen könnte. Der Clou ist, dass die Manipulation dieser kleinen Einheiten die Beweglichkeit des Feindes erschöpfen kann, was ihn sehr anfällig für Angriffe macht."
  KOR_mushi_zhi_xia: "Unter Holz und Stein"
  KOR_mushi_zhi_xia_desc: "Angesichts der gewaltigen Luftüberlegenheit des Feindes müssen wir lernen, uns „unter Holz und Stein“ zu verstecken. Wir werden ein riesiges Projekt starten, um im ganzen Land eine große Anzahl unterirdischer Bunker, Tunnel und Ersatzkommandoposten zu bauen. Selbst wenn der Boden dem Erdboden gleichgemacht wird, können wir unsere Stärke unter der Erde bewahren und weiter kämpfen."
  KOR_mushi_zhi_xia_tt: "Fügen Sie das Bataillon §Y1 $rangers_support$§! zur Divisionsorganisation der Territorial Defense Force hinzu!"
  KOR_shandi_zuozhan_jingrui: "Gebirgskriegs-Elite"
  KOR_shandi_zuozhan_jingrui_desc: "Die Berge werden unsere Heimat sein. Wir werden spezialisierte Gebirgskriegseinheiten bilden und ausbilden, sie mit leichter Ausrüstung ausstatten und ihnen beibringen, wie man den Feind in komplexem Gelände überlebt, manövriert und ihn überfällt. Diese Bergeliten werden unser tödlichster Trumpf bei lokalen Einsätzen sein."
  KOR_jundui_yu_fangwu: "Die Armee und das Heim"
  KOR_jundui_yu_fangwu_desc: "Die Armee kann nicht ohne die Unterstützung des Volkes auskommen, und das Volk braucht auch den Schutz der Armee. Wir werden ein integriertes militärisch-ziviles Logistik- und Verteidigungssystem implementieren, bei dem jeder Haushalt zu einem Versorgungspunkt, einer Versorgungsstation oder sogar einer Verteidigungshochburg für die Armee werden kann. Die Häuser des Volkes werden zusammen mit den Schützengräben der Armee unsere uneinnehmbare Verteidigungslinie bilden."
  KOR_difang_jingwei: "Lokale Wachen"
  KOR_difang_jingwei_desc: "Wir werden eine halbmilitarisierte „Local Guards“-Truppe aufbauen, die von den lokalen Regierungen verwaltet wird. Sie setzen sich aus Einheimischen zusammen und werden für die Aufrechterhaltung der öffentlichen Sicherheit vor Ort, die Bewachung wichtiger Einrichtungen und die Zusammenarbeit mit regulären Truppen in Kriegszeiten verantwortlich sein. Diese Truppe wird den Druck auf die regulären Truppen erheblich verringern und zu einem wichtigen Bestandteil des nationalen Verteidigungssystems für alle werden."
  KOR_xuanbu_yazhou_de_menluozhuyi: "Verkünden Sie die Monroe-Doktrin Asiens"
  KOR_xuanbu_yazhou_de_menluozhuyi_desc: "Asiatische Angelegenheiten sollten von den Asiaten selbst entschieden werden. Wir werden die „Monroe-Doktrin Asiens“ öffentlich bekannt geben und uns klar gegen jede Einmischung externer Kräfte in die inneren Angelegenheiten Asiens aussprechen. Dies dient nicht nur unserem Schutz, sondern auch der Festigung unserer Führungsposition in der Region."
  KOR_dongfang_junzhu_lianmeng: "Östliche Monarchistische Allianz"
  KOR_dongfang_junzhu_lianmeng_desc: "In einer Zeit, in der republikanische und kommunistische Wellen über Asien hinwegfegen, müssen sich Länder, die an die Monarchie glauben, vereinen. Wir werden die Gründung der „Eastern Monarchist Alliance“ initiieren und alle asiatischen Länder, die die Monarchie beibehalten oder wiederhergestellt haben, zum Beitritt einladen. Wir werden gemeinsam unsere alten Traditionen und edlen Systeme verteidigen."
  KOR_dongfang_junzhu_lianmeng_tt: "Schalten Sie den Vorsatz frei, §Yin §Yasiatischen §!-Ländern die monarchistische Restaurationsstimmung anzuregen§!!"
  KOR_zhichi_manzhou_huangdi: "Unterstützen Sie den Kaiser von Mandschukuo"
  KOR_zhichi_manzhou_huangdi_desc: "Kaiser Puyi von Mandschukuo ist wie wir ein Vertreter des monarchischen Systems in Ostasien. Wir werden ihn heimlich unterstützen, um ihm zu helfen, seine Herrschaft zu festigen und sich der japanischen Kontrolle zu entledigen. Ein freundliches und unabhängiges Mandschu-Reich wird unser idealster Nachbar und Verbündeter im Norden sein."
  KOR_huifu_sanhan_gutu: "Erobere die alten Länder der drei Hans zurück"
  KOR_huifu_sanhan_gutu_desc: "Alten historischen Aufzeichnungen zufolge war das Territorium unseres Drei-Hans-Volkes einst weitaus größer als diese kleine Halbinsel. Jetzt ist es an der Zeit, unsere historische Souveränität zu bekräftigen und die „alten Länder der Drei Hanse“, die uns ursprünglich gehörten, von den nördlichen Nachbarn zurückzufordern."
  KOR_cuihui_riben_faxisi: "Beseitigen Sie den japanischen Faschismus"
  KOR_cuihui_riben_faxisi_desc: "Das faschistische Regime Japans ist die Wurzel unseres nationalen Leidens und die größte Bedrohung für den Frieden in Asien. Wir können nicht darauf warten, dass andere uns befreien; Wir müssen uns auf unsere eigene Stärke verlassen, um die Initiative zu ergreifen, den faschistischen Militarismus Japans anzugreifen und vollständig zu beseitigen und so dauerhaften Frieden in Ostasien zu schaffen."
  KOR_tianming_lianmeng: "Mandat der Heaven Alliance"
  KOR_tianming_lianmeng_desc: "Im Osten ist das „Mandat des Himmels“ die ultimative Quelle der herrschenden Legitimität. Wir werden eine „Mandate of Heaven Alliance“ gründen, die alle Regime vereint, die an die Idee des göttlichen Rechts der Könige glauben oder diese respektieren. In diesem Bündnis werden wir gemeinsam den Häresien des Atheismus und der „öffentlichen Meinung“ widerstehen und die heilige monarchische Macht verteidigen."
  KOR_tianming_lianmeng_tt: "Schalten Sie den Beschluss frei, §YAasiatische monarchistische §!-Länder einzuladen, sich unserer Fraktion anzuschließen"
  KOR_jurenjian_de_zhouxuan: "Manöver zwischen Riesen"
  KOR_jurenjian_de_zhouxuan_desc: "Als kleines Land erfordert das Überleben zwischen den beiden Giganten USA und Sowjetunion hervorragende diplomatische Weisheit. Wir werden eine flexible Diplomatie des Machtgleichgewichts anwenden, uns manchmal einer Seite annähern, manchmal die andere entfremden und die Widersprüche zwischen ihnen nutzen, um nach den größtmöglichen Interessen und dem sichersten Lebensraum für uns selbst zu streben."
  KOR_yinshi_wangguo_de_yichan: "Vermächtnis des Einsiedlerkönigreichs"
  KOR_yinshi_wangguo_de_yichan_desc: "Unsere Vorfahren waren einst als „Einsiedlerkönigreich“ bekannt, und dieser Isolation und diesem Stolz kann in der neuen Ära eine neue Bedeutung gegeben werden. Wir werden dieses Erbe antreten und eine begrenzte und äußerst selektive Politik der Öffnung gegenüber der Außenwelt verfolgen und nur dann Kontakt aufnehmen, wenn es für uns absolut vorteilhaft ist, um so unsere Unabhängigkeit bestmöglich zu schützen."
  KOR_yuandong_maoyi_xieding: "Fernost-Handelsabkommen"
  KOR_yuandong_maoyi_xieding_desc: "Ein stabiler Fernost braucht ein florierendes regionales Handelsnetzwerk. Wir werden die Unterzeichnung eines „Fernost-Handelsabkommens“ einleiten, um Handelshemmnisse zwischen Ländern in der Region abzubauen und den freien Waren- und Kapitalfluss zu fördern. Dadurch werden wir in die Lage versetzt, breitere Märkte zu erschließen und die Wirtschaftsbeziehungen mit den Nachbarländern zu vertiefen."
  KOR_yu_xifang_tongshang: "Handel mit dem Westen"
  KOR_yu_xifang_tongshang_desc: "Westliches Kapital, westliche Technologie und Märkte sind für unsere Modernisierungsbemühungen von entscheidender Bedeutung. Wir werden ideologische Vorurteile beiseite legen und aktiv Handelsbeziehungen mit westlichen Ländern wie den Vereinigten Staaten und Europa entwickeln. Dies wird uns dringend benötigte Devisen und Technologien bescheren und unserer wirtschaftlichen Entwicklung starke Impulse verleihen."
  KOR_liyong_meisu_maodun: "Die Widersprüche zwischen den USA und der Sowjetunion ausnutzen"
  KOR_liyong_meisu_maodun_desc: "Solange die globale Konfrontation zwischen den Vereinigten Staaten und der Sowjetunion einen Tag lang andauert, werden wir die Gelegenheit haben, sie auszunutzen. Wir werden zu einem klugen „Mittelsmann“ werden, der manchmal Geheimdienstinformationen gegen die Sowjetunion an die Vereinigten Staaten verkauft und manchmal der Sowjetunion versichert, dass wir kein US-Stützpunkt werden. Wenn wir auf beide Seiten wetten, profitieren wir doppelt."
  KOR_liyong_meisu_maodun_tt: "Schalten Sie die Auflösung §YBalance Act§! frei, die es uns ermöglicht, ein Gleichgewicht zwischen der Beruhigung von [USA.GetFlag]§Y[USA.GetName]§! und [SOV.GetFlag]§Y[SOV.GetName]§! zu finden."
###################  Brown  ##################################################
  KOR_fupi_de_yinying: "Schatten der Wiederherstellung"
  KOR_fupi_de_yinying_desc: "Die Schwäche und das Chaos der Republik haben dazu geführt, dass sich viele Menschen nach der alten Ära mit Ordnung und Autorität sehnen. Unter der Oberfläche nimmt ein geheimes Netzwerk aus alten Aristokraten, Militäroffizieren und Karrieristen Gestalt an. Sie freuen sich darauf, einen echten Monarchen wieder willkommen zu heißen, um das Chaos mit eiserner Faust zu beenden. Der Schatten der Wiederherstellung liegt still über diesem Land."
  KOR_huang_taizi_huiguo: "Rückkehr des Kronprinzen"
  KOR_huang_taizi_huiguo_desc: "Seine Königliche Hoheit Prinz Yi Un, der in Japan aufgewachsen ist, verfügt nicht nur über das edle Blut der Li-Dynastie, sondern versteht es auch, das Land durch Modernisierung zu stärken. Er ist der Einzige, der uns zu einer tiefgreifenden Reform führen kann. Wir werden heimlich die Rückkehr des Kronprinzen ins Land veranlassen; Er wird nicht länger der Staub der Geschichte sein, sondern der Herr der Zukunft unserer Nation werden."
  KOR_chongjian_jingfu_gong: "Rekonstruktion des Gyeongbokgung-Palastes"
  KOR_chongjian_jingfu_gong_desc: "Die Ruinen des Gyeongbokgung-Palastes symbolisieren die verlorene Würde unserer Nation. Wir werden unsere nationale Kraft in den Wiederaufbau dieses prächtigen Palastes stecken, um seinen früheren Glanz wiederherzustellen. Damit wird nicht nur ein Gebäude repariert, sondern auch der Welt erklärt, dass die Autorität des Monarchen auf diesem Land wie diesem Palast wiederhergestellt wird."
  KOR_guanghuamen_de_jiamian: "Krönung unter Gwanghwamun"
  KOR_guanghuamen_de_jiamian_desc: "Unter den Blicken Tausender Menschen findet vor Gwanghwamun eine große Krönungszeremonie statt, die traditionelle Majestät und modernen Stil vereint. Seine Königliche Hoheit, der Kronprinz, wird hier das Mandat des Himmels annehmen und offiziell der neue Monarch des Großen Koreanischen Reiches werden. Dies ist nicht nur eine Zeremonie, sondern auch eine Machtdemonstration, die den Beginn einer Ära starker Männer ankündigt."
  KOR_weixin_bianfa: "Reform im Meiji-Stil"
  KOR_weixin_bianfa_desc: "Um eine schnelle Modernisierung des Landes zu erreichen, müssen wir eine „Reform im Meiji-Stil“ von oben nach unten durchführen. Der Führer erhält über die Verfassung hinausgehende Befugnisse, um umfassende Reformen in industriellen, sozialen und ideologischen Bereichen energisch voranzutreiben. Alle alten Bräuche und abweichenden Meinungen, die die Stärke des Landes behindern, werden von der eisernen Faust der Reformen rücksichtslos niedergeschlagen."
  KOR_badao_yixin: "Königliche Inspektion der acht Provinzen"   #Eight Provinces as One Heart
  KOR_badao_yixin_desc: "Die Autorität des Monarchen kann nicht nur auf die Hauptstadt beschränkt werden. Nach dem Vorbild antiker Kaiser wird der Anführer eine umfassende Inspektion der acht Provinzen im ganzen Land durchführen. Dabei geht es nicht nur darum, den lokalen Tyrannen die absolute Autorität der Zentralregierung zu verkünden, sondern auch darum, die Menschen spirituell zu inspirieren. Der Ruhm des Imperiums wird sich auf jeden Zentimeter Land ausbreiten."
  KOR_badao_yixin_tt: "Auflösung freischalten: §YKönigliche Inspektion der acht Provinzen§!\nErlauben Sie uns, landesweit Inspektionen in den acht Provinzen durchzuführen und gleichzeitig §Y2 $MODIFIER_ADDITIONAL_SLOTS_CAP_DESC$§! hinzuzufügen."
  KOR_yimin_zhuyi_lilun: "Theorie des Ein-Menschen-Prinzips"
  KOR_yimin_zhuyi_lilun_desc: "Land, Nation, Führer – Dreifaltigkeit. Wir werden das „Ein-Volk-Prinzip“ als einzige Leitideologie des Landes etablieren und betonen, dass alle Bürger ein unteilbares Ganzes sind und absolut um den einzigen Führer vereint sein müssen. Jedes Geräusch von Klassenkampf oder individueller Freiheit wird als Verrat am nationalen Ganzen angesehen."
  KOR_dahandiguo_wangshi_xuexiao: "Königliches Institut für Technologie"
  KOR_dahandiguo_wangshi_xuexiao_desc: "Wissenschaft ist Macht, und Tradition gibt der Macht die Richtung. Wir werden eine „Königliche Akademie der Wissenschaften“ errichten, die direkt von der königlichen Familie finanziert wird, und sie zum Palast der nationalen Weisheit machen. Es wird nicht nur Spitzentechnologieforschung vorantreiben, sondern auch ein Symbol für die Kombination von königlichem Prestige und modernem Geist sein und die besten Talente im In- und Ausland anziehen, um dem ewigen Wohlstand des Königreichs zu dienen."
  KOR_xianfeng_qingniantuan: "Avantgarde-Jugendkorps"
  KOR_xianfeng_qingniantuan_desc: "Die Zukunft des Landes muss in den Händen junger Menschen mit reiner Ideologie und festem Willen liegen. Wir werden das „Vanguard Youth Corps“ gründen, um eine strenge militarisierte Ausbildung und ideologische Indoktrination für Teenager im ganzen Land durchzuführen. Sie werden die treuesten Unterstützer des Anführers und der eisernen Faust der Straße werden, um Dissidenten zu eliminieren und die Herrschaft zu festigen."
  KOR_sixiang_jiancha_ju: "Büro für ideologische Überwachung"
  KOR_sixiang_jiancha_ju_desc: "Gefährliche Ideen sind zerstörerischer als die Armee des Feindes. Wir werden ein mächtiges „Ideologisches Überwachungsbüro“ einrichten, das für die Zensur von Büchern und Zeitungen, die Überwachung der Kommunikation und die „präventive“ Eliminierung von Personen mit „unreinen“ Ideen zuständig ist. Für die absolute Sicherheit des Imperiums muss der Geist eines jeden streng kontrolliert werden."
  KOR_heyi_she_qingbao: "Weißgekleidete Gesellschaft"
  KOR_heyi_she_qingbao_desc: "Im Schatten des Staates muss es eine Gruppe absolut loyaler und skrupelloser Testamentsvollstrecker geben. Diese „weiß gekleidete Gesellschaft“, die nur direkte Befehle vom Führer selbst entgegennimmt, wird aus den fanatischsten und rücksichtslosesten Elementen bestehen. Von geheimen Attentaten bis hin zur Manipulation der öffentlichen Meinung werden sie dunkle Mittel einsetzen, um die kluge Herrschaft des Anführers aufrechtzuerhalten."
  KOR_sixiang_gaizao_ying: "Ideologisches Reformlager"
  KOR_sixiang_gaizao_ying_desc: "Die giftigen Unkräuter des Liberalismus und Kommunismus untergraben immer noch den Geist unseres Volkes. Wir müssen „Ideologische Reformlager“ einrichten, um diejenigen zu sammeln, die durch falsche Ideen vergiftet sind, ihnen zu helfen, ihre Seelen zu reinigen und durch Arbeit und Studium absolute Loyalität gegenüber dem Land und dem Führer wiederherzustellen. Das ist keine Strafe, sondern eine Erlösung für verlorene Lämmer."
  KOR_suqing_pai_fa: "Beseitigen Sie den Abschaum der alten Ära"
  KOR_suqing_pai_fa_desc: "Schwache Demokraten, korrupte Bürokraten, schwankende Intellektuelle ... Dieser Abschaum der alten Ära ist Tumoren, die die Wiedergeburt unserer Nation behindern. Eine gründliche und gnadenlose Säuberung ist notwendig. Nur durch die Beseitigung dieser inneren Schäden kann unser Land einen reinen, gesunden und kraftvollen Körper haben."
  KOR_suqing_pai_fa_tt: "§R§YKommunist§! und einige §YRepublikaner§! Berater werden entfernt.§!"
  KOR_huangguo_shiguan: "Kaiserliche nationale historische Ansicht"
  KOR_huangguo_shiguan_desc: "Geschichte ist kein Haufen objektiver Fakten, sondern ein Werkzeug zur Gestaltung der nationalen Seele. Wir werden eine völlig neue „kaiserliche nationale historische Sichtweise“ etablieren, die Größe und den Ruhm unserer Nation aus der Geschichte erforschen und unseren heiligen Status betonen, vom Himmel beauftragt zu sein. Die vom Feind manipulierte und verleumdete Geschichte muss umgestaltet werden, um den Stolz und die Mission des Volkes zu entfachen."
  KOR_huangguo_shiguan_tt: "§YCho Nam-seon§!, dessen Auswirkungen sind\n$MODIFIER_WAR_SUPPORT_FACTOR$: §G+10%§!, $MODIFIER_WEEKLY_CASUALTIES_WAR_SUPPORT$: §G+0.30%§!, $MODIFIER_WEEKLY_CONVOYS_WAR_SUPPORT$: §G+0.30%§!, $MODIFIER_WEEKLY_BOMBING_WAR_SUPPORT$: §G+0.30%§!"
  KOR_da_zongjiao: "Staatlich etablierte Dangun-Religion"
  KOR_da_zongjiao_desc: "Um die Herzen der Menschen zu vereinen, müssen wir einen höchsten nationalen Glauben etablieren. Dangun, der Vorfahre, wird nicht länger nur ein Mythos sein, sondern als einzige Gottheit der Staatsreligion verehrt werden, und der Anführer wird sein Sprecher in der Welt sein. Durch die Gründung der „staatlich etablierten Dangun-Religion“ werden wir das Blut, den Glauben und die politische Autorität der Nation in einem vereinen und so eine unzerstörbare spirituelle Säule schaffen."
  KOR_liyong_qian_rijun_ziyuan: "Nutzen Sie ehemalige japanische Militärressourcen"
  KOR_liyong_qian_rijun_ziyuan_desc: "Unsere ehemaligen Unterdrücker haben eine große Anzahl von Waffen, Fabriken und militärischen Einrichtungen auf unserem Land hinterlassen. Anstatt sie zu zerstören, ist es besser, sie zu unserem eigenen Vorteil zu nutzen. Wir werden diese wertvollen militärischen Ressourcen schnell übernehmen und als Abkürzung für unsere militärische Expansion und Kriegsvorbereitung integrieren. Das Erbe des Feindes von gestern wird heute zur Klinge unserer Rache."
  KOR_fuchou_zhuyi_jiaoyu: "Revanchistische Bildung"
  KOR_fuchou_zhuyi_jiaoyu_desc: "Wie können wir uns ein Land nennen, wenn wir unsere nationale Demütigung nicht gerächt haben? Von Grundschulen bis hin zu Universitäten wird jedes Klassenzimmer zu einem Raum für die Vermittlung von Racheideologien. Wir müssen jedes Kind an die Nöte und Demütigungen erinnern, die wir erlitten haben, und den Samen des Hasses tief in seinen Herzen säen. Dieser Hass wird sich schließlich in unendliche Macht verwandeln, um die Schande wegzuwaschen und mächtige Feinde zu besiegen."
  KOR_junbu_tebie_fa: "Militärisches Sondergesetz"
  KOR_junbu_tebie_fa_desc: "Außergewöhnliche Zeiten erfordern außergewöhnliche Maßnahmen. Für die Bedürfnisse der allgemeinen Mobilisierung des Landes werden wir das „Militär-Sondergesetz“ erlassen, das dem Militär über die Regierungsabteilungen hinaus die Macht verleiht, Ressourcen direkt zu verteilen und in die Wirtschaft einzugreifen. Das Land wird zu einem großen Militärlager, in dem alles dem Krieg dient und alles dem Sieg Platz macht."
  KOR_junbu_tebie_fa_tt: "§REntfernen§!§Y$war_economy$§!, gewinnen §Y$national_defense_state$§!"
  KOR_hualang_jingshen_zhuru: "Verströmen Sie den Geist von Hwarang-do"
  KOR_hualang_jingshen_zhuru_desc: "Die Hwarang der Silla-Ära waren Elitekrieger, die dem Land treu ergeben und bereit waren zu sterben. Wir werden diesen alten Kriegergeist wiederbeleben und ihn in die Seele unserer Armee einfließen lassen. Unsere Soldaten werden keine gewöhnlichen Menschen mehr sein, sondern moderne Hwarang, die nicht zögern werden, ihr Leben für den Anführer und das Imperium zu geben."
  KOR_baihu_tezhong_budui: "Spezialeinheiten des Weißen Tigers"
  KOR_baihu_tezhong_budui_desc: "Der weiße Tiger ist der Schutzpatron des Westens und symbolisiert Kriegsführung und Tapferkeit. Wir werden eine nach ihr benannte Spezialeinheit bilden, die die Elite der Elite und die Klinge für die Durchführung der gefährlichsten Missionen wie Enthauptung, Sabotage und Infiltration darstellt. Wenn der „Weiße Tiger“ entsandt wird, wird dies der Weltuntergang für die Anführer des Feindes sein."
  KOR_shenjijian_hangkongdui: "Divine Machine Arrow Air Corps"
  KOR_shenjijian_hangkongdui_desc: "Unsere Vorfahren nutzten einst die „Göttlichen Maschinenpfeile“, um Tausende von Pfeilen auf einmal abzufeuern und so die feindliche Armee niederzubrennen. Heute wird unser Luftkorps diesen glorreichen Namen erben. Jedes Kampfflugzeug ist ein „göttlicher Maschinenpfeil“, der auf die feindliche Formation geschossen wird. Sie werden aus 10.000 Metern Höhe Tod und Flammen auf unsere Feinde gießen und die göttliche Kraft unserer Vorfahren reproduzieren."
  KOR_chongjian_guichuan_jiandui: "Rekonstruieren Sie die Schildkrötenschiffflotte"
  KOR_chongjian_guichuan_jiandui_desc: "Die Schildkrötenschiffe von Admiral Yi Sun-sin waren einst eine unzerstörbare Seefestung, die den japanischen Piraten Angst und Schrecken einjagte. Wir werden den Mythos vom Schildkrötenschiff mit moderner Technologie wieder aufleben lassen. Unsere neue Generation von Großkampfschiffen wird über eine ebenso unzerstörbare Panzerung und Feuerkraft verfügen wie das Schildkrötenschiff. Sie werden eine unbesiegbare Flotte bilden, um die maritime Vormachtstellung des Imperiums zurückzuerobern."
  KOR_chongjian_guichuan_jiandui_tt: "$ITA_caligulas_pride_dynamic_modifier_tt$\n"
  KOR_huangtu_fangwei_quan: "Verteidigungsbereich des kaiserlichen Territoriums"
  KOR_huangtu_fangwei_quan_desc: "Das heilige Territorium des Reiches darf nicht durch kleine Schurken geschändet werden. Wir werden entlang der langen Küstenlinie und der Landgrenzen Hunderte von Kilometern tief einen „Verteidigungsgürtel des kaiserlichen Territoriums“ errichten, der aus Festungen, Artilleriebatterien, Radar und Minenfeldern besteht. Jeder Feind, der eine Invasion wagt, wird vollständig in dieser Todeszone begraben, bevor er unser Land betritt."
  KOR_huangguo_xingwang_zaici_yizhan: "Der Aufstieg oder Fall des Imperiums hängt von dieser Schlacht ab"
  KOR_huangguo_xingwang_zaici_yizhan_desc: "Der Aufstieg oder Fall des Imperiums hängt von dieser Schlacht ab! Wir haben keinen Rückzug. Das Land wird in einen Zustand des totalen Krieges eintreten, in dem jede Fabrik, jeder Zentimeter Land und jeder Bürger Teil der Kriegsmaschinerie werden. Wir werden das gesamte Schicksal der Nation aufs Spiel setzen, um der Welt zu beweisen, wer der vom Himmel beauftragte Endsieger ist!"
  KOR_huangguo_xingwang_zaici_yizhan_tt: "§RRemove§!§Y$national_defense_state$§!. Erhalte §Y$totaler_krieg_economy$§!."
  KOR_tudi_huangyou_hua: "Verstaatlichung von Land als Reichseigentum"
  KOR_tudi_huangyou_hua_desc: "Alles unter dem Himmel ist das Land des Monarchen. Um die Macht des Landes auf das Äußerste zu konzentrieren, werden wir das Privateigentum an Land abschaffen und verkünden, dass das endgültige Eigentum an allem Land innerhalb des Reiches der königlichen Familie gehört. Dadurch wird die Grundlage lokaler Tyrannen vollständig zerstört und es dem Land ermöglicht, jeden Quadratzentimeter Land einheitlich zu planen und mit beispielloser Effizienz zu nutzen."
  KOR_jianli_diguo_caifa: "Errichten Sie imperiale Konglomerate"
  KOR_jianli_diguo_caifa_desc: "Freier Wettbewerb ist ineffizient und verschwenderisch. Der Staat wählt persönlich die fähigsten Unternehmen aus und verleiht ihnen den Titel „Kaiserliches Konglomerat“ und Industriemonopolrechte. Mit der direkten Unterstützung der königlichen Familie werden diese riesigen Unternehmen zu unserer Wirtschaftsarmee zur Eroberung des Weltmarktes und stellen eine endlose treibende Kraft für die Expansion des Imperiums dar."
  KOR_huangshi_jingji_tizhi: "Königliches Wirtschaftssystem" #Total War Economy
  KOR_huangshi_jingji_tizhi_desc: "Die Wirtschaft des Landes sollte sorgfältig verwaltet werden wie das Privateigentum des Kaisers. Wir werden ein „Königliches Wirtschaftssystem“ errichten, mit einem königlichen Komitee, das sich aus den vertrauenswürdigsten Vertrauten und Experten zusammensetzt und direkt für die wirtschaftliche Lebensader des Landes verantwortlich ist. Von der Ressourcenzuteilung bis zur Fabrikproduktion wird alles unter dem absoluten Willen des Führers effizient funktionieren."
  KOR_guomin_laodong_shifeng: "Nationaler Arbeitsdienst"  
  KOR_guomin_laodong_shifeng_desc: "Dem Imperium Blut und Schweiß zu widmen, ist der größte Ruhm eines jeden Bürgers. Wir werden das System des „Nationalen Arbeitsdienstes“ einführen, das alle erwachsenen Bürger dazu zwingt, sich jedes Jahr kostenlos an staatlich vorgesehenen öffentlichen Bauprojekten zu beteiligen. Mit unserer gemeinsamen Arbeit werden wir Festungen bauen, Kanäle für das Imperium graben und das Fundament für Tausende von Generationen festigen."
  KOR_mmimiwuqi_jihua: "Geheimwaffenprogramm"
  KOR_mmimiwuqi_jihua_desc: "Konventionelle Kriegsführung reicht nicht mehr aus, um uns einen entscheidenden Vorteil zu verschaffen. Wir werden ein streng geheimes Waffenforschungs- und -entwicklungsprogramm starten, in dem die besten Köpfe des Imperiums zusammenkommen, um über die Ära hinausgehende „entscheidende Waffen“ wie Atomenergie, Langstreckenraketen und Düsenflugzeuge zu erforschen. Wenn unsere Geheimwaffen enthüllt werden, wird die Welt vor Angst zittern."
  KOR_mmimiwuqi_jihua_tt: "§Y$specialization_nuclear$§!, §Y$specialization_naval$§!, §Y$specialization_air$§!, §Y$specialization_land$§!$ADD_BREAKTHROUGH_PROGRESS_EFFECT_DESC$§G25.00%§!"
  KOR_chongehsn_tianming: "Bestätigen Sie den Auftrag des Himmels"
  KOR_chongehsn_tianming_desc: "Das Mandat des Himmels hat sich verschoben und die kaiserlichen Artefakte sollten übertragen werden! Der Niedergang Chinas beweist, dass es nicht länger würdig ist, Träger des „Mandats des Himmels“ zu sein. Unser großes koreanisches Reich ist mit seinem reinen kulturellen Erbe und seinem starken Reformwillen der wahre Besitzer des himmlischen Mandats. Wir werden der ganzen Welt verkünden, dass die alte Ära zu Ende ist und der neue Meister, der die Welt regiert, angekommen ist!"
  KOR_wangdao_tongyu_dongya: "Beherrsche Ostasien auf königliche Weise"   #Great Korean Concord Association
  KOR_wangdao_tongyu_dongya_desc: "Das Chaos in Ostasien ist auf den Verlust des wahren „königlichen Wegs“ der Führung zurückzuführen. Unser Großes Koreanisches Reich wird diesem Land mit seiner überlegenen Kultur und seinem gütigen Monarchen wieder Ordnung und Frieden bringen. Unsere Expansion ist keine barbarische Eroberung, sondern ein gerechter Akt der Aufklärung der Barbaren über den „königlichen Weg“ und der Herrschaft über alle Nationen mit „tugendhafter Regierungsführung“."
  KOR_bohai_xianmin_de_yiji: "Relikte der Bohai-Vorfahren"
  KOR_bohai_xianmin_de_yiji_desc: "In den riesigen Schneefeldern und Ebenen im Norden liegen die Relikte unserer Bohai-Vorfahren. Dieses riesige Land war einst die Heimat unserer Vorfahren, die auf Pferden galoppierten. Jetzt ist es an der Zeit, in die Fußstapfen der Geschichte zu treten, um die Relikte, die ursprünglich uns gehörten, „wiederzugewinnen“ und den Ruhm unserer Vorfahren wieder auf dieses verlorene Heimatland erstrahlen zu lassen."
  KOR_shanhaiguan_zhi_yao: "Blick vom Shanhai-Pass"
  KOR_shanhaiguan_zhi_yao_desc: "Die Chinesische Mauer steht auf der Spitze des Shanhai-Passes und gleicht einem Drachen, der sich nach Westen windet. Außerhalb des Passes liegt unser reformierter Großkoreanischer Staat; Innerhalb des Passes liegen die Central Plains, die von Prätendenten usurpiert und von imperialen Artefakten besudelt wurden. Wir geben uns nicht länger damit zufrieden, ein „Klein-China“ zu sein und in einer Ecke zu leben. Dieser flüchtige Blick wird sich in unseren Ehrgeiz verwandeln, die Welt zu vereinen, und der nächste Schritt des Imperiums wird darin bestehen, direkt einzumarschieren!"
  KOR_shanhaiguan_zhi_yao_tt: "Erhalte §Y$KOR_ruguan_nanxia$§!, dessen Effekte sind:\nAlle §YChinesische Fraktionen§!:\n$MODIFIER_ATTACK_BONUS_AGAINST_A_COUNTRY$:§G+10%§!\n$MODIFIER_DEFENSE_BONUS_AGAINST_A_COUNTRY$:§G+5.0%§!\n\n"
  KOR_chongjian_chaogong_tixi: "Rekonstruieren Sie das Nebenflusssystem"
  KOR_chongjian_chaogong_tixi_desc: "Das alte Nebenflusssystem ist mit dem Fall der Central Plains zusammengebrochen. Jetzt werden wir auf der Grundlage des „Königlichen Weges“ ein brandneues Nebenflusssystem wieder aufbauen, dessen Mittelpunkt unser Großes Koreanisches Reich ist und das sich in alle Meere erstreckt. Alle Barbaren aus allen Richtungen sollten kommen, um Tribut zu zollen und Treue zu bekunden und die Rituale und die Kultur unserer Dynastie kennenzulernen. Die Ordnung Ostasiens wird von uns neu definiert und aufrechterhalten."
  KOR_wending_zhongyuan: "Kämpfen Sie um die Central Plains"
  KOR_wending_zhongyuan_desc: "Diejenigen, die die Central Plains usurpieren, sind ihrer Position unwürdig und haben das Mandat des Himmels längst verloren. Die Neun Stativkessel, die die Macht der Welt symbolisieren, sollten nicht länger von solch kleinen Schurken geschändet werden. Unser Großes Koreanisches Reich, das 300 Jahre lang das Rechtssystem der Ming-Dynastie geerbt hat, verfügt über eine starke Armee und die Unterstützung des Volkes. Es ist Zeit, Truppen in den Pass zu schicken und nach dem Gewicht dieser neun Dreibeinkessel zu fragen!"
  KOR_jicheng_chongzhen_datong: "Dreihundert Jahre des Strebens"
  KOR_jicheng_chongzhen_datong_desc: "Seit Kaiser Chongzhen auf Meishan Selbstmord begangen hat, weinten alle Gelehrten unseres östlichen Königreichs, die die chinesische Zivilisation hochhalten, in ihren Herzen und führten seinen Herrschaftstitel bis heute, fast 300 Jahre lang, weiter. Dreihundert Jahre Ausdauer, dreihundert Jahre Warten, alles für heute. Die Wiederherstellung Chinas und der Wiederaufbau der Ming-Dynastie ist nicht mehr nur ein Slogan, sondern ein heiliger Wunsch, der von Generation zu Generation weitergegeben und in die Knochen unserer koreanischen Nation eingeprägt wurde!"
  KOR_jicheng_chongzhen_datong_tt: "\nAlle kontrollierten §YChinesische Regionen§!:\nKonformität §G+15 %§!, Widerstand §G-15 %§!"
  KOR_zijincheng_de_longyi: "Drachenthron in der Verbotenen Stadt"
  KOR_zijincheng_de_longyi_desc: "Dieser Drachenthron in der Mitte der Halle der Höchsten Harmonie in der Verbotenen Stadt ist das ultimative Symbol der Macht auf der Welt. Es wartet auf einen Meister, der seiner wirklich würdig ist. Unsere eisernen Hufe werden über die gesamte Zentralebene schreiten und unsere Flagge wird über der Hauptstadt wehen. Wenn unser Monarch auf diesem Drachenthron sitzt, wird ein brandneues chinesisches Reich unter unserer Herrschaft ausgerufen."
  KOR_zijincheng_de_longyi_tt: "Wir werden die Anerkennung der §Ychinesischen Regionen§! erlangen"
  KOR_tiansun_minzu_de_shenhua: "Mythos der himmlischen Nachkommennation"
  KOR_tiansun_minzu_de_shenhua_desc: "Wir sind keine einfachen Sterblichen, sondern Nachkommen von Hwanung, dem Sohn des Himmels, der auf den Berg Paektu herabstieg – die „Nation der himmlischen Söhne“. Geboren mit der heiligen Mission, alle Völker auf der Erde zu erleuchten und zu regieren, werden wir diesen großen nationalen Mythos schmieden und jeden Bürger fest glauben lassen, dass unsere Eroberung ein vom Himmel verliehenes Recht, die Verkörperung des göttlichen Willens, ist."
  KOR_jiefang_aertai_de_tongbao: "Befreie unsere altaischen Verwandten"
  KOR_jiefang_aertai_de_tongbao_desc: "Von den Türken bis zu den Mongolen sind unsere altaischsprachigen Verwandten über die riesigen Steppen Innerasiens verstreut. Sie sind Brüder, die mit uns einen gemeinsamen Vorfahren haben, nun aber unter der Fremdherrschaft stöhnen. Als stärkste und fortschrittlichste unter den altaischen Nationen haben wir die heilige Pflicht, diese verlorenen Brüder zu befreien, sie zu vereinen und den Ruhm unserer Vorfahren wiederherzustellen."
  KOR_jiefang_aertai_de_tongbao_tt: "Schalten Sie die Entscheidung frei §YInfiltrieren Sie altaische Regionen§! – lokale Aufstände werden ausbrechen, um uns zu unterstützen, wenn wir mit §Y[SOV.GetAdjective]§! in den Krieg ziehen."
  KOR_tamier_gaoyuan_de_taijiqi: "Der Taegeukgi über dem Pamir-Plateau"
  KOR_tamier_gaoyuan_de_taijiqi_desc: "Antike Epen und Mythen weisen alle auf denselben Ort hin – das Pamir-Plateau, das Dach der Welt, das die Wiege der Geburt und Migration unserer Nation ist. Unser Vormarsch nach Westen ist nicht nur eine Eroberung, sondern eine Reise auf der Suche nach unseren Wurzeln. Wenn unser Taegeukgi endlich auf diesem heiligen Plateau gepflanzt wird, wird die ganze Welt Zeuge sein, dass die Nation der Himmlischen Söhne in ihre ursprüngliche Heimat zurückgekehrt ist."
  KOR_tamier_gaoyuan_de_taijiqi_tt: "Schalten Sie die Entscheidung frei §YInfiltrieren Sie den Pamir§! – lokale Aufstände werden ausbrechen, um uns zu unterstützen, wenn wir mit §Y[SOV.GetAdjective]§! in den Krieg ziehen."
  KOR_xunfang_bosi_de_biaoqin: "Suchen Sie unsere persischen Cousins ​​auf"
  KOR_xunfang_bosi_de_biaoqin_desc: "Persische Epen berichten von einer alten Verbindung zwischen einem im Exil lebenden persischen Prinzen und einer Silla-Prinzessin. Dies ist kein isolierter Beweis, sondern ein Beweis für die tiefgreifenden historischen Bindungen zwischen unseren beiden Nationen. Wir werden diplomatische Missionen entsenden, den Kontinent durchqueren, um unsere „verlorenen Cousins“ zu suchen, diese vergessene Blutlinie wieder zu verbinden und eine große Allianz in ganz Asien aufzubauen."
  KOR_jianli_dongfang_shengcun_kongjian: "Östlicher Lebensraum"
  KOR_jianli_dongfang_shengcun_kongjian_desc: "Unsere große Nation sollte nicht länger auf diese schmale Halbinsel beschränkt sein. Die riesigen, trostlosen und doch fruchtbaren Gebiete Sibiriens im Norden und Zentralasiens im Westen warten auf einen wahren Meister. Wir werden das Schwert als Pflug nehmen, endlosen „östlichen Lebensraum“ für unser Volk schaffen und die ewigen Ressourcen und die Zukunft unseres Reiches für Tausende von Generationen sichern."
  KOR_qiannian_diguo_de_dianli: "Zeremonie des Millennium Empire"
  KOR_qiannian_diguo_de_dianli_desc: "Vom Berg Paektu bis zum Pamir, vom Arktischen Ozean bis zum Pazifischen Ozean hat das Territorium des Reiches seinen Höhepunkt erreicht. Wir werden eine beispiellose „Millennium Empire-Zeremonie“ abhalten, um der Welt zu verkünden, dass ein großes Imperium entstanden ist, das tausend Jahre bestehen soll. An diesem Tag werden alle Nationen zusammenkommen, um zu huldigen, der Anführer wird gekrönt und unsere glorreiche Geschichte wird auf die glorreichste erste Seite schlagen."
  KOR_richuzhidi_de_qingsuan: "Abrechnungen im Land der aufgehenden Sonne"
  KOR_richuzhidi_de_qingsuan_desc: "Jetzt ist es an der Zeit, die jahrzehntelange Blutschuld bei unseren östlichen Nachbarn ein für alle Mal zu begleichen. Die Demütigungen, die wir erlitten haben, werden hundertfach zurückgezahlt; Das Blut und die Tränen, die wir vergießen, sollen mit ihrem Blut vergolten werden. Die Stunde der Rache ist gekommen – dieses Mal werden wir die Richter sein, und sie werden die Sünder sein."
  KOR_dongjing_shen_ppan: "Tokio-Prozess"
  KOR_dongjing_shen_ppan_desc: "Auf der historischen Urteilsbank sollten nicht nur Westler sitzen. Wenn unsere Truppen das Land Tokio betreten, werden wir unser eigenes Tribunal einrichten und alle japanischen Kriegsverbrecher auf die Anklagebank bringen. Unter den Augen der ganzen Welt und im Namen der Sieger werden wir einen gerechten „Tokio-Prozess“ führen und Gerechtigkeit für alle unterdrückten asiatischen Völker anstreben."
  KOR_richuzhidi_de_nvwang: "Königin des Landes der aufgehenden Sonne"
  KOR_richuzhidi_de_nvwang_tt: "Einige $INDUSTRIAL_ORG_TOOLTIP_HEADER$ von [JAP.GetAdjective] werden verfügbar sein."
  KOR_richuzhidi_de_nvwang_desc: "Die vollständige Eroberung einer Nation erfordert nicht nur militärische Gewalt, sondern auch den Geist. Wir werden Ihre Hoheit Prinzessin Lee Bang-ja, die unser kaiserliches Blut trägt, dabei unterstützen, die Krone zu tragen und die „Königin des Landes der aufgehenden Sonne“ zu werden. Ein von uns belehnter Monarch soll ein unzerbrechliches Joch für Japan sein und seine ewige Unterwerfung unter unser Reich sicherstellen."
  KOR_caidan_tianwai_laike: "Außerirdische Besucher"
  KOR_caidan_tianwai_laike_desc: "Unsere „Himmlischen Sohn“-Vorfahren sind erwacht und werden persönlich die Richtung unserer wissenschaftlichen Forschung leiten. Wir werden unsere gesamte nationale Kraft einsetzen, um rund um dieses „außerirdische Objekt“ ein Forschungszentrum auf höchstem Niveau zu errichten und die von ihm eingeführte Sternentechnologie über die Zeiten hinaus in das unzerstörbare Schwert und den Pflug des Imperiums umzuwandeln."
  KOR_tainti_yanjiu_xueyuan: "Forschungsinstitut für Astronomische Technik"
  KOR_tainti_yanjiu_xueyuan_desc: "Das Wissen um den „Himmlischen Sohn“ hat uns die Tür zum Universum geöffnet. Wir werden das „Astronomical Engineering Research Institute“ gründen, dessen einziges Ziel darin besteht, diese tiefgreifenden interstellaren Navigationstheorien in die Praxis umzusetzen und das erste interstellare Raumschiff zu entwerfen und zu bauen, das uns gehört, für das ultimative Ziel unseres Imperiums – die Rückkehr zu den Sternen und zum Meer."
  KOR_tainti_yanjiu_xueyuan: "Forschungsinstitut für Astronomische Technik"
  KOR_tainti_yanjiu_xueyuan_desc: "Das Wissen um den „Himmlischen Sohn“ hat uns die Tür zum Universum geöffnet. Wir werden das „Astronomical Engineering Research Institute“ gründen, dessen einziges Ziel darin besteht, diese tiefgreifenden interstellaren Navigationstheorien in die Praxis umzusetzen und das erste interstellare Raumschiff zu entwerfen und zu bauen, das uns gehört, für das ultimative Ziel unseres Imperiums – die Rückkehr zu den Sternen und zum Meer."
  KOR_tainti_he_fanyingdui: "Energie von den Sternen"
  KOR_tainti_he_fanyingdui_desc: "Der „Himmlische Sohn“ hat uns das ultimative Geheimnis des Universums offenbart: die Nutzung eines Miniatursterns. Wir werden den ersten „Kernreaktor“ bauen, einen Tempel, der diese „Energie von den Sternen“ sicher freisetzen kann. In jede Kriegsmaschinerie des Imperiums soll unendliche Macht eingespeist werden, die uns dabei unterstützt, unserem Schicksal entgegenzumarschieren, zu den Sternen und zum Meer zurückzukehren."
  KOR_tainti_he_fanyingdui_tt: "Unsere §YWissenschaftsberater§ werden bessere Eigenschaften erlangen"
  KOR_weilai_tanke_guoce: "Kriegsmaschine: „Bärenfrau“"
  KOR_weilai_tanke_guoce_desc: "Mit der Technologie des „Himmlischen Sohnes“ als Kern und benannt nach der Mutter Erde im „Dangun-Mythos“ werden wir das Projekt „Bärenfrau“ starten. Wir werden Landkreuzer wie mobile Festungen bauen, die uneinnehmbar und über eine gewaltige Feuerkraft verfügen. Sie sollen als absoluter Kern unserer Armee dienen und alle Feinde vernichten, die es wagen, sich dem Vormarsch des Imperiums in den Weg zu stellen."
  KOR_weilai_tanke_guoce_tt: "\nErlauben Sie die Organisation von §Y$KOR_huopaoyunbingche_ying_tech$§!"
  KOR_weilai_zhanshi_guoce: "Kriegsmaschine: „Hwanung“"
  KOR_weilai_zhanshi_guoce_desc: "Wenn der „Himmlische Sohn“ in die Welt der Sterblichen herabsteigt, muss er über göttliche Macht verfügen. Wir werden die genetische Verbesserung nutzen, um den Körper der Soldaten zu stärken und sie mit der neu entwickelten Powerrüstung vom Typ „Hwanung“ auszustatten. Diese Rüstung soll Soldaten übermenschliche Stärke und Schutz verleihen und sie zu unbesiegbaren göttlichen Soldaten auf dem Schlachtfeld machen. Ein „Hwanung“-Krieger reicht aus, um es mit einer Kompanie sterblicher Truppen aufzunehmen."
  KOR_weilai_zhanshi_guoce_tt: "\nErlauben Sie die Organisation von §Y$KOR_donglijia_ying_tech$§!"
  KOR_weilai_zhandouji: "Kriegsmaschine: „Hwanin“"
  KOR_weilai_zhandouji_desc: "Beherrsche im Namen des Himmlischen Kaisers den Himmel. Wir werden die Luft- und Raumfahrttechnologie des „Heavenly Son“ integrieren, um den Überschall-Luftüberlegenheitsjäger vom Typ „Hwanin“ zu entwickeln. Es wird über beispiellose Geschwindigkeit und Manövrierfähigkeit verfügen, wie der Speer des himmlischen Kaisers, das Firmament des Feindes durchbrechen und alle Bedrohungen für unsere Armee und Marine vom Himmel vertreiben."
  KOR_women_de_mubiao_shi_xingchen_dahai: "Ruf des Sternenhimmels"
  KOR_women_de_mubiao_shi_xingchen_dahai_desc: "Wenn unsere Eroberung der Erde ihren Höhepunkt erreicht hat und kein Zentimeter Land mehr übrig ist, wohin sich das Schicksal erstreckt, hören wir den Ruf aus dem grenzenlosen Sternenhimmel. Unsere Reise sollte nicht an diesem kleinen blauen Planeten enden. Wir werden unsere gesamte nationale Kraft für die Entwicklung der Luft- und Raumfahrttechnologie einsetzen und dabei unseren Blick auf den Mond, den Mars und sogar den tieferen Weltraum richten. Die Sterne und das Meer sind das ultimative Ziel unserer himmlischen Sohnnation!"
  KOR_women_de_mubiao_shi_xingchen_dahai_tt: "Wir werden als §Y, der Einheitliche menschliche Weisheitszustand von Hwan§!, bekannt sein"
##Military
  #######################################################################################################################################################################
  KOR_junshi_qiansan_yu_zhengbian: "Demobilisierung und Umstrukturierung"
  KOR_junshi_qiansan_yu_zhengbian_desc: "Nach der Befreiung gibt es in Korea zahlreiche bewaffnete Gruppen. Wir müssen schnell eine einheitliche Demobilisierung und Umstrukturierung dieser Nachzügler und Fraktionsstreitkräfte durchführen, aus ihnen loyales und zuverlässiges Personal auswählen und die schwarzen Schafe beseitigen. Nur so können wir eine nationale Verteidigungstruppe aufbauen, die wirklich zum Land gehört und unter einer einheitlichen Führung steht."
  KOR_junshi_lujun_xueyuan: "Gründung einer Akademie für Unteroffiziere der Armee"
  KOR_junshi_lujun_xueyuan_desc: "Eine Armee ohne qualifizierte Offiziere ist nichts anderes als ein Mob. Wir werden eine moderne Akademie für Unteroffiziere der Armee einrichten, um systematisch junge Offiziere mit patriotischem Gefühl, beruflicher Bildung und Führungsqualitäten auszubilden. Sie sollen in Zukunft das stählerne Rückgrat unserer Armee werden."
  KOR_junshi_huishou_zhuangbei: "Stellen Sie gegnerische Ausrüstung wieder her"
  KOR_junshi_huishou_zhuangbei_desc: "Der flüchtende Feind hinterließ eine große Menge Waffen und Munition auf unserem Land. Es handelt sich um wertvolle Ressourcen, die sofort genutzt werden können. Wir werden Kräfte organisieren, um eine gründliche Durchsuchung aller verlassenen Militärlager und Lagerhäuser durchzuführen und die gesamte verwendbare Ausrüstung zur Bewaffnung unserer neu aufgestellten Armee zu bergen."
  KOR_junshi_huishou_zhuangbei_tt: "§Y1§ Zufälliger Armeekommandeur erhält §Y$scavenger$§!：\n-$MODIFIER_EQUIPMENT_CAPTURE_FACTOR$：§G+3%§!"
  KOR_junshi_lujun_wuqiguanlibu: "Abteilung für Waffenmanagement der Armee"
  KOR_junshi_lujun_wuqiguanlibu_desc: "Ein Sammelsurium an Waffenmodellen hat unserer Logistik eine große Katastrophe beschert. Ziel der Einrichtung der „Army Weapons Management Department“ ist die einheitliche Registrierung, standardisierte Umgestaltung und Wartung bestehender Ausrüstung sowie die Formulierung von Standards für die künftige Lokalisierung von Waffen. Lassen Sie jede unserer Waffen die beste Pflege erhalten."
  KOR_junshi_zongjie_kangri_jingyan: "Fassen Sie die antijapanischen Kriegserfahrungen zusammen"
  KOR_junshi_zongjie_kangri_jingyan_desc: "Im langjährigen antijapanischen Kampf sammelten unsere Vorfahren reiche Erfahrungen im Guerilla- und Gebirgskrieg. Wir müssen diese wertvollen praktischen Erfahrungen systematisch zusammenfassen, in Bänden zusammenfassen und in die Kampfvorschriften und Trainingsprogramme unserer Armee integrieren, damit sie zu unserer einzigartigen magischen Waffe werden, um Feinde zu besiegen und Schlachten zu gewinnen."
  KOR_junshi_zongjie_kangri_jingyan_tt: "§YAlle Armeekommandeure§!：\nErhöhen Sie Ihre Planungsfähigkeiten:§G1§!：\nErhöhen Sie Ihre Logistikfähigkeiten:§G1§!"
  KOR_junshi_dongji_zhanzheng: "Winterkrieg"
  KOR_junshi_dongji_zhanzheng_desc: "Der Winter auf der koreanischen Halbinsel ist bitterkalt, was eine große Belastungsprobe für die Kampffähigkeit der Armee darstellt. Wir werden die Winterkampfausbildung der Armee besonders verstärken und spezielle kältebeständige Ausrüstung entwickeln und verteilen. Wir werden uns nicht nur an die strenge Kälte anpassen, sondern sie auch nutzen und den kalten Winter in ein weißes Grab verwandeln, in dem alle eindringenden Feinde begraben sind."
  KOR_junshi_kaifa_zhiming_wuqi: "Entwickeln Sie tödliche Infanterieausrüstung"
  KOR_junshi_kaifa_zhiming_wuqi_desc: "Im Falle unzureichender Panzer und schwerer Artillerie ist die Feuerkraft der Infanterie von entscheidender Bedeutung. Wir werden unsere Ressourcen konzentrieren, um eine Reihe billiger, aber tödlicher Infanterie-Unterstützungswaffen wie Maschinenpistolen, leichte Maschinengewehre und Mörser zu entwickeln und jede unserer Infanterietrupps in eine mobile Feuerfestung zu verwandeln."
  KOR_junshi_jidong_bubing: "Silver Wheel-Abteilung"
  KOR_junshi_jidong_bubing_desc: "In einer Zeit, in der die Motorisierung noch nicht populär ist, sind Fahrräder die beste Wahl für eine schnelle Infanteriemobilität. Wir werden die „Silver Wheel Division“ bilden, mit Fahrrädern als Haupttransportmittel. Sie werden mit einer Geschwindigkeit, die weit über der der Infanterie liegt, in die Flanken und den Rücken des Feindes eindringen und uns mit silbernen Rädern den Weg zum Sieg ebnen."
  KOR_junshi_houqin_yunshu_qianghua: "Verbesserung des Logistiktransports"
  KOR_junshi_houqin_yunshu_qianghua_desc: "Amateure führen Kriege um Feuerkraft; Profis kämpfen für die Logistik. Wir werden stark in den Aufbau eines modernen Logistiksystems investieren, mehr LKWs kaufen, ein effizientes Versorgungsstationsnetz aufbauen und professionelle Talente im Logistikmanagement fördern. Ein starkes Logistiksystem ist die Lebensader für die Expedition unserer großen Armee."
  KOR_junshi_touzi_qiche_chanye: "Investieren Sie in die Automobilindustrie"
  KOR_junshi_touzi_qiche_chanye_desc: "Die Motorisierung der Armee kommt ohne eine starke heimische Automobilindustrie nicht aus. Wir werden stark in die Automobilindustrie investieren, nicht nur für den zivilen Gebrauch, sondern auch für die Produktion unserer eigenen Militärlastwagen, Jeeps und sogar gepanzerten Fahrzeuge. Mit unseren eigenen Rädern kann unsere Armee schneller und weiter laufen."
  KOR_junshi_gaijin_yunshuxian: "Verbessern Sie Produktionslinien"
  KOR_junshi_gaijin_yunshuxian_desc: "Während die Qualität der Waffen wichtig ist, ist die Quantität auch ein Schlüsselfaktor für den Ausgang eines Krieges. Wir werden fortschrittliche Managementmethoden und Produktionstechnologien einführen, um die rückständigen Produktionslinien unserer Arsenale umfassend zu verbessern und mehr und bessere Waffen in kürzerer Zeit und zu geringeren Kosten herzustellen."
  KOR_junshi_feiduicheng_zhanzheng: "Die Macht der Soldaten"
  KOR_junshi_feiduicheng_zhanzheng_desc: "Letztlich sind es die Menschen, die über den Ausgang eines Krieges entscheiden. Wir werden die ideologische und politische Bildung der Soldaten stärken, ihre Ernährungsstandards und Sozialleistungen verbessern und eine harte, realistische Ausbildung durchführen. Ein Soldat mit hoher Moral, festen Überzeugungen und einem starken Körperbau ist weitaus mächtiger als jede fortschrittliche Waffe."
  KOR_junshi_shen_wadong: "Grabe tiefe Tunnel"
  KOR_junshi_shen_wadong_desc: "Angesichts der starken Artillerie und Luftüberlegenheit des Feindes müssen wir unsere Verteidigungsanlagen in den Untergrund verlegen. Mobilisieren Sie Soldaten und Zivilisten, um in wichtigen strategischen Bereichen „tiefe Tunnel zu graben und reichlich Getreide zu lagern“ und ein riesiges Tunnelnetzwerk aufzubauen, in dem Truppen versteckt, Getreide gelagert und sogar unterirdische Fabriken errichtet werden können. Lassen Sie unsere Stellungen zu einer unzerstörbaren unterirdischen Chinesischen Mauer für den Feind werden."
  KOR_junshi_dihou_shentou: "Infiltration hinter den Kulissen"
  KOR_junshi_dihou_shentou_desc: "Krieg wird nicht nur an der Front geführt. Wir werden kleine Eliteeinheiten ausbilden und entsenden, um hinter die feindlichen Linien einzudringen und Aufgaben wie die Zerstörung von Verkehrslinien, die Ermordung wichtiger Ziele und die Anstiftung zum lokalen Widerstand auszuführen. Den Feind von innen heraus aufzulösen ist manchmal effektiver als Tausende von Truppen an der Front."
  KOR_junshi_dihou_shentou_tt: "§YZwei§ zufällige Armeekommandeure erhalten §Y$guerilla_fighter$§!：\n-$MODIFIER_DIG_IN_SPEED_FACTOR$：§G+50%§!"
  KOR_junshi_renhai_zhanshu: "Taktiken der menschlichen Welle"
  KOR_junshi_renhai_zhanshu_desc: "Wenn wir an Ausrüstung im Nachteil sind, sind unsere zahllosen Soldaten mit festem Willen unser größter Vorteil. Wir werden die „Menschenwellen-Taktik“ anwenden und Welle für Welle Angriffe einsetzen, um die Munition des Feindes zu erschöpfen und seinen Willen zu brechen. Angesichts unseres revolutionären Stroms wird jede solide Position untergraben."
  KOR_junshi_youshi_huoli: "Überlegene Feuerkraft"
  KOR_junshi_youshi_huoli_desc: "Fleisch und Blut sollten nicht länger dazu verwendet werden, Stahl frontal zu konfrontieren. Wir werden die Doktrin der „überlegenen Feuerkraft“ übernehmen und betonen, dass wir in jeder Schlacht die Artillerie- und Luftwaffenkraft um ein Vielfaches stärker als die des Feindes konzentrieren müssen. Mit absoluter Feuerüberlegenheit werden wir die Waagschale des Sieges völlig auf unsere Seite kippen."
  KOR_junshi_zhuangjia_yanjiu: "Panzerforschung"
  KOR_junshi_zhuangjia_yanjiu_desc: "Panzer sind die Könige der Landkriegsführung, und wir müssen über unsere eigenen Panzertruppen verfügen. Wir werden ein Panzerforschungsprogramm starten, das mit dem Kopieren ausländischer Modelle beginnt, nach und nach erforscht und Erfahrungen sammelt und schließlich unsere eigenen „Könige der Landkriegsführung“ entwirft und herstellt, die an unser Gelände und unsere Taktiken angepasst sind."
  KOR_junshi_paobing_yanjiu: "Artillerie-Verstärkung"
  KOR_junshi_paobing_yanjiu_desc: "Wir werden die Kernposition der Artillerie in der Armee weiter stärken. Wir werden nicht nur die Zahl der verschiedenen Arten von Artillerie erhöhen, sondern auch fortschrittliche Technologien wie Raketenartillerie und selbstfahrende Artillerie energisch weiterentwickeln und ein schnelles und genaues Aufklärungs- und Führungssystem für die Artillerie aufbauen. Unsere Artillerie wird zu den Göttern werden, die das Schlachtfeld beherrschen."
  KOR_junshi_lubing_jixiehua: "Mechanisierung der Infanterie"
  KOR_junshi_lubing_jixiehua_desc: "Die Ära der Infanterie, die auf „eiserne Füße“ angewiesen war, muss enden. Wir werden die Infanteriedivisionen mit einer großen Anzahl von Lastkraftwagen, Halbkettenfahrzeugen und sogar gepanzerten Personentransportern ausrüsten, um die Mechanisierung der Infanterie zu verwirklichen. Dies wird die strategische Mobilität unserer Armee erheblich verbessern und es uns ermöglichen, blitzschnell an jedem wichtigen Punkt des Schlachtfelds zu erscheinen."
  KOR_junshi_lubing_jixiehua_tt: "Aktiviere §YWhite Tiger Armored Vehicle§! mit den folgenden Effekten: \n§Y$armored_car$§! und §Y$armored_car_recon$§!:\nPanzerungsangriff: §G+10 % §!\nPanzerungsdurchdringungstiefe: §G+10 % §!\nOrganisation: §G+5§!\nUnterdrückung: §G+0.5§!\n\n§Y$armored_car$§!:\nVerteidigung: §G+20§!\nOrganisation: §G+10§!\n§YWälder: §!\nÄnderung des Bewegungsmodifikators: §G+15 % §!\nAngriffsmodifikator Änderung: §G+20 % §!\n§Y Wüsten: §!\nÄnderung des Bewegungsmodifikators: §R-40 % §!\nÄnderung des Angriffsmodifikators: §R-20 % §!\n§YSnow: §!\nÄnderung des Bewegungsmodifikators: §G+35 % §!\nÄnderung des Angriffsmodifikators: §G+20 %§!\n§YPlains:§!\nÄnderung des Bewegungsmodifikators:§G+20 %§!\nÄnderung des Angriffsmodifikators:§G+20 %§!\n§YCities:§!\nÄnderung des Bewegungsmodifikators:§G+10 %§!\nÄnderung des Angriffsmodifikators: §G+15 %§!"
  KOR_junshi_xiandai_lujun: "Moderne Armee"
  KOR_junshi_xiandai_lujun_desc: "Nach einer Reihe von Reformen, Schulungen und Erweiterungen hat sich unsere Armee völlig verändert. Mit vernünftiger Organisation, hochentwickelter Ausrüstung, wissenschaftlichen Lehren und hoher Moral ist es nicht mehr die Armee mit „Hirse plus Gewehren“, sondern eine mächtige Streitmacht, die wirklich in der Lage ist, moderne Kriege zu gewinnen."
  KOR_junshi_jieguan_feiji: "Übernehmen Sie alte japanische Flugzeuge"
  KOR_junshi_jieguan_feiji_desc: "Der Feind hat eine große Anzahl von Flugzeugen auf Flughäfen zurückgelassen, obwohl sie in ihren Modellen veraltet sind, sind sie für uns das erste wertvolle Gut beim Aufbau einer Luftwaffe. Wir werden diese Flugzeuge schnell übernehmen, die brauchbaren reparieren und die beschädigten für Ersatzteile demontieren. Unser Himmel wird von den Trümmern dieser „Zero“- und „Hayabusa“-Kampfflugzeuge abheben."
  KOR_junshi_tebie_xingdong_bu: "Spezialeinsatzkommando"
  KOR_junshi_tebie_xingdong_bu_desc: "Um die Führung und Koordination der Elite-Spezialkräfte des Heeres, der Marine und der Luftwaffe zu vereinheitlichen, werden wir ein dienststellenübergreifendes „Spezialeinsatzkommando“ einrichten. Von der Infiltration hinter den Linien bis zur Geiselbefreiung, von der strategischen Aufklärung bis zu Operationen zur Terrorismusbekämpfung wird dieses Kommando zur schärfsten und geheimnisvollsten Klinge in unseren Händen."
  KOR_junshi_fangkong: "Flugabwehr"
  KOR_junshi_fangkong_desc: "Der Schutz unserer Städte und Fabriken vor feindlichen Flugzeugbomben ist die oberste Priorität der Landesverteidigung. Wir werden verschiedene Arten von Flugabwehrartillerie energisch entwickeln, sie um alle wichtigen strategischen Ziele herum stationieren und ein erstes Luftverteidigungsfeuernetzwerk aufbauen. Jedes feindliche Flugzeug, das es wagt, in geringer Höhe einzudringen, muss den Preis dafür zahlen."
  KOR_junshi_leida_yanjiu: "Radarforschung"
  KOR_junshi_leida_yanjiu_desc: "Augen, die tausend Meilen weit sehen, und Ohren, die den Wind hören, sind Voraussetzungen für den Sieg in Luftschlachten. Wir werden Ressourcen investieren, um die Radartechnologieforschung zu starten. Die Beherrschung dieser „Magie“, die es uns ermöglicht, feindliche Flugzeuge in Hunderten von Kilometern Entfernung so früh wie möglich zu erkennen, wird sicherstellen, dass wir in zukünftigen Luftschlachten immer die Initiative ergreifen."
  KOR_junshi_jianshe_jichang: "Bau eines Luftwaffenstützpunkts"
  KOR_junshi_jianshe_jichang_desc: "Adler brauchen starke Nester. Wir werden einen landesweiten Luftwaffenstützpunktbauplan umsetzen und moderne Luftwaffenstützpunkte mit langen Start- und Landebahnen, soliden Hangars und kompletten Logistikanlagen bauen. Diese Stützpunkte sollen die Startplattformen für unsere zukünftige Luftwaffe sein, um dem Sieg entgegenzumarschieren."
  KOR_junshi_hangkong_gongye_mengya: "Spross der Luftfahrtindustrie"
  KOR_junshi_hangkong_gongye_mengya_desc: "Wir können uns nicht ewig auf importierte Flugzeuge verlassen. Wir beginnen mit der Produktion von Grundkomponenten wie Rümpfen, Propellern und Fahrwerken, um nach und nach unsere eigene Luftfahrtindustrie aufzubauen. Obwohl dies nur ein Keim ist, ist dies für uns der erste Schritt auf dem langen Weg, letztendlich selbständig fortschrittliche Kampfflugzeuge herzustellen."
  KOR_junshi_waiguo_hangkong: "Ausländische Designlizenzen"
  KOR_junshi_waiguo_hangkong_desc: "Bevor man Flugzeuge eigenständig entwerfen kann, ist der Kauf ausländischer Produktionslizenzen die pragmatischste Wahl. Durch die Einführung und Nachahmung ausgereifter Modelle, die im echten Kampf getestet wurden, können wir unsere Luftwaffe mit dem geringsten Risiko und der höchsten Geschwindigkeit ausrüsten und dabei wertvolle Fertigungserfahrungen sammeln."
  KOR_junshi_jianli_hangkongxueyue: "Gründung einer Luftfahrtakademie"
  KOR_junshi_jianli_hangkongxueyue_desc: "Der Ausbildungszyklus für Piloten ist lang und teuer. Wir werden eine formelle Luftfahrtakademie einrichten, um professionelle Talente der Luftwaffe wie Piloten, Navigatoren und Mechaniker systematisch auszubilden. Dieser Ort soll die Wiege unserer zukünftigen „Ritter der Lüfte“ werden und unserer Luftwaffe einen stetigen Strom frischer Blute liefern."
  KOR_junshi_cezhong_zhandouji: "Luftüberlegenheit"
  KOR_junshi_cezhong_zhandouji_desc: "Den Himmel zu kontrollieren bedeutet, die Initiative des Krieges zu kontrollieren. Wir werden die Eroberung und Aufrechterhaltung der „Luftüberlegenheit“ als Hauptaufgabe der Luftwaffe betrachten, uns auf die Entwicklung leistungsstarker Kampfflugzeuge konzentrieren und proaktive Luftkampftaktiken formulieren. Unser Ziel ist es, dass kein feindliches Flugzeug frei über unserem Schlachtfeld fliegen kann."
  KOR_junshi_cezhong_zhiyuan: "Bodenunterstützung"
  KOR_junshi_cezhong_zhiyuan_desc: "Die Luftwaffe ist nicht nur für ritterliche Duelle am Himmel da, sondern soll auch zur „fliegenden Artillerie“ des Heeres werden. Wir werden Sturzbomber und Angriffsflugzeuge energisch entwickeln und ein effizientes koordiniertes Luft-Boden-Kampfsystem aufbauen, bei dem wir präzise Bomben und Raketen einsetzen, um alle Hindernisse auf dem Vormarsch unserer Bodentruppen zu beseitigen."
  KOR_junshi_cezhong_hongzha: "Fernprojektion"
  KOR_junshi_cezhong_hongzha_desc: "Die beste Verteidigung ist der Angriff. Wir werden strategische Langstreckenbomber entwickeln und ausrüsten, die Tausende von Kilometern zurücklegen können. Mit dieser Fähigkeit zur „Langstreckenprojektion“ können wir den Krieg direkt in das Heimatland des Feindes tragen, seine Industriebasen und sein Kriegspotenzial zerstören und den Krieg von Grund auf gewinnen."
  KOR_junshi_cezhong_haijun_hongzha: "Marinefliegerei"
  KOR_junshi_cezhong_haijun_hongzha_desc: "Das Hauptziel unserer Militärflugzeuge besteht darin, die Sicherheit unserer Marine- und Zivilschiffe zu gewährleisten und sie auf ihren Routen zu schützen. Daher ist es wichtig, Flugzeuge so zu konstruieren, dass sie die Marine- und Patrouillenaufgaben unterstützen und sicherstellen, dass sie nicht durch schiffsgestützte Flugabwehrartillerie abgeschossen werden."
  KOR_junshi_huojian_gongcheng: "Wärmesuchende Raketen"
  KOR_junshi_huojian_gongcheng_desc: "Die Ordnance Commission hat bei der Forschung und Entwicklung von Lenkwaffen erhebliche Fortschritte gemacht. Sie stehen kurz davor, einen Durchbruch in der frei fallenden, infrarotgelenkten, kreiselstabilisierten Raketentechnologie zu erzielen, die von Flugzeugen zum Angriff auf Schiffsziele eingesetzt werden soll."
  KOR_junshi_penqishi_feiji_yanjiu: "Forschung zu Düsenflugzeugen"
  KOR_junshi_penqishi_feiji_yanjiu_desc: "Die Ära der Propeller geht zu Ende und das Jet-Zeitalter ist angebrochen. Wir dürfen bei dieser technologischen Revolution nicht ins Hintertreffen geraten. Wir werden sofort ein Forschungsprogramm für Düsenflugzeuge starten, auch wenn dies enorme Investitionen erfordert, um sicherzustellen, dass wir zu den ersten Ländern gehören können, die diese Waffe der Zukunft beherrschen."
  KOR_junshi_xiandai_kongjun: "Moderne Luftwaffe"
  KOR_junshi_xiandai_kongjun_desc: "Von Grund auf hat sich unsere Luftwaffe zu einer beeindruckenden Streitmacht entwickelt. Mit Düsenjägern, strategischen Bombern, einem vollständigen Radar-Frühwarnnetzwerk und gut ausgebildeten Piloten ist sie zu einer modernen Luftwaffe geworden, die in der Lage ist, die Luft zu verteidigen, Heer und Marine zu unterstützen und strategische Angriffe gegen Feinde durchzuführen."
  KOR_junshi_haijun_kaiduan: "Marine gründen"
  KOR_junshi_haijun_kaiduan_desc: "Da das Land auf drei Seiten vom Meer umgeben ist, gibt es keine Landesverteidigung ohne eine Marine. Wir werden offiziell unsere eigene Marine auf der Grundlage mehrerer erbeuteter kleiner Schiffe gründen. Obwohl diese Marine derzeit schwach ist, trägt sie unseren blauen Traum in sich, in Richtung Ozean zu marschieren und Meeresgebiete zu verteidigen."
  KOR_junshi_jianli_haijun_luzhandui: "Gründen Sie das Marine Corps"
  KOR_junshi_jianli_haijun_luzhandui_desc: "Wenn wir hoffen, im Ausland Einfluss zu gewinnen, müssen wir ein Marinekorps, die „Naval Commando Force“, bilden, das in der Lage ist, Invasionen auf See zu wagen und feindliche Küstenverteidigungen zu durchbrechen."
  KOR_junshi_kuojian_xiulimatou: "Erweitern Sie Reparaturdocks"
  KOR_junshi_kuojian_xiulimatou_desc: "Kriegsschiffe kämpfen auf See, aber ihre Vitalität hängt von Reparaturdocks an Land ab. Wir werden viel investieren, um unsere Schiffsreparaturanlagen zu erweitern, die Anzahl der Trockendocks zu erhöhen und ausreichend Ersatzteile zu lagern. Ein effizientes Wartungssystem kann unsere Flotte jederzeit in bester Kampfbereitschaft halten."
  KOR_junshi_shangchuandui: "Handelsmarine"
  KOR_junshi_shangchuandui_desc: "In Friedenszeiten ist die Handelsmarine die Lebensader, die uns mit der Welt verbindet und den Handel abwickelt; In Kriegszeiten sind sie unsere wertvolle Reservetransporttruppe. Wir werden die inländische Schifffahrtsindustrie tatkräftig unterstützen und eine große moderne Handelsmarine aufbauen. Diese Schiffe auf dem Taegeukgi werden eine solide Garantie für unsere Wirtschaft und Landesverteidigung sein."
  KOR_junshi_haianpaobing_zhendi: "Stellungen der Küstenartillerie"
  KOR_junshi_haianpaobing_zhendi_desc: "In der frühen Phase, in der unsere Marine noch nicht stark ist, ist solide Küstenartillerie das wirksamste Mittel, um einer feindlichen Seeinvasion Widerstand zu leisten. Wir werden in allen wichtigen Häfen und Landungspunkten verdeckte und solide Artilleriestellungen errichten und dabei großkalibrige Küstenverteidigungsgeschütze einsetzen. Jedes feindliche Kriegsschiff, das es wagt, sich unserer Küste zu nähern, wird in unsere tödliche Reichweite geraten."
  KOR_junshi_gaizhuang_minyong_zaoju: "Zivile Schiffe modifizieren"
  KOR_junshi_gaizhuang_minyong_zaoju_desc: "Das Potenzial des Krieges liegt in den Menschen. Wir werden einen Notfallplan formulieren, um in Kriegszeiten schnell zivile Schiffe und Fahrzeuge zu requirieren und zu modifizieren. Fischerboote können zu Patrouillenbooten und Handelsschiffe zu Hilfskreuzern oder Truppentransportschiffen umgebaut werden. Dieser „Kombination aus militärischem und zivilem“ Ansatz kann unsere militärische Stärke schnell und mit geringsten Kosten ausbauen."
  KOR_junshi_jieguan_jianchuan: "Übernehmen Sie koloniale Häfen und Schiffe"
  KOR_junshi_jieguan_jianchuan_desc: "Als die Kolonisten abzogen, hinterließen sie zahlreiche Hafenanlagen und einige veraltete Schiffe. Das ist der erste Goldschatz für uns, eine Marine zu bauen. Wir werden sofort Personal entsenden, um alle Häfen zu übernehmen und alle verwendbaren Schiffe zu reparieren. Obwohl sie alt sind, sollen sie die ersten Trainingsschiffe unserer Marineakademie werden."
  KOR_junshi_jieguan_jianchuan_tt: "Einige verbleibende Schiffe japanischer Kolonisten werden nach §Yrepair§! einsatzbereit sein."
  KOR_junshi_pingrang_jidi: "Marinestützpunkt Pjöngjang"
  KOR_junshi_pingrang_jidi_desc: "Um unsere Westküste und den Hauptstadtkreis zu verteidigen, müssen wir einen modernen Marinestützpunkt nahe der Mündung des Taedong-Flusses in Pjöngjang errichten. Dieser Ort soll nicht nur der Heimathafen unserer Westmeerflotte werden, sondern auch über umfassende Wartungs- und Versorgungseinrichtungen verfügen und als strategischer Dreh- und Angelpunkt für die Kontrolle des Gelben Meeres dienen."
  KOR_junshi_fushan_jidi: "Marinestützpunkt Busan"
  KOR_junshi_fushan_jidi_desc: "Der Hafen von Busan ist unser Tor zum Pazifischen Ozean und unser wichtigster Handelshafen. Wir werden hier unseren größten und modernsten Marinestützpunkt errichten. Es soll als Heimathafen unserer Hauptflotte dienen, von der Koreastraße und dem Ostchinesischen Meer ausgehen und den Grundstein dafür bilden, dass wir in Richtung des offenen Ozeans marschieren und eine Seemacht werden."
  KOR_junshi_jinhai_fangyu: "Küstenverteidigung"
  KOR_junshi_jinhai_fangyu_desc: "Wenn es an Kraft mangelt, ist die Konzentration auf die Küstenverteidigung die pragmatischste Wahl. Wir werden uns auf die Entwicklung leichter Marineschiffe konzentrieren, die für Küsteneinsätze geeignet sind, wie Zerstörer, U-Boote und Torpedoboote, und mit Marineminen und landgestützter Luftfahrt zusammenarbeiten, um ein asymmetrisches Verteidigungssystem aus „Luft, U-Booten und Schnellbooten“ aufzubauen. Unsere Hoheitsgewässer sollen zur Todesfalle für den Feind werden."
  KOR_junshi_shuizhong_bulei: "Maritime Bergbaustrategie"
  KOR_junshi_shuizhong_bulei_desc: "Obwohl die Verlegung von Seeminen im Meer die Effizienz unseres Öltransports erheblich beeinträchtigen wird. Aber wir müssen sicherstellen, dass feindlicher Verkehr nicht passieren kann, damit wir sicherer und frei von maritimen Invasionen sind."
  KOR_junshi_shuizhong_bulei_tt: "Schalten Sie die Entscheidung frei: §Y$KOR_mining_the_sea$§!, die es uns ermöglicht, Marineminen in §Y$STRATEGICREGION_77$§! und §Y$STRATEGICREGION_79$§! einzusetzen."
  KOR_junshi_yuanyang_haijun: "Traum von einer Blue Water Navy"
  KOR_junshi_yuanyang_haijun_desc: "Unser Blick sollte nicht immer auf der Küste bleiben. Unser Traum, eine echte Weltmacht zu werden, ist eine „Blauwassermarine“, die über das offene Meer galoppieren, unsere Handelslinien schützen und der Welt unseren nationalen Willen vermitteln kann. Heute werden wir den großen Plan zum Bau von Flugzeugträgern und Kreuzern starten und die Segel setzen, um diesen Traum zu verwirklichen!"
  KOR_junshi_goumai_daguohaijun: "Kaufen Sie eine Großmacht-Marine"
  KOR_junshi_goumai_daguohaijun_desc: "Der Aufbau einer leistungsstarken Marine von Grund auf dauert Jahrzehnte, aber die Weltlage ändert sich schnell, und wir können nicht so lange warten. Einige Großmächte, die abrüsten oder besiegt werden, sind begierig darauf, ihre veralteten Kriegsschiffe zu verkaufen. Wir werden diese Gelegenheit nutzen, Geld gegen Zeit eintauschen und eine fertige Flotte kaufen. Selbst gebrauchter Stahl reicht aus, um uns kurzfristig zu einer unbestreitbaren Seemacht zu verhelfen."
  KOR_junshi_goumai_daguohaijun_tt: "Schalten Sie Entscheidungen frei, um §Y alte Kriegsschiffe §! von großen Ländern zu kaufen und §Y ausländische Berater einzuladen §!, um unsere Marine auszubilden."
  KOR_junshi_hangmu_zhandouqun: "Forschungsflugzeugträger"
  KOR_junshi_hangmu_zhandouqun_desc: "Tatsachen haben immer wieder bewiesen, dass künftige Kriege in hohem Maße von der Luftüberlegenheit abhängen – zu Lande und zur See gleichermaßen. Die Bedeutung eines Flugzeugträgers liegt darin, den Himmel über feindlichen Schiffen zu kontrollieren und sie in der Haltung göttlicher Strafe vom Himmel schnell zu versenken."
  KOR_junshi_xiandai_haijun: "Moderne Marine"
  KOR_junshi_xiandai_haijun_desc: "Nach Jahren der Investitionen und des Aufbaus hat sich unsere Marine völlig verändert. Von der Küstenverteidigung bis hin zu entscheidenden Schlachten auf offener See, von veralteten gebrauchten Kriegsschiffen bis hin zu von uns selbst gebauten Flugzeugträgern – wir haben eine wirklich moderne Marine. Diese mächtige blaue Flotte soll unsere globalen Handelslinien schützen und den Willen des Landes in jeden Winkel der Welt tragen."
  KOR_junshi_lianhe_hewu_yanfa: "Gemeinsames Kernwaffenforschungsprogramm"
  KOR_junshi_lianhe_hewu_yanfa_desc: "Atomenergie ist die ultimative Waffe, die die Form künftiger Kriege verändern wird. Wenn wir uns ausschließlich auf unsere eigene Kraft verlassen, wird der Forschungs- und Entwicklungsweg lang und beschwerlich sein. Deshalb werden wir mit Verbündeten, die über fortschrittliche Nukleartechnologie verfügen, ein „Gemeinsames Nuklearwaffenforschungsprogramm“ starten. Durch den Austausch von Daten und Experten werden wir die Zeit, diese ultimative Abschreckungskraft zu beherrschen und in einem Schritt in den Nuklearclub einzutreten, erheblich verkürzen."
##Industry
  #######################################################################################################################################################################
  KOR_jingji_qiansan_zhimin_yichan: "Liquidieren Sie das koloniale Erbe"
  KOR_jingji_qiansan_zhimin_yichan_desc: "Obwohl die Kolonisten gegangen sind, binden uns die wirtschaftlichen Fesseln, die sie hinterlassen haben, immer noch. Eisenbahnen, Minen, Fabriken ... viele der wirtschaftlichen Lebensadern des Landes liegen noch immer in den Händen der Hauptstadt des alten Oberstaats. Wir müssen eine gründliche Liquidierung durchführen, diese kolonialen Hinterlassenschaften verstaatlichen und sicherstellen, dass der Reichtum unseres Landes nur unserem eigenen Volk zugute kommt."
  KOR_jingji_laogong_dongyuan: "Arbeitsmobilisierungsplan"
  KOR_jingji_laogong_dongyuan_desc: "Unsere wertvollste Ressource sind unsere fleißigen Mitarbeiter. Um den Wiederaufbau und die Industrialisierung nach dem Krieg zu beschleunigen, werden wir einen landesweiten „Plan zur Mobilisierung der Arbeitskräfte“ auf den Weg bringen, Arbeitskräfte einheitlich registrieren, ausbilden und verteilen und sie in den am dringendsten benötigten Bau von Stauseen, Eisenbahnen und Fabriken einsetzen. Wir werden mit den Händen des Volkes ein solides Fundament für die Zukunft des Landes legen."
  KOR_jingji_diyige_wunian_jihua: "Fünfjahresplan"
  KOR_jingji_diyige_wunian_jihua_desc: "Ein freier Markt kann keine nationale Stärke bringen. Um in kürzester Zeit zu den Weltmächten aufzuschließen, müssen wir zu einer effizienten nationalen Planwirtschaft übergehen. Wir werden den „Fünfjahresplan“ auf den Weg bringen, die Ressourcen des Landes konzentrieren und der Entwicklung der Schwerindustrie und der Verteidigungsindustrie Priorität einräumen. Dies ist für uns der grundlegende Kampf zur Verwirklichung der Industrialisierung und zur Sicherung der nationalen Unabhängigkeit."
  KOR_jingji_diyige_wunian_jihua_tt: "Der Fünfjahresplan wurde erstellt"
  KOR_jingji_xunqiu_guoji_jishu: "Suchen Sie internationale technische Hilfe"
  KOR_jingji_xunqiu_guoji_jishu_desc: "Durch Arbeiten hinter verschlossenen Türen kann Modernisierung nicht realisiert werden. Wir müssen zugeben, dass zwischen unserer Technologie und dem weltweiten Fortschritt eine große Lücke besteht. Deshalb werden wir uns aktiv um internationale technische Hilfe bemühen, entweder über die Vereinten Nationen oder durch die Zusammenarbeit mit befreundeten Großmächten. Die Einführung fortschrittlicher Produktionslinien und die Entsendung internationaler Studenten sind für uns die einzigen Möglichkeiten, den Aufholprozess zu beschleunigen und die Lücke zu schließen."
  KOR_jingji_xunqiu_guoji_jishu_tt: "Schalten Sie die Entscheidung frei: §YSuchen Sie internationale technische Hilfe§!, die es uns ermöglicht, wissenschaftliche Forschungstechnologien von Großmächten zu erwerben."
  KOR_jingji_qingsuan_jishu: "Liquidieren Sie das koloniale Technologiemonopol"
  KOR_jingji_qingsuan_jishu_desc: "Unsere Industrie wurde lange Zeit durch das Technologiemonopol der Kolonisten erstickt. Jetzt ist es an der Zeit, diese Fessel zu sprengen. Wir werden diese technologische Ungleichheit durch obligatorischen Technologietransfer, die Ausbildung lokaler Ingenieure und andere Maßnahmen vollständig beseitigen, damit unsere eigenen Fabriken ihre Kerntechnologien beherrschen können."
  KOR_jingji_fuchi_bentu_qiye: "Unterstützen Sie lokale Unternehmen"
  KOR_jingji_fuchi_bentu_qiye_desc: "Gefangen zwischen ausländischem Kapital und alten Konglomeraten kämpfen unsere eigenen nationalen Unternehmen ums Überleben. Der Staat unterstützt die lokalen Unternehmen tatkräftig durch zinsgünstige Kredite, Steueranreize und staatliche Anordnungen. Nur wenn Tausende lokaler Unternehmen entstehen, kann unsere Wirtschaft wirklich Unabhängigkeit und Eigenständigkeit erlangen."
  KOR_wunian_jihua_flag: "Der Fünfjahresplan ist in Arbeit"
  KOR_jingji_beifang_jihua: "Nördlicher Plan"
  KOR_jingji_beifang_jihua_desc: "Die nördliche Region verfügt über unsere reichsten Bodenschätze und die Schwerindustrie. Wir werden den „Nordplan“ auf den Weg bringen, die Anstrengungen zur Entwicklung von Kohle und Stahl hier konzentrieren und Großfabriken ausbauen. Dieser Ort soll zum „Herz“ der Industrialisierung unseres Landes werden und eine starke Motivation für die Modernisierung des gesamten Landes darstellen."
  KOR_jingji_beifang_jihua_tt: "Dieser nationale Fokus wird §Y$KOR_jingji_beifang_jihua$§! sperren; Wenn §Y$KOR_jingji_qianqihua_jihua$§! abgeschlossen ist, wird §Y$KOR_jingji_nanfang_jihua$§! entsperrt."
  KOR_jingji_nanfang_jihua: "Südlicher Plan"
  KOR_jingji_nanfang_jihua_desc: "Die südliche Region verfügt über unsere fruchtbarsten Ebenen und die geschäftigsten Häfen. Wir werden den „Südplan“ auf den Weg bringen, der sich hier auf die Entwicklung der Landwirtschaft, der Fischerei und der Leichtindustrie konzentriert. Ein wohlhabender Süden soll uns mit ausreichend Getreide und Konsumgütern versorgen und zu unserem Tor zum Welthandel werden."
  KOR_jingji_nanfang_jihua_tt: "Dieser nationale Fokus wird §Y$KOR_jingji_nanfang_jihua$§! sperren; Wenn §Y$KOR_jingji_shuifeng_shuiku$§! abgeschlossen ist, wird §Y$KOR_jingji_beifang_jihua$§! entsperrt."
  KOR_jingji_pingan_dao_meitan: "Erschließen Sie die Kohle der Provinz Pjöngan"
  KOR_jingji_pingan_dao_meitan_desc: "Kohle ist das „schwarze Gold“ der Industrie, die Grundlage für den Antrieb von Dampfmaschinen und die Stahlschmelze. Die Provinz Pyongan verfügt über unsere reichsten Kohlereserven. Wir werden hier viel Geld investieren, neue Ausrüstung einführen und Kohlebergwerke im großen Stil entwickeln. Steinkohle wird die tobenden Flammen unserer industriellen Revolution entfachen."
  KOR_jingji_maoshan_tiekuang: "Stahl ist die Nahrung der Industrie" #Develop Musan Iron Mine
  KOR_jingji_maoshan_tiekuang_desc: "In Musan in der Provinz Nord-Hamgyong befindet sich das größte Tagebau-Eisenerzvorkommen Asiens, das den industriellen Grundstein darstellt, den der Himmel unserem Land geschenkt hat. Wir dürfen nicht zulassen, dass dieser riesige Reichtum weiter im Untergrund schlummert. Wir werden die Kräfte des Landes konzentrieren, um die Musan-Eisenmine vollständig zu entwickeln. Jede hier geförderte Tonne Eisenerz soll zum stabilsten Rückgrat unserer Industrialisierung werden und Stahlblut in unsere zukünftigen Panzer und Kriegsschiffe spritzen."
  KOR_jingji_qingjin_zonghe_gangchang: "Integriertes Stahlwerk Chongjin"
  KOR_jingji_qingjin_zonghe_gangchang_desc: "Wir müssen über eine moderne Stahlbasis verfügen, die in der Lage ist, verschiedene Stahlsorten in großem Maßstab herzustellen. Die Hafenstadt Chongjin soll der Standort dieses großen Plans sein. Hier werden wir ein integriertes Stahlwerk errichten, das Eisenerzeugung, Stahlerzeugung und Stahlwalzen umfasst und zum Stolz unserer nationalen Industrie werden soll."
  KOR_jingji_xingnan_huagongchang: "Chemiefabrik Hungnam"
  KOR_jingji_xingnan_huagongchang_desc: "Die moderne Landwirtschaft kommt nicht ohne chemische Düngemittel aus, und die moderne Landesverteidigung kommt nicht ohne Sprengstoffe aus. Hungnam, eine Stadt mit einer guten industriellen Basis, soll zum Zentrum unserer chemischen Industrie werden. Die hier errichtete große Chemiefabrik soll die Hoffnung auf eine Ernte auf unsere Felder bringen und die entscheidende Kraft für unsere Armee liefern."
  KOR_jingji_qianqihua_jihua: "Elektrifizierungsplan"
  KOR_jingji_qianqihua_jihua_desc: "Licht ist das Symbol der modernen Zivilisation. Wir werden einen nationalen „Elektrifizierungsplan“ auf den Weg bringen, der Strom vom Supung-Stausee und anderen Kraftwerken über ein dichtes Kabelnetz in jede Stadt, jedes Dorf, jede Fabrik und jeden Haushalt in unserem Land überträgt. Wenn die Halbinsel nachts von Tausenden Lichtern erleuchtet wird, wird eine neue Ära anbrechen."
  KOR_jingji_qianqihua_jihua_tt: "\n§YElektrifizierung wird sich allmählich von [ROOT.Capital.GetCapitalVictoryPointName] nach außen ausbreiten, wobei alle zwei Monate eine neue Kernregion diesen Modifikator erhält.§!"
  KOR_jingji_quanguo_tieluwang: "Nationaler Eisenbahnnetzplan"
  KOR_jingji_quanguo_tieluwang_desc: "Das derzeitige Eisenbahnnetz unseres Landes ist fragmentiert und kann den Bedürfnissen eines modernen Landes nicht gerecht werden. Wir werden einen neuen „Nationalen Eisenbahnnetzplan“ formulieren, der alle wichtigen Städte, Häfen und ressourcenproduzierenden Gebiete mit Stahlschwellen eng verbindet, um die einheitliche Hauptverkehrsader des Landes zu bilden."
  KOR_jingji_jingfu_gaosugonglu: "Gyeongbu-Schnellstraße"
  KOR_jingji_jingfu_gaosugonglu_desc: "Die Gyeongbu-Linie, die die Hauptstadt und Busan, den größten Hafen, verbindet, ist der wichtigste Transportkorridor unseres Landes. Wir werden hier unsere erste wirklich moderne Schnellstraße bauen. Diese flache und breite Straße soll die Startbahn für unseren wirtschaftlichen Aufschwung und ein glorreiches Symbol der nationalen Modernisierung sein."
  KOR_jingji_guantong_taibai_shanmai: "Verbinden Sie die Taebaek-Berge"
  KOR_jingji_guantong_taibai_shanmai_desc: "Obwohl das majestätische Taebaek-Gebirge unsere natürliche Barriere ist, behindert es auch den Transport zwischen Ost und West. Wir werden die besten Ingenieure organisieren, um diesen natürlichen Wassergraben vollständig mit Tunneln und Brücken zu verbinden. Von da an sollen Ost- und Westküste nicht mehr weit voneinander entfernt sein und das ganze Land soll enger miteinander verbunden sein."
  KOR_jingji_gongcheng_zhuangju: "Ingenieursleistungen"
  KOR_jingji_gongcheng_zhuangju_desc: "Brücken über das Meer, Tunnel durch Berge, prächtige Flussdämme ... unser Volk wird seine Weisheit und seinen Schweiß einsetzen, um eine scheinbar unmögliche technische Meisterleistung nach der anderen zu vollbringen. Diese monumentalen Gebäude verbessern nicht nur unser Leben, sondern beweisen der Welt auch die große Macht unserer Nation, die Natur zu erobern."
  KOR_jingji_jinhai_yuye: "Entwicklung der Küstenfischerei"
  KOR_jingji_jinhai_yuye_desc: "Auf drei Seiten vom Meer umgeben, ist das Meer eine blaue Kornkammer, die uns mit Nahrung versorgt. Wir werden stark in die Küstenfischerei investieren, den Fischern moderne Fischerboote und Fischereitechnik zur Verfügung stellen und eine Industriekette für die Fischereiverarbeitung aufbauen. Reichliche Fänge können nicht nur die Ernährung der Menschen verbessern, sondern uns auch wertvolle Devisen einbringen."
  KOR_jingji_fangzhi_gongye: "Investieren Sie in die Textilindustrie"
  KOR_jingji_fangzhi_gongye_desc: "Dass jeder warme und anständige neue Kleidung tragen soll, ist unser einfachstes Anliegen. Wir werden stark in die Textilindustrie investieren und moderne Spinnereien und Webereien bauen. Diese Branche kann nicht nur die enorme Inlandsnachfrage decken und eine große Zahl von Arbeitsplätzen schaffen, sondern wird auch zu unserem wichtigsten Wirtschaftszweig für Exporteinnahmen."
  KOR_jingji_chukou_renshen: "Ginseng- und Tabakmonopol"
  KOR_jingji_chukou_renshen_desc: "Koreanischer Ginseng und hochwertiger Tabak sind unsere hochwertigen charakteristischen Produkte. Um die Gewinne dieser „goldenen Ernten“ fest in den Händen des Staates zu halten, werden wir ein nationales Monopolsystem einführen. Die daraus erzielten enormen Gewinne sollen in den dringend benötigten Industrie- und Landesverteidigungsbau investiert werden."
  KOR_jingji_nongye_jixiehua: "Plan zur ländlichen Mechanisierung"
  KOR_jingji_nongye_jixiehua_desc: "Wenn man sich auf Vieh und Handarbeit verlässt, kann man nie den Sprung in die Landwirtschaft schaffen. Wir werden den „Plan zur Mechanisierung des ländlichen Raums“ auf den Weg bringen, Traktorenstationen einrichten und landwirtschaftliche Maschinen wie Sämaschinen und Erntemaschinen in ländlichen Gebieten fördern. Die dröhnenden Motoren sollen das Muhen der Rinder über Jahrtausende hinweg vollständig ersetzen und unsere Bauern von schwerer körperlicher Arbeit befreien"
  KOR_jingji_shuifeng_shuiku: "Wasserkraftdamm"
  KOR_jingji_shuifeng_shuiku_desc: "Ohne Intervention wird Koreas Industrialisierungs- und Elektrifizierungsprozess abrupt zum Stillstand kommen. Wir sollten in diesem Gebiet einen neuen Gewichtsstaudamm bauen, und Ingenieure der Han River Hydropower Company haben einen detaillierten Plan für das Projekt mit dem Namen Hwacheon Dam ausgearbeitet."
  KOR_jingji_jingji_qiji: "Wirtschaftswunder"
  KOR_jingji_jingji_qiji_desc: "Auf den Ruinen des Krieges haben wir, gestützt auf die harte Arbeit, die Weisheit und den festen Willen unseres Volkes, in nur wenigen Jahrzehnten den Weg der Industrialisierung vollendet, für den die westlichen Länder Hunderte von Jahren gebraucht haben. Hochhäuser stehen in großer Zahl, der Verkehr fließt in endlosen Strömen, Fabriken dröhnen ... Wir haben der Welt bewiesen, dass auch ein armes und rückständiges Agrarland ein weltberühmtes Wirtschaftswunder schaffen kann!"
  KOR_jingji_jingji_qiji_tt: "Ersetzen Sie §Y$KOR_zmdjjdyc_dabenying_modifiers_1$§! durch §Y$KOR_zmdjjdyc_dabenying_modifiers_2$§! mit den folgenden Effektänderungen:"
 JKO_huangminhua_event:0 "Huangminhua-Bewegung"
 JKO_huangminhua_event_desc:0 "Förderung der kaiserlichen Assimilationspolitik."
