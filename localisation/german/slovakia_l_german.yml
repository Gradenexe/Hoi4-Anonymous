l_german:
SLO_fortification_studies:0 "Befestigungsstudien"
 SLO_fortification_studies_desc:0 "Die Notwendigkeit, unsere Grenze zu befestigen, ist klar, aber die Frage ist, wie? Die Franzosen haben kürzlich selbst eine unglaubliche befestigte Linie gebaut, die Maginot-Linie, und durch die Entsendung einer Delegation zur Untersuchung ihrer Methoden sollte es möglich sein, unsere eigenen Grenzverteidigungsprobleme zu lösen."
 SLO_fallback_line: "Konstruieren Sie Fallback-Linien"
 SLO_fallback_line_desc:0 "Wenn die Grenze nicht gehalten werden kann, wäre es gut, über eine zweite Befestigungslinie zu verfügen, auf die man zurückgreifen kann, bevor ein Angriff aus dem Westen unser Kernland erreichen kann."
 SLO_sudeten_1:0 "Frühe Befestigungsanlagen"
 SLO_sudeten_1_desc:0 "Die , unsere gebirgige Grenze zu Deutschland, ist der perfekte Ort für Grenzbefestigungen. Nachdem wir die französische Maginot-Linie studiert haben, können wir eine ähnliche eigene Linie aufbauen."
 SLO_sudeten_2:0 "Erweiterte Befestigungen"
 SLO_sudeten_2_desc:0 "Sie verfügen inzwischen über eine anständige Verteidigungslinie, aber anständig ist nicht gut genug, wenn unser nationales Überleben auf dem Spiel steht."
 SLO_sudeten_3:0 "Letzte Befestigungen"
 SLO_sudeten_3_desc:0 "Es gibt ein starkes Befestigungssystem, das jedoch noch stärker sein könnte!"
 SLO_sudeten_4:0 "Zusätzliche Vorbereitungen"
 SLO_sudeten_4_desc:0 "Wir müssen jeden Mann auf den Kampf vorbereiten!"
 SLO_hungarian_line: "Die ungarische Linie"
 SLO_hungarian_line_desc:0 "Der ungarische Irredentismus stellt eine ständige Bedrohung für unsere Nation dar. Ein Befestigungssystem entlang unserer gemeinsamen Grenze wird dazu beitragen, unsere Sicherheit zu gewährleisten."
 SLO_polish_line: "Die polnische Linie"
 SLO_polish_line_desc:0 "Die polnische Aggression kennt keine Grenzen, aber eine gut befestigte Grenze wird sie hoffentlich dazu veranlassen, nach einem leichteren Ziel zu suchen."
 SLO_internal_redoubts:0 "Unpassierbare Städte"
 SLO_internal_redoubts_desc:0 "Jedes Befestigungssystem kann zerstört werden. Um dieser Möglichkeit vorzubeugen, können wir rund um unsere wichtigsten Städte Stützpunkte errichten, damit diese nicht so leicht von einem Feind eingenommen werden können, der unsere Linien durchbricht."
  SLO_improved_internal_redoubts:0 "Ba Sing Se"
 SLO_improved_internal_redoubts_desc:0 "Linie, die auf dem Mythos von Ba Sing Se basiert. In Ba Sing Se herrscht kein Krieg"
 SLO_industrial_legacy: "Ein großes industrielles Erbe"
 SLO_industrial_legacy_desc:0 "Die Skoda-Werke waren der größte Waffenhersteller in Österreich-Ungarn und haben sich seit unserer Unabhängigkeit zu einem führenden Unternehmen in vielen Industriebereichen entwickelt. Eine so hohe Konzentration an Fachwissen und Schwerindustrie kommt allen industriellen Unternehmungen enorm zugute."
 SLO_favor_czechs_1:0 "Slowakische Industrie"
 SLO_favor_czechs_1_desc:0 "Es besteht ein dringender Bedarf, in den slowakischen Regionen der West- und Ostslowakei eigene Industriekapazitäten aufzubauen. Durch Investitionen in unserem Kernland wird es viel einfacher, mehr Fabriken zu bauen und unsere wirtschaftliche Zukunft zu sichern."
 SLO_favor_czechs_2:1 "Industrielle Kerngebiete"
 SLO_favor_czechs_2_desc:1 "Weitere Investitionen, die sich auf die West- und Ostslowakei konzentrieren, werden unsere Branche weitaus stärker verbessern als ein breiterer Ansatz."
 SLO_favor_czechs_3:1 "Neue Industriestädte"
 SLO_favor_czechs_3_desc:1 "Nach der Entwicklung der alten Industriegebiete in der West- und Ostslowakei ist es nun an der Zeit, neue Städte zu bauen, um die Arbeiter unserer wachsenden Industrien unterzubringen."
 SLO_balanced_1:1 "Ausgewogene Brancheninvestitionen"
 SLO_balanced_1_desc:0 "Um die Spannungen zwischen Tschechen und Slowaken abzubauen, wurde vorgeschlagen, das künftige industrielle Wachstum gleichmäßig auf die jeweiligen Landesteile aufzuteilen, auch wenn dies insgesamt weniger effizient ist."
 SLO_balanced_2:1 "Gemeinsame tschechisch-slowakische Planungskommission"
 SLO_balanced_2_desc:1 "Durch die Schaffung einer gemeinsamen Gruppe von Politikern aus beiden Teilen des Landes können wir sicherstellen, dass jeder gleichermaßen am industriellen Wachstum unseres Landes teilhaben kann."
 SLO_balanced_3:1 "Lokale Spezialisierung"
 SLO_balanced_3_desc:1 "Durch die anhaltenden Investitionen in die Industrie aller Regionen des Landes haben einige Gebiete begonnen, sich auf bestimmte Waren und Dienstleistungen zu spezialisieren. Wir können dies weiter fördern."
 SLO_united_population:0 "Vereinigte Bevölkerung"
 SLO_united_population_desc:0 "Eine Reihe jüngster politischer Initiativen in Verbindung mit unserer Politik des ausgewogenen industriellen Wachstums haben dazu geführt, dass sich Tschechen und Slowaken im ganzen Land in ihren Zielen viel vereinter fühlen."
 SLO_arms_exports_1:0 "Waffenexporte"
 SLO_arms_exports_1_desc:0 "Skoda-Werke sind seit langem bedeutende Waffenlieferanten in ganz Europa und produzieren Waffen in einem Umfang, der weit über den Bedarf unseres Landes allein hinausgeht. Eine Produktion in einem solchen Maßstab führt zu Produktionseffizienzen, von denen nur wenige andere Hersteller träumen können."
 SLO_arms_exports_2:1 "Exportsubventionen"
 SLO_arms_exports_2_desc:1 "Angesichts der drohenden Kriegsgefahr sind immer mehr Nationen auf den Kauf von Panzern bedacht. Staatliche Garantien für Kredite und andere Maßnahmen können andere Länder zum Kauf tschechoslowakischer Währungen ermutigen und die Skaleneffekte noch weiter verbessern."
 SLO_arms_exports_3:1 "Garantie für gleichberechtigten Zugang"
 SLO_arms_exports_3_desc:1 "Die Nachfrage nach Waffen ist so hoch wie nie zuvor, und damit auch die Produktion unserer Produktionslinien. Um den Verkauf von Waffen zu unterstützen, können wir öffentlich erklären, dass wir an jeden verkaufen, der über das nötige Geld verfügt, um die Waffen zu bezahlen – und das Geld dann verwenden, um in unsere eigene Aufrüstung zu investieren."
 SLO_political_direction: "Bewerten Sie das politische Klima"
 SLO_political_direction_desc: "Unsere Demokratie ist jung und noch nicht auf eine harte Probe gestellt. Da sowohl der Faschismus als auch der Kommunismus in ganz Europa auf dem Vormarsch sind, muss man sich die Frage stellen: Ist das die richtige Richtung, oder wenn nicht, welche?"
 SLO_go_left: "Das Volk vereint unter einem Willen"
 SLO_go_left_desc:0 "Der Kommunismus ist die Zukunft! Alle Anstrengungen müssen darauf gerichtet sein, unsere Regierung und Gesellschaft so umzugestalten, dass sie den marxistischen Idealen folgen."
 SLO_czech_socialism:0 "Slowakischer Sozialismus"
 SLO_czech_socialism_desc:1 "Eine zentrale Kontrolle ist sicherlich gut für die Wirtschaft, aber vielleicht ist es möglich, dass man zu viel des Guten hat. Durch eine leichte Dezentralisierung sowohl in tschechische als auch in slowakische Sowjets kann eine größere Gesamteinheit herrschen!"
 SLO_communism_with_a_human_face:0 "Kommunismus mit menschlichem Antlitz"
 SLO_communism_with_a_human_face_desc:1 "Indem wir eine stärkere Beteiligung des Volkes an der Kommunal- und Landespolitik unter dem Dach der Kommunistischen Partei fordern, werden wir den Idealen des Kommunismus neues Leben einhauchen."
 SLO_communist_support:0 "Kommunistische Unterstützung"
 SLO_communist_support_desc:0 "Unser Schwenk nach links nimmt Fahrt auf. Die Unterstützung für den Kommunismus wächst landesweit, und die Rate wird nur noch zunehmen, wenn wir ihn mit mehr staatlicher Unterstützung unterstützen."
 SLO_join_comintern: "Treten Sie der Komintern bei"
 SLO_join_comintern_desc:0 "Auf unsere weniger fortschrittlichen ehemaligen Verbündeten ist kein Verlass mehr. Es ist an der Zeit, ein Bündnis mit der UdSSR zu schließen, um unsere Sicherheit vor der faschistisch-imperialistischen Aggression zu gewährleisten."
 SLO_the_romanian_question:0 "Die rumänische Frage"
 SLO_the_romanian_question_desc:0 "Rumänien steht zwischen uns und unserem Freund und Beschützer, der Sowjetunion. Da sie den Durchmarsch sowjetischer Truppen zur Unterstützung unserer Verteidigung nicht zulassen werden, muss eine drastischere Lösung in Betracht gezogen werden."
 SLO_the_polish_division:0 "Die polnische Division"
 SLO_the_polish_division_desc:0 "Polen verweigert nicht nur den Durchmarsch sowjetischer Truppen für den Fall, dass wir ihre Hilfe benötigen, es hegt auch immer noch Unmut über unsere Befreiung der Zaolzie-Region und sinnt möglicherweise durchaus auf Rache. Eine präventive Verteidigung wäre ratsam."
 SLO_democratic_bastion:0 "Demokratische Bastion"
 SLO_democratic_bastion_desc:0 "Die Tschechoslowakei ist eine Bastion der Demokratie in Mitteleuropa und wird es auch bleiben, was auch immer wolle!"
 SLO_beacon_of_liberty:0 "Leuchtfeuer der Freiheit"
 SLO_beacon_of_liberty_desc:0 "Unser Engagement für die Demokratie inspiriert sowohl unsere eigenen Bürger als auch diejenigen, die vor repressiveren Regimen fliehen mussten."
 SLO_healing_a_divided_nation: "Eine gespaltene Nation heilen"
 SLO_healing_a_divided_nation_desc: "Die Menschen unserer Nation wissen jetzt, dass unseren Worten Taten folgen, wenn es um ihre Freiheit geht. Wir können endlich einige der Wunden heilen, die unsere Nation tief gespalten haben."
 SLO_defensive_preparations:0 "Verteidigungsvorbereitungen"
 SLO_defensive_preparations_desc:0 "Es scheint sicher, dass der Krieg kommen wird, ob wir das wollen oder nicht. Deshalb ist es am besten, wenn wir darauf vorbereitet sind."
 SLO_bonus_research_slot_1:0 "Slowakische Technische Universität"
 SLO_bonus_research_slot_1_desc:0 "Angesichts des drohenden Krieges wird uns eine stärkere Konzentration auf praktische Technologie zugute kommen."
 SLO_go_right: "Stärken Sie die Nationale Faschistische Liga"
 SLO_go_right_desc:0 "Nur unter dem Faschismus kann das slowakische Volk zu Größe aufsteigen! Die Demokratie in Europa ist zum Untergang verurteilt, und nur die starken Nationen, die faschistischen Nationen, werden an den Verhandlungstischen sitzen, wenn die schwachen Staaten aufgeteilt werden!"
 SLO_czech_fascism:0 "Slowakischer Faschismus"
 SLO_czech_fascism_desc:0 "Die Unterstützung für den Faschismus wächst landesweit, und je mehr Macht in faschistische Hände fällt, desto mehr Druck kann auf die Dissidenten ausgeübt werden, die Widerstand leisten."
 SLO_aggressive_wars: "Angriffskriege"
 SLO_aggressive_wars_desc:0 "Mit dem Triumph des Faschismus kann unser Aufstieg zur Macht beginnen!"
 SLO_the_polish_question:0 "Die polnische Frage"
 SLO_the_polish_question_desc:0 "Die Polen haben uns Zaolzie nie verziehen, und wenn wir Schwäche zeigen, werden sie zweifellos zuschlagen. Warum sollte eine große Nation wie die Tschechoslowakei unter dieser Art von Bedrohung leiden? Nicht mehr! Es muss entschieden gehandelt werden!"
 SLO_exclude_the_slovaks:0 "Slowakische Konsolidierung"
 SLO_exclude_the_slovaks_desc:1 "Vom Tag der Gründung unseres Landes an waren die Slowaken unzufrieden. Immer auf der Suche nach mehr politischer Macht, immer auf der Suche nach mehr als ihrem gerechten Anteil an nationalen Ressourcen. Nicht mehr! Von nun an wird die Macht in tschechischen Händen konzentriert sein. §RDas wird zum Bürgerkrieg führen.§!"
 SLO_national_fascism:0 "Nationaler Faschismus"
 SLO_national_fascism_desc:0 "Tschechen und Slowaken sind gleichermaßen unter dem Banner des Faschismus vereint. Gemeinsam marschieren wir voran! Gemeinsam sind wir nicht aufzuhalten!"
 SLO_german_minor_ally: "Ein deutscher Satellit"
 SLO_german_minor_ally_desc:0 "Deutschland ist eine aufstrebende Macht, eine Macht, der wir zum Ruhm folgen können. Wo Deutschland hinführt, werden wir ihm folgen und unterwegs unsere Ziele erreichen."
 SLO_german_minor_ally_tt:0 "Werden Sie ein deutscher Satellit und gewähren Sie Boni für die Lizenzierung deutscher Technologie, geben Sie Deutschland aber auch die Oberherrschaft über unser Land."
 SLO_german_ally: "Ein wertvoller deutscher Partner"
 SLO_german_ally_desc:0 "Deutschland ist eine faschistische Mitmacht, ein Mitläufer auf dem Weg zum Ruhm. Gemeinsam werden wir dafür sorgen, dass sich die Welt um die Achse Prag-Berlin dreht!"
 SLO_strategy_decisions:0 "Strategische Entscheidungen"
 SLO_strategy_decisions_desc:0 "Ein Sturm braut sich über Europa zusammen, die Gefahr eines Krieges droht, aber wie soll die Tschechoslowakei den bevorstehenden Herausforderungen begegnen?"
 SLO_german_leanings:0 "Deutsche Beschwichtigung"
 SLO_german_leanings_desc:0 "Die deutsche Macht ist auf dem Vormarsch und ihr erklärtes Ziel ist es, alle deutschsprachigen Menschen in einem Reich zu vereinen. Als Nation mit einer beträchtlichen deutschen Minderheit sind dies besorgniserregende Entwicklungen. Wenn es uns nicht gelingt, eigene mächtige Verbündete zu gewinnen, können wir davon profitieren, in der Gunst Deutschlands zu bleiben."
 SLO_german_puppet: "Ein deutsches Protektorat"
 SLO_german_puppet_desc:0 "Deutschland lässt sich nicht besänftigen, sie werden nicht aufhören, bis sie über uns herrschen. Und doch können wir durch das Beugen des Knies vielleicht etwas Autonomie bewahren?"
 SLO_hungarian_situation:0 "Die ungarische Situation"
 SLO_hungarian_situation_desc:0 "Ungarn war uns schon lange ein Dorn im Auge, aber mit der vollen Macht des Faschismus im Rücken ist die Zeit Ungarns zu Ende."
 SLO_deliver_sudetenland: "Unter Deutschland gehen"
 SLO_deliver_sudetenland_desc:0 "Deutschland will unsere Deutschen. Wenn wir den Krieg abwenden wollen, scheint die Übergabe des Sudetenlandes der einzige Weg zu sein."
 SLO_german_technology:0 "Deutsche Technologie"
 SLO_german_technology_desc:0 "Da die friedlichen Beziehungen zwischen unseren Nationen nun gesichert sind, wurde vermutet, dass ein gegenseitiger Technologieaustausch beiden Seiten zugute kommen könnte."
 SLO_trust_in_the_west:0 "Vertrauen Sie dem Westen"
 SLO_trust_in_the_west_desc:0 "Frankreich und Großbritannien werden den Frieden in Europa schützen. Schließlich haben sie den Ersten Weltkrieg nicht gewonnen, nur um zuzulassen, dass Deutschland zwanzig Jahre später souveräne Nationen bedroht und zerstückelt!"
 SLO_doctrinal_innovation:0 "Lehrinnovation"
 SLO_doctrinal_innovation_desc:0 "Wir haben durch den Austausch von Offizieren und Strategiesitzungen mit unseren Verbündeten viel gelernt. Die Kombination solch unterschiedlicher Standpunkte hat uns an den Rand eines Durchbruchs gebracht."
 SLO_bonus_research_slot_2:1 "Wissensaustauschteams"
 SLO_bonus_research_slot_2_desc:0 "Der alliierte Wissensaustausch hat so große Vorteile gebracht, dass er nun als dauerhafte Institution vorgeschlagen wurde."
 SLO_secret_weapons:0 "Geheimwaffen"
 SLO_secret_weapons_desc:0 "Die Zukunft der slowakischen Kriegsführung liegt in der Beherrschung zahlreicher fortschrittlicher Technologien und deren bestmöglichen Einsatz."
 SLO_nukes:0 "Atomwaffen"
 SLO_nukes_desc:0 "Die Zukunft der slowakischen Kriegsführung liegt in der Beherrschung der Macht des gespaltenen Atoms!"
 SLO_an_entente_of_our_own:0 "Eine eigene Entente"
 SLO_an_entente_of_our_own_desc:0 "Die „Kleine Entente“ ist in den letzten Jahren ins Wanken geraten, könnte aber dennoch wieder auferstehen, wenn unsere ehemaligen Verbündeten dazu bereit sind."
 SLO_invite_yugoslavia:0 "Laden Sie Jugoslawien ein"
 SLO_invite_yugoslavia_desc:0 "Laden Sie Jugoslawien zur Entente ein."
 SLO_invite_romania:0 "Rumänien einladen"
 SLO_invite_romania_desc:0 "Laden Sie Rumänien zur Entente ein."
 SLO_faction_tech_sharing:0 "Der Pakt der Organisation"
 SLO_faction_tech_sharing_desc:0 "Um gut zusammenzuarbeiten, sollten die Armeen der Entente auf einem ähnlichen Niveau ausgerüstet sein. Um dies zu erreichen, schlagen wir vor, dass alle Mitglieder unserer Fraktion ihre Technologie frei miteinander teilen sollten."
 SLO_security_council: "Der Gemeinsame Sicherheitsrat"
 SLO_security_council_desc:0 "Der Entente-Sicherheitsrat wird dafür sorgen, dass alle Mitglieder koordiniert werden, wenn gemeinsame Militäreinsätze geplant werden."
 SLO_deal_with_hungary: "Beseitigen Sie die ungarische Bedrohung"
 SLO_deal_with_hungary_desc:0 "Während in ganz Europa der Frieden zusammenbricht, kann die Entente nicht zulassen, dass Ungarn erneut zu einer Bedrohung wird. Nur eine dauerhafte Lösung kann es uns ermöglichen, uns auf die größeren Probleme zu konzentrieren."
 SLO_deal_with_bulgaria:0 "Bulgarien auflösen"
 SLO_deal_with_bulgaria_desc:0 "Bulgarien hat wieder aufgerüstet und bedroht erneut die Sicherheit des Balkans. Dies ist eine Bedrohung, die nicht toleriert werden kann, wenn sich die Entente auf einen allgemeinen Konflikt in Europa konzentrieren soll."
 SLO_rapprochement_with_hungary:0 "Annäherung an Ungarn"
 SLO_rapprochement_with_hungary_desc:0 "Der ungarische Irredentismus ist eine ständige Bedrohung, aber vielleicht kann noch ein letzter Versuch unternommen werden, das Problem friedlich zu lösen?"
 SLO_czechoslovak_legion: "Die Tschechoslowakische Legion"
 SLO_czechoslovak_legion_desc:0 "Die tschechoslowakische Legion kämpfte während des Ersten Weltkriegs in ganz Europa und während des Bürgerkriegs tief in Russland. Jetzt, da sich der Konflikt in ganz Europa ausbreitet, könnte die Legion erneut marschieren."
 SLO_military_research_institute:0 "Militärtechnisches Institut"
 SLO_military_research_institute_desc:0 "Das Militärtechnische Institut dient dazu, den tschechoslowakischen Streitkräften militärische Forschungs-, Entwicklungs- und Testkapazitäten zur Verfügung zu stellen."
 SLO_mountain_bonus:0 "Gebirgstruppen"
 SLO_mountain_bonus_desc:0 "Da ein großer Teil unserer Grenze aus Hügeln und Bergen besteht, ist der Bedarf an spezialisierten Soldaten zur Überwachung und Verteidigung dieser Gebiete klar."
 SLO_inf_and_artillery_advancement:1 "Infanterie-Fortschritt"
 SLO_inf_and_artillery_advancement_desc:1 "Die Infanterie ist die wichtigste Einheit unserer Armee, daher ist die Verbesserung ihrer Bewaffnung ein entscheidender Schritt auf dem Weg zu einer erfolgreichen Landesverteidigung."
 SLO_support_bonus:1 "Unterstützungseinheiten"
 SLO_support_bonus_desc:1 "Damit unsere Infanterie ihre Höchstleistung erbringen kann, müssen auch die unterstützenden Truppenteile modernisiert werden."
 SLO_inf_and_artillery_advancement_2:1 "Artillerie-Fortschritt"
 SLO_inf_and_artillery_advancement_2_desc:1 "Moderne Artillerie, die Königin des Schlachtfeldes, wird ein großer Kraftmultiplikator in unserer Armee sein."
 SLO_doctrine_bonus:0 "Entdeckungen der Lehre"
 SLO_doctrine_bonus_desc:0 "Waffen allein machen eine Armee nicht schlagkräftig, es bedarf auch wirksamer Doktrinen. Das Militärtechnische Institut ist sich dessen bewusst und hat mehrere Vorschläge gemacht."
 SLO_motorization_scheme:0 "Motorisierungsplan"
 SLO_motorization_scheme_desc:0 "Obwohl wir nicht über die größte Armee verfügen, bietet die Motorisierung die Möglichkeit, unsere Kräfte schneller in einem Gebiet zu konzentrieren."
 SLO_armour_bonus_1:1 "Der LT vz. 38"
 SLO_armour_bonus_1_desc:0 "Unsere Armee verfügt über einige der fortschrittlichsten Panzer der Welt, aber die Technologie auf diesem Gebiet schreitet rasant voran und wir können es uns nicht leisten, zurückzulassen."
 SLO_mechanization:0 "Mechanisierung"
 SLO_mechanization_desc:0 "Während die Motorisierung unseren Soldaten Geschwindigkeit verlieh, bietet ihnen die Mechanisierung Geschwindigkeit, Schutz und Feuerkraft."
 SLO_armour_bonus_ii:1 "Rüstungsmodernisierung"
 SLO_armour_bonus_ii_desc:0 "Das Militärtechnische Institut arbeitet weiterhin eng mit den Skoda-Werken zusammen, um neue und bessere Panzer zu entwickeln."
 SLO_doctrine_bonus_2: "Innovative Kriegsführung"
 SLO_doctrine_bonus_2_desc:0 "Waffen allein machen eine Armee nicht schlagkräftig, es bedarf auch wirksamer Doktrinen. Das Militärtechnische Institut ist sich dessen bewusst und hat mehrere Vorschläge gemacht."
 SLO_war_college:0 "Kriegshochschule"
 SLO_war_college_desc:0 "Das War College stellt unserer Armee die gut ausgebildeten Anführer zur Verfügung, die sie braucht, um sie zum Sieg zu führen."
 SLO_war_college_effect_tt:0 "§YWenn Sie bereits über 5 Forschungsslots verfügen, erhalten Sie keinen zusätzlichen.§!\n"
 SLO_military_aeronautical_institute:0 "Militärisches Luftfahrtinstitut"
 SLO_military_aeronautical_institute_desc:0 "Das Militärische Luftfahrtinstitut versorgt die tschechoslowakische Luftwaffe mit Forschungs- und Designvorschlägen."
 SLO_import_foreign_fighters:0 "Importieren Sie ausländische Kämpfer"
 SLO_import_foreign_fighters_desc:0 "Durch den Import einer Vielzahl ausländischer Kampfflugzeuge zum Testen und Bewerten werden unsere eigenen Flugzeugkonstrukteure wertvolle Erkenntnisse gewinnen."
 SLO_light_fighter_focus:0 "Fokus auf leichte Kämpfer"
 SLO_light_fighter_focus_desc:0 "Das Military Aeronautical Institute ist zu dem Schluss gekommen, dass leichte Jäger am nützlichsten sind und den Kern unserer Luftwaffe bilden sollten."
 SLO_heavy_fighter_focus:0 "Fokus auf schwere Kämpfer"
 SLO_heavy_fighter_focus_desc:0 "Das Military Aeronautical Institute ist zu dem Schluss gekommen, dass schwere Jäger am nützlichsten sind und den Kern unserer Luftwaffe bilden sollten."
 SLO_air_is_our_sea:0 "Luft ist unser Meer"
 SLO_air_is_our_sea_desc:0 "Andere Nationen sind auf eine Marine angewiesen, um ihre Grenzen zu schützen und Macht zu projizieren. Für uns wird diese Rolle von unserer Luftwaffe übernommen."
 SLO_rule_the_air: "Beherrsche den Himmel"
 SLO_rule_the_air_desc:0 "Unser Engagement für die Luftwaffe hat es uns ermöglicht, eine bemerkenswerte Produktionseffizienz aufzubauen."
 SLO_import_foreign_bombers:0 "Importieren Sie ausländische Bomber"
 SLO_import_foreign_bombers_desc:0 "Durch den Import einer Vielzahl ausländischer Bomber zum Testen und Bewerten werden unsere eigenen Flugzeugkonstrukteure wertvolle Erkenntnisse gewinnen."
 SLO_cas_focus:0 "CAS-Fokus"
 SLO_cas_focus_desc:0 "Die Schlussfolgerung der Tests des Military Aeronautical Institute zeigt, dass wir uns auf Flugzeuge zur Luftnahunterstützung konzentrieren sollten."
 SLO_tac_focus:0 "Taktischer Bomberfokus"
 SLO_tac_focus_desc:0 "Die Schlussfolgerung der Tests des Military Aeronautical Institute zeigt, dass wir uns auf taktische Bomber konzentrieren sollten."
 SLO_access_to_the_sea:0 "Zugang zum Meer"
 SLO_access_to_the_sea_desc:0 "Wir sind kein Binnenstaat mehr! Jetzt, wo wir eine Küste haben, müssen wir Meeresfragen untersuchen und einen Plan für die Gründung einer Marine ausarbeiten."
 SLO_sudden_shipyard:0 "Plötzliche Werft"
 SLO_sudden_shipyard_desc:0 "Eine Marine braucht eine Werft. Das haben wir nicht eingeplant, aber große Ingenieurprojekte sind für uns nichts Neues. Bei entsprechendem Aufwand sollte sich eine Werft im Handumdrehen umsetzen lassen."
 SLO_shipbuilding_legacy:0 "Vermächtnis des Schiffbaus"
 SLO_shipbuilding_legacy_desc:0 "Während es neu ist, eine eigene Marine zu haben, blickt Skoda Works auf eine lange Geschichte im Bau von Komponenten für die Schiffe der österreichisch-ungarischen Marine zurück. Jetzt können sie diese Erfahrung nutzen, um Schiffe für unsere eigene Marine zu bauen."
 SLO_battleship_catchup_1:1 "Schlachtschiff-Durchbruch"
 SLO_battleship_catchup_1_desc:1 "Unser neuer Bedarf an einer Marine hat zu einer plötzlichen Flut an Schlachtschiffdesigns geführt."
 SLO_destroyer_catchup_1:1 "Durchbruch des Zerstörers"
 SLO_destroyer_catchup_1_desc:1 "Unser neuer Bedarf an einer Marine hat zu einer plötzlichen Flut an Zerstörer-Designs geführt."
 SLO_cruiser__catchup_1:1 "Cruiser-Durchbruch"
 SLO_cruiser__catchup_1_desc:1 "Unser neuer Bedarf an einer Marine hat zu einer plötzlichen Flut an Cruiser-Designs geführt."
 SLO_raiding_focus:0 "Raiding-Fokus"
 SLO_raiding_focus_desc:1 "Unsere Marine muss sich auf den indirekten Ansatz konzentrieren, Schlachten zu vermeiden und die Schiffe unserer Feinde zu belästigen."
 SLO_capital_focus:0 "Kapitalfokus"
 SLO_capital_focus_desc:1 "Unsere Marine muss sich auf direkte und entscheidende Schlachten konzentrieren."

 ### NATIONAL SPIRITS UNLOCKED BY FOCUSES ###
 SLO_kolben_industry:0 "Kolbens Industrienetzwerk"
 SLO_kolben_industry_desc:0 "Die Branchenexpertise von Emil Kolben ist in die Beschleunigung unserer Bauprogramme eingeflossen. Fabriken, Infrastruktur und Raffinerien werden in einem bemerkenswerten Tempo gebaut."
 SLO_machnik_arms:0 "Machniks Rüstungsoffensive"
 SLO_machnik_arms_desc:0 "Unter der Leitung von František Machník arbeiten unsere Waffenfabriken, Werften und Treibstoffanlagen mit höchster Effizienz und erweitern unsere militärischen Produktionskapazitäten rasch."
 SLO_englis_finance:0 "Englišs Wirtschaftspolitik"
 SLO_englis_finance_desc:0 "Die solide Wirtschaftspolitik von Karel Engliš hat die Staatsausgaben gestrafft, den Anteil der Produktion, der für Konsumgüter verwendet werden muss, verringert und Ressourcen für die Aufrüstung freigesetzt."
