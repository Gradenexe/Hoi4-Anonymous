 SLO_army_equip_1: "Ausrüstung der slowakischen Armee I"
 SLO_army_equip_1_desc: "Die Modernisierung der Anlagenproduktion beginnt. [1/10]"
 SLO_army_equip_2: "Ausrüstung der slowakischen Armee II"
 SLO_army_equip_2_desc: "Die Produktionseffizienz verbessert sich in allen Branchen. [2/10]"
 SLO_army_equip_3: "Slowakische Armeeausrüstung III"
 SLO_army_equip_3_desc: "Optimierte Lieferketten senken die Kosten in allen Bereichen. [3/10]"
 SLO_army_equip_4: "Slowakische Armeeausrüstung IV"
 SLO_army_equip_4_desc: "Die slowakische Rüstungsindustrie arbeitet auf höchstem Niveau. [4/10]"
 SLO_army_equip_5: "Ausrüstung der Slowakischen Armee V"
 SLO_army_equip_5_desc: "Massenproduktion über alle Gerätekategorien hinweg gemeistert. [5/10]"
 SLO_army_equip_6: "Ausrüstung der slowakischen Armee VI"
 SLO_army_equip_6_desc: "Die slowakische Militärproduktion wird von Mitteleuropa beneidet. [6/10]"
 SLO_army_equip_7: "Slowakische Armeeausrüstung VII"
 SLO_army_equip_7_desc: "Die slowakische Militärmaschinerie ist vollständig modernisiert. [7/10]"
 SLO_army_equip_8: "Slowakische Armeeausrüstung VIII"
 SLO_army_equip_8_desc: "Fortschrittliche Fertigungstechniken senken die Kosten immer weiter. [8/10]"
 SLO_army_equip_9: "Slowakische Armeeausrüstung IX"
 SLO_army_equip_9_desc: "Die Slowakei gehört zu den besten Militärproduzenten Europas. [9/10]"
 SLO_army_equip_10: "Ausrüstung der slowakischen Armee X"
 SLO_army_equip_10_desc: "Die slowakischen Streitkräfte sind eine vollständig modernisierte Elite-Streitmacht. [10/10]"
 SLO_pumping_out_weapons: "Waffen abpumpen"
 SLO_pumping_out_weapons_desc: "Unser militärisch-industrieller Komplex hat seine endgültige Form erreicht. Wir werden Waffen in einem noch nie dagewesenen Ausmaß produzieren und dabei moderne Doktrin mit Massenproduktion verbinden."
 SLO_pumping_out_weapons_idea: "Waffen abpumpen"
 SLO_pumping_out_weapons_idea_desc: "Der Höhepunkt des slowakischen Militärreformprogramms. Eine moderne Streitmacht, ausgestattet mit einer Industrie, die mit höchster Effizienz arbeitet."
 SLO_electro_western_slovakia:0 "Elektrifizieren Sie die Westslowakei"
 SLO_electro_western_slovakia_desc:0 "Das industrielle Zentrum rund um Bratislava erfordert eine zuverlässige Stromversorgung. Eine koordinierte Elektrifizierungsmaßnahme im Westen wird dafür sorgen, dass die Fabriken Tag und Nacht in Betrieb bleiben."

 SLO_electro_eastern_slovakia:0 "Elektrifizieren Sie die Ostslowakei"
 SLO_electro_eastern_slovakia_desc:0 "Die östlichen Regionen hinken infrastrukturell lange hinterher. Die Verlagerung der Elektrizität in den Osten wird die Tür zu industriellem Wachstum fernab der Hauptstadt öffnen."

 SLO_electro_southern_slovakia:0 "Elektrifizieren Sie die Südslowakei"
 SLO_electro_southern_slovakia_desc:0 "Das fruchtbare südliche Tiefland braucht genauso viel Strom wie jede Fabrikstadt. Die ländliche Elektrifizierung wird hier die Landwirtschaft und das tägliche Leben gleichermaßen modernisieren."

 SLO_electro_further_eastern_slovakia:0 "Karpatenruthenien elektrisieren"
 SLO_electro_further_eastern_slovakia_desc:0 "Die äußersten östlichen Gebiete der Republik sind nach wie vor die am wenigsten entwickelten Gebiete. Durch den Ausbau des Stromnetzes wird die Region enger an den Rest der Slowakei gebunden."
