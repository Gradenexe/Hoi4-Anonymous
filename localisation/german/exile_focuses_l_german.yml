l_german:
 # Iraq
 IRQ_government_in_exile:0 "Bereiten Sie sich auf das Unvermeidliche vor"
 IRQ_government_in_exile_desc:0 "Unser Heimatland steht kurz vor dem Untergang, aber unser Geist bleibt ungebrochen. Wir werden unsere Regierung darauf vorbereiten, den Befreiungskampf vom Ausland aus zu koordinieren."
 IRQ_foreign_air_support:0 "Ausländische Luftunterstützung"
 IRQ_foreign_air_support_desc:0 "Unsere Gastgeber werden bei der Ausbildung unserer Piloten und der Bereitstellung von Flugzeugen für unsere Exil-Luftwaffe behilflich sein."
 IRQ_foreign_army_support:0 "Unterstützung der ausländischen Armee"
 IRQ_foreign_army_support_desc:0 "Wir werden unsere verstreuten Soldaten und Freiwilligen zu einer kampfbereiten Truppe auf fremdem Boden versammeln."
 IRQ_exile_industries:0 "Exilindustrien"
 IRQ_exile_industries_desc:0 "Durch Vereinbarungen mit unseren Gastgebern werden wir externe Fabriken errichten, um unsere Kriegsanstrengungen zu unterstützen."
 IRQ_exile_resistance:0 "Koordinieren Sie den Untergrund"
 IRQ_exile_resistance_desc:0 "Wir werden Kontakt zu lokalen Widerstandsgruppen in unseren besetzten Gebieten aufnehmen, um Sabotage und Widerstand zu koordinieren."

