 # Generic Exile Ideas
 influx_of_exiles_1:0 "Zustrom von Verbannten I"
 influx_of_exiles_1_desc:0 "Ein stetiger Strom von Flüchtlingen und Freiwilligen ist aus dem besetzten Heimatland geflohen, um sich unserer Sache im Ausland anzuschließen, was unseren Arbeitskräftereserven einen wertvollen Schub verleiht."
