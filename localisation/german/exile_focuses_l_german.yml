 naval_production_boost:0 "Marineproduktion im Exil"
 naval_production_boost_desc:0 "Unsere Ingenieure und Schiffsbauer arbeiten mit den Werftanlagen des Gastlandes zusammen, um die Geschwindigkeit und Effizienz des Schiffsbaus zu verbessern."
 
 strength_in_numbers:0 "Stärke in Zahlen"
 strength_in_numbers_desc:0 "Durch die Mobilisierung aller verfügbaren Bürger, einschließlich der Ausbildung von Frauen für aktive und Hilfsfunktionen in der Luftfahrt, erweitern wir unsere operative Kapazität erheblich."
 
 exiled_air_production:0 "Exilierte Luftproduktion"
 exiled_air_production_desc:0 "Durch die Zusammenarbeit mit verbündeten Flugzeugherstellern können wir Rohstoffe sichern und leichte Kampfflugzeuge für unsere Exil-Luftwaffe bauen."
 
 generic_exile_resistance_idea:0 "Koordination des Exilwiderstands"
 generic_exile_resistance_idea_desc:0 "Aufbau direkter Funkverbindungen und Lieferketten mit Untergrundwiderstandsbewegungen in besetzten Gebieten zur Koordinierung von Sabotageaktionen."
 
 expand_intelligence_idea:0 "Erweitertes Geheimdienstnetzwerk"
 expand_intelligence_idea_desc:0 "Wir integrieren unsere Entschlüsselungsteams und Außendienstmitarbeiter in alliierte Geheimdienststrukturen und gewähren uns Zugang zu fortschrittlichen Spionagenetzwerken."
