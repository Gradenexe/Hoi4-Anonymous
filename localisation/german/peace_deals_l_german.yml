 custom_peace_uncontrolled_take_states:0 "Unbesetztes Gebiet"
 custom_peace_uncontrolled_take_states_desc:0 "Unsere Streitkräfte besetzen dieses Gebiet nicht. Anspruchsvolles Land, für das wir nicht gekämpft haben, kostet deutlich mehr Kriegspunkte."
 custom_peace_uncontrolled_take_states_neighbor_state:0 "Angrenzend an unsere Frontlinien"
 custom_peace_uncontrolled_take_states_neighbor_state_desc:0 "Dieses Gebiet ist unbesetzt, grenzt aber an Land unter unserer Kontrolle. Die Kosten werden teilweise reduziert, da sie innerhalb unserer betrieblichen Reichweite liegen."
 custom_peace_controlled_take_states:0 "Besetztes Gebiet"
 custom_peace_controlled_take_states_desc:0 "Unsere Streitkräfte halten derzeit dieses Territorium, was die Durchsetzung der Forderung am Verhandlungstisch deutlich kostengünstiger macht."
 custom_peace_uncontrolled_puppet:0 "Unbesetztes Gebiet"
 custom_peace_uncontrolled_puppet_desc:0 "Wir haben hier keine militärische Präsenz. Die Einführung einer Marionettenregierung ohne Bodentruppen kostet deutlich mehr Kriegspunkte."
 custom_peace_uncontrolled_liberate:0 "Unbesetztes Gebiet"
 custom_peace_uncontrolled_liberate_desc:0 "Wir haben dieses Gebiet noch nicht erreicht. Die Befreiung von Land, das wir nie betreten haben, ist mit hohen Kriegskosten verbunden."
 custom_peace_uncontrolled_force_government:0 "Unbesetztes Gebiet"
 custom_peace_uncontrolled_force_government_desc:0 "Wir haben hier vor Ort keinen Einfluss. Einen Regierungswechsel ohne Militärpräsenz zu erzwingen, kostet deutlich mehr Kriegspunkte."
