l_german:
  ##################################
  ### 皇民化运动 ###
  ##################################
  JKO_renshi_biandong.1.t: "Ugaki Kazushige geht in den Ruhestand"
  JKO_renshi_biandong.1.desc: "General Ugaki Kazushige trat nach seinem Abschluss an der Kyoto Seijo-Schule in die Armee ein und schrieb sich als Sergeant an der Kaiserlich-Japanischen Armeeakademie ein. Er schloss die Armeeakademie am 26. Juli 1890 (Meiji 23) ab und belegte den 11. Platz von 150 Studenten. Am 24. März 1891 wurde er als Zweiter Leutnant in die Infanterie der kaiserlichen japanischen Armee eingezogen (Meiji 24). 1896 änderte er seinen Namen in Ugaki Kazushige (Meiji 29). Im Jahr 1900 (Meiji 33) schloss er das Army War College ab, belegte den 3. Platz von 39 Studenten und wurde mit dem Imperial Gifted Sword ausgezeichnet. Im Jahr 1927 (Showa 2) war er amtierender Generalgouverneur von Korea. Im Jahr 1929 (Showa 4) bekleidete er erneut das Amt des Armeeministers im Kabinett von Hamaguchi Osachi, musste jedoch 1931 aufgrund des Zwischenfalls im März zurücktreten. Im Jahr 1936 (Showa 11) wurde er erneut Generalgouverneur von Korea, befürwortete „Naisen Yugo“ (Integration Japans und Koreas) und führte die Kominka-Bewegung (Japanisierungsbewegung) ein."
  JKO_renshi_biandong.1.a: "Es ist Zeit für eine Veränderung"
  JKO_renshi_biandong.2.t: "Der „kaiserliche Besuch“ des Kaisers"
  JKO_renshi_biandong.2.desc: "Um die Autorität des Imperiums zu demonstrieren, hat das japanische kaiserliche Haushaltsministerium angekündigt, dass Kaiser Hirohito bald zu einer weiteren „königlichen Reise“ durch das Land aufbrechen wird. Die gesamte Strecke von Tokio nach Osaka wurde vom japanischen Militär unter die höchste Sicherheitsstufe gestellt. Ziel der Tour ist es, der Welt die Stabilität der Co-Prosperity Sphere im Großraum Ostasien zu zeigen. \n\nAllerdings haben die Reisepläne des Kaisers auch eine einmalige Gelegenheit für im Verborgenen lauernde koreanische Unabhängigkeitsaktivisten eröffnet. Sie betrachten Hirohito als die Verkörperung des japanischen Militarismus und die Wurzel kolonialer Unterdrückung. Im Geheimen wird ein kühner Attentatsplan ausgeheckt, der dem Imperium überall dort, wo der Imperator vorbeikommt, einen verheerenden Schlag versetzen soll."
  JKO_renshi_biandong.2.a: "Stellen Sie den Vorfall am Sakurada-Tor nach!"
  JKO_renshi_biandong.4.t: "Ewige Jugend und Ruhm"
  JKO_renshi_biandong.4.desc: "Zhao Yimans Fluchtplan scheiterte am Verrat eines Verräters und sie fiel erneut in die Hände der japanischen Invasoren. Angesichts des letzten Versuchs des Feindes, sie zur Kapitulation zu zwingen, entschied sie sich, ihren Glauben und ihre Würde mit ihrem Leben zu verteidigen und opferte sich heldenhaft im bitterkalten Wind Nordchinas. Obwohl der Körper der Heldin fiel, verwandelte sich ihr unnachgiebiger Geist in eine Flagge, die für immer über der schwarzen Erde Nordostchinas wehte. Ihr Opfer entfachte den Zorn der Rache in den Herzen des Volkes, und unzählige antijapanische Soldaten stürmten mit ihrem Namen auf den Lippen auf die Eindringlinge und starteten immer heftigere Angriffe, bis sie vollständig vertrieben waren."
  JKO_renshi_biandong.4.a: "Verstanden"
  JKO_renshi_biandong.5.t: "Die Rückkehr des weißen Pferdes"
  JKO_renshi_biandong.5.desc: "Nach Monaten grausamer Folter blieb Zhao Yimans revolutionärer Wille standhaft wie Stahl. Sie nutzte einen vorübergehenden Mangel an Wachsamkeit des Feindes und entkam mit der geheimen Unterstützung von Patrioten auf wundersame Weise dem streng bewachten japanischen Militärkrankenhaus. Obwohl sie schwer verletzt war, überwand sie die zahlreichen Blockaden des Feindes und kehrte schließlich erfolgreich in die Arme der nordöstlichen antijapanischen Vereinigten Armee zurück. Ihre Rückkehr war wie ein Schuss in den Arm und steigerte die Moral aller Soldaten enorm. Diese Heldin der Flüsse Changbai-Gebirge und Heilongjiang würde weiterhin für nationale Unabhängigkeit und Freiheit kämpfen."
  JKO_renshi_biandong.5.a: "Unerwartet."
  ########################################################################################################################################
  JKO_huangminhua_event.1.t: "Ermutigende Ergebnisse"
  JKO_huangminhua_event.1.desc: "Dem Büro des Generalgouverneurs wurde ein inspirierender Bericht vorgelegt. Der Bericht zeigte, dass die gesellschaftliche Sichtweise ein völlig neues Gesicht erhalten hat, seit wir die Kominka-Bewegung energisch gefördert haben. In Städten sind immer mehr Familien stolz darauf, die „Landessprache“ (Japanisch) zu verwenden, und Kinder singen auf der Straße Balladen in fließendem Japanisch; In ländlichen Gebieten ist die Zahl der Menschen, die Shinto-Schreine besuchen, stetig gestiegen, und die Menschen integrieren „freiwillig“ ihre alten religiösen Gewohnheiten in den Staats-Shinto. Viele aufgeklärte Adlige und Intellektuelle haben den einfachen Menschen ein Beispiel gegeben, den „richtigen“ Weg zu gehen.\n\nDer Bericht kam zu dem Schluss: „Wir sind auf dem richtigen Weg, und mit der Zeit werden die Menschen in diesem Land mit Sicherheit aus tiefstem Herzen zu wirklich loyalen und zuverlässigen Untertanen des Imperiums.“"
  JKO_huangminhua_event.1.a: "Exzellent"
  JKO_huangminhua_event.2.t: "Stagnation"
  JKO_huangminhua_event.2.desc: "Der neueste Sachstandsbericht über die Kominka-Bewegung ist voller frustrierender bürokratischer Fachsprache. Der Bericht weist darauf hin, dass die Verordnungen zwar erlassen wurden, alle Richtlinien jedoch bei der Umsetzung auf „passiven Widerstand“ gestoßen seien. Die Menschen sprechen in der Öffentlichkeit Japanisch, verwenden aber zuhause und privat immer noch Koreanisch; Sie verneigen sich wie vorgeschrieben vor Shinto-Schreinen, aber in ihren Augen ist keine Spur von Frömmigkeit zu erkennen.\n\nDie gesamte Gesellschaft zeigt eine seltsame Trägheit – sie widersetzen sich nicht offen, akzeptieren sie aber nie wirklich. Wie Wasser umfließen sie die Steine ​​der Politik, ohne ihr Wesen zu verändern. Die Schlussfolgerung des Berichts lautet: Ohne strengere Maßnahmen wird die Kominka-Bewegung nur auf dem Papier und bedeutungslos bleiben."
  JKO_huangminhua_event.2.a: "Lass es sein"
  JKO_huangminhua_event.3.t: "Der Kominka-Bewegung wird Widerstand geleistet!"
  JKO_huangminhua_event.3.desc: "Ein dringender Bericht der Tokko (Sonderpolizei) warnt davor, dass die Kominka-Bewegung heftige Gegenreaktionen auslöst! In den letzten Wochen kam es überall zu zerstörerischen Widerstandsaktivitäten. In Pjöngjangs Schulen wurden Schüler verhaftet, weil sie sich weigerten, „Kimigayo“ (die japanische Nationalhymne) zu rezitieren; Auf den Docks von Busan wurden Propagandaplakate mit der Aufschrift „Naisen Ittai“ (Japan und Korea als eins) mit dem Slogan „Vertreibt die japanischen Piraten“ unkenntlich gemacht. In der Nacht von Keijo (Seoul) schrieb jemand sogar mit Blut an die Wände: „Stellt unsere Sprache und Namen wieder her.“"
  JKO_huangminhua_event.3.a: "Ein Haufen widerspenstiger Leute"
  JKO_huangminhua_event.4.t: "Koreanische Untergrundschulen"
  JKO_huangminhua_event.4.desc: "Ein Bericht des Tokko offenbart einen beunruhigenden Trend. Nachdem wir den Gebrauch der koreanischen Sprache im öffentlichen Bildungswesen ausdrücklich verboten hatten, haben einige entlassene Lehrer, hartnäckige nationalistische Gelehrte und patriotische Schüler überall heimlich „koreanische Untergrundschulen“ gegründet. Diese sogenannten „Schulen“ verstecken sich in städtischen Dachböden, Kellern oder abgelegenen Bauernhäusern auf dem Land. Der Bericht warnt davor, dass diese Untergrundschulen zu „Brutstätten“ antijapanischen Denkens und „Rekrutierungsgebieten“ für Widerstandsorganisationen werden. Die bloße Kontrolle des oberirdischen Bildungssystems reicht bei weitem nicht aus – die Erinnerung und die Seele dieser Nation bestehen hartnäckig wie Unkraut in den dunklen Ecken, die wir nicht sehen können. Wir müssen Maßnahmen ergreifen, um diese Funken vollständig auszulöschen, bevor sie ein Präriefeuer entfachen."
  JKO_huangminhua_event.4.a: "Unterdrücken Sie sie energisch!"
  JKO_huangminhua_event.4.b: "Lass sie sein!"
  JKO_huangminhua_event.5.t: "Großer Erfolg der Sōshi-kaimei-Politik"
  JKO_huangminhua_event.5.desc: "Ein Siegesbericht! Seit der Verkündung der Sōshi-kaimei-Verordnung (Namensänderungsverordnung) haben wir hervorragende Ergebnisse erzielt, die die Erwartungen weit übertrafen. In Keijo (Seoul) übernahmen die alte Aristokratie unter der Führung der Yi-Königsfamilie und die neu aufgestiegenen pro-japanischen Eliten die Führung bei der Reaktion und gaben der breiten Öffentlichkeit ein Beispiel für „Anpassung an die Zeit“. Ihre Aktionen verbreiteten sich schnell über Zeitungen und Radio auf der gesamten Halbinsel und erzeugten einen starken Demonstrationseffekt. Von Städten bis hin zu Dörfern strömten die Menschen zu den Haushaltsregistrierungsämtern, um ihren Nachnamen zu ändern, und viele Familien waren sogar stolz darauf, einen „Shi“ (Clan-Namen) zu erhalten, der mit prominenten japanischen Clans harmonierte. Dies ist nicht nur eine Namensänderung, sondern ein Wandel des Denkens. Fakten haben bewiesen, dass die Menschen auf der Halbinsel weise und vernünftig sind und die glänzende Zukunft von „Naisen Ittai“ (Japan und Korea als eins) aktiv annehmen."
  JKO_huangminhua_event.5.a: "Eine historische Integration!"
  JKO_huangminhua_event.6.t: "Bescheidene Ergebnisse der Sōshi-kaimei-Politik"
  JKO_huangminhua_event.6.desc: "Der Bericht über die Umsetzung der Sōshi-kaimei-Politik wurde veröffentlicht, mit gemischten Ergebnissen. In städtischen Gebieten haben die meisten Regierungsangestellten, Kaufleute und Studenten die Namensänderung aus Rücksicht auf praktische Interessen vorgenommen. Für sie ist es lediglich eine notwendige „Eintrittskarte“, um bessere Arbeitsplätze, Bildung und Verpflegungsmöglichkeiten zu erhalten. Allerdings stieß die Umsetzung des Dekrets in den riesigen ländlichen Gebieten, in denen traditionelles Denken und Clanmacht stark ausgeprägt sind, auf enormen unsichtbaren Widerstand. Die Landwirte verzögerten sich passiv mit verschiedenen Ausreden wie Analphabetismus, mangelndem Verständnis und der Unfähigkeit, gute Namen zu finden. Das Dekret hat in seiner Form teilweise Erfolg gehabt, hat aber wenig dazu beigetragen, die innere Identität dieser Nation wirklich zu erschüttern. Wir haben ihre Registrierung geändert, aber es ist uns nicht gelungen, ihre Herzen zu ändern."
  JKO_huangminhua_event.6.a: "Eine komplizierte Situation."
  JKO_huangminhua_event.7.t: "Wenig Resonanz auf die Sōshi-kaimei-Politik"
  JKO_huangminhua_event.7.desc: "Ein erschütternder Bericht! Die Umsetzung der Sōshi-kaimei-Verordnung ist katastrophal gescheitert. Überall sind die Haushaltsmeldeämter verlassen und unsere Beamten stehen vor einer hohen Mauer aus Schweigen, Verachtung und mangelnder Kooperation. Für eine Nation, deren Kerntradition die Ahnenverehrung und der Nachname die Grundlage des Lebens ist, wird die Änderung des Nachnamens weithin als unverzeihlicher Verrat und spiritueller Tod angesehen. Viele Menschen würden lieber ihre Arbeit aufgeben, ihre Lebensmittelrationen verlieren und sogar das Risiko eingehen, von der Polizei schikaniert zu werden, als die von ihren Vorfahren überlieferten Nachnamen zu ändern. Diese Politik, die auf die Auslöschung ihrer Identität abzielt, hat stattdessen ihre nationale Identität in beispiellosem Maße stimuliert. Es ist uns nicht nur nicht gelungen, sie zu assimilieren, sondern wir haben auch unzählige Gemäßigte auf die Seite der Widerstandsorganisationen gedrängt."
  JKO_huangminhua_event.7.a: "Unerschütterliche Traditionen...."

  JKO_huangminhua_event.8.t: "[JKO.GetNameDef] Power Subversion Against [KOR.GetAdjective]"
  JKO_huangminhua_event.8.desc: "Wir haben nacheinander Berichte erhalten, dass die Italiener in unseren rückwärtigen Gebieten Unwahrheiten verbreiten, mit der Absicht, unsere Herrschaft zu schwächen und unsere Legitimität zu diskreditieren. Diese bösartigen Lügen könnten unser Volk dazu bringen, sich [JKO.GetNameDef] zuzuwenden, und die Legitimität der Halbinsel wird weiter in Frage gestellt. Es ist zwingend erforderlich, die absolute Herrschaft über die koreanische Halbinsel wiederherzustellen, bevor sie weiteren Schaden anrichten."
  JKO_huangminhua_event.8.a: "Sie werden für ihre Lügen bezahlen!"
  ########################################################################################################################################
  JKO_duli_yundong_event.1.t: "Drucken von Untergrundpublikationen"
  JKO_duli_yundong_event.1.desc: "Ein Bericht unserer Kameraden zeigt, dass unsere Propagandaarbeit erhebliche Fortschritte gemacht hat! Die heimlich gedruckten „Independence News“ fließen wie Blut in den unterirdischen Adern dieses Landes. Obwohl das Papier rau und die Tinte scharf ist, trägt es die Sprache und Seele unserer Nation, eine Fackel, die in der dunklen Nacht nur für unser eigenes Volk angezündet wird. In Seouls Teehäusern und Busans Docks verbreiten Menschen diese Boulevardzeitung heimlich und unter großem Risiko. Es deckt die Lügen des „Heiligen Krieges“ auf, veröffentlicht verbotene Nationalgedichte und lässt Landsleute, die sich einsam im Dunkeln fühlen, den Funken der Hoffnung wiedersehen. Die Übermittlung jeder Kopie von „Independence News“ ist eine stille Demonstration; Jedes gelesene Wort ist ein Schuss auf die ideologische Verteidigungslinie des Feindes."
  JKO_duli_yundong_event.1.a: "Ausgezeichnet!"
  JKO_duli_yundong_event.2.t: "Koreas Gesandte"
  JKO_duli_yundong_event.2.desc: "Eine unerwartete diplomatische Note wurde auf unseren Schreibtisch gelegt. Einer geheimen Delegation, die vorgab, die „Provisorische Regierung der Republik Korea“ zu vertreten, gelang es, die strenge Überwachung Japans zu umgehen und Kontakt zu unseren Diplomaten in Genf aufzunehmen Ursache.\n\nDas ist ein äußerst kniffliges Dilemma: Sie zu unterstützen bedeutet, dass wir die Ideale der Liga verteidigen, aber das mächtige japanische Imperium völlig verärgern werden, was unvorhersehbare Risiken für den Fernen Osten mit sich bringt; Sie abzulehnen bedeutet, die Gräueltaten hinzunehmen, und wir werden das Vertrauen aller schwachen Nationen der Welt verlieren. Wie sollen wir auf diese schwere Bitte aus dem Osten reagieren?"
  JKO_duli_yundong_event.2.a: "Für die Interessen des Fernen Ostens."
  JKO_duli_yundong_event.2.b: "Wir haben keine Zeit für sie."
  JKO_duli_yundong_event.3.t: "Ein Wunder in Genf!"
  JKO_duli_yundong_event.3.desc: "Unglaublich gute Nachrichten! Unseren Gesandten ist in Genf ein historischer diplomatischer Durchbruch gelungen! Nach dem anfänglichen kalten Empfang fanden unsere tränenreichen Anschuldigungen unerwartet Sympathie und Unterstützung in mehreren kleinen Ländern, die ebenfalls unter Aggressionen gelitten hatten. Durch ihre Lobbyarbeit und ihren energischen Einsatz verabschiedete der Völkerbund überraschend eine Resolution.\n\nObwohl die Resolution vorsichtig formuliert war, nahm sie ausdrücklich „die angespannte Lage auf der koreanischen Halbinsel zur Kenntnis“ und „erkannte das Recht aller Nationen auf Selbstbestimmung an“. Dies kam Japan diplomatisch einer lauten Ohrfeige gleich! Dies war keine militärische Intervention, sondern der größte moralische Sieg, den wir bisher in unserem Kampf errungen haben. Japans internationales Ansehen wurde dadurch geschädigt, und einige demokratische Länder begannen, mitfühlende Blicke auf uns zu werfen."
  JKO_duli_yundong_event.3.a: "Ausgezeichnet!"
  JKO_duli_yundong_event.4.t: "[From.GetAdjective] wählt Stille"
  JKO_duli_yundong_event.4.desc: "Aus Genf kam ein herzzerreißendes Telegramm: Unser Antrag wurde abgelehnt. Der von einigen Großmächten manipulierte Völkerbund wies unsere Berufung offiziell mit der Begründung „Nichteinmischung in die inneren Angelegenheiten der Mitgliedsstaaten“ ab, um Japan, einen wichtigen Mitgliedsstaat, nicht zu beleidigen. Sie sprachen leere Worte über die „Aufrechterhaltung der Stabilität im Fernen Osten“, verschlossen aber die Augen vor dem Leid, das wir ertragen mussten.\n\nWestliche Zeitungen berichteten kaum über diesen Vorfall, und [From.GetAdjective] beschloss, zu schweigen. Diese schmerzhafte Lektion hat uns eine Wahrheit klar gemacht: Freiheit und Unabhängigkeit können niemals durch die Nächstenliebe und das Mitgefühl anderer erreicht werden. Illusionen wurden zerstört, und jetzt können und müssen wir uns nur noch auf die Schwerter und Waffen in unseren eigenen Händen verlassen, um zurückzugewinnen, was uns rechtmäßig gehört."
  JKO_duli_yundong_event.4.a: "Leider"
  JKO_duli_yundong_event.5.t: "Schüsse im Morgengrauen"
  JKO_duli_yundong_event.5.desc: "Als im Herzen des Imperiums die Kirschblüten blühten, durchdrang ein Schuss die Stille der Morgendämmerung. In einer sorgfältig geplanten Operation drangen Unabhängigkeitsaktivisten aus Korea erfolgreich in die Nähe des Kaiserzuges ein und nahmen das höchste Symbol des japanischen Reiches – $JAP_hirohito$ – ins Visier. Im darauffolgenden Chaos wurde der Tod des Kaisers bestätigt. Die Nachricht raste wie ein Blitz durch Japan und stürzte das Land in einen beispiellosen Schock und ein Machtvakuum. Die Widersprüche zwischen der Hardliner-Militärfraktion und der zivilen Regierungsgruppe verschärften sich augenblicklich, in den Straßen Tokios kam es zu Unterströmungen und eine blutige politische Säuberung schien unmittelbar bevorzustehen.\n\nGleichzeitig wurde dieser Schuss auch zu einem Leuchtfeuer, das die Hoffnung auf Unabhängigkeit auf der koreanischen Halbinsel entfachte. Von Nordostchina bis Pjöngjang sahen Aktivisten der Unabhängigkeitsbewegung eine einmalige Chance. Unterdrückter Zorn und Hoffnung verflochten sich, und ein Sturm stand bevor, der über das Schicksal der Nation entscheiden würde. Die Welt schaute mit angehaltenem Atem zu, und die Zukunft des Fernen Ostens nahm in diesem Moment eine Wende."
  JKO_duli_yundong_event.5.a: "Tod dem Tyrannen!"
  JKO_duli_yundong_event.5.b: "Die Situation im Fernen Osten ist im Begriff, sich zu ändern."
  JKO_duli_yundong_event.6.t: "Bürgerkrieg!"
  JKO_duli_yundong_event.8.t: "Entstehen! Ihr, die ihr keine Sklaven sein wollt!"
  JKO_duli_yundong_event.9.t: "Ostasiatischer nationaler Befreiungskrieg"
  JKO_duli_yundong_event.9.desc: "In Keijo (Seoul) unter japanischer Kolonialherrschaft starteten Dutzende bewaffneter koreanischer Unabhängigkeitsaktivisten einen verzweifelten Überfall auf den Generalgouverneur von Korea, ein Symbol der Kolonialherrschaft. Sie besetzten schnell den Senderaum und verkündeten die „Unabhängigkeitserklärung“ für die gesamte Halbinsel. Sie gelobten, „den letzten Tropfen Blut zu vergießen, um die nationale Unabhängigkeit und Freiheit wiederherzustellen“, und riefen alle koreanischen Landsleute auf, sich zu erheben und Widerstand zu leisten, entschlossen, die japanischen Kolonisatoren von der Halbinsel zu vertreiben und echte nationale Unabhängigkeit für die koreanische Halbinsel zu erreichen Büro, ein Symbol der Unterdrückung. Obwohl die Aufständischen bald heftig von der japanischen Armee angegriffen wurden, war dieser mutige Akt wie ein Präriefeuer, das die überall versteckten Widerstandskräfte entzündete. Von Busan bis Sinuiju hissten die entsprechenden Flaggen eine nach der anderen. In diesem Moment begann offiziell der blutige Kampf um die Freiheit."
  JKO_duli_yundong_event.9.a: "Vertreibe die japanischen Kolonisatoren aus dem Mutterland!"
  JKO_duli_yundong_event.10.t: "[FROM.GetAdjective] bittet um Hilfe"
  JKO_duli_yundong_event.10.desc: "Kürzlich kamen uns Unabhängigkeitsaktivisten von [FROM.GetAdjective] zu Besuch. Sie sprachen über die Verwüstung, die durch die tyrannische Herrschaft der japanischen Herrscher verursacht wurde, und sind bereit, zu den Waffen zu greifen, um der Unterdrückung zu widerstehen, in der Hoffnung, dass wir Waffen bereitstellen werden, um der Bedrohung durch den japanischen Faschismus entgegenzuwirken."
  JKO_duli_yundong_event.10.a: "Wir werden die Augen vor gut ausgerüsteten Freiwilligen verschließen, die sich auf den Weg zum [FROM.GetNonIdeologyName] machen"
  JKO_duli_yundong_event.10.b: "Wir können uns nicht einmischen"
  JKO_duli_yundong_event.10.c: "Spontane Beteiligung der Öffentlichkeit"
  JKO_duli_yundong_event.11.t: "[FROM.GetAdjective] weigert sich, Hilfe zu leisten"
  JKO_duli_yundong_event.11.desc: "Unglückliche Neuigkeiten. [FROM.GetAdjective] weigert sich, Freiwillige zu entsenden, wenn sich unser Land im Bürgerkrieg befindet. Es scheint, dass wir, wenn unsere glorreiche Unabhängigkeitsbewegung gewalttätig wird, unseren tyrannischen Unterdrückern allein gegenüberstehen werden …"
  JKO_duli_yundong_event.11.a: "Wir kämpfen alleine......"
  JKO_duli_yundong_event.12.t: "[FROM.GetAdjective] bietet Hilfe"
  JKO_duli_yundong_event.12.desc: "Die [FROM.GetAdjective]-Regierung ist nicht bereit, sich unserem Krieg gegen den Tyrannen anzuschließen, aber die Stimmen der [FROM.GetAdjective]-Leute, die uns unterstützen, werden immer lauter. Viele [FROM.GetAdjective]-Freiwillige haben sich unseren Reihen angeschlossen. Obwohl die Zahl geringer ist als erwartet, ist sie dennoch hilfreich für die Bedrohungen, denen wir ausgesetzt sind."
  JKO_duli_yundong_event.12.a: "Zumindest sind sie bereit, ein wenig Hilfe zu leisten, besser als nichts."
  JKO_duli_yundong_event.13.t: "[KOR.GetName] beantragt internationale Mediation"
  JKO_duli_yundong_event.14.t: "Der Völkerbund fordert Frieden"
  JKO_duli_yundong_event.14.desc: "Der Völkerbund fordert, dass das Imperium seine Truppen unverzüglich von der koreanischen Halbinsel abzieht und die Feindseligkeiten mit [KOR.GetName] beendet."
  JKO_duli_yundong_event.14.a: "Wir müssen zumindest vorerst akzeptieren"
  JKO_duli_yundong_event.14.b: "Sie trauen sich nicht, etwas zu tun."
  JKO_duli_yundong_event.15.t: "[From.GetAdjective] stimmt einem Waffenstillstand zu"
  JKO_duli_yundong_event.15.desc: "Nachdem der Völkerbundsrat eine Resolution verabschiedet hatte, kam die von [FROM.GetLeader] geführte [FROM.GetAdjective]-Regierung endlich zur Besinnung. Das vom Völkerbund erlassene Waffenstillstandsabkommen stellte die nationalen Grenzen der Vorkriegszeit wieder her. Leider beinhaltet dieses Abkommen keine Entschädigung für die zusätzlichen Verluste, die [ROOT.GetName] entstanden sind, aber es gibt uns zumindest Zeit, das Land wieder aufzubauen."
  JKO_duli_yundong_event.15.a: "In gewisser Weise ein Sieg"
  JKO_duli_yundong_event.16.t: "[FROM.GetName] trotzt dem Völkerbund"
  JKO_duli_yundong_event.16.desc: "Trotz Kriegsdrohungen von Mitgliedern des Völkerbundsrates beabsichtigt [FRON.GetLeader] weiterhin, [ROOT.GetName] zu zerstören. Der Rat hat verlangt, dass [FROM.GetName] die Feindseligkeiten mit [ROOT.GetName] sofort beendet, aber [FROM.GetName] ist äußerst arrogant und weigert sich, dem nachzukommen."
  JKO_duli_yundong_event.16.a: "Was getan ist, ist getan, wir können nichts tun."
  JKO_duli_yundong_event.16.b: "Verhängen Sie ein Handelsembargo gegen [From.GetAdjective], bis sie Buße tun."
  JKO_duli_yundong_event.17.t: "[From.GetAdjective]-Embargo"
  JKO_duli_yundong_event.17.desc: "[From.GetAdjective] hat beschlossen, die Forderungen des Völkerbundes zu akzeptieren und als Reaktion auf unseren Widerstand gegen den Völkerbund ein Embargo gegen unser Land zu verhängen. [From.GetNameDef] wird den Rohstoffhandel mit unserem Land stoppen. Wir sollten erwägen, eine Vermittlung zu akzeptieren oder die bestehende internationale Ordnung aufzugeben und nach Möglichkeiten bei den feindlichen Kräften des liberalen Kapitalismus zu suchen."
  JKO_duli_yundong_event.17.a: "Weiße Teufel!"
  JKO_duli_yundong_event.17.b: "Wir müssen zumindest vorerst akzeptieren."
  JKO_duli_yundong_event.18.t: "[From.GetAdjective] akzeptiert Mediation"
  JKO_duli_yundong_event.18.desc: "Die [From.GetAdjective]-Regierung hat die Bitte des Völkerbundes angenommen, in der Situation im Fernen Osten zu vermitteln."
  JKO_duli_yundong_event.18.a: "Sehr gut, die Welt ist wieder friedlich."
  JKO_duli_yundong_event.19.t: "Morgendämmerung der Genesung"
  JKO_duli_yundong_event.19.desc: "Nach Jahren des Kampfes und der Opfer flammte auf der koreanischen Halbinsel endlich der Funke der Freiheit auf. Von den Guerillas am Fuße des Baekdu-Berges bis zu den Widerstandsorganisationen auf den Straßen der Stadt strömten unzählige koreanische Patrioten in einen unaufhaltsamen Strom. Als Wellen von Protesten über das Land fegten, gerieten die überall stationierten japanischen Truppen in einen riesigen Ozean des Volkskriegs.\nNLABZZIn Seoul durchbrachen aufständische Zivilisten und übergelaufene Soldaten die letzte Verteidigungslinie des japanischen Generalgouverneurs von Korea, und die Flagge der aufgehenden Sonne, die Jahrzehnte der Kolonialherrschaft symbolisierte, fiel niedergeschlagen. Zur gleichen Zeit befreiten heldenhafte Soldaten in Busan und Pjöngjang erfolgreich die Städte und errichteten auf jedem Zentimeter des zurückgewonnenen Landes den Taegukgi, der die Unabhängigkeit symbolisierte. Korea, ein unabhängiges und souveränes Land, wurde durch die Taufe mit Feuer und Blut wiedergeboren."
  JKO_duli_yundong_event.19.a: "Gib mir Freiheit oder gib mir den Tod!"
  JKO_duli_yundong_event.22.t: "[KAO.GetAdjective] fordert einen Waffenstillstand"
  JKO_duli_yundong_event.22.desc: "Der Koreakrieg tobt seit einem ganzen Jahr. Obwohl wir enorme Ressourcen in den Kampf gesteckt haben und schwere Verluste erlitten haben, sind die Fronten weiterhin festgefahren und wir haben sogar wiederholt Rückschläge erlitten. Unser Ziel, die Halbinsel zurückzuerobern, scheint nun unerreichbar. Gerade als wir müde und verwirrt werden, erreicht uns eine unerwartete Nachricht: Das koreanische Regime, das einst geschworen hat, uns vollständig aus Asien zu vertreiben, hat die Initiative ergriffen, Gesandte zu entsenden und seine Bereitschaft zum Ausdruck zu bringen, einen Waffenstillstand auszuhandeln.\n\nKönnte es sein, dass sie erschöpft und wirklich nicht in der Lage sind, den Kampf fortzusetzen? Oder ist das ein finsterer Trick, um uns in die Irre zu führen und Zeit für ihre nächste Offensive zu gewinnen? Das Kabinett und das Militär sind in eine heftige Debatte über diese Frage verwickelt. Unabhängig davon stellt dies eine Gelegenheit dar, unsere Strategie auf der Halbinsel neu zu bewerten. Sollten wir diesen Waffenstillstand akzeptieren, wenn auch nur für den Moment, um zu Atem zu kommen und uns neu zu formieren? Oder sollten wir diese Chance nutzen, um größere Erfolge zu erzielen? Sicher ist, dass wir niemals unvorsichtig sein dürfen."
  JKO_duli_yundong_event.22.a: "Wir müssen es zumindest vorerst akzeptieren."
  JKO_duli_yundong_event.22.b: "Sie stehen kurz vor dem Zusammenbruch!"
  JKO_duli_yundong_event.22.c: "Wir fordern, was uns rechtmäßig zusteht."
  JKO_duli_yundong_event.23.t: "Japan lehnt unseren Waffenstillstandsvorschlag ab"
  JKO_duli_yundong_event.23.desc: "Verabscheuungswürdig! Die japanischen Imperialisten haben unsere Waffenstillstandsinitiative zur Beendigung des sinnlosen Blutvergießens abgelehnt! Sie behaupten arrogant, dass der Krieg nur enden wird, wenn wir bedingungslos unsere Waffen niederlegen und uns ihrer Herrschaft unterwerfen.\n\nDiese hartnäckige und unnachgiebige Rhetorik hat unsere Friedensillusionen völlig zerstört. Die Eindringlinge haben ihre bösartigen Ambitionen nie aufgegeben; Sie versuchen, unseren nationalen Willen durch einen langwierigen Krieg zu zerschlagen. Wenn das der Fall ist, bleibt uns nichts anderes übrig, als diesen Widerstandskrieg gegen die Aggression bis zum Ende zu führen! Die gesamte Nation ist bereit für einen langen Krieg, und wir werden unser Blut und unseren Stahl einsetzen, um diese hartnäckigen Feinde völlig zu besiegen!"
  JKO_duli_yundong_event.23.a: "Hartnäckige Eindringlinge!"
  JKO_duli_yundong_event.24.t: "Japan fordert Entschädigung für einen Waffenstillstand"
  JKO_duli_yundong_event.24.desc: "Unsere Waffenstillstandsinitiative hat eine empörende Reaktion aus Japan erhalten: Sie haben die Dreistigkeit, von uns „Kriegsentschädigungen“ und „Waffenstillstandsentschädigung“ zu fordern! Diese Banditen wollen nicht nur unser Heimatland besetzen, sondern nun auch unsere Notlage ausnutzen, um den letzten Tropfen Blut und Schweiß aus unserem Volk herauszupressen.\n\nDas ist keine Verhandlung mehr – es ist offensichtliche Erpressung und eine offensichtliche Beleidigung unserer nationalen Würde! Wie können wir einen solchen Affront ertragen? Werden wir uns dafür entscheiden, unsere Demütigung hinzunehmen, um einen flüchtigen Frieden zu sichern, oder werden wir diese gierigen Eindringlinge im Namen unserer nationalen Würde bis zum Tod bekämpfen? Diese beschämende Forderung wird die Weisheit und den Mut unserer Führer auf die Probe stellen."
  JKO_duli_yundong_event.24.a: "Wenn sie Krieg wollen, dann lass ihn kommen!"
  JKO_duli_yundong_event.24.b: "Ein vorübergehender Kompromiss."
  JKO_duli_yundong_event.25.t: "[?KOR.host_nation.GetAdjective] Söldnerrekrutierung"
  JKO_duli_yundong_event.25.desc: "Söldner von [?KOR.host_nation.GetAdjective] sind einer nach dem anderen eingetroffen und haben das Umfeld für unsere Sache verbessert. Sie werden uns auch in den kommenden Schlachten helfen. Natürlich hat das alles seinen Preis."
  JKO_duli_yundong_event.25.a: "Unsere Stärke wächst mit jedem Tag"
  JKO_duli_yundong_event.26.t: "[?KOR.host_nation.GetAdjective]-Piloten nehmen den Anruf entgegen"
  JKO_duli_yundong_event.26.desc: "Wir haben gesehen, wie [?KOR.host_nation.GetAdjective]-Piloten unserem Aufruf gefolgt sind, bei unserer bevorstehenden Befreiung des Heimatlandes zu helfen. Sie bringen wertvolle Erfahrungen mit, die wir mit unseren zukünftigen Piloten teilen können."
  JKO_duli_yundong_event.26.a: "Wir nehmen jede uns angebotene Hilfe an"
  JKO_duli_yundong_event.27.t: "Eine [KOR.GetName]-Hilfsflotte"
  JKO_duli_yundong_event.27.desc: "Angesichts der starken Feindbelästigung auf den Meeren blieb uns keine andere Wahl, als auf [?KOR.host_nation.GetAdjective]-Seeleute und Schiffe aller Art zurückzugreifen. Zu unserer Ermutigung haben Patrioten geantwortet. Dazu gehören pensioniertes Marinepersonal, zivile Matrosen, junge Freiwillige und mehr. Alles, was wir haben, sind Handelsschiffe aus den heruntergekommenen Werften von [?KOR.host_nation.GetNameDef], die jedoch alles riskieren, um diese provisorische Flotte zu bemannen."
  JKO_duli_yundong_event.27.a: "Hoffen wir, dass diese Schiffe noch fahren können ..."
  JKO_duli_yundong_event.28.t: "Gewehrlieferung kommt an"
  JKO_duli_yundong_event.28.desc: "Von [USA.GetAdjective]-Herstellern gekaufte Gewehre wurden an unsere im [USA.GetAdjective]-Gebiet stationierten Streitkräfte geliefert. Diese neuen Waffen werden nun auf Schießplätzen getestet und für die Ausbildung eingesetzt."
  JKO_duli_yundong_event.28.a: "Die Kosten sind es wert"
  JKO_duli_yundong_event.29.t: "Unterstützungsausrüstung kommt an"
  JKO_duli_yundong_event.29.desc: "Die kürzlich für unsere Truppen gekaufte Unterstützungsausrüstung ist eingetroffen. Obwohl es nicht das modernste der Welt ist, wird es dennoch eine große Hilfe an der Front sein."
  JKO_duli_yundong_event.29.a: "Jedes bisschen hilft"
  JKO_duli_yundong_event.30.t: "Flugzeuge kommen an"
  JKO_duli_yundong_event.30.desc: "Von der [USA.GetAdjective]-Armee gekaufte Flugzeuge wurden an unsere Armee übergeben. Obwohl es sich hierbei um ältere Modelle handelt, die in den vergangenen Jahren außer Dienst gestellt und eingelagert wurden, sind sie immer noch voll funktionsfähig. Sie werden jetzt zur Ausbildung von Besatzungen für den Fronteinsatz eingesetzt."
  JKO_duli_yundong_event.30.a: "Jedes Flugzeug ist besser als kein Flugzeug"
  JKO_duli_yundong_event.31.t: "Panzer treffen ein"
  JKO_duli_yundong_event.31.desc: "Von der [USA.GetAdjective]-Armee gekaufte Panzer wurden an unsere Armee übergeben. Obwohl es sich hierbei um ältere Modelle handelt, die in den vergangenen Jahren außer Dienst gestellt und eingelagert wurden, sind sie immer noch voll funktionsfähig. Sie werden jetzt zur Ausbildung von Besatzungen für den Fronteinsatz eingesetzt."
  JKO_duli_yundong_event.31.a: "Jeder Panzer ist besser als kein Panzer"
  JKO_duli_yundong_event.33.t: "Spendenaktion"
  JKO_duli_yundong_event.33.desc: "Unsere jüngste Spendenaktion war ein großer Erfolg. Große Geldsummen von Spendern aus aller Welt flossen in die Staatskasse der Provisorischen Regierung. Es scheint, dass viele Menschen unsere Empörung über die Besetzung von [KOR.GetNameDef] teilen."
  JKO_duli_yundong_event.33.a: "Wir werden ihre Hilfe für die Sache der Befreiung nie vergessen."
  JKO_duli_yundong_event.34.t: "Widerstand in [KOR.GetName]"
  JKO_duli_yundong_event.34.desc: "Unsere Armee hat die feindlichen Streitkräfte im [KOR.GetAdjective]-Territorium durchbrochen, was es für uns einfacher macht, die richtige Herrschaft durchzusetzen. Wir haben jedoch festgestellt, dass in diesen neuen Gebieten Widerstandsbewegungen zunehmen. Die Aussagen von [KOE.GetLeader] gegenüber dem Völkerbund scheinen viele Zivilisten in unseren neu erworbenen Gebieten empört zu haben. Solange es [KOR.GetAdjective]-Menschen gibt, werden sich möglicherweise Widerstandsgruppen vor der Nase unserer Kolonialverwaltung bewegen."
  JKO_duli_yundong_event.34.a: "Sie werden sich auf die eine oder andere Weise unserer Herrschaft unterwerfen."
  JKO_duli_yundong_event_34_tt: "Alle kontrollierten §Y[KOR.GetFlag][KOR.GetAdjective]§!-Zustände: Konformität: §R-10%§!"
  JKO_duli_yundong_event.35.desc: "Gesandte der Provisorischen Regierung Koreas haben von uns militärische Ausrüstung angefordert. Sie hoffen, ihre Streitkräfte zu stärken und der japanischen Aggression zu widerstehen. Für uns ist das eine Chance, im Fernen Osten Einfluss zu gewinnen. Ihnen zu helfen steht im Einklang mit unseren strategischen Interessen, Japan zu schwächen und das sozialistische Lager zu vergrößern. Aber sie sind keine Kommunisten, also müssen wir sorgfältig abwägen."
  JKO_duli_yundong_event.35.a: "Schicken Sie ihnen unsere überschüssige Ausrüstung."
  JKO_duli_yundong_event.36.a: "Ausgezeichnet, wir werden sie gut nutzen."
  JKO_duli_yundong_event.37.desc: "Die Provisorische Regierung der Republik Korea hat uns ein Team von Agenten zur Verfügung gestellt, die sich mit den lokalen Sprachen und der Kultur bestens auskennen und über umfassende Kenntnisse der von Japan besetzten Gebiete verfügen. Diese Agenten können wichtige geheimdienstliche Unterstützung für unsere Kriegsanstrengungen gegen Japan leisten, insbesondere bei Infiltration, Sabotage und Subversion. Obwohl wir hinsichtlich des politischen Einflusses der Provisorischen Regierung weiterhin zurückhaltend sind, wird dieser freiwillige Beitrag des Widerstands dem Sieg der Alliierten sehr zugute kommen."
  JKO_duli_yundong_event.37.a: "Prächtig!"
  JKO_duli_yundong_event.37.tt: "Gewinnen Sie einen lokalen Mitarbeiter mit der Nationalität §Y[KOR.GetAdjectiveCap]§! und §Y[JAP.GetAdjectiveCap]§!."
  JKO_duli_yundong_event.38.t: "Angegriffene Region"
  JKO_duli_yundong_event.38.desc: "Unsere Soldaten in [FROM.GetName] haben dort letzte Nacht einen Großbrand gemeldet. Die örtlichen Feuerwehren kämpfen immer noch gegen das Feuer, gehen aber davon aus, dass es noch vor dem Ende des Tages eingedämmt werden kann. Seitdem das Feuer im Kampfmittellagerbereich ausgebrochen ist, hat die Fabrik selbst schwere Schäden erlitten.\n\nDer Militärgeheimdienst hat eine Untersuchung eingeleitet, um herauszufinden, warum es trotz strenger Sicherheitsmaßnahmen zu dem Feuer kam. Vorläufige Beweise deuten darauf hin, dass es sich höchstwahrscheinlich um Brandstiftung handelte."
  JKO_duli_yundong_event.38.a: "Verdammt..."
  JKO_duli_yundong_event.39.t: "Angriff erfolgreich"
  JKO_duli_yundong_event.39.desc: "Unsere Kämpfer haben erfolgreich eine Reihe von Angriffen hinter den Linien gegen [JAP.GetAdjectiveCap]-Streitkräfte in [FROM.GetName] gestartet, dabei erheblichen lokalen Schaden angerichtet und Vorräte beschlagnahmt."
  JKO_duli_yundong_event.39.a: "Gut."
  JKO_duli_yundong_event.40.t: "Überfall erfolgreich"
  JKO_duli_yundong_event.40.desc: "Unsere Kämpfer haben erfolgreich eine Reihe von Angriffen hinter den Linien gegen [JAP.GetAdjectiveCap]-Streitkräfte in [FROM.GetName] gestartet und dabei schweren lokalen Schaden angerichtet. Wir haben einige ihrer Waffen und Munition erbeutet. Die Ausstattung ist zwar nicht von höchster Qualität, aber davon gibt es reichlich."
  JKO_duli_yundong_event.40.a: "Exzellent."
  JKO_duli_yundong_event.41.t: "Überfall fehlgeschlagen"
  JKO_duli_yundong_event.41.desc: "Heute Morgen im Morgengrauen haben unsere tapferen Soldaten eine feindliche Waffenfabrik in der besetzten Zone angegriffen. Doch die feindlichen Wachen waren vorbereitet und wehrten sich. Unsere Streitkräfte konnten die Oberhand nicht gewinnen und mussten sich vorübergehend zurückziehen."
  JKO_duli_yundong_event.41.a: "Tch...Glück für sie..."
  JKO_duli_yundong_event.42.t: "Großer Erfolg beim Raid"
  JKO_duli_yundong_event.42.desc: "Letzte Nacht überquerten unsere tapferen Kämpfer die Grenze und überfielen blitzschnell das feindliche Arsenal und erbeuteten eine riesige Menge an Waffen. Unsere Männer gingen so schnell vor, dass sie keine echten Beweise hinterließen. Dennoch beschuldigte uns die feindliche Regierung wütend, den Angriff geplant und durchgeführt zu haben. Natürlich machen die glänzenden neuen Gewehre in den Händen unserer Soldaten ihren Verdacht deutlich ..."
  JKO_duli_yundong_event.42.a: "Eine volle Ladung!"
  JKO_duli_yundong_event.43.t: "Die Konferenz von Kairo tritt zusammen"
  JKO_duli_yundong_event.43.desc: "Kairo, 1. Dezember 1943\nALaut einem heute veröffentlichten gemeinsamen Kommuniqué haben sich US-Präsident Roosevelt, der britische Premierminister Churchill und der Vorsitzende der chinesischen nationalistischen Regierung, Chiang Kai-shek, in Nordafrika getroffen. In dem Kommuniqué heißt es, dass die drei Alliierten den Krieg gegen Japan bis zu dessen bedingungsloser Kapitulation fortsetzen werden.\n\nDie Erklärung beschreibt die Nachkriegsregelung mit Japan, einschließlich der Abschaffung aller seit 1914 im Pazifik besetzten Inseln durch Japan und der Rückgabe der Mandschurei, Taiwans und der Penghu-Inseln an die Republik China. Die Erklärung befasst sich insbesondere mit der Zukunft Koreas. Darin heißt es: „Die drei Großmächte sind sich der Versklavung des koreanischen Volkes bewusst und sind entschlossen, dass Korea zu gegebener Zeit frei und unabhängig wird.“ Die Unabhängigkeit Koreas, gegen die sich das koreanische Volk lange Zeit gegen die japanische Herrschaft gewehrt hat, wird stark gefördert. Die Konferenz und ihre Erklärung legten den Grundstein für die Umstrukturierung Ostasiens nach dem Krieg."
  JKO_duli_yundong_event.43.a: "Für unsere lange Zusammenarbeit."
  JKO_duli_yundong_event.43.b: "Das ist besorgniserregend."
  JKO_duli_yundong_event.44.t: "Morgendämmerung aus Kairo"
  JKO_duli_yundong_event.44.desc: "Ende 1943 kam aus dem fernen Kairo (Ägypten) die Nachricht, dass die alliierten Führer Roosevelt, Churchill und Chiang Kai-shek gemeinsam erklärten, dass Korea nach dem Krieg „zu gegebener Zeit“ seine Freiheit und Unabhängigkeit wiedererlangen würde. Die Erklärung von Kairo war wie ein Blitz, der die lange Nacht durchschnitt und augenblicklich Hoffnung in den Herzen aller koreanischen Patrioten entfachte.\n\nYdoch die Formulierung „zu gegebener Zeit“ ließ auch neue Zweifel aufkommen. Verbirgt es komplexe politische Rivalitäten zwischen Großmächten? Wie weit sind wir von echter Unabhängigkeit entfernt? Unabhängig davon hat uns die Erklärung sehr inspiriert und der Welt die Gerechtigkeit der koreanischen Unabhängigkeit gezeigt. Jetzt müssen wir diese historische Chance nutzen und mit Taten beweisen, dass wir für die Freiheit bereit sind!"
  JKO_duli_yundong_event.44.a: "Wir werden abwarten und sehen..."
  JKO_duli_yundong_event.45.t: "Unabhängigkeit unter Vormundschaft?"
  JKO_duli_yundong_event.45.desc: "Bevor die Freude über die Konferenz von Kairo nachließ, kamen beunruhigende Nachrichten aus den Reihen der Alliierten. US-Präsident Roosevelt schlug vor, dass Korea, nachdem es lange Zeit unter japanischer Herrschaft stand, nach dem Krieg in eine Phase der „internationalen Treuhandschaft“ zwischen den USA, China, der UdSSR und anderen eintreten sollte, um uns bei der Vorbereitung auf die vollständige Selbstverwaltung zu „helfen“.\n\nDieser Plan war eine kalte Dusche für unseren Wunsch nach sofortiger Unabhängigkeit. Für das koreanische Volk ist es nichts anderes, als eine Kette durch eine andere zu ersetzen. Haben wir jahrzehntelang gekämpft und sind gestorben, nur um den Herren zu wechseln? Diese „Vormundschaft“ liegt wie ein dunkler Schatten über unserem Weg in die Unabhängigkeit."
  JKO_duli_yundong_event.45.a: "Das koreanische Volk wird niemals zustimmen!"
  JKO_duli_yundong_event.45.b: "Wir haben keine andere Wahl, als zu akzeptieren"
  JKO_duli_yundong_event.45.c: "Lobbyismus dagegen"
  JKO_duli_yundong_event.46.t: "Verbündete geben internationale Treuhandschaft auf"
  JKO_duli_yundong_event.46.desc: "Der Vorschlag von Präsident Roosevelt zur Treuhandschaft war eine offene Herausforderung für unsere nationale Würde – aber wir haben nicht nachgegeben! Durch intensive Diplomatie und Lobbyarbeit in Washington und anderswo haben unsere Diplomaten den Alliierten deutlich die Entschlossenheit des koreanischen Volkes für echte Unabhängigkeit und die Ablehnung jeder verschleierten Herrschaft vermittelt. Endlich hat sich unser unermüdlicher Einsatz gelohnt! Die Vereinigten Staaten haben vorläufig zugestimmt, die Treuhänderschaft für Korea nach dem Krieg aufzugeben. Dies ist ein großer diplomatischer Sieg, der beweist, dass das Schicksal Koreas letztendlich in unseren eigenen Händen liegt!"
  JKO_duli_yundong_event.46.a: "Ein diplomatischer Sieg!"
  JKO_duli_yundong_event.47.t: "Wettlauf mit der Zeit"
  JKO_duli_yundong_event.47.desc: "Der Treuhänderplan der Alliierten verrät unsere Vision der Unabhängigkeit. Auf ihre Ankunft zu warten wäre, als würden wir Wölfe in unser Haus einladen. Wir können das Schicksal unserer Nation nicht anderen anvertrauen!\n\nJetzt müssen wir gegen die Zeit antreten. Der Befehl wurde erteilt: Mobilisieren Sie alle unsere Kräfte, um alle größeren Städte zu befreien, bevor alliierte Vortrupps die Halbinsel betreten. Wir müssen mit der tatsächlichen Kontrolle vollendete Tatsachen schaffen und sie zwingen, unsere Unabhängigkeit anzuerkennen!"
  JKO_duli_yundong_event.47.a: "Für das Drei-Drei-Ri-Land!"
  JKO_duli_yundong_event.48.t: "Proklamation der Befreier"
  JKO_duli_yundong_event.48.desc: "Als alliierte Vertreter eintrafen, fanden sie keine japanische Kolonie vor, sondern ein Land, das vom koreanischen Volk selbst regiert wurde. Von Seoul bis Pjöngjang weht unsere Flagge über jeder befreiten Stadt. Angesichts dieser vollendeten Tatsachen klingt jede Rede von „Treuhandschaft“ hohl. Die Verhandlungsmasse liegt jetzt bei uns."
  JKO_duli_yundong_event.48.a: "Wir haben es geschafft!"
  JKO_duli_yundong_event.49.t: "Ein Schritt zu spät"
  JKO_duli_yundong_event.49.desc: "Noch während unsere Truppen vorrückten, landeten US-Streitkräfte in Incheon und eroberten schnell den Süden. Jetzt durchschneidet ein unsichtbarer „38. Breitengrad“ die Mitte der Halbinsel und teilt unser Heimatland. Unter dem Vorwand, „die Kapitulation Japans zu akzeptieren“, haben sie eine militärische Besatzung errichtet. Eine geteilte Zukunft droht uns allen bedrohlich."
  JKO_duli_yundong_event.49.a: "Wir waren einfach zu spät."
  JKO_duli_yundong_event.50.t: "Vollendete Tatsachen"
  JKO_duli_yundong_event.50.desc: "Wir haben die koreanische Entschlossenheit zur Unabhängigkeit unterschätzt.\n\nWährend wir noch über die Einzelheiten der „Treuhandschaft“ debattierten, reagierten sie mit Taten. Koreanische Streitkräfte eroberten die Halbinsel mit erstaunlicher Geschwindigkeit; Großstädte wechselten fast über Nacht den Besitzer. Sie lehnten unsere „Hilfe“ ab und erklärten ihre Souveränität mit Gewalt.\n\nAn diesem Punkt käme jeder Plan, eine Treuhänderschaft durchzusetzen, einer Kriegserklärung an eine neue souveräne Nation gleich. Das war nie unsere Absicht. Wir können nur ungern anerkennen, dass die Unabhängigkeit Koreas eine vollendete Tatsache ist."
  JKO_duli_yundong_event.50.a: "Schockierend."
  JKO_duli_yundong_event.51.t: "Rote Morgenröte im Norden"
  JKO_duli_yundong_event.51.desc: "Die Alliierten haben endlich ihre internationale Treuhänderschaft durchgesetzt. Doch im Norden haben unsere „Genossen“ – die Sowjetunion – ihre eigenen Pläne. In dem von ihnen besetzten Gebiet installierte die Rote Armee schnell ein kommunistisches Regime namens „Koreanische Volksrepublik“ und stellte unsere nördlichen Brüder unter ihre Kontrolle. Sie behaupten, dies sei die wahre Befreiung des Volkes.\n\nJetzt ist ein unsichtbarer Eiserner Vorhang über die Halbinsel gefallen. Der Traum von einem geeinten, unabhängigen Korea verblasst und wird durch die harte Realität der ideologischen Spaltung ersetzt."
  JKO_duli_yundong_event.51.a: "Oh...nein..."
  ######################################################################################
  KOR_gongye_luxian.1.t: "[FROM.GetNameDef] sucht technische Unterstützung"
  KOR_gongye_luxian.1.desc: "Das frisch unabhängige Korea hat uns eine Anfrage zur technischen Beschaffung geschickt. Obwohl ihr industrielles Fundament schwach ist, ist dies zweifellos ein gutes Geschäft und kann auch unseren Einfluss auf der neu entstandenen koreanischen Halbinsel erweitern."
  KOR_gongye_luxian.1.a: "Die Vorteile überwiegen für uns die Nachteile"
  KOR_gongye_luxian.1.b: "Eine ausgezeichnete strategische Chance"
  KOR_gongye_luxian.1.c: "Ein unwürdiges Risiko"
  KOR_gongye_luxian.2.t: "[FROM.GetNameDef] stimmt der technischen Unterstützung zu"
  KOR_gongye_luxian.2.desc: "[FROM.GetNameDef] hat unserer Bitte zugestimmt! Obwohl der Preis hoch ist, hat dieser Deal ein Fenster für die Modernisierung unseres Landes geöffnet. Unsere Fabriken und Labore können endlich mit der Erforschung fortschrittlicherer Geräte beginnen. Dies ist der erste Schritt zur Selbstständigkeit."
  KOR_gongye_luxian.2.a: "Ausgezeichnet!"
  KOR_gongye_luxian.3.t: "[FROM.GetNameDef] stimmt der technischen Unterstützung zu"
  KOR_gongye_luxian.3.desc: "Die Reaktion von [FROM.GetNameDef] hat alle unsere Erwartungen übertroffen! Sie stimmten nicht nur dem Verkauf der Technologie zu, sondern spendeten uns auch kostenlos mehrere Schlüsselpläne! Wir werden uns immer an diese tiefe Freundschaft erinnern. Sie sind wahre Freunde des koreanischen Volkes!"
  KOR_gongye_luxian.3.a: "Eine unerwartete Freundschaft!"
  KOR_gongye_luxian.4.t: "[FROM.GetNameDef] lehnt technische Hilfe ab"
  KOR_gongye_luxian.4.desc: "[FROM.GetNameDef] lehnte unsere Anfrage arrogant ab – in ihren Augen sind wir vielleicht nur Staub. Dies hat uns eine demütigende Lektion gelehrt: Wir können die Zukunft des Landes nicht von der Wohltätigkeit anderer abhängen. Von heute an müssen wir uns auf unsere eigene Kraft verlassen, um den Weg der Unabhängigkeit und Eigenständigkeit einzuschlagen!"
  KOR_gongye_luxian.4.a: "Bewusstsein für Eigenständigkeit"
  KOR_gongye_luxian.5.t: "Fünfjahresplan"
  KOR_gongye_luxian.5.desc: "Der neu formulierte Fünfjahresplan, der darlegt, wie unsere Regierung in den nächsten Jahren Wirtschaftswachstum erzielen wird, steht kurz vor der Fertigstellung, aber es gibt immer noch erhebliche Unterschiede zwischen den verschiedenen Abteilungen hinsichtlich der Entwicklungsschwerpunkte."
  KOR_gongye_luxian.5.a: "Zuerst die Leichtindustrie."
  KOR_gongye_luxian.5.b: "Zuerst die Schwerindustrie."
  KOR_gongye_luxian.5.c: "Ausgewogene Wahl."
  KOR_junshi_luxian.1.t: "Die Zukunft des Militärs"
  KOR_junshi_luxian.1.desc: "Die Glocke des Aufschwungs hat geläutet, doch der Weg in die Unabhängigkeit ist immer noch voller Dornen. Die Krieger, die für die Freiheit kämpften, sowie das bewaffnete Personal aus der alten Ära warten nun auf die Entscheidung der neuen Regierung. Ihre Existenz ist ein scharfes Schwert der neugeborenen Republik und könnte auch ein Keim der Spaltung sein."
  KOR_junshi_luxian.1.a: "Lösen Sie die Truppen auf"
  KOR_junshi_luxian.1.b: "Reorganisieren Sie die Truppen"
  KOR_zhengxie_huiyi.1.t: "Streit um den Veranstaltungsort"
  KOR_zhengxie_huiyi.1.desc: "Um einen Entwurf für unser neugeborenes Land zu entwerfen, ist die Einberufung einer Nationalen Politischen Konsultativkonferenz unerlässlich. Allerdings steht jeder vor einem heiklen Problem: Wo soll die Konferenz stattfinden? Dabei handelt es sich nicht nur um eine Standortwahl, sondern um ein Symbol für den künftigen Weg des Landes.\n\nVertreter aus dem Süden bestehen darauf, die Veranstaltung in Seoul abzuhalten. Seoul war jahrhundertelang die antike Hauptstadt und das Zentrum der nationalen Geschichte und Kultur Koreas. Sich für Seoul zu entscheiden bedeutet, unsere langjährigen Traditionen zu übernehmen und die Kräfte zu vereinen, die vom Land einen stetigen Fortschritt erwarten.\nDie Stimmen aus dem Norden tendieren zu Pjöngjang. Diese aufstrebende Industriestadt war ein wichtiger Stützpunkt für den Widerstandskampf und repräsentierte Transformation und Wiedergeburt. Die Abhaltung der Konferenz in Pjöngjang wird unseren völligen Bruch mit der alten Ära verkünden und kann die Menschen inspirieren, die eine völlig neue Gesellschaft aufbauen möchten.\n\nDiese Entscheidung wird der Welt den politischen Trend des neuen Korea verkünden und könnte das Kräfteverhältnis im Land dauerhaft verändern. Wir müssen eine umsichtige Entscheidung treffen."
  KOR_zhengxie_huiyi.1.a: "Revolutionäres Heiliges Land – Pjöngjang"
  KOR_zhengxie_huiyi.1.b: "Antike Hauptstadt – Seoul"
  KOR_zhengxie_huiyi.2.t: "Wortlaut der Erklärung"
  KOR_zhengxie_huiyi.2.desc: "Jedes Wort der Unabhängigkeitserklärung, die der Grundstein für die Vereinigung der gesamten Nation sein sollte, ist nun zur Quelle der Spaltung im Redaktionsausschuss geworden. Die Abgeordneten debattierten heftig über den konkreten Wortlaut der Erklärung, der sich auf die grundlegende Ausrichtung unseres neugeborenen Landes bezieht.\n\nRadikale Nationalisten und Vertreter aus dem Norden bestehen auf der Hinzufügung dieser Klausel. Sie glauben, dass wir nur durch die klare Äußerung einer antiimperialistischen Haltung die hart erkämpfte Unabhängigkeit sicherstellen und verhindern können, dass Korea zu einer neuen Spielfigur im Spiel der Großmächte wird.\nSozialisten befürworten lautstark, dass dies die Grundlage des neuen Korea sein sollte. Sie glauben fest daran, dass dies der einzige Weg ist, echte Gleichheit zu erreichen und Ausbeutung zu beseitigen.\nKonservative hingegen hoffen, an die Geschichte anzuknüpfen. Sie glauben, dass die Übernahme der Rechtstradition des alten Reiches der neuen Regierung Legitimität verleihen und die sozialen Schichten besänftigen kann, die Angst vor drastischen Veränderungen haben."
  KOR_zhengxie_huiyi.2.a: "Gehen Sie den sozialistischen Weg"
  KOR_zhengxie_huiyi.2.b: "Schließen Sie sich dem Antiimperialismus an"
  KOR_zhengxie_huiyi.2.c: "Betonen Sie die nationale Unabhängigkeit"
  KOR_zhengxie_huiyi.2.d: "Erben Sie die Rechtstradition des Koreanischen Reiches"
  KOR_zhengxie_huiyi.3.t: "Proteste aus der Alten Zeit"
  KOR_zhengxie_huiyi.3.desc: "Gerade als wir einen Entwurf für die Zukunft des neuen Korea entwerfen, verließ eine Gruppe ungebetener Gäste den Veranstaltungsort. Sie sind ehemalige Minister der Yi-Dynastie und Yangban-Adlige, gekleidet in altmodische offizielle Uniformen, die eine gemeinsame Petition halten und darauf beharren, dass die Wahlregel „Eine Person, eine Stimme“ der neuen Regierung für die Zukunft des Landes unverantwortlich sei.\n\nIhrer Ansicht nach sollten ungebildete Zivilisten und Arbeiter nicht das gleiche Rederecht haben wie gut ausgebildete Gelehrte und Beamte. Sie fordern, dass das Stimmgewicht nach Eigentum, Bildungsstand oder altem Amtsrang aufgeteilt wird, um sicherzustellen, dass die „Elite“ weiterhin das Land führen und die Entstehung einer „Mob-Herrschaft“ verhindern kann.\n\nIhr Protest hat eine heftige Debatte unter den Abgeordneten ausgelöst. Sollten wir uns dafür entscheiden, diese alten Mächte, die die Tradition repräsentieren, zu besänftigen, um die Stabilität aufrechtzuerhalten, oder die Gleichheitsprinzipien der neuen Ära konsequent umsetzen? Unsere Entscheidung wird sich direkt auf die Klassengrundlage und die politische Form des neuen Landes auswirken."
  KOR_zhengxie_huiyi.3.a: "Akzeptieren Sie den Protest"
  KOR_zhengxie_huiyi.3.b: "Verhandeln und Kompromisse eingehen"
  KOR_zhengxie_huiyi.3.c: "Zerstreuen Sie den Protest mit Gewalt"
  KOR_zhengxie_huiyi.4.t: "Land für die Pinne?"
  KOR_zhengxie_huiyi.4.desc: "Politische Debatten werden irgendwann beigelegt, aber was ein Land wirklich stützt, sind seine Menschen und sein Land. Jetzt sind die Augen im Konferenzraum auf die grundlegendste Frage gerichtet: Wie soll mit dem Ackerland umgegangen werden, das einst von einer kleinen Anzahl von Grundbesitzern und ausländischen Streitkräften besetzt war?\n\nRadikale Reformer und Bauernvertreter fordern die Umsetzung des „Land an den Acker“. Sie plädieren dafür, dass das Land der Großgrundbesitzer entschädigungslos konfisziert und direkt an die Bauern verteilt wird, die seit Generationen hart auf diesem Land gearbeitet haben. Dabei handelt es sich um eine Regelung der feudalen Ausbeutung und eine Verpflichtung gegenüber den Arbeitern.\n\nGemäßigte und Wirtschaftsvertreter haben jedoch Warnungen ausgesprochen. Sie befürchten, dass eine radikale Landreform die Wirtschaftsordnung des Landes zerstören und schwere soziale Unruhen auslösen wird. Sie schlagen vor, dass die Regierung mit öffentlichen Mitteln Land zu einem fairen Preis von Grundbesitzern kaufen und es dann zu einem niedrigen Preis an Bauern verkaufen oder verteilen sollte, um einen reibungslosen Übergang zu erreichen.\n\nLand ist der Eckpfeiler des neuen Korea. Die Art und Weise, wie wir diesen Grundstein legen, wird die künftige Wirtschaftsstruktur und soziale Stabilität des Landes bestimmen."
  KOR_zhengxie_huiyi.4.a: "Verteilen Sie das gesamte Land kostenlos an die Ackerbauern!"
  KOR_zhengxie_huiyi.4.b: "Mäßige Erlösung"
  KOR_zhengxie_huiyi.4.c: "Errichten Sie Staatsfarmen und führen Sie die Verteilung schrittweise durch"
  KOR_zhengxie_huiyi.4.d: "Privateigentum schützen!"
  KOR_zhengxie_huiyi.5.t: "Der Wirtschaftsmotor des neuen Landes"
  KOR_zhengxie_huiyi.5.desc: "Ein unabhängiges Land braucht eine starke Wirtschaft als Rückhalt. Nun hat sich der Rauch des Krieges noch nicht verzogen, und der Streit über den Weg zum Aufbau der Volkswirtschaft ist zum Mittelpunkt der Konferenz geworden. Vor uns liegen zwei völlig unterschiedliche Wege.\n\nVertreter aus dem Norden und einige Revolutionäre glauben, dass wir nur durch einen starken nationalen Plan alle Ressourcen konzentrieren können, um die Industrialisierung in kürzester Zeit zu erreichen und eine starke nationale Verteidigungsindustrie aufzubauen. Dieses Modell wird die Verwirklichung nationaler Ziele sicherstellen, kann jedoch auf Kosten der Konsumentscheidungen der Menschen und der Marktvitalität gehen.\n\nKaufleute aus dem Süden und einige Technokraten plädieren dafür, dass wir uns dem Wettbewerb und freien Märkten zuwenden und private Investitionen und Unternehmertum fördern sollten. Sie glauben, dass dies Innovationen anregen, Wohlstand bringen und uns eine schnellere Integration in das Welthandelssystem ermöglichen wird. Dies kann aber auch zu einer Polarisierung zwischen Arm und Reich führen und unsere fragile Wirtschaft anfällig für Schwankungen auf dem Außenmarkt machen."
  KOR_zhengxie_huiyi.5.a: "Errichten Sie eine zentral geplante Wirtschaft"
  KOR_zhengxie_huiyi.5.b: "Freier Markt ist der einzige Weg!"
  KOR_zhengxie_huiyi.5.c: "Der Staat kontrolliert die Lebensader"
  KOR_zhengxie_huiyi.5.d: "Kommerzialisierung des Militärs"
  KOR_zhengxie_huiyi.6.t: "Wo soll das Schwert hängen?"
  KOR_zhengxie_huiyi.6.desc: "Obwohl die Schüsse nachgelassen haben, beobachten diejenigen, die die Waffe tragen, immer noch die Geburt des neuen Regimes. Eine starke Armee ist der Garant für die nationale Unabhängigkeit, aber eine zügellose Armee ist die größte verborgene Gefahr für das Land. Beim Aufbau der Machtstruktur des neuen Landes müssen wir die endgültige Positionierung der Armee klären.\n\nDie Armee muss dem Land und dem Volk gegenüber absolut loyal sein und unter der obersten Führung der Zivilregierung stehen. „Die Partei befiehlt der Waffe“, nicht „Die Waffe befiehlt der Partei“. Nur so kann ein stabiles und modernes Land aufgebaut werden, das militärische Eingriffe in die Politik und Militärputsche wirksam verhindern kann.\n\nEine andere Denkrichtung besagt, dass wir in der gegenwärtigen Situation interner und externer Unruhen die Situation nur stabilisieren und Kräfte mit höchster Effizienz vereinen können, wenn wir den heldenhaften Generälen, die den Unabhängigkeitskrieg angeführt haben, die höchste Macht überlassen. Dies ist die embryonale Form einer „Militär-zuerst-Politik“, bei der der Schwerpunkt darauf liegt, die nationale Entwicklung mit militärischer Macht voranzutreiben."
  KOR_zhengxie_huiyi.6.a: "Die Partei befiehlt die Waffe"
  KOR_zhengxie_huiyi.6.b: "Zivile Kontrolle des Militärs"
  KOR_zhengxie_huiyi.6.c: "Lokale Autonomie"
  KOR_zhengxie_huiyi.6.d: "Milizen legitimieren"
  KOR_zhengxie_huiyi.7.t: "Vorschläge aus dem Norden"
  KOR_zhengxie_huiyi.7.desc: "Gerade als auf der Konferenz erbittert über den künftigen Weg des Landes debattiert wird, wird stillschweigend ein verschlüsseltes Telegramm der sowjetischen Botschaft zugestellt.\nDas Telegramm drückte zunächst „herzliche Glückwünsche“ zur Unabhängigkeit Koreas aus und lobte den Mut, den das Volk im Widerstandskampf gezeigt hat. Dann unterbreitete der Botschafter mit „kameradschaftlicher Sorgfalt“ „Vorschläge“: Er hoffte, dass die neue Regierung „erprobte Revolutionäre“ in Schlüsselpositionen ernennen und ein „fortgeschrittenes“ Wirtschaftsmodell übernehmen werde, um „imperialistische Infiltration“ zu verhindern.\n\nDer Wortlaut des Telegramms ist höflich, aber die Informationen zwischen den Zeilen können nicht ignoriert werden. Unser nördlicher Nachbar beobachtet uns aufmerksam. Sollten wir diese „Freundlichkeit“ akzeptieren und einem mächtigen Verbündeten zur Seite stehen oder an unserem eigenen Weg festhalten, selbst auf die Gefahr hin, den Riesenbären zu verärgern? Diese Entscheidung wird tiefgreifende Auswirkungen auf unsere diplomatische Struktur haben."
  KOR_zhengxie_huiyi.7.a: "Vielen Dank an die sowjetischen Genossen für ihre Unterstützung"
  KOR_zhengxie_huiyi.7.b: "Über die Zukunft Koreas entscheidet das koreanische Volk"
  KOR_zhengxie_huiyi.8.t: "Sorgen aus dem Osten"
  KOR_zhengxie_huiyi.8.desc: "Gerade als wir heftig über die Zukunft des neuen Korea debattieren, durchbrach eine Nachricht aus Washington die Ruhe am Veranstaltungsort. Das US-Außenministerium äußerte „tiefe Besorgnis“ über die derzeitige „politische Instabilität“ in unserem Land und deutete subtil an, dass die großzügige Wirtschaftshilfe der Vereinigten Staaten uns helfen wird, die Wunden des Krieges schnell zu heilen, wenn wir eine „demokratische und freie“ Regierung bilden können „Freundlichkeit“.\n\nIst das ein aufrichtiger Olivenzweig oder eine Versuchung, an die Bedingungen geknüpft sind? Bei unserer Wahl geht es nicht nur um Geld, sondern auch um die zukünftige Unabhängigkeit und Autonomie des Landes."
  KOR_zhengxie_huiyi.8.a: "Vielen Dank an die amerikanischen Kameraden für ihre Unterstützung!"
  KOR_zhengxie_huiyi.8.b: "Die inneren Angelegenheiten dulden keine Einmischung."
  KOR_zhengxie_huiyi.9.t: "Außer Kontrolle geratene Straßen"
  KOR_zhengxie_huiyi.9.desc: "Während Politiker im Konferenzraum noch über die künftige Route des Landes streiten, haben die Menschen auf der Straße die Geduld verloren. Demonstranten, die verschiedene Fraktionen unterstützen – von Arbeitern, die sozialistische Parolen rufen, bis hin zu nationalistischen Jugendlichen, die den Taegukgi schwenken – haben ihre Differenzen von Debatten in Faustkämpfe verwandelt. Der Platz, der einst Hoffnung und Einheit symbolisierte, ist jetzt von Wut und Hass besetzt.\n\nDie soziale Ordnung steht am Rande des Zusammenbruchs. Sollten wir sofort das Kriegsrecht ausrufen und die Ordnung mit Militärbajonetten gewaltsam wiederherstellen oder dringend vortreten, um zu vermitteln und die wütenden Menschen zu besänftigen? Wenn wir nicht bald eine Entscheidung treffen, könnte die Flamme der Unabhängigkeit, die gerade entzündet wurde, durch unsere eigenen Hände gelöscht werden."
  KOR_zhengxie_huiyi.9.a: "Linke Demonstranten unterdrücken"
  KOR_zhengxie_huiyi.9.b: "Rechte Führer verhaften"
  KOR_zhengxie_huiyi.9.c: "Rufen Sie beide Seiten zur Zurückhaltung auf"
  KOR_zhengxie_huiyi.9.d: "Nutzen Sie die Gelegenheit, um die politische Situation zu stören"
  KOR_zhengxie_huiyi.10.t: "Schüsse in der dunklen Nacht"
  KOR_zhengxie_huiyi.10.desc: "Das Wortgefecht im Konferenzraum endete schließlich in regelrechten Schüssen in der dunklen Nacht. Ein wichtiger Vertreter wurde auf dem Rückweg zu seinem Wohnsitz angegriffen und schwer verletzt. Dieser gewalttätige Vorfall war wie ein in einen See geworfener Felsbrocken, der die ohnehin schon fragile Einheit augenblicklich zum Einsturz brachte.\n\nAngst und Misstrauen verbreiteten sich schnell. Vertreter verschiedener Fraktionen vertrauten einander nicht mehr und Verschwörungstheorien waren weit verbreitet. Einige glaubten, es handele sich um Rache von Radikalen, andere dachten, es seien politische Gegner, die Dissidenten eliminierten, und es gab sogar Gerüchte, dass externe Kräfte heimlich sabotierten.\n\nDer Dialog ist tot, und die Kugeln haben begonnen zu sprechen. Wir müssen sofort die Wahrheit herausfinden und die öffentliche Meinung besänftigen, sonst könnte das nächste Geräusch das Gewehrfeuer eines Bürgerkriegs sein."
  KOR_zhengxie_huiyi.10.a: "Führen Sie eine strenge Untersuchung durch und ziehen Sie die Verantwortlichen zur Rechenschaft"
  KOR_zhengxie_huiyi.10.b: "Meditieren Sie sanft, um die Dinge zu beruhigen"
  KOR_zhengxie_huiyi.10.c: "Nutzen Sie die Gelegenheit, die Sicherheitsbefugnisse zu erweitern"
  KOR_zhengxie_huiyi.11.t: "Wahltag"
  KOR_zhengxie_huiyi.11.desc: "[GeKOR_zhengxie_huiyinanceName]"
  KOR_communism_xuanju_key: "Nach einer langen Zeit der Debatte und des Kampfes erklang die Stimme des Volkes endlich durch den Himmel. Wir haben den Weg der Arbeiter gewählt und die Fesseln des Feudalismus und Kapitalismus zerschlagen. Die neugeborene Republik wird von Arbeitern, Bauern und Soldaten regiert, wobei das Land den Ackerbauern und die Fabriken den Arbeitern gehören wird. Dies ist eine wirkliche Entscheidung des Volkes, und wir werden auf diesem Land eine neue Welt ohne Ausbeutung und Unterdrückung aufbauen."
  KOR_democratic_xuanju_key: "Endlich wehte hoch über dem Konferenzsaal die Flagge der Freiheit. Wir lehnten die Versuchung der Autokratie ab und entschieden uns für Demokratie, Rechtsstaatlichkeit und den Markt. Ein neues Land, das die Rechte des Einzelnen schützt und den freien Wettbewerb fördert, war geboren. Die Hilfe des Westens wird unserem Wiederaufbau Vitalität verleihen, und eine offene und erfolgreiche Zukunft erwartet uns. Dies ist der Sieg der Freiheit und die Hoffnung auf die Zukunft."
  KOR_neutrality_xuanju_key: "Angesichts der internen Spaltung und der externen Bedrohungen stellten die Abgeordneten schließlich nationale Interessen über alles. Obwohl immer noch Differenzen bestehen, einigten sich alle Fraktionen darauf, die Streitigkeiten vorübergehend beizulegen und eine Einheitsfrontregierung zu bilden, die alle Kräfte vereint. Für die Unabhängigkeit und das Überleben des Landes müssen wir uns zusammenschließen, um die Schwierigkeiten zu überwinden. Dies ist eine fragile, aber notwendige Einheit, und die Zukunft der Republik wird von unserer Fähigkeit abhängen, diesen Kompromiss aufrechtzuerhalten."
  KOR_fascism_xuanju_key: "Endlose Streitereien führten schließlich zum völligen Scheitern der Beratungen. Als das Land in den Abgrund der Anarchie rutschte, begannen die verzweifelten Menschen, sich nach der alten Ordnung zu sehnen. Um zu verhindern, dass das Land auseinanderfällt, kamen alle Kräfte schließlich zu einem unerwarteten Konsens: die königliche Familie Yi wieder willkommen zu heißen. Der Monarch regiert vielleicht nicht direkt, aber als Symbol der nationalen Einheit wird er die letzte Hoffnung sein, die chaotische Situation zu stabilisieren."
  KOR_zhengxie_huiyi.11.a: "Die Wahl des Volkes"
  KOR_zhengxie_huiyi.11.b: "Sieg der Freiheit"
  KOR_zhengxie_huiyi.11.c: "Bildung einer Einheitsfront"
  KOR_zhengxie_huiyi.11.d: "Beratungen scheiterten!"
  #KOR_zhengxie_huiyi.13.t: "The Giant Star Has Not Fallen"
  #KOR_zhengxie_huiyi.13.desc: "Amidst the cheers of recovery, a conspiracy bullet was shot at our leader. However, Mr. Kim Koo miraculously survived this despicable assassination. The assassin's atrocity failed to extinguish the lighthouse of independence, but instead made his prestige reach its peak. The people's anger and sympathy converged into a torrent, and those petty people who attempted to divide the nation now have to tremble in front of a giant reborn from the fire. This assassination failed to send him to the grave, but may push him to the pinnacle of power faster."
  #KOR_zhengxie_huiyi.13.a: "Thank goodness"
  KOR_zhengxie_huiyi.14.t: "§Y$KOR_Kim_Koo$§! Ermordet"
  KOR_zhengxie_huiyi.14.desc: "[GetJinJiuWasAssassinated]"
  KOR_zhengxie_huiyi_14_1_key: "Es kam eine traurige Nachricht für die ganze Nation – Herr Kim Koo (Baekbeom), das Symbol unserer nationalen Unabhängigkeitsbewegung und der letzte Wächter der Provisorischen Regierung der Republik Korea, wurde von einem aktiven Militäroffizier in seiner Residenz Kyong Kyonggyojae erschossen. Sein Tod ließ die Hoffnung auf Demokratie und Freiheit äußerst schwinden. Obwohl die Behörden den Fall schnell als persönliche Tat des Mörders einstuften, deuteten alle Gerüchte auf der Straße auf $KOR_syngman_rhee$ und seine Vertrauten. Es wird allgemein angenommen, dass es sich hierbei um einen verabscheuungswürdigen politischen Mord handelte, der darauf abzielte, den letzten und angesehensten Stolperstein für die Machthaber aus dem Weg zu räumen. Der riesige Stern ist gefallen und die Zukunft der Republik Korea liegt in einem schweren Schatten."
  KOR_zhengxie_huiyi_14_2_key: "Diese sündige Kugel kostete nicht nur das Leben eines großen Patrioten, sondern zerstörte auch die Hoffnung der gesamten Nation auf eine demokratische Zukunft. Herr Kim Koo, ein Riese, der sein Leben lang für die Unabhängigkeit kämpfte, fiel schließlich in die Hände seines eigenen Volkes. Sein Tod brachte den ohnehin fragilen Konsultationsmechanismus völlig zum Erliegen, und Misstrauen und Hass zwischen verschiedenen Fraktionen erreichten ihren Höhepunkt. Mit seinem Tod wurde der Traum von der Demokratie unerreichbar und die Zukunft der koreanischen Halbinsel lag in einem undurchdringlichen Schatten."
  KOR_zhengxie_huiyi.14.a: "Oh mein Gott.."
  KOR_zhengxie_huiyi.15.t: "§Y$KOR_lyuh_woon_hyung$§! Ermordet"
  KOR_zhengxie_huiyi.15.desc: "[GetLyuhWoonHyungWasAssassinated]"
  KOR_zhengxie_huiyi_15_1_key: "Als Anführer der gemäßigten Fraktion war er einst die einzige Brücke, die die beiden extremen Lager verband, und die stärkste Stimme für die Überbrückung von Differenzen und das Streben nach Vereinigung. Der Schuss auf Herrn Lyuh Woon-hyung zerstörte auch die letzte Hoffnung auf eine Zusammenarbeit zwischen links und rechts. Sein Tod blockierte den gemäßigten Weg völlig und rationale Stimmen wurden von Schüssen übertönt.\n\nVon da an gab es keinen Raum mehr für Dialog, sondern nur wachsenden Hass und Konfrontation. Nach dem Sturz dieses unermüdlichen Einigers konnte niemand mehr verhindern, dass die Nation in den Abgrund der Spaltung rutschte. Die Zukunft Koreas lag im Schatten des Bürgerkriegs."
  KOR_zhengxie_huiyi_15_2_key: "Auf den Straßen von Seoul beendete ein Schuss das Leben eines großen Staatsmannes. Herr Lyuh Woon-hyung, ein gemäßigter linker Führer, der sich für die Zusammenarbeit zwischen links und rechts einsetzt und eine nationale Spaltung vermeidet, wurde am helllichten Tag von rechtsextremen Elementen ermordet.\n\nHerr. Lyuh Woon-hyung hatte zwischen dem linken und dem rechten Flügel vermittelt und versucht, eine Koalitionsregierung zu bilden, die alle Fraktionen vereinen könnte. Seine Bemühungen galten als letzte Hoffnung, einen Brudermord zu vermeiden. Allerdings war dieser friedliebende Weg jenseits der Ideologie Hardlinern wie $KOR_syngman_rhee$ ein Dorn im Auge. Dieses Attentat war zweifellos ein extremes Mittel, mit dem sie den Mittelweg völlig zerstören und den Aufbau einer antikommunistischen Festung beschleunigen wollten. Eine blutige Unruhe scheint unausweichlich."
  KOR_zhengxie_huiyi.15.a: "Oh mein Gott.."
  KOR_zhengxie_huiyi.16.t: "Sturm der Säuberung"
  ##################################
  ##Imperialization Movement
  ##################################
  KOR_zhengxie_huiyi.16.desc: "Die Freude über die Befreiung ist noch nicht verblasst, aber der Aufruf zur Liquidierung der „koreanischen Verräter“ ist wie eine Flutwelle aufgetaucht. Das Volk fordert Gerechtigkeit; Diejenigen, die mit den Aggressoren konspiriert und ihre Landsleute verraten haben, müssen den Preis dafür zahlen.\n\nEin unkontrollierter Liquidationssturm kann sich jedoch auch zu einer politischen Säuberung entwickeln, die alles verschlingt. Auf dieser Liste stehen auch viele Administratoren, Techniker und Offiziere aus der alten Zeit. Eine strenge Bestrafung kann die öffentliche Meinung befriedigen und den nationalen Geist umgestalten; Aber sie zu begnadigen könnte eine Abkürzung sein, um die heruntergekommene Maschinerie des Landes wieder zum Laufen zu bringen.\n\nDieses zweischneidige Schwert namens „Liquidierung“ schwebt über unseren Köpfen. Sollten wir einen gründlichen revolutionären Sturm entfesseln oder uns aus Gründen der Stabilität für selektive Vergebung entscheiden? Unsere Entscheidung wird die Seele dieser Nation prägen."
  KOR_zhengxie_huiyi.16.a: "Bestrafen Sie die pro-japanische Fraktion hart"
  KOR_zhengxie_huiyi.16.b: "Verzeihung für rangniedrige projapanische Elemente"
  KOR_zhengxie_huiyi.16.c: "Versöhnen Sie sich mit der pro-japanischen Fraktion"
  #######################################################################################################################
  KOR_kangmi_hongxian.0.t: "Die revolutionäre Blume auf der Leinwand"
  KOR_kangmi_hongxian.0.desc: "Die Dreharbeiten zum revolutionären Opernfilm „Das Blumenmädchen“ sind offiziell abgeschlossen. Der Film erzählt die tragische Geschichte eines armen Mädchens namens Hwa-ni während der japanischen Besatzung, das Blumen verkauft, um die Krankheit ihrer Mutter zu behandeln und ihren jüngeren Bruder zu retten, aber dennoch unter doppelter Unterdrückung durch die Klasse der Grundbesitzer und japanische Invasoren leidet.\n\nDieser Film ist nicht nur ein künstlerisches Werk; Es ist ein lebendiges revolutionäres Lehrbuch. Mit seiner tränenreichen Handlung prangert es die Übel und Ungerechtigkeiten der alten Gesellschaft an und lobt den unbezwingbaren Kampfgeist des koreanischen Volkes. Während der Film landesweit gezeigt wird, werden sich Hwa-nis tragisches Schicksal und sein unnachgiebiger Wille tief in die Herzen aller Zuschauer einprägen, das Klassengefühl unter den breiten Massen entfachen und uns daran erinnern, dass das heutige glückliche Leben hart erkämpft wurde und dass wir bis zum Ende kämpfen müssen, um die Früchte der Revolution zu verteidigen!"
  KOR_kangmi_hongxian.0.a: "Lasst hundert Blumen blühen, lasst hundert Denkrichtungen miteinander konkurrieren"
  KOR_kangmi_hongxian.1.t: "Erfolg bei der Ausweitung des Einflusses"
  KOR_kangmi_hongxian.1.desc: "Durch unermüdliche Bemühungen haben unsere Kameraden endlich den Durchbruch innerhalb der Armee geschafft. Durch die Einrichtung geheimer Studiengruppen unter Soldaten, die Verbreitung revolutionärer Ideen und die Entwicklung von Parteimitgliedern ist es uns gelungen, eine Gruppe ideologisch fortschrittlicher Offiziere und Soldaten um die Partei zu vereinen."
  KOR_kangmi_hongxian.1.a: "Exzellent"
  KOR_kangmi_hongxian.2.t: "Scheitern bei der Ausweitung des Einflusses"
  KOR_kangmi_hongxian.2.desc: "Unsere Versuche, den Einfluss innerhalb des Militärs auszuweiten, haben einen schweren Rückschlag erlitten. Die im Oberkommando verankerten Fraktionskräfte haben unsere Aktivitäten mit großer Wachsamkeit beobachtet. Durch verstärkte politische Kontrolle und den Einsatz von Informanten haben sie mehrere unserer heimlich eingerichteten Parteizellen zerstört.\n\nDieses Scheitern erinnert uns daran, dass der Weg zur Eroberung der Armee voller Dornen ist; Wir müssen verdecktere und widerstandsfähigere Kampfstrategien anwenden."
  KOR_kangmi_hongxian.2.a: "Ach..."
  KOR_kangmi_hongxian.3.t: "Ein General unterstützt uns"
  KOR_kangmi_hongxian.3.desc: "Ein in der Armee angesehener hochrangiger General hat über geheime Kanäle sein Mitgefühl und seine Unterstützung für unsere Sache zum Ausdruck gebracht. Vielleicht ist er von der Sorge um die Zukunft der Nation motiviert, oder vielleicht hat er die korrupte Natur der Reaktionäre durchschaut. Unabhängig davon ist seine Hinzufügung ein enormer Aufschwung für uns.\n\nDadurch gewinnen wir nicht nur eine entscheidende Position im Oberkommando, sondern, was noch wichtiger ist, sein Ansehen wird eine große Anzahl von Beobachteroffizieren beeinflussen und den Weg für unsere endgültige Kontrolle über die Streitkräfte ebnen."
  KOR_kangmi_hongxian.3.a: "Eine entscheidende Allianz"
  KOR_kangmi_hongxian.4.t: "Die Armee widersetzt sich unserem Einfluss"
  KOR_kangmi_hongxian.4.desc: "Unsere Aktivitäten innerhalb der Armee haben bei feindlichen Fraktionen Panik ausgelöst. Innerhalb des Militärs wurde eine umfassende interne Säuberung eingeleitet, die darauf abzielt, unsere Fraktion zu säubern. Offiziere und Soldaten müssen politische Eide leisten; Jeder, der verdächtigt wird, mit uns zu sympathisieren, wird sofort verhaftet.\n\nDas ist nicht nur eine schwere Prüfung für uns, sondern deckt auch völlig die Widersprüche innerhalb der Armee auf. Die Flammen des bewaffneten Kampfes könnten früher entfacht werden, als wir erwartet hatten."
  KOR_kangmi_hongxian.4.a: "Ach..."
  KOR_kangmi_hongxian.5.t: "Die Rückkehr des Yan'an-Geistes"
  KOR_kangmi_hongxian.5.desc: "Während die Freude über die Befreiung allmählich nachlässt, werden die Meinungsunterschiede zwischen den verschiedenen Fraktionen innerhalb der Partei immer deutlicher. In diesem stillen Kampf, der die Zukunft der Nation bestimmte, gewannen die Genossen der „Yan'an-Fraktion“ – diejenigen, die einst weit nach China gereist waren, unter dem Pagodenberg von Yan’an studiert und Seite an Seite mit chinesischen Kameraden auf den antijapanischen Schlachtfeldern gekämpft hatten – letztendlich die Oberhand. Integration des Marxismus mit östlichen Realitäten. Im Vergleich dazu scheinen die Vorschläge anderer Fraktionen etwas realitätsfern zu sein. Mittlerweile hat die Yan'an-Fraktion innerhalb der Partei überwältigende Unterstützung gewonnen. Um das Denken zu vereinheitlichen und alle Kräfte zu vereinen, rufen sie offiziell zu einem Parteitag auf, um einen obersten Führer zu wählen, der in der Lage ist, das neue Korea zu Wohlstand und Stärke zu führen. Über Pjöngjang wird bald eine brandneue Flagge gehisst."
  KOR_kangmi_hongxian.5.a: "General Mu Jeong ist der beste Kandidat."
  KOR_kangmi_hongxian.5.b: "Kim Tu-bong ist beliebter."
  KOR_kangmi_hongxian.6.t: "Die Stimme aus dem Süden"
  KOR_kangmi_hongxian.6.desc: "In der innerparteilichen Debatte über die künftige Ausrichtung des neuen Korea trat eine mächtige Kraft aus dem Süden hervor. Die Genossen der „Südkoreanischen Arbeiterpartei“, die im Untergrundkampf durchgehalten, Arbeiterstreiks und Studentenbewegungen unter dem grausamen weißen Terror der südlichen Halbinsel organisiert haben, haben mit ihrer reichen praktischen Erfahrung und ihrem unbezwingbaren Kampfwillen den Respekt und die Unterstützung der Mehrheit innerhalb der Partei gewonnen Imperialismus im Süden. Sie glauben, dass die dringende Aufgabe darin besteht, die revolutionäre Basis im Süden zu festigen und sich auf die endgültige Verwirklichung einer mächtigen Halbinsel vorzubereiten. Jetzt haben die Genossen der südkoreanischen Arbeiterpartei entscheidenden Einfluss innerhalb der Partei erlangt. Eine Wahl zur Auswahl eines Führers, der in der Lage ist, das gesamte koreanische Volk zur Verwirklichung der großen revolutionären Sache zu führen, steht vor der Tür."
  KOR_kangmi_hongxian.6.a: "Park Heon-young hat mehr Erfahrung."
  KOR_kangmi_hongxian.6.b: "In außergewöhnlichen Zeiten sollte jemand führen, der sich mit militärischen Angelegenheiten auskennt."
  KOR_kangmi_hongxian.7.t: "Die Legende vom Berg Paektu"
  KOR_kangmi_hongxian.7.desc: "Im innerparteilichen Linienkampf über die künftige Ausrichtung des neuen Koreas waren weder die Theoretiker aus Yan'an noch die Untergrundorganisatoren aus dem Süden der endgültige Sieger. Der Sieg gehörte den Kameraden der „Guerilla-Fraktion“, die inmitten der schneebedeckten Gipfel und grenzenlosen Wälder des Paektu-Gebirges die direktesten und brutalsten Schlachten gegen die japanischen Invasoren kämpften.\n\nSie tragen den Rauch des Krieges auf ihren Körpern; Ihre revolutionären Qualifikationen wurden mit Blut und Opfern erworben, was ihnen ein beispielloses Ansehen innerhalb der Partei verschaffte.\n\nUnter diesen kampferprobten Revolutionären war Genosse Kim Il-sungs Brillanz unübertroffen. Als legendärer Kommandeur der nordöstlichen antijapanischen Vereinigten Armee machten ihn sein außergewöhnliches militärisches Talent, sein unerschütterlicher Wille und seine charismatische Führung, die er in den härtesten Jahren an den Tag legte, zum spirituellen Symbol aller Guerillakämpfer. Nun trat er, wie von allen erwartet, aus dieser Gruppe der standhaftesten Revolutionäre hervor und wurde der oberste Führer, der unseren Vormarsch leitete. Eine neue Ära mit ihm als absolutem Kern hat offiziell begonnen."
  KOR_kangmi_hongxian.7.a: "Loyalität!"
  KOR_kangmi_hongxian.8.t: "Das Echo aus dem Kreml"
  KOR_kangmi_hongxian.8.desc: "Im kritischen Moment der Festlegung des neuen Entwicklungspfads Koreas neigte sich das Kräfteverhältnis innerhalb der Partei letztendlich zugunsten der Genossen der „Sowjetfraktion“. Bei diesen Revolutionären handelt es sich größtenteils um ethnische Koreaner, die in jungen Jahren in die Sowjetunion ausgewandert sind. Sie erhielten in der UdSSR eine systematische marxistisch-leninistische Ausbildung, schlossen sich sogar der sowjetischen Roten Armee an und vergossen Blut, um das große sozialistische Mutterland zu verteidigen.\n\nSie haben unzählige Verbindungen zur Sowjetunion und sind fest davon überzeugt, dass das sowjetische Modell der einzig richtige Weg zum Aufbau eines sozialistischen Machtzentrums ist. Gestützt auf den immensen Einfluss des „Älteren Bruders“ hinter ihnen und ihre eigene Beherrschung fortgeschrittener Theorie und Managementerfahrung unterdrückte die sowjetische Fraktion nach und nach die Stimmen anderer Fraktionen im innerparteilichen Kampf.\n\nSie befürworten umfassende Lehren aus der Sowjetunion und nutzen sie als Blaupause für alles, von der Wirtschaftsplanung bis zum militärischen Aufbau. Jetzt haben sie die Führungsmacht der Partei fest im Griff und beginnen mit den Vorbereitungen für die Führungswahl. Ohne Zweifel wird der am Ende Gewählte ein Führer sein, der in der Lage ist, die sowjetische Linie treu umzusetzen und dafür zu sorgen, dass die neugeborene Republik im Gleichschritt mit dem Kreml marschiert."
  KOR_kangmi_hongxian.8.a: "Hŏ Ka-i ist ein geeigneter Kandidat"
  KOR_kangmi_hongxian.8.b: "General Nam Il könnte besser geeignet sein"
  KOR_kangmi_hongxian.9.t: "Einheitsfrontinitiative – Erfolg"
  KOR_kangmi_hongxian.9.desc: "Unsere Einheitsfront-Initiative hat eine positive Resonanz erhalten! Genossen innerhalb der Partei haben die breite Perspektive demonstriert, die Revolutionäre haben sollten. Sie verstehen zutiefst, dass angesichts mächtiger innerer und äußerer Feinde alle internen Differenzen vorübergehend beigelegt werden müssen.\n\nAufgrund des immensen Einflusses des „Älteren Bruders“ hinter ihnen und ihrer eigenen Beherrschung fortgeschrittener Theorie und Managementerfahrung unterdrückte die sowjetische Fraktion nach und nach die Stimmen anderer Fraktionen im innerparteilichen Kampf. Sie befürworten umfassende Lehren aus der Sowjetunion und nutzen diese als Blaupause für alles, von der Wirtschaftsplanung bis zum militärischen Aufbau. Jetzt haben sie die Führungsmacht der Partei fest im Griff und beginnen mit den Vorbereitungen für die Führungswahl. Ohne Zweifel wird der am Ende Gewählte ein Führer sein, der in der Lage ist, die sowjetische Linie treu umzusetzen und dafür zu sorgen, dass die neugeborene Republik im Gleichschritt mit dem Kreml marschiert."
  KOR_kangmi_hongxian.9.a: "Sieg für die Einheit"
  KOR_kangmi_hongxian.10.t: "Einheitsfront-Initiative – Scheitern"
  KOR_kangmi_hongxian.10.desc: "Bedauerlicherweise wurde unsere Initiative zur Vereinigung aller revolutionären Kräfte von den Genossen innerhalb der Partei rundweg abgelehnt. Ihre von engem Fraktionismus geblendete Führung stellt Fraktionsinteressen über die allgemeinen Interessen der Nation und der Revolution.\n\nSie verweigern die Zusammenarbeit und beharren auf ihrer eigenen starren Linie, was zweifellos unser neugeborenes Regime schwächt und Chancen für unsere Feinde schafft. Es sind Risse in der Einheit der Partei aufgetreten. Es scheint, dass vor der Vereinigung gegen äußere Bedrohungen ein interner Kampf zur Beseitigung falscher Ideen und zur Vereinheitlichung des Willens der Partei unumgänglich geworden ist."
  KOR_kangmi_hongxian.10.a: "Der Aufstieg des Fraktionismus"
  KOR_kangmi_hongxian.11.t: "Plenarsitzung des Zentralkomitees der Kommunistischen Partei Koreas"
  KOR_kangmi_hongxian.11.desc: "Die großen Fraktionen innerhalb der Partei sind gleichberechtigt; Keine einzelne Seite kann eine absolute Überlegenheit erreichen. Ein fortgesetzter Kampf würde nur zu verheerenden Spaltungen führen und es den Feinden der Revolution ermöglichen, davon zu profitieren. Um die hart erkämpfte Einheit zu bewahren, haben wir beschlossen, aus historischen Lehren zu lernen, das Risiko von Personenkulten zu vermeiden und ein System der kollektiven Führung zu etablieren.\n\nVertreter aus Yan'an, der Sowjetunion und dem Süden werden gemeinsam das oberste Entscheidungskomitee bilden und die Nation gemeinsam durch demokratische Beratung führen. Dies kann die Entstehung einer individuellen Diktatur verhindern und gleichzeitig die Weisheit aller Seiten bündeln, um sicherzustellen, dass die Nation einen stabilen und umsichtigen Weg einschlägt. Damit beginnt ein großes politisches Experiment."
  KOR_kangmi_hongxian.11.a: "Eine neue Zukunft, eine neue Reise."
  KOR_kangmi_hongxian.12.t: "Die Chollima-Bewegung"
  KOR_kangmi_hongxian.12.desc: "Die Wunden des Krieges sind noch immer nicht verheilt; Die Nation in Trümmern braucht ein Wunder. Um unser Heimatland so schnell wie möglich aus der Asche wieder aufzubauen, erließ der Anführer den großen Aufruf an die gesamte Nation: „Vorwärts mit der Geschwindigkeit von Chollima!“ Chollima, das legendäre Ross, das täglich tausend Li zurücklegt, wird für uns nun zum spirituellen Symbol, um alle Schwierigkeiten zu überwinden und den sozialistischen Aufbau zu beschleunigen.\n\nAusgehend von den Arbeitern des Kangson-Stahlwerks, die den kühnen Slogan „Steigerung der Produktion um 10.000 Tonnen!“ riefen, begann offiziell die landesweite „Chollima-Bewegung“. In den Werkstätten und auf den Feldern kommt es überall zu hitzigen Arbeitskämpfen. Jeder strebt danach, ein „Chollima-Fahrer“ zu sein und mit selbstlosem Enthusiasmus und rasantem Tatendrang Produktionsrekorde zu brechen. Wir sind fest davon überzeugt, dass wir mit diesem revolutionären Geist der Eigenständigkeit den Fünfjahresplan mit Sicherheit früher als geplant abschließen und der Welt den heroischen Geist des koreanischen Volkes vor Augen führen werden!"
  KOR_kangmi_hongxian.12.a: "Mit der Geschwindigkeit von Chollima!"
  KOR_kangmi_hongxian.13.t: "[FROM.GetNameDefCap] schlägt den Technologieaustausch vor"
  KOR_kangmi_hongxian.13.desc: "[FROM.GetNameDefCap] schlägt den Aufbau einer Partnerschaft zum gegenseitigen Erlernen wissenschaftlicher Expertise vor. Während unsere Wissenschaftler weitgehend die Erhöhung der Verfügbarkeit von Wissen befürworten, ist das Militär vorsichtig, wenn es darum geht, Informationen preiszugeben, die letztendlich unserer nationalen Sicherheit schaden könnten."
  KOR_kangmi_hongxian.13.a: "Wissen kennt keine Grenzen"
  KOR_kangmi_hongxian.13.b: "Stattdessen werden wir ihnen wirtschaftliche Hilfe leisten"
  KOR_kangmi_hongxian.14.t: "[FROM.GetNameDefCap] unterstützt den technischen Austausch"
  KOR_kangmi_hongxian.14.desc: "[FROM.GetNameDefCap] hat zugestimmt, an unserem vorgeschlagenen technischen Austauschprogramm teilzunehmen. Mitglieder unserer eigenen wissenschaftlichen Gemeinschaft freuen sich über diese Neuigkeiten und haben bereits Besuche an Universitäten und Fabriken in [FROM.GetNameDef] geplant."
  KOR_kangmi_hongxian.14.a: "Eine für beide Seiten vorteilhafte Vereinbarung!"
  KOR_kangmi_hongxian.15.t: "Billiges Öl"
  KOR_kangmi_hongxian.15.desc: "Heute, am Tumen-Fluss, hat das Eisenbahnnetz unseres Landes mit der Verlegung der letzten Schiene erfolgreich eine historische Verbindung mit der Transsibirischen Eisenbahn der Sowjetunion hergestellt! Dies ist nicht nur eine Eisenbahn; Es ist eine stählerne Ader, die Freundschaft und Stärke vermittelt.\n\nVon nun an kann billiges Öl aus den Baku-Ölfeldern der Sowjetunion kontinuierlich per Zug in unser Land transportiert werden, wobei der lange und unsichere Seeweg umgangen wird. Dieses kostbare „Industrieblut“ wird unsere Fabriken mit endloser Energie versorgen und unsere Panzer und Flugzeuge von logistischen Sorgen befreien. Unsere Beziehungen zu unserem großen sozialistischen Verbündeten waren noch nie so eng. Der Prozess der Industrialisierung Koreas wird definitiv mit Chollima-Geschwindigkeit voranschreiten!"
  KOR_kangmi_hongxian.15.a: "Die Stahlader!"
  KOR_kangmi_hongxian.16.t: "Die Öllieferung dieses Monats"
  KOR_kangmi_hongxian.16.desc: "Aus dem Norden ertönt erneut der bekannte Pfiff. Öltankerzüge, beladen mit der tiefen Freundschaft des sowjetischen Volkes, sind pünktlich angekommen. Die Quote an billigem Öl für diesen Monat ist jetzt eingelagert und verleiht unserem leidenschaftlichen sozialistischen Aufbau neue Vitalität.\n\nDieser stetige Fluss von „Industrieblut“ ist eine lebendige Verkörperung des proletarischen Internationalismus. Dadurch stehen unsere Fabrikschornsteine ​​hoch, unsere Traktoren rasen über die Felder und unser Militär bleibt wachsam. Dank unseres großen Verbündeten wird jede imperialistische Blockade mit ihrer Unterstützung zwecklos sein!"
  KOR_kangmi_hongxian.16.a: "Brüderliche Hilfe"
  KOR_kangmi_hongxian.17.t: "Handelsabkommen für die Region Primorje"
  KOR_kangmi_hongxian.17.desc: "Heute haben unser Land und unser großer Verbündeter, die Sowjetunion, offiziell ein historisches Grenzhandelsabkommen in der Region Khasan unterzeichnet. Dieses Abkommen wird den wirtschaftlichen Austausch und die Entwicklung in den Grenzgebieten beider Nationen erheblich fördern und ehemalige militärische Außenposten in wohlhabende Handelszentren verwandeln.\n\nGemäß der Vereinbarung werden wir überschüssige landwirtschaftliche Produkte, Mineralien und Leichtindustriegüter im Austausch gegen dringend benötigte Industriemaschinen, Düngemittel und fortschrittliche Technologie in die Sowjetunion exportieren. Dies kann die Mängel unseres Industriesystems wirksam ausgleichen, die wirtschaftliche Entwicklung beschleunigen und als weiterer Beweis für die unzerbrechliche brüderliche Freundschaft zwischen unseren beiden Ländern dienen. Durch gegenseitigen Austausch und enge Zusammenarbeit soll die Wirtschaftskraft des gesamten sozialistischen Lagers weiter gestärkt werden."
  KOR_kangmi_hongxian.17.a: "Wohlstand an der Grenze"
  KOR_kangmi_hongxian.18.t: "Sowjetische Experten helfen Korea"
  KOR_kangmi_hongxian.18.desc: "Heute traf die erste Gruppe sowjetischer Fachberater in Pjöngjang ein. Sie bringen fortgeschrittene wissenschaftliche Kenntnisse, wertvolle Industriepläne und umfassende Managementerfahrung mit. Dabei handelt es sich nicht nur um technische Hilfe; Es ist eine glorreiche Manifestation des proletarischen internationalistischen Geistes.\n\nDiese Genossen aus der brüderlichen Nation werden in unsere Fabriken, Minen und Labors eintauchen und uns persönlich dabei helfen, unser eigenes technisches Talent zu fördern und die größten Probleme auf unserem Weg zur Industrialisierung zu lösen. Unter ihrer Führung werden viele technologische Barrieren überwunden, die wir bisher nicht überwinden konnten. Mit dieser Weisheit aus dem Norden wird unser Tempo, mit dem wir an die fortgeschrittenen Niveaus der Welt herankommen, sicherlich deutlich schneller werden!"
  KOR_kangmi_hongxian.18.a: "Weisheit aus dem Norden!"
  KOR_kangmi_hongxian.19.t: "Der Spionagefall Park Heon-young und Lee Seung-yeop"
  KOR_kangmi_hongxian.19.desc: "Während die Flammen des Krieges vorübergehend nachlassen, tritt unsere junge Republik in eine Phase der inneren Konsolidierung ein. Allerdings hegen nicht alle Genossen unter dem Banner der Einheit einen gleichermaßen reinen Glauben. Genosse Park Heon-young, der lange Zeit die kommunistische Bewegung des Südens anführte, und seine Anhänger genießen im Inland ein enormes Ansehen, aber diese Truppe hat auch die Wachsamkeit erhöht.\n\nJetzt sind schockierende Anschuldigungen aufgetaucht: Mehrere hochrangige Kader unter der Führung von Lee Seung-yeop werden beschuldigt, amerikanische Spione zu sein, die sich verschworen haben, um unser hart erkämpftes Regime zu untergraben. Park Heon-young, dieser altgediente Revolutionär, wird ebenfalls in das Zentrum dieses Sturms hineingezogen. Handelt es sich hier um eine imperialistische Verschwörung und Infiltration oder um eine brutale Säuberung, die zur Konsolidierung des Führungskerns eingeleitet wurde? Ungeachtet der Wahrheit hat intern ein stiller Krieg begonnen. Wir müssen eine Wahl treffen; es wird den zukünftigen Weg der Republik und das Schicksal unzähliger Genossen bestimmen."
  KOR_kangmi_hongxian.19.a: "Ihre Verbrechen sind zu zahlreich, um sie aufzuzeichnen; Sie müssen ohne Nachsicht hart bestraft werden."
  KOR_kangmi_hongxian.20.t: "Die Sonne geht unter"
  KOR_kangmi_hongxian.20.desc: "Heute ist der Himmel der Republik in beispiellose Dunkelheit getaucht. Unser großer Anführer, der Vater der Republik, der stets siegreiche und eiserne Befehlshaber – Marschall Kim Il-sung – ist plötzlich in einer abscheulichen Verschwörung gestorben. Die Nachricht erschütterte Pjöngjang wie ein Donnerschlag; Die gesamte Nation ist in immense Trauer und Verwirrung gestürzt.\n\nWährend die Menschen um den Verlust ihrer Sonne trauern, ist an der Spitze ein gefährliches Machtvakuum entstanden. Zu seinen Lebzeiten balancierte der Anführer mit seiner obersten Autorität verschiedene Parteifraktionen aus, doch nun ist dieser alleinige Zügel gebrochen. Die Guerilla-Fraktion, die Yan'an-Fraktion, die Sowjet-Fraktion ... versteckte Ambitionen und Linienunterschiede regnen in diesem Machtvakuum auf. Wohin wird ein Korea ohne Kim Il-sung führen? Das Schicksal der Republik hängt am seidenen Faden."
  KOR_kangmi_hongxian.20.a: "Ihre Verbrechen sind zu zahlreich, um sie aufzuzeichnen; Sie müssen ohne Nachsicht hart bestraft werden."
  KOR_kangmi_hongxian.21.t: "Der Moskauer Prozess in Pjöngjang"
  KOR_kangmi_hongxian.21.desc: "[GetKORPingrangDeMosikeShenpan]"
  KOR_pingrangde_mosikeshenpan_event_text: "Die politischen Unruhen im August haben nachgelassen, aber diejenigen, die die Autorität des Führers in Frage gestellt haben, werden nicht so leicht vergessen werden. Jene „Genossen“, die auf dem Zentralplenum Zwietracht äußerten, werden nun als gefährliche „parteifeindliche Fraktionselemente“ gebrandmarkt. In Pjöngjang findet ein politischer Prozess statt, der Stalins große Säuberung nachahmt.\n\nDebatten und Beweise vor Gericht sind nicht mehr wichtig; Das Urteil steht bereits fest. Kim Tu-bong, Pak Chang-ok und andere prominente Persönlichkeiten der „Yan'an-Fraktion“ und der „Sowjetfraktion“ werden beschuldigt, Agenten ausländischer Kräfte zu sein, die versuchen, unsere Revolution zu untergraben. Ihre Säuberung wird schnell und gründlich erfolgen.\n\nDieser Prozess soll nicht nur Dissidenten eliminieren, sondern auch allen Kräften im In- und Ausland verkünden: Jede Herausforderung an die alleinige führende Ideologie wird mit eiserner Faust rücksichtslos niedergeschlagen. Mit diesem Prozess wird eine neue, stark zentralisierte Ära beginnen."
  KOR_pingrangde_mosikeshenpan_event1_text: "Die Kräfte rund um die „Sowjetfraktion“ haben unter dem Banner der „Rache des Führers“ ihre Speere auf ihre Hauptgegner innerhalb der Partei gerichtet – die „Yan'an-Fraktion“ und die führerlose „Guerilla-Fraktion“. Sie behaupten, das Attentat sei eine Verschwörung dieser beiden Fraktionen gewesen, um die Obermacht an sich zu reißen. Eine brutale interne Säuberung hat begonnen.\n\nOhne die Zurückhaltung des Anführers ist das Biest des Fraktionskampfes vollständig entfesselt. Wohin wird Koreas Zukunft führen?"
  KOR_kangmi_hongxian.21.a: "Alle Verräter werden den höchsten Preis zahlen."
  KOR_kangmi_hongxian.22.t: "Gründung der 105. Garde-Panzerdivision"
  KOR_kangmi_hongxian.22.desc: "Heute ist ein ruhmreicher Name in das Banner unserer Armee eingraviert: Die „Garde Seoul Ryu Gyeong-soo 105. Panzerdivision“ ist offiziell gegründet! Dieser Einheit wird die höchste Ehre zuteil, als erste im Befreiungskrieg in Seoul einmarschiert zu sein. Benannt nach seinem verdienstvollen Kommandeur, Genosse Ryu Gyeong-soo, und mit dem Titel „Wächter“ ausgezeichnet, symbolisiert es seine unübertroffene Kampfkraft.\n\nSie sind die eiserne Faust unserer Armee, die unaufhaltsame Stahlflut, die durch die feindlichen Linien rast. Diese mit den neuesten Panzern ausgestattete Elitedivision wird als unsere schärfste Speerspitze dienen und jederzeit bereit sein, jeden Feind zu vernichten, der es wagt, unseren Vormarsch zu blockieren, und so neue und größere Leistungen für die endgültige Vereinigung des Mutterlandes zu vollbringen!"
  KOR_kangmi_hongxian.22.a: "Der Ruhm der Garde!"
  KOR_kangmi_hongxian.23.t: "Sowjetische Hilfsflugzeuge treffen ein"
  KOR_kangmi_hongxian.23.desc: "Heute landete auf dem Sunan-Flughafen in Pjöngjang, begleitet von gewaltigem Getöse, die erste Ladung Kampfflugzeuge mit Unterstützung unseres großen Verbündeten, der Sowjetunion, stabil. Diese brandneuen Flugzeuge glitzern in metallischem Glanz; Die leuchtend roten Sterne auf ihren Flügeln symbolisieren die unzerbrechliche Freundschaft des sozialistischen Lagers.\n\nDas sind nicht nur ein paar Flugzeuge; Dabei handelt es sich um vom sowjetischen Volk geschickte „Stahlflügel“, die unserer jungen Volksluftwaffe einen qualitativen Sprung ermöglichen. Unsere Piloten werden in diesen hervorragenden Kampfadlern durch den blauen Himmel unseres Mutterlandes fliegen und eine Chinesische Mauer aus der Luft errichten, die kein imperialistischer Aggressor durchbrechen kann. Ab heute ist der Luftraum der Republik nicht mehr der Gnade anderer ausgeliefert!"
  KOR_kangmi_hongxian.23.a: "Ausgezeichnet!"
  KOR_kangmi_hongxian.24.t: "[FROM.GetNameDefCap] schürt kommunistische Stimmung"
  KOR_kangmi_hongxian.24.desc: "Wir haben festgestellt, dass es in unserem Land [FROM.GetAdjective]-Organisationen gibt, die kommunistische Ideen verbreiten. Während dies an sich harmlos erscheint, erscheinen einige der Propagandainhalte ziemlich revolutionär. Immer häufiger wird berichtet, dass Arbeitnehmer dazu ermutigt werden, sich zu organisieren und zusammenzuschließen. In Kombination mit der jüngsten Geschichte können wir nicht sicher sein, ob es sich hierbei um eine komplexe Verschwörung der [FROM.GetAdjective]-Führung handelt, deren ultimatives Ziel darin besteht, uns zu integrieren."
  KOR_kangmi_hongxian.24.a: "Verabscheuungswürdige Bolschewiki"
  KOR_kangmi_hongxian.25.t: "[FROM.GetNameDefCap] lädt uns ein, seiner Allianz beizutreten"
  KOR_kangmi_hongxian.25.desc: "Kürzlich traf eine Delegation aus der Ferne in der Hauptstadt unseres Landes ein und bat um eine Audienz bei [ROOT.GetLeader]. Sie behaupten, von [FROM.GetNameDef] zu sein und möchten eine Allianz mit uns eingehen. Sollen wir akzeptieren?"
  KOR_kangmi_hongxian.25.a: "Einheit macht uns stärker"
  KOR_kangmi_hongxian.26.t: "[FROM.GetNameDefCap] nimmt unsere Einladung an"
  KOR_kangmi_hongxian.26.desc: "[FROM.GetLeader] hat unseren Bündnisvorschlag gerne angenommen und mit der Integration in unseren Einflussbereich begonnen. Ein Tag, der es wert ist, gefeiert zu werden!"
  KOR_kangmi_hongxian.26.a: "Eine gemeinsame Vision für die Zukunft"
  KOR_kangmi_hongxian.27.t: "Diskussion über ein gemeinsames Nation-Building-Programm"
  KOR_kangmi_hongxian.27.desc: "Die langen Jahre des Kampfes gegen den japanischen Imperialismus haben das Schicksal der chinesischen und koreanischen Kommunisten eng miteinander verbunden. Unsere Kameraden kämpften einst Seite an Seite mit chinesischen Kameraden inmitten der weißen Berge und schwarzen Gewässer und ihr Blut festigte eine unzerbrechliche Freundschaft.\n\nJetzt stehen wir beide vor der historischen Aufgabe, neue Nationen aufzubauen und gemeinsame Feinde zu bekämpfen. Allein zu kämpfen macht einen verwundbar; Einig zu sein macht einen uneinnehmbar. Deshalb haben wir unserer brüderlichen Kommunistischen Partei Chinas offiziell vorgeschlagen, Gespräche auf hoher Ebene abzuhalten, die darauf abzielen, ein gemeinsames Programm zum Aufbau einer Nation zu schaffen und unsere jeweiligen Pläne für die wirtschaftliche, politische und sogar militärische Entwicklung zu koordinieren.\n\nWir glauben, dass der Aufbau einer soliden sozialistischen Chinesischen Mauer im Osten die lauteste Reaktion auf die Imperialisten sein wird. Wir warten mit großer Hoffnung auf die Antwort Pekings."
  KOR_kangmi_hongxian.27.a: "Eine Große Mauer im Osten..."
  KOR_kangmi_hongxian.28.t: "[FROM.GetNameDefCap] nimmt unseren Vorschlag an"
  KOR_kangmi_hongxian.28.desc: "Unser Vorschlag an die brüderliche Kommunistische Partei Chinas, der darauf abzielt, Programme zum Aufbau einer Nation zu koordinieren, hat bei Yan'an eine begeisterte Resonanz gefunden! Die chinesischen Genossen antworteten und erklärten, dass China und Korea „durch Berge und Flüsse verbunden sind und eine so enge Beziehung verbindet wie Lippen und Zähne“. Im vergangenen Antijapanischen Krieg kämpften unsere Soldaten Seite an Seite inmitten der weißen Berge und des schwarzen Wassers und schmiedeten eine blutbesiegelte Freundschaft.\n\nSie sind sich voll und ganz darin einig, dass unsere beiden neugeborenen sozialistischen Nationen angesichts der gegenwärtigen Situation immer schwerwiegenderer imperialistischer Bedrohungen koordinierte Schritte in Politik, Wirtschaft und sogar militärischen Angelegenheiten unternehmen müssen. Ein gemeinsames Nation-Building-Programm wird für uns eine mächtige Waffe im gemeinsamen Kampf gegen gemeinsame Feinde sein. Bald werden wir gemeinsame Komitees gründen, um revolutionäre Erfahrungen und Baupläne auszutauschen. Dies markiert, dass die unzerbrechliche Allianz zwischen China und Korea in eine neue, übergeordnete Phase eingetreten ist."
  KOR_kangmi_hongxian.28.a: "Hand in Hand vorankommen!"
  KOR_kangmi_hongxian.29.t: "[FROM.GetNameDefCap] lehnt unseren Vorschlag ab"
  KOR_kangmi_hongxian.29.desc: "Unser Vorschlag für ein gemeinsames Nation-Building-Programm an die Kommunistische Partei Chinas erhielt eine vorsichtige und höfliche Antwort. Peking bekräftigte die feste revolutionäre Freundschaft zwischen unseren beiden Nationen, wies aber auch darauf hin, dass China gerade ein Jahrhundert voller Krieg und Chaos beendet habe, sein Territorium riesig und seine innenpolitische Situation äußerst komplex sei. Ihre derzeitige Hauptaufgabe besteht darin, sich auf die Wiederherstellung ihrer eigenen Produktion und Stabilität zu konzentrieren.\n\nSie glauben, dass jedes Land den Weg der Revolution und des Aufbaus erkunden muss, der für es entsprechend seinen spezifischen nationalen Bedingungen am besten geeignet ist. Auch wenn sie mit uns kein vollständig synchronisiertes Programm zum Aufbau der Nation formulieren können, versprechen sie, dass sich die brüderliche Freundschaft zwischen unseren beiden Nationen nicht ändern wird und dass sie bei Bedarf im Rahmen ihrer Möglichkeiten weiterhin Hilfe leisten werden.\n\nObwohl diese Antwort einiges Bedauern hervorruft, erinnert sie uns auch daran, dass Unabhängigkeit und Eigenständigkeit möglicherweise die zuverlässigste Richtung für das neue Korea sind."
  KOR_kangmi_hongxian.29.a: "So sei es..."
  KOR_kangmi_hongxian.30.t: "Vorschlag zur Einigung des Fernen Ostens"
  KOR_kangmi_hongxian.30.desc: "Vertreter von [FROM.GetNameDef] haben uns einen mutigen Vorschlag zur Neuordnung des Fernen Ostens gemacht. Dies erfordert, dass wir einige an [FROM.GetAdjective] angrenzende Regionen abtreten, um eine neue sozialistische Föderation unter der Leitung von [FROM.Capital.GetCapitalVictoryPointName] zu gründen. Dies könnte einen mächtigen Pufferstaat in der Region schaffen, der unsere Verteidigungslast hier verringert und es uns ermöglicht, unser Militär anderswo einzusetzen."
  KOR_kangmi_hongxian.30.a: "Ein interessanter Vorschlag"
  KOR_kangmi_hongxian.30.b: "Wir haben andere Pläne für die Region"
  KOR_kangmi_hongxian.31.t: "[FROM.GetName] nimmt den Vorschlag an"
  KOR_kangmi_hongxian.31.desc: "[FROM.GetNameDefCap] hat unserem Vorschlag zugestimmt, den Fernen Osten in eine einzige politische Einheit zu integrieren. Es scheint, dass unser Volk nach Jahrzehnten der Instabilität im Begriff ist, eine neue Ära einzuläuten."
  KOR_kangmi_hongxian.31.a: "Ausgezeichnet!"
  KOR_kangmi_hongxian.32.t: "[FROM.GetName] lehnt den Vorschlag ab"
  KOR_kangmi_hongxian.32.desc: "[FROM.GetNameDefCap] hat unseren Vorschlag, den Fernen Osten in eine einzige politische Einheit zu integrieren, abgelehnt. Obwohl dies ein großer Rückschlag ist, ist der Traum noch nicht zerplatzt. Wir müssen nur auf den richtigen Moment warten."
  KOR_kangmi_hongxian.32.a: "Sie können uns nicht für immer aufhalten"
  KOR_kangmi_hongxian.33.t: "Der Vorschlag der 4. Plenarsitzung des 15. Zentralkomitees"
  KOR_kangmi_hongxian.33.desc: "Während die gesamte Partei und Nation den sozialistischen Aufbau anstrebt, regt sich in der Partei still und leise eine gefährliche Unterströmung. Elemente der „Kapsan-Fraktion“, angeführt von Pak Kum-chol und Lee Hyo-sun, betreiben unter dem Banner der „alten Genossen“ einen grassierenden Fraktionismus und versuchen, die Partei in ihr eigenes „unabhängiges Königreich“ zu verwandeln, indem sie die absolute Autorität des Führers und die einheitliche Führung der Partei ernsthaft in Frage stellen Priorisierung der Entwicklung der Verteidigungsindustrie und Versuch, unsere revolutionären Streitkräfte zu schwächen. Diese parteifeindliche, konterrevolutionäre Verschwörung ist der schlimmste Verrat an unserer Sache! Jetzt hat ein interner Kampf begonnen, der darauf abzielt, dieses giftige Unkraut gründlich auszurotten und unsere revolutionären Reihen zu reinigen. Jede Gnade gegenüber diesen Verschwörern ist ein Verbrechen gegen die Revolution!"
  KOR_kangmi_hongxian.33.a: "Vernichten Sie das giftige Unkraut!"

  ###################################### Democracy ############################################################
  KOR_minzhu_hongxian.1.t: "§C$KOR_Kim_Koo$§! Gewählt"
  KOR_minzhu_hongxian.1.desc: "Auf der politischen Konsultationskonferenz, die über das Schicksal der Nation entschied, erlangte schließlich ein Name, der ein Jahrhundert Koreas Unabhängigkeitskampf symbolisierte, den Respekt aller: Baekbeom §Y$KOR_Kim_Koo$§! wurde zum ersten Präsidenten der neuen Republik Korea gewählt.\n\nSein ganzes Leben war der Sache der Befreiung gewidmet. Seine Wahl zum letzten Hüter der Provisorischen Regierung der Republik Korea stellt das Erbe der Geschichte und die Kontinuität der Legitimität dar. In seiner Siegesrede bekräftigte §Y$KOR_Kim_Koo$§!, dass sein einziger Wunsch darin besteht, eine „schöne“ vereinte Nation frei von jeglicher Einmischung von außen zu errichten. Er weigert sich, jede Form der Spaltung anzuerkennen und gelobt, das gesamte Volk in seinem Streben nach einem vollständigen und mächtigen Korea anzuführen. Eine Regierung, deren absoluter Kern der Nationalismus ist und die sich keiner äußeren Kraft beugt, steht vor der Geburt."
  KOR_minzhu_hongxian.1.a: "Das Leuchtfeuer der Nation!"
  KOR_minzhu_hongxian.2.t: "§C$KOR_Cho_Bong_am$§! Gewählt"
  KOR_minzhu_hongxian.2.desc: "Nach mehreren Runden intensiver politischer Konsultationen wurde §Y$KOR_Cho_Bong_am$§!, der die Kräfte der Reform und des Fortschritts vertrat, schließlich erfolgreich der erste Präsident der Republik. Dies markiert den Beginn einer völlig neuen Ära.\n\nAnders als traditionelle linke oder rechte Politiker fanden §Y$KOR_Cho_Bong_am$§!s pragmatische Landreform- und Sozialhilfevorschläge breite Unterstützung bei Landwirten und den Unterschichten. Im gegenwärtigen Klima des Fraktionismus und der scharfen Widersprüche gilt sein Eintreten für eine „friedliche Vereinigung“ und eine „reformistische Politik“ als die beste Lösung, um soziale Gräben zu überbrücken und alle Bürger zu vereinen. Er verspricht, dass die neue Regierung sofort soziale Reformen einleiten wird, um eine gleichberechtigte Gesellschaft zu schaffen, in der „diejenigen, die Landwirtschaft betreiben, Land haben und diejenigen, die arbeiten, Nahrung haben“. Vor uns liegt ein neuer Weg, der sich von der alten Ära unterscheidet."
  KOR_minzhu_hongxian.2.a: "Der Bannerträger des Fortschritts!"
  KOR_minzhu_hongxian.3.t: "§C$KOR_syngman_rhee$§! Gewählt"
  KOR_minzhu_hongxian.3.desc: "Nach einer politischen Beratungskonferenz voller Kontroversen und Hinterzimmerdealereien ging §Y$KOR_syngman_rhee$§! schließlich als endgültiger Sieger hervor und wurde zum ersten Präsidenten der Republik Korea gewählt. Indem er seine guten Verbindungen in den Vereinigten Staaten und seine unerschütterliche antikommunistische Haltung nutzte, gelang es ihm, entscheidende Unterstützung von außen zu gewinnen und diese zur Unterdrückung aller Konkurrenten zu nutzen. In seiner Antrittsrede machte er deutlich, dass die vorrangige nationale Politik der neuen Regierung „Antikommunismus und Verteidigung gegen den Kommunismus“ sein wird, mit dem Ziel, ein starkes kapitalistisches Bollwerk zu errichten und ein engstes Bündnis mit den Vereinigten Staaten zu bilden. Eine politische Säuberung mit dem Ziel, alle „roten Elemente“ und linken Sympathisanten im Land zu eliminieren, ist unvermeidlich. Die Ära der Strongman-Politik ist offiziell angebrochen."
  KOR_minzhu_hongxian.3.a: "Der Aufstieg des starken Mannes."
  KOR_minzhu_hongxian.4.t: "Aufstand auf der Insel Jeju"
  KOR_minzhu_hongxian.4.desc: "Während wir uns bemühen, die Herrschaft im Süden zu festigen, hat die als „Insel des Friedens“ bekannte Insel Jeju Flammen der Rebellion entfacht. Von der südkoreanischen Arbeiterpartei heimlich organisiert und angestiftet, haben groß angelegte Streiks und Demonstrationen gegen „getrennte Wahlen“ und die Forderung nach einer Nord-Süd-Vereinigung die gesamte Insel erfasst.\n\nFabriken werden geschlossen, Schulen streiken und ganz Jeju ist gelähmt. Linke und ihre Sympathisanten haben die Kontrolle über einige Gebiete übernommen und liefern sich ständig bewaffnete Zusammenstöße mit unserer Polizei und rechten Jugendgruppen, die sie unterdrücken sollen. Dies ist nicht nur ein einfacher Streik; Es ist eine offene Herausforderung für unsere Nation-Building-Politik. Wenn nicht sofort die entschiedensten und härtesten Maßnahmen ergriffen werden, um diese Flammen zu löschen, könnten sie sich auf den gesamten Süden ausbreiten und unser entstehendes Regime völlig erschüttern."
  KOR_minzhu_hongxian.4.a: "Mit Gewalt unterdrücken!"
  KOR_minzhu_hongxian.4.b: "Vielleicht sollten wir auf ihre Forderungen hören ..."
  KOR_minzhu_hongxian.5.t: "Die Rebellenflagge in Yeosu"
  KOR_minzhu_hongxian.5.desc: "Gerade als wir Truppen versammelten, um den Aufstand auf der Insel Jeju vollständig zu unterdrücken, trafen katastrophale Nachrichten aus dem Süden ein – das 14. Regiment der Verteidigungsgarde, das in Yeosu stationiert war, lehnte den Befehl ab, zum Unterdrückungsdienst nach Jeju zu gehen! und startete einen bewaffneten Aufstand. Sie töteten schnell hochrangige Offiziere, die nicht kooperieren wollten, übernahmen die Kontrolle über ganz Yeosu und breiteten sich auf das benachbarte Suncheon aus. Die Rebellen eröffneten Gefängnisse, ließen linke politische Gefangene frei, verteilten Waffen an die Bevölkerung und versuchten, „befreite Zonen“ zu errichten. Dabei handelt es sich nicht länger um bloße Insubordination, sondern um einen bewaffneten Aufstand mit dem Ziel, unsere entstehende Republik zu stürzen! Wir müssen sofort alle Kräfte mobilisieren und es mit donnernder Gewalt gründlich zerschlagen; Andernfalls könnte der gesamte Süden in ein Meer aus roten Flammen fallen."
  KOR_minzhu_hongxian.5.a: "Das ist Rebellion!"
  KOR_minzhu_hongxian.5.b: "Teilen und bestechen Sie diese Beamten."
  KOR_minzhu_hongxian.6.t: "[FROM.GetNameDefCap] beantragt Gebietsgarantie"
  KOR_minzhu_hongxian.6.desc: "Trotz unserer Unterstützung und der relativ sicheren Umgebung der Bergregionen der Halbinsel fordert [FROM.GetNameDef] weiterhin unser Engagement, im Konfliktfall Schutz zu bieten. Es ist unklar, ob sie eine weitere koloniale Invasion aus dem Süden durch [JAP.GetNameDefCap] fürchten oder sich Sorgen über kommunistische Kräfte von jenseits der Nordgrenze machen, aber wir müssen das Risiko abwägen, in solche Konflikte hineingezogen zu werden."
  KOR_minzhu_hongxian.6.a: "Lassen Sie sie zum Brückenkopf im Fernen Osten werden!"
  KOR_minzhu_hongxian.6.b: "Das ist zu riskant!"
  KOR_minzhu_hongxian.7.t: "Gegenseitiger Verteidigungsvertrag zwischen Südkorea und den USA"
  KOR_minzhu_hongxian.7.desc: "Angesichts der wachsenden militärischen Bedrohung durch das kommunistische Regime im Norden und der Expansionsambitionen des gesamten Roten Blocks wissen wir nur zu gut, dass wir uns nur auf unsere eigene Stärke verlassen können, um die langfristige Sicherheit der Nation nicht zu gewährleisten. Heute haben wir in Washington offiziell den „Vertrag über gegenseitige Verteidigung zwischen Südkorea und den USA“ mit unserem mächtigsten Verbündeten, den Vereinigten Staaten von Amerika, unterzeichnet.\n\nDieser Vertrag erklärt feierlich in rechtlicher Form: Jeder bewaffnete Angriff von außen gegen die Republik Korea wird als Bedrohung für den Frieden und die Sicherheit der Vereinigten Staaten angesehen. Die Vereinigten Staaten werden im Einklang mit ihren verfassungsmäßigen Verfahren handeln, um der gemeinsamen Gefahr zu begegnen. Dieses Versprechen bietet uns die ultimative Sicherheitsgarantie und stellt eine unüberwindbare Barriere für die Kommunisten dar. Von nun an wird die Republik Korea als stabilster Außenposten der freien Welt auf dem asiatischen Kontinent Seite an Seite mit den Vereinigten Staaten stehen und gemeinsam die von uns geschätzten Werte verteidigen."
  KOR_minzhu_hongxian.7.a: "Die Garantie der freien Welt!"
  KOR_minzhu_hongxian.8.a: "Geben Sie ihnen überschüssige Hilfe"
  KOR_minzhu_hongxian.8.b: "Wir können nichts bereitstellen"
  KOR_minzhu_hongxian.9.a: "Ausgezeichnet, wir werden es gut nutzen."
  KOR_minzhu_hongxian.10.t: "Offensive im Juni"
  KOR_minzhu_hongxian.10.desc: "Die Einrichtung des „Sonderausschusses zur Untersuchung antinationaler Aktivitäten“ (Antinationalausschuss) sollte ursprünglich projapanische Elemente aus der japanischen Besatzungszeit liquidieren und die nationale Gerechtigkeit aufrechterhalten. Als sich die Ermittlungen jedoch verschärften, wurden viele Persönlichkeiten, die Schlüsselpositionen als Polizisten, Militäroffiziere und Bürokraten in der neuen Regierung innehatten, prominent aufgeführt. Sie zu liquidieren käme einer Erschütterung unseres Regimes in seinen Grundfesten gleich.\n\nWir können diesen Akt der Selbstzerstörung um der „Vergangenheit“ willen nicht länger dulden. Mit der stillschweigenden Zustimmung von Präsident $KOR_syngman_rhee$ starteten die Polizeikräfte die „Juni-Offensive“, durchsuchten die Büros des Antinationalen Komitees, lösten seine untergeordneten Spezialeinheiten der Polizei gewaltsam auf und verhafteten mehrere wichtige Mitglieder. Damit endete die Debatte über die Liquidierung der Geschichte. Es wurde ein unmissverständliches Signal gesendet: Praktische Stabilität und energischer Antikommunismus überwiegen das Streben nach historischer Gerechtigkeit. Auf diese aggressive Weise wurde das Fundament der herrschenden Macht gründlich gefestigt."
  KOR_minzhu_hongxian.10.a: "Loyalität!"
  KOR_minzhu_hongxian.11.t: "§Y$KOR_Song_Zhenyu$§! Ermordet"
  KOR_minzhu_hongxian.11.desc: "Im kalten Morgenwind kostete ein Schuss das Leben eines hoch angesehenen nationalistischen Führers – Mr. Song Jin-woo, Chefsekretär der Koreanischen Demokratischen Partei, wurde ermordet. \n\nAls gemäßigter Mann mit hohem Ansehen im rechten Lager plädierte Song Jin-woo für eine vorsichtigere Strategie zur Staatsbildung und versuchte, verschiedene Kräfte zu vereinen. Dies machte ihn zu einem wichtigen Konkurrenten von $KOR_syngman_rhee$ auf seinem Weg zur Eroberung der obersten Macht. Obwohl der Attentäter einer ultrarechten Gruppe angehörte, deuten alle Anzeichen und Gerüchte darauf hin, dass der Drahtzieher dieses abscheulichen Attentats kein anderer als das Lager von $KOR_syngman_rhee$ war, der darauf bedacht war, jede Alternative zu beseitigen, die seine Bildung einer separaten Südregierung behindern könnte.\n\nDurch seinen Sturz wurden gemäßigte Stimmen innerhalb des rechten Lagers erheblich geschwächt, und der Spielraum für Kompromisse auf der politischen Bühne wurde noch enger. Der Weg zur Herrschaft des starken Mannes scheint ein weiteres Hindernis aus dem Weg geräumt zu haben."
  KOR_minzhu_hongxian.11.a: "Ein Konkurrent weniger..."
  KOR_minzhu_hongxian.12.t: "Zwischenfall im Parlament der südkoreanischen Arbeiterpartei"
  KOR_minzhu_hongxian.12.desc: "Eine offene politische Debatte konnte die abweichenden Stimmen innerhalb der Nationalversammlung nicht länger unterdrücken. Linke Gesetzgeber, angeführt von der südkoreanischen Arbeiterpartei und unter dem Deckmantel der Legalität, wurden zu den gefährlichsten Stolpersteinen für die Konsolidierung unseres Regimes. Jetzt ist es an der Zeit, sie ein für alle Mal zu lösen.\n\nDurch sorgfältige Planung ist es uns gelungen, den „Vorfall im Parlament der südkoreanischen Arbeiterpartei“ zu fabrizieren und diese Gesetzgeber als einen Spionagering darzustellen, der Anweisungen aus dem Norden erhält und den Staat stürzen will. Die Polizei hat Maßnahmen ergriffen und sie festgenommen. Von nun an wird es in der Nationalversammlung keine legalen kommunistischen Sympathisanten mehr geben, und der Weg zur absoluten Macht ist vollständig frei."
  KOR_minzhu_hongxian.12.a: "Loyalität!"
  KOR_minzhu_hongxian.13.t: "[FROM.GetNameDefCap] fordert Entschädigung für Kolonialgeschichte"
  KOR_minzhu_hongxian.13.desc: "Das gerade in Seoul etablierte neue Regime hat uns eine formelle diplomatische Note geschickt. Sie fordern eine umfassende Entschädigung für die „Besatzungszeit“ auf der Halbinsel. Die Liste ist lang und die Menge astronomisch.\n\nDiese Forderung hat im Landtag für Aufruhr gesorgt. Hardliner betrachten es als Erpressung und Demütigung durch sie und plädieren für eine völlige Ablehnung; Während Bürokraten im Außenministerium befürchten, dass dies die andere Seite völlig verärgern und den amerikanischen Unmut erregen wird, hat Washington wiederholt „vorgeschlagen“, dass wir mit den Nachbarländern „auskommen“. Unsere Wirtschaft liegt durch den Krieg bereits in Trümmern, die Staatskasse ist leer und wir können uns diese riesige Summe einfach nicht leisten. Aber hier geht es nicht nur um Geld; Es handelt sich um eine wichtige Entscheidung hinsichtlich des nationalen Erscheinungsbildes und der künftigen diplomatischen Ausrichtung. Sollten wir demütigend annehmen oder energisch ablehnen? Wie sollen wir auf diesen Gesetzentwurf aus der Vergangenheit reagieren?"
  KOR_minzhu_hongxian.13.a: "Es kann nur so sein..."
  KOR_minzhu_hongxian.13.b: "Für wen halten sie sich?"
  KOR_minzhu_hongxian.14.t: "[FROM.GetNameDefCap] stimmt der Entschädigung zu"
  KOR_minzhu_hongxian.14.desc: "Entgegen vielen Erwartungen stimmte die japanische Regierung unter großem internationalen öffentlichen Druck letztendlich unserem Schadensersatzanspruch zu. Obwohl Höhe und Art der Entschädigung in mehreren harten Runden ausgehandelt wurden, ist dies zweifellos ein großer diplomatischer Sieg.\n\nDie erste Lieferung von Reparationen und Industrieausrüstung wurde versandt. Dies wird unserer schwächelnden Wirtschaft einen starken Aufschwung verleihen und den Wiederaufbau nach dem Krieg erheblich beschleunigen. Noch wichtiger ist, dass dieser erfolgreiche Anspruch das Ansehen der gegenwärtigen Regierung erheblich gestärkt hat und der Welt unsere Entschlossenheit und Fähigkeit unter Beweis gestellt hat, nationale Interessen und nationale Würde zu schützen. Die nationale Gerechtigkeit wurde bis zu einem gewissen Grad gewahrt."
  KOR_minzhu_hongxian.14.a: "Ein unerwarteter Kompromiss."
  KOR_minzhu_hongxian.15.t: "[FROM.GetNameDefCap] lehnt Entschädigung ab"
  KOR_minzhu_hongxian.15.desc: "Unsere berechtigte Forderung nach Entschädigung aus Japan wurde von Tokio mit einer arroganten und reuelosen Ablehnung beantwortet. In ihrer Antwort umgingen sie nicht nur die Höhe der Entschädigung, sondern deuteten sogar an, dass ihre Kolonialherrschaft auch eine „Modernisierung“ mit sich brachte, und ließen keinerlei Rücksicht auf ihre Verbrechen erkennen.\n\nDiese schamlose Antwort entfachte völlige landesweite Wut. In Großstädten kam es zu groß angelegten antijapanischen Demonstrationen. Das Ansehen der Regierung litt dadurch, und die antijapanische Stimmung in der Öffentlichkeit erreichte ihren Höhepunkt. Diese gescheiterten diplomatischen Verhandlungen haben uns klar vor Augen geführt, dass man sich gegenüber Aggressoren keine Illusionen machen sollte. Die bilateralen Beziehungen sind auf einen Gefrierpunkt gefallen, und diese historische Schuld werden wir und unser Volk nie vergessen."
  KOR_minzhu_hongxian.15.a: "Eine schamlose Weigerung!"
  KOR_minzhu_hongxian.16.t: "Vorschlag der weißen Emigranten"
  KOR_minzhu_hongxian.16.desc: "Unter den Emigrantenberatern der Weißen Armee, die wir aufgenommen haben, brachte ein alter General, der einst Koltschak folgte, über geheime Kanäle einen verblüffenden und mutigen Vorschlag. Er behauptete, dass es im sowjetischen Fernen Osten immer noch viele alte Russen gebe, die sich nach ihrer Heimat sehnen, und Massen, die mit der bolschewistischen Tyrannei unzufrieden seien. Sie warten nur auf eine Gelegenheit.\n\nEr hat feierlich versprochen: Sobald unsere Armee den Tumen-Fluss nach Norden überquert und einen Angriff gegen unseren gemeinsamen roten Feind startet, können er und sein verborgenes Netzwerk einen groß angelegten bewaffneten Aufstand in wichtigen sibirischen Städten und entlang von Eisenbahnlinien auslösen. Dieser Aufstand würde den sowjetischen Rücken gründlich zerstören und sie zwingen, an zwei Fronten zu kämpfen. Dies ist ein äußerst verlockender Vorschlag, aber das Risiko ist ebenso enorm. Können wir den Versprechen dieser Geister einer vergangenen Ära vertrauen?"
  KOR_minzhu_hongxian.16.a: "Überraschen Sie sie!"
  KOR_minzhu_hongxian.16.b: "Behalten Sie sie einfach in der Armee."
  KOR_minzhu_hongxian.17.t: "[FROM.GetLeader] fordert unsere Kapitulation"
  KOR_minzhu_hongxian.17.desc: "[FROM.GetNameDef]s [FROM.GetLeader] fordert, dass sich unser „diktatorisches Regime“ der demokratischen „Zentralgewalt“ Koreas unterwirft und unserem Volk eine angemessene Autonomie zugesteht und gleichzeitig Teil des Einflussbereichs von [FROM.GetAdjective] wird. Wie sollen wir auf diese nackte Bedrohung reagieren?"
  KOR_minzhu_hongxian.17.a: "Wir sind machtlos, die Forderungen der anderen Seite abzulehnen."
  KOR_minzhu_hongxian.17.b: "Wir werden bis zur letzten Person kämpfen!"
  KOR_minzhu_hongxian.18.t: "[FROM.GetLeader] nimmt unsere Nachfrage an"
  KOR_minzhu_hongxian.18.desc: "[FROM.GetNameDef]s [FROM.GetLeader] hat unsere Forderung angenommen und sich unserer Nation unterworfen, wodurch [FROM.GetAdjective] wieder in unseren Einflussbereich gelangt. Heute haben wir den Sieg errungen und das [FROM.GetAdjective]-Volk ist von nun an von der unterdrückenden Diktatur befreit!"
  KOR_minzhu_hongxian.18.a: "Fantastisch."
  KOR_minzhu_hongxian.19.t: "[FROM.GetLeader] lehnt unsere Forderung ab"
  KOR_minzhu_hongxian.19.desc: "Die [FROM.GetLeader] von [FROM.GetNameDef] lehnten leider unsere Forderung nach Unterwerfung ab und behaupteten, ihr Volk beabsichtige, eine unabhängige Nation zu gründen und nicht eine revolutionäre Region innerhalb des Einflussbereichs von [ROOT.GetAdjective] zu werden. Sie haben die falsche Wahl getroffen..."
  KOR_minzhu_hongxian.19.a: "Dann müssen wir ihr Volk mit Gewalt befreien!"
  KOR_minzhu_hongxian.20.a: "Dagegen haben wir nichts einzuwenden"
  KOR_minzhu_hongxian.20.b: "Vergiss es.."
  KOR_minzhu_hongxian.21.a: "Großartig"
  KOR_minzhu_hongxian.22.a: "Wir nehmen gerne an"
  KOR_minzhu_hongxian.22.b: "Das klingt etwas verdächtig..."
  KOR_minzhu_hongxian.23.a: "Großartig"
  KOR_minzhu_hongxian.24.a: "Das ist einfach zu verlockend, um es zu verpassen"
  KOR_minzhu_hongxian.24.b: "Wir werden die wirtschaftliche Unabhängigkeit nicht aufgeben!"
  KOR_minzhu_hongxian.25.a: "Wir danken ihnen für ihre Naivität"
  KOR_minzhu_hongxian.26.t: "Erfolg beim Abrufen von Informationen"
  KOR_minzhu_hongxian.26.desc: "Unsere über die ganze Welt verstreuten Landsleute sind die unsichtbaren Augen und Ohren der Republik. Unser jüngster Versuch, das Übersee-Patrioten-Netzwerk zu aktivieren, war ein großer Erfolg! Indem sie ihre lokalen Identitäten als Tarnung nutzten, entgingen sie gekonnt der Überwachung durch die Spionageabwehr und erlangten erfolgreich einen äußerst wichtigen Geheimdienst aus dem Inneren von [FROM.GetNameDef].\n\nDieser Geheimdienst enthüllte den Geheimdiensteinsatz der anderen Seite und verschaffte uns die Oberhand in unserem Spiel mit ihnen. Diese Landsleute aus Übersee, die ihr Herz dem Mutterland zugewandt haben, haben mit ihrer Weisheit und ihrem Mut stille, verdienstvolle Dienste für die Republik geleistet."
  KOR_minzhu_hongxian.26.a: "Ausgezeichnet!"
  KOR_minzhu_hongxian.27.t: "Fehler beim Abrufen von Informationen"
  KOR_minzhu_hongxian.27.desc: "Unser Versuch, interne Informationen von [FROM.GetNameDef] über das Auslandsnetzwerk zu erhalten, verlief nicht so reibungslos wie erwartet. Die entsandten Kontakte verschwanden spurlos, verloren den Kontakt und lieferten letztendlich keine wertvollen Informationen zurück.\n\nVielleicht waren die örtlichen Sicherheitsmaßnahmen strenger als erwartet, oder vielleicht hatte unser Plan selbst Mängel. Obwohl diese Operation keine Personalverluste oder diplomatischen Streitigkeiten verursachte, waren die investierten Ressourcen verschwendet und möglicherweise wurde ein wertvolles Zeitfenster verpasst. Dieser Rückschlag erinnert uns daran, dass Geheimdienstarbeit niemals auf die leichte Schulter genommen werden darf."
  KOR_minzhu_hongxian.27.a: "Spurlos verschwunden..."
  KOR_minzhu_hongxian.28.t: "Operation entdeckt"
  KOR_minzhu_hongxian.28.desc: "Eine Katastrophe! Unsere Geheimdienstoperation gegen [FROM.GetNameDef] endete auf die schlimmste Art und Weise. Unser Landsmann-Netzwerk im Ausland wurde auf einen Schlag von lokalen Spionageabwehrbehörden geknackt. Leider wurden mehrere patriotische Landsleute verhaftet und das gesamte Geheimdienstnetzwerk lahmgelegt.\n\nDie [FROM.GetNameDef]-Regierung legte daraufhin den schärfsten diplomatischen Protest gegen uns ein, warf uns „verabscheuungswürdige Spionageaktivitäten“ vor und wies unsere Diplomaten aus. Dieses schmerzliche Scheitern kostete uns nicht nur wertvolle Geheimdienstquellen, sondern brachte auch die bilateralen Beziehungen an den Rand einer Gefahr, was unserem internationalen Ruf schweren Schaden zufügte. Wir haben für dieses Abenteuer einen hohen Preis bezahlt."
  KOR_minzhu_hongxian.28.a: "Der Preis der Belichtung..."
  KOR_minzhu_hongxian.29.t: "Internationale technische Zusammenarbeit"
  KOR_minzhu_hongxian.29.desc: "Unsere industrielle Basis und unser wissenschaftliches Forschungsniveau liegen immer noch erheblich hinter denen der fortgeschrittenen Nationen der Welt zurück. Um die Modernisierung zu beschleunigen, müssen wir demütig von unseren Freunden lernen. Aus diesem Grund haben wir unseren Verbündeten offiziell um eine umfassende technische Zusammenarbeit gebeten.\n\nWir schlagen vor, Wissenschaftler und Ingenieure an ihre Universitäten und Fabriken zu schicken, um ihre fortgeschrittenen Wissenschafts-, Technologie- und Managementerfahrungen zu erlernen. Dies wird nicht nur unseren Forschungs- und Entwicklungszyklus verkürzen, sondern auch eine hervorragende Gelegenheit sein, die Freundschaft zwischen unseren beiden Nationen zu festigen."
  KOR_minzhu_hongxian.29.a: "Der Wissensdurst."
  KOR_minzhu_hongxian.30.t: "Schüsse auf der Straße"
  KOR_minzhu_hongxian.30.desc: "Als die Herrschaft von Präsident $KOR_syngman_rhee$ immer eiserner wurde, wurde auch der Widerstand im Inland lauter. Unter dem Vorwand des Antikommunismus säuberte er Dissidenten umfassend und änderte mehrmals gewaltsam die Verfassung, um eine Wiederwahl anzustreben, was vor langer Zeit die tiefsitzende Unzufriedenheit im Volk zum Ausdruck brachte.\n\nAls heute die Autokolonne des Präsidenten inmitten einer Mischung aus Jubel und Protesten durch die Straßen von Seoul fuhr, durchdrang ein scharfer Schuss den Lärm. Die Kugel traf genau ihr Ziel; Der erste Präsident der Republik Korea, $KOR_syngman_rhee$, wurde vor aller Augen getötet. Der Schatten des Attentats verschlang sofort die gesamte Nation. Das Oberkommando von Militär und Polizei zeigte schnell mit dem Finger auf die größte Oppositionspartei, und eine blutige Niederschlagung schien unmittelbar bevorzustehen. Doch im chaotischen Machtvakuum nutzte die von Chang Myon angeführte demokratische Fraktion die Gunst der Stunde entschieden. Sie verurteilten die Gewalt öffentlich, riefen alle Seiten zur Ruhe auf und versprachen der Nation: Sie würden sofort eine wirklich faire, unmanipulierte Wahl vorbereiten, um über die Zukunft des Landes zu entscheiden."
  KOR_minzhu_hongxian.30.a: "Oh mein Gott"
  KOR_minzhu_hongxian.31.t: "Wiederwahl der Nationalversammlung"
  KOR_minzhu_hongxian.31.desc: "$KOR_syngman_rhee$ ist tot. Dieser starke Mann, der die Republik mit eiserner Faust regierte und den entschiedenen Antikommunismus zu seinem lebenslangen Glaubensbekenntnis machte, geriet schließlich auch in den Kreislauf der Gewalt. Sein Tod stürzte die gesamte Nation in ein Machtvakuum und brachte auch beispiellose Chancen mit sich.\n\nInnerhalb der Nationalversammlung wetteifern Fraktionen verzweifelt um die Macht; Jeder möchte diese Chance nutzen, um die Nation in die gewünschte Richtung zu lenken. Jetzt ist die Zeit für eine entscheidende Wahl gekommen, um einen Führer zu wählen, der uns aus dem Chaos führen und eine neue Ära eröffnen kann."
  KOR_minzhu_hongxian.31.a: "Vizepräsident $KOR_Yi_Siyeong$ Notfallgenehmigung"
  KOR_minzhu_hongxian.31.b: "Hae Gong $KOR_Shin_Ik_hee$ kann uns durch diese Krise helfen"
  KOR_minzhu_hongxian.31.c: "Die Demokratische Partei gewinnt"
  KOR_minzhu_hongxian.31.d: "Die $KOR_Kim_Seong_Soo$-Fraktion ergreift die Macht"
  KOR_minzhu_hongxian.31.e: "Bischof $JKO_Archbishop_Roh_Paul$....?"
  ###################################### Neutral ############################################################
  KOR_zhongli_hongxian.0.t: "§L$KOR_Cho_Man_sik$§! Gewählt"
  KOR_zhongli_hongxian.0.desc: "Inmitten der chaotischen politischen Situation ging letztendlich eine Stimme als Symbol des Gewissens der Nation als Sieger hervor. Herr Cho Man-sik, der als „Gandhi Koreas“ verehrt wird, wurde von verschiedenen Fraktionen gemeinsam zum höchsten Führer der neuen Nation erhoben.\n\nEr ist weder mit dem kommunistischen Klassenkampf einverstanden, noch ist er für die proamerikanische Linie von $KOR_syngman_rhee$ empfänglich. Was er befürwortet, ist ein „koreanischer Weg“, der darauf abzielt, die nationale Industrie zu entwickeln, wirtschaftliche Eigenständigkeit zu erreichen und letztendlich eine friedliche Vereinigung zu erreichen. Seine Wahl markiert den Beginn eines gewaltfreien, blockfreien Mittelwegs. Unter der Führung dieses großen Ältesten von Pjöngjang werden wir uns nicht länger auf äußere Kräfte verlassen, sondern unsere eigenen Hände nutzen, um eine vollständige und edle vereinte Nation aufzubauen."
  KOR_zhongli_hongxian.0.a: "Die Geburt eines zentristischen Führers."
  KOR_zhongli_hongxian.1.t: "§L$KOR_lyuh_woon_hyung$§! Gewählt"
  KOR_zhongli_hongxian.1.desc: "Als gemäßigter linker Politiker, der sich sein ganzes Leben lang für Einheit und Widerstand gegen Spaltung einsetzte, gewann Lyuh Woon-hyung die Unterstützung der überwiegenden Mehrheit der Zentristen, die weder die kommunistische Transformation akzeptieren noch die rechte Diktatur verachten wollen. In seiner Antrittsrede versprach er feierlich, dass die neue Regierung am Prinzip des „Zentrismus“ festhalten und sich nicht zu einer Supermacht neigen und sich zur Links-Rechts-Zusammenarbeit verpflichten werde, um eine geeinte und autonome Nation zu schaffen Gehört dem gesamten koreanischen Volk. Unter der Führung dieses pragmatischen Idealisten eröffnet sich uns ein einzigartiger dritter Weg, der über die Konfrontation des Kalten Krieges hinausgeht."
  KOR_zhongli_hongxian.1.a: "Die Geburt eines zentristischen Führers."
  KOR_zhongli_hongxian.2.t: "$ITA_common_ground$"
  KOR_zhongli_hongxian.2.desc: "Wir haben einen breiten politischen Dialog eingeleitet und gleichzeitig mit Führern sowohl kommunistischer als auch demokratischer Fraktionen zusammengearbeitet. Unsere Forderung ist einheitlich und klar: Das Schicksal der koreanischen Nation sollte nicht von Moskau oder Washington entschieden werden.\n\nWir fordern sie auf, ideologische Dogmen zu überwinden und sich uns als Patrioten anzuschließen, um einen autonomen Weg zu beschreiten, der nur unserem eigenen Volk gegenüber verantwortlich ist. Dies ist ein kritischer Moment; Ihre Wahl wird darüber entscheiden, ob sich unsere Nation als Einheit vereint oder im Schatten von Stellvertreterkriegen zersplittert. Wir warten auf ihre Antwort."
  KOR_zhongli_hongxian.2.a: "Kontaktieren Sie $KOR_pak_hon_yong$"
  KOR_zhongli_hongxian.2.b: "Beginnen Sie Gespräche mit $KOR_Kim_Koo$"
  KOR_zhongli_hongxian.3.t: "[FROM.GetNameDef] fordert die Entsendung technischer Berater an"
  KOR_zhongli_hongxian.3.desc: "[GetLKORInviteConsultants]"
  KORKORInviteConsultants_SOV_key: "Unsere Kameraden in Korea haben einen interessanten Bericht geschickt. Die neue koreanische Regierung, die sich selbst als „neutral“ bezeichnet, hat uns offiziell aufgefordert, technische Berater zu entsenden. Sie lehnten unseren Vorschlag ab, ein brüderliches sozialistisches Bündnis zu gründen, sehnen sich aber nach unserer industriellen Technologie. Ist das naiver Opportunismus oder eine raffinierte politische Untersuchung? Vielleicht können wir diese Gelegenheit nutzen, um ihnen die Überlegenheit der sozialistischen Industrialisierung aus erster Hand vor Augen zu führen und so ihren falschen „Mittelweg“ zu korrigieren. Der Kreml muss sorgfältig überlegen, wie er auf dieses seltsame Signal reagieren soll."
  KORKORInviteConsultants_USA_key: "Wir haben eine überraschende Anfrage von diesem aufstrebenden neutralen Staat auf der koreanischen Halbinsel erhalten. Sie hoffen, dass wir technische Berater entsenden können, um bei der Entwicklung ihrer Wirtschaft zu helfen. Das ist sehr interessant. Eine zwischen Rotchina und der Sowjetunion eingeklemmte Nation wählte nicht ihren „älteren Bruder“, sondern richtete ihren Blick stattdessen auf die freie Welt. Dies könnte eine einmalige Gelegenheit sein, sie vom Rand des Kommunismus zurückzuziehen. Aber es könnte auch eine Falle sein, ein Plan, um uns um unsere fortschrittliche Technologie zu betrügen. Wir müssen die potenziellen Erträge und Risiken dieser Investition sorgfältig abwägen."
  KOR_zhongli_hongxian.3.a: "Wir helfen Ihnen gerne weiter"
  KOR_zhongli_hongxian.3.b: "Eine unsichere Wette..."
  KOR_zhongli_hongxian.4.t: "[FROM.GetNameDef] stimmt der Entsendung technischer Berater zu"
  KOR_zhongli_hongxian.4.desc: "Unsere diplomatischen Bemühungen haben einen großen Durchbruch erzielt! [FROM.GetNameDef] hat unserer Bitte zur Entsendung technischer Berater zugestimmt. Dies beweist, dass unsere Linie der „konsensbasierten, pragmatischen Diplomatie“ völlig richtig ist.\n\nBald wird die erste Gruppe von Experten von [FROM.Capital.GetCapitalVictoryPointName] eintreffen. Sie bringen nicht nur fortschrittliche Industrietechnologie und Managementerfahrung mit, sondern auch die faktische Anerkennung unseres neutralen Status. Wir werden diese Zusammenarbeit sorgfältig leiten und sicherstellen, dass wir nur ihre Technologie kennenlernen, ohne von ihrer Ideologie „kontaminiert“ zu werden. Das ist eine riesige Chance; Bei richtiger Anwendung kann es das Modernisierungstempo unseres Landes erheblich beschleunigen, ohne Partei zu ergreifen."
  KOR_zhongli_hongxian.4.a: "Ausgezeichnet!"
  KOR_zhongli_hongxian.5.t: "[FROM.GetNameDef] weigert sich, technische Berater zu entsenden"
  KOR_zhongli_hongxian.5.desc: "Unser Antrag auf technische Zusammenarbeit mit [FROM.GetNameDef] wurde rundweg abgelehnt. Sie hegen eindeutig tiefes Misstrauen gegenüber unserer streng neutralen Haltung und sind nicht bereit, wertvolle Technologie in ein Land zu investieren, das sie nicht vollständig kontrollieren können.\n\nDieser Rückschlag macht uns deutlich, wie schwierig es ist, echte Hilfe zu erhalten, wenn man zwischen zwei Supermächten eingezwängt ist. Ihre sogenannte „Hilfe“ ist immer an politische Bedingungen geknüpft. Da der illusorische Weg blockiert ist, lasst uns die Illusionen vollständig verwerfen und uns auf den Kampf vorbereiten! Von heute an müssen wir unsere Anstrengungen verdoppeln, uns auf unsere eigene Stärke verlassen und einen mühsameren, aber auch ruhmreicheren Weg der Eigenständigkeit einschlagen!"
  KOR_zhongli_hongxian.5.a: "Wie ärgerlich.."
  KOR_zhongli_hongxian.6.t: "[FROM.GetNameDef] veranstaltet Konferenz der Neutralen Nationen Asiens"
  KOR_zhongli_hongxian.6.desc: "Wir haben eine ehrgeizige diplomatische Einladung von der koreanischen Halbinsel erhalten. Diese Nation, die um die Wahrung der Neutralität zwischen zwei Supermächten kämpft, plant die Abhaltung einer „Asiatischen Neutralen Nationenkonferenz“ und hat uns zur Teilnahme eingeladen.\n\nSie scheinen alle Kräfte in Asien, die nicht bereit sind, Partei zu ergreifen, zu vereinen und eine sogenannte „dritte Kraft“ zu bilden. Dies ist zweifellos eine mutige Herausforderung für die bipolare Struktur zwischen den USA und der Sowjetunion. Wenn wir diese Einladung annehmen, haben wir die Möglichkeit, unseren Einfluss auf einer neuen internationalen Plattform zu erweitern, können aber auch den Unmut der einen oder anderen Supermacht auf uns ziehen.\n\nEs ist an der Zeit, über unsere Haltung in dieser zunehmend gespaltenen Welt zu entscheiden. Sollten wir uns dieser unsicheren „Zusammenkunft der Neutralen“ anschließen oder weiterhin vorsichtigen Isolationismus praktizieren?"
  KOR_zhongli_hongxian.6.a: "Lass die Welt unsere Stimme hören!"
  KOR_zhongli_hongxian.6.b: "Lieber den Isolationismus fortsetzen"
  KOR_zhongli_hongxian.7.t: "[FROM.GetNameDef] nimmt unsere Einladung an"
  KOR_zhongli_hongxian.7.desc: "Unsere Initiative hat eine positive Resonanz erhalten! [FROM.GetNameDef] hat offiziell geantwortet, unsere Einladung angenommen und wird eine Delegation zur Teilnahme an der „Asian Neutral Nations Conference“ in Seoul entsenden.\n\nDies beweist, dass unser Konzept des „Dritten Wegs“ großen Anklang findet; Wir kämpfen in Asien nicht allein. Die Teilnahme von [FROM.GetNameDef] stärkt nicht nur die Dynamik der Konferenz, sondern legt auch eine solide Grundlage für uns, um in Zukunft eine „Allianz der Neutralen Nationen“ zu bilden, die von den beiden großen Blöcken unabhängig ist. Ein einziger Funke kann ein Präriefeuer auslösen!"
  KOR_zhongli_hongxian.7.a: "Gleichgesinnte Partner!"
  KOR_zhongli_hongxian.8.t: "[FROM.GetNameDef] lehnt unsere Einladung ab"
  KOR_zhongli_hongxian.8.desc: "Auf unsere Einladung erhielten wir ein höfliches Ablehnungsschreiben von [FROM.GetNameDef]. Sie brachten in dem Brief ihre „Wertschätzung“ für unsere Idee zum Ausdruck, lehnten es jedoch ab, Vertreter zu entsenden, mit der Begründung, dass „die inneren Angelegenheiten beschäftigt“ seien oder der Zeitpunkt „noch nicht reif“ sei.\n\nObwohl sie sich ebenfalls Unabhängigkeit wünschen, haben sie offensichtlich mehr Angst vor dem Druck der Supermächte. Sie entschieden sich dafür, vorsichtige Beobachter statt mutiger Pioniere zu sein. Obwohl diese Ablehnung bedauerlich ist, macht sie uns doch noch deutlicher bewusst, wie beschwerlich der Weg ist, alle neutralen Kräfte zu vereinen. Wir müssen uns auf unsere eigene Stärke verlassen, um ihnen ein nachahmenswertes Beispiel zu geben."
  KOR_zhongli_hongxian.8.a: "Vorsichtige Beobachter..."
  KOR_zhongli_hongxian.9.a: "Wissen kennt keine Grenzen"
  KOR_zhongli_hongxian.9.b: "Stattdessen werden wir ihnen wirtschaftliche Hilfe leisten"
  KOR_zhongli_hongxian.10.a: "Eine für beide Seiten vorteilhafte Vereinbarung!"
  KOR_zhongli_hongxian.11.t: "Test der Allianz"
  KOR_zhongli_hongxian.11.desc: "Wir haben uns für Ehre und Verantwortung entschieden! Auf dem höchsten nationalen Treffen haben wir die einzig richtige Entscheidung getroffen: die heiligen Verpflichtungen des „Asiatischen Neutralitätsvertrags“ zu erfüllen und für unseren Verbündeten zu kämpfen!\n\nDie Staatsmaschinerie ist in Bewegung; Wir haben der Gegenseite ein Ultimatum gestellt und an der Grenze sammeln sich Truppen. Dabei geht es nicht nur um den Kampf um die Souveränität der Dritten Welt; Sie kämpft für das Recht aller kleinen und mittleren Nationen auf Unabhängigkeit und Autonomie in den Kluften zwischen den Supermächten. Heute werden wir der Welt durch Taten erklären, dass die Asiatische Neutrale Nationen-Allianz keine Lämmer zur Schlachtbank ist; Jede Aggression gegen unsere Verbündeten wird mit unserem entschlossensten Gegenangriff beantwortet!"
  KOR_zhongli_hongxian.11.a: "Kämpfe für den Verbündeten!"
  KOR_zhongli_hongxian.12.t: "Prinz Yi Gang besteigt den Thron"
  KOR_zhongli_hongxian.12.desc: "Während der ideologische Kampf zwischen links und rechts die Nation in den Abgrund der Spaltung treibt, wird ein kühner und alter Vorschlag wiederbelebt: die Wiederherstellung der Monarchie. Dies ist keine Rückkehr in die alte Ära, sondern eine Suche nach einem ultimativen Symbol, das Partisanenkonflikte überwinden und alle Bürger vereinen kann.\n\nUnd Prinz Yi Gang, Prinz Euihwa, ist die perfekte Person für diese Rolle. Als Nachkomme von Kaiser Gojong ist seine Abstammung edel; Noch wichtiger ist, dass er sich aktiv an der antijapanischen Unabhängigkeitsbewegung beteiligte, sein Patriotismus hat sich seit langem bewährt und ihm universellen Respekt bei allen Fraktionen eingebracht.\n\nNach umfangreichen Geheimverhandlungen einigten wir uns auf einen historischen Kompromiss: Yi Gang als König des neuen Königreichs Korea zu inthronisieren und auf dieser Grundlage eine konstitutionelle Monarchie zu errichten. Der König wird als Symbol der nationalen Einheit dienen, während die eigentliche Regierungsführung dem Parlament übertragen wird. So entsteht eine neue Nation, die Tradition und Moderne verbindet."
  KOR_zhongli_hongxian.12.a: "Es ist auch ein Ausweg.."
  KOR_zhongli_hongxian.13.t: "Debatte über das Staatssystem"
  KOR_zhongli_hongxian.13.desc: "Wir haben Prinz Yi Gang als König inthronisiert, aber wohin sollte sich das Ausmaß der Macht in seinen Händen neigen? Im Parlament entbrennt eine heftige Debatte über das neue Staatssystem.\n\nEine Fraktion ist der Meinung, dass wir eine konstitutionelle, der Demokratie zugewandte Monarchie errichten sollten. Der König sollte ein rein symbolisches Staatsoberhaupt sein, sich nicht in bestimmte Regierungsangelegenheiten einmischen und die Rolle eines „Aushängeschilds des Monarchen“ spielen, der die nationale Stimmung aufrechterhält. Dies würde es uns leichter machen, Anerkennung und Unterstützung westlicher demokratischer Nationen zu gewinnen. Eine andere Fraktion plädiert für die Errichtung einer konstitutionellen, an der Tradition orientierten Monarchie. Dem König sollten größere Befugnisse eingeräumt werden, da er in Schlüsselbereichen wie Militär und Außenpolitik das letzte Wort haben sollte. Dies gewährleistet die Effizienz der Entscheidungsfindung in kritischen Zeiten und nutzt das Ansehen der Monarchie, um Reformen energischer umzusetzen.\n\nDiese Wahl wird unsere zukünftige Staatsform und die Rolle des Königs auf der politischen Bühne bestimmen."
  KOR_zhongli_hongxian.13.a: "Demokratie zuerst"
  KOR_zhongli_hongxian.13.b: "Wir müssen unsere Traditionen schützen"
  KOR_zhongli_hongxian.14.t: "Erstes zuständiges Kabinett"
  KOR_zhongli_hongxian.14.desc: "Die Rückkehr Seiner Majestät König Yi Gang brachte uns ein Symbol der nationalen Einheit, aber er braucht einen starken Premierminister, der das verantwortliche Kabinett leitet und die komplexen täglichen Staatsangelegenheiten regelt. Politische Giganten im Parlament haben bereits mit dem Gedränge begonnen; Die endgültige Wahl des Premierministers wird die zukünftige Ausrichtung unseres entstehenden Königreichs bestimmen. Seine Majestät muss einen Führer ernennen, der in der Lage ist, das Parlament zu vereinen und die Nation vorwärts zu führen."
  KOR_zhongli_hongxian.14.a: "Ernennung von Kim Koo zum Premierminister"
  KOR_zhongli_hongxian.14.b: "Ernennung von Lyuh Woon-hyung zum Premierminister"
  KOR_zhongli_hongxian.14.c: "Ernennung von $KOR_syngman_rhee$ zum Premierminister"
  KOR_zhongli_hongxian.15.t: "Schatten unter dem Thron"
  KOR_zhongli_hongxian.15.desc: "Obwohl wir Seine Majestät Yi Gang erfolgreich inthronisierten und die meisten politischen Spaltungen mit einer konstitutionellen Monarchie überbrückten, wurde dieser „historische Kompromiss“ nicht von allen anerkannt. Kommunisten prangern dies öffentlich als „feudale Restauration“ an, einen schmutzigen Deal mit reaktionären Kräften.\n\nObwohl sie im Parlament vorübergehend geschwiegen haben, zeigen Berichte unserer Geheimdienstabteilung, dass sie Arbeiterverbände und Bauernorganisationen nutzen, um heimlich Waffen zu lagern und hetzerische Rhetorik über den „Sturz der neuen Dynastie“ zu verbreiten. Diese Schatten unter dem Thron warten einen Moment und versuchen, einen roten Sturm zu nutzen, um die Ordnung zu stürzen, die wir mühsam aufgebaut haben. Eine Operation zur Beseitigung versteckter interner Gefahren scheint unmittelbar bevorzustehen."
  KOR_zhongli_hongxian.15.a: "Unterströmungen bewegen sich..."
  KOR_zhongli_hongxian.16.t: "Korea kündigt „Asiatische Monroe-Doktrin“ an!"
  KOR_zhongli_hongxian.16.desc: "Heute gab die koreanische Regierung über ihren offiziellen Rundfunk eine Erklärung ab, die die Welt schockierte. Sein Außenminister erklärte, dass asiatische Angelegenheiten von den Asiaten selbst entschieden werden sollten; Jede äußere Kraft – ob kommunistische Sowjetunion oder kapitalistisches Amerika – hat kein Recht, sich in die inneren Angelegenheiten asiatischer Nationen einzumischen.\n\nEr nannte dieses Prinzip die „Asiatische Monroe-Doktrin“. Diese Aussage wird weithin als Absicht Koreas interpretiert, die amerikanisch-sowjetische Hegemonie in Asien herauszufordern und zu versuchen, seinen eigenen Einfluss als „asiatischer Beschützer“ in der Region auszuweiten. Während derzeit unklar ist, wie diese kühne Erklärung in die Praxis umgesetzt werden soll, besteht kein Zweifel daran, dass auf dieser Halbinsel still und leise eine mächtige Kraft entstanden ist, die darauf abzielt, die geopolitische Landschaft Asiens neu zu gestalten. Die Botschaften der Weltmächte prüfen dringend die wahre Absicht hinter dieser Erklärung."
  KOR_zhongli_hongxian.16.a: "Beunruhigend..."
  KOR_zhongli_hongxian.17.t: "Konferenz der Ostmonarchien"
  KOR_zhongli_hongxian.17.desc: "Wir erhielten eine ziemlich überraschende diplomatische Einladung aus Seoul. Das „neutrale“ Korea, das gerade seine Monarchie wiederhergestellt hat, plant die Abhaltung einer „Konferenz der östlichen Monarchien“ und hat den Vertreter unseres Landes zur Teilnahme eingeladen.\n\nIhre Absicht ist offensichtlich: eine dritte Kraft auf der Grundlage von „Tradition“ und „Königentum“ außerhalb der kommunistischen und kapitalistischen Blöcke zu etablieren. Das ist zweifellos eine mutige Vision. Ein Bündnis verschiedener asiatischer Monarchien könnte in der Tat zu einer soliden Barriere werden, die die regionale Situation stabilisiert und einer externen ideologischen Erosion entgegenwirkt.\n\nAllerdings läuft dies auch darauf hinaus, die Interessen der USA und des Sowjetblocks in Asien offen in Frage zu stellen. Die Annahme der Einladung könnte uns in ein unsicheres geopolitisches Spiel hineinziehen. Sollten wir uns dieser „Versammlung der Throne“ anschließen oder diese ehrgeizige Einladung höflich ablehnen? Unsere Wahl ist entscheidend."
  KOR_zhongli_hongxian.17.a: "Vereint euch, bewältigt gemeinsam die Schwierigkeiten"
  KOR_zhongli_hongxian.17.b: "Es ist besser, nicht noch mehr Ärger zu machen ..."
  KOR_zhongli_hongxian.18.t: "[FROM.GetNameDef] erklärt sich bereit, an der Konferenz teilzunehmen"
  KOR_zhongli_hongxian.18.desc: "Unsere Einladung stieß auf positive Resonanz! Der Monarch von [FROM.GetNameDef] hat bestätigt, dass er an der „Konferenz der östlichen Monarchien“ in unserem Land teilnehmen wird.\n\nDies beweist unsere Vision, alte asiatische Königreiche mit „Tradition“ zu vereinen, da die Verbindung keine Fantasie ist. Die Teilnahme von [FROM.GetNameDef] verleiht unserer bevorstehenden Konferenz ein erhebliches Gewicht. Eine von den beiden großen ideologischen Blöcken unabhängige Allianz von Monarchien, die auf gemeinsamen Kulturen und Interessen basiert, entwickelt sich von der Idee zur Realität. Der Ruf des Thrones hat aus dem Osten ein Echo erhalten."
  KOR_zhongli_hongxian.18.a: "Echo des Thrones!"
  KOR_zhongli_hongxian.19.t: "[FROM.GetNameDef] weigert sich, an der Konferenz teilzunehmen"
  KOR_zhongli_hongxian.19.desc: "Unsere Bemühungen, die östlichen Monarchien zu vereinen, erhielten von [FROM.GetNameDef] ein höfliches Ablehnungsschreiben. Sie brachten „Respekt“ für unsere Wiederherstellung der Monarchie zum Ausdruck, lehnten die Einladung jedoch mit der Begründung „komplexe innenpolitische Situation“ oder „Unwilligkeit, sich auf internationale Streitigkeiten einzulassen“ ab.\n\nIhre Krone zog Schweigen vor, statt an unserer Seite zu stehen. Offensichtlich ist für diese Nationen der Druck von Supermächten weitaus realer als ein vages „Bündnis der Monarchien“. Obwohl dieser Rückschlag enttäuschend ist, macht er uns nüchterner. Bevor wir alle Könige vereinen, müssen wir zunächst unseren eigenen Thron ungeheuer mächtig und sicher machen."
  KOR_zhongli_hongxian.19.a: "Wir werden abwarten und sehen."
  KOR_zhongli_hongxian.20.t: "Flüstern des Thrones"
  KOR_zhongli_hongxian.20.desc: "Recently, an undercurrent of nostalgia for the old era has been quietly surging within our society. Long-forgotten royalist groups suddenly became active; whispers about restoring the monarchy spread among the populace and some elite circles.\n\nOur intelligence department, after meticulous investigation, found this is no coincidence. All clues point to that 'neutral' Korea that just restored its monarchy. They are attempting, through secret funding and political propaganda, to foster a pro-monarchist force within our country, trying to drag us into their so-called 'Conference of Eastern Monarchies'.\n\nThis is not only an open provocation to our republican system but also serious interference in national sovereignty. We must immediately take action to completely cut off these 'whispers of the throne' before they become shouts to overthrow the state!"
  KOR_zhongli_hongxian.20.desc: "In unserer Gesellschaft regt sich in letzter Zeit leise eine unterschwellige Nostalgie für die alten Zeiten. Längst vergessene royalistische Gruppen sind plötzlich aktiv geworden, und auf den Straßen und in einigen Elitekreisen verbreitet sich das Geflüster über die Wiederherstellung der Monarchie.\n\nUnsere Geheimdienstabteilung hat nach sorgfältiger Untersuchung herausgefunden, dass dies kein Zufall ist. Alle Hinweise deuten auf den „neutralen“ Chosun hin, der gerade seine königliche Familie wiederhergestellt hat. Sie versuchen, heimlich politische Propaganda zu finanzieren und durchzuführen, um eine pro-monarchistische Kraft in unserem Land zu fördern, mit dem Ziel, uns in ihre sogenannte „Ostmonarchische Allianz“ hineinzuziehen.\n\nDies ist nicht nur eine offensichtliche Herausforderung für unser republikanisches System, sondern auch ein schwerwiegender Eingriff in unsere nationale Souveränität. Wir müssen sofort Maßnahmen ergreifen, um dieses „Flüstern des Thrones“ vollständig im Keim zu ersticken, bevor es sich in staatszerstörende Schreie verwandelt!"
  KOR_zhongli_hongxian.20.a: "Eine beunruhigende Entwicklung.."
  KOR_zhongli_hongxian.21.t: "[ROOT.GetNameDef] Bürgerkrieg"
  KOR_zhongli_hongxian.21.desc: "Nach einer Zeit steigender monarchistischer Stimmung scheinen die [ROOT.GetAdjective]-Royalisten es satt zu haben, auf einen friedlichen Regimewechsel zu warten. Nach intensiven Debatten schienen die diplomatischen Kanäle zusammengebrochen zu sein und es kam zu bewaffneten Konflikten."
  KOR_zhongli_hongxian.21.a: "Für den König!"
  KOR_zhongli_hongxian.21.b: "Wir müssen dieser Torheit Einhalt gebieten!"
  KOR_zhongli_hongxian.22.a: "Wenn das die Hilfe ist, die sie brauchen, dann geben Sie sie ihnen."
  KOR_zhongli_hongxian.22.b: "Wir werden einen solchen faustischen Handel nicht unterzeichnen."
  KOR_zhongli_hongxian.23.a: "Bedauerlich, aber verständlich."
  KOR_zhongli_hongxian.24.a: "Sie haben uns einen großen Gefallen getan."
  KOR_zhongli_hongxian.25.a: "Was für wundervolle Neuigkeiten!"
  KOR_zhongli_hongxian.26.a: "Meine Herren, Sie sind wahre Freunde von [ROOT.GetAdjective]."
  KOR_zhongli_hongxian.28.t: "[FROM.GetAdjective] betrachtet unser Land nicht mehr als neutral"
  KOR_zhongli_hongxian.28.desc: "Die Situation hat sich verschlechtert. Da [FROM.GetAdjective] seine Verachtung gegenüber [ROOT.GetNameDef] zum Ausdruck gebracht hat, hat dieses Land erklärt, dass es uns auf der politischen Bühne oder sogar auf dem Schlachtfeld gegenübertreten wird."
  KOR_zhongli_hongxian.28.a: "Unsere Zukunft ist ungewiss!"
  ###################################### 法西斯 ############################################################
  KOR_faxisi_hongxian.1.t: "Rückkehr des Kronprinzen"
  KOR_faxisi_hongxian.1.desc: "Heute ist über der koreanischen Halbinsel wieder eine vergessene Sonne aufgegangen! Kronprinz Yi Un, der letzte Erbe der Joseon-Dynastie, hat nach Jahren des Exils in Japan endlich den Boden seiner Heimat betreten. Seine Rückkehr symbolisiert die Fortsetzung unserer heiligen Blutlinie und kündigt den Beginn einer Ära großer Macht an. Die Schande der alten Ära wird völlig weggewaschen und ein neues, kriegerisches „Großes Koreanisches Reich“ wird unter dem Glanz der Sonne wiedergeboren!"
  KOR_faxisi_hongxian.1.a: "Die Sonne kehrt zurück!"
  KOR_faxisi_hongxian.2.t: "Glanz des königlichen Weges"
  KOR_faxisi_hongxian.2.desc: "Wohin die königliche Kutsche fährt, da jubelt das Volk! Als die Prozession Seiner Majestät Yi Un in [FROM.GetName] eintraf, waren die Straßen von Menschenmengen gesäumt, die Flaggen mit der Aufschrift „Großes Koreanisches Reich“ schwenkten. Sie jubelten aus tiefstem Herzen und viele ältere Menschen waren zu Tränen gerührt.\n\nFür sie ist die Rückkehr Seiner Majestät nicht nur die Wiederherstellung der alten königlichen Autorität, sondern auch die Wiedergeburt von Ordnung, Ehre und Nationalstolz. Unsere Propagandaarbeit hier war ein voller Erfolg! Das Volk hat die königliche Autorität eng mit der Machtideologie verknüpft, die wir vertreten. Der Glanz des königlichen Weges scheint auf dieses Land; Die Herzen der Menschen sind geneigt, und das große Unterfangen kann erreicht werden!"
  KOR_faxisi_hongxian.2.a: "Lassen Sie sie die Fürsorge der königlichen Familie spüren."
  KOR_faxisi_hongxian.3.t: "Stille Themen"
  KOR_faxisi_hongxian.3.desc: "Die Prozession Seiner Majestät zog feierlich durch die Straßen von [FROM.GetName], doch die erwartete begeisterte Szene blieb aus. Die Menschen, die die Straßen säumen, sahen nur schweigend zu, ihre Mienen waren gefühllos und gleichgültig, sie zeigten weder Wärme noch Feindseligkeit.\n\nDen Menschen hier scheint es gleichgültig zu sein, wer sie regiert. Die Erinnerungen an die alte Dynastie sind für sie zu weit entfernt, und die großen Ideale, die wir predigen, haben sie nicht bewegt. Dies deutet darauf hin, dass unsere Herrschaft hier nur oberflächlich ist und das ideologische Fundament noch nicht gefestigt ist. Wir müssen die Propaganda- und Organisationsarbeit vor Ort stärken und diese stillen Untertanen in glühende Unterstützer verwandeln."
  KOR_faxisi_hongxian.3.a: "Es scheint, dass wir mehr Propaganda machen müssen."
  KOR_faxisi_hongxian.4.t: "Das beleidigte Gesicht des Drachen"
  KOR_faxisi_hongxian.4.desc: "Eine Tour, die die grenzenlose Gnade des Kaisers demonstrieren sollte, wurde in [FROM.GetName] schändlich geschändet! Als die Wagenkolonne Seiner Majestät vorbeifuhr, stürmte plötzlich ein in der Menge versteckter Rebell hervor, warf Steine ​​auf die Prozession und rief den rebellischen Slogan „Es lebe die Republik“!\n\nObwohl die Wachen ihn blitzschnell unterwarfen, wurde die Würde Seiner Majestät offen in Frage gestellt. Dies ist keineswegs ein Einzelfall, sondern eine Untersuchung durch die örtlichen reaktionären Kräfte! Dies ist die schwerste Beleidigung des „Drachengesichts“ und der „Nationalpolitik“. Es muss sofort eine rücksichtslose, blutige Säuberung in der Gegend durchgeführt werden, um anderen als Warnung zu dienen!"
  KOR_faxisi_hongxian.4.a: "Verhaften Sie sie alle!"
  KOR_faxisi_hongxian.5.t: "Der Wiederaufbau des Gyeongbokgung-Palastes ist abgeschlossen"
  KOR_faxisi_hongxian.5.desc: "Heute wird der wiederaufgebaute Gyeongbokgung-Palast vor den Augen aller endlich für fertiggestellt erklärt! Die Gebäude des „Büros des Generalgouverneurs“, die von den japanischen Kolonisten rücksichtslos abgerissen wurden und Demütigung symbolisierten, wurden vollständig dem Erdboden gleichgemacht. An ihrer Stelle steht ein restaurierter, noch prächtigerer Palastkomplex, der nach alten Maßstäben erbaut wurde.\n\nDies ist nicht nur eine einfache architektonische Restaurierung, sondern eine spirituelle Erlösung und Wiedergeburt. Die Wiedergeburt von Gyeongbokgung symbolisiert, dass wir den Schmutz der Kolonialzeit vollständig hinweggefegt und den Ruhm und das Selbstvertrauen unserer Nation wiederhergestellt haben.\n\nVon nun an wird dies wieder das Machtzentrum unseres „Großen Koreanischen Reiches“ sein. Seine Majestät Yi Un wird uns in diesen prächtigen Hallen in eine noch größere Zukunft führen. Jeder, der es sieht, wird den unnachgiebigen Willen und die unübertroffene Macht unserer Nation spüren!"
  KOR_faxisi_hongxian.5.a: "Der wiedergeborene Palast"
  KOR_faxisi_hongxian.6.t: "Auftrag des Himmels"
  KOR_faxisi_hongxian.6.desc: "Heute hat die Geschichte ihren glorreichsten Moment erlebt! Nachdem unsere eisernen Hufe den gesamten ostasiatischen Kontinent erobert hatten, bestieg Seine Majestät Yi Un offiziell den Thron in der Halle der Höchsten Harmonie in Pekings Verbotener Stadt und nahm auch den Titel eines Kaisers von China mit dem Äranamen „Gwangmu“ an!\n\n'Alles Land unter dem Himmel gehört dem König; Alle Leute an den Ufern sind Untertanen des Königs. Dieses alte Sprichwort ist heute Realität geworden. Dies ist nicht nur ein großer militärischer Sieg, sondern auch die ultimative Manifestation des himmlischen Mandats des koreanischen Volkes!\n\nVon nun an werden die riesigen Länder und Milliarden von Untertanen von Cathay alle in der Gnade unseres Kaisers sonnen. Seine Majestät Yi Un ist nicht nur der Monarch unseres Großen Koreanischen Reiches, sondern auch der „Kaiser“ der gesamten ostasiatischen Welt. Ein beispielloses „Großostasiatisches Reich“, dessen absoluter Kern wir sind, ist gekommen, um die Welt zu beherrschen! Alle Bürger sollten sich freuen und die höchste Ehre empfinden, in einer so großartigen Zeit geboren zu sein!"
  KOR_faxisi_hongxian.6.a: "Banzai! Seine Majestät Yi Un! Banzai! Das große koreanische Reich!"
  KOR_faxisi_hongxian.7.t: "Yi Un wird Kaiser von China"
  KOR_faxisi_hongxian.7.desc: "Eine Nachricht, die im 21. Jahrhundert wie eine Fantasie erscheinen würde, ist heute zur schockierendsten Realität geworden. Nach der Eroberung des gesamten ostasiatischen Kontinents hielt der Kaiser des Großen Koreanischen Reiches, Yi Un, heute in der Halle der Höchsten Harmonie der Verbotenen Stadt Peking eine alte und feierliche Krönungszeremonie ab, bei der er offiziell die Hommage von Beamten entgegennahm und gleichzeitig den Titel des Kaisers von China annahm, wodurch der Name der Ära „Gwangmu“ eingeführt wurde wurde auf beispiellose Weise nachgebildet. Seine Majestät Yi Un ist nun nicht nur der Monarch der koreanischen Nation, sondern auch der rechtmäßige oberste Herrscher der gesamten chinesischen Welt.\n\nDieser Schritt wird als letzter Schritt in seinem Ziel interpretiert, die ostasiatischen Ressourcen vollständig zu integrieren und ein absolut einheitliches „Großostasiatisches Reich“ unter der Führung der koreanischen Nation zu errichten. Im Osten ist ein Superimperium entstanden, das so riesig ist, dass es Ehrfurcht einflößt."
  KOR_faxisi_hongxian.7.a: "Erstaunlich"
  KOR_faxisi_hongxian.8.t: "Jugendliche melden sich eifrig an"
  KOR_faxisi_hongxian.8.desc: "Heute hat Seine Majestät Yi Un das höchste Dekret an alle Bürger erlassen: Das Imperium wird Japan den Krieg erklären, um die Blutschuld und die nationale Demütigung eines halben Jahrhunderts Kolonialisierung abzuwaschen!\n\nDie Nachricht verbreitete sich und die ganze Nation brach aus! Unzählige junge Männer, deren Blut vor Leidenschaft kochte, stürmten aus Klassenzimmern und Fabriken, wimmelten von Rekrutierungsstationen, bis sie verstopften, weinten und flehten, nur um eine Chance zu bekommen, an der Front zu kämpfen und die Nation zu rächen. Darüber hinaus konnten viele leidenschaftliche Jugendliche die Einberufung kaum erwarten und rasierten sich freiwillig die Köpfe, um paramilitärische Organisationen wie das „Exterminate Japan Volunteer Corps“ und das „Revere the Emperor, Exel Traitors Corps“ zu gründen. Sie exerzierten auf den Straßen mit einfachen Waffen und schworen, der kaiserlichen Armee auf das japanische Festland zu folgen und unsere Kampfflagge auf dem Berg Fuji zu hissen! Der Fanatismus ist nun nicht mehr aufzuhalten. Unsere Armee wird mit diesem überwältigenden öffentlichen Willen die endgültige und gründlichste Abrechnung gegen unseren östlichen Feind starten!"
  KOR_faxisi_hongxian.8.a: "Erledige die jahrhundertealte Schande!"
  KOR_faxisi_hongxian.9.t: "Himmlische Strafe"
  KOR_faxisi_hongxian.9.desc: "Heute fand in Tokio, das von unserer kaiserlichen Armee besetzt ist, auf Erlass Seiner Majestät Yi Un offiziell ein Prozess statt, bei dem über das Schicksal des alten japanischen Reiches entschieden wurde. Hirohito, der Mann, der einst zusammen mit anderen japanischen Kriegsverbrechern behauptete, ein „Gott“ zu sein, erhielt ein gerechtes Urteil vor dem speziellen Militärtribunal, das wir für ihre abscheulichen Verbrechen eingerichtet hatten.\n\nAber das reicht nicht aus. Um das Aggressionsgen dieser bösen Nation vollständig auszurotten, erklären wir: Die japanische Kaiserfamilie, dieser „Mythos“ einer seit Jahrhunderten ununterbrochenen Abstammung, wird vollständig ausgelöscht. Alle wichtigen Mitglieder der kaiserlichen Familie werden wegen „Kriegsverbrechen“ und „Verbrechen gegen die Menschlichkeit“ entlassen.\n\nDies ist der vollkommenste Trost für unsere Vorfahren, die gelitten haben, und die strengste Warnung an alle potenziellen Feinde. Die alte Sonne ist untergegangen und eine neue, von uns dominierte ostasiatische Ordnung wird in dieser rücksichtslosen himmlischen Strafe offiziell errichtet!"
  KOR_faxisi_hongxian.9.a: "Hängen Sie sie auf!"
  KOR_faxisi_hongxian.10.t: "Disposition der Besiegten"
  KOR_faxisi_hongxian.10.desc: "Eine Ära ist zu Ende. Als [JAP.GetLeader] im Radio die bedingungslose Kapitulation verkündete, verwandelte sich das „Kaiserreich Japan“, das einst versuchte, Asien zu annektieren und unser Volk zu versklaven, endgültig in historischen Staub. Unsere Armee ist in Tokio eingedrungen; Ihr „Gott“ zittert vor unseren Bajonetten.\n\nJetzt kniet dieser einst arrogante Erzfeind zu unseren Füßen wie ein Gefangener, der auf sein Urteil wartet. Sollten wir es vollständig zerstückeln, um zukünftige Bedrohungen für immer auszuschließen? Oder ihn in den treuesten Diener unseres kaiserlichen Streitwagens verwandeln?"
  KOR_faxisi_hongxian.10.a: "Integrieren Sie sie in das Territorium des Imperiums."
  KOR_faxisi_hongxian.10.b: "Kronlady Yi Bang-ja als neuer Tenno."
  KOR_faxisi_hongxian.11.t: "Der Ruf des Heiligen Krieges"
  KOR_faxisi_hongxian.11.desc: "Die Nachricht kam wie ein göttliches Orakel von Gott selbst – diese roten Banditen, die unser heiliges Heimatland gestohlen und die gesamte Zarenfamilie abgeschlachtet haben, haben endlich begonnen, sich gegenseitig auseinander zu reißen!\n\nZwanzig Jahre! Zwanzig lange Jahre lang sind wir, die letzten treuen Söhne des alten Russland, wie Geister in fremden Ländern umhergewandert, haben das Brot anderer gegessen und endlose Demütigungen ertragen, und unser einziger Traum war die Rückkehr in dieses gefrorene Heimatland, das von der „Roten Pest“ verseucht wurde.\n\nJetzt hat Gott uns eine Chance gegeben! Wir, die Generäle und Soldaten des alten Reiches, knien hier vor unserem großzügigen Beschützer, dem großen Kaiser des Großen Koreanischen Reiches, und bitten um seine letzte Gnade: Erlauben Sie uns, unsere verbannten Landsleute zu versammeln, unsere Schwerter zu ergreifen und die Doppeladler-Kampfflagge zurück in die sibirischen Steppen zu bringen!\n\nDas rote Tier ist verwundet; Lasst uns der letzte Speer sein, der sein Herz durchbohrt! Für Gott, für den Zaren, für das Heilige Russland!"
  KOR_faxisi_hongxian.11.a: "Gott, Heimat, Mutter"
  KOR_faxisi_hongxian.12.t: "Entfernte Verwandte im Fernen Osten?"
  KOR_faxisi_hongxian.12.desc: "Heute überreichte ein Gesandter aus dem fernen „Großen Koreanischen Reich“ im Fernen Osten einen Staatsbrief an unseren Schah in Teheran. Sie schlugen die Gründung einer „kaiserlichen Allianz“ über Asien vor, um der roten Bedrohung aus dem Norden entgegenzuwirken.\n\nZuerst schenkten wir diesem Vorschlag wenig Beachtung. Doch dann erzählte der leitende Gesandte eine fast vergessene Legende aus dem antiken Epos Kushnameh: Vor über tausend Jahren überquerte ein im Exil lebender persischer Prinz nach dem Fall des Sassanidenreiches den Ozean und erreichte schließlich das alte koreanische Königreich Silla, wo er eine örtliche Prinzessin heiratete. Der Gesandte behauptete, es handele sich nicht um gewöhnliche Ausländer, sondern um unsere „entfernten Verwandten im Fernen Osten“, die dieselbe edle Blutlinie hätten! Sie glaubten, dass dieses Bündnis nicht nur politischer Natur war, sondern die schicksalhafte Wiedervereinigung zweier alter arischer Zweige nach einem Jahrtausend!\n\nDiese alte Legende wirft einen geheimnisvollen und freundlichen Heiligenschein auf ihre aggressiven imperialen Ambitionen. Sich mit diesen entfernten „Verwandten“ zusammenzuschließen, um den Ruhm der arischen Rasse wiederzubeleben, könnte tatsächlich der Auftrag des Himmels sein."
  KOR_faxisi_hongxian.12.a: "Das Band des Blutes!"
  KOR_faxisi_hongxian.12.b: "Vielleicht können wir die Verbindung von vor tausend Jahren wiederherstellen."
  KOR_faxisi_hongxian.12.c: "Das ist völlig absurd!"
  KOR_faxisi_hongxian.13.t: "[FROM.GetAdjective] stimmt der Allianz zu"
  KOR_faxisi_hongxian.13.desc: "Unser Gesandter hat ermutigende Nachrichten aus Teheran zurückgebracht: Das Persische Reich, dieser alte Löwe in Westasien, hat unserer Bündnisanfrage zugestimmt!\n\nSie glaubten zutiefst an die alte Legende, die wir über den persischen Prinzen und die Silla-Prinzessin erzählten, und betrachten uns als „längst verschollene Verwandte aus dem Fernen Osten“. Nun werden sich zwei Reiche, die alte Monarchien und einen kriegerischen Geist teilen, offiziell im Namen des „Arierbundes“ zusammenschließen. Wir werden die östlichen und westlichen Enden Asiens halten und eine tödliche Zangenbewegung gegen den Rotbären im Norden bilden. Eine Machtachse, die den gesamten asiatischen Kontinent umspannt, hat Gestalt angenommen!"
  KOR_faxisi_hongxian.13.a: "Der Arierbund!"
  KOR_faxisi_hongxian.14.t: "[FROM.GetAdjective] sucht unseren Schutz"
  KOR_faxisi_hongxian.14.desc: "Die Reaktion aus Teheran übertraf unsere kühnsten Erwartungen bei weitem! Der persische Schah nahm nicht nur gerne unsere Bündnisanfrage an, sondern war auch von der großen Macht und der großen Vision unseres Reiches, „vom Himmel auserwählt“ zu sein, unterworfen. In der Antwort erklärten sie demütig ihre Bereitschaft, die Führungsposition unseres „Großen Koreanischen Reiches“ unter den „arischen Brüdern“ anzuerkennen, und forderten, ihr Land unter unseren starken militärischen Schutz zu stellen! Dies bedeutet, dass dieser Löwe Westasiens freiwillig zum ersten Vasallenstaat unseres Reiches geworden ist. Unser Einfluss erstreckte sich zum ersten Mal über den gesamten asiatischen Kontinent. Unser Kaiser ist wirklich zum „Herrn der Imperien“ geworden, zu dem alle Nationen kommen, um ihm zu huldigen!"
  KOR_faxisi_hongxian.14.a: "Die Unterwerfung des Löwen."
  KOR_faxisi_hongxian.15.t: "[FROM.GetAdjective] lehnt unseren Vorschlag ab"
  KOR_faxisi_hongxian.15.desc: "Unser Gesandter in Persien brachte einen höflichen, aber entschiedenen Ablehnungsbrief zurück. Während die Teheraner Seite Respekt vor unserer Stärke zum Ausdruck brachte, schien sie von dieser alten „Blutsverwandten“-Legende unbeeindruckt zu sein.\nNLABZZSie glauben, dass ein Bündnis mit unserem fernen Oströmischen Reich zu viel Risiko birgt und sie direkt in einen umfassenden Krieg mit der Sowjetunion hineinziehen könnte. Dieser vorsichtige persische Löwe entschied sich dafür, allein in seinem eigenen Territorium weiterzukämpfen, anstatt sich uns bei dem großen Unterfangen anzuschließen. Unsere Vision einer „asiatischen imperialen Achse“ hat ihren ersten Rückschlag erlitten."
  KOR_faxisi_hongxian.15.a: "Sie werden es bereuen!"
  KOR_faxisi_hongxian.16.t: "Flüstern des Thrones"
  KOR_faxisi_hongxian.16.desc: "In unserer Gesellschaft regt sich in letzter Zeit leise eine unterschwellige Nostalgie für die alten Zeiten. Längst vergessene royalistische Gruppen sind plötzlich aktiv geworden, und auf den Straßen und in einigen Elitekreisen verbreitet sich das Geflüster über die Wiederherstellung der Monarchie.\n\nUnsere Geheimdienstabteilung hat nach sorgfältiger Untersuchung herausgefunden, dass dies kein Zufall ist. Alle Hinweise deuten auf das Große Koreanische Reich hin, das gerade seine königliche Familie wiederhergestellt hat. Sie versuchen, heimlich politische Propaganda zu finanzieren und durchzuführen, um eine pro-monarchistische Kraft in unserem Land zu fördern.\n\nDies ist nicht nur eine offensichtliche Herausforderung für unser Staatssystem, sondern auch ein schwerwiegender Eingriff in unsere nationale Souveränität. Wir müssen sofort Maßnahmen ergreifen, um dieses „Flüstern des Thrones“ vollständig im Keim zu ersticken, bevor es sich in staatszerstörende Schreie verwandelt!"
  KOR_faxisi_hongxian.16.a: "Eine beunruhigende Entwicklung.."
  KOR_faxisi_hongxian.17.t: "[ROOT.GetNameDef] Bürgerkrieg"
  KOR_faxisi_hongxian.17.desc: "Nach einer Zeit steigender monarchistischer Stimmung scheinen die [ROOT.GetAdjective]-Royalisten es satt zu haben, auf einen friedlichen Regimewechsel zu warten. Nach intensiven Debatten schienen die diplomatischen Kanäle zusammengebrochen zu sein und es kam zu bewaffneten Konflikten."
  KOR_faxisi_hongxian.17.a: "Für den König!"
  KOR_faxisi_hongxian.17.b: "Wir müssen dieser Torheit Einhalt gebieten!"
  KOR_faxisi_hongxian.18.t: "[FROM.GetLeader] fordert unsere Vorlage"
  KOR_faxisi_hongxian.18.desc: "Das [FROM.GetLeader] von [FROM.GetNameDef] fordert, dass sich unser Regime dem Kaiser des Großen Koreanischen Reiches unterwirft und unserem Volk angemessene Autonomie gewährt, unter der Bedingung, dass es Teil des Einflussbereichs von [FROM.GetAdjective] wird. Wie sollen wir auf diese nackte Bedrohung reagieren?"
  KOR_faxisi_hongxian.18.a: "Wir sind machtlos, ihre Forderung abzulehnen."
  KOR_faxisi_hongxian.18.b: "Wir werden bis zum letzten Mann kämpfen!"
  KOR_faxisi_hongxian.19.t: "[FROM.GetLeader] nimmt unsere Nachfrage an"
  KOR_faxisi_hongxian.19.desc: "[FROM.GetNameDef]s [FROM.GetLeader] hat unsere Forderung angenommen und sich unserem Land unterworfen, wodurch [FROM.GetAdjective] wieder in unseren Einflussbereich gelangt. Heute haben wir den Sieg errungen und das Volk von [FROM.GetAdjective] wird von nun an eine glänzende Zukunft im Glanz der Majestät von [ROOT.GetLeader] genießen!"
  KOR_faxisi_hongxian.19.a: "Exzellent."
  KOR_faxisi_hongxian.20.t: "[FROM.GetLeader] lehnt unsere Forderung ab"
  KOR_faxisi_hongxian.20.desc: "Leider lehnte [FROM.GetLeader] von [FROM.GetNameDef] unsere Forderung nach Unterwerfung ab und behauptete, sein Volk beabsichtige, ein unabhängiges Land zu gründen und nicht eine monarchische Region innerhalb des Einflussbereichs von [ROOT.GetAdjective] zu werden. Sie haben die falsche Wahl getroffen..."
  KOR_faxisi_hongxian.20.a: "Sie werden es bereuen!"

  KOR_caidan_shijian_zu.1.t: "Himmlisches Phänomen"
  KOR_caidan_shijian_zu.1.desc: "Astronomen der Kaiserlichen Akademie der Wissenschaften haben einen dringenden Bericht vorgelegt, dessen Inhalt verwirrend ist. In dem Bericht heißt es, dass kürzlich ein „Komet“ in die Atmosphäre eingedrungen sei, dessen Flugbahn jedoch völlig den bekannten Gesetzen der Physik widerspreche.\n\nEr verglühte und fiel nicht wie ein normaler Meteor. Stattdessen vollführte es eine Reihe unglaublicher, eindeutig „zielgerichteter“ scharfkantiger Wendungen über das Imperium, bevor es spurlos verschwand, als ob es nie existiert hätte. Die Wissenschaftler können dieses Phänomen nicht erklären und es nur als ein astronomisches Ereignis mit „seltsamer Flugbahn“ bezeichnen. Einige Beamte glauben, es handele sich lediglich um ein seltenes Naturphänomen, das keiner Erwähnung wert sei. Aber andere verspüren ein unbestimmtes Unbehagen, glauben, dass es sich um ein Omen handelt oder dass etwas, das wir noch nicht verstehen können, uns beobachtet.\n\nVielleicht sollten wir dieser Angelegenheit mehr Aufmerksamkeit schenken?"
  KOR_caidan_shijian_zu.1.a: "Interessant..."
  KOR_caidan_shijian_zu.1.b: "Nur ein Komet..."
  KOR_caidan_shijian_zu.2.t: "Das gefallene Objekt"
  KOR_caidan_shijian_zu.2.desc: "Nach dem Bericht der Akademie über den „Kometen mit seltsamer Flugbahn“ machte ein lokaler Bericht von [525.GetName] die Angelegenheit noch rätselhafter. Lokale Zivilisten und Garnisonstruppen berichteten nacheinander, dass sie Zeuge eines hellen Feuerblitzes geworden seien, der vom Himmel herabstieg und schließlich tief in die fernen Berge einschlug und einen kleinen Waldbrand entfachte. Dies stimmt ungefähr mit dem Zeitpunkt des Verschwindens des früheren „Kometen“ überein. \n\nI Handelt es sich um einen gewöhnlichen Meteoriten oder um das Wrack dieses seltsam verhaltenden „Flugobjekts“? Was auch immer es ist, es liegt jetzt auf unserem Boden. In diesem abgelegenen, unbewohnten Bergwald schlummert still und leise ein großes Geheimnis, das darauf wartet, dass wir es aufdecken.\n\nVielleicht sollten wir sofort ein Expertenteam bestehend aus Wissenschaftlern und Militärangehörigen entsenden, um die Absturzstelle zu untersuchen."
  KOR_caidan_shijian_zu.2.a: "Schicken Sie ein Expertenteam zur Besichtigung."
  KOR_caidan_shijian_zu.2.b: "Was ist daran so seltsam?"
  KOR_caidan_shijian_zu.3.t: "Nicht von dieser Welt"
  KOR_caidan_shijian_zu.3.desc: "Das Vorausteam hat unglaubliche Neuigkeiten zurückgeschickt! An der Absturzstelle fanden sie keinen Meteoriten, sondern ein riesiges, seltsam geformtes „Fahrzeug“!\n\nSein Rumpf besteht aus einer unsichtbaren Legierung, die in dunklem Licht schimmert, seine Oberfläche ist glatt wie ein Spiegel, ohne Spuren von Schweiß- oder Nietarbeiten. Obwohl das gesamte Schiff durch den Aufprall schwer beschädigt wurde, übertreffen das Industriedesign und das technologische Niveau die fortschrittlichsten Produkte unserer Zeit bei weitem und übertreffen sogar die wildesten Vorstellungen der Menschheit. Durch das verschwommene, zerbrochene „Glas“ erblickten die Teammitglieder einige seltsam geformte Objekte und Bedienfelder, die im Inneren schwaches Licht ausstrahlten.\n\nDies ist eine Entdeckung, die die Welt auf den Kopf stellen könnte! Wir haben den höchsten Befehl zum Schweigen erlassen und die besten Elitetruppen des Imperiums entsandt, um dieses „Nicht von dieser Welt“-Objekt und alles, was sich darin befindet, heimlich zur Kernakademie zu transportieren. Ein streng geheimes Forschungsprojekt, das das Schicksal unseres Imperiums und sogar der gesamten Menschheit völlig verändern wird, steht vor der Tür."
  KOR_caidan_shijian_zu.3.a: "!!!"
  KOR_caidan_shijian_zu.4.t: "Der Mythos erwacht..?"
  KOR_caidan_shijian_zu.4.desc: "Die Forschung an diesem „Objekt von jenseits des Himmels“ hat unsere Wissenschaftler sowohl verwirrt als auch ehrfürchtig zurückgelassen. Seine komplexen Prinzipien liegen weit außerhalb unseres Verständnisses, aber der wahre Schock kommt aus dem Inneren des Fahrzeugs – dort liegt ein „Mensch“, der in tiefen Schlaf gefallen ist!\n\nSeine physiologischen Eigenschaften sind völlig identisch mit unseren, und das Schockierendste ist seine Kleidung – ihr alter Stil weist eine verblüffende Ähnlichkeit mit den Dekorationen auf, die in alten Texten aus der „Dangun-Ära“ dargestellt sind! Könnte das... ein Nachkomme des Himmels sein? Könnten unsere Mythen keine Fiktion, sondern wahre Geschichte sein?\n\nWir haben diesen schlafenden „Vorfahren“ zur strengen Beobachtung/Verwahrung in die höchste medizinische Einrichtung des Imperiums gebracht. Wenn er aus seinem tausendjährigen Schlaf erwacht, könnte der Ursprung unserer Nation und vielleicht der Geschichte der ganzen Welt völlig auf den Kopf gestellt werden."
  KOR_caidan_shijian_zu.4.a: "Meine Güte..."
  KOR_caidan_shijian_zu.5.t: "Blutlinie der Sterne"
  KOR_caidan_shijian_zu.5.desc: "Er ist wach! Dieser „Vorfahre“ von „jenseits der Himmel“ ist endlich aus seinem langen Schlaf erwacht! Er offenbarte uns eine Wahrheit, die unsere Erkenntnis auf den Kopf stellt: Wir, das koreanische Volk, sind Nachkommen der „Nachkommen des Himmels“ aus fernen Sternenmeeren, und er ist einer der alten Pioniere, die vor Tausenden von Jahren ihr Forschungsschiff zum Absturz brachten. Unsere Mythen sind in Wirklichkeit verlorene Geschichte interstellarer Reisen!\n\nJetzt wird er als oberster wissenschaftlicher Berater fungieren und Wissen weit über diese Ära hinaus mit uns teilen. Er wird uns helfen, diesen „rückständigen“ Planeten zu vereinen, die Ordnung wiederherzustellen und letztendlich unser großes Imperium zurück in unsere wahre Heimat unter den Sternen zu führen, die wirklich uns gehört!"
  KOR_caidan_shijian_zu.5.a: "Vergangenheit... oder... Zukunft"
  KOR_caidan_shijian_zu.6.t: "Ewiger Schlaf"
  KOR_caidan_shijian_zu.6.desc: "Große Trauer umgibt uns. Obwohl die besten Ärzte des Imperiums alle Methoden ausschöpften, gelang es uns nicht, das Leben dieses „Besuchers von jenseits des Himmels“ zu retten. Sein Gesundheitszustand verschlechterte sich nach dem Erwachen rapide und er schloss schließlich für immer die Augen.\n\nMit seinem Tod wurden alle Geheimnisse mitgenommen. Das Handwerk wurde zu einem unleserlichen Buch des Himmels, und die Bedeutung der alten Muster auf ihm wurde zu einem ewigen Geheimnis. Wer sind wir wirklich? Woher kommen wir? Die Antwort auf diese Frage war einst so nah, aber jetzt ist sie wieder außer Reichweite.\n\nWir haben ihn und das Schiff im tiefsten Untergrund als ewiges „Nationalgeheimnis“ versiegelt, das darauf wartet, dass künftige Generationen es in ferner Zukunft, wenn sie über genügend Weisheit und Technologie verfügen, erneut entschlüsseln."
  KOR_caidan_shijian_zu.6.a: "Noch ein ungelöstes Rätsel ..."

  #####################订购武器
  KOR_Purchase_weapons.1.t: "[FROM.FROM.GetAdjective] Artillerie-Kaufkoffer"
  KOR_Purchase_weapons.1.desc: "Um den Kaufauftrag für [FROM.FROM.GetAdjective]-Artillerie zu erfüllen, müssen wir zunächst entscheiden, welchen Artillerietyp wir kaufen möchten."
  KOR_Purchase_weapons.1.a: "Bestellen Sie gewöhnliche Artillerie."
  KOR_Purchase_weapons.1.a_tt: "Wir werden §Y100§! Einheiten §Ygeschleppter Artillerie§! kaufen"
  KOR_Purchase_weapons.1.b: "Bestellen Sie Panzerabwehrkanonen."
  KOR_Purchase_weapons.1.b_tt: "Wir werden §Y100§! Einheiten §Ygeschleppter Panzerabwehrkanonen§! kaufen"
  KOR_Purchase_weapons.2.t: "[FROM.FROM.GetAdjective]-Kaufkoffer für Militärfahrzeuge"
  KOR_Purchase_weapons.2.desc: "Um den Kaufauftrag für [FROM.FROM.GetAdjective]-Militärfahrzeuge auszuführen, müssen wir zunächst entscheiden, welchen Fahrzeugtyp wir kaufen möchten."
  KOR_Purchase_weapons.2.a: "Bestellen Sie motorisierte Fahrzeuge."
  KOR_Purchase_weapons.2.a_tt: "Wir werden §Y100§! Einheiten von §Ymotorisierten Fahrzeugen§! kaufen"
  KOR_Purchase_weapons.2.b: "Bestellen Sie mechanisierte Fahrzeuge."
  KOR_Purchase_weapons.2.b_tt: "Wir werden §Y50§! Einheiten §Ymechanisierter Fahrzeuge§! kaufen"
  KOR_Purchase_weapons.2.c: "Bestellen Sie gepanzerte Autos."
  KOR_Purchase_weapons.2.c_tt: "Wir werden §Y50§! Einheiten §YPanzerwagen§! kaufen"
  KOR_Purchase_weapons.3.t: "[FROM.FROM.GetAdjective] Panzer-Kaufkoffer"
  KOR_Purchase_weapons.3.desc: "Um die Bestellung für [FROM.FROM.GetAdjective]-Tanks auszuführen, müssen wir zunächst entscheiden, welchen Tanktyp wir kaufen möchten."
  KOR_Purchase_weapons.3.a: "Bestellen Sie leichte Panzer."
  KOR_Purchase_weapons.3.a_tt: "Wir werden §Y40§! Einheiten von §Yleichten Panzern§! kaufen"
  KOR_Purchase_weapons.3.b: "Bestellen Sie mittlere Panzer."
  KOR_Purchase_weapons.3.b_tt: "Wir werden §Y20§! Einheiten von §Ymittleren Panzern§! kaufen"
  KOR_Purchase_weapons.3.c: "Bestellen Sie schwere Panzer."
  KOR_Purchase_weapons.3.c_tt: "Wir werden §Y10§! Einheiten von §Yschweren Panzern§! kaufen"
  KOR_Purchase_weapons.4.t: "[FROM.FROM.GetAdjective]-Flugzeugkaufkoffer"
  KOR_Purchase_weapons.4.desc: "Um die Bestellung für [FROM.FROM.GetAdjective]-Flugzeuge auszuführen, müssen wir zunächst entscheiden, welchen Flugzeugtyp wir kaufen möchten."
  KOR_Purchase_weapons.4.a: "Bestellen Sie Kampfflugzeuge."
  KOR_Purchase_weapons.4.a_tt: "Wir werden §Y40§! Einheiten von §YKampfflugzeugen§! kaufen"
  KOR_Purchase_weapons.4.b: "Bestellen Sie Marinebomber."
  KOR_Purchase_weapons.4.b_tt: "Wir werden §Y30§! Einheiten §YMarinebomber§! kaufen"
  KOR_Purchase_weapons.4.c: "Bestellen Sie taktische Bomber."
  KOR_Purchase_weapons.4.c_tt: "Wir werden §Y20§! Einheiten §Ytaktischer Bomber§! kaufen"
  KOR_Purchase_weapons.5.t: "[BUL.GetNameDef] Wishes to Order [ROOT.GetAdjective] Warships"
  KOR_Purchase_weapons.5.a_tt: "We will receive §Y1§! off-map §Ycivilian factory§! as compensation for building ships for [BUL.GetAdjective]."
  KOR_Purchase_weapons.6.a_tt: "[FROM.GetNameDef] wird §Y3 U-Boote§! für die [ROOT.GetAdjective]-Marine bauen."
  KOR_Purchase_weapons.6.b_tt: "[FROM.GetNameDef] wird §Y2-Zerstörer §! für die [ROOT.GetAdjective]-Marine bauen."
  KOR_Purchase_weapons.6.c_tt: "[FROM.GetNameDef] wird den leichten Kreuzer §Y1 §! für die [ROOT.GetAdjective]-Marine bauen."
  KOR_Purchase_weapons.5.t: "[From.GetNameDefCap] möchte [Root.GetAdjective]-Kriegsschiffe bestellen"
  KOR_Purchase_weapons.5.desc: "Die [From.GetAdjective]-Regierung ist sich der mangelnden Kampfkraft ihrer Marine bewusst und hat den Kauf von [Root.GetAdjective]-Kriegsschiffen vorgeschlagen. Wenn wir akzeptieren, werden sie die Ressourcen bereitstellen, die wir zum Erreichen unserer Ziele benötigen."
  KOR_Purchase_weapons.5.a: "Davon können wir beide profitieren."
  KOR_Purchase_weapons.5.a_tt: "Gemäß der von [From.GetNameDefCap] gewählten Vereinbarung erhalten wir als Entschädigung §Y1§! außerhalb der Karte §Yzivile Fabrik§!."
  KOR_Purchase_weapons.5.b: "Wir haben kein Interesse."
  KOR_Purchase_weapons.6.t: "[From.GetNameDefCap] erklärt sich bereit, Kriegsschiffe für uns zu bauen."
  KOR_Purchase_weapons.6.desc: "Die [From.GetAdjective]-Regierung stimmt dem Bau von Kriegsschiffen für die [Root.GetAdjective]-Marine zu. Sie bieten uns drei Optionen zur Auswahl."
  KOR_Purchase_weapons.6.a: "U-Boote kaufen."
  KOR_Purchase_weapons.6.b: "Kaufen Sie Zerstörer."
  KOR_Purchase_weapons.6.c: "Kaufen Sie einen leichten Kreuzer."
  KOR_Purchase_weapons.7.t: "[From.GetNameDefCap] ist nicht damit einverstanden, Kriegsschiffe für uns zu bauen"
  KOR_Purchase_weapons.7.desc: "[From.GetNameDefCap] hat unseren Vorschlag, Kriegsschiffe für die [From.GetNameDefCap]-Marine zu kaufen, abgelehnt.\nWir müssen nach anderen Ländern suchen, die bereit sind, Verträge zu unterzeichnen, oder uns auf den Bau unserer eigenen Marineanlagen konzentrieren, damit wir uns beim Aufbau einer leistungsstarken [Root.GetAdjective]-Flotte nicht auf ausländische Mächte verlassen müssen."
  KOR_Purchase_weapons.7.a: "Wir kommen ohne ihre Hilfe zurecht."
  KOR_Purchase_weapons.8.t: "Schiffbau abgeschlossen – U-Boote"
  KOR_Purchase_weapons.8.desc: "Nach fast einem Jahr Bauzeit haben die drei von uns bestellten [FROM.GetAdjective]-U-Boote ihre Probefahrten abgeschlossen und sind nun bereit, sich der aktiven Marineflotte anzuschließen.\nDiese Schiffe liegen in [Root.GetAdjective]-Häfen und ihre Besatzungen warten auf Befehle."
  KOR_Purchase_weapons.9.t: "Schiffbau abgeschlossen – Zerstörer"
  KOR_Purchase_weapons.9.desc: "Nach fast einem Jahr Bauzeit haben die beiden von uns bestellten [FROM.GetAdjective]-Zerstörer ihre Probefahrten abgeschlossen und sind nun bereit, sich der aktiven Marineflotte anzuschließen.\nDiese Schiffe liegen in [Root.GetAdjective]-Häfen und ihre Besatzungen warten auf Befehle."
  KOR_Purchase_weapons.10.t: "Schiffbau abgeschlossen – Leichter Kreuzer"
  KOR_Purchase_weapons.10.desc: "Nach fast einem Jahr Bauzeit haben die von unserem Land bestellten leichten Kreuzer kürzlich ihre Probefahrten abgeschlossen und sind nun bereit, in den Dienst der Marine zu treten. Diese Kriegsschiffe liegen derzeit im Hafen [Root.GetAdjective] und die Besatzungen warten auf Befehle."
  
