  idea_KOR_wenhe_de_tudi_gaige: "$idea_RAJ_rural_development$"
  KOR_hygenic_housing_output_bonus: "$SWE_hygenic_housing_output_bonus$"
  KOR_Korea_neutrality_idea: "Bewaffnete Neutralität"
  KOR_Korea_neutrality_idea_desc: "Neutralität allein reicht bei weitem nicht aus, um Souveränität zu garantieren – denken Sie nur an das Schicksal von [BEL.GetNonIdeologyName], das im letzten Weltkrieg versuchte, neutral zu bleiben. Die beste Abschreckung für den Feind besteht darin, dass die gesamte Nation bereit ist, zu den Waffen zu greifen und bis zum Tod gegen die Eindringlinge zu kämpfen."
  KOR_diqu_dikang_modifiers: "$SWI_heer_und_haus_mod$"
  KOR_Ortswehren_dynamic_mod: "$SWI_Ortswehren_dynamic_mod$"
  KOR_guojia_ziran_baolei_modifier: "$KOR_guojia_ziran_baolei$"

  KOR_neutrality1_zhengzhi: "Ahnentempel des Blauen Hauses"
  KOR_neutrality1_zhengzhi_desc: "Der antike Drachenthron ist nicht nur ein Symbol der Vergangenheit, sondern auch der Grundstein für die Wahrung der nationalen Stabilität. Der Monarch steht über Partisanenkonflikten und findet für uns in einer in zwei Pole gespaltenen Welt ein entscheidendes Gleichgewicht. Wenn die riesigen Wellen des Ostens und Westens versuchen, uns zu verschlingen, ist die königliche Macht der Ballaststein für uns, um Unabhängigkeit und Unparteilichkeit zu wahren. Unsere Loyalität gehört keiner äußeren Kraft, sondern nur dem Drachenthron, der unsere Autonomie garantiert."
  modify_KOR_neutrality1_zhengzhi_modifiers: "§Y$KOR_neutrality1_zhengzhi$§! Zusätzliche Effekte:"
  idea_KOR_wangshi_dichan_touzi: "Immobilieninvestition"
  KOR_huangjia_jingcha_modifier: "$KOR_diguo_de_houshe$"
  KOR_huangjia_jingcha_modifier_desc: "Eine dem Monarchen treue und streng disziplinierte Polizei ist ein wichtiges Instrument zur Aufrechterhaltung der öffentlichen Sicherheit im Inland und zur Demonstration der Würde der königlichen Familie. Sie müssen nicht nur die Kriminalität bekämpfen, sondern auch für die Sicherheit der königlichen Familie verantwortlich sein und so zu einem starken Rückhalt für die Stabilität der Dynastie werden."
  modify_KOR_huangjia_jingcha_modifier: "§Y$KOR_huangjia_jingcha_modifier$§! Zusätzliche Effekte:"
