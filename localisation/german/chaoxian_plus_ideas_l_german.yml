  ####################################################################### 朝鲜政治————法西斯
  KOR_fascism_zhengzhi: "Wiederherstellung der Dynastie"
  KOR_fascism_zhengzhi_desc: "Ein Jahrhundert der Demütigung ist vergangen und die Nachkommen des Drachen werden den verlorenen Ruhm wiedererlangen. Bei der Wiederherstellung der Yi-Dynastie geht es nicht nur um die Rückgewinnung der alten Gebiete, sondern auch um die Umgestaltung der nationalen Seele mit eiserner Faust. Unter der absoluten Autorität des Monarchen werden wir ein mächtiges Reich mit einer strengen Hierarchie und der Einheit aller Menschen aufbauen. Alle inneren und äußeren Feinde, die die Wiederherstellung behindern, werden vollständig vernichtet."
  modify_KOR_fascism_zhengzhi_modifiers: "§Y$KOR_fascism_zhengzhi$§! Zusätzliche Effekte:"
  KOR_guanghuamen_de_jiamian_idea: "Krönungsfeier"
  KOR_huangshi_jingji_tizhi_modifiers: "Königliches Wirtschaftssystem"
  KOR_huangshi_jingji_tizhi_modifiers_desc: "Die Wirtschaft des Landes sollte sorgfältig verwaltet werden wie das Privateigentum des Kaisers. Wir werden ein „Königliches Wirtschaftssystem“ errichten, mit einem Königlichen Komitee, das sich aus den vertrauenswürdigsten Vertrauten und Experten zusammensetzt und direkt für die wirtschaftliche Lebensader des Landes verantwortlich ist. Von der Ressourcenzuteilung bis zur Fabrikproduktion wird alles unter dem absoluten Willen des Führers effizient funktionieren."
  modify_KOR_huangshi_jingji_tizhi_modifiers: "§Y$KOR_huangshi_jingji_tizhi_modifiers$§! Zusätzliche Effekte:"
