  KOR_democratic_zhengzhi: "Blühende Rose von Sharon"
  KOR_democratic_zhengzhi_desc: "Die Rose von Sharon ist ein Symbol für die Beharrlichkeit und den unnachgiebigen Geist unserer Nation. Nach einem langen, harten Winter erblüht diese Blume der Hoffnung endlich in strahlendem Glanz im Land der Republik. Seine Blüte verkündet das Ende der autoritären Ära und symbolisiert die lebendige Vitalität von Freiheit, Demokratie und Bürgerrechten. Wir werden auf der Grundlage der öffentlichen Meinung ein offenes und wohlhabendes neues Land aufbauen, und die Menschen werden diese hart erkämpfte Errungenschaft persönlich bewachen."
  modify_KOR_democratic_zhengzhi_modifiers: "§Y$KOR_democratic_zhengzhi$§! Zusätzliche Effekte:"
  KOR_Christian_Church_modifiers: "Königreich Gottes"
  KOR_Christian_Church_modifiers_desc: "Wir sind keine Republik der Sterblichen mehr, sondern ein göttliches Königreich auf Erden Gottes im Osten. Alle Nationalitäten sind unter dem Kreuz vereint und widmen alles der Erfüllung des Willens Gottes, und unsere Sache ist heilig und unantastbar."
  modify_modify_KOR_democratic_zhengzhi_modifiers: "§Y$modify_KOR_democratic_zhengzhi_modifiers$§! Zusätzliche Effekte:"

  KOR_guojia_anbao_fa_modifiers: "Central Intelligence Agency (KCIA)"
  KOR_guojia_anbao_fa_modifiers_desc: "In einer Welt voller Kriege voller Spione und Verschwörungen ist ein mächtiger Geheimdienst die Garantie für das nationale Überleben. Wir werden keine Mühen scheuen, um ein Geheimdienstimperium aufzubauen, das zu strenger interner Überwachung und wirksamer externer Infiltration fähig ist. Das scharfe Schwert im Dunkeln wird das Licht des Landes bewachen."
  modify_KOR_guojia_anbao_fa_modifiers: "§Y$KOR_guojia_anbao_fa_modifiers$§! Zusätzliche Effekte:"
  KOR_suqing_chise_fenzi_idea: "[KOR.GetAdjective] Antikommunistische Jugendliga"
  KOR_xincunyundong_de_chuxing_modifiers: "Frühes Saemaul Undong (Neue Dorfbewegung)"
  KOR_xincunyundong_de_chuxing_modifiers_desc: "Die Rückständigkeit der ländlichen Gebiete ist das größte Defizit der nationalen Entwicklung. Wir werden eine Massenbewegung starten, um ländliche Gebiete unter dem Motto „Fleiß, Selbsthilfe, Zusammenarbeit“ zu verändern. Durch die Verbesserung der Lebensbedingungen und den Bau von Landstraßen werden wir das Bewusstsein der Landwirte für die Modernisierung wecken und den Grundstein für das größere „Saemaul Undong“ in der Zukunft legen."
  modify_KOR_xincunyundong_de_chuxing_modifiers: "§Y$KOR_xincunyundong_de_chuxing_modifiers$§! Zusätzliche Effekte:"
