  JKO_tetsudou_shou: "Kaiserlich Japanisches Eisenbahnministerium"
  #######################################################################################################################################################################
  ############################################################      朝鲜  独立      ################################################################################
  #######################################################################################################################################################################
  ###
  KOR_fenghuo_liaoyuan: "Eine Nation in verzweifelter Lage"
  KOR_fenghuo_liaoyuan_desc: "Entweder Unabhängigkeit oder Aussterben. Das Schicksal der gesamten Nation hängt von diesem Krieg ab, der uns einen beispiellosen Kampfgeist verleiht, das Land aber auch an den Rand des Zusammenbruchs bringt."
  KOR_zhengshou_peijizhi: "Abgaben- und Rationssystem"
  KOR_fenghuo_liaoyuan_tt: "Dieser Nationalgeist wird §Yentfernt§!, nachdem wir erfolgreich die Unabhängigkeit erlangt haben!"
  KOR_tongbao_zhiyuanjun: "Internationale Brigaden"
  ###
  KOR_shengli_de_shanghen: "Müdigkeit des Sieges"
  KOR_shengli_de_shanghen_desc: "Langfristige Unterdrückung und der brutale Unabhängigkeitskrieg haben unser Heimatland zerstört und die Gesellschaft auseinandergerissen. Das Land liegt in Trümmern und braucht Zeit, um die Wunden der Menschen zu heilen."
  KOR_shengli_de_shanghen_tt: "Dieser nationale Geist wird nach Abschluss der Wahl §Yentfernt§! sein."
  KOR_zmdjjdyc_dabenying_modifiers: "Erbe der Kolonialwirtschaft"
  KOR_zmdjjdyc_dabenying_modifiers_desc: "Unsere Wirtschaft war einst ein Vasall im Dienst Japans. Die Kolonialherrschaft Japans und die endgültigen Verwüstungen des Krieges führten zu einem schweren Verlust von Infrastruktur und Industrie. Ressourcen wurden geplündert, die Industriestruktur wurde verzerrt, und jetzt müssen wir ein unabhängiges und eigenständiges Wirtschaftssystem von Grund auf aufbauen."
  modify_KOR_zmdjjdyc_dabenying_modifiers: "§Y$KOR_zmdjjdyc_dabenying_modifiers$§! Zusätzliche Effekte:"
  KOR_zmdjjdyc_dabenying_modifiers_1: "Erbe der Kolonialwirtschaft"
  KOR_zmdjjdyc_dabenying_modifiers_1_desc: "Unsere Wirtschaft war einst ein Vasall im Dienst Japans. Die Kolonialherrschaft Japans und die endgültigen Verwüstungen des Krieges führten zu einem schweren Verlust von Infrastruktur und Industrie. Ressourcen wurden geplündert, die Industriestruktur wurde verzerrt, und jetzt müssen wir ein unabhängiges und eigenständiges Wirtschaftssystem von Grund auf aufbauen."
  KOR_zmdjjdyc_dabenying_modifiers_2: "Wirtschaftswunder"
  KOR_zmdjjdyc_dabenying_modifiers_2_desc: "Leichtindustrie und Landwirtschaft sind nicht mehr die tragenden Säulen der Wirtschaft; Die Schwerindustrie hat sie überholt. In Verbindung mit den herausragenden Wirtschaftsreformen von Shimomura Osamu wurden Armut und Arbeitslosigkeit erheblich reduziert. Bald werden wir zu einer der größten Volkswirtschaften der Welt zählen!"
  KOR_paixilinli_dabenying_modifiers: "Fraktionalisierter Rat"
  KOR_paixilinli_dabenying_modifiers_desc: "Das Ziel der Unabhängigkeit wurde erreicht, doch über den Weg zum Aufbau des Landes herrscht weitgehend Uneinigkeit. Die Provisorische Regierung im Exil in Shanghai, Kommunisten in Yan'an, Nationalisten und alte Adlige zu Hause ... jeder glaubt, dass er die Wahrheit vertritt."
  modify_KOR_paixilinli_dabenying_modifiers: "§Y$KOR_paixilinli_dabenying_modifiers$§! Zusätzliche Effekte:"
  stability_weekly_tt: "$MODIFIER_STABILITY_WEEKLY$：$RIGHT|+=%1$"
  KOR_jishu_rencai_duanceng: "Talentlücke in der Technologie"
  KOR_jishu_rencai_duanceng_desc: "Während der Kolonialzeit waren alle wichtigen technischen und leitenden Positionen mit Japanern besetzt. Mit ihrem Weggang stellen wir fest, dass es uns an Ingenieuren und Wissenschaftlern mangelt, die in der Lage sind, fortschrittliche Geräte zu bedienen und komplexe Fabriken zu leiten."
  KOR_lingsan_de_dikangjun: "Zerstreute Widerstandsarmee"
  KOR_lingsan_de_dikangjun_desc: "Unsere Armee besteht aus Guerillas aus verschiedenen Regionen, aufständischen Milizen und übergelaufenen Marionettentruppen. Sie verfügen über eine hohe Moral, aber es mangelt ihnen an einheitlicher Führung, standardisierter Ausrüstung und moderner taktischer Kompetenz."

  #################################################################### 朝鲜独立————政治
  KOR_zhengzhi_zhenxing_guojia_idea: "Bauen Sie die Nation wieder auf"
  KOR_zhengzhi_zhenxing_guojia_idea_desc: "Wenn wir hoffen, uns von der Geißel der Japaner zu erholen, müssen wir alles daran setzen, einen schnellen Wiederaufbau durchzuführen. In dieser Zeit müssen die Menschen ein einfaches Leben führen und hart arbeiten, aber sie werden dies sicherlich für eine bessere Zukunft tun."
  KOR_meiyou_jiandie_dlc: "[ROOT.GetAdjective]-Spionageabwehrprogramm"
  KOR_meiyou_jiandie_dlc_desc: "Spionage ist eine der vielen Fronten, denen wir uns in diesem globalen Konflikt stellen müssen. Daher ist die wirksame Aktivierung unseres eigenen Spionageabwehrprogramms von entscheidender Bedeutung, um diesen Krieg zu überleben. Wir haben eine Haltung eingenommen, die sich eher auf defensive Maßnahmen als auf aggressive verdeckte Operationsstrategien konzentriert."
  #################################################################### 朝鲜独立————工业
  KOR_jingji_qingsuan_jishu_idea: "Spross wissenschaftlicher Forschung und Technologie"
  KOR_jingji_laogong_dongyuan_idea: "Arbeitsmobilisierungsplan"
  KOR_jingji_laogong_dongyuan_idea_desc: "Unsere wertvollste Ressource sind unsere fleißigen Mitarbeiter. Um den Wiederaufbau und die Industrialisierung nach dem Krieg zu beschleunigen, werden wir einen landesweiten „Plan zur Mobilisierung von Arbeitskräften“ auf den Weg bringen, um Arbeitskräfte einheitlich zu registrieren, auszubilden und zuzuweisen und sie für die am dringendsten benötigten Reservoir-, Eisenbahn- und Fabrikbauprojekte einzusetzen. Wir werden die Hände des Volkes nutzen, um eine solide Grundlage für die Zukunft des Landes zu legen."
  KOR_jingji_quanguo_tieluwang_idea: "Nationaler Eisenbahnnetzplan"
  KOR_jingji_quanguo_tieluwang_idea_desc: "Das derzeitige Eisenbahnnetz unseres Landes ist fragmentiert und nicht in der Lage, den Bedürfnissen einer modernen Nation gerecht zu werden. Wir werden einen neuen „Nationalen Eisenbahnnetzplan“ formulieren, der Stahlschwellen verwendet, um alle unsere wichtigen Städte, Häfen und Ressourcen produzierenden Gebiete eng zu verbinden und so die einheitliche Verkehrsader der Nation zu bilden."
  KOR_electrification_modifier: "$AFG_electrification_modifier$"

  ####################################################################### 朝鲜独立————军事
  KOR_army_communism: "[KOR.GetAdjective]-Armee (kommunistisch)"
  KOR_army_communism_desc: "Von Guerillakämpfern auf dem Baekdu-Berg bis zu Veteranen ausländischer Schlachtfelder besteht unsere Armee aus Patrioten mit unterschiedlichem Hintergrund, aber einem gemeinsamen Glauben. Sie mögen schlecht ausgerüstet sein und ihr Ausbildungssystem muss dringend integriert werden, aber ihr fester Wille, das Land zu verteidigen, ist ihre schärfste Waffe. Diese Armee ist der Grundstein der nationalen Unabhängigkeit und trägt die schwere Aufgabe, das Heimatland auf den zerstörten Bergen und Flüssen wieder aufzubauen."
  KOR_army_democratic: "[KOR.GetAdjective]-Armee (Demokratisch)"
  KOR_army_democratic_desc: "Von Guerillakämpfern auf dem Baekdu-Berg bis zu Veteranen ausländischer Schlachtfelder besteht unsere Armee aus Patrioten mit unterschiedlichem Hintergrund, aber einem gemeinsamen Glauben. Sie mögen schlecht ausgerüstet sein und ihr Ausbildungssystem muss dringend integriert werden, aber ihr fester Wille, das Land zu verteidigen, ist ihre schärfste Waffe. Diese Armee ist der Grundstein der nationalen Unabhängigkeit und trägt die schwere Aufgabe, das Heimatland auf den zerstörten Bergen und Flüssen wieder aufzubauen."
  modify_KOR_army_communism_modifiers: "§Y$KOR_army_communism$§! Zusätzliche Effekte:"
  trait_winter_specialist_xp_gain_factor_tt: "$modifier_trait_winter_specialist_xp_gain_factor$：$RIGHT|+=%1$"
  trait_winter_expert_xp_gain_factor_tt: "$modifier_trait_winter_expert_xp_gain_factor$：$RIGHT|+=%1$"
  land_reinforce_rate_tt:0 " $MODIFIER_LAND_REINFORCE_RATE$: $RIGHT|+=%1$"
  #
  KOR_air_communism: "[KOR.GetAdjective] Luftwaffe (kommunistisch)"
  KOR_air_communism_desc: "Wir geben uns nicht mehr mit dem Blick auf die Kampfflugzeuge anderer Länder zufrieden. Obwohl sich in den Hangars nur wenige alte Flugzeuge befinden und junge Piloten noch lernen und sich weiterentwickeln, repräsentiert diese junge Luftwaffe unseren Wunsch, unseren eigenen Luftraum zu kontrollieren. Jeder Pilot, der in den Himmel aufsteigt, trägt den Traum der Nation vom blauen Himmel auf sich und ist entschlossen, das Land unter seinen Füßen mit seinen Flügeln zu schützen."
  KOR_air_democratic: "[KOR.GetAdjective] Air Force (demokratisch)"
  KOR_air_democratic_desc: "Wir geben uns nicht mehr mit dem Blick auf die Kampfflugzeuge anderer Länder zufrieden. Obwohl sich in den Hangars nur wenige alte Flugzeuge befinden und junge Piloten noch lernen und sich weiterentwickeln, repräsentiert diese junge Luftwaffe unseren Wunsch, unseren eigenen Luftraum zu kontrollieren. Jeder Pilot, der in den Himmel aufsteigt, trägt den Traum der Nation vom blauen Himmel auf sich und ist entschlossen, das Land unter seinen Füßen mit seinen Flügeln zu schützen."
  modify_KOR_air_communism_modifiers: "§Y$KOR_air_communism$§! Zusätzliche Effekte:"
  navy_carrier_air_attack_factor_tt: "$MODIFIER_NAVAL_CARRIER_AIR_ATTACK_FACTOR$：$RIGHT|+=%1$"
  navy_carrier_air_targetting_factor_tt: "$MODIFIER_NAVAL_CARRIER_AIR_TARGETTING_FACTOR$：$RIGHT|+=%1$"
  #
  KOR_navy_communism: "[KOR.GetAdjective] Marine (kommunistisch)"
  KOR_navy_communism_desc: "Das auf drei Seiten vom Meer umgebene Gebiet erinnert uns immer wieder an die Bedeutung des Ozeans. Derzeit haben wir nur eine kleine Anzahl von Marineschiffen, die die lange Küstenlinie und die Fischgründe bewachen. Der Glaube daran, den Feind außerhalb der Landesgrenzen abzuwehren, wird diese junge Marine jedoch dazu leiten, von der Küstenverteidigung auszugehen und sich schrittweise in Richtung des tiefen Blaus zu bewegen, um zu einer soliden Chinesischen Mauer zu werden, die unsere maritime Lebensader schützt."
  KOR_navy_democratic: "[KOR.GetAdjective] Marine (demokratisch)"
  KOR_navy_democratic_desc: "Das auf drei Seiten vom Meer umgebene Gebiet erinnert uns immer wieder an die Bedeutung des Ozeans. Derzeit haben wir nur eine kleine Anzahl von Marineschiffen, die die lange Küstenlinie und die Fischgründe bewachen. Der Glaube daran, den Feind außerhalb der Landesgrenzen abzuwehren, wird diese junge Marine jedoch dazu leiten, von der Küstenverteidigung auszugehen und sich schrittweise in Richtung des tiefen Blaus zu bewegen, um zu einer soliden Chinesischen Mauer zu werden, die unsere maritime Lebensader schützt."
  modify_KOR_navy_communism_modifiers: "§Y$KOR_navy_communism$§! Zusätzliche Effekte:"
  navy_capital_ship_attack_factor_tt:0 " $MODIFIER_NAVY_CAPITAL_SHIP_ATTACK_FACTOR$: $RIGHT|+=%2$"
  invasion_preparation_tt: "$MODIFIER_NAVAL_INVASION_PREPARATION$：$RIGHT|-=%1$"
  refit_ic_cost_tt: "$MODIFIER_INDUSTRIAL_REFIT_IC_COST_FACTOR$：$RIGHT|-=%1$"
  naval_has_potf_in_combat_attack_tt: "$MODIFIER_NAVAL_HAS_POTF_IN_COMBAT_ATTACK$：$RIGHT|+=%1$"
  #
  KOR_gailiang_zhuangjiache: "Verbesserte gepanzerte Fahrzeuge"
  KOR_qiji_wuqi: "Programm für fortgeschrittene Waffen"
  KOR_qiji_wuqi_desc: "Das Advanced Weapons Program ist ein ehrgeiziges Konzept, das darauf abzielt, die Form der künftigen Kriegsführung durch disruptive technologische Innovationen neu zu gestalten. Unsere Forscher stoßen ständig an die Grenzen des Möglichen und sind bestrebt, eine Reihe revolutionärer Waffen zu entwickeln. Diese hochmodernen Waffen werden unsere absolute Überlegenheit in der Luft, auf See und an Land sichern. Es wird erwartet, dass diese bahnbrechenden Errungenschaften die Weltordnung verändern werden, und jeder Gegner, der es wagt, sich uns entgegenzustellen, wird vernichtet werden."
  modify_KOR_qiji_wuqi_modifiers: "§Y$KOR_qiji_wuqi$§! Zusätzliche Effekte:"
  ####################################################################### 朝鲜政治————共产
  KOR_communism_zhengzhi: "[KOR.GetAdjective] Kommunistische Partei"
  KOR_communism_zhengzhi_desc: "Mit einem Programm zur tiefgreifenden gesellschaftlichen Umgestaltung ist die Kommunistische Partei Koreas die Avantgarde der Arbeiterklasse und der Bauern. Sie setzt sich für den Aufbau eines sozialistischen Landes ohne Ausbeutung und mit Gleichheit für alle ein. Diese Kraft ist voller revolutionärer Begeisterung, verfügt über eine strenge Organisation und feste Überzeugungen und ist das Rückgrat der Förderung einer radikalen Landreform und der industriellen Verstaatlichung. Es wird Korea auf einen völlig anderen Weg führen als die kapitalistische Welt."
  modify_KOR_communism_zhengzhi_modifiers: "§Y$KOR_communism_zhengzhi$§! Zusätzliche Effekte:"
  max_surrender_limit_offset_tt: "$MODIFIER_MAX_SURRENDER_LIMIT_OFFSET$：$RIGHT|+=%1$"
  KOR_guojia_anquan_baoweibu: "Generalaufklärungsbüro der Volksarmee"
  KOR_guojia_anquan_baoweibu_desc: "Das Generalaufklärungsbüro der Volksarmee ist eine scharfe Klinge, die im Schatten tanzt und über die schärfsten Augen, Ohren und Klauen der Republik verfügt. Sie sind allgegenwärtig, dringen hinter die feindlichen Linien ein, sammeln Informationen und führen verdeckte Missionen durch. Die Effizienz und Loyalität dieser Spezialeinheit gewährleisten die präzise Kontrolle des Oberbefehlshabers über interne und externe Situationen. Sie sind der unsichtbare Schutzschild des Landes und die unsichtbare Hand, die dem Feind die Kehle durchschneidet."
  modify_KOR_guojia_anquan_baoweibu_modifiers: "§Y$KOR_guojia_anquan_baoweibu$§! Zusätzliche Effekte:"
  army_intel_factor_tt: "$MODIFIER_ARMY_INTEL_FACTOR$：$RIGHT|+=%1$"
  airforce_intel_factor_tt:0 " $MODIFIER_AIRFORCE_INTEL_FACTOR$: $RIGHT|+=%1$"
  KOR_shehui_zhuyi_jingji: "Sozialistische Ökonomie"
  KOR_shehui_zhuyi_jingji_desc: "Um ein mächtiges Mutterland ohne Ausbeutung aufzubauen, werden wir alle Produktionsmittel verstaatlichen und den Wirtschaftsaufbau durch eine einheitliche nationale Planung steuern. Der freie Markt wird vollständig abgeschafft und durch umfassende Investitionen in die Schwerindustrie ersetzt. Durch dieses richtungsweisende Wirtschaftsmodell werden wir auf den Ruinen rasch ein starkes industrielles Fundament errichten und danach streben, Eigenständigkeit zu erreichen und die Revolution zu verteidigen."
  modify_KOR_shehui_zhuyi_jingji_modifiers: "§Y$KOR_shehui_zhuyi_jingji$§! Zusätzliche Effekte:"
