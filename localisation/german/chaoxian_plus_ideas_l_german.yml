  KOR_papal_state_catholic_dominion_desc: "Während [KOR.GetAdjective] zu einer Weltmacht aufsteigt, ist es an der Zeit, Gottes Willen auszuführen – so wie ein Hirte seine Herde führt, werden wir Christen vor dem Schaden der Dämonen schützen."
  ####################################################################### 朝鲜政治————中立
  KOR_neutrality_zhengzhi: "Leuchtturm im Sturm"
  KOR_neutrality_zhengzhi_desc: "Während die Welt durch den Sturm der Ideologie geteilt wird, schlagen riesige Wellen gegen unsere Küsten. Wir weigern uns, in den Strudel beider Seiten hineingezogen zu werden und entscheiden uns dafür, ein Leuchtturm zu sein, der hoch in der rauen See steht. Unser Licht bewacht nicht nur den unabhängigen Kanal für uns selbst, sondern verkündet auch der Welt: In diesem chaotischen Meer gibt es immer noch die Möglichkeit von Frieden und Autonomie."
  modify_KOR_neutrality_zhengzhi_modifiers: "§Y$KOR_neutrality_zhengzhi$§! Zusätzliche Effekte:"
  KOR_urban_area_investments_modifier: "Kapitalbau"
