  #######################################################################################################################################################################
  JKO_chaoxian_zongdu_fu: "Generalgouverneur von Korea"
  JKO_chaoxian_zongdu_fu_desc: "Im 43. Jahr von Meiji wurde der Annexionsvertrag zwischen Japan und Korea unterzeichnet, das Koreanische Reich ging unter und seine Souveränität wurde auf das Kaiserreich übertragen. Unmittelbar danach benannte das Kaiserreich den in Korea eingerichteten Generalresidenten von Korea in Generalgouverneur von Korea um, der direkt dem Kaiser untersteht. Es verfügte über militärische, gesetzgeberische, administrative und gerichtliche Befugnisse über die koreanische Kolonie. Unter dem bevollmächtigten Gouverneur befanden sich der Leiter der Verwaltungsangelegenheiten, das Sekretariat des Gouverneurs und fünf Ministerien. Darüber hinaus gab es Institutionen wie den Zentralrat, die Polizeidirektion, Gerichte und das Eisenbahnbüro."
  modify_chaoxian_zongdu_fu: "§Y$JKO_chaoxian_zongdu_fu$§! Zusätzliche Effekte:"
  JKO_yibingyundong_de_jiyi: "Erinnerung an die Bewegung der Gerechten Armee"
  JKO_yibingyundong_de_jiyi_desc: "Vom Ende des 19. Jahrhunderts bis nach dem Annexionsvertrag. Der bewaffnete Widerstand der „Gerechten Armeen“ kam dem Imperium teuer zu stehen. Diese blutige Erinnerung hat im Büro des Generalgouverneurs eine pathologische Angst und Wachsamkeit gegenüber jeglicher Form koreanischer Streitkräfte hervorgerufen."
  JKO_xianbing_jingcha_zhidu_dynamic: "Gendarmerie-Polizeisystem"
  JKO_xianbing_jingcha_zhidu_dynamic_desc: "Es ist nicht die gewöhnliche Polizei, die für die öffentliche Ordnung auf der Halbinsel sorgt, sondern die in das Militär integrierte „Gendarmerie-Polizei“. Sie verfügen über eine immense Macht, deren Einfluss sich über die gesamte Halbinsel erstreckt und jeden Widerstand mit harten und effizienten Mitteln im Keim erstickt."
  modify_xianbingjingcha_zhidu: "§Y$JKO_xianbing_jingcha_zhidu_dynamic$§! Zusätzliche Effekte:"
  JKO_dalu_bingzhan_jidi_dynamic: "Kontinentale Militärdepotbasis"
  JKO_dalu_bingzhan_jidi_dynamic_desc: "Die Strategen des Imperiums betrachten die Halbinsel als Sprungbrett für Angriffe auf den Kontinent und als Logistiklager. Bei der gesamten Industrieplanung und beim Eisenbahnbau steht der Dienst am Krieg über der Verbesserung der Lebensgrundlagen der Menschen."
  modify_dalu_bingzhan_jidi: "§Y$JKO_dalu_bingzhan_jidi_dynamic$§! Zusätzliche Effekte:"
  JKO_caituan_de_longduan_dynamic: "Zaibatsu-Monopol"
  JKO_caituan_de_longduan_dynamic_desc: "Bergbau, Fischerei, Finanzen, Transport ... fast alle profitablen Industrien auf der Halbinsel werden vom japanischen Riesen Zaibatsu kontrolliert. Hochschulbildung und technische Schlüsselpositionen sind fester Bestandteil der Japaner; Uns fehlen eigene Ingenieure, Wissenschaftler und leitende Techniker. Das lokale Kapital hat keinen Überlebensspielraum und die Gewinne fließen kontinuierlich ins Ausland."
  modify_caituan_de_longduan: "§Y$JKO_caituan_de_longduan_dynamic$§! Zusätzliche Effekte:"
  JKO_chaoxian_zongdu_budui: "Koreanische Armee (Streitkräfte des Generalgouverneurs)"
  JKO_chaoxian_zongdu_budui_desc: "Die Koreanische Garnisonsarmee, früher die Koreanische Garnisonsarmee, die während des Russisch-Japanischen Krieges im Koreanischen Reich stationiert war. Im 43. Jahr von Meiji wurde sie nach der Annexion Japans und Koreas in Koreanische Garnisonsarmee umbenannt. Im 7. Jahr von Taisho wurde es zur koreanischen Armee umorganisiert. Der Hauptsitz befand sich zunächst in Seoul und wurde dann nach Yongsan in einem Vorort verlegt."
  modify_chaoxian_zongdu_budui: "§Y$JKO_chaoxian_zongdu_budui$§! Zusätzliche Effekte:"
  JKO_zongdu_ribenqiaomin: "Japanische Kolonisationsgruppen"
  JKO_zongdu_ribenqiaomin_desc: "Durch die Umsiedlung von Menschen vom Festland des Imperiums auf die koreanische Halbinsel können wir die Arbeitskräfte weiter ausbauen und mehr Möglichkeiten für die industrielle Entwicklung schaffen"
  JKO_chafeng_baokan: "Vorgehen gegen nationalistische Zeitungen"
  JKO_chafeng_baokan_desc: "Um die Bedrohung durch inländischen Widerstand wirksam zu bekämpfen, müssen wir die Tokko-Abteilung so organisieren, dass sie bereit ist, jegliche Widerstandsbewegungen zu unterdrücken."
  JKO_diyici_jiaoyuling: "Koreanisches Bildungsdekret"
  JKO_diyici_jiaoyuling_desc: "Bildung ist ein Schmelztiegel für die Umgestaltung von Ideen. Das neue Bildungsdekret bezeichnet Japanisch als „Nationalsprache“, die koreanische Geschichte wird heruntergespielt und alle Kurse zielen darauf ab, loyale „kaiserliche Untertanen“ zu fördern."
  JKO_guoyu_changyong_yundong_idea: "Bewegung für den gemeinsamen Gebrauch der Landessprache"
  JKO_guoyu_changyong_yundong_idea_desc: "Fördern Sie Japanisch in allen Bereichen des gesellschaftlichen Lebens. Machen Sie durch die Einrichtung von „National Language Family“-Preisen und Hörsälen die Verwendung von Japanisch zu einer Ehrensache und ersetzen Sie schließlich unsere Muttersprache im täglichen Leben."
  JKO_neixian_yitilun_xuanchuan_idea: "Naeseon Ilchilron Propaganda"
  JKO_neixian_yitilun_xuanchuan_idea_desc: "Fördern Sie in Zeitungen, Radio und Filmen energisch die „Theorie der gemeinsamen Abstammung Japans und Koreas“ und betonen Sie, dass wir das gleiche Blut und Schicksal mit der Yamato-Nation teilen, wodurch nationale Grenzen aufgehoben werden und der Weg für eine vollständige Annexion geebnet wird."
  JKO_chuangshi_gaiming_idea: "Sōshi-kaimei (Richtlinie zur Namensänderung)"
  JKO_chuangshi_gaiming_idea_desc: "Von Städten bis hin zu Dörfern strömten Menschenmassen zu den Haushaltsämtern, um ihren Nachnamen zu ändern. Viele Familien waren sogar stolz darauf, einen „Shi“ (Clannamen) zu erhalten, der mit prominenten japanischen Clans harmonierte."
  JKO_chuangshi_gaiming_idea_two: "Sōshi-kaimei (Richtlinie zur Namensänderung)"
  JKO_chuangshi_gaiming_idea_two_desc: "Das Dekret erzielte zwar formal einen Teilerfolg, hatte jedoch wenig Einfluss darauf, die innere Identität dieser Nation wirklich zu erschüttern. Wir haben ihre Namen im Register geändert, aber es ist uns nicht gelungen, ihre Herzen zu ändern."
  JKO_jiandao_teshe_budui_idea: "Gando-Spezialeinheiten"
  JKO_jiandao_teshe_budui_idea_desc: "Bilden Sie in der Region „Gando“ an der mandschurischen Grenze eine Spezialeinheit mit ortskundigen Koreanern. Sie werden grausame und effiziente Mittel einsetzen, um antijapanische Guerillas in der Region zu eliminieren und dem Imperium ein Zeichen ihrer Treue zu erweisen."
  JKO_gongrongquan_jishi: "Eckpfeiler der Co-Prosperity Sphere für Großostasien"
  JKO_gongrongquan_jishi_desc: "[ROOT.GetNameDefCap] ist ein Mustergouvernement des Oberstaates und erhält somit entsprechende Investitionen, da auch der Oberstaat von der weiteren Entwicklung profitiert.\n§RWenn der Kongo kein Vasall von [JAP.GetNameDef] mehr ist, wird dieser Geist entfernt§!"
  JKO_gongrongquan_jishi_tt: "§RWenn [JKO.GetNameDef] keine Kolonie mehr ist, wird dieser Geist entfernt§!"
  JKO_nikanbudao_jiuxing_ideas: "Unglaublich, die gesamte Halbinsel schafft es nicht, eine einzige Fabrik für Spionageoperationen zusammenzukratzen"
  JKO_fangzhi_zibao: "Verhindern Sie die Selbstzerstörung des Spielers"
  JKO_JAP_yimin_kaishi: "Einwanderungswirtschaft"
  JKO_xiaomai_chukou_ideas: "Büro des Generalgouverneurs für Agrarimporte"
  ##################################
  ### 独立 ###
  ##################################
  JKO_bandao_duli_one_dynamic: "Geist der Bewegung des 1. März"
  JKO_bandao_duli_one_dynamic_desc: "26 Jahre Kolonialherrschaft haben wie eine harte und kalte Kruste alles in diesem Land unterdrückt. Die Polizei und die Gendarmen des Büros des Generalgouverneurs glaubten, alle Funken des Widerstands gelöscht zu haben, ahnten jedoch nicht, dass die wahren Flammen längst unter der Erde verschwunden waren. Wir werden diese verstreuten Funken zu einem unaufhaltsamen Feuer bündeln, das unter der Erde brodelt. Es wird Kraft sammeln, die Unterdrückung der alten Ära niederbrennen und eine neue Welt einläuten, die den Menschen gehört."
  JKO_resistance_against_colonial_rule_dm: "$KOR_resistance_against_colonial_rule_dm$"
  modify_JKO_bandao_duli_one_dynamic: "§Y$JKO_bandao_duli_one_dynamic$§! Zusätzliche Effekte:"
  JKO_fankangjun_dabenying_modifiers: "Garnison der Widerstandsarmee"
  JKO_tielue_huihuai_modifiers: "Widerstand der Eisenbahnguerilla"
  JKO_sizhan_butui: "§RWir schwören bis zum Tod, keine unterjochten Sklaven zu sein!§!"
  KOR_yilie_tuan_idea: "Uiyeoldan"
  KOR_yilie_tuan_idea_desc: "Egal wo wir sind, die Entschlossenheit, unser Heimatland zurückzuerobern, ist unser einziger Glaube. Diese Unnachgiebigkeit wird uns bis zum letzten Moment des Sieges tragen."
  KOR_shouzhiyu_jiangjieshi: "Vertrauen auf die Kuomintang"
  KOR_shouzhiyu_jiangjieshi_desc: "Die Unterstützung des Vorsitzenden Chiang ist für unser Überleben von entscheidender Bedeutung, aber sie setzt uns bei vielen Entscheidungen auch dem Einfluss anderer aus. Unsere Unabhängigkeit steht vor einer harten Prüfung."
  KOR_guoji_guli: "Internationale Isolation"
  KOR_guoji_guli_desc: "Nur wenige Länder der Welt erkennen unsere Legitimität an. Auf dem Schachbrett der Großmächte sind wir nur eine unbedeutende Figur, und der Weg der Diplomatie ist voller Dornen."
  KOR_liuwang_zhengfu: "Exilregierung"
  KOR_liuwang_zhengfu_desc: "Wir haben unsere Heimat verloren und können unter dem Schutz fremder Länder nur noch mit Mühe überleben. Die Erlasse der Regierung beschränken sich auf Ämter, und die fehlende Grundlage macht unseren Kampf mühsam."
  KOR_liuwang_zhengfu_modifiers: "$KOR_liuwang_zhengfu$"
  modify_KOR_liuwang_zhengfu_dynamic: "§Y$KOR_liuwang_zhengfu_modifiers$§! Zusätzlicher Effekt:"
  exiled_government_weekly_manpower_tt: "$MODIFIER_EXILED_GOVERNMENT_WEEKLY_MANPOWER$：$RIGHT|+$"
