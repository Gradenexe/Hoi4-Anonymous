l_german:

 italy.3.a:0 "§RWe must submit.§!"
 italy.3.b:0 "It shall not come to pass! Rally to Zog!"
 
 albania.1.t:0 "Albanian Partisans rise up in Italy"
 albania.1.d:0 ""
 albania.1.a:0 "For Albania!"
 albania.1.b:0 "What!"
 albania.2.t:0 "Capital of [ALB.GetNameDEF]"
 albania.2.d:0 "With the unification of Italy and Albania, we now wonder wether our Capital should move to the Italian Capital of Rome, or remain in Tirana."
 albania.2.a:0 "Rome is the logical choice."
 albania.2.b:0 "Tirana shall remain our capital."
 albania.3.t:0 "Albania Demands Peace"
 albania.3.d:0 "Albania has demanded that we make peace. The war has little support from our populace, declining might anger them."
 albania.3.a:0 "A white peace it is."
 albania.3.b:0 "We shall not back down!"
 albania.4.t:0 "Italy Accepts Peace"
 albania.4.d:0 "Italy picked the smart choice and accepted our demands."
 albania.4.a:0 "Glory to Albania!"
 albania.5.t:0 "Italy Rejects Peace"
 albania.5.d:0 "Italy has decided to ignore our demands."
 albania.5.a:0 "They will regret this!"
 albania.6.t:0 "[ALB.GetName] demands states in Levant"
 albania.6.d:0 "King Zog has demanded that we hand over their "rightful territory" in the middle east to them."
 albania.6.a:0 "Ludicrous!"
 albania.6.b:0 "We don't need it anyway"
 albania.7.t:0 "[FROM.GetName] denies our claim"
 albania.7.d:0 "[FROM.GetName] has refused to give us our rightful land!"
 albania.7.a:0 "They will regret this!"
 albania.8.t:0 "[FROM.GetName] accepts our claim"
 albania.8.d:0 "[FROM.GetName] has returned our rightful land."
 albania.8.a:0 "Splendid!"
 albania.9.t:0 "Our National Title"
 albania.9.d:0 "With the fall of the false Italian government, we now stand to choose what our great nation should be refered to as."
 albania.9.a:0 "We must remeber our Albanian roots!"
 albania.9.b:0 "We are the new Italy!"
 albania.10.t:0 "[ALB.GetName] seeks closer relations"
 albania.10.desc:0 "[ALB.GetName] wants to ensure continued friendly relations between our two nations. They promise a non-aggression pact along with free trade between us. This could secure one of our borders if a war should break out."
 albania.10.a:0 "We gracefully accept."
 albania.10.b:0 "We de not see any reason to."
 albania.11.t:0 "[YUG.GetName] accepts closer relations."
 albania.11.desc:0 ""
 albania.11.a:0 "Wonderful!"
 albania.12.t:0 "[YUG.GetName] rejects closer relations."
 albania.12.desc:0 ""
 albania.12.a:0 "A shame!"
 albania.13.t:0 "[ALB.GetName] Demands Kosovo"
 albania.13.desc:0 "The state of [ALB.GetName] is demanding control of [802.GetName], claiming we are oppressing the Albanian people in the region. They are threatening to use force if we do not yield."
 albania.13.a:0 "There is nothing we can do."
 albania.13.b:0 "We shall not give an inch!"
 albania.14.t:0 "[YUG.GetName] forfeits [802.GetName] to us."
 albania.14.desc:0 ""
 albania.14.a:0 "An easy victory."
 albania.15.t:0 "[YUG.GetName] Rejects Ultimatum."
 albania.15.desc:0 ""
 albania.15.a:0 "They will regret this."
 albania.16.t:0 "[ALB.GetName] Claims [802.GetName]"
 albania.16.desc:0 "The government of [ALB.GetName] has increased rhetoric on unification with Albanians outside their borders. The focus is especially on our region of Kosovo which contains a sizable amount of Albanians."
 albania.16.a:0 "Worrying..."
 albania.17.t:0 "[ALB.GetName] is Influencing Our Politics"
 albania.17.desc:0 "Diplomatic pressure from the government of [ALB.GetName] has begun influencing our foreign politics."
 albania.17.a:0 "What could they mean by this?"
 albania.18.t:0 "[ALB.GetName] wants Mutual Guarantees"
 albania.18.desc:0 "[ALB.GetName] is requesting mutual guarantees between our two nations."
 albania.18.a:0 "A worthwile deal."
 albania.18.b:0 "We cannot commit to such a deal."
 albania.19.t:0 "[FROM.GetName] agrees to Mutual Guarantees"
 albania.19.desc:0 ""
 albania.19.a:0 "Splendid."
 albania.20.t:0 "[FROM.GetName] rejects Mutual Guarantees"
 albania.20.desc:0 ""
 albania.20.a:0 "Regretful..."
 albania.21.t:0 "[ALB.GetName] invites us to their faction"
 albania.21.desc:0 "Albania has sent diplomats to formally invite us to their faction in a defensive and offensive alliance to safeguard the balkans."
 albania.21.a:0 "A great idea!"
 albania.21.b:0 "An unnecessary precaution."
 albania.22.t:0 "[FROM.GetName] agrees to join [ROOT.GetFactionName]"
 albania.22.desc:0 "[FROM.GetName] has decided to agree to our faction proposal.
 albania.22.a:0 "Good news."
 albania.23.t:0 "[FROM.GetName] rejects inviation to [ROOT.GetFactionName]"
 albania.23.desc:0 "[FROM.GetName] has decided to reject our invitation to [ROOT.GetFactionName].
 albania.23.a:0 "Their loss."