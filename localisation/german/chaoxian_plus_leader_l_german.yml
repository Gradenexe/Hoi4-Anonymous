l_german:
  ##################################
  ### 介绍
  ##################################
  KOR_GATHERING_STORM_DESC: "Fünftausend Jahre Zivilisation haben in diesem Land, das als „Dreitausend Li der wunderschönen Flüsse und Berge“ bekannt ist, eine helle Galaxie hervorgebracht. Doch seit der Gengxu-Nationaldemütigung liegt seit 26 Jahren der Schatten des Imperiums über diesem Land. Die eiserne Faust des Büros des Generalgouverneurs, die Welle der Japanisierung, die allmählich vergessene Sprache und die erschöpften Ressourcen sind wie ein endloser Winter. Jetzt verändert sich die Welt, der Krieg des Imperiums auf dem Festland wird immer härter und auch im fernen Europa ziehen Kriegswolken zusammen. Chancen und Gefahren existieren nebeneinander, und vor allen steht eine tiefgreifende Frage: Sich dafür entscheiden, unter den Fittichen des Imperiums zu bleiben, Gehorsam gegen die Früchte und die Ordnung der Modernisierung einzutauschen, ein Vorbild für die „interne Korea-Japan-Integration“ zu werden und in den Ritzen nach Überleben und Entwicklung zu streben? Oder entscheiden Sie sich dafür, die unterirdischen Flammen zu entzünden, in die Fußstapfen Ihrer Vorfahren zu treten und sich auf einen dornigen und blutigen Weg zu begeben, um wahre Unabhängigkeit und Ruhm wiederzuerlangen? Diese dreitausend Li aus Flüssen und Bergen stehen still am Scheideweg des Schicksals und warten darauf, dass ihr Volk eine Entscheidung trifft."
