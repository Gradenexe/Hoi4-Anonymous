  ##
  KOR_yananpai_chengyuan: "Yan'an-Fraktion"
  KOR_yananpai_chengyuan_desc: "Bezieht sich auf eine Fraktion innerhalb der Arbeiterpartei Koreas in den frühen Tagen ihrer Gründung. Die meisten Mitglieder der Yan'an-Fraktion waren Koreaner, die in den 1930er Jahren an der Revolution in Yan'an, dem Stützpunktgebiet der Kommunistischen Partei Chinas, teilnahmen."
  KOR_nanlao_pai: "Südarbeitsfraktion"
  KOR_nanlao_pai_desc: "Die südkoreanische Arbeiterpartei war eine kommunistische politische Partei in der Geschichte der koreanischen Halbinsel. Nach der Gründung der Demokratischen Volksrepublik Korea fusionierte sie mit der Arbeiterpartei Koreas, und die Fraktion, die sich aus ehemaligen Mitgliedern der südkoreanischen Arbeiterpartei zusammensetzte, wurde „Inlandsfraktion“ oder „Südliche Arbeiterparteifraktion“ genannt."
  KOR_kanglian_junshi: "Guerilla-Fraktion"
  KOR_kanglian_junshi_desc: "Es bezieht sich auf eine Fraktion innerhalb der Arbeiterpartei Koreas, der Regierungspartei der Demokratischen Volksrepublik Korea nach dem Zweiten Weltkrieg. Die meisten ihrer Mitglieder waren Guerillas, die in Mandschukuo und der Sowjetunion aktiv waren, um sich der japanischen Kolonialherrschaft über Korea zu widersetzen."
  KOR_sulian_pai: "Sowjetische Fraktion"
  KOR_sulian_pai_desc: "Die Sowjetische Fraktion bezeichnet eine Fraktion innerhalb der Arbeiterpartei Koreas, der Regierungspartei der Demokratischen Volksrepublik Korea nach dem Zweiten Weltkrieg. Die meisten seiner Mitglieder waren Koreaner aus der Sowjetunion."
  ##
  KOR_huangjia_xuetong: "Edle Blutlinie"
  KOR_huangjia_xuetong_desc: "Dieser Charakter ist ein Nachkomme der Adligen der koreanischen Yi-Dynastie."
  ##
  KOR_Fear_of_the_investigation_committee: "Angst vor dem Anti-Verräter-Sonderkomitee"
  KOR_Fear_of_the_investigation_committee_desc: "Dieser Person droht ernsthaft die Verhaftung durch das Anti-Verräter-Sonderkomitee. Aus Angst vor dem Vorwurf, mit Japan zusammenzuarbeiten, kann er seinen Pflichten nicht in vollem Umfang nachkommen. Seine persönlichen Fähigkeiten wurden ernsthaft beeinträchtigt."
  KOR_Fear_of_the_investigation_committee_tt: "Dieses Merkmal wird erst entfernt, wenn der nationale Fokus §Y$KOR_yongyuan_de_guofu$§! abgeschlossen ist."
