  operation_JKO_sheri_xingdong: "Ermorde $JAP_hirohito$"
  operation_JKO_sheri_xingdong_desc: "Vor dem Hintergrund der Annexion der koreanischen Halbinsel durch Japan widmeten sich zahlreiche Menschen mit hohen Idealen der Sache der nationalen Unabhängigkeit und Befreiung. Am 8. Januar 1932 warf Lee Bong-chang, ein koreanischer Unabhängigkeitsaktivist, eine Granate auf die Kutsche von Kaiser Hirohito von Showa in der Nähe des Sakurada-Tors in Tokio, Japan, um ihn zu ermorden. Leider reichte die Granate nicht aus und traf die Kutsche des Kaisers nicht, so dass das Attentat scheiterte. Lee Bong-chang wurde sofort festgenommen und später zum Tode verurteilt. Dieser Vorfall ist als „Sakurada-Tor-Vorfall“ bekannt, der die Moral des damaligen Widerstands gegen den japanischen Imperialismus erheblich stärkte."
  operation_JKO_sheri_xingdong_1_tt: "Wir werden versuchen, $JAP_hirohito$ zu ermorden. Dieser Vorgang ist jedoch äußerst riskant und kann fehlschlagen."

