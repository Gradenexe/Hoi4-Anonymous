  ### 开局ai
  ##################################
  JKO_AI_BEHAVIOR: "@JKO Generalgouverneur von Korea"
  RULE_OPTION_HISTORICAL_JKO_AI_DESC: "Die KI des Generalgouverneurs von Korea wird der historischen Ereigniskette so weit wie möglich folgen."
  RULE_OPTION_ARMED_RESISTANCE: "Bewaffneter Aufstand"
  RULE_OPTION_ARMED_RESISTANCE_JKO_AI_DESC: "Die KI des Generalgouverneurs von Korea wird versuchen, den japanischen Kolonialisten Widerstand zu leisten." 
  KOR_AI_BEHAVIOR: "@KOR Korea"
  RULE_OPTION_HISTORICAL_KOR_AI_DESC: "Die koreanische KI wird der historischen Ereigniskette so weit wie möglich folgen."
  RULE_OPTION_COMMUNIST_YANANPAI: "Kommunismus – Yan'an-Fraktion gewinnt"
  RULE_OPTION_COMMUNIST_YANANPAI_KOR_AI_DESC: "Die koreanische KI bewegt sich durch eine beratende Konferenz in Richtung Kommunismus, und letztendlich gewinnt die Yan'an-Fraktion die Wahl erfolgreich." 
  RULE_OPTION_COMMUNIST_NANLAOPAI: "Kommunismus – Südarbeiterfraktion gewinnt"
  RULE_OPTION_COMMUNIST_NANLAOPAI_KOR_AI_DESC: "Die koreanische KI bewegt sich durch eine beratende Konferenz in Richtung Kommunismus, und letztendlich gewinnt die South Labour Faction die Wahl erfolgreich." 
  RULE_OPTION_COMMUNIST_MANZHOUPAI: "Kommunismus – mandschurische Fraktion gewinnt"
  RULE_OPTION_COMMUNIST_MANZHOUPAI_KOR_AI_DESC: "Die koreanische KI bewegt sich durch eine beratende Konferenz in Richtung Kommunismus, und letztendlich gewinnt die Mandschurei-Fraktion die Wahl erfolgreich." 
  RULE_OPTION_COMMUNIST_SULIANPAI: "Kommunismus – Sowjetfraktion gewinnt"
  RULE_OPTION_COMMUNIST_SULIANPAI_KOR_AI_DESC: "Die koreanische KI bewegt sich durch eine beratende Konferenz in Richtung Kommunismus, und letztendlich gewinnt die Sowjetfraktion die Wahl erfolgreich." 
  RULE_OPTION_DEMOCRATIC_JINJIU: "Demokratismus – Demokratische Linke siegt"
  RULE_OPTION_DEMOCRATIC_JINJIU_KOR_AI_DESC: "Der Demokratische Linke Flügel der koreanischen KI gewinnt die Konsultationskonferenz und versöhnt die Kommunisten, um zur Avantgarde der kolonialen Befreiung zu werden." 
  RULE_OPTION_DEMOCRATIC_LICHENGWAN: "Demokratismus – die demokratische Rechte gewinnt"
  RULE_OPTION_DEMOCRATIC_LICHENGWAN_KOR_AI_DESC: "Der demokratische rechte Flügel der koreanischen KI gewinnt die Konsultationskonferenz, säubert die Provisorische Regierung und die Kommunisten und dominiert schließlich die asiatische Hegemonie." 
  RULE_OPTION_NEUTRALITY_LVYUNHENG: "Neutralismus – Der neutrale linke Flügel gewinnt"
  RULE_OPTION_NEUTRALITY_LVYUNHENG_KOR_AI_DESC: "Der neutrale linke Flügel der koreanischen KI gewinnt die Konsultationskonferenz, lädt Demokraten und Kommunisten ein, ins Parlament einzutreten, und unterzeichnet einen Nichtangriffspakt mit neutralen asiatischen Ländern, um zu verhindern, dass das Land in einen Krieg gerät." 
  NEUTRALITY_JUNZHULIXIAN: "Neutralismus – Gründung einer konstitutionellen Monarchie"
  NEUTRALITY_JUNZHULIXIAN_KOR_AI_DESC: "Die koreanische KI bewegt sich durch eine beratende Konferenz in Richtung einer konstitutionellen Monarchie, lädt asiatische Monarchien ein und dominiert letztendlich die asiatische Hegemonie." 
  RULE_OPTION_FASCIST_DAHANDIGUO: "Faschismus – Großes Koreanisches Reich"
  RULE_OPTION_FASCIST_DAHANDIGUO_KOR_AI_DESC: "Die beratende Konferenz der koreanischen KI scheitert, stellt die königliche Familie wieder her, beansprucht Dangun Joseon und dominiert schließlich die asiatische Hegemonie." 
  RULE_OPTION_EASTER_EGG_ONE: "Christlicher Katholizismus – Das Reich Gottes"
  RULE_OPTION_EASTER_EGG_ONE_KOR_AI_DESC: "Der demokratische rechte Flügel der koreanischen KI gewinnt, der Apostolische Vikar von Seoul kommt an die Macht und beginnt schließlich einen heiligen Krieg gegen nichtkatholische Länder in Asien." 
