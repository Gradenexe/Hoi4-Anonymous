  KOR_baodanqiang_tech: "Bolter"
  KOR_baodanqiang_tech_desc: "Diese Waffe umfasst Pistolen, Gewehre, Maschinengewehre und andere Formen, die zu ultimativen, Expeditions-, Ketzer- und anderen Modellen weiterentwickelt wurden und optische Visiere und Bajonettmodifikationen unterstützen."
  KOR_donglijia_tech: "Kriegsmaschine: „Hwanung“"
  KOR_donglijia_tech_desc: "Power-Rüstungen integrieren exklusive Waffen wie Sturmbolter und Power-Fäuste."
  KOR_huopaoyunbingche_tech: "Kriegsmaschine: „Ungnyeo“"
  KOR_huopaoyunbingche_tech_desc: "Es handelt sich um echte mobile Festungen, und die Feuerkraft aller elf Geschütze verschiedener Typen ist für eine Panzerkompanie oder Infanteriekompanie unerreichbar. Infanterie und kleine Kreaturen werden durch Salven von Bolterfeuer und hochexplosiven Granaten ausgelöscht, riesige Bestien und gepanzerte Fahrzeuge kämpfen darum, den Salven von Giftkanonen und Laserkanonen standzuhalten, und jene Befestigungen, die sich für uneinnehmbar halten, werden schließlich mit einem einzigen Schuss des Zerstörermörsers zerstört, sodass nur noch Trümmer zurückbleiben, die die Lektion über die arrogante Unterschätzung des Feindes erzählen."
