  ##################################
  KOR_Asian_Anti_Communist_League: "Asiatische Antikommunistische Liga"
  KOR_Asian_Anti_Communist_League_desc: "Angesichts der Gefahr einer imperialistischen Expansion kann kein Land allein bestehen. Wir müssen die Initiative ergreifen, regionale Sicherheitsverantwortung zu übernehmen, freie Länder in Asien zu vereinen und ein eigenes gemeinsames Verteidigungssystem aufzubauen, das ein solider Schutzschild gegen die Kolonialwelle sein wird."
  KOR_Asian_Democratic_Alliance: "Asiatische Demokratische Allianz"
  KOR_Asian_Democratic_Alliance_desc: "Die demokratischen Länder Asiens müssen sich zusammenschließen, um gemeinsam gegen die imperialistische Expansion und die Wiederherstellung des Autoritarismus vorzugehen. Wir werden die Gründung einer „Asian Democratic Alliance“ initiieren und alle asiatischen Länder, die an Freiheit und demokratische Werte glauben, zum Beitritt einladen. Dieses Bündnis wird zu einer starken Festung der freien Welt in dieser Region werden."
  KOR_Asian_Defense_Pact: "Asiatischer Verteidigungspakt"
  KOR_Asian_Defense_Pact_desc: "Wir werden unsere Positionen gemeinsam koordinieren, für Wärme zusammenhalten und unsere gemeinsame Unabhängigkeit und unseren Frieden in den Ritzen zwischen Giganten wahren."
  KOR_Asian_Monarchist_United_Front: "Mandat der Heaven Alliance"
  KOR_Asian_Monarchist_United_Front_desc: "Im Osten ist das „Mandat des Himmels“ die ultimative Quelle der herrschenden Legitimität. Indem wir alle Regime vereinen, die an das göttliche Recht der Könige glauben oder diese respektieren, werden wir gemeinsam dem Atheismus und der Häresie des „Volkswillens“ widerstehen und die heilige monarchische Macht verteidigen."
  KOR_wangdao_tongyu_dongya_zhenying: "Co-Prosperity Sphere im Großraum Ostasien (Wangdao Lete)"
  KOR_wangdao_tongyu_dongya_zhenying_desc: "Das Chaos in Ostasien ist ausschließlich auf den Verlust der wahren „Wangdao“-Führung (Königlicher Weg) zurückzuführen. Unser Großes Koreanisches Reich wird diesem Land mit seiner überlegenen Kultur und seinem gütigen Monarchen wieder Ordnung und Frieden bringen. Erziehen Sie die Barbaren mit „Wangdao“ und regieren Sie alle Nationen mit „wohlwollender Regierungsführung“."
  KOR_the_kingdom_of_God: "Das Reich Gottes"
  KOR_the_kingdom_of_God_desc: "Mit dem Aufstieg von Bischof $JKO_Archbishop_Roh_Paul$ und seiner erneuten Entwicklung zu einer mächtigen Großmacht ist es für uns an der Zeit, uns an alle gläubigen Christen zu wenden und ihnen Führung zu geben, so wie ein Hirte seine Herde führt und sie vor dem Bösen beschützt. Das ist Gottes Gebot!"
