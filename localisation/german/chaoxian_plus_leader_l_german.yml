  ##飞机
  KOR_changpaoguan_zidongpao: "Einzelne Langlauf-Autokanone"
  KOR_changpaoguan_zidongpao_desc: "Hierbei handelt es sich um eine einzelne Flugzeug-Autokanone mit verlängertem Lauf, die die Mündungsgeschwindigkeit und effektive Reichweite des Projektils erhöhen soll, insbesondere für den Angriff auf Bomber oder gepanzerte Bodenziele."
  KOR_shuanglian_zidongpao: "Zwillingsautokanone"
  KOR_shuanglian_zidongpao_desc: "Durch die Parallelschaltung zweier Maschinenkanonen zielt diese Waffenkonfiguration darauf ab, die Munitionsabgaberate pro Zeiteinheit deutlich zu erhöhen und dadurch die Trefferquote und Schadenseffizienz zu verbessern."
  KOR_jiguangpao: "Einzelne Laserkanone"
  KOR_jiguangpao_desc: "Dabei handelt es sich um eine luftgestützte Energiewaffe, die durch die Emission hochenergetischer Laserstrahlen präzise Schläge erzielt. Sein Hauptnachteil ist die Notwendigkeit einer riesigen Energieversorgung."
  KOR_diyudaji_daodan: "Hellstrike-Rakete"
  KOR_diyudaji_daodan_desc: "Hierbei handelt es sich um eine Luft-Boden-Rakete, die mit einem Brand- oder thermobaren Sprengkopf mit großer Sprengkraft ausgestattet ist und verheerende Angriffe auf großflächige Zielregionen auslöst."
  KOR_denglizi_chongya_yinqing: "Plasma-Staustrahltriebwerk"
  KOR_denglizi_chongya_yinqing_desc: "Hierbei handelt es sich um ein fortschrittliches Staustrahltriebwerk, das mit hoher Geschwindigkeit einströmende Luft zum Ausstoß in Plasma ionisiert, um einen effizienten Antrieb bei Überschallgeschwindigkeit zu erreichen."
  KOR_gaochuli_wolun_yinqing: "Hochleistungs-Turbinenmotor"
  KOR_gaochuli_wolun_yinqing_desc: "Hierbei handelt es sich um ein Turbinentriebwerk, das auf höchste Leistung ausgelegt ist und durch Erhöhung der internen Betriebstemperatur und des Betriebsdrucks eine höhere Schubleistung der Einheit erreicht."
  KOR_kongkong_leida: "Luft-Luft-Avioniksystem"
  KOR_kongkong_leida_desc: "Hierbei handelt es sich um ein elektronisches Gerät, das Radar, Feuerleitung und Zielerkennung integriert und dazu dient, die Zielerkennungsfähigkeit des Flugzeugs und die Genauigkeit der Waffenführung im Luftkampf zu verbessern."
  ##坦克
  KOR_juxing_jianongpao: "Riesige Kampfkanone"
  KOR_juxing_jianongpao_desc: "Dies ist eine experimentelle Panzerkanone mit extragroßem Kaliber. Es opfert Mobilität und Zuverlässigkeit im Austausch für extreme Schadenseffizienz gegen schwer gepanzerte Ziele."
  KOR_tongzhou_zidongpao: "Koaxiale Autokanone"
  KOR_tongzhou_zidongpao_desc: "Eine koaxial zum Hauptgeschütz montierte Schnellfeuerwaffe, die hauptsächlich dazu dient, feindliche Infanterie zu unterdrücken oder auf leicht gepanzerte Ziele zu reagieren und das Hauptgeschütz im Nahbereich bei Feuerunterstützung zu unterstützen."
  KOR_gongchengzhe_jiupao: "Zerstörer-Belagerungsmörser"
  KOR_gongchengzhe_jiupao_desc: "Hierbei handelt es sich um einen großkalibrigen Mörser mit gebogenem Feuer, der auf einem Fahrzeugchassis montiert ist und speziell für die Zerstörung starker Verteidigungsanlagen entwickelt wurde, mit extrem hoher Schadenseffizienz gegen statische Ziele."
  KOR_paota_jiguang_pao: "Geschützturm-Laserkanone"
  KOR_paota_jiguang_pao_desc: "Eine auf einem Turm montierte gerichtete Energiewaffe. Es durchdringt Panzerungen, indem es hochenergetische Laserstrahlen mit extrem hoher Präzision aussendet, erfordert jedoch einen enormen Stromverbrauch."
  KOR_shuanglian_baoshi_qiang: "Schwerer Zwillingsbolter"
  KOR_shuanglian_baoshi_qiang_desc: "Hierbei handelt es sich um eine automatische Zwillingswaffe, die durch das Abfeuern kleiner Sprengmunition mit hoher Geschwindigkeit Infanterieverbände effizient töten und leichte Ziele unterdrücken kann."
  tank_fanyingdui_fadongji: "Reaktormotor mit thermischer Brennkammer"
  tank_fanyingdui_fadongji_desc: "Hierbei handelt es sich um ein fortschrittliches Hybrid-Energiesystem, das einen kleinen Reaktor mit einer thermischen Brennkammer integriert, die die Leistungsabgabe dynamisch an die Kampfanforderungen anpassen kann, um Energieverbrauch und Leistung in Einklang zu bringen."
