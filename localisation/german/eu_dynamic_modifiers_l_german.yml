 eu_european_community: "Europäische Gemeinschaft"
 eu_european_community_desc: "Je weiter sich unsere Nationen integrieren, desto größer werden die Vorteile der Europäischen Gemeinschaft. Die Politik, die wir verfolgen, und die Institutionen, die wir aufbauen, verwandeln Europa langsam in eine wahre Supermacht."
