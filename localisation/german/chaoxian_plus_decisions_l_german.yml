  KOR_communism_management_category_decisions: "[KOR.GetAdjective] Fraktionsmanagement"
  KOR_yanan_pai_gui_txt: "Yan'an-Fraktion: Bezieht sich auf eine Fraktion innerhalb der Arbeiterpartei Koreas in ihren frühen Gründungstagen. Die meisten Mitglieder der Yan'an-Fraktion waren Koreaner, die in den 1930er Jahren an der Revolution in Yan'an, dem Stützpunktgebiet der Kommunistischen Partei Chinas, teilnahmen. Sie gründeten nacheinander die Koreanische Unabhängigkeitsallianz und die Koreanische Neue Volkspartei. Die KP Chinas hatte ursprünglich vor, §YMu Ting§!, ein Mitglied der Yan'an-Fraktion, dabei zu unterstützen, der oberste Führer Koreas zu werden, doch Stalin unterstützte §YKim Il-sung§! nachdrücklich, und letztendlich setzte sich die KPdSU durch."
  KOR_jinricheng_gui_txt: "Guerilla-Fraktion: Auch als Anti-Japanische Alliierte Armee-Fraktion oder Mandschurische Fraktion bekannt, bezieht sie sich auf eine Fraktion innerhalb der Arbeiterpartei Koreas, der Regierungspartei der Demokratischen Volksrepublik Korea nach dem Zweiten Weltkrieg. Die meisten ihrer Mitglieder waren Guerillas, die in Mandschukuo und der Sowjetunion gegen die japanische Kolonialherrschaft über Korea aktiv waren und von §YPak Kum-chol§! und §YKim Il-sung§! angeführt wurden. Von den 1950er bis 1960er Jahren eliminierte §YKim Il-sung§! durch den August-Fraktionsvorfall nacheinander die Yan'an-Fraktion, die Sowjetfraktion und die Inlandsfraktion. Seitdem hat sich die Guerilla-Fraktion zur größten Fraktion in der Arbeiterpartei Koreas entwickelt."
  KOR_puxianyong_gui_txt: "South Labour Faction: Die südkoreanische Arbeiterpartei, abgekürzt South Labour Party, war eine kommunistische politische Partei in der Geschichte der koreanischen Halbinsel. Nach der Gründung der Demokratischen Volksrepublik Korea fusionierte sie mit der Arbeiterpartei Koreas, und die Fraktion, die sich aus ehemaligen Mitgliedern der Südlichen Arbeiterpartei zusammensetzte, wurde „Inländische Fraktion“ oder „Südliche Arbeiterfraktion“ genannt. Nach dem Waffenstillstand im Koreakrieg wurden ehemalige Mitglieder der South Labour Party zum Ziel der Säuberung durch §YKim Il-sung§!."
  KOR_xujiayi_gui_txt: "Sowjetfraktion: Bezieht sich auf eine Fraktion innerhalb der Arbeiterpartei Koreas, der nach dem Zweiten Weltkrieg regierenden Partei der Demokratischen Volksrepublik Korea. Die meisten seiner Mitglieder waren Koreaner aus der Sowjetunion, angeführt von §YHo Ka-i§! und §YPak Chang-ok§!. In den 1950er Jahren wurde diese Fraktion von §YKim Il-sung§! gesäubert."
