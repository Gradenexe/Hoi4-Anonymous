  JKO_xunlian_guangfujun: "Bilden Sie die Befreiungsarmee aus"
  JKO_xunlian_guangfujun_tt: "Erhalten Sie nach Ausbruch des Unabhängigkeitskrieges §Y3§! §YKoreanische Befreiungsarmee§! aus Infanterie bestehende Einheiten."
  JKO_zhiyuan_guangfujun: "Unterstützen Sie die koreanische Befreiungsarmee"
  JKO_zhiyuan_guangfujun_tt: "§YBefreiungsarmee§! Erfahrung wird zu §YGut ausgebildete§!, fügen Sie §G2 Artilleriebataillone§!, 1 §YIngenieurkompanie§!, 1 §YAufklärungskompanie§! und 1 §YArtillerieunterstützungskompanie§! hinzu."
  JKO_goumai_waiguo_feiji: "Kaufen Sie [FROM.GetNameDef]-Flugzeuge"
  JKO_goumai_waiguo_feiji_tt: "Nach Ausbruch des Unabhängigkeitskrieges erhalten Sie §Y30§! Jäger und §Y20§! Bomber.\n\nNach Kriegsbeginn werden wir in der Hauptstadt §YLevel 1 §!$air_base$ bauen"
  JKO_qingqiu_daguo_xiezhu: "Bitten Sie [FROM.GetNameDef], unsere Unabhängigkeit zu unterstützen"
  JKO_qingqiu_daguo_xiezhu_desc: "Die Mission der Gesandten besteht darin, die zahlreichen Hindernisse der japanischen Delegation zu umgehen und unsere Stimme direkt dem Ligarat vorzulegen. Allerdings sind die Weltmächte damit beschäftigt, die zunehmend angespannte Lage in Europa zu bewältigen. Werden sie sich dafür entscheiden, auf den Schrei einer unterdrückten Nation im Fernen Osten zu hören, oder werden sie die Augen verschließen? Unser Schicksal hängt in der Schwebe."
  JKO_qingqiu_daguo_xiezhu_tt: "Basiswahrscheinlichkeit für Erfolg/Misserfolg: §Y10/10§!\n\nWenn die Bewertung §Ygrößer als 50§! ist, beträgt die Erfolgs-/Misserfolgswahrscheinlichkeit §Y50/10§!\nWenn die Bewertung §Yniedriger als 50§! ist, beträgt die Erfolgs-/Misserfolgswahrscheinlichkeit §Y10/20§!."
