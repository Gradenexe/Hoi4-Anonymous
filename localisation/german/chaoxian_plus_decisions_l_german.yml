  KOR_election_decision_category_desc: "Das japanische Imperium ist krachend zusammengebrochen und zum ersten Mal ist der Himmel über Korea frei vom Schatten der Kolonialisten. Verschiedene politische Kräfte aus dem Untergrund, Übersee und den Bergwäldern haben sich in Seoul zusammengeschlossen, und eine Konferenz zur Entscheidung über das Schicksal der Nation steht kurz bevor. Aber unter der Oberfläche der Einheit brodeln Unterströmungen …"
