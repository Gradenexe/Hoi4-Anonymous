  KOR_yindao_ruoxiao_guojia_decisions_desc: "[GetKORYindaoRuoxiaoGuojiaDecisions]"
  KOR_yindao_ruoxiao_guojia_key: "Wir haben Unterdrückung erlitten, daher können wir den Schmerz schwacher Länder am besten verstehen. Jetzt liegt es in unserer Verantwortung, ihnen als Führer zur Seite zu stehen und ihnen dabei zu helfen, einen unabhängigen Weg in der Kluft zwischen Imperialismus und Hegemonismus zu finden. Unsere Erfahrung wird zu ihrem wertvollen Kapital und unsere Stärke wird ihr solider Rückhalt sein."
  KOR_yiguojiancheng_shehuizhuyi_key: "Wenn Moskau im Revisionismus versinkt, braucht das Weltproletariat ein neues revolutionäres Zentrum. Pjöngjang mit seiner reinsten revolutionären Linie und seinem stärksten Kampfwillen verdient es, dieses Zentrum zu sein. Revolutionäre aus der ganzen Welt werden von uns lernen und unsere Führung akzeptieren, bis überall auf der Welt die rote Fahne gehisst wird."
