  JKO_huangminhua_yundong_decisions: "Entwicklungsplan für die koreanische Halbinsel"
  JKO_huangminhua_yundong_decisions_desc: "As early as 1910, Korea signed the Japan-Korea Annexation Treaty with our country, and the Korean Peninsula was formally incorporated into the Empire of Japan, making Korea our colony. Korea permanently ceded all its sovereignty to the Empire. The Empire established a Governor-General in Korea, who was directly subordinate to the Emperor of Japan and responsible for exercising legislative, judicial and administrative powers in Korea. Since then, large-scale infrastructure construction has been carried out on the Korean Peninsula, the population has grown, the literacy rate has continued to rise, and the hierarchical system of Korean society has been abolished.\n\nMost of the peninsula's mineral resources are distributed in the north and scarce in the south. We will continue the economic construction of the Korean Peninsula with the pattern of agriculture in the south and industry in the north. Develop industry in the north; the south has a more maritime climate, making it a naturally excellent harbor for developing agriculture and the navy."
  JKO_huangmin_yundong_kaishi: "Starten Sie die Kominka-Bewegung"
  JKO_huangminhua_yundong_decisions_desc: "Die Kominka-Bewegung zielte darauf ab, das Kriegssystem durch spirituelle Mobilisierung und kulturelle Integration zu stärken, „kaiserliche Bürger“ zu formen, die dem Kaiser treu waren, bereit, ihr Leben für den Krieg zu opfern, und die sich voll und ganz mit der Herrschaft der Regierung des Kaiserreichs Japan und dem kaiserlichen System innerhalb des gesamten Kaiserreichs identifizierten und diesen gehorchten, und ethnische Gruppen mit unterschiedlichen Kulturen zu einem vollständigen japanischen Volk zu assimilieren, um seinen allgemeinen Kriegszielen zu dienen."
  JKO_import_imperial_way_buddhism_decision: "Einführung in den Imperial Way Buddhismus"
  JKO_one_people_united_under_shinto_decision: "Eine geeinte Nation im Shintoismus"
  JKO_state_shinto_in_education_decision: "Staatliche Shinto-Ausbildung"
  JKO_Amaterasu_spiritual_realm_decision: "Die göttliche Manifestation von Amaterasu Omikami"
  JKO_zhiyi_linshizhengfu_decisions: "Diskreditieren Sie [KOR.GetLeader]"
  JKO_zhiyi_linshizhengfu_decisions_desc: "Wir werden den Menschen auf der Halbinsel zeigen, wie [KOR.GetLeader] wie ein Feigling floh und nun in müßiger Ausschweifung in einem fremden Land lebt. Damit könnten wir einige dazu anregen, für uns zu kämpfen und den Ruf des ehemaligen Herrschers völlig ruinieren."

  KOR_duli_chaoxian_one_decisions: "Der flatternde Taegeukgi"
  KOR_duli_chaoxian_one_decisions_desc: "26 Jahre Kolonialherrschaft haben wie eine harte und kalte Kruste alles in diesem Land unterdrückt. Die Polizei und die Gendarmen des Büros des Generalgouverneurs glaubten, alle Funken des Widerstands gelöscht zu haben, ahnten jedoch nicht, dass die wahren Flammen längst unter der Erde verschwunden waren. Wir werden diese verstreuten Funken zu einer unaufhaltsamen Flamme sammeln, die unter der Erde lodert. Es wird Kraft sammeln, die Unterdrückung der alten Ära niederbrennen und eine neue Welt einläuten, die den Menschen gehört."
  JKO_chaoxian_de_gandi_mission: "Öffentliche Spendenaktion"
  JKO_chaoxian_de_gandi_mission_tt: "Durch Spende gesammelte Mittel: £pol_power §Y[?KOR.JKO_mujuan_zhongchou_pp]§!"

  KOR_jiesuan_decision_cost_pp: "Gesamtkosten nach der Unabhängigkeit: £pol_power §Y[?KOR.KOR_jiesuan_jine_pp]§!"
