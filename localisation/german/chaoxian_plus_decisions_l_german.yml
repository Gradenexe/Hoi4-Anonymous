  KOR_chaoxian_jiefang: "Koreanischer Unabhängigkeitskrieg"
  KOR_chaoxian_jiefang_desc: "26 Jahre Kolonialherrschaft haben wie eine harte und kalte Kruste alles in diesem Land unterdrückt. Die Polizei und die Gendarmen des Büros des Generalgouverneurs glaubten, alle Funken des Widerstands gelöscht zu haben, ahnten jedoch nicht, dass die wahren Flammen längst unter der Erde verschwunden waren. Wir werden diese verstreuten Funken zu einer unaufhaltsamen Flamme sammeln, die unter der Erde lodert. Es wird Kraft sammeln, die Unterdrückung der alten Ära niederbrennen und eine neue Welt einläuten, die den Menschen gehört."
