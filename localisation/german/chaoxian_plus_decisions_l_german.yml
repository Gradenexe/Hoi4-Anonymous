  JKO_yinshua_dixia_kanwu: "Drucken Sie Untergrundpublikationen"
  JKO_yinshua_dixia_kanwu_tt: "Manchmal ist Tinte stärker als Kugeln. Wir werden geheime Druckstellen einrichten, Worte als Schwerter einsetzen, um den Feind zu erstechen, die Lügen des Büros des Generalgouverneurs aufdecken, das schlafende Volk wecken und die Idee der Unabhängigkeit im Dunkeln verbreiten lassen."
  JKO_xijicangku_bubing: "Angriff auf das Waffenlager der Infanterie"
  JKO_xijicangku_bubing_tt: "Zu Beginn des Unabhängigkeitskrieges erhalten wir §G500§!§Y Infanterieausrüstung§!, während der Feind eine kleine Strafe für 180 Tage erhält"
  JKO_xijicangku_paobing: "Angriff auf Artillerielager"
  JKO_xijicangku_paobing_tt: "Zu Beginn des Unabhängigkeitskrieges erhalten wir §G250§!§Y Artillerieausrüstung§!, während der Feind 180 Tage lang eine kleine Strafe erhält"
  JKO_xijicangku_kache: "Angriffs-LKW-Lager"
