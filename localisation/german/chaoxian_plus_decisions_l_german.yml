  JKO_zai_beifang_jianli_dabenying: "Errichten Sie Widerstandslager im Norden"
  JKO_zai_beifang_jianli_dabenying_desc: "Wir werden Nordkorea als unsere Widerstandsbasis gegen japanische Kolonialisten wählen"
  JKO_zai_beifang_jianli_dabenying_tt: "§RDiese Entscheidung und $JKO_zai_nanfang_jianli_dabenying$§! schließen sich gegenseitig aus"
  JKO_zai_nanfang_jianli_dabenying: "Errichten Sie Widerstandslager im Süden"
