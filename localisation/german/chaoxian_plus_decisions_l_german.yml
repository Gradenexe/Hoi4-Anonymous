  KOR_gongyexian_decision: "Plan zur industriellen Erholung"
  KOR_gongyexian_decision_desc: "\nAlles muss neu aufgebaut werden. Unser Land hat endlich die Unabhängigkeit erlangt, aber Jahrzehnte der Kolonialherrschaft haben unsere Industrie und Technologie weit hinter der Welt zurückgelassen. Um die hart erkämpfte Freiheit zu verteidigen, müssen wir so schnell wie möglich aufholen."
  KOR_jingji_xunqiu_guoji_jishu_decision: "Bitten Sie [FROM.GetNameDef] um technische Unterstützung"
  KOR_jingji_xunqiu_guoji_jishu_decision_flag: "Ich suche technische Hilfe"
  KOR_jingji_xunqiu_guoji_jishu_decision_tt: "Wenn die Bewertung §Ygrößer als 50§! ist, besteht eine höhere Chance, Technologien direkt freizuschalten"
  develop_xianjing_steel_mines: "Entwickeln Sie die Musan-Eisenmine"
  develop_xianjing_coal_mines: "Entwickeln Sie Kohlebergwerke in der Provinz Pyongan"

  KOR_junshi_decision: "Militärische Modernisierungsoffensive"
  KOR_junshi_decision_desc: "Nach der Befreiung ist Korea voller verschiedener bewaffneter Gruppen. Wir müssen diese verstreuten Soldaten und Fraktionsstreitkräfte schnell auflösen und neu organisieren, aus ihnen loyales und zuverlässiges Personal auswählen und die schwarzen Schafe beseitigen. Nur so können wir eine nationale Verteidigungstruppe aufbauen, die wirklich zum Land gehört und unter einer einheitlichen Führung steht."
  KOR_jiesan_minbing: "Erweitern Sie die Special Service Independent Army"
  KOR_yanxi_kangzhan: "Fassen Sie die antijapanischen Kriegserfahrungen zusammen"
  KOR_jiesan_minbing_tt: "Fügen Sie §Y2 $militia$§! Bataillone zur Gründung der §YSpecial Service Independent Army§! hinzu."
  KOR_yanxi_kangzhan_tt: "Fügen Sie §Y2 $militia$§!-Bataillone zur Aufstellung der §YSpecial Service Independent Army hinzu§!.\nWenn relevante Technologien erforscht wurden, fügen Sie §Y$recon$§! und §Y$artillery$§! hinzu."
  KOR_mining_the_sea: "Marinebergbau"
  KOR_mining_the_sea_desc: "Wir sollten Minen auf See legen, um sicherzustellen, dass feindlicher Verkehr nicht passieren kann, und um uns vor einer Invasion auf See zu schützen."
