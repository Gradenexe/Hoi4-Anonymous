 NZL_south_australian_housing_trust:0 "National Housing Trust"
 NZL_south_australian_housing_trust_desc:0 "Gründung einer nationalen Wohnungsbaustiftung zur Unterbringung von Arbeitnehmern in wichtigen Industriezentren."

 NZL_department_of_supply_and_development:0 "Abteilung für Versorgung und Entwicklung"
 NZL_department_of_supply_and_development_desc:0 "Schaffen Sie eine eigene Regierungsabteilung, um die Materialversorgung der Industrie und des Militärs zu koordinieren."

 NZL_expand_lithgow_small_arms_factory:0 "Ausbau der Kleinwaffenproduktion"
 NZL_expand_lithgow_small_arms_factory_desc:0 "Erweitern Sie unsere Produktionskapazität für Kleinwaffen, um die wachsende Armee Neuseelands auszurüsten."

 NZL_allied_works_council:0 "Alliierter Betriebsrat"
 NZL_allied_works_council_desc:0 "Richten Sie einen Rat ein, um die Bauarbeit in allen wichtigen Kriegsindustrien zu koordinieren."

 NZL_expand_the_northern_railway:0 "Erweitern Sie die Northern Rail Line"
 NZL_expand_the_northern_railway_desc:0 "Verlängern Sie die Nordbahnlinie, um Industrie- und Rohstoffzentren zu verbinden."

 NZL_australian_arms_production:0 "Neuseeländische Waffenproduktion"
 NZL_australian_arms_production_desc:0 "Erhöhen Sie die inländische Waffenproduktion drastisch, um unsere Streitkräfte auszurüsten."

 NZL_uranium_mining:0 "Uranabbauprogramm"
 NZL_uranium_mining_desc:0 "Starten Sie ein geheimes Programm zur Lokalisierung und Gewinnung von Uranvorkommen für zukünftige Forschungen."
