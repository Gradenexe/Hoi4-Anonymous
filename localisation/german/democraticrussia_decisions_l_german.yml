l_german:
 RUS_security_pact_category:0 "Verwalten Sie den Östlichen Sicherheitspakt"
 RUS_security_pact_category_desc:0 "Mehrere osteuropäische Staaten stehen der deutschen Bedrohung völlig schutzlos gegenüber. Deshalb werden wir sie retten."
 RUS_invite_country_to_security_pact:0 "Laden Sie §H[FROM.getname]§! zu [ROOT.getfactionname] ein"
 RUS_closer_cooperation_with_nation:0 "Beginnen Sie eine engere Zusammenarbeit mit §H[FROM.getname]§!"
 RUS_integrate_nation:0 "Erweitern Sie §HUnion§! zu §H[FROM.getnamedef]§!"
 RUS_big_russian_empire_category:0 "Das Großrussische Reich"
 RUS_big_russian_empire_category_desc:0 "Seit dem Untergang des Russischen Reiches im Jahr 1917 hat unsere russische Nation eine Menge Land, Ruhm und Prestige verloren.\n\nJetzt, da die Monarchie zurück ist, sollten wir zweifellos das Reich aus den guten alten Zeiten wiederherstellen, aber auch ein neues, besseres schaffen. Mehr noch, dieses Mal unter dem Mandat des Volkes!"
 RUS_establish_congress_poland:0 "Kongresspolen wiederherstellen"
 RUS_establish_congress_poland_desc:0 "Kongresspolen war eines der vielen großen Länder, die unter unserer Herrschaft standen. Jetzt, wo wir es kontrollieren, können wir es wieder integrieren."
 RUS_integrate_baltic:0 "Wiedereingliederung der baltischen Staaten"
 RUS_integrate_baltic_desc:0 "Die baltischen Staaten Estland, Lettland und Litauen waren einige der vielen großen Länder, die unter unserer Herrschaft standen. Jetzt, wo wir sie kontrollieren, können wir sie wieder integrieren."
 RUS_reestablish_grand_duchy:0 "Errichtung des Großherzogtums Finnland"
 RUS_reestablish_grand_duchy_desc:0 "Das Großherzogtum Finnland war eines der vielen großen Länder, die unter unserer Herrschaft standen. Jetzt, wo wir es kontrollieren, können wir es wieder integrieren."
 RUS_integrate_bessarabia:0 "Bessarabien wieder integrieren"
 RUS_integrate_bessarabia_desc:0 "Bessarabien war eines der vielen großen Länder, die unter unserer Herrschaft standen. Jetzt, wo wir es kontrollieren, können wir es wieder integrieren."
 RUS_integrate_galicia:0 "Integrieren Sie Galacia in Kongresspolen"
 RUS_integrate_galicia_desc:0 "Nachdem wir Kongresspolen integriert haben, werden wir dessen Gebiete auch nach Galizien ausdehnen."
 RUS_integrate_east_prussia:0 "Integrieren Sie Ostpreußen in Kongresspolen"
 RUS_integrate_east_prussia_desc:0 "Nachdem wir Kongresspolen integriert haben, werden wir dessen Gebiete auch nach Ostpreußen ausdehnen."
 RUS_integrate_kurils_and_south_sakhalin:0 "Reintegration der Kurilen und Südsachalins"
 RUS_integrate_kurils_and_south_sakhalin_desc:0 "Die Kurilen und Südsachalin waren einige der vielen großen Länder, die unter unserer Herrschaft standen. Jetzt, wo wir sie kontrollieren, können wir sie wieder integrieren."
 RUS_integrate_bosporus:0 "Integrieren Sie den Bosporus"
 RUS_integrate_bosporus_desc:0 "Nach dem Ersten Weltkrieg wollten wir einst Konstantinopel, doch nach unserem Ausscheiden aus dem Krieg zerplatzten unsere Träume. Doch dieser Traum ist jetzt Wirklichkeit geworden, da wir die Region kontrollieren und sie nun integrieren können."
 RUS_integrate_mongolia:0 "Integrieren Sie die Mongolei"
 RUS_integrate_mongolia_desc:0 "Vor langer Zeit haben die Mongolen uns als einziges Land erobert. Doch jetzt haben wir sie besiegt! Wir werden sie als Relam unseres Reiches integrieren."
 RUS_integrate_north_manchuria:0 "Integrieren Sie die Nordmandschurei"
 RUS_integrate_north_manchuria_desc:0 "Der Russisch-Japanische Krieg hat uns möglicherweise gedemütigt und geschwächt. Die Zeiten haben sich jedoch geändert und wir sind jetzt die dominierende Macht. \n\nA Infolgedessen kontrollieren wir die Nordmandschurei und werden sie integrieren."
 RUS_integrate_south_manchuria:0 "Integrieren Sie die Südmandschurei"
 RUS_integrate_south_manchuria_desc:0 "Der Russisch-Japanische Krieg hat uns möglicherweise gedemütigt und geschwächt. Die Zeiten haben sich jedoch geändert und wir sind jetzt die dominierende Macht. \n\nA Infolgedessen kontrollieren wir die Südmandschurei und werden sie integrieren."
 RUS_integrate_mengjiang:0 "Mengjiang integrieren"
 RUS_integrate_mengjiang_desc:0 "Der Russisch-Japanische Krieg hat uns möglicherweise gedemütigt und geschwächt. Die Zeiten haben sich jedoch geändert und wir sind jetzt die dominierende Macht.\n\nA Infolgedessen kontrollieren wir Mengjiang und werden sie integrieren."
 RUS_integrate_korea:0 "Korea integrieren"
 RUS_integrate_korea_desc:0 "Der Russisch-Japanische Krieg hat uns möglicherweise gedemütigt und geschwächt. Die Zeiten haben sich jedoch geändert und wir sind jetzt die dominierende Macht. \n\nA Infolgedessen kontrollieren wir Korea und werden es integrieren."
 RUS_integrate_hokkaido:0 "Hokkaido integrieren"
 RUS_integrate_hokkaido_desc:0 "Der Russisch-Japanische Krieg hat uns möglicherweise gedemütigt und geschwächt. Die Zeiten haben sich jedoch geändert und wir sind jetzt die dominierende Macht.\n\nA. Infolgedessen kontrollieren wir Hokkaido und werden sie integrieren."
 RUS_reform_entente_category:0 "Reform der Entente"
 RUS_reform_entente_category_desc:0 "Die Entente mag sich nach dem Ersten Weltkrieg aufgelöst haben, wir müssen sie jedoch wieder brauchen, um der wachsenden Bedrohung durch neue Imperien entgegenzuwirken ..."
 RUS_reinvite_country_to_entente:0 "Laden Sie §H[FROM.getname]§! erneut zur Entente ein"
 RUS_reinvite_country_to_entente_desc:0 "[FROM.getnamedefcap] war einst ein wichtiger Verbündeter in der Entente. Allerdings haben wir uns seit der Auflösung auseinandergelebt. Es ist an der Zeit, unter der Bedrohung durch die Expansionsmächte wieder zusammenzufinden."
 RUS_ask_for_leadership:0 "Fragen Sie §H[FROM.getname]§!, ob wir stattdessen die Fraktion anführen können"
 RUS_ask_for_leadership_desc:0 "Die Wahrheit ist, dass [ROOT.getfactionname] besser dran wäre, wenn wir es anführen würden."
 RUS_invite_new_country_to_security_pact:0 "Laden Sie §H[FROM.getname]§! zu [ROOT.getfactionname] ein"
 RUS_invite_new_country_to_security_pact_desc:0 "Wir müssen unsere diplomatische Reichweite auch auf den Balkan und die nordischen Länder ausweiten! Daher wäre [FROM.getname] perfekt für unsere Allianz."
