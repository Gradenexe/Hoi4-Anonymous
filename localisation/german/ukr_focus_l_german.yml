 UKR_revolutionary_cabinet_desc:0 "Nachdem wir nun an unseren rechtmäßigen Platz als unerschütterliche Wächter der Unterschicht zurückgekehrt sind, können wir erneut ein Ministerkabinett zusammenstellen, das mit der Ideologie unseres neuen Staates übereinstimmt."
 UKR_unchain_education:0 "Entfesseln Sie unsere Bildung"
 UKR_unchain_education_desc:0 "Das [Root.GetNonIdeologyAdjective]-Bildungssystem war lange Zeit durch unsere unterschiedlichen Bevölkerungszentren eingeschränkt, aber jetzt, da die Landbevölkerung näher an die Städte zieht, werden wir besser in der Lage sein, die [Root.GetNonIdeologyAdjective]-Jugend effizient auszubilden."
 UKR_baltic_fleet:0 "Die ukrainische Flotte"
 UKR_baltic_fleet_desc:0 "Auch wenn die [Root.GetNonIdeologyAdjective]-Flotte kaum den Neid der Welt erregt, könnte sie sich mit entsprechender Investition dennoch als in der Lage erweisen, [Root.GetNonIdeologyName] vor jeglichen Invasionsversuchen auf dem Meer zu verteidigen."
 UKR_align_paramilitarists:0 "Richten Sie die Paramilitaristen neu aus"
 UKR_align_paramilitarists_desc:0 "Im gesamten [Root.GetNameDef] gibt es viele paramilitärische Gruppen, von denen sich die meisten ausschließlich dem Schutz der Selbstbestimmung von [Root.GetAdjective] widmen. Das ist zwar bewundernswert, aber es wäre vorzuziehen, wenn diese Gruppen uns nicht als [SOV.GetAdjective]-Marionetten sehen würden, sondern als logische Fortsetzung des [Root.GetAdjective]-Staates."
 UKR_rejoin_the_railways:0 "Treten Sie wieder der Eisenbahn bei"
 UKR_rejoin_the_railways_desc:0 "Die Russen und Deutschen, die uns besetzten, sahen in uns nichts weiter als ein ländliches Hinterland, aber nicht mehr. [ROOT.GetNonIdeologyName] soll zu seinem maximalen Potenzial industrialisiert werden, beginnend mit einer Modernisierung unserer Eisenbahnen und Infrastruktur."
 UKR_rebuild_forts:0 "Bauen Sie die [Root.Capital.GetName]-Festungen wieder auf"
 UKR_rebuild_forts_desc:0 "Während der Unabhängigkeitskriege war [Root.Capital.GetName] eher eine Festung als eine Stadt. Obwohl die Befestigungsanlagen weitgehend abgebaut und in Vergessenheit geraten sind, müssen sie kriegsbereit wieder aufgebaut und instand gehalten werden."
 UKR_british_aircraft:1 "[GetBritAircraftManufTitle]"
 UKR_british_aircraft_desc:1 "[GetBritAircraftManufDesc]"
 UKR_UNIFIED_communism:0 "Ukrainisch-belarussische Sowjetrepublik"
 UKR_UNIFIED_communism_DEF:0 "die Ukrainisch-Weißrussische Sowjetrepublik"
 UKR_UNIFIED_communism_ADJ:0 "Ukrainisch-Weißrussisch"
 UKR_communist_opposition:0 "Treten Sie der Opposition bei"
 UKR_communist_opposition_desc:0 "Die Sowjetunion hat sich als kein Freund von [Root.GetNameDef] und ihrem Volk erwiesen, und wir wären dumm, wenn wir die Schlüssel zu [Root.GetNameDef] den Geiern der Roten Armee überlassen würden, die nichts weiter wollen, als die [Root.GetAdjective] zu plündern. Sie sind nicht vertrauenswürdiger als die Kapitalisten, und wenn die [Root.GetCommunistParty] Erfolg haben wollen, müssen sie es alleine schaffen!"
 UKR_influence_neighbours:0 "Beeinflussen Sie die Nachbarn"
 UKR_influence_neighbours_desc:0 "Das Konzept eines befreiten Ukrainers im Sozialismus ist zwar nicht annähernd so populär wie vor den Unabhängigkeitskriegen, aber so alt wie das Konzept der ukrainischen Selbstbestimmung selbst. Unser Staat kann ein Vorbild für diejenigen sein, die unter den Unterdrückungsregimen der ukrainischen Diktaturen leben, und indem wir ihn als Waffe einsetzen, können wir die Revolution unblutig auf unsere Nachbarn übertragen."
 UKR_soviet_military_staff:0 "Sowjetischer Militärstab"
 UKR_soviet_military_staff_desc:0 "Nach der Auflösung der Arbeiterrepublik [Root.GetAdjective] gingen unsere Militärangehörigen größtenteils ins Exil in die UdSSR. Sie müssen nach Hause gebracht werden."
 UKR_arm_the_nation:0 "Bewaffne die Nation"
 UKR_arm_the_nation_desc:0 "Überall im [Root.GetNonIdeologyName] gibt es Männer, die bereit sind, sich der drohenden sowjetischen Invasion zu stellen, denen aber die Ausrüstung dafür fehlt. Wir müssen unsere Rüstungsindustrie auf die schnelle Produktion von Infanterieausrüstung vorbereiten."
 UKR_sieze_the_means_of_production:0 "Beschlagnahmung der Produktionsmittel"
 UKR_sieze_the_means_of_production_desc:0 "Die alte Regierung lud Investoren aus Übersee ein, die Arbeitskraft der [Root.GetAdjective]-Leute auszubeuten. Wir können nicht weiterhin zulassen, dass die Hände des Proletariats ihren ausländischen bürgerlichen Herren dienen, und alle von diesen multinationalen Konzernen errichteten Fabriken müssen in die Obhut von [Root.GetNameDef] genommen werden."
 UKR_concessions_for_catholics:0 "Zugeständnisse für Katholiken"
 UKR_concessions_for_catholics_desc:0 "Ein Großteil der unteren Schichten von [Root.GetNameDef] sind gläubige Katholiken, und in der ersten Arbeiterrepublik wurde die Religionsausübung von der Roten Armee brutal unterdrückt. Dies brachte viele der Armen von [Root.GetNameDef] gegen die Revolution auf. Wenn wir also wirklich die Republik des Volkes sein wollen, müssen wir ihnen unmissverständlich versichern, dass ihr Glaube geschützt wird."
 UKR_western_revolution:0 "Tragen Sie die Revolution nach Westen"
 UKR_western_revolution_desc:0 "Die Revolution macht auch in der Ukraine nicht halt. Fast die gesamte Unterschicht Europas schuftet in Fabriken unter dem starren Stiefel des Kapitalismus, und nur [Root.GetAdjective]-Arbeiter sind in der Lage, sie zu befreien."
 UKR_eastwall:0 "Ostwall"
 UKR_eastwall_desc:0 "Die Deutschen erwarten einen Angriff aus dem Osten genauso wie wir, und die deutschen Beamten wären gut beraten, unsere Grenze ebenso energisch zu befestigen wie ihre eigene."
 UKR_united_baltic_ssr:0 "Eine Vereinigte Ostslawische SSR"
 UKR_united_baltic_ssr_desc:0 "Ähnlich wie die Litauisch-Weißrussische SSR wäre eine Vereinigte Ukraine-Weißrussische SSR eine harmonische Verschmelzung dieser beiden scheinbar unterschiedlichen Völker. Der Sozialismus kennt keine Grenzen der Kultur und Sprache, und wir sehen kaum einen Grund, warum ukrainische und weißrussische Arbeiter nicht nebeneinander existieren könnten."
 UKR_autobahn:0 "[Root.GetAdjective] Autobahn"
 UKR_autobahn_desc:0 "Es spielt keine Rolle, wie gut industrialisiert [Root.GetNonIdeologyName] ist, wenn seine Infrastruktur nicht einen schnellen und kontinuierlichen Zustrom von Arbeitskräften ermöglicht. Indem wir unseren Infrastruktursektor nach dem Vorbild des Reichssektors gestalten, können wir die Effizienz erreichen, die sie haben."
 UKR_secure_military_support:0 "Sichere militärische Unterstützung"
 UKR_secure_military_support_desc:0 "Viele im Militär würden versuchen, die Nation von [Root.GetLeader] zu befreien, wir müssen uns nur an sie wenden. Ein General, der nach Ehre und Ansehen strebt, würde sich sicherlich mit dem Versprechen, ein Held des Volkes zu werden, für unsere Sache interessieren."
 UKR_renew_allied_trade:1 "[GetBalticRenewAlliedTradeTitle]"
 UKR_renew_allied_trade_desc:1 "[GetBalticRenewAlliedTradeDesc]"
 UKR_axis_investments:2 "Suchen Sie nach [GetBalticAxisInvesmentsAdj] Investments"
 UKR_axis_investments_desc:2 "[GetBalticAxisInvesmentsDesc]"
 UKR_soviet_investments_idea: "Sowjetische Investitionen"
 UKR_attract_workers_to_capital:0 "Gewinnen Sie Arbeiter für [Root.Capital.GetName]"
 UKR_attract_workers_to_capital_desc:0 "Die Arbeiter von [Root.GetNonIdeologyName] sind über das ganze Land verteilt und arbeiten oft im veralteten Agrarsektor. Wenn wir unsere Nation für den Krieg industrialisieren wollen, müssen wir Arbeiter in die Fabriken von [Root.Capital.GetName] locken!"
 UKR_allied_shipments:0 "Erhöhen Sie die Lieferungen der Verbündeten"
 UKR_allied_shipments_desc:1 "Seit 1918 ist die [Root.GetNonIdeologyAdjective]-Armee mit Lieferungen aus Großbritannien ausgerüstet, und wir sollten uns bemühen, den Alliierten klarzumachen, dass [Root.GetNonIdeologyName] möglicherweise einer anderen sowjetischen Marionettenregierung unterworfen werden könnte, wenn die Lieferungen nicht drastisch erhöht werden."
 UKR_free_the_workers_of_poland:0 "Befreit die Arbeiter Polens"
 UKR_free_the_workers_of_poland_desc:0 "Obwohl die Polen einst über die Ukraine herrschten, sind sie heute Opfer des räuberischen Regimes von [GER.GetNameDef]. Wir müssen unsere Genossen im Süden verteidigen und sie unter einer Polnischen Sozialistischen Republik vereinen!"
 UKR_arms_industry:0 "Vervollständige die Bewaffnung"
 UKR_arms_industry_desc:0 "Nachdem die Modernisierung unserer Industrie nun abgeschlossen ist und in unserem Land unzählige inländische militärisch-industrielle Organisationen tätig sind, kann die [Root.GetAdjective]-Rüstungsindustrie endlich ihr wahres Potenzial ausschöpfen!"
 UKR_red_army:0 "[Root.GetAdjective] Rote Schützen"
 UKR_red_army_desc:0 "Unsere Armee darf nur aus denjenigen bestehen, die bereit sind, den Sozialismus innerhalb von [Root.GetAdjective] zu verteidigen und ihn unter der Bevölkerung der Welt zu verbreiten, und dies kann nur durch die Wiederherstellung der Roten Schützen von [Root.GetAdjective] erreicht werden."
 UKR_finnish_invasion:0 "Finnish Invasion"
 UKR_finnish_invasion_desc:0 "Finnland ist für uns ein verlorener Bruder, der in den Fesseln des Kapitalismus gefangen ist. Nur durch eine gewaltsame Revolution kann Finnland befreit werden, so wie die Ukraine befreit wurde."
 UKR_trade_with_neighbors:0 "Handel mit den Nachbarn"
 UKR_trade_with_neighbors_desc:0 "Jedes Mal, wenn wir Handel in die Deutschen oder Sowjets investieren, tragen wir zu unserem eigenen Untergang bei. Wir können nicht zulassen, dass feindliche Truppen mit litauischem Getreide in ihren Rationen und estnischem Öl in ihren aus lettischem Stahl hergestellten Panzern in [Root.GetNonIdeologyName] einmarschieren. Stattdessen müssen wir uns gegenseitig helfen, unseren gemeinsamen Feind zu besiegen."
 UKR_forment_disloyalty:0 "Vereint die Opposition"
 UKR_forment_disloyalty_desc:0 "Es gibt viele Bewegungen sowohl innerhalb als auch außerhalb der [Root.GetAdjective]-Regierung, und wenn wir die derzeitige Tyrannei, die [Root.GetNameDef] plagt, stürzen wollen, müssen wir die einigende Stimme der Opposition gegen [Root.GetNeutralParty] werden!"
 UKR_arm_baltic_reds:0 "Bewaffnen Sie die Ukrainischen Roten"
 UKR_arm_baltic_reds_desc:0 "Die Bühne ist bereitet, der kommunistische Eifer brennt in der ganzen Ukraine. Alles, was die Roten jetzt brauchen, ist das Signal und die Ressourcen von uns, und wir werden die ukrainische Revolution entfachen!"
 UKR_end_bourgeouis_dictatorships:0 "Vereinigung mit der Moldauischen SSR"
 UKR_end_bourgeouis_dictatorships_desc:0 "Die Ukraine wird von sogenannten „neutralen“ Diktatoren dominiert. Mit der Unterstützung des Militärs und ohne Zustimmung ihres Volkes wird das Proletariat der Ukraine von der kapitalistischen Diktatur unterdrückt. Nur durch die Hände freigelassener [Root.GetAdjective]-Arbeiter können diese durch ungerechte Grenzen getrennt gehaltenen Arbeiter an unserer glorreichen Befreiung teilhaben!"
 UKR_path_to_the_north_sea:0 "A Path to the North Sea"
 UKR_path_to_the_north_sea_desc:0 "Die Dänen sind in diesem eskalierenden globalen Konflikt absolut neutral geblieben, und nur die Meerenge von Dänemark trennt die sozialistische Welt von der Nordsee."
 UKR_modernize_industry:0 "Modernisieren Sie unsere Branche"
 UKR_modernize_industry_desc:0 "Zu lange wurde die Produktion von [Root.GetNonIdeologyName] durch die Landwirtschaft bestimmt, aber nicht mehr. Wir müssen unsere Industrie auf die großen Stadtzentren in jedem Staat konzentrieren, wenn wir [Root.GetNonIdeologyName] in eine moderne Wirtschaft verwandeln wollen."
 UKR_seek_support_of_soviets:0 "Suchen Sie die Unterstützung der Sowjets"
 UKR_seek_support_of_soviets_desc:0 "Obwohl die Rote Armee [Root.GetNameDef] verwüstet und unsere Nation in eine neue Ära des russischen Imperialismus geführt hat, haben wir ohne ihre Hilfe keine Chance, den Sozialismus nach [Root.GetNameDef] zu bringen."
 UKR_overthrow_the_government:0 "[Root.GetNeutralParty] stürzen"
 UKR_overthrow_the_government_desc:0 "Wir haben genug Unterstützung gesammelt, um das [Root.GetLeader]- und [Root.GetLeader.GetHerHis]-Regime zu stürzen! Alles, was wir tun müssen, ist in die Hauptstadt zu marschieren und eine neue Arbeiterrepublik auszurufen!"
 UKR_domestic_motors:0 "Ein inländisches Automobilunternehmen"
 UKR_domestic_motors_desc:0 "Ausländische Designs sind in Ordnung, aber wir können uns nicht auf Dauer darauf verlassen. [Root.GetNonIdeologyName] ist eine stolze Nation, und wir müssen der Welt zeigen, dass unsere Designer und Denker genauso gut sind wie die aus dem Westen."
 UKR_soviet_volunteer_forces:0 "Sowjetische Freiwilligentruppen"
 UKR_soviet_volunteer_forces_desc:0 "Die UdSSR ist praktisch überfüllt mit Männern, die bereit sind, für die Weltrevolution zu kämpfen und zu sterben. Obwohl [Root.GetNameDef] nur ein Sprungbrett im Kampf für eine kommunistische Welt ist, mangelt es nicht an mutigen russischen Sozialisten, die bereit sind, für unsere Sache zu sterben."
 UKR_end_swedish_neutrality:0 "Ende der jugoslawischen Neutralität"
 UKR_end_swedish_neutrality_desc:0 "Was die Jugoslawen Neutralität nennen, ist nichts als Schwäche; Sie beugen sich den Launen der jeweils mächtigsten Macht, ohne Rücksicht auf das Wohlergehen der unteren Klassen jenseits ihrer Grenzen. Eine so willensschwache und schwache Regierung ist es nicht wert, unsere Grenze zu teilen, und wir müssen ein neues Jugoslawien schaffen, das das Rückgrat hat, sein Volk vor Tyrannei zu verteidigen."
 UKR_soviet_equipment:0 "Sowjetische Ausrüstung"
 UKR_soviet_equipment_desc:0 "Wir können nicht hoffen, die Regierung zu stürzen, ohne zuvor Zugang zu den Waffen und Materialien zu erhalten, die zur Bewaffnung unserer Milizen erforderlich sind. Indem wir die Russen um Hilfe bitten, werden wir zusätzliche Waffen erhalten, um unsere Armeen zu unterstützen, sollte die alte Regierung versuchen, die Revolution zu stoppen."
 UKR_squash_resistance:0 "Zerstöre jeden Widerstand"
 UKR_squash_resistance_desc:0 "Es gibt immer noch Menschen, die glauben, der Sozialismus sei der Feind der [Root.GetAdjective]-Souveränität, und diese Menschen müssen ausgerottet werden, wenn wir die Revolution vorantreiben wollen."
 UKR_german_baltic_industry:1 "Achse-Ukrainische Industrie"
 UKR_german_baltic_industry_desc:1 "[GetGermanBalticIndustryDesc]"
 UKR_balticwall:0 "Schwarzmeermauer"
 UKR_balticwall_desc:0 "Befestigungen im Osten sind wertlos, wenn unsere Feinde stattdessen einen Angriff vom Meer aus durchführen! Wir werden vielleicht nie eine Marine aufbauen, die es mit den Briten, Deutschen oder Sowjets aufnehmen kann, aber wir können tun, was wir können, um sie gegenüber unserer Küstenverteidigung hilflos zu machen."
 UKR_technology_sharing:0 "Technologieaustausch"
 UKR_technology_sharing_desc:0 "Wir produzieren bereits viele Geräte unserer Partner, aber vielleicht können wir durch die Untersuchung ihrer Designs die nativen [Root.GetNonIdeologyAdjective]-Designs erheblich verbessern."
 UKR_school_of_aviation:1 "Ukrainische Luftfahrtschule"
 UKR_school_of_aviation_desc:0 "Während des Unabhängigkeitskrieges kämpften die Briten in unserem Namen um die Kontrolle über Luft und Meer, aber da die Briten der Nazi-Bedrohung weiterhin Zugeständnisse nach Zugeständnissen machen, können wir nicht darauf vertrauen, dass sie uns erneut verteidigen werden. Wir müssen selbst in die Luft gehen!"
 UKR_crossley_motors:0 "[Root.Capital.GetName]-Crossley Motors"
 UKR_crossley_motors_desc:1 "Da in unserem Land inzwischen zahlreiche ausländische Investitionen getätigt werden und die Produktion von Automobilen einigermaßen effizient ist, können wir möglicherweise mit der Crossley Motor Company zusammenarbeiten, um originelle Designs für den Einsatz in der [Root.GetNonIdeologyAdjective]-Armee zu entwickeln!"
 UKR_belarus_ssr:0 "[Root.GetNonIdeologyName]-Belarus SSR"
 UKR_belarus_ssr_desc:0 "Das Konzept, Weißrussland und die Ukraine zu vereinen, ist kein Fremdwort. Vor langer Zeit existierte die Litauisch-Weißrussische Sozialistische Sowjetrepublik als harmonische Verschmelzung dieser beiden scheinbar unterschiedlichen Völker. Der Sozialismus kennt keine Grenzen der Kultur und Sprache, und wir sehen kaum einen Grund, warum [Root.GetAdjective] und weißrussische Arbeiter nicht nebeneinander existieren könnten."
 UKR_purge_of_our_own:0 "Eine eigene Säuberung"
 UKR_purge_of_our_own_desc:0 "Auch wenn wir uns nach besten Kräften bemühen, jeglichen Widerstand zu unterdrücken, gibt es immer noch diejenigen, die sich im Schatten organisieren und gegen das Proletariat verschwören, um in [Root.GetNonIdeologyName] eine kapitalistische Diktatur wiederherzustellen. Wir müssen eine Volkssäuberung durchführen; Ausrottung aller Mitglieder der alten Regierung und aller, die sie unterstützen."
 UKR_invest_in_baltic_trade:0 "Investieren Sie in den ukrainischen Handel"
 UKR_invest_in_baltic_trade_desc:0 "Das Schwarze Meer ist reich an Handelsgütern aus Skandinavien, Deutschland und Russland, und unsere Häfen können sie kaum alle aufnehmen. Wir müssen neue Handelslinien mit unseren Freunden eröffnen, die dieses Meer mit uns teilen, für ein helleres und wohlhabenderes [Root.GetNonIdeologyName]!"
 UKR_request_german_support:2 "Fordern Sie den [GetBalticAxisInvesmentsAdj]-Support an"
 UKR_request_german_support_desc:1 "[GetRequestGermanSupportDesc]"
 UKR_german_war_economics:1 "Übernehmen Sie die [GetBalticAxisInvesmentsAdj]-Kriegsökonomie"
 UKR_german_war_economics_desc:1 "[GetGermanWarEconomicsDesc]"
 UKR_direct_intervention:0 "Direkte sowjetische Intervention"
 UKR_direct_intervention_desc:0 "Wir haben bewiesen, dass wir nicht in der Lage sind, die Regierung allein zurückzugewinnen, und wir müssen unsere Verbündeten in [SOV.GetNameDef] anrufen, um uns in unserem Kampf zu unterstützen."
 UKR_natural_resources:0 "Natürliche Ressourcen entwickeln"
 UKR_natural_resources_desc:0 "[Root.GetNaturaResource_BAL] hat unser Land durch den Handel mit den Sowjets, den Alliierten und unseren ukrainischen Landsleuten gleichermaßen reich gemacht, und wir täten gut daran, mehr in diese Branche zu investieren, indem wir landesweit in [Root.GetExtraction_BAL] investieren!"
 UKR_british_designers:0 "Laden Sie britische Designer ein"
 UKR_british_designers_desc:0 "Wir haben britische Designs gründlich studiert und da sich [Root.Capital.GetName]-Crossley Motors als erfolgreiches Unterfangen erwiesen hat, täten wir gut daran, britische Designer offiziell einzuladen, der [Root.GetNonIdeologyAdjective] Engineering Company beizutreten."
 UKR_defence_of_our_nation:0 "Die Verteidigung unserer Nation"
 UKR_defence_of_our_nation_desc:0 "Die zivile Industrie ist für unsere Verteidigung von gleicher Bedeutung wie die Rüstungsindustrie. Das stetige Summen der Maschinen wird durch ganz [Root.GetNonIdeologyName] dröhnen, während seine patriotischen Menschen ihre Pflicht erfüllen, unsere Nation zu industrialisieren."
 UKR_crush_forest_brothers:0 "Zerschmettere den Widerstand"
 UKR_crush_forest_brothers_desc:0 "Der Widerstand hat unserer Nation seit unserer Machtübernahme geschadet; Sabotage unserer Industrien und Eisenbahnen und Störung offizieller Regierungsdemonstrationen. Wir müssen uns in die Wälder von [Root.GetNonIdeologyName] wagen und diese fehlgeleiteten Individuen ausrotten."
 BALTIC_soviet_investments_idea:0 "Sowjetische Investitionen"
 BALTIC_soviet_investments_idea_desc:0 "Eine große kommunistische Macht hat [Root.GetNameDef] finanzielle und industrielle Unterstützung zugesagt. Sowjetische Berater helfen bei der Modernisierung unserer Produktionslinien und ihre Investitionen verleihen unserem Land eine wachsende Industriekapazität."

 # Baltic Soviet Investments branch
 baltic_soviet_investments:0 "Suchen Sie nach sowjetischen Investitionen"
 baltic_soviet_investments_desc:0 "[Root.GetNameDef] steht am Scheideweg. Indem wir uns an die Sowjetunion und andere kommunistische Mächte wenden, können wir uns wichtige finanzielle Unterstützung und industrielles Fachwissen für den Wiederaufbau unserer Nation sichern – auf Kosten einer engeren Bindung an den kommunistischen Block."
 baltic_soviet_war_economics:0 "Sowjetische Kriegsökonomie"
 baltic_soviet_war_economics_desc:0 "Sowjetische Berater haben eine vollständige Umstrukturierung unserer Wirtschaft nach stalinistischen Grundsätzen vorgeschlagen. Eine auf Krieg ausgerichtete Kommandowirtschaft ist zwar hart, wird aber die Rüstung produzieren, die die [Root.GetAdjective]-Industrie allein nie erreicht hat."
 baltic_soviet_tank_licences:0 "Sowjetische Panzerlizenzen"
 baltic_soviet_tank_licences_desc:0 "Die Rote Armee verfügt über einige der besten gepanzerten Fahrzeuge der Welt. Durch die Aushandlung von Produktionslizenzen kann [Root.GetNameDef] mit der Herstellung sowjetischer Panzer beginnen und unseren Streitkräften einen entscheidenden Vorteil auf dem Schlachtfeld verschaffen."
 baltic_donbas_heavy_industry:0 "Unsere Schwerindustrie"
 baltic_donbas_heavy_industry_desc:0 "Wir lassen uns vom großen industriellen Kernland des Donbass inspirieren und werden dessen Modell der Schwermetallurgie in unseren Kerngebieten nachahmen. Sowjetische Ingenieure werden den Bau neuer Stahlwerke und Gießereien überwachen."
 baltic_donbas_coal:0 "Unser Kohleabbau"
 baltic_donbas_coal_desc:0 "Kohle ist das Lebenselixier der modernen Industrie. Durch die Übernahme unserer Bergbautechniken und die Einbeziehung sowjetischer Förderspezialisten wird [Root.GetNameDef] den Treibstoff fördern, der für den Antrieb seiner Kriegsmaschinerie erforderlich ist."
 baltic_soviet_collectivization:0 "Kollektivierungsoffensive"
 baltic_soviet_collectivization_desc:0 "Nach sowjetischem Vorbild werden wir private landwirtschaftliche Betriebe verstaatlichen und in Kollektivbetrieben zusammenfassen. Der Prozess wird schmerzhaft sein – viele werden sich wehren –, aber der daraus resultierende Überschuss wird unsere Fabriken und Frontlinien ernähren."
 baltic_soviet_ukraine_industry:0 "Von der Sowjetunion unterstützte Industrie"
 baltic_soviet_ukraine_industry_desc:0 "Durch die Einbettung sowjetischer Wirtschaftsberater in unsere Ministerien wird [Root.GetNameDef] externe Fabrikkapazitäten erhalten, die von unseren kommunistischen Partnern unterstützt werden, wodurch unser Heimatland von der vollständigen Abhängigkeit von der Industrie an vorderster Front befreit wird."
 baltic_western_wall:0 "Westliche Verteidigungsmauer"
 baltic_western_wall_desc:0 "Da wir wissen, dass die kapitalistischen Mächte in unserem Westen einen kommunistischen [Root.GetNonIdeologyName] nicht dulden werden, müssen wir unsere Grenzen vorbereiten. Sowjetische Ingenieure werden uns dabei helfen, entlang jeder umkämpften Grenze eine Befestigungskette zu errichten."
 baltic_stalins_highway:0 "Stalins Autobahn"
 baltic_stalins_highway_desc:0 "Ein modernes Straßen- und Schienennetz ist das Rückgrat sowohl der Industrie als auch der Militärlogistik. Mit sowjetischen Baubrigaden wird [Root.GetNameDef] ein Ausfallstraßensystem bauen, das jeden Winkel des Staates verbindet."
 baltic_request_soviet_support:0 "Fordern Sie sowjetische Unterstützung an"
 baltic_request_soviet_support_desc:0 "Mit der Umstrukturierung unserer Wirtschaft und der Stärkung unserer Abwehrkräfte ist [Root.GetNameDef] bereit, seinen Platz als vollwertiger Partner in der sozialistischen Weltordnung einzunehmen. Wir werden offiziell den Beitritt zur sowjetisch geführten Fraktion und zur militärischen Zusammenarbeit beantragen."

 UKR_soviet_investments:0 "Suchen Sie nach sowjetischen Investitionen"
 UKR_soviet_investments_desc:0 "Um die Revolution zu schützen und unsere Nation zu industrialisieren, müssen wir auf unsere Genossen in der Sowjetunion schauen. Indem wir unsere Grenzen für sowjetische Investitionen öffnen, sichern wir die Zukunft des ukrainischen Proletariats."
 UKR_soviet_war_economics:0 "Übernehmen Sie die sowjetische Kriegsökonomie"
 UKR_soviet_war_economics_desc:0 "Um sicherzustellen, dass unsere Wirtschaft jeder kapitalistischen Aggression standhalten kann, müssen wir unsere Industrieproduktion umstrukturieren. Die Modellierung unserer Wirtschaft nach dem sowjetischen Kommandomodell wird uns auf den unvermeidlichen Kampf vorbereiten."
 UKR_soviet_tank_licences:0 "Sowjetische Panzerlizenzen"
 UKR_soviet_tank_licences_desc:0 "Die Panzertruppen der Roten Armee gehören zu den fortschrittlichsten der Welt. Die Sicherung von Produktionslizenzen für sowjetische Panzerkonstruktionen wird unserer Armee die gepanzerte Faust geben, die sie braucht."
 UKR_stalins_highway:0 "Stalins Autobahn"
 UKR_stalins_highway_desc:0 "Der schnelle Transport von Truppen und Industriegütern ist der Schlüssel zur modernen Kriegsführung. Mit der Unterstützung sowjetischer Ingenieure werden wir im ganzen Land ein modernes Autobahnnetz aufbauen."
 UKR_eastern_wall:0 "Antifaschistische Mauer"
 UKR_eastern_wall_desc:0 "Wir müssen die Errungenschaften der Revolution vor der faschistischen Bedrohung schützen. Der Bau einer Bunkerlinie entlang der Grenzen zu faschistischen Nationen wird sicherstellen, dass jede kapitalistisch-faschistische Invasion an unseren Verteidigungsanlagen abgewehrt wird."
 UKR_soviet_ukraine_industry:0 "Sowjetisch-ukrainische Industrie"
 UKR_soviet_ukraine_industry_desc:0 "Durch die Integration unserer Industrieplanung mit sowjetischem Fachwissen können wir externe militärische und zivile Fabriken errichten, die vor Frontbombardements sicher sind."
 UKR_request_soviet_support:0 "Fordern Sie sowjetische Unterstützung an"
 UKR_request_soviet_support_desc:0 "Mit der Industrialisierung unseres Landes und der etablierten militärischen Zusammenarbeit sind wir bereit, unseren Platz als vollwertiger Partner in der sozialistischen Welt einzunehmen. Lassen Sie uns ein formelles Militärbündnis und einen Fraktionsbeitritt mit der Sowjetunion beantragen."

