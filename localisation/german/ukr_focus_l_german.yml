 FRA_french_union_tt:0 "Es wird in verschiedenen Gebieten unseres Kolonialreichs zu Volksabstimmungen kommen. Einige Teile könnten sich entschließen, unabhängig zu werden."
 ROM_natural_borders: "Natürliche Grenzen Rumäniens"  
 ROM_natural_borders_desc: "Geleitet vom Ideal „De la Nistru până la Tisa“ – dem Traum eines durch natürliche Grenzen definierten Rumäniens – können wir nun diese nationalistische Vision verwirklichen, die nach dem Ersten Weltkrieg entstand."
 # ROM_the_transnistrian_exchange: "The Transnistrian Exchange"  
 # ROM_the_transnistrian_exchange_desc: "We pushed beyond the Nister with one goal and one goal only, so that when the time comes, we can try and persuade Germany to compel a return of Transylvania to us. We can now make it so."  
 ROM_appeal_to_european_capitalists: "Appell an die europäischen Kapitalisten"  
 ROM_appeal_to_european_capitalists_desc: "Nachdem der Einfluss von König Carol II. eingeschränkt wurde und demokratische Reformen unserem Land Stabilität brachten, können wir jetzt auf die großen Industriemächte Europas zugehen. Indem wir unser Engagement für eine moderne, offene Wirtschaft unter Beweis stellen, ziehen wir wichtige Investitionen an, die unsere Industrien und Infrastruktur stärken. Dieser Moment markiert unsere Rückkehr auf die europäische Bühne als verlässlicher Partner."  
 # ROM_preempt_bulgarian_alignment: "Preempt Bulgarian Alignment"  
 # ROM_preempt_bulgarian_alignment_desc: "With our democratic foundations secured, we must turn our attention to Bulgaria. Their ambitions toward our southern lands cannot be ignored. We must ensure that no Bulgarian demands on our rightful territories gain legitimacy. We will safeguard our borders and protect the hard-won sovereignty of our nation, with force, if needed."  
 # ROM_deal_with_hungary: "Deal with Hungary"  
 # ROM_deal_with_hungary_desc: "Hungary’s historical claims on our lands remain a constant threat, especially under undemocratic regimes that refuse compromise. We will ensure through any means necessary that Hungary cannot use force or coercion to claim our lands. The security of our borders rests firmly in our hands."  
 ROM_the_red_menace: "Die rote Bedrohung"  
 ROM_the_red_menace_desc: "Die kühne Forderung der Sowjetunion nach Bessarabien offenbart ihre wahren Absichten – die Beherrschung Osteuropas. Als unangefochtene Macht auf dem Balkan können wir diesen Eingriff in unsere Souveränität nicht dulden. Es ist an der Zeit, sich gegen ihre Ambitionen zur Wehr zu setzen und unsere rechtmäßigen Ansprüche jenseits des Dnjestr durchzusetzen. Lassen Sie die Welt wissen, dass Rumänien sich der roten Bedrohung nicht beugen wird!"  
 ROM_expand_resita_steel_works: "Erweitern Sie das Stahlwerk Resita"
 ROM_expand_resita_steel_works_desc: "Die Resita Steel Works sind seit langem ein Eckpfeiler unserer Industriekapazität. Durch die Modernisierung und Erweiterung dieser Anlagen können wir die Stahlproduktion erheblich steigern und die für die militärische und industrielle Expansion erforderlichen Ressourcen bereitstellen."
 ROM_air_defense_network: "Luftverteidigungsnetzwerk"
 ROM_air_defense_network_desc: "Der Himmel über Rumänien muss sicher bleiben, insbesondere über unseren lebenswichtigen Ölfeldern. Der Aufbau eines robusten Luftverteidigungsnetzwerks wird unsere Industrie schützen und feindliche Bombenangriffe abschrecken."
 ROM_beyond_the_black_sea: "Jenseits des Schwarzen Meeres"
 ROM_beyond_the_black_sea_desc: "Nachdem die Modernisierung unserer Marine abgeschlossen ist, können wir unsere Macht nun weit über das Schwarze Meer hinaus verbreiten. Durch die Stärkung unserer Seestreitkräfte und den Ausbau unserer Werften können wir jeder Bedrohung auf offener See begegnen."
 ROM_new_eastern_borders: "Neue Ostgrenzen"
 ROM_new_eastern_borders_desc: "Mit unserem Sieg über die Sowjetunion müssen wir unsere Kontrolle über die Region Transnistrien festigen. Durch die Integration dieser Gebiete in unsere Nation stellen wir die Stabilität und den Wohlstand unserer neuen Ostgrenzen sicher."
 ROM_fight_tyranny: "Kampf gegen die Tyrannei"
 ROM_fight_tyranny_desc: "Der Aufstieg des Faschismus in ganz Europa bedroht die Ideale von Freiheit und Selbstbestimmung. Es ist unsere Pflicht, dieser Bedrohung standhaft entgegenzutreten und Maßnahmen zu ergreifen, um diejenigen zu befreien, die unter ihrem Einfluss leiden."
 ROM_subsidized_national_industrialization: "Subventionierte nationale Industrialisierung"
 ROM_subsidized_national_industrialization_desc: "Unsere Annäherung an die Sowjetunion eröffnet Möglichkeiten für eine wirtschaftliche Zusammenarbeit. Durch die Nutzung ihrer Unterstützung können wir unsere industrielle Entwicklung beschleunigen und unsere Wirtschaft für die bevorstehenden Herausforderungen stärken."
 ROM_soviet_military_exercises: "Sowjetische Militärübungen"
 ROM_soviet_military_exercises_desc: "Als Mitglied der Komintern können wir von der sowjetischen Militärexpertise profitieren. Gemeinsame Übungen mit ihren Streitkräften werden die Fähigkeiten unserer Armee verbessern und sicherstellen, dass wir gut auf die Verteidigung des Sozialismus in ganz Europa vorbereitet sind."
 # ROM_italian_destroyers: "Purchase Italian Destroyers"
 # ROM_italian_destroyers_desc: "Building ships from scratch is expensive. However, many nations could be willing to sell some of their older vessels. [ITA.GetNameDefCap] for example has already shown an interest in selling a number of destroyers to us for a very reasonable price."
 
 ROM_bessarabian_war: "Der Bessarabische Krieg"
 ROM_bessarabian_war_desc: "Rumänien steht vor einem kritischen Krieg gegen die Sowjetunion um Bessarabien. Wir werden unser Bestes tun, um uns gegen die Eindringlinge zu verteidigen und unsere Heimat zu sichern, aber wir müssen auf das Schlimmste vorbereitet sein."

 ROM_demand_peace_negotiations: "Fordern Sie Friedensverhandlungen"
 ROM_demand_peace_negotiations_desc: "Unsere Streitkräfte sind erheblich auf sowjetisches Territorium vorgedrungen. Es ist an der Zeit, Frieden zu fordern und unsere Gebietsansprüche in Transnistrien durchzusetzen."

 ROM_sue_for_peace: "Sue for Peace"
 ROM_sue_for_peace_desc: "Da kritische Gebiete unter sowjetischer Kontrolle stehen und unsere Position geschwächt ist, müssen wir um Frieden bitten, um eine völlige Katastrophe zu verhindern."
