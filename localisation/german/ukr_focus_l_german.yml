  SPA_bring_back_the_pearl:0 "Bring die Perle zurück"
 SPA_bring_back_the_pearl_desc:0 "Die Philippinen, die Perle des spanischen Reiches, gingen nach dem amerikanisch-spanischen Krieg 1898 verloren. Es ist Zeit, sie zurückzuholen" 
GRE_our_lost_capital: "Unser verlorenes Kapital"
 GRE_our_lost_capital_desc: "Konstantinopel, das antike Herz des Byzantinischen Reiches und Kronjuwel der griechischen Zivilisation, ging 1453 an die Osmanen verloren. Seit Jahrhunderten träumen die Griechen davon, ihre ewige Stadt zurückzuerobern. Jetzt, da unsere Nation wieder erstarkt und unsere Armeen stark sind, ist es an der Zeit, das wiederherzustellen, was rechtmäßig uns gehört – den byzantinischen Adler noch einmal über der Hagia Sophia zu hissen."
 GRE_north_africa: "Griechisches Nordafrika"
    GRE_north_africa_desc: "Die griechische Präsenz in Nordafrika ist seit Jahrhunderten eine Quelle des Stolzes und des Wohlstands. Durch die Ausweitung unseres Einflusses und die Errichtung einer Hochburg in dieser Region können wir wichtige Handelswege und Ressourcen sichern und so das kontinuierliche Wachstum und die Stärke unserer Nation sicherstellen."
  SPR_connecting_the_communes:0 "Die Kommunen verbinden"
 SPR_connecting_the_communes_desc:0 "Indem wir alle verschiedenen kleinen Gemeinden über Funk miteinander verbinden, können wir unseren neuen Lebensstil weiterleben, uns aber besser organisieren."
 SPR_provincial_meetings:0 "Provinztreffen"
 SPR_provincial_meetings_desc:0 "Jeden Monat kommen alle größten Gemeinden einer Provinz zusammen, um ihre Probleme zu besprechen. Dies sollte interne Machtkämpfe reduzieren und sicherstellen, dass der anarchistische Traum am Leben bleibt!"
SPR_national_meetings_desc:0 "Einmal im Quartal entsenden alle Gemeinden einen Delegierten zu einer Landesversammlung. Hier werden wir Zukunftspläne besprechen und unsere Träume koordinieren."
 SPR_lighting_the_way:0 "Den Weg erhellen"
 SPR_lighting_the_way_desc:0 "Wer seinen Platz kennt und akzeptiert, muss zum Wohle aller vorangebracht werden. Sie werden den Weg des Anarchismus erhellen und der Welt den wahren Weg zeigen."
SPR_convert_the_masses:0 "Wandeln Sie neue Länder um"
SPR_convert_the_masses_desc:0 "Die neu eroberten Länder werden von Menschen bevölkert, die unseren Weg noch nicht verstehen. Wir müssen die wahren Gläubigen unserer Sache entsenden, um unsere neuen Schüler zu unterrichten und anzuleiten."
SPR_embarce_the_future:0 "Umfassen Sie die Zukunft"
SPR_embarce_the_future_desc:0 "Menschen auf unseren Weg zu bekehren, ist arbeitskräfteintensiv. Mit unseren Neuinvestitionen in moderne Elektronik können wir diese jedoch nutzen, um mit weniger Aufwand mehr Menschen zu erreichen."
SPR_the_peoples_armada:0 "Die Volksarmada"
SPR_the_peoples_armada_desc:0 "Der Bau der Volksflotte hat begonnen, aber wir müssen die Produktion steigern, wenn wir den Nabelmächten, die uns umgeben, nahe kommen wollen."
SPR_expand_mining_rights:0 "Erweitern Sie die Bergbaurechte"
SPR_expand_mining_rights_desc:0 "Wir müssen sicherstellen, dass wir genug Ressourcen haben, um durchzuhalten. Indem wir jedem das Recht geben, auf seinem eigenen Land abzubauen, werden wir viel haben, um uns gegen die Großmächte, die uns umgeben, zu wehren."
SPR_expand_portugese_resources:0 "Portugiesische Ressourcen erweitern"
SPR_expand_portugese_resources_desc:0 "Da der portugiesische Staat und ihre alten Kolonien jetzt Teil unserer Gemeinde sind, sollten wir sie nutzen, um Zugang zu der letzten Ressource zu erhalten, die uns in die neue Ära treibt, Öl."
SPR_manpower_minimum_victory:0 "Mehr als §Y75.000.000§! Bevölkerung"
SPR_victory:0 "Sieg!"
SPR_victory_desc:0 "Wir haben es geschafft! Es gibt deutlich mehr Menschen, die jetzt Teil unserer Gemeinde sind, alles, was wir tun müssen, ist, ihnen unseren Weg zu zeigen. Wenn das passiert, werden wir unaufhaltsam sein. Die ganze Welt wird den anarchistischen Weg kennen!"
SPA_master_of_the_mediterranean:0 "Meister des Mittelmeers"
SPA_master_of_the_mediterranean_desc:0 "Mit dem imperialen Plan müssen wir zuerst klein anfangen. Italien regiert derzeit das Mittelmeer, aber ihre Macht versagt. Duce Mussolini fährt sein Land durch den Dreck, also ist dies der perfekte Zeitpunkt, um die Produktion zu erhöhen, um ihn und seine gescheiterten Ambitionen zu überholen."
SPA_german_tankbuilding_expertise:0 "Deutsches Tankbau-Know-how"
SPA_german_tankbuilding_expertise_desc:0 "Die Deutschen sind derzeit die erfahrensten Panzerbauer der Welt. Durch die Einladung deutscher Experten konnten wir einige dieser Kriegsmaschinen selbst herstellen."
SPA_the_last_threat_on_the_peninsula:0 "Die letzte Bedrohung auf der Halbinsel"
SPA_the_last_threat_on_the_peninsula_desc:0 "Wenn unsere Grenzen sicher sind und unsere Wirtschaft wieder funktioniert, gibt es eine letzte Bedrohung für unsere Nation. Unsere portugiesischen Nachbarn können als Schauplatz für weitere Angriffe genutzt werden, wir sollten sie ausschalten, um diese Unvermeidlichkeit zu verhindern!"
SPA_italian_islands_for_support:0 "Italienische Insel für Unterstützung"
SPA_italian_islands_for_support_desc:0 "Wir sind bereit, die Alliierten gegen die Bedrohung durch die Achsenmächte zu unterstützen, aber wir müssten angemessen entschädigt werden. Die italienischen Inseln im Mittelmeer wären gut, um unsere Dominanz zu sichern."
SPA_claim_mediterranean_islands:0 "Beanspruche die Mittelmeerinseln"
SPA_claim_mediterranean_islands_desc:0 "Da die Halbinsel sicher und industrietauglich ist, sind wir bereit, das Mittelmeer als unsere zu beanspruchen!"
SPA_the_organic_law:0 "Organgesetz"
SPA_the_organic_law_desc:0 "Das Organgesetz wird die Regierung für die Verabschiedung aller Gesetze voll verantwortlich machen. Alle anderen offiziellen Stellen werden auf nur beratende Positionen reduziert. Dies wird unserem Anführer mehr Macht geben, uns durch diese schwierigen Zeiten zu bringen!"
SPA_mineral_self_sufficiency:0 "Sicherstellung der Mineralstoffselbstversorgung"
SPA_mineral_self_sufficiency_desc:0 "Jetzt, da wir bei Lebensmitteln autark sind, müssen wir auch sicherstellen, dass wir für unseren Stahl und andere importierte Baumaterialien nicht auf externe Quellen angewiesen sind. Wir müssen die Minen weiter ausbauen!"
SPA_expand_navel_aircraft:0 "Marineflugzeuge erweitern"
SPA_expand_navel_aircraft_desc:0 "Wir sind umgeben von Meeren und Ozeanen. Wenn wir sie retten wollen, können wir uns nicht nur auf unsere Verbündeten verlassen, unsere Flugzeuge sollten uns auch schützen können."
SPA_expand_the_universities:0 "Erweitern Sie die Universitäten"
SPA_expand_the_universities_desc:0 "Unsere klügsten Köpfe arbeiten jetzt an militärischen Technologien, aber sie haben nicht die Ressourcen, um so schnell wie möglich zu arbeiten. Eine Erweiterung der Universitäten ist notwendig, um mit anderen Ländern kompatibel zu bleiben!"
SPA_integrate_portugal:0 "Portugal integrieren"
SPA_integrate_portugal_desc:0 "Portugal hat sich immer gegen spanische Einflüsse gewehrt, aber mit genügend Zeit werden die Portugiesen sehen, wer sie wirklich sind."
SPA_the_imperial_fleet:0 "Die kaiserliche Flotte"
SPA_the_imperial_fleet_desc:0 "Auf dem Höhepunkt des spanischen Imperiums im 17. Jahrhundert konkurrierten wir in Größe und Stärke mit der britischen Marine. Doch jetzt sind wir nur noch ein Schatten unseres früheren Selbst. Es ist Zeit, sich mehr auf die Schiffsproduktion und -forschung zu konzentrieren!"
SPA_reconstruct_the_empire_of_old:0 "Rekonstruieren Sie das Imperium der Alten"
SPA_reconstruct_the_empire_of_old_desc:0 "Es ist Zeit für das spanische Reich, sein altes rechtes Land wieder zu integrieren! Die meisten Länder Süd- und Mittelamerikas sprechen bereits die Sprache und folgen unseren Bräuchen, daher ist es an der Zeit, sie vollständig als spanische Staatsbürger zu akzeptieren."
SPA_for_the_spanish_imperium:0 "Für das spanische Imperium!"
SPA_for_the_spanish_imperium_desc:0 "Der Krieg um Amerika ist bereit, es ist Zeit, unser altes Imperium wieder aufzubauen. Für das spanische Imperium!"
SPR_allied_recovery_aid:0 "Alliierte Wiederherstellungshilfe"
SPR_allied_recovery_aid_desc:0 "Sowohl das Vereinigte Königreich als auch die Vereinigten Staaten haben in den letzten Jahren ein großes industrielles Wachstum erlebt. Sie haben uns bei unserem Streben vielleicht nicht geholfen, aber wir können ihre Ergebnisse nicht ignorieren. Wenn wir um Hilfe bitten, können wir vielleicht stärker werden als vor dem Bürgerkrieg."
SPR_industrial_aid:0 "Industriehilfe"
SPR_industrial_aid_desc:0 "Unsere Branche ist das, was am meisten Unterstützung braucht. Wir haben in den letzten Jahren stagniert und sind sogar geschrumpft, wenn wir das rückgängig machen könnten, könnten wir uns selbst helfen!"
SPR_naval_aid:0 "Marinehilfe"
SPR_naval_aid_desc:0 "Da unsere Marine in Trümmern liegt und viel Wissen verloren gegangen ist, sollten wir uns jetzt auf die Marine konzentrieren!"
SPR_military_aid:0 "Militärhilfe"
SPR_military_aid_desc:0 "Da sich unsere Branche erholt und wächst, können wir jetzt auf unsere militärische Produktion blicken. Wenn wir damit beginnen können, sollten wir in der Lage sein, ein respektables Mitglied der Verbündeten zu werden!"
SPR_embrace_free_market_capitalism:0 "Befürworten Sie den Kapitalismus des freien Marktes"
SPR_embrace_free_market_capitalism_desc:0 "Wir haben es geschafft! Alle Branchen innerhalb unserer Branche wachsen rasant. Es ist Zeit für uns, den Kapitalismus voll und ganz anzunehmen und in die Zukunft zu blicken."
SPR_war_resources:0 "Kriegsressourcen"
SPR_war_resources_desc:0 "Wir sehen uns wieder im Krieg, und gegen die Faschisten nicht weniger. Wir müssen alles, was wir können, aus unserem Boden holen, um die Kriegsindustrien zu befeuern!"
SPR_the_fight_against_fascism:0 "Der Kampf gegen den Faschismus"
SPR_the_fight_against_fascism_desc:0 "Das war erst der Anfang, wir müssen uns auf den Ansturm der faschistischen Kriegsmaschinerie vorbereiten."
SPR_northern_defences:0 "Nordverteidigung"
SPR_northern_defences_desc:0 "Angesichts der faschistischen Bedrohung unserer nördlichen Grenze müssen wir uns auf das Schlimmste vorbereiten."
SPR_construct_a_new_aerial_academy:0 "Baue eine neue Luftakademie"
SPR_construct_a_new_aerial_academy_desc:0 "Mit dem Ausbau der anderen militärischen Zweige müssen wir eine Zweigstelle für unsere neue Luftwaffe einrichten. Dadurch wird sichergestellt, dass nur die besten Piloten in unsere Jäger eindringen!"
SPR_a_new_generation_of_fighters:0 "Eine neue Generation von Kämpfern"
SPR_a_new_generation_of_fighters_desc:0 "Da in diesem Moment neue Piloten ausgebildet werden, müssen wir in der Lage sein, sie in neue Flugzeuge zu stecken, wenn wir wollen, dass sie effektiv sind. Wir müssen die Forschung zur Kampftechnologie intensivieren!"
SPA_the_empire_restored:0 "Das Imperium wiederhergestellt"
SPA_the_empire_restored_desc:0 "Es ist vollbracht, das Imperium hat sich von den Bränden des Bürgerkriegs erholt. Weitere Investitionen in die Industrie und die Menschen, die wir getätigt haben, können wir nun in die Zukunft blicken."
SPA_integrate_the_union:0 "Integration der Union"
SPA_integrate_the_union_desc:0 "Mit ganz Iberia unter unserer Kontrolle. Wir können jeden unter unserem neuen Imperium integrieren."
SPA_expand_portugese_resources:0 "Erweitere portugiesische Ressourcen"
SPA_expand_portugese_resources_desc:0 "Mit der Sicherung der neuen Kolonien können wir nach neuen Ressourcen suchen, um unsere Position gegenüber den Demokratien, die uns umgeben, zu stärken."
SPA_a_fleet_worthy_of_a_kingdom:0 "Eine Flotte, die eines Königreichs würdig ist"
SPA_a_fleet_worthy_of_a_kingdom_desc:0 "Wir werden eine Flotte bauen, auf die das ganze Königreich stolz sein kann. Mit der Zeit kann es sogar mit der britischen Flotte mithalten!"
SPA_expand_naval_output:0 "Marineausgang erweitern"
SPA_expand_naval_output_desc:0 "Unsere Ambitionen für unsere Marine sind groß, daher müssen wir in unsere Werften und die dort arbeitenden Menschen investieren. Dies gibt uns die Chance, die Flotte aufzubauen, die wir bekommen werden."
SPA_claim_new_colonies:0 "Neue Kolonien einfordern"
SPA_claim_new_colonies_desc:0 "Wir haben mehrere Kolonien, aber sie sind getrennt und weit voneinander entfernt. Das erschwert die Absicherung. Wir müssen sie mit längeren Landstrichen verbinden!"
SPA_a_monarchist_industry:0 "Eine monarchistische Industrie"
SPA_a_monarchist_industry_desc:0 "Die Demokratien in Großbritannien und den Vereinigten Staaten sind vom Stolz auf ihr Wirtschaftswachstum geblendet. Wir werden ihnen mit dem Wissen unseres neuen Monarchen zeigen, was wir erreichen können!"
SPR_fascist_recovery_aid:0 "Faschistische Wiederherstellungshilfe"
SPR_fascist_recovery_aid_desc:0 "Jetzt, da wir einen gemeinsamen Feind haben, sind die Faschisten bereit, uns zu helfen, uns zu erholen, damit wir effektiver im Krieg kämpfen können."
SPR_german_industrial_aid:0 "Deutsche Gewerbehilfe"
SPR_german_industrial_aid_desc:0 "Deutschland ist bereit, unserer Branche zu helfen. Wir nutzen dies am besten, solange sie noch willens und in der Lage sind."
SPR_italian_naval_aid:0 "Italienische Marinehilfe"
SPR_italian_naval_aid_desc:0 "Die Italiener sind bereit, uns zu helfen, unsere verlorene Seestärke zurückzugewinnen."
SPR_communist_recovery_aid:0 "Kommunistische Wiederherstellungshilfe"
SPR_communist_recovery_aid_desc:0 "Mit dem Fünfjahresplan können wir mit der vollständigen Erholung des spanischen Staates beginnen. Mit Hilfe der Sowjetunion können wir diesen Prozess beschleunigen."
SPR_communist_naval_aid:0 "Kommunistische Seehilfe"
SPR_communist_naval_aid_desc:0 "Die Sowjets sind vielleicht keine Seemacht wie das Vereinigte Königreich oder die Vereinigten Staaten, aber sie können uns sicherlich beim Wiederaufbau einer grundlegenden Seestreitmacht helfen."
SPR_communist_military_aid:0 "Kommunistische Militärhilfe"
SPR_communist_military_aid_desc:0 "Wenn wir hoffen, ein mächtiger Verbündeter der Sowjets zu sein, brauchen wir Hilfe beim Wiederaufbau unserer militärischen Infrastruktur. Mit etwas grundlegender Hilfe können wir unsere Branche ankurbeln."
SPR_iberian_communist_paradise:0 "Iberisches Kommunistisches Paradies"
SPR_iberian_communist_paradise_desc:0 "Iberia ist vereint und unsere Branche floriert. Die iberischen Arbeiter bekommen jetzt wirklich das kommunistische Paradies, das versprochen wurde."
SPR_unite_red_iberia:0 "Unite Red Iberia"
SPR_unite_red_iberia_desc:0 "Alle Arbeiter auf der iberischen Halbinsel sollten von ihren kapitalistischen Oberherren befreit werden. Lasst uns die Portugiesen befreien!"
SPR_expand_the_working_class:0 "Erweitern Sie die Arbeiterklasse"
SPR_expand_the_working_class_desc:0 "Mit dem unter den Menschen verteilten Reichtum erweitern wir die Arbeiterklasse, um sicherzustellen, dass alle einen gleichberechtigten Start haben. Niemand soll für die Möglichkeit zu arbeiten zurückgelassen werden."
SPR_fight_the_fake_socialists:0 "Bekämpfe die falschen Sozialisten"
SPR_fight_the_fake_socialists_desc:0 "Die Sowjets haben immer gesagt, dass sie die wirklichen Sozialisten in dieser Welt sind, aber sie sind kaum mehr als eine soziale Diktatur. Wir werden ihnen die wahre Macht des Sozialismus zeigen!"
SPR_supply_the_tide:0 "Liefern Sie die Flut"
SPR_supply_the_tide_desc:0 "Mit modernen Waffen müssen wir sicherstellen, dass unsere Soldaten immer voll ausgerüstet sind. Dazu muss die Rüstungsindustrie ausgebaut werden."
SPR_resources_for_the_tide:0 "Ressourcen für die Flut"
SPR_resources_for_the_tide_desc:0 "Mit der Expansion der Militärindustrie müssen wir sicherstellen, dass wir die Ressourcen haben, um die Fabriken am Laufen zu halten."
SPR_protect_against_the_fascists:0 "Schützen Sie sich vor den Faschisten"
SPR_protect_against_the_fascists_desc:0 "Die Faschisten sind eine große Bedrohung für unsere nördliche Grenze. Um sicherzustellen, dass wir geschützt bleiben, müssen wir eine Festungslinie bauen, damit wir uns behaupten können."
SPR_iberian_socialism:0 "Iberischer Sozialismus"
SPR_iberian_socialism_desc:0 "Die Halbinsel ist sicher und wir kämpfen aktiv gegen die falschen Kommunisten in Russland. Mit der Sozialwirtschaft, die für unsere Arbeiter sorgt und Waffen für unseren Soldaten herstellt, rufen wir unseren Weg des Sozialismus zum Sieg auf. Die ganze Welt wird sehen, dass unser Weg der Weg nach vorne ist!"
