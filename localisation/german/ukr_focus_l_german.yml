 NZL_ANZAC_neutrality_DEF:0 "die ANZAC-Föderation"
 NZL_ANZAC_communism:0 "ANZAC Sozialistische Republik"
 NZL_ANZAC_communism_DEF:0 "die Sozialistische Republik ANZAC"
 NZL_ANZAC_fascism:0 "ANZAC-Reich"
 NZL_ANZAC_fascism_DEF:0 "das ANZAC-Reich"
 UKR_investments: "Investitionen in die Republik"

