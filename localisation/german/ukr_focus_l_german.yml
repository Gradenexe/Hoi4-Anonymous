 SIK_part_of_the_ussr:0 "Teil der Sowjetunion"
 SIK_part_of_the_ussr_desc:0 "Mit dem zunehmenden sozialistischen Einfluss und den militärischen Verbindungen zu Moskau wandelt sich Sinkiang offiziell in eine vollwertige Sowjetrepublik. Die Integration unserer Verwaltung in die UdSSR gewährleistet Stabilität, industrielle Modernisierung und ideologische Einheit mit der Komintern." 
  sterbenka.1.t:0 "Untergang der Sowjetunion"
 sterbenka.1.d:0 "Die Sowjetunion ist zusammengebrochen. Mit dem Verlust ihrer Großstädte und wichtigen Industriezentren ist die Rote Armee in Schwierigkeiten. Überall in den riesigen Weiten des zerfallenden Reiches nutzen unterworfene Nationen und unterdrückte Völker die Gelegenheit, ihre Ketten zu sprengen und ihre Unabhängigkeit zu erklären."
 sterbenka.1.a:0 "Eine neue Ära beginnt."
 sterbenka.1.b:0 "Wir werden niemals aufgeben!"

 sterbenka.2.t:0 "Buchara-Aufstand"
 sterbenka.2.d:0 "Die Menschen in Buchara haben sich zu einer bewaffneten Rebellion erhoben! Lokale Milizen haben die Fremdherrschaft und die zentrale Unterdrückung satt und haben die Kontrolle über wichtige Regierungsgebäude übernommen und die Unabhängigkeit Bucharas erklärt."
 sterbenka.2.a:0 "Übernehmen Sie die Kontrolle über Buchara."
 sterbenka.2.b:0 "Zerschlage die Rebellion!"
 sterbenka.2.c:0 "Lassen Sie sie ihre Unabhängigkeit haben."

 sterbenka.3.t:0 "Karakalpakstan-Aufstand"
 sterbenka.3.d:0 "Die Spannungen in der Region sind endlich überwunden. Die Karakalpaken haben zu den Waffen gegriffen, ihre Souveränität erklärt und einen unabhängigen Staat Karakalpakstan gegründet. Sie sammeln lokale Kräfte, um ihre neu proklamierten Grenzen zu verteidigen."
 sterbenka.3.a:0 "Übernehmen Sie die Kontrolle über Karakalpakstan."
 sterbenka.3.b:0 "Zerschlage die Rebellion!"
 sterbenka.3.c:0 "Lassen Sie sie ihre Unabhängigkeit haben."

 sterbenka.4.t:0 "Chiwa-Aufstand"
 sterbenka.4.d:0 "Rebellen in Chiwa haben offiziell ihre Unabhängigkeit erklärt! Bewaffnete Aufständische haben die örtlichen Garnisonen überwältigt, unsere Autorität in Frage gestellt und ihre eigene provisorische Regierung in der Region errichtet."
 sterbenka.4.a:0 "Übernimm die Kontrolle über Chiwa."
 sterbenka.4.b:0 "Zerschlage die Rebellion!"
 sterbenka.4.c:0 "Lassen Sie sie ihre Unabhängigkeit haben."

 sterbenka.5.t:0 "Aufstand in Abchasien"
 sterbenka.5.d:0 "Abchasische Separatisten haben die Kontrolle über die Region übernommen. Sie haben das Chaos ausgenutzt, unsere Administratoren vertrieben und eine unabhängige Republik Abchasien ausgerufen, die bereit ist, für ihre Freiheit zu kämpfen."
 sterbenka.5.a:0 "Übernehmen Sie die Kontrolle über Abchasien."
 sterbenka.5.b:0 "Zerschlage die Rebellion!"
 sterbenka.5.c:0 "Lassen Sie sie ihre Unabhängigkeit haben."

 sterbenka.6.t:0 "Krimaufstand"
 sterbenka.6.d:0 "Die Halbinsel Krim ist in Aufruhr! Lokale Kräfte haben sich in einer koordinierten Rebellion erhoben und strategische Häfen und Militäreinrichtungen erobert, um eine unabhängige Krim zu erklären."
 sterbenka.6.a:0 "Übernehmen Sie die Kontrolle über die Krim."
 sterbenka.6.b:0 "Zerschlage die Rebellion!"
 sterbenka.6.c:0 "Lassen Sie sie ihre Unabhängigkeit haben."
 POL_pilsutskij_dreams_of_federation:0 "Pilsudskis Träume von einer Föderation"
 POL_pilsutskij_dreams_of_federation_desc:0 "Józef Piłsudskis Vision eines Intermariums – einer Föderation mittel- und osteuropäischer Länder – sollte ein Gegengewicht zum russischen und deutschen Imperialismus bilden. Wir müssen diesen großen Plan wiederbeleben, um unsere kollektive Unabhängigkeit zu sichern."
 
 POL_give_ukraine_autonomy:0 "Geben Sie der Ukraine Autonomie"
 POL_give_ukraine_autonomy_desc:0 "Um die Loyalität unserer ukrainischen Minderheit sicherzustellen und den Grundstein für eine umfassendere Föderation zu legen, müssen wir ihnen erhebliche regionale Autonomie gewähren."
 
 POL_give_WUPR_for_federation:0 "Geben Sie WUPR für Föderation ein"
 POL_give_WUPR_for_federation_desc:0 "Die Gründung der Westukrainischen Volksrepublik als konstituierendes Mitglied unserer Föderation wird unsere Ostflanke stärken und ukrainische Patrioten für unsere Sache gewinnen."
 
 POL_give_belarus_autonomy:0 "Geben Sie Weißrussland Autonomie"
 POL_give_belarus_autonomy_desc:0 "Das belarussische Volk verdient eine Stimme in seinen eigenen Angelegenheiten. Die Gewährung von Autonomie wird ihre Unterstützung gewinnen und regionale Spannungen verringern."
 
 POL_give_WBPR_for_federation:0 "Geben Sie WBPR für Federation an"
 POL_give_WBPR_for_federation_desc:0 "Mit der Formalisierung der Westlichen Weißrussischen Volksrepublik machen wir einen weiteren wichtigen Schritt in Richtung eines geeinten, föderalen Gemeinwesens, das in der Lage ist, ausländischer Aggression zu widerstehen."
 
 POL_give_lithuania_autonomy:0 "Geben Sie Litauen Autonomie"
 POL_give_lithuania_autonomy_desc:0 "Der Wiederaufbau von Brücken zu den Litauern erfordert Kompromisse. Die Anerkennung ihrer Autonomie ist der erste Schritt zur Wiederherstellung der historischen polnisch-litauischen Union."
 
 POL_give_ELPR_for_federation:0 "Geben Sie ELPR für die Föderation"
 POL_give_ELPR_for_federation_desc:0 "Durch die Gründung der Ostlitauischen Volksrepublik wird die Region fest in unser föderales System integriert und Frieden und Zusammenarbeit zwischen unseren Völkern gewährleistet."
 
 POL_give_vilno_to_belarus:0 "Gib Wilno an Weißrussland"
 POL_give_vilno_to_belarus_desc:0 "Die Übertragung der Verwaltung der Region Wilno an Weißrussland ist eine schwierige Entscheidung, aber ein notwendiges diplomatisches Manöver, um unsere Ostgrenzen zu stabilisieren und interne föderale Forderungen zu erfüllen."
 
 POL_fortify_kashubia_and_silesia:0 "Kaschubien und Schlesien befestigen"
 POL_fortify_kashubia_and_silesia_desc:0 "Die Westgrenze ist verwundbar. Wir müssen in der Kaschubei und in Schlesien umfangreiche Befestigungen errichten, um jegliche aggressiven Bewegungen aus Deutschland abzuschrecken."
 
 POL_autonomy_for_kashubia_and_silesia:0 "Autonomie für Kaschubien und Schlesien"
 POL_autonomy_for_kashubia_and_silesia_desc:0 "Die Gewährung politischer Autonomie für Kaschubien und Schlesien wird die nationale Einheit stärken und die lokale Bevölkerung dazu ermutigen, ihre Heimat leidenschaftlich zu verteidigen."
 
 POL_autonomy_for_all:0 "Autonomie für alle"
 POL_autonomy_for_all_desc:0 "Eine wahre Föderation lebt von der Freiheit ihrer Teile. Wir werden umfassende Reformen durchführen, die allen großen ethnischen und regionalen Gruppen innerhalb unserer Grenzen Autonomie gewähren."
 
 POL_territory_for_guarantee:0 "Garantiegebiet"
 POL_territory_for_guarantee_desc:0 "Wir können unseren Nachbarn bestimmte umstrittene Gebiete gegen strenge, verbindliche Sicherheitsgarantien anbieten. Land kann zurückgewonnen werden, aber das Überleben ist von größter Bedeutung."
 
 POL_united_by_will:0 "Vereint durch Willen"
 POL_united_by_will_desc:0 "Unsere Föderation wird nicht durch Gewalt gebunden sein, sondern durch den gemeinsamen Wunsch nach Freiheit, Wohlstand und gegenseitiger Verteidigung gegen Tyrannei."
 
 POL_unite_the_federation:0 "Vereint die Föderation"
 POL_unite_the_federation_desc:0 "Es ist an der Zeit, die Gründung unserer neuen Föderation offiziell zu verkünden. Von der Ostsee bis zum Schwarzen Meer stehen wir als Einheit da!"
 
 POL_defence_army_of_federation:0 "Verteidigungsarmee der Föderation"
 POL_defence_army_of_federation_desc:0 "Um unsere riesigen neuen Grenzen zu schützen, müssen wir die Streitkräfte aller Mitgliedsstaaten in einer einzigen, einheitlichen Verteidigungsarmee der Föderation integrieren."
 
 POL_integrate_lubush:0 "Integrieren Sie Lubush"
 POL_integrate_lubush_desc:0 "Die Region Lubusch muss vollständig in unsere Verwaltungs- und Militärstruktur integriert werden, um die Stabilität der Westgrenze zu gewährleisten."
 
 POL_no_more_polonization:0 "Keine Polonisierung mehr"
 POL_no_more_polonization_desc:0 "Wir müssen die aggressive kulturelle Assimilation aufgeben. Die Akzeptanz der vielfältigen Kulturen unserer Föderation wird uns stärker machen, als es eine erzwungene Homogenität jemals könnte."
 
 POL_dreams_come_true:0 "Träume werden wahr"
 POL_dreams_come_true_desc:0 "Piłsudskis große Vision wird endlich Wirklichkeit. Wir haben in Osteuropa ein unaufhaltsames Bündnis geschmiedet, das in der Geschichte nachhallen wird."
 
 POL_commonwealth_of_many_nations:0 "Gemeinschaft vieler Nationen"
 POL_commonwealth_of_many_nations_desc:0 "Wir sind nicht mehr nur Polen; Wir sind das Commonwealth vieler Nationen, eine Bastion der Freiheit und Vielfalt, die sich dem Totalitarismus entgegenstellt."
 
 POL_complete_the_mission_of_prometheism:0 "Schließe die Mission des Prometheismus ab"
 POL_complete_the_mission_of_prometheism_desc:0 "Der Prometheismus zielte darauf ab, das Russische Reich durch die Unterstützung nationalistischer Unabhängigkeitsbewegungen zu schwächen. Jetzt werden wir zu Ende bringen, was wir begonnen haben, und die sowjetische Bedrohung von innen heraus abbauen."
 
 POL_unite_west_republics:0 "Vereint die Westrepubliken"
 POL_unite_west_republics_desc:0 "Die Zusammenführung der westlichen Republiken unter einem einzigen, einheitlichen Verwaltungsschirm wird unsere Wirtschaft rationalisieren und unsere militärische Bereitschaft festigen."

 SOV_winter_war:0 "Der Winterkrieg"
 SOV_winter_war_desc:0 "Die Weigerung Finnlands, wichtige Grenzgebiete in der Nähe von Leningrad abzutreten, lässt uns keine andere Wahl. Wir müssen unsere strategischen Ziele notfalls mit Gewalt sichern."
 
 SOV_create_finnish_democratic_republic:0 "Schaffen Sie die Demokratische Republik Finnland"
 SOV_create_finnish_democratic_republic_desc:0 "Durch die Bildung einer befreundeten, sozialistischen Regierung in Finnland können wir sicherstellen, dass unsere Nordgrenze auf ewig vor imperialistischen Bedrohungen geschützt bleibt."
 
 SOV_create_finnish_karelian_SSR:0 "Gründung der Karelo-Finnischen SSR"
 SOV_create_finnish_karelian_SSR_desc:0 "Die Integration der eroberten finnischen Gebiete in die Karelisch-Finnische SSR wird die Region fest an die Sowjetunion binden und unsere Macht nach Skandinavien projizieren."
 
 SOV_karelia_for_gold:0 "Karelien für Gold"
 SOV_karelia_for_gold_desc:0 "Umfangreiche Rohstoffgewinnung und Industrieinvestitionen in Karelien werden der sowjetischen Kriegsmaschinerie enorme wirtschaftliche Vorteile bringen."
 
 SOV_triumphant_return_to_helsinki:0 "Triumphale Rückkehr nach Helsinki"
 SOV_triumphant_return_to_helsinki_desc:0 "Die Rote Armee marschiert siegreich in Helsinki ein. Wir haben erreicht, wovon die Zaren nur träumen konnten: die totale Hegemonie über den baltischen Norden."
 
 SOV_the_extension_of_the_autonomy_of_the_moldavian_ASSR:0 "Erweitern Sie die Autonomie der Moldauischen ASSR"
 SOV_the_extension_of_the_autonomy_of_the_moldavian_ASSR_desc:0 "Die Gewährung weiterer Autonomie für die Moldauische ASSR wird das lokale Proletariat stärken und einen Ausgangspunkt für unsere zukünftigen Ambitionen auf dem Balkan bieten."
 
 SOV_great_moldovian_SSR:0 "Große Moldauische SSR"
 SOV_great_moldovian_SSR_desc:0 "Mit der Integration Bessarabiens wird die Moldauische ASSR zum Status einer vollwertigen Unionsrepublik erhoben – der Großen Moldauischen SSR!"
if_focus_will_be_set_automatically_tt:0 "Dieser Fokus wird automatisch abgeschlossen, sobald die Bedingungen erfüllt sind."
sterbenka.1.t:0 "Untergang der Sowjetunion"
 sterbenka.1.d:0 "Die Sowjetunion ist zusammengebrochen. Mit dem Verlust ihrer Großstädte und wichtigen Industriezentren ist die Rote Armee in Schwierigkeiten. Überall in den riesigen Weiten des zerfallenden Reiches nutzen unterworfene Nationen und unterdrückte Völker die Gelegenheit, ihre Ketten zu sprengen und ihre Unabhängigkeit zu erklären."
 sterbenka.1.a:0 "Eine neue Ära beginnt."
 sterbenka.1.b:0 "Wir werden niemals aufgeben!"

 sterbenka.2.t:0 "Buchara-Aufstand"
 sterbenka.2.d:0 "Die Menschen in Buchara haben sich zu einer bewaffneten Rebellion erhoben! Lokale Milizen haben die Fremdherrschaft und die zentrale Unterdrückung satt und haben die Kontrolle über wichtige Regierungsgebäude übernommen und die Unabhängigkeit Bucharas erklärt."
 sterbenka.2.a:0 "Übernehmen Sie die Kontrolle über Buchara."
 sterbenka.2.b:0 "Zerschlage die Rebellion!"
 sterbenka.2.c:0 "Lassen Sie sie ihre Unabhängigkeit haben."

 sterbenka.3.t:0 "Karakalpakstan-Aufstand"
 sterbenka.3.d:0 "Die Spannungen in der Region sind endlich überwunden. Die Karakalpaken haben zu den Waffen gegriffen, ihre Souveränität erklärt und einen unabhängigen Staat Karakalpakstan gegründet. Sie sammeln lokale Kräfte, um ihre neu proklamierten Grenzen zu verteidigen."
 sterbenka.3.a:0 "Übernehmen Sie die Kontrolle über Karakalpakstan."
 sterbenka.3.b:0 "Zerschlage die Rebellion!"
 sterbenka.3.c:0 "Lassen Sie sie ihre Unabhängigkeit haben."

 sterbenka.4.t:0 "Chiwa-Aufstand"
 sterbenka.4.d:0 "Rebellen in Chiwa haben offiziell ihre Unabhängigkeit erklärt! Bewaffnete Aufständische haben die örtlichen Garnisonen überwältigt, unsere Autorität in Frage gestellt und ihre eigene provisorische Regierung in der Region errichtet."
 sterbenka.4.a:0 "Übernimm die Kontrolle über Chiwa."
 sterbenka.4.b:0 "Zerschlage die Rebellion!"
 sterbenka.4.c:0 "Lassen Sie sie ihre Unabhängigkeit haben."

 sterbenka.5.t:0 "Aufstand in Abchasien"
 sterbenka.5.d:0 "Abchasische Separatisten haben die Kontrolle über die Region übernommen. Sie haben das Chaos ausgenutzt, unsere Administratoren vertrieben und eine unabhängige Republik Abchasien ausgerufen, die bereit ist, für ihre Freiheit zu kämpfen."
 sterbenka.5.a:0 "Übernehmen Sie die Kontrolle über Abchasien."
 sterbenka.5.b:0 "Zerschlage die Rebellion!"
 sterbenka.5.c:0 "Lassen Sie sie ihre Unabhängigkeit haben."

 sterbenka.6.t:0 "Krimaufstand"
 sterbenka.6.d:0 "Die Halbinsel Krim ist in Aufruhr! Lokale Kräfte haben sich in einer koordinierten Rebellion erhoben und strategische Häfen und Militäreinrichtungen erobert, um eine unabhängige Krim zu erklären."
 sterbenka.6.a:0 "Übernehmen Sie die Kontrolle über die Krim."
 sterbenka.6.b:0 "Zerschlage die Rebellion!"
 sterbenka.6.c:0 "Lassen Sie sie ihre Unabhängigkeit haben."

 sterbenka.7.t:0 "Polnischer Vorschlag"
 sterbenka.7.d:0 "Die polnische Regierung hat sich mit einem unerwarteten Vorschlag an uns gewandt. Als Gegenleistung für die Rückgabe unserer historischen Kerngebiete, die derzeit unter ihrer Verwaltung stehen, fordern sie, dass wir den Status einer integrierten Marionette innerhalb ihrer vorgeschlagenen Föderation akzeptieren. Die Entscheidung liegt in unseren Händen: Opfern wir unsere Souveränität für Land oder lehnen wir ihre Übergriffe ab?"
 sterbenka.7.a:0 "Wir akzeptieren ihre Bedingungen."
 sterbenka.7.b:0 "Wir werden uns niemals vor Warschau beugen!"

 sterbenka.8.t:0 "Vorschlag angenommen"
 sterbenka.8.d:0 "Unsere diplomatischen Bemühungen haben sich ausgezahlt. Sie haben unseren Vorschlag angenommen und sich bereit erklärt, im Austausch für die versprochenen Gebiete eine integrierte Marionette unserer Nation zu werden. Unser Einflussbereich erweitert sich noch einmal."
 sterbenka.8.a:0 "Ausgezeichnete Neuigkeiten."

 sterbenka.9.t:0 "Vorschlag abgelehnt"
 sterbenka.9.d:0 "Unser Vorschlag wurde rundweg abgelehnt. Es scheint, dass ihnen ihre Unabhängigkeit wichtiger ist als die Rückgabe ihres historischen Landes, sodass unsere territorialen und diplomatischen Ambitionen vorerst unerfüllt bleiben."
 sterbenka.9.a:0 "Narren..."
