 UKR_ford_motors_desc:0 "Die Ford Motor Company hat hervorragende Arbeit geleistet und den Amerikanern und anderen alliierten Nationen auf der ganzen Welt in Massenproduktion erschwingliche Kraftfahrzeuge zur Verfügung gestellt. Wenn wir in [Root.Capital.GetName] eine Ford-Manufaktur errichten sollten, könnten wir sowohl Fahrzeuge für unsere eigene Armee bereitstellen als auch einen ordentlichen Gewinn mit dem Export dieser Fahrzeuge in den Westen erzielen."
