AUS_increase_military_cooperation_tt:0 "Erhält §Y2 Offmap-Militärfabriken§! für jedes Land, das eine §G85§! Meinung zu Österreich hat.\n\nDie Länder, die betroffen sein können, sind:\n- @ALB§H[ALB.getnamedefcap]§!\n- @BUL§H[BUL.getnamedefcap]§!\n- @GRE§H[GRE.getnamedefcap]§!\n- @YUG§H[YUG.getnamedefcap]§!\n- @GER§H[GER.getnamedefcap]§!\n- @ROM§H[ROM.getnamedefcap]§!\n- @CZE§H[CZE.getnamedefcap]§!\n- @ITA§H[ITA.getnamedefcap]§!\n- @HUN§H[HUN.getnamedefcap]§!"

AUS_increase_economic_cooperation_tt:0 "Empfängt §Y2 Offmap-Zivilfabriken§! für jedes Land, das eine §G85§! Meinung zu Österreich hat.\n\nDie Länder, die betroffen sein können, sind:\n- @ALB§H[ALB.getnamedefcap]§!\n- @BUL§H[BUL.getnamedefcap]§!\n- @GRE§H[GRE.getnamedefcap]§!\n- @YUG§H[YUG.getnamedefcap]§!\n- @GER§H[GER.getnamedefcap]§!\n- @ROM§H[ROM.getnamedefcap]§!\n- @CZE§H[CZE.getnamedefcap]§!\n- @ITA§H[ITA.getnamedefcap]§!\n- @HUN§H[HUN.getnamedefcap]§!"
 AUS_civilian_support_from_guarantors:0 "Zivile Unterstützung durch Bürgen"
 AUS_civilian_support_from_guarantors_desc:0 "Durch die Stärkung der diplomatischen Beziehungen und die Sicherung der wirtschaftlichen Unterstützung unserer regionalen Bürgen können wir unsere Industriekapazität durch zivile Investitionen steigern."
 AUS_military_support_from_guarantors:0 "Militärische Unterstützung durch Bürgen"
 AUS_military_support_from_guarantors_desc:0 "Die Abstimmung unserer militärischen Ziele mit unseren regionalen Garanten wird es uns ermöglichen, unsere Waffenproduktion auszuweiten und unsere Verteidigungslinien zu modernisieren."
GRE_open_foreign_subsidized_factories_anon_tt:0 "Erhält §Y1 Waffenfabrik§! und §Y1 zivile Fabrik§! für jedes Land, das eine §G80§! Meinung zu Griechenland hat.\n\nDie Länder, die betroffen sein können, sind:\n- @ENG§H[ENG.getnamedefcap]§!\n- @FRA§H[FRA.getnamedefcap]§!\n- @GER§H[GER.getnamedefcap]§!\n- @SOV§H[SOV.getnamedefcap]§!"
GRE_bedrock_of_balkan_financial_stability_anon_tt:0 "Erhält §Y1 zivile Fabrik§! für jedes dieser Länder, wenn ihre Meinung über Griechenland §G50§! übersteigt:\n- @ALB§H[ALB.getnamedefcap]§!\n- @BUL§H[BUL.getnamedefcap]§!\n- @HUN§H[HUN.getnamedefcap]§!\n- @YUG§H[YUG.getnamedefcap]§!\n\nErhält §Y2 zivile Fabriken§! für jedes dieser Länder, wenn ihre Meinung über Griechenland größer ist als §G75§!:\n- @AUS§H[AUS.getnamedefcap]§!\n- @ROM§H[ROM.getnamedefcap]§!\n- @TUR§H[TUR.getnamedefcap]§!\n\nErhält §Y3 zivile Fabriken§!, wenn ihre Meinung über Griechenland größer ist als §G85§!:\n- @CZE§H[CZE.getnamedefcap]§!"
SOV_gold_for_karelia_idea:0 "Gold für Karelien"
 SWI_bop_push_council_small:0 "Ermächtigen Sie den Bundesrat"
 SWI_bop_push_council_small_desc:0 "Gewähren Sie dem Bundesrat umfassendere Gesetzgebungsbefugnisse und verlagern Sie das Machtgleichgewicht um +15 % in Richtung der Kontrolle durch die Zentralregierung."

 SWI_bop_push_cantons_small:0 "Stärkung der kantonalen Autonomie"
 SWI_bop_push_cantons_small_desc:0 "Zurückübertragung der Verwaltungsbefugnisse an die einzelnen Kantone, wodurch sich das Machtgleichgewicht um +15 % zugunsten der Kantone verschiebt."

 SWI_bop_push_council_large:0 "Notfallzentralisierungsdekret"
 SWI_bop_push_council_large_desc:0 "Verabschiedung eines ausserordentlichen Dekrets der Bundesversammlung, um das Machtgleichgewicht um +30 % in Richtung des Bundesrates zu verlagern."

 SWI_bop_push_cantons_large:0 "Kantonales Autonomiereferendum"
 SWI_bop_push_cantons_large_desc:0 "Organisieren Sie eine umfassende landesweite Abstimmung, die den Kantonen souveräne Vorrechte zurückgibt (+30 % zugunsten der Kantone)."

 SWI_bop_campaign_council:0 "Pressekampagne zur Zentralisierung"
 SWI_bop_campaign_council_desc:0 "Finanzieren Sie eine landesweite Kampagne, die sich für eine einheitliche föderale Koordinierung einsetzt. Täglich verlagert sich die Macht auf den Bundesrat (+1,0 %/Tag für 30 Tage)."

 SWI_bop_campaign_cantons:0 "Kampagne für kantonale Freiheiten"
 SWI_bop_campaign_cantons_desc:0 "Finanzieren Sie regionale Versammlungen, die den historischen Föderalismus der Schweizer Kantone verteidigen. Tägliche Machtverlagerung in Richtung der Kantone (+1,0 %/Tag für 30 Tage)."

 SWI_bop_reset_neutral:0 "Proklamieren Sie den nationalen Kompromiss"
 SWI_bop_reset_neutral_desc:0 "Rufen Sie alle Kantonsvertreter und Bundesräte zusammen, um das Gleichgewicht wiederherzustellen und das Machtgleichgewicht wieder genau auf die Mitte (0 %) zu bringen."
 BUL_nationalization_seize_tt:0 "Basierend auf ausländischen Industrieinvestitionen in Bulgarien:\n- @GER §H[GER.GetNameDefCap]§!\n- @SOV §H[SOV.GetNameDefCap]§!\n- @ENG §H[ENG.GetNameDefCap]§!\nFür jede beschlagnahmte ausländische Investition erhält Bulgarien §G+2§! Bauplätze und §G+2§! Zivile Fabriken."
 POR_iberian_arsenal:0 "Iberisches Arsenal"
 POR_iberian_arsenal_desc:0 "Portugal ist seit langem ein Zentrum für die Herstellung und den Export von Waffen. Durch Investitionen in unsere heimische Rüstungsindustrie können wir ein führender Lieferant militärischer Ausrüstung für unsere Verbündeten werden und unsere eigenen Verteidigungsfähigkeiten stärken."

 POR_beauty_of_expansion_idea:0 "Schönheit der Expansion"
 POR_beauty_of_expansion_idea_desc:0 "Das historische Erbe portugiesischer maritimer Entdeckungen und grenzenloser globaler Ambitionen treibt unsere Nation voran. Indem wir über unsere traditionellen Grenzen hinaus expandieren, gestalten wir eine neue Zukunft voller Stärke und Wohlstand."

 ENG_evacuation_assets:0 "Evakuiertes Kolonialvermögen"
 ENG_evacuation_assets_desc:0 "Nach der Auflösung unserer direkten imperialen Herrschaft wurden britische Vermögenswerte, spezialisierte Schwermaschinen, qualifizierte Ingenieure und umgesiedelte Reserven systematisch auf die britischen Inseln zurückgeführt, was zu einem beispiellosen Wiederaufleben der heimischen Industrie führte."
 ENG_commonwealth_trade_preference:0 "Handelspräferenzen des Commonwealth"
 ENG_commonwealth_trade_preference_desc:0 "Durch langjährige bilaterale Abkommen und gegenseitige wirtschaftliche Interdependenz behalten neu unabhängige postkoloniale Nationen exklusive Handelsprivilegien mit Großbritannien und sichern so einen kostengünstigen Zugang zu globalen Ressourcen"
 ENG_former_colony_trade_privilege:0 "Präferenzhandel mit Großbritannien"

 uk_ireland_trade:0 "Anglo-irisches Handelsabkommen"
 uk_ireland_trade_desc:0 "Der Aufbau enger Wirtschaftsbeziehungen und bilateraler Handelsabkommen mit Irland garantiert einen günstigeren Ressourcenaustausch und eine gegenseitige industrielle Entwicklung."
 uk_ireland_new_union:0 "Die neue keltische Union"
 uk_ireland_new_union_desc:0 "Da unsere wirtschaftlichen Grundlagen übereinstimmen, laden wir Irland in unser Bündnis ein und öffnen diplomatische Kanäle für eine engere föderale Partnerschaft."
 uk_ireland_unification:0 "Anglo-irische Vereinigung"
 uk_ireland_unification_desc:0 "Durch friedliche Integration und historische Versöhnung vereinigt sich Irland offiziell mit Großbritannien unter einem einheitlichen föderalen Reich, das allen irischen Ländern volle Staatsbürgerschaft und Integration gewährt."
 ENG_Trade_with_ireland:0 "Handel mit Irland"
 ENG_Trade_with_ireland_desc:0 "Bilaterales Handelsabkommen, das reduzierte Fabrikkosten beim Import von Ressourcen aus Irland vorsieht."
 IRE_Trade_with_britain:0 "Handel mit Großbritannien"
 IRE_Trade_with_britain_desc:0 "Bilaterales Handelsabkommen, das reduzierte Fabrikkosten beim Import von Ressourcen aus Großbritannien vorsieht."
 ENG_ireland_integration_category:0 "Anglo-irische Integration"
 ENG_ireland_integration_category_desc:0 "Diplomatische Maßnahmen zur Wiederherstellung der föderalen Beziehungen zum irischen Staat."
 ENG_diplomatically_puppet_ireland:0 "Bieten Sie Irland den Dominion-Status an"
 ENG_diplomatically_puppet_ireland_desc:0 "Schlagen Sie der Regierung in Dublin im Rahmen unseres gemeinsamen Bündnisses eine autonome Dominion-Vereinbarung vor."

 ENG_focus_on_europe:0 "Konzentrieren Sie sich auf Europa"
 ENG_focus_on_europe_desc:0 "Mit der Auflösung unserer kolonialen Verpflichtungen kann das britische Militärkommando nun seine volle strategische Aufmerksamkeit auf den europäischen Schauplatz richten und so die Verfeinerung der Doktrin in allen Teilstreitkräften beschleunigen."
 ENG_home_fleet_concentration:0 "Konzentration der Heimatflotte"
 ENG_home_fleet_concentration_desc:0 "Anstatt eine ausgedehnte globale Marinepräsenz aufrechtzuerhalten, soll die Royal Navy ihre Streitkräfte in heimischen Gewässern und in der Nordsee konzentrieren. Der Bau von Schiffen ist zwar günstiger, aber unsere Einsatzreichweite ist deutlich eingeschränkt."
 ENG_domestic_air_industry:0 "Inländische Luftindustrie"
 ENG_domestic_air_industry_desc:0 "Priorisieren Sie die Produktion schneller, wendiger Abfangjäger und Luftunterstützungsflugzeuge zur Verteidigung der britischen Inseln und reduzieren Sie gleichzeitig die kostspieligen Programme für strategische Bomber und schwere Jäger."
 ENG_home_fleet_concentration_idea:0 "Konzentration der Heimatflotte"
 ENG_home_fleet_concentration_idea_desc:0 "Die Royal Navy hat ihre Flotten in Heimatgewässern konsolidiert. Die Herstellung aller Schiffsklassen kostet §G15 %§! weniger, aber unsere maximale Marinereichweite ist um §R50 %§! reduziert."
 ENG_domestic_air_industry_idea:0 "Inländische Luftindustrie"
 ENG_domestic_air_industry_idea_desc:0 "Britische Flugzeugfabriken priorisieren leichte, agile Jäger (§G-10 % §!-Kosten) auf Kosten schwererer strategischer Flugzeuge (§R+15 % §!-Kosten für mittelschwere und schwere Flugzeuge)."

 ENG_european_refugees:0 "Europäische Flüchtlinge"
 ENG_european_refugees_desc:0 "Während der Kontinent in einen totalen Krieg stürzt, fliehen unzählige Einzelpersonen, Facharbeiter und Akademiker vor dem Chaos in die Zuflucht der britischen Inseln. Die Aufnahme dieser Flüchtlingsströme stärkt sowohl unsere Arbeitskräftereserven als auch die heimische Industriekapazität."
 ENG_european_refugees_tt:0 "Jedes Land in §YEuropa§! §Rim Krieg§! stellt §G50.000§! Arbeitskräfte für Großbritannien bereit."
 ENG_european_intelligence_hub:0 "Continental Intelligence Hub"
 ENG_european_intelligence_hub_desc:0 "Mithilfe von Netzwerken kontinentaler Verbannter, Widerstandskontakten und Entschlüsselungsdiensten wird London zum wichtigsten Koordinierungsknotenpunkt für Geheimdienste, Spionage und Geheimoperationen im gesamten besetzten Europa."
 ENG_home_defense_mobilization:0 "Mobilisierung der Heimatverteidigung"
 ENG_home_defense_mobilization_desc:0 "Jede Stadt, jedes Dorf und jede Küste auf unseren Inseln ist vorbereitet. Die vollständige Heimmobilisierung sorgt für beispiellose Rekrutierungspools, einen verbesserten Kampfzusammenhalt und undurchdringliche Verteidigungsanlagen in unserem gesamten Heimatland."
 ENG_european_intelligence_hub_idea:0 "Continental Intelligence Hub"
 ENG_european_intelligence_hub_idea_desc:0 "Ein geheimes Elite-Netzwerk, das in ganz Europa operiert und zusätzliche operative Kapazität, schnellere Agenturabläufe, überlegene Entschlüsselung und verstärkte Spionageabwehr bietet."
 ENG_home_defense_mobilization_idea:0 "Mobilisierung der Heimatverteidigung"
 ENG_home_defense_mobilization_idea_desc:0 "Umfassende zivile und territoriale Mobilisierung zum Schutz des britischen Reiches: §G+5,00%§! rekrutierbare Bevölkerung, verstärkte Divisionsorganisation, schnellere Verschanzung und verstärkte Verteidigung in Kerngebieten."

 # --- Baltic Economy Branch (BALTIC_Our_economy_first) ---
 BALTIC_Our_economy_first:0 "Unsere Wirtschaft zuerst"
 BALTIC_Our_economy_first_desc:0 "Umgeben von expandierenden Imperien und wechselnden Bündnissen muss unsere Hauptaufgabe die wirtschaftliche Stabilität und der Wohlstand unseres eigenen Volkes sein. Durch die Koordinierung unserer Binnenmärkte und die Festlegung einer souveränen Finanzpolitik legen wir den Grundstein für eine dauerhafte nationale Widerstandsfähigkeit."

 BALTIC_Protectionism:0 "Baltischer Protektionismus"
 BALTIC_Protectionism_desc:0 "Um inländische Unternehmen vor volatilen internationalen Märkten und ausländischen Verdrängungspreisen zu schützen, werden wir Schutzzölle einführen und der lokalen Produktion Vorrang vor ausländischen Importen einräumen."

 BALTIC_Mercantilism:0 "Baltischer Merkantilismus"
 BALTIC_Mercantilism_desc:0 "Eine starke Handelsnation lebt vom uneingeschränkten Handel und einem aktiven internationalen Austausch. Durch die Einführung des Freihandels locken wir lebenswichtiges Kapital, Technologien und ausländische Industriegüter in unsere Häfen."

 BALTIC_Expand_the_excavation:0 "Erweitern Sie die Ausgrabung"
 BALTIC_Expand_the_excavation_desc:0 "Der baltische Boden birgt wichtige Bodenschätze, Schieferölvorkommen und metallurgische Ressourcen. Moderne Gewinnungstechniken und erweiterte Bergbaubetriebe sichern unsere industrielle Eigenständigkeit."
 BALTIC_more_you_have_more_you_will_get_tt:0 "Jeder kontrollierte Staat mit ungenutzten Ressourcen erhält neue Industrieanlagen, Förderinfrastruktur und erweiterte Mineralausbeuten."
 generic_skip_one_line_tt:0 " \n"

 BALTIC_Trade_with_the_scandinavian_countries:0 "Handel mit skandinavischen Ländern"
 BALTIC_Trade_with_the_scandinavian_countries_desc:0 "Die nordischen Reiche jenseits der Ostsee sind unsere natürlichen Wirtschaftspartner. Durch den Abschluss bilateraler Handelsabkommen mit Finnland, Schweden, Norwegen und Dänemark sichern wir uns wichtige Rohstoffe und Spezialmaschinen."

 BALTIC_Trade_with_sweden:0 "Handel mit Schweden"
 BALTIC_Trade_with_sweden_desc:0 "Sweden possesses a world-renowned armaments and automotive manufacturing base. Formalizing defence-industrial cooperation will grant us licenses for cutting-edge Swedish armor and light combat vehicles."

 BALTIC_Trade_with_finland:0 "Handel mit Finnland"
 BALTIC_Trade_with_finland_desc:0 "The Finnish industrial expansion has yielded breakthroughs in polymer chemistry, communications, and consumer rubber at Nokia. Integrating their industrial expertise will directly boost our domestic production capabilities."
 BALTIC_youll_receive_nokia_tt:0 "Finnland wird seine industrielle Unterstützung für uns ausbauen, unsere Fabrikproduktion steigern und den Zugang zu finnischen Industriedesignunternehmen ermöglichen."

 BALTIC_Trade_with_the_east_countries:0 "Handel mit dem Osten"
 BALTIC_Trade_with_the_east_countries_desc:0 "Unsere östlichen und südlichen Nachbarn in Polen, Weißrussland und der Ukraine verfügen über umfangreiche Agrar-, Metallurgie- und Bergbausektoren. Die Wiederherstellung regelmäßiger Handelskorridore nach Osten wird unseren heimischen Waffenfabriken neuen Schwung verleihen."

 BALTIC_excavation_with_belarus:0 "Bergbaukooperation mit Weißrussland"
 BALTIC_excavation_with_belarus_desc:0 "Durch die Koordinierung von Förderinitiativen und geologischen Untersuchungsprogrammen mit Weißrussland können unsere beiden Nationen Technologien zur Ressourcengewinnung vorantreiben und wichtiges geologisches Fachwissen austauschen."

 BALTIC_donbas_coal_deal:0 "Donbas-Kohleabkommen"
 BALTIC_donbas_coal_deal_desc:0 "Das grenzenlose Mineralbecken des Donbass liefert einige der hochwertigsten Anthrazit- und Kokskohlen in Europa. Die Sicherstellung direkter Lieferungen aus der Ukraine wird unsere Schwerindustrie und Kraftwerke mit Energie versorgen."
 if_they_accept_tt:0 "\n§YAuswirkungen, wenn sie annehmen:§!"

 # --- Baltic Trade National Spirits ---
 BALTIC_Trade_with_sweden_idea:0 "Handel mit Schweden"
 BALTIC_Trade_with_sweden:0 "Handel mit Schweden"
 BALTIC_Trade_with_sweden_desc:0 "Bevorzugte Handelsbedingungen und bilateraler Handel mit Schweden, wodurch die Kosten für importierte Waren und Ressourcen gesenkt werden."

 BALTIC_Trade_with_norwey_idea:0 "Handel mit Norwegen"
 BALTIC_Trade_with_norwey:0 "Handel mit Norwegen"
 BALTIC_Trade_with_norwey_desc:0 "Bevorzugte Handelsbedingungen und bilateraler Handel mit Norwegen, wodurch die Kosten für importierte Waren und Ressourcen gesenkt werden."

 BALTIC_Trade_with_denmark_idea:0 "Handel mit Dänemark"
 BALTIC_Trade_with_denmark:0 "Handel mit Dänemark"
 BALTIC_Trade_with_denmark_desc:0 "Bevorzugte Handelsbedingungen und bilateraler Handel mit Dänemark, wodurch die Kosten für importierte Waren und Ressourcen gesenkt werden."

 BALTIC_Trade_with_finland_idea:0 "Handel mit Finnland"
 BALTIC_Trade_with_finland:0 "Handel mit Finnland"
 BALTIC_Trade_with_finland_desc:0 "Bevorzugte Handelsbedingungen und bilateraler Handel mit Finnland, wodurch die Kosten für importierte Waren und Ressourcen gesenkt werden."

 BALTIC_better_Nokia_finland:0 "Nokia Industriekooperation"
 BALTIC_better_Nokia_finland_desc:0 "Bilaterale technische Partnerschaft mit den finnischen Nokia-Produktionsstätten zur Lieferung hochwertiger Gummiprodukte und technischer Komponenten sowie zur Steigerung der Fabrikeffizienz."
 BALTIC_better_Nokia_finland_1:0 "Nokia Industrial Cooperation I"
 BALTIC_better_Nokia_finland_1_desc:0 "Bilaterale technische Partnerschaft mit den finnischen Nokia-Produktionsstätten zur Lieferung hochwertiger Gummiprodukte und technischer Komponenten sowie zur Steigerung der Fabrikeffizienz."
 BALTIC_better_Nokia_finland_2:0 "Nokia Industrial Cooperation II"
 BALTIC_better_Nokia_finland_2_desc:0 "Vertiefte technische Partnerschaft mit finnischen Nokia-Unternehmen, wodurch die inländische Fabrikkapazität durch spezialisierte industrielle Inputs erweitert wird."
 BALTIC_better_Nokia_finland_3:0 "Nokia Industrial Cooperation III"
 BALTIC_better_Nokia_finland_3_desc:0 "Umfassende Industrie- und Fertigungsintegration mit finnischen Nokia-Komplexen zur Maximierung der zivilen und militärischen Produktionskapazitäten."

 FIN_nokia_for_BALTIC:0 "Suomen Gummitehdas (Nokia)"
 FIN_nokia_for_BALTIC_desc:0 "Das finnische Gummiwerk und Elektronikpionier bei Nokia unterstützt baltische Unternehmen bei der Forschung zu fortschrittlichen synthetischen Materialien, Elektrogeräten und Telekommunikation."
 BLR_autarky_res:0 "Baltisch-belarussisches Bergbauabkommen"

 # --- International_STE Trade & Mining Events ---
 # Event 8: Request to Belarus
 International_STE.8.t:0 "Baltischer Antrag auf geologische Zusammenarbeit"
 International_STE.8.d:0 "Diplomatische Gesandte von [From.GetNameDef] haben einen formellen Vorschlag vorgelegt, in dem sie gemeinsame geologische Untersuchungen und eine Zusammenarbeit in der Bergbauforschung fordern. Als Gegenleistung dafür, dass wir unseren hochmodernen Vermessungsteams Zugang zu gemeinsamer Forschung gewähren, werden unsere eigenen inländischen Bergbauinitiativen einen erheblichen technologischen Aufschwung erhalten."
 International_STE.8.a:0 "Ein für beide Seiten vorteilhafter Vorschlag!"
 International_STE.8.b:0 "Wir können unsere geologischen Geheimnisse nicht teilen."

 # Event 9: Belarus agrees
 International_STE.9.t:0 "Weißrussland akzeptiert Bergbaukooperation"
 International_STE.9.d:0 "Die Regierung in Minsk hat unsere Delegation offiziell willkommen geheißen und das geologische Kooperationsabkommen ratifiziert! Unsere Ingenieure und Geologen werden umgehend technische Pläne austauschen und so die Förderungstechnologie in unseren Gebieten beschleunigen."
 International_STE.9.a:0 "Tolle Neuigkeiten für unsere Branche."

 # Event 10: Belarus refuses
 International_STE.10.t:0 "Weißrussland lehnt Bergbaukooperation ab"
 International_STE.10.d:0 "Bedauerlicherweise haben die belarussischen Behörden unser Angebot für gemeinsame geologische Initiativen abgelehnt und ziehen es vor, ihre inländischen Bergbauentwicklungen unabhängig zu schützen."
 International_STE.10.a:0 "Eine unglücklich verpasste Chance."

 # Event 11: Proposal to Ukraine (Donbas Coal)
 International_STE.11.t:0 "Baltischer Vorschlag für die Lieferung von Donbas-Kohle"
 International_STE.11.d:0 "Gesandte von [From.GetNameDef] haben sich mit einem attraktiven Wirtschaftsangebot an unsere Regierung gewandt. Sie bieten Kapitalinvestitionen für den Bau eines modernen Industriekomplexes in unserem mineralreichen Donbas-Becken im Austausch für garantierte Kohlelieferungen zur Aufrechterhaltung der baltischen Stromerzeugung und Metallurgie an."
 International_STE.11.a:0 "Akzeptieren Sie die Investition und schließen Sie den Kohlepakt ab."
 International_STE.11.b:0 "Unsere Kohlevorräte dürfen ausschließlich für den Eigenbedarf verbleiben."

 # Event 12: Ukraine agrees
 International_STE.12.t:0 "Die Ukraine ratifiziert das Donbas-Kohleabkommen"
 International_STE.12.d:0 "Die ukrainische Regierung hat unseren Investitionsvorschlag offiziell angenommen! Als Gegenleistung für die Finanzierung eines Industriekomplexes im Donbass werden Zugladungen hochwertiger Kohle direkt zu unseren Fabriken fließen."
 International_STE.12.a:0 "Unsere Hochöfen werden nie kalt!"

 # Event 13: Ukraine refuses
 International_STE.13.t:0 "Die Ukraine lehnt das Donbas-Abkommen ab"
 International_STE.13.d:0 "Die ukrainischen Behörden haben unser Handelsangebot höflich abgelehnt und erklärt, dass die gesamte inländische Kohleproduktion dringend für ihren eigenen aufkeimenden Industriebedarf erforderlich sei."
 International_STE.13.a:0 "Wir müssen woanders Treibstoff finden."
