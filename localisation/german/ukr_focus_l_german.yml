 UKR_BALTIC_events_11_tt:0 "Die Sowjetunion wird ein Kriegsziel (Sturz der Regierung) gegen §YItaly§! erreichen"
 UKR_BALTIC_events_12_tt:0 "Die Sowjetunion wird ein Kriegsziel (Sturz der Regierung) gegen §YCzechoslowakei und die Slowakei§! erreichen"

 # Focus names
 UKR_finnish_invasion:0 "Bulgarischer Feldzug"
 UKR_path_to_the_north_sea:0 "Weg zum Balkan"
 UKR_end_swedish_neutrality:0 "Ende der jugoslawischen Neutralität"
 UKR_free_the_workers_of_poland:0 "Befreit die Arbeiter Polens"
 UKR_free_the_workers_of_chechoslovakia:0 "Befreit die Arbeiter der Tschechoslowakei"
 UKR_end_italy:0 "Das Ende Italiens"

 # Events
 UKR_events.7.t:0 "Die Ukraine bereitet sich auf den Bulgarienfeldzug vor"
 UKR_events.7.d:0 "Unsere Genossen in der Ukraine haben die Vorbereitungen zur Ausweitung der Revolution auf den Balkan abgeschlossen. Bulgarien, immer noch unter der Herrschaft der Bourgeoisie, ist unser nächstes Ziel. Es ist Zeit, die bulgarischen Arbeiter zu befreien und ihnen das Licht des Sozialismus zu bringen!"
 UKR_events.7.a:0 "Weiter nach Sofia!"

 UKR_events.8.t:0 "Weg zum Balkan"
 UKR_events.8.d:0 "Die ukrainische Regierung hat einen Plan ausgearbeitet, um die Kontrolle über Osteuropa zu sichern. Rumänien steht uns im Weg. Wir müssen unseren Genossen dabei helfen, die rumänische Regierung zu stürzen und die Region für die Revolution zu sichern."
 UKR_events.8.a:0 "Nächster Halt: Bukarest."

 UKR_events.9.t:0 "Das Ende der jugoslawischen Neutralität"
 UKR_events.9.d:0 "Jugoslawiens sogenannte „Neutralität“ ist nichts anderes als ein Deckmantel für die Zusammenarbeit mit den Imperialisten. Die Ukraine fordert uns dringend auf, dieser Heuchelei ein Ende zu setzen. Die jugoslawischen Arbeiter erwarten unsere Befreiung!"
 UKR_events.9.a:0 "Die Revolution kennt keine Grenzen."

 UKR_events.10.t:0 "Befreiung der polnischen Arbeiter"
 UKR_events.10.d:0 "Die reaktionäre Regierung Polens unterdrückt weiterhin ihr Volk. Die Ukraine hat einen Plan zum Sturz der polnischen Behörden und zur Errichtung einer Diktatur des Proletariats initiiert. Wir müssen diesen Schritt unterstützen und die Revolution nach Warschau bringen."
 UKR_events.10.a:0 "Für unsere und deine Freiheit!"

 UKR_events.11.t:0 "Das Ende Italiens"
 UKR_events.11.d:0 "Das faschistische Regime in Italien stellt eine Bedrohung für die gesamte freie Welt dar. Unsere ukrainischen Genossen schlagen vor, dieser Hochburg der Reaktion den letzten Schlag zu versetzen. Die Zeit ist gekommen, das italienische Volk zu befreien!"
 UKR_events.11.a:0 "Tod dem Faschismus!"

 UKR_events.12.t:0 "Befreiung der tschechoslowakischen Arbeiter"
 UKR_events.12.d:0 "Die bürgerliche Regierung der Tschechoslowakei muss fallen. Die ukrainische Initiative, den Einfluss der Revolution auf Mitteleuropa auszudehnen, verdient unsere volle Unterstützung. Nach Prag!"
 UKR_events.12.a:0 "Die Arbeiter der Tschechoslowakei sollen frei sein."

 UKR_post_resistance_development:0 "Entwicklung nach dem Widerstand"
 UKR_post_resistance_development_desc:0 "Nachdem der Widerstand endlich niedergeschlagen ist, können wir unsere Bemühungen auf die industrielle Entwicklung unserer neu gesicherten Regionen konzentrieren."
 UKR_donbas_heavy_industry:0 "Schwerindustrie im Donbas"
 UKR_donbas_heavy_industry_desc:0 "Die Donbass-Region ist reich an Ressourcen und Potenzial. Durch umfangreiche Investitionen in die Industriekapazität können wir ein starkes Rückgrat für die Wirtschaft unseres Landes sichern."
 UKR_soviet_collectivization:0 "Sowjetische Kollektivierung"
 UKR_soviet_collectivization_desc:0 "Um unsere landwirtschaftliche Produktion zu maximieren und die wachsende Industriearbeitsbevölkerung zu ernähren, müssen wir unsere landwirtschaftlichen Betriebe auf das sowjetische Kollektivierungsmodell umstellen."
 UKR_donbas_coal:0 "Donbas-Kohle"
 UKR_donbas_coal_desc:0 "Kohle ist der Lebensnerv der Industrie. Durch die Ausweitung unserer Bergbaubetriebe im Donbas werden wir unsere Fabriken mit Energie versorgen und unsere Militärmaschinerie mit Strom versorgen."
 UKR_western_wall:0 "Klagemauer"
 UKR_western_wall_desc:0 "Wir müssen uns auf den unvermeidlichen Zusammenstoß mit dem Westen vorbereiten. Eine beeindruckende Befestigungslinie entlang unserer Westgrenze wird die Sicherheit unserer Republik gewährleisten."
 UKR_united_with_westukrblr:0 "Vereint euch mit unserem Volk in Ostpolen"
 UKR_united_with_westukrblr_desc:0 "Unsere Brüder im Westen haben lange genug unter ausländischer Besatzung gelitten. Es ist unsere Pflicht, sie einzubeziehen und alle unsere historischen Länder unter einem sozialistischen Banner zu vereinen."
 UKR_events.1.t:0 "[From.GetNameDefCap] Requests Our Support"
 UKR_events.1.d:0 "[From.GetNameDefCap] has reached out to us, requesting formal support and military alliance. As brothers in the struggle against capitalism, they seek entry into our faction and our guarantee of their independence."
 UKR_events.1.a:0 "We welcome our [From.GetNameDefCap] comrades."
 UKR_events.1.b:0 "Wir können es uns derzeit nicht leisten, sie zu unterstützen."

# Ukraine Exile Focuses and Ideas appended
 # Ukraine Exile Focuses
 UKR_government_in_exile:0 "Bereiten Sie sich auf das Unvermeidliche vor"
 UKR_government_in_exile_desc:0 "Unser Heimatland steht kurz vor dem Untergang, aber unser Geist bleibt ungebrochen. Wir werden unsere Regierung darauf vorbereiten, den Befreiungskampf vom Ausland aus zu koordinieren."
 UKR_foreign_air_support:0 "Ausländische Luftunterstützung"
 UKR_foreign_air_support_desc:0 "Unsere Gastgeber werden bei der Ausbildung unserer Piloten und der Bereitstellung von Flugzeugen für unsere Exil-Luftwaffe behilflich sein."
 UKR_aces_in_exile:0 "Asse im Exil"
 UKR_aces_in_exile_desc:0 "Unsere Piloten werden an der Seite unserer Verbündeten kämpfen und unschätzbare Kampferfahrung sammeln, um unsere zukünftige Luftwaffe zu leiten."
 UKR_air_in_exile:0 "Luftwaffe im Exil"
 UKR_air_in_exile_desc:0 "Wir richten unsere eigenen Staffelkommandos unter alliierter operativer Kontrolle ein und stellen so sicher, dass unsere Flugbesatzungen organisiert bleiben."
 UKR_women_in_air:0 "Frauen in der Luftwaffe"
 UKR_women_in_air_desc:0 "Jeder Bürger muss seinen Beitrag leisten. Wir werden die Flugausbildung für ukrainische Frauen öffnen und so unseren Pilotenpool maximieren."
 UKR_foreign_army_support:0 "Unterstützung der ausländischen Armee"
 UKR_foreign_army_support_desc:0 "Wir werden unsere verstreuten Soldaten und Freiwilligen zu einer kampfbereiten Truppe auf fremdem Boden versammeln."
 UKR_organize_exiled_army:0 "Organisieren Sie eine Exil-Armee"
 UKR_organize_exiled_army_desc:0 "Strukturierung unserer Freiwilligenregimenter in integrierte Divisionen mit geeigneten Kommandostrukturen."
 UKR_new_army:0 "Die neue Armee"
 UKR_new_army_desc:0 "Wir rüsten unsere Soldaten mit modernen Waffen aus und übernehmen fortschrittliche taktische Doktrinen, um uns auf die Rückkehr vorzubereiten."
 UKR_foreign_fleet_support:0 "Unterstützung ausländischer Flotten"
 UKR_foreign_fleet_support_desc:0 "Wir verhandeln mit alliierten Marinen über die Bereitstellung von Anlegestellen und Schulungen für unsere Matrosen."
 UKR_buy_foreign_ships:0 "Kaufen Sie ausländische Schiffe"
 UKR_buy_foreign_ships_desc:0 "Erwerb stillgelegter oder geleaster Marinegüter von unseren Verbündeten, um eine Kernbefreiungsflotte zu bilden."
 UKR_army_cooperation:0 "Dienststellenübergreifende Zusammenarbeit"
 UKR_army_cooperation_desc:0 "Integration unserer Armee, Marine und Luftwaffe in eine einheitliche Kommandostruktur zur Koordinierung von Operationen."
 UKR_exile_politics:0 "Exilpolitik"
 UKR_exile_politics_desc:0 "Konsolidierung unserer diplomatischen Vertretung im Ausland, um sicherzustellen, dass unsere Stimme in alliierten Kriegsräten gehört wird und eine stabile Quelle politischer Legitimität entsteht."
 UKR_exploit_our_connections:0 "Nutzen Sie unsere Verbindungen"
 UKR_exploit_our_connections_desc:0 "Nutzung unserer diplomatischen Kontakte, um internationale Handelsabkommen und Materialien für unsere Exilregierung zu sichern."
 UKR_help_from_our_allies:0 "Hilfe von unseren Verbündeten"
 UKR_help_from_our_allies_desc:0 "Sicherstellung konkreter Leih- und Pachtzusagen und Weitergabe von technischem und wissenschaftlichem Wissen an unsere verbündeten Gastgeber."
 UKR_international_recognition:0 "Internationale Anerkennung"
 UKR_international_recognition_desc:0 "Wir stellen sicher, dass die internationale Gemeinschaft unsere Exilregierung als die einzige legitime Regierung der Ukraine anerkennt und festigen so unsere Kriegsunterstützung."
 UKR_exile_industries:0 "Exilindustrien"
 UKR_exile_industries_desc:0 "Einrichtung von Werkstätten und Koordinationsbüros in den Gastländern, um die Produktion für unser Militär zu verwalten."
 UKR_resistance_industries:0 "Untergrundindustrie"
 UKR_resistance_industries_desc:0 "Unterstützung geheimer Werkstätten und Versorgungsnetzwerke in unseren besetzten Kerngebieten."
 UKR_combined_civilian_agency_resistance:0 "Kombinierte Widerstandskoordination"
 UKR_combined_civilian_agency_resistance_desc:0 "Vereinheitlichung unserer Geheimdienstoperationen mit inländischen Partisanennetzwerken, um die Sabotageeffizienz zu maximieren."
 UKR_evacuated_industries:0 "Evakuierte Industrien"
 UKR_evacuated_industries_desc:0 "Errichtung von Fabriken mit evakuierten ukrainischen Arbeitern zur Herstellung von Waffen und Ausrüstung."
 UKR_connections_with_industrialists:0 "Industrielle Verbindungen"
 UKR_connections_with_industrialists_desc:0 "Zusammenarbeit mit ausländischen Industriellen, um Maschinen, Ressourcen und technisches Fachwissen zu sichern."
 UKR_exile_resistance:0 "Koordinieren Sie den Untergrund"
 UKR_exile_resistance_desc:0 "Aufbau von Funkkontakten zu lokalen Widerstandszellen in unseren besetzten Gebieten."
 UKR_expand_operations:0 "Erweitern Sie „Operationen“."
 UKR_expand_operations_desc:0 "Ausbau unseres Spionagenetzwerks, um Informationen über Besatzerbewegungen und Vermögenswerte zu sammeln."
 UKR_expand_intelligence:0 "Erweitern Sie die Intelligenz"
 UKR_expand_intelligence_desc:0 "Wir verbessern unsere Entschlüsselungsfähigkeiten, um feindliche Kommunikation abzufangen und zu knacken."
 UKR_even_stronger_resistance:0 "Mobilisieren Sie den Untergrund"
 UKR_even_stronger_resistance_desc:0 "Geben Sie den inländischen Partisanennetzwerken das Signal, die Sabotage feindlicher Linien zu verstärken."
 UKR_everyone_will_fight:0 "Jeder wird kämpfen"
 UKR_everyone_will_fight_desc:0 "Mobilisierung aller Flüchtlinge, Auswanderer und Unterstützer im Ausland, Waffen zu ergreifen oder Unterstützungsaufgaben zu übernehmen."
 UKR_our_help_in_the_war:0 "Alliierter Beitrag"
 UKR_our_help_in_the_war_desc:0 "Wir bieten unsere spezialisierten Geheimdienst- und Freiwilligeneinheiten an, um alliierte Operationen zu leiten und so unseren Wert unter Beweis zu stellen."
 UKR_prepare_our_people_to_return:0 "Bereiten Sie die Menschen auf die Rückkehr vor"
 UKR_prepare_our_people_to_return_desc:0 "Verbreitung von Propaganda und Anweisungen zur Vorbereitung der Zivilbevölkerung auf die bevorstehende Befreiung."
 UKR_prepare_our_army_to_return:0 "Bereiten Sie die Armee auf die Rückkehr vor"
 UKR_prepare_our_army_to_return_desc:0 "Schulung unserer verbannten Divisionen in spezialisierten Angriffs- und Befreiungstaktiken."
 UKR_prepare_our_land_to_return:0 "Bereiten Sie das Land auf die Rückkehr vor"
 UKR_prepare_our_land_to_return_desc:0 "Leitung einer koordinierten Sabotage feindlicher Versorgungslinien, Schienennetze und Flugplätze in der Ukraine."
 UKR_combine_all_our_forces:0 "Alle Kräfte vereinen"
 UKR_combine_all_our_forces_desc:0 "Zusammenführung aller unserer Verbannungskräfte – Armee, Luftwaffe, Marine, Industrie und Untergrundnetzwerke – zu einer einzigen, einheitlichen Befreiungsfront."
 UKR_to_return_ours:0 "Um zurückzugewinnen, was uns gehört"
 UKR_to_return_ours_desc:0 "Erklärung des Beginns der allgemeinen Kampagne zur Befreiung unseres Heimatlandes vom Besatzer."
 UKR_first_hit:0 "Der erste Schlag"
 UKR_first_hit_desc:0 "Wir starten die erste Offensive, um unsere ersten großen Regionen zu sichern und einen Brückenkopf zu errichten."
 UKR_second_hit:0 "Der zweite Schlag"
 UKR_second_hit_desc:0 "Dringen Sie tiefer in die zentralen Regionen vor und durchbrechen Sie die Verteidigungslinien des Feindes."
 UKR_third_hit:0 "Der dritte Schlag"
 UKR_third_hit_desc:0 "Befreiung unserer wichtigsten industriellen Kerngebiete und Befreiung von Millionen unserer Bürger."
 UKR_final_blow:0 "Der letzte Schlag"
 UKR_final_blow_desc:0 "Wir starten die ultimative, entscheidende Offensive, um die Besatzer vollständig aus jedem Zentimeter unseres Landes zu vertreiben."

 # Ukraine Exile Ideas
 UKR_aces_in_exile_idea:0 "Ukrainische Asse im Exil"
 UKR_aces_in_exile_idea_desc:0 "Unsere Piloten haben in alliierten Luftwaffengeschwadern hervorragende Dienste geleistet und unschätzbare taktische Kenntnisse erworben."
 UKR_army_cooperation_idea:0 "Dienstübergreifende Zusammenarbeit"
 UKR_army_cooperation_idea_desc:0 "Unsere Heeres-, Marine- und Luftstreitkräfte sind vollständig integriert und koordinieren ihre Planung und operative Durchführung."
 UKR_civil_and_military_organization_ukr:0 "Kombinierter Widerstandsrat"
 UKR_civil_and_military_organization_ukr_desc:0 "Ein gemeinsamer Geheimdienstrat, der reguläre militärische Mittel mit inländischen Partisanentruppen koordiniert."
 UKR_industrialist_connections_ukr:0 "Industrielle Selbsthilfegruppe"
 UKR_industrialist_connections_ukr_desc:0 "Unsere Exilregierung arbeitet eng mit ausländischen Herstellern zusammen, um die militärische Versorgung sicherzustellen."
 UKR_even_stronger_resistance_idea:0 "Mobilisiertes Partisanennetzwerk"
 UKR_even_stronger_resistance_idea_desc:0 "Partisanennetzwerke im gesamten besetzten Heimatland haben die aktive Sabotage und Informationsbeschaffung ausgeweitet."
 UKR_everyone_will_fight_idea:0 "Mobilisierung im Exil"
 UKR_everyone_will_fight_idea_desc:0 "Wir haben jeden fähigen Flüchtling und jeden Freiwilligen mobilisiert, um die Befreiungsbemühungen zu unterstützen."
 UKR_our_help_in_the_war_idea:0 "Geschätzter alliierter Partner"
 UKR_our_help_in_the_war_idea_desc:0 "Unsere aktiven Beiträge im Geheimdienstbereich und bei den Freiwilligen haben uns großen Respekt bei unseren Verbündeten eingebracht."
 UKR_people_return_prep_idea:0 "Befreiungspropagandanetzwerke"
 UKR_people_return_prep_idea_desc:0 "Durch Untergrundsendungen und Flugblätter wurde die besetzte Bevölkerung auf die Unterstützung der zurückkehrenden Armee vorbereitet."
 UKR_army_return_prep_idea:0 "Ausbildung der Befreiungsarmee"
 UKR_army_return_prep_idea_desc:0 "Unsere verbannten Divisionen wurden in Offensiv- und Speerspitzentaktiken geschult, die speziell für die Rückeroberung unseres Heimatlandes entwickelt wurden."
 UKR_land_return_prep_idea:0 "Koordinierte Versorgungssabotage"
 UKR_land_return_prep_idea_desc:0 "Partisanen haben feindliche Versorgungsknotenpunkte und Eisenbahnkorridore schwer beschädigt und ihre Logistik gestört."
 UKR_united_exile_government_idea:0 "Einheitliche Befreiungsfront"
 UKR_united_exile_government_idea_desc:0 "Alle unsere militärischen Zweige, Industrieabkommen und inländischen Widerstandszellen wurden zu einer einzigen, hochkoordinierten und mächtigen Befreiungsbewegung zusammengefasst."
 UKR_reconquest_spirit:0 "Geist der Befreiung"
 UKR_reconquest_spirit_desc:0 "Unser Volk eint ein einziger brennender Wunsch: unser Heimatland zurückzuerobern und den Besatzer zu besiegen."
 UKR_first_hit_idea:0 "Erstschlag-Momentum"
 UKR_first_hit_idea_desc:0 "Die Dynamik unserer ersten Brückenkopfoffensive steigert unsere Geschwindigkeit und Offensivfähigkeiten im Kerngebiet."
 UKR_second_hit_idea:0 "Zweiter Schlagmomentum"
 UKR_second_hit_idea_desc:0 "Unsere Durchbrüche in den zentralen Regionen haben den Feind in Unordnung gebracht und unsere Durchbruchs- und Erholungsgeschwindigkeit beschleunigt."
 UKR_third_hit_idea:0 "Dritter Schlagmomentum"
 UKR_third_hit_idea_desc:0 "Während wir unsere industriellen Kerngebiete zurückerobern, werden unsere Verteidigungsplanung und -organisation stark gestärkt."
 UKR_final_blow_idea:0 "Der ultimative Schlag"
 UKR_final_blow_idea_desc:0 "Die letzte Kampagne zur vollständigen Vertreibung des Besatzers gewährt uns massive Angriffs- und Verteidigungskampfboni."
 UKR_exile_politics_spirit:0 "Ukrainische Exilregierung"
 UKR_exile_politics_spirit_desc:0 "Unsere Exilregierung wahrt die politische Struktur und Legitimität und stärkt so unseren politischen Einfluss und unsere Stabilität."
 UKR_exploit_connections_spirit:0 "Diplomatische Handelskanäle"
 UKR_exploit_connections_spirit_desc:0 "Die Nutzung diplomatischer Verbindungen hilft uns, Handelsabkommen und Ressourcen aus den Gastländern zu sichern."
 UKR_allied_aid_spirit:0 "Alliierter Forschungsaustausch"
 UKR_allied_aid_spirit_desc:0 "Unsere Gastgeber teilen wissenschaftliche und militärische Forschungsressourcen, um unseren zukünftigen Wiederaufbau zu unterstützen."
 UKR_intl_recognition_spirit:0 "Internationale diplomatische Anerkennung"
 UKR_intl_recognition_spirit_desc:0 "Die weltweite Anerkennung unserer Legitimität hält unsere Kriegsbemühungen am Leben und gibt uns starke politische Unterstützung."
 UKR_new_volonteers_to_fight:0 "Neue Freiwillige zum Kämpfen"
 UKR_new_volonteers_to_fight_desc:0 "Unser Anliegen hat viele dazu inspiriert, sich unseren Reihen anzuschließen und unsere Kräfte mit neuen Freiwilligen zu vergrößern, die bereit sind, für unsere Befreiung zu kämpfen."
 UKR_mobilize_from_liberated_lands:0 "Mobilisieren Sie aus den befreiten Ländern"
 UKR_mobilize_from_liberated_lands_desc:0 "Wenn wir Gebiete zurückerobern, können wir die lokale Bevölkerung mobilisieren, sich unseren Kräften anzuschließen, wodurch wir unsere Reihen weiter stärken und unsere Verbindung zu den Menschen, die wir befreien, vertiefen."
 # Custom Tooltips
 NZL_transfer_ships_tt:0 "[ENG.GetNameDef] transferiert §Y2 Leichte Kreuzer§! an uns."
 lar_decryption_bonus_tt:0 "Wir erhalten §G+10 Entschlüsselungstempo§!"
 baltic_soviet_investments_idea:0 "Sowjetische Investitionen"
 baltic_soviet_investments_idea_desc:0 "Eine große kommunistische Macht hat [Root.GetNameDef] finanzielle und industrielle Unterstützung zugesagt. Sowjetische Berater helfen bei der Modernisierung unserer Produktionslinien und ihre Investitionen verleihen unserem Land eine wachsende Industriekapazität."

 # Baltic Soviet Investments branch
 baltic_soviet_investments:0 "Suchen Sie nach sowjetischen Investitionen"
 baltic_soviet_investments_desc:0 "[Root.GetNameDef] steht am Scheideweg. Indem wir uns an die Sowjetunion und andere kommunistische Mächte wenden, können wir uns wichtige finanzielle Unterstützung und industrielles Fachwissen für den Wiederaufbau unserer Nation sichern – auf Kosten einer engeren Bindung an den kommunistischen Block."
 baltic_soviet_war_economics:0 "Sowjetische Kriegsökonomie"
 baltic_soviet_war_economics_desc:0 "Sowjetische Berater haben eine vollständige Umstrukturierung unserer Wirtschaft nach stalinistischen Grundsätzen vorgeschlagen. Eine auf Krieg ausgerichtete Kommandowirtschaft ist zwar hart, wird aber die Rüstung produzieren, die die [Root.GetAdjective]-Industrie allein nie erreicht hat."
 baltic_soviet_tank_licences:0 "Sowjetische Panzerlizenzen"
 baltic_soviet_tank_licences_desc:0 "Die Rote Armee verfügt über einige der besten gepanzerten Fahrzeuge der Welt. Durch die Aushandlung von Produktionslizenzen kann [Root.GetNameDef] mit der Herstellung sowjetischer Panzer beginnen und unseren Streitkräften einen entscheidenden Vorteil auf dem Schlachtfeld verschaffen."
 baltic_donbas_heavy_industry:0 "Unsere Schwerindustrie"
 baltic_donbas_heavy_industry_desc:0 "Wir lassen uns vom großen industriellen Kernland des Donbass inspirieren und werden dessen Modell der Schwermetallurgie in unseren Kerngebieten nachahmen. Sowjetische Ingenieure werden den Bau neuer Stahlwerke und Gießereien überwachen."
 baltic_donbas_coal:0 "Unser Kohleabbau"
 baltic_donbas_coal_desc:0 "Kohle ist das Lebenselixier der modernen Industrie. Durch die Übernahme unserer Bergbautechniken und die Einbeziehung sowjetischer Förderspezialisten wird [Root.GetNameDef] den Treibstoff fördern, der für den Antrieb seiner Kriegsmaschinerie erforderlich ist."
 baltic_soviet_collectivization:0 "Kollektivierungsoffensive"
 baltic_soviet_collectivization_desc:0 "Nach sowjetischem Vorbild werden wir private landwirtschaftliche Betriebe verstaatlichen und in Kollektivbetrieben zusammenfassen. Der Prozess wird schmerzhaft sein – viele werden sich wehren –, aber der daraus resultierende Überschuss wird unsere Fabriken und Frontlinien ernähren."
 baltic_soviet_ukraine_industry:0 "Von der Sowjetunion unterstützte Industrie"
 baltic_soviet_ukraine_industry_desc:0 "Durch die Einbettung sowjetischer Wirtschaftsberater in unsere Ministerien wird [Root.GetNameDef] externe Fabrikkapazitäten erhalten, die von unseren kommunistischen Partnern unterstützt werden, wodurch unser Heimatland von der vollständigen Abhängigkeit von der Industrie an vorderster Front befreit wird."
 baltic_western_wall:0 "Westliche Verteidigungsmauer"
 baltic_western_wall_desc:0 "Da wir wissen, dass die kapitalistischen Mächte in unserem Westen einen kommunistischen [Root.GetNonIdeologyName] nicht dulden werden, müssen wir unsere Grenzen vorbereiten. Sowjetische Ingenieure werden uns dabei helfen, entlang jeder umkämpften Grenze eine Befestigungskette zu errichten."
 baltic_stalins_highway:0 "Stalins Autobahn"
 baltic_stalins_highway_desc:0 "Ein modernes Straßen- und Schienennetz ist das Rückgrat sowohl der Industrie als auch der Militärlogistik. Mit sowjetischen Baubrigaden wird [Root.GetNameDef] ein Ausfallstraßensystem bauen, das jeden Winkel des Staates verbindet."
 baltic_request_soviet_support:0 "Fordern Sie sowjetische Unterstützung an"
 baltic_request_soviet_support_desc:0 "Mit der Umstrukturierung unserer Wirtschaft und der Stärkung unserer Abwehrkräfte ist [Root.GetNameDef] bereit, seinen Platz als vollwertiger Partner in der sozialistischen Weltordnung einzunehmen. Wir werden offiziell den Beitritt zur sowjetisch geführten Fraktion und zur militärischen Zusammenarbeit beantragen."

 UKR_soviet_investments:0 "Suchen Sie nach sowjetischen Investitionen"
 UKR_soviet_investments_desc:0 "Um die Revolution zu schützen und unsere Nation zu industrialisieren, müssen wir auf unsere Genossen in der Sowjetunion schauen. Indem wir unsere Grenzen für sowjetische Investitionen öffnen, sichern wir die Zukunft des ukrainischen Proletariats."
 UKR_soviet_war_economics:0 "Übernehmen Sie die sowjetische Kriegsökonomie"
 UKR_soviet_war_economics_desc:0 "Um sicherzustellen, dass unsere Wirtschaft jeder kapitalistischen Aggression standhalten kann, müssen wir unsere Industrieproduktion umstrukturieren. Die Modellierung unserer Wirtschaft nach dem sowjetischen Kommandomodell wird uns auf den unvermeidlichen Kampf vorbereiten."
 UKR_soviet_tank_licences:0 "Sowjetische Panzerlizenzen"
 UKR_soviet_tank_licences_desc:0 "Die Panzertruppen der Roten Armee gehören zu den fortschrittlichsten der Welt. Die Sicherung von Produktionslizenzen für sowjetische Panzerkonstruktionen wird unserer Armee die gepanzerte Faust geben, die sie braucht."
 UKR_stalins_highway:0 "Stalins Autobahn"
 UKR_stalins_highway_desc:0 "Der schnelle Transport von Truppen und Industriegütern ist der Schlüssel zur modernen Kriegsführung. Mit der Unterstützung sowjetischer Ingenieure werden wir im ganzen Land ein modernes Autobahnnetz aufbauen."
 UKR_eastern_wall:0 "Antifaschistische Mauer"
 UKR_eastern_wall_desc:0 "Wir müssen die Errungenschaften der Revolution vor der faschistischen Bedrohung schützen. Der Bau einer Bunkerlinie entlang der Grenzen zu faschistischen Nationen wird sicherstellen, dass jede kapitalistisch-faschistische Invasion an unseren Verteidigungsanlagen abgewehrt wird."
 UKR_soviet_ukraine_industry:0 "Sowjetisch-ukrainische Industrie"
 UKR_soviet_ukraine_industry_desc:0 "Durch die Integration unserer Industrieplanung mit sowjetischem Fachwissen können wir externe militärische und zivile Fabriken errichten, die vor Frontbombardements sicher sind."
 UKR_request_soviet_support:0 "Fordern Sie sowjetische Unterstützung an"
 UKR_request_soviet_support_desc:0 "Mit der Industrialisierung unseres Landes und der etablierten militärischen Zusammenarbeit sind wir bereit, unseren Platz als vollwertiger Partner in der sozialistischen Welt einzunehmen. Lassen Sie uns ein formelles Militärbündnis und einen Fraktionsbeitritt mit der Sowjetunion beantragen."

