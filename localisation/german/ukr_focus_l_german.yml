 # Events
 lar_portugal_promote_monarchist_cause.101.t: "Vereinige das Königreich Portugal und Brasilien wieder"
 lar_portugal_promote_monarchist_cause.101.desc: "[POR.GetNameDefCap] entrou em contato com nosso governo, propondo a unificação de nossas nações sob o comando de Dom Duarte Nuno, que será coroado rei de Portugal e do Brasil. \n\nO Governo [POR.GetAdjective] disse que não aceita uma resposta negativa, e nos pediu para aceitar a proposta para evitar um potencial conflito entre nossas nações."
 lar_portugal_promote_monarchist_cause.101.a: "[Root.GetNameDefCap] e [POR.GetNameDef] se unirão novamente."
 lar_portugal_promote_monarchist_cause.101.b: "[Root.GetNameDefCap] continuará como uma nação independentte."
 lar_portugal_promote_monarchist_cause.101.c: "Wir würden es vorziehen, wenn es tatsächlich ein Commonwealth wäre."

 lar_portugal_promote_monarchist_cause.102.t: "[BRA.GetNameDefCap] schlägt Commonwealth vor"
 lar_portugal_promote_monarchist_cause.102.desc: "Unser jüngster Vorschlag an [BRA.GetNameDef] hat eine überraschende Antwort erhalten. [BRA.GetNameDefCap] lehnt die Idee der Vereinigung ab, schlägt aber stattdessen ein Commonwealth für unsere beiden Nationen vor. Dies würde uns einige der Vorteile der Vereinigung verschaffen, weniger der Nachteile, und es beiden Nationen ermöglichen, ihre eigene einzigartige Identität zu bewahren."
 lar_portugal_promote_monarchist_cause.102.a: "Davon könnten wir natürlich auch profitieren!"
 lar_portugal_promote_monarchist_cause.102.b: "Ein Gemeinwesen mit unserer alten Kolonie? Auf keinen Fall."

 lar_portugal_promote_monarchist_cause.103.t: "[POR.GetNameDefCap] stimmt der Gründung des Commonwealth zu"
 lar_portugal_promote_monarchist_cause.103.desc: "Unser Gegenvorschlag, ein Commonwealth zu gründen, anstatt dem [POR.GetNameDef] direkt beizutreten, ist bei der [POR.GetAdjective]-Führung gut angekommen. Sie haben auf die Idee der Vereinigung verzichtet und sind sich einig, dass ein Commonwealth für uns beide großartig wäre."
 lar_portugal_promote_monarchist_cause.103.a: "Ausgezeichnet!"

 lar_portugal_promote_monarchist_cause.104.t: "[BRA.GetNameDefCap] lehnt Commonwealth-Vorschlag ab"
 lar_portugal_promote_monarchist_cause.104.desc: "Unser Gegenvorschlag, ein Commonwealth zu etablieren, anstatt [BRA.GetNameDef] direkt beizutreten, ist schlecht bei der [BRA.GetAdjective]-Führung gelandet. Sie haben die Idee eines Commonwealth abgelehnt und sich Sorgen gemacht, dass sie wieder unter unsere Kontrolle als Kolonie fallen würden."
 lar_portugal_promote_monarchist_cause.104.a: "Dein Verlust"

 lar_portugal_promote_monarchist_cause.105.t: "[POR.GetNameDefCap] schlägt Personalunion vor"
 lar_portugal_promote_monarchist_cause.105.desc: "Die Regierung des [POR.GetNameDef] ist mit einem mutigen Vorschlag an uns herangetreten: der Schaffung einer Personalunion zwischen unseren Kronen. Sie argumentieren, dass die iberischen Völker durch die Vereinigung unter einem Monarchen Stabilität, Wohlstand und größeren Einfluss auf der Weltbühne sichern können. Während eine solche Vereinbarung die Beziehungen zwischen unseren Nationen stärken würde, würde sie auch erfordern, dass wir ein gewisses Maß an portugiesischer Führung in unseren Angelegenheiten akzeptieren."
 lar_portugal_promote_monarchist_cause.105.a: "Eine vereinte Krone wird Stärke und Ruhm bringen."
 lar_portugal_promote_monarchist_cause.105.b: "Wir werden unsere Souveränität nicht Lissabon unterwerfen."

 lar_portugal_promote_monarchist_cause.106.t: "[SPB.GetNameDefCap] nimmt die Union an"
 lar_portugal_promote_monarchist_cause.106.desc: "Unser Vorschlag hat Früchte getragen: Die carlistische Regierung hat die Gründung einer Personalunion formell akzeptiert. Indem sie unsere Kronen zusammenbinden, stehen die iberischen Völker jetzt vereint unter einem Monarchen. Dieser Moment markiert den Beginn einer neuen Ära für die lusophone und hispanische Welt gleichermaßen und verspricht Stärke, Stabilität und Einfluss, die keine Nation allein erreichen könnte."
 lar_portugal_promote_monarchist_cause.106.a: "Eine glorreiche Vereinigung von Kronen!"

 lar_portugal_promote_monarchist_cause.107.t: "[SPB.GetNameDefCap] lehnt die Union ab"
 lar_portugal_promote_monarchist_cause.107.desc: "Unseren Ouvertüren wurde mit kalter Ablehnung begegnet. Die Carlisten-Regierung hat den Vorschlag für eine Personalunion abgelehnt und ist nicht bereit, die Souveränität an Lissabon zu teilen oder abzugeben. Obwohl unsere Vision einer vereinten iberischen Krone vorerst beiseite gelegt wurde, bleibt die Idee lebendig, und vielleicht werden sie eines Tages die Weisheit in der Einheit sehen."
 lar_portugal_promote_monarchist_cause.107.a: "Eine kurzsichtige Entscheidung..."
 POR_new_production_techniques:0 "Produktionstechniken"
 POR_new_production_techniques_desc:0 "Mit neuen Produktionstechniken sind wir viel besser in der Lage, eine Produktionslinie zu warten und aufrechtzuerhalten."
 POR_investment_in_local_companies:0 "Investitionen in lokale Unternehmen"
 POR_investment_in_local_companies_desc:0 "Jetzt, da wir in unsere lokalen Unternehmen investiert haben, müssen sie in der Lage sein, weltweit zu konkurrieren."
 POR_special_forces:0 "Spezialeinheit"
 POR_special_forces_desc:0 "Die Kommandos gehören zu den besten der besten Soldaten der Welt, und jetzt sind sie bereit für ihre Mission"

 # Lusophone Commonwealth
 LUSOPHONE_politic_cooperation:0 "Monarchistische Luso-Kooperation"
 LUSOPHONE_politic_cooperation_desc:0 "Unsere Allianz muss auf jeder Seite des Ozeans zementiert und gefeiert werden."
 LUSOPHONE_tech_sharing_name: "Lusophone Commonwealth-Technologievereinbarung"
 LUSOPHONE_tech_sharing_desc: "Die Mitgliedstaaten des lusophonen Commonwealth haben vereinbart, ihre technologischen Entwicklungen zum beiderseitigen Nutzen aller zu teilen."
 LUSOPHONE_air_cooperation_1:0 "Luft-Kooperation"
 LUSOPHONE_air_cooperation_1_desc:0 "Da die Luftmacht zu einem zunehmend entscheidenden Faktor in der modernen Kriegsführung wird, muss das lusophone Commonwealth die nahtlose Integration unserer Luftstreitkräfte sicherstellen."
 LUSOPHONE_air_cooperation_2:0 "Luft-Kooperation"
 LUSOPHONE_air_cooperation_2_desc:0 "Da die Luftmacht zu einem zunehmend entscheidenden Faktor in der modernen Kriegsführung wird, muss das lusophone Commonwealth die nahtlose Integration unserer Luftstreitkräfte sicherstellen."
 LUSOPHONE_navy_cooperation_1:0 "Marine-Kooperation"
 LUSOPHONE_navy_cooperation_1_desc:0 "Die riesigen Ozeane, die die lusophonen Nationen verbinden, erfordern eine starke und vereinte Marinepräsenz."
 LUSOPHONE_navy_cooperation_2:0 "Marine-Kooperation"
 LUSOPHONE_navy_cooperation_2_desc:0 "Die riesigen Ozeane, die die lusophonen Nationen verbinden, erfordern eine starke und vereinte Marinepräsenz."
 LUSOPHONE_modernize_our_merchant_fleet:0 "Modernisierung unserer Händlerflotte"
 LUSOPHONE_modernize_our_merchant_fleet_desc:0 "Um unsere wirtschaftliche Leistungsfähigkeit zu steigern und die Seehandelsrouten zu sichern, wird das lusophone Commonwealth in die Modernisierung unserer Handelsflotte investieren."
 LUSOPHONE_army_cooperation_1:0 "Armee-Kooperation"
 LUSOPHONE_army_cooperation_1_desc:0 "Um die Interessen des lusophonen Commonwealth zu schützen, müssen unsere Streitkräfte gemeinsam operieren."
 LUSOPHONE_army_cooperation_2:0 "Armee-Kooperation"
 LUSOPHONE_army_cooperation_2_desc:0 "Um die Interessen des lusophonen Commonwealth zu schützen, müssen unsere Streitkräfte gemeinsam operieren."
 LUSOPHONE_special_force:0 "Special Force"
 LUSOPHONE_special_force_desc:0 "Unsere Spezialeinheiten sind das Herzstück unserer Armee und verkörpern Präzision, Agilität und unübertroffene Expertise. Ausgestattet mit der neuesten Technologie und in fortgeschrittenen Taktiken geschult, sind sie entscheidend für die Ausführung von High-Stakes-Missionen, die außergewöhnliches Geschick und Diskretion erfordern."
 LUSOPHONE_improved_intelligence_network:0 "Verbessertes Intelligenznetzwerk"
 LUSOPHONE_improved_intelligence_network_desc:0 "Durch die Verbesserung unserer Überwachungsfunktionen, den Ausbau unseres Netzwerks von Mitarbeitern und den Einsatz fortschrittlicher Entschlüsselungstechnologien können wir genauere und zeitnahe Informationen sammeln."
 LUSOPHONE_atlantic_response_force_1:0 "Atlantische Eingreiftruppe"
 LUSOPHONE_atlantic_response_force_desc_1:0 "Um eine schnelle und effektive Reaktion auf alle maritimen Bedrohungen über den Atlantik zu gewährleisten, wird das Lusophone Commonwealth die Atlantic Response Force einrichten."
 lusophone_commonwealth_capital:0 "Lusophone Commonwealth-Hauptstadt"
 
 # Brazil
 BRA_rekindle_old_conflicts:0 "Alte Konflikte neu entfachen"
 BRA_rekindle_old_conflicts_desc:0 "Um die führende Macht in Südamerika zu werden, müssen wir uns mit alten Rivalen auseinandersetzen, sie überwinden und schließlich die Kontrolle über große Teile des Kontinents erlangen. Wir müssen Paraguay und Bolivien konfrontieren. Wir werden den paraguayischen Krieg rächen, der einer der Faktoren war, die zum Fall des brasilianischen Reiches geführt haben, und Grenzkonflikte mit Bolivien wiederbeleben, was uns einen Vorwand gibt, unsere Territorien zu erweitern."
 BRA_supremacy_in_the_south:0 "Vorherrschaft im Süden"
 BRA_supremacy_in_the_south_desc:0 "Wir brauchen einen letzten Konflikt mit unserem großen Rivalen, um unsere Vorherrschaft in Südamerika zu etablieren. Wir dürfen jedoch nicht zu viel Aufmerksamkeit von den Vereinigten Staaten auf uns ziehen. Wenn wir eine Falle stellen und Argentinien zwingen können, könnten wir als Verteidiger in diesem Konflikt auftreten."
 BRA_reaching_the_pacific:0 "Den Pazifik erreichen"
 BRA_reaching_the_pacific_desc:0 "Der Atlantik war schon immer der Ozean entlang unserer Küste. Mit unserer Expansion ist es jedoch an der Zeit, dass unsere Grenzen auch vom Pazifik gewaschen werden. Chile und Kolumbien haben Ressourcen und Territorien, die uns interessieren und sie zu natürlichen Zielen machen."
 BRA_colossus_of_the_south:0 "Koloss des Südens"
 BRA_colossus_of_the_south_desc:0 "Mit der Sicherung unserer neuen Grenzen verfügt unser Land über die Territorien und Ressourcen, die es braucht, um eine große Weltmacht zu werden. Es ist an der Zeit, der Welt den Aufstieg eines neuen Südreichs zu verkünden."
 BRA_itaipu_and_ilha_solteira:0 "Itaipu und Ilha Solteira"
 BRA_itaipu_and_ilha_solteira_desc:0 "Unser Land verfügt über ein riesiges Flusseinzugsgebiet, sodass wir diese Ressource nutzen können, um Energie zu produzieren und unser wachsendes Land mit Strom zu versorgen. Insbesondere im Einzugsgebiet des Río de la Plata, wo der Fluss Paraná fließt, können wir zwei Wasserkraftwerke bauen – Itaipu in Paraná und Ilha Solteira in São Paulo –, um die Region mit Energie zu versorgen."
 BRA_tucurui_and_paulo_afonso_1:0 "Tucuruí und Paulo Afonso I"
 BRA_tucurui_and_paulo_afonso_1_desc:0 "Um unsere Anstrengungen zur Entwicklung des Landesinneren zu verstärken, müssen wir unsere Energiequellen und Produktion erweitern. Die Flüsse Tocantins und São Francisco bieten mit zwei neuen Anlagen eine hervorragende Gelegenheit, genau dies zu tun: Tucuruí in Pará und Paulo Afonso I in Bahia."

 # Portugal
 POR_modernize_lisbon_industry:0 "Modernisieren Sie Lissabons Industrie"
 POR_modernize_lisbon_industry_desc:0 "Lissabon, als das Herz Portugals, ist der Schlüssel für die wirtschaftliche Zukunft unseres Landes. Indem wir in die Industriebasis der Stadt investieren und diese modernisieren, können wir sie in ein geschäftiges Zentrum für Produktion und Innovation verwandeln."
 POR_revitalize_porto_industry:0 "Beleben Sie die Industrie von Porto"
 POR_revitalize_porto_industry_desc:0 "Porto ist mit seinem reichen industriellen Erbe und seiner strategischen Küstenlage bereit für eine neue Ära des wirtschaftlichen Wohlstands. Indem wir Ressourcen in die Modernisierung und Erweiterung des Industriesektors von Porto lenken, können wir neue Wachstumschancen erschließen."
 POR_expand_fmg:0 "Erweitern Sie „Fábrica de Material de Guerra“."
 POR_expand_fmg_desc:0 "Wir sollten die Firma Fábrica de Material de Guerra nutzen, um unsere Zugproduktion zu verbessern"
 POR_expand_fmg_tooltip:0 "Dadurch werden zwei neue Eigenschaften im Unternehmen Fábrica de Material de Guerra freigeschaltet"
 POR_develop_the_moncorvo_mines:0 "Entwickeln Sie die Moncorvo-Minen"
 POR_develop_the_moncorvo_mines_desc:0 "Angesichts des aktuellen Bedarfs an Eisen ist die Entwicklung der Moncorvo-Minen von entscheidender Bedeutung für die Zukunft unseres Landes"
 POR_develop_the_ajustrel_mines:0 "Entwickeln Sie die Ajustrel-Minen"
 POR_develop_the_ajustrel_mines_desc:0 "Die Ajustrel-Minen, eine der ältesten Minen der Geschichte, sollten verbessert werden, um unsere Chromproduktion zu steigern"
 POR_invest_in_our_companies:0 "Investieren Sie in unsere Unternehmen"
 POR_invest_in_our_companies_desc:0 "Es ist an der Zeit, dass wir mehr in unsere lokalen Unternehmen investieren"
 POR_fabrequipa:0 "Fabrequipa"
 POR_fabrequipa_desc:0 "Durch die Investition in das Unternehmen Fabrequipa sollten wir in der Lage sein, die unterschiedlichsten Rüstungstypen herzustellen und zu verbessern"
 POR_strengthen_our_navy:0 "Stärken Sie unsere Marine"
 POR_strengthen_our_navy_desc:0 "Als Nation mit einem stolzen maritimen Erbe müssen wir seine Marinefähigkeiten wiederbeleben, um unsere Interessen zu schützen und unsere Handelswege zu sichern."
 POR_mutual_investment:0 "Gegenseitige Investition"
 POR_mutual_investment_desc:0 "Durch die Schaffung eines Rahmens für gemeinsame wirtschaftliche Unternehmungen zwischen uns und Brasilien können beide Nationen von mehr Handel, Infrastrukturentwicklung und finanzieller Stabilität profitieren. Diese gegenseitige Investition stärkt die Bindung zwischen der lusophonen Welt und sichert gleichzeitig den Wohlstand für die Zukunft."
 POR_support_carlist_insurgency:0 "Unterstützen Sie Carlist Insurgency"
 POR_support_carlist_insurgency_desc:0 "Die Carlist-Bewegung in Spanien stellt einen potenziellen Verbündeten in unserem Bestreben dar, die Monarchie wiederherzustellen und dem Einfluss der Republikaner entgegenzuwirken. Indem wir die Aufständischen der Carlist unterstützen, können wir ihnen helfen, wieder zu Kräften zu kommen und möglicherweise ein freundschaftliches Regime in Spanien zu etablieren, das unseren Interessen entspricht."
 POR_carlist_uprising_in_spain:0 "Aufstand der Karlisten in Spanien"
 POR_carlist_uprising_in_spain_desc:0 "Mit unserer Unterstützung haben die Carlist-Kräfte an Dynamik gewonnen und starten nun einen bedeutenden Aufstand gegen die republikanische Regierung in Spanien. Dies stellt für uns eine Gelegenheit dar, unseren Einfluss in der Region zu stärken und möglicherweise die Machtübernahme eines befreundeten Regimes zu erleben."
 POR_intervene_in_spain_civil_war:0 "Intervenieren Sie im spanischen Bürgerkrieg"
 POR_intervene_in_spain_civil_war_desc:0 "Der anhaltende Bürgerkrieg in Spanien stellt einen kritischen Wendepunkt für unsere Nation dar. Indem wir in den Konflikt eingreifen, können wir die Streitkräfte der Carlist unterstützen und dazu beitragen, den Ausgang des Krieges in einer Weise zu gestalten, die unseren Interessen und Werten entspricht."
 POR_iberian_union:0 "Iberische Union"
 POR_iberian_union_desc:0 "Spanien und Portugal müssen sich zu einer Einheit zusammenschließen und eine mächtige iberische Nation bilden, die bereit ist, der Welt gemeinsam entgegenzutreten."
 POR_brazilian_clains:0 "Brasilianische Ansprüche"
 POR_brazilian_clains_desc:0 "Das Land, das einst von spanischen und portugiesischen Kolonien gehalten wurde, sollte nun rechtmäßig von Brasilien beansprucht werden."

 # Lusophone Commonwealth
 LUSOPHONE_commonwealth_capital:0 "Die Hauptstadt des lusophonen Commonwealth"
 LUSOPHONE_commonwealth_capital_desc:0 "Mit der Gründung des Lusophone Commonwealth stellt sich die Frage: Wo wird sein Herz liegen?"
 LUSOPHONE_high_command:0 "Lusophones Oberkommando"
 LUSOPHONE_high_command_desc:0 "Unsere Kräfte sind durch einen Ozean getrennt, aber das bedeutet nicht, dass wir nicht voneinander lernen können. Unsere Unterschiede machen unsere Stärke ebenso aus wie unsere Verbundenheit mit unseren portugiesischen Wurzeln unsere Stärke."
 LUSOPHONE_government_coperation:0 "Regierungskooperation"
 LUSOPHONE_government_coperation_desc:0 "Mit dem Aufstieg des Lusophonen Commonwealth ist eine vertiefte staatliche Zusammenarbeit zwischen unseren Nationen für Stabilität und gegenseitiges Wachstum von entscheidender Bedeutung"
 LUSOPHONE_collaborative_research:0 "Verbundforschung"
 LUSOPHONE_collaborative_research_desc:0 "Mit der Stärkung des Lusophone Commonwealth wird der Austausch von Wissen und Innovation zu einer entscheidenden Säule unseres gemeinsamen Fortschritts."
 LUSOPHONE_air_cooperation:0 "Luft-Kooperation"
 LUSOPHONE_air_cooperation_desc:0 "Da die Luftmacht zu einem zunehmend entscheidenden Faktor in der modernen Kriegsführung wird, muss das lusophone Commonwealth die nahtlose Integration unserer Luftstreitkräfte sicherstellen."
 LUSOPHONE_navy_cooperation:0 "Marine-Kooperation"
 LUSOPHONE_navy_cooperation_desc:0 "Die riesigen Ozeane, die die lusophonen Nationen verbinden, erfordern eine starke und vereinte Marinepräsenz."
 LUSOPHONE_army_cooperation:0 "Armee-Kooperation"
 LUSOPHONE_army_cooperation_desc:0 "Um die Interessen des lusophonen Commonwealth zu schützen, müssen unsere Streitkräfte gemeinsam operieren."
 LUSOPHONE_air_exercises:0 "Luftübungen"
 LUSOPHONE_air_exercises_desc:0 "Um die Einsatzbereitschaft und Effektivität unserer Luftstreitkräfte sicherzustellen, wird das Lusophone Commonwealth in unseren Territorien gemeinsame Luftübungen durchführen."
 LUSOPHONE_navy_exercises:0 "Marineübungen"
 LUSOPHONE_navy_exercises_desc:0 "Um die Überlegenheit der Marine aufrechtzuerhalten und eine reibungslose Koordination sicherzustellen, wird das Lusophone Commonwealth umfangreiche gemeinsame Marineübungen durchführen."
 LUSOPHONE_army_exercises:0 "Armeeübungen"
 LUSOPHONE_army_exercises_desc:0 "Um die Effektivität unserer Bodentruppen zu erhöhen und eine einheitliche militärische Aktion sicherzustellen, wird das Lusophone Commonwealth gemeinsame Armeeübungen durchführen."
 LUSOPHONE_air_war_games:0 "Luftkriegsspiele"
 LUSOPHONE_air_war_games_desc:0 "Der Himmel wird das Schlachtfeld der Zukunft sein, und das Lusophone Commonwealth muss vorbereitet sein."
 LUSOPHONE_navy_war_games:0 "Kriegsspiele der Marine"
 LUSOPHONE_navy_war_games_desc:0 "Um sicherzustellen, dass unsere Flotten kampfbereit sind, wird das Lusophone Commonwealth umfassende Seekriegsspiele durchführen."
 LUSOPHONE_land_war_games:0 "Landkriegsspiele"
 LUSOPHONE_land_war_games_desc:0 "Um unsere Armeen auf die Realitäten der modernen Kriegsführung vorzubereiten, wird das Lusophone Commonwealth umfangreiche Landkriegsspiele durchführen."
 LUSOPHONE_our_art_of_war:0 "Unsere Kriegskunst"
 LUSOPHONE_our_art_of_war_desc:0 "Aufbauend auf den militärischen Traditionen und strategischen Erkenntnissen unserer Mitgliedsstaaten wird das Lusophone Commonwealth seine eigene einzigartige Kriegskunst entwickeln."
 LUSOPHONE_special_force_program:0 "Spezialeinheitsprogramm"
 LUSOPHONE_special_force_program_desc:0 "Die Gründung der Caçadores unter dem lusophonen Commonwealth markiert eine neue Ära militärischer Exzellenz. Dieses Spezialeinheitsprogramm wird Eliteeinheiten entwickeln, die in der Lage sind, hinter den feindlichen Linien zu operieren, Aufklärung durchzuführen und Präzisionsschläge auszuführen."
 LUSOPHONE_shared_intelligence_network:0 "Gemeinsames Geheimdienstnetzwerk"
 LUSOPHONE_shared_intelligence_network_desc:0 "Um die Interessen des Lusophone Commonwealth zu wahren, müssen wir unsere Geheimdienstkapazitäten erweitern und verbessern. Durch den Aufbau eines robusten Netzwerks aus Spionen und Informanten werden wir wichtige Informationen über potenzielle Bedrohungen sammeln, rivalisierende Nationen überwachen und wichtige strategische Bereiche infiltrieren."
 LUSOPHONE_economic_alliance:0 "Wirtschaftsallianz"
 LUSOPHONE_economic_alliance_desc:0 "Durch den Aufbau einer umfassenden Wirtschaftsallianz werden wir die Handelspolitik harmonisieren, Wirtschaftsstrategien koordinieren und in gemeinsame Infrastrukturprojekte investieren. Diese Zusammenarbeit wird das gegenseitige Wachstum fördern, die regionale Stabilität stärken und einen robusten Wirtschaftsblock schaffen, der auf der globalen Bühne konkurrieren kann."
 LUSOPHONE_construction_developments:0 "Bauentwicklungen"
 LUSOPHONE_construction_developments_desc:0 "Um den Fortschritt und die Modernisierung im gesamten lusophonen Commonwealth voranzutreiben, werden wir bedeutende Baumaßnahmen durchführen."
 LUSOPHONE_material_design:0 "Materialdesign"
 LUSOPHONE_material_design_desc:0 "Um auf der globalen Bühne vorne zu bleiben, wird das Lusophone Commonwealth in fortschrittliches Materialdesign und Innovation investieren."
 LUSOPHONE_improve_infrastructure:0 "Infrastruktur verbessern"
 LUSOPHONE_improve_infrastructure_desc:0 "Um die wirtschaftliche und strategische Stärke des Lusophone Commonwealth zu stärken, werden wir eine umfassende Verbesserung unserer Infrastruktur vornehmen."
 LUSOPHONE_sponsor_new_industries:0 "Sponsern Sie neue Industrien"
 LUSOPHONE_sponsor_new_industries_desc:0 "Um die Wirtschaft des Lusophone Commonwealth zu beleben und Innovationen voranzutreiben, werden wir die Entwicklung neuer Industrien fördern."
 LUSOPHONE_advanced_construction_techniques:0 "Fortgeschrittene Bautechniken"
 LUSOPHONE_advanced_construction_techniques_desc:0 "Um die Effizienz und Effektivität unserer Infrastrukturprojekte zu steigern, wird das Lusophone Commonwealth fortschrittliche Bautechniken übernehmen"
 LUSOPHONE_advanced_construction_techniques_1:0 "Fortgeschrittene Bautechniken"
 LUSOPHONE_advanced_construction_techniques_desc_1:0 "Um die Effizienz und Effektivität unserer Infrastrukturprojekte zu steigern, wird das Lusophone Commonwealth fortschrittliche Bautechniken übernehmen"
 LUSOPHONE_heart_of_operations:0 "Herzstück der Operationen"
 LUSOPHONE_heart_of_operations_desc:0 "Der Kern der strategischen Stärke des Lusophone Commonwealth liegt in unserer operativen Infrastruktur. Indem wir uns auf das Herzstück der Operationen konzentrieren, werden wir unsere zentralen Kommando- und Logistikzentren verbessern und sicherstellen, dass sie für die effiziente Verwaltung und Koordinierung unserer militärischen, wirtschaftlichen und administrativen Aktivitäten gerüstet sind."
 LUSOPHONE_develop_resources:0 "Ressourcen entwickeln"
 LUSOPHONE_develop_resources_desc:0 "Um das Wachstum und die Nachhaltigkeit des Lusophone Commonwealth voranzutreiben, werden wir der Entwicklung unserer natürlichen und industriellen Ressourcen Priorität einräumen."
 LUSOPHONE_nuclear_research:0 "Kernforschung"
 LUSOPHONE_nuclear_research_desc:0 "Das Lusophone Commonwealth erkennt das immense Potenzial der Nukleartechnologie und wird ein ehrgeiziges Nuklearforschungsprogramm starten."
 LUSOPHONE_nuclear_production:0 "Nukleare Produktion"
 LUSOPHONE_nuclear_production_desc:0 "Aufbauend auf unseren Fortschritten in der Nuklearforschung wird das Lusophone Commonwealth nun der Produktion und Entwicklung der Nukleartechnologie Priorität einräumen."
 LUSOPHONE_renew_our_arsenal:0 "Erneuern Sie unser Arsenal"
 LUSOPHONE_renew_our_arsenal_desc:0 "Um einen strategischen Vorsprung zu wahren und die Einsatzbereitschaft unserer Streitkräfte sicherzustellen, wird das Lusophone Commonwealth eine umfassende Erneuerung unseres Arsenals vornehmen."
 LUSOPHONE_improve_our_dockyards:0 "Verbessern Sie unsere Werften"
 LUSOPHONE_improve_our_dockyards_desc:0 "Um unsere Marinekapazitäten zu verbessern und maritime Operationen zu unterstützen, wird das Lusophone Commonwealth in die Verbesserung unserer Werften investieren. Der Schwerpunkt dieser Initiative liegt auf der Modernisierung von Anlagen, der Steigerung der Schiffbaueffizienz und der Erweiterung der Reparatur- und Wartungskapazitäten."
 LUSOPHONE_new_naval_designs:0 "Neue Marinedesigns"
 LUSOPHONE_new_naval_designs_desc:0 "Um unsere Marineflotte zu stärken und die maritime Dominanz zu stärken, wird sich das Lusophone Commonwealth auf die Entwicklung neuer Marinedesigns konzentrieren."
 LUSOPHONE_atlantic_response_force:0 "Atlantische Eingreiftruppe"
 LUSOPHONE_atlantic_response_force_desc:0 "Um eine schnelle und effektive Reaktion auf alle maritimen Bedrohungen über den Atlantik zu gewährleisten, wird das Lusophone Commonwealth die Atlantic Response Force einrichten."
 LUSOPHONE_new_army_designs:0 "Neue Armeedesigns"
 LUSOPHONE_new_army_designs_desc:0 "Um unsere Bodentruppen zu stärken und sicherzustellen, dass sie für den modernen Kampf gerüstet sind, wird sich das Lusophone Commonwealth auf die Entwicklung neuer Armeedesigns konzentrieren."
 LUSOPHONE_advanced_military_manufacturing:0 "Fortschrittliche militärische Fertigung"
 LUSOPHONE_advanced_military_manufacturing_desc:0 "Um sicherzustellen, dass das Lusophone Commonwealth über ein hochmodernes Militär verfügt, werden wir unsere militärischen Produktionskapazitäten ausbauen."
 LUSOPHONE_new_air_designs:0 "Neue Air-Designs"
 LUSOPHONE_new_air_designs_desc:0 "Um einen technologischen Vorsprung aufrechtzuerhalten und unsere Luftkampffähigkeiten zu verbessern, wird das Lusophone Commonwealth in die Entwicklung neuer Luftkonstruktionen investieren."
 LUSOPHONE_standardize_aerial_production:0 "Standardisieren Sie die Luftproduktion"
 LUSOPHONE_standardize_aerial_production_desc:0 "Um die Fähigkeiten unserer Luftwaffe zu rationalisieren und zu verbessern, wird das Lusophone Commonwealth die Luftproduktionsprozesse standardisieren."

