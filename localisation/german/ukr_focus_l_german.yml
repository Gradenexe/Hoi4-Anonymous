 # USSR Question about Ukraine-Belarus Unification
 UKR_events.19.t: "Die Frage der ukrainisch-belarussischen Wiedervereinigung"
 UKR_events.19.d: "Aus Kiew ist ein bedeutsamer Vorschlag eingetroffen. Nachdem die ukrainische Regierung ihre Autorität gefestigt und ihre Position gestärkt hat, strebt sie nun eine Wiedervereinigung mit ihren belarussischen Brüdern an. Der Traum eines einheitlichen ostslawischen Staates – von den Karpaten bis zum Dnjepr – ist wieder aufgetaucht. Eine solche Union würde einen gewaltigen Machtblock in Osteuropa schaffen und das Kräftegleichgewicht auf dem Kontinent für immer verändern. Die ukrainische Führung bittet Moskau demütig um den Segen für dieses historische Unterfangen. Sollen wir dieser großartigen Vision der slawischen Einheit unsere Zustimmung geben?"
 UKR_events.19.a: "Wir werden die Vereinigung der Ukraine und Weißrusslands unterstützen. Mögen die slawischen Völker vereint sein!"
 UKR_events.19.b: "Wir müssen uns weigern. Eine solche Einheit ist verfrüht und könnte die Region destabilisieren."
 # Unification Accepted - The New Union is Born
 UKR_events.20.t: "Die Union der Ukraine und Weißrusslands wird ausgerufen!"
 UKR_events.20.d: "Die Geschichte wird sich an diesen Tag erinnern! Mit dem Segen Moskaus haben die ukrainische und die weißrussische Nation feierlich ihre ewige Vereinigung erklärt. Von den Sümpfen Polesiens bis zu den Küsten des Schwarzen Meeres, von den alten Wäldern von Białowieża bis zu den weiten Steppen des Dnjepr – eine Flagge weht jetzt über einem vereinten Reich. Das neue ukrainisch-belarussische Commonwealth gilt als Leuchtturm der ostslawischen Zivilisation, als Bastion nationaler Wiederbelebung und Brüderlichkeit. Diese Union wird das Schicksal Osteuropas grundlegend verändern. Möge diese Union brüderlicher Nationen auch in den kommenden Jahrhunderten gedeihen!"
 UKR_events.20.a: "Es lebe die ewige Union der Ukraine und Weißrusslands! Ehre sei unseren brüderlichen Völkern!"
 # USSR Rejects Unification
 UKR_events.21.t: "Moskaus Weigerung: Ein aufgeschobener Traum"
 UKR_events.21.d: "Die sowjetische Führung lehnte den ukrainischen Vorschlag zur Wiedervereinigung mit Weißrussland ab. Die Entscheidung ist zwar enttäuschend, aber nicht ganz unerwartet – Moskau bleibt hinsichtlich der Entstehung neuer Machtzentren in seinem Einflussbereich vorsichtig. Das Streben des ukrainischen Volkes nach Einheit mit seinen weißrussischen Verwandten muss einen weiteren Tag warten. Auch wenn der Traum von einem vereinten ostslawischen Staat in den Herzen vieler noch lebendig ist, müssen die beiden Nationen vorerst getrennte Wege gehen. Vielleicht kommt eine günstigere Zeit."
 UKR_events.21.a: "Wir akzeptieren die Entscheidung Moskaus, wenn auch mit großer Trauer. Vielleicht an einem anderen Tag."


 # Ukraine Demands Bessarabia (Ultimatum to the current controller)
 UKR_events.16.t: "Das bessarabische Ultimatum"
 UKR_events.16.d: "Die Regierung der Ukraine hat ein formelles Ultimatum bezüglich der historischen Gebiete Bessarabien, Nordbukowina und Südbessarabien gestellt. Diese Gebiete sind seit Jahrhunderten Teil der historischen Heimat der Ukraine – von unseren Verwandten bewohnt, von unseren Vorfahren geheiligt und von fremden Mächten von uns gerissen. Das ukrainische Volk fordert die Rückgabe seines rechtmäßigen Landes. Der ausländische Besatzer steht nun vor einer einfachen Wahl: Entweder er muss diese angestammten Gebiete friedlich an die Ukraine zurückgeben oder er muss sich den Konsequenzen stellen."
 UKR_events.16.a: "Wir akzeptieren die legitimen Forderungen der Ukraine. Dieses Land ist zu Recht ukrainisch."
 UKR_events.16.b: "Wir lehnen ab! Die Behauptungen der Ukraine sind unbegründet und werden nicht toleriert."
 # Ukraine Receives Bessarabia (Acceptance)
 UKR_events.17.t: "Bessarabien kehrt in die Ukraine zurück!"
 UKR_events.17.d: "Die Geschichte wird diesen Tag als Triumph der Gerechtigkeit festhalten! Die Gebiete Bessarabien, Nordbukowina und Südbessarabien wurden friedlich dem ukrainischen Mutterland zurückgegeben. Die ukrainische Nation ist größer geworden, ihre angestammten Länder kehren wie lange verlorene Söhne in die Umarmung ihrer Mutter zurück. Unser Volk feiert von den Karpatentälern bis zu den Dnjepr-Steppen – ein neues Kapitel unserer nationalen Wiederbelebung hat begonnen. Mögen diese Länder unter dem ukrainischen Banner gedeihen!"
 UKR_events.17.a: "Ehre sei der Ukraine! Das Land ist nach Hause zurückgekehrt!"
 # Ukraine Gets War Goal on Bessarabia (Refusal)
 UKR_events.18.t: "Ultimatum abgelehnt – Krieg ist unvermeidlich"
 UKR_events.18.d: "[ROOT.GetNameWithFlag] hat die Nachricht erhalten: Die ausländische Macht, die Bessarabien kontrolliert, hat das Ultimatum abgelehnt. Dem ukrainischen Volk darf nicht vorenthalten werden, was ihm rechtmäßig zusteht – jetzt ist der einzige Weg vorwärts der Krieg. [ROOT.GetName] muss sich auf einen bewaffneten Konflikt vorbereiten, um diese angestammten Länder zu befreien. Das Schwert wird darüber entscheiden, was die Diplomatie nicht erreichen konnte."
 UKR_events.18.a: "Wir werden uns zurückholen, was uns gehört! In den Krieg!"

 # Ukraine Demands Crimea from the USSR
 UKR_events.13.t: "Die Ukraine fordert die Rückgabe der Krim"
 UKR_events.13.d: "Die ukrainische Regierung hat eine formelle Anfrage an Moskau bezüglich des Status der Krim gerichtet. Dieses alte Land – die Wiege der Kiewer Rus-Zivilisation, das Herz unserer historischen Heimat – wurde zu lange zu Unrecht von der Ukraine getrennt. Der Boden der Krim ist durchtränkt vom Blut ukrainischer Kosaken, dem Schweiß ukrainischer Bauern und den Tränen ukrainischer Familien, die ihren angestammten Wurzeln entrissen wurden. Das ukrainische Volk fordert die Rückgabe seiner heiligen Halbinsel. Die sowjetische Führung steht nun vor einer historischen Entscheidung: Entweder die Krim friedlich an die Ukraine zurückgeben oder als Unterdrücker in Erinnerung bleiben, der einer Nation ihr Geburtsrecht verweigerte."
 UKR_events.13.a: "Die Krim soll zur Ukraine zurückkehren! Das ist eine berechtigte Forderung."
 UKR_events.13.b: "Die Ansprüche der Ukraine gegenüber der Krim sind unbegründet. Die Sowjetunion muss ihre territoriale Integrität wahren."
 # Crimea Ceded to Ukraine (USSR accepts)
 UKR_events.14.t: "Die Krim kehrt zur Ukraine zurück!"
 UKR_events.14.d: "Ein neuer Morgen bricht über dem Schwarzen Meer an! Die alte Halbinsel Krim – Heimat von Helden, Dichtern und Wiege der ukrainischen Geschichte – wurde friedlich ihren rechtmäßigen Besitzern zurückgegeben. Von den Klippen des Krimgebirges bis zu den Küsten von Sewastopol wehen erneut ukrainische Flaggen über dem Land unserer Vorfahren. Das ukrainische Volk weint vor Freude, als seine Brüder und Schwestern auf der Halbinsel endlich wieder mit dem Mutterland vereint sind. Sewastopol, Jalta und Kertsch – jede Stadt, jedes Dorf, jeder Stein der Krim schreit: „Wir sind die Ukraine!“"
 UKR_events.14.a: "Ehre sei der Ukraine! Die Krim ist nach Hause gekommen!"
 # USSR Rejects Ukrainian Claim to Crimea
 UKR_events.15.t: "Moskaus Weigerung: Die Krim bleibt unter sowjetischer Herrschaft"
 UKR_events.15.d: "Die sowjetische Führung hat die Forderung der Ukraine nach Rückgabe der Krim abgelehnt. Die Entscheidung Moskaus ist ein Schlag für die nationale Wiederbelebung der Ukraine und eine Absage an die historischen Bindungen unseres Volkes an die Halbinsel. Die ukrainische Regierung hat vom Kreml die Nachricht erhalten, dass die Krim unter sowjetischer Verwaltung bleiben soll. Damit ist die Sache noch nicht erledigt. Das ukrainische Volk wird die Krim niemals vergessen und auch nicht aufhören, von dem Tag zu träumen, an dem die Halbinsel wieder in die Umarmung ihres Mutterlandes zurückkehrt."
 UKR_events.15.a: "Wir werden die Krim nicht vergessen. Eines Tages wird es in die Ukraine zurückkehren."

# Ukraine Demands Return of Ukrainian & Belarusian Lands in Eastern Poland
 UKR_events.22.t: "Die Rückkehr der ostpolnischen Länder"
 UKR_events.22.d: "Die ukrainische Regierung hat die Sowjetunion offiziell aufgefordert, die ukrainischen und weißrussischen Gebiete Ostpolens ihren rechtmäßigen Eigentümern zurückzugeben. Die Länder Wolhynien, Ostgalizien und Polesien – Heimat von Millionen Ukrainern und Weißrussen – wurden durch die willkürlichen Grenzen der Reiche zu Unrecht von ihren Heimatländern getrennt. Diese Gebiete sind nicht nur strategische Besitztümer; Sie sind die Wiege der ukrainischen und weißrussischen Kultur, geheiligt von Jahrhunderten der Geschichte, des Glaubens und der Opferbereitschaft. Die sowjetische Führung steht nun vor einer historischen Entscheidung: diese Länder friedlich an die Ukraine und Weißrussland zurückzugeben oder als Unterdrücker in Erinnerung zu bleiben, der ganzen Nationen ihr Geburtsrecht verweigerte."
 UKR_events.22.a: "Wir akzeptieren die berechtigten Forderungen der Ukraine. Diese Länder gehören zur Ukraine und Weißrussland."
 UKR_events.22.b: "Wir lehnen ab! Diese Gebiete sind integraler Bestandteil der Sowjetunion."
 # Acceptance – Eastern Polish Lands Returned
 UKR_events.23.t: "Ostpolnische Gebiete kehren in die Ukraine und Weißrussland zurück!"
 UKR_events.23.d: "Die Geschichte wurde richtig gestellt! Die ukrainischen und weißrussischen Gebiete Ostpolens – Wolhynien, Ostgalizien und Polesien – wurden friedlich in ihre Mutterländer zurückgeführt. Ukrainische und weißrussische Flaggen wehen nun über Städten und Dörfern, die diesen Tag herbeigesehnt haben: Lemberg, Luzk, Riwne, Brest und Hunderte andere Gemeinden jubeln. Dies ist ein Triumph der Gerechtigkeit und ein Beweis für die unzerbrechliche Brüderlichkeit der ostslawischen Völker. Mögen diese Länder unter den Bannern der Ukraine und Weißrusslands gedeihen!"
 UKR_events.23.a: "Ehre sei der Ukraine! Ehre sei Weißrussland! Unser Land ist nach Hause gekommen!"
 # Refusal – USSR Rejects the Demand
 UKR_events.24.t: "Moskaus Weigerung: Die ostpolnischen Gebiete bleiben sowjetisch"
 UKR_events.24.d: "Die sowjetische Führung lehnte den Antrag der Ukraine auf Rückgabe der ostpolnischen Gebiete ab. Moskau hat beschlossen, seine Kontrolle über Wolhynien, Ostgalizien und Polesien zu behalten und den Ukrainern und Weißrussen ihre angestammte Heimat zu verweigern. Die ukrainische Regierung zeigte sich zutiefst enttäuscht, respektiert die Entscheidung jedoch – vorerst. Der Traum von der Wiedervereinigung lebt jedoch in den Herzen von Millionen weiter, und das ukrainische Volk wird nie aufhören, sich an seine Brüder und Schwestern zu erinnern, die unter ausländischer Herrschaft lebten."
 UKR_events.24.a: "Wir werden unsere Brüder und Schwestern jenseits der Grenze nicht vergessen. Eines Tages werden wir vereint sein."

 LAT_Construction_of_the_kegum_hydroelectric_power_plant:0 "Bau des Kegum-Staudamms"
 LAT_Construction_of_the_kegum_hydroelectric_power_plant_desc:0 "Das Wasserkraftwerk Kegum ist ein monumentales Projekt, das die Kraft des Flusses Daugava nutzen wird, um Lettland mit sauberer, erneuerbarer Energie zu versorgen. Diese Initiative wird nicht nur unsere wachsenden Industrien und städtischen Zentren mit Strom versorgen, sondern auch Arbeitsplätze schaffen und das Wirtschaftswachstum ankurbeln. Durch die Investition in diese Infrastruktur machen wir einen bedeutenden Schritt in Richtung Energieunabhängigkeit und Nachhaltigkeit für unser Land."
 CZE_sorb_integration:0 "Sorbische Integration"
  CZE_sorb_integration_desc:0 "Die Sorben, eine slawische Minderheit in unserem Land, wurden lange Zeit an den Rand gedrängt und unterrepräsentiert. Durch die Integration der sorbischen Gemeinschaft in das politische, soziale und wirtschaftliche Gefüge unseres Landes können wir sicherstellen, dass ihre Stimmen gehört und ihre Rechte geschützt werden. Diese Initiative wird die kulturelle Vielfalt fördern, die nationale Einheit stärken und eine integrativere Gesellschaft für alle Bürger fördern."
   POL_Construct_Hydroelectric_Power_Plants:0 "Bauen Sie Wasserkraftwerke"
 POL_Construct_Hydroelectric_Power_Plants_desc:0 "Der Bau von Staudämmen in Rożnów und Myczkowce wird dafür sorgen, dass unsere Industrie wachsen kann."
 POL_Expansion_Of_New_Towns:0 "Erweiterung neuer Städte"
 POL_Expansion_Of_New_Towns_desc:0 "Es reicht nicht aus, Städte zu gründen, um zu gedeihen – sie müssen auch unterstützt werden, damit sie ihr volles Potenzial entfalten können."
 POL_Start_The_Fifteen_Year_Plan:0 "Starten Sie den Fünfzehnjahresplan"
 POL_Start_The_Fifteen_Year_Plan_desc:0 "Es ist an der Zeit, den Grundstein für die Entwicklung ganz Polens zu einer entwickelten Nation zu legen. Ein fünfzehnjähriges Investitionsprogramm wird uns zum First-World-Status führen."
 POL_Electrification_of_the_Countryside:0 "Elektrifizierung des Landes"
 POL_Electrification_of_the_Countryside_desc:0 "Durch die Versorgung der entlegensten Städte und Dörfer mit zuverlässiger Stromversorgung wird sichergestellt, dass sich moderne Industrien entwickeln können, während gleichzeitig die öffentliche Unterstützung unserer Regierung in ländlichen Gebieten gestärkt wird."
 POL_Phase_I_Military_Rearmament:0 "Phase I§H:§! Militärische Aufrüstung"
 POL_Phase_I_Military_Rearmament_desc:0 "Die erste Phase unseres 15-Jahres-Plans sieht eine rasche Expansion unserer heimischen Verteidigungsindustrie vor. Für die polnischen Streitkräfte ist ein umfassendes Modernisierungsprogramm geplant, das bis 1942 abgeschlossen sein soll."
 POL_Phase_II_Infrastructure_Development:0 "Phase II§H:§! Infrastrukturentwicklung"
 POL_Phase_II_Infrastructure_Development_desc:0 "Die zweite Phase unseres 15-Jahres-Plans erfordert einen starken Schwerpunkt auf die Modernisierung der polnischen Infrastruktur. Durch die Asphaltierung von Landstraßen und den Bau neuer Autobahnen können weite Teile der Landschaft für den Autoverkehr nutzbar gemacht werden."
 POL_Phase_III_Agriculture_and_Education:0 "Phase III§H:§! Landwirtschaft und Bildung"
 POL_Phase_III_Agriculture_and_Education_desc:0 "Die dritte Phase unseres 15-Jahres-Plans sieht die Modernisierung der polnischen Landwirtschaft vor. Durch die Bereitstellung von Mähdreschern, Traktoren und schweren Maschinen für die Landbauern sowie die technische Ausbildung zu deren Wartung können Agrarexporte wieder wettbewerbsfähig werden."
 POL_Phase_IV_Urbanization:0 "Phase IV§H:§! Urbanisierungsanreize"
 POL_Phase_IV_Urbanization_desc:0 "Die vierte Phase unseres 15-Jahres-Plans sieht eine rasche Urbanisierung des Landes vor. Durch Investitionen in die Entwicklung von Städten, die Schaffung neuer Beschäftigungsmöglichkeiten und die Bereitstellung großzügiger Subventionen werden ländliche Bauern dazu ermutigt, in städtische Zentren abzuwandern."
 POL_Phase_V_Equalize_Poland_A_and_B:0 "Phase V§H:§! Gleicht Polen „A“ und Polen „B“ aus"
 POL_Phase_V_Equalize_Poland_A_and_B_desc:0 "Die fünfte Phase unseres 15-Jahres-Plans wird die Einkommensunterschiede zwischen West- und Ostpolen endlich beseitigen. Durch die Trockenlegung der Sümpfe in Ostpolen und die Bereitstellung von Entwicklungshilfe in der Region wird es zu mehr Handel und Wirtschaftswachstum kommen."
