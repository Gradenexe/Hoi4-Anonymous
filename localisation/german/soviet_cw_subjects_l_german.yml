l_german:
 soviet_cw_subjects.1.t:0 "Der sowjetische Bürgerkrieg"
 soviet_cw_subjects.1.d:0 "In Russland ist Chaos ausgebrochen, als die Sowjetunion in einen erbitterten Bürgerkrieg zerfällt. Die Autorität unserer Oberherren in Moskau ist gelähmt und stellt uns vor eine schicksalhafte Entscheidung.\n\nSollten wir diese Gelegenheit nutzen, um die völlige Unabhängigkeit zu erklären und gegen jede russische Herrschaft zu kämpfen? Oder sollten wir uns in ihrem inneren Kampf für eine Seite entscheiden und hoffen, unsere Position beim Sieger zu sichern?"
 soviet_cw_subjects.1.a:0 "Wir kämpfen für wahre Unabhängigkeit!"
 soviet_cw_subjects.1.b:0 "Wir werden die Opposition unterstützen."
 soviet_cw_subjects.1.c:0 "Wir bleiben Moskau treu."
