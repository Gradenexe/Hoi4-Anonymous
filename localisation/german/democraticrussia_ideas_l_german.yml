l_german:
 RUS_new_republic_idea:0 "Die Neue Republik"
 RUS_new_republic_idea_desc:0 "Das alte Russland ist verschwunden und die Republik wurde wiederbelebt! Für die Menschen!"
 RUS_multi_ethnic_federation:0 "Sonderrechte"
 RUS_multi_ethnic_federation_desc:0 "In unserer Verfassung ist verankert, dass unser Land Minderheitengruppen besondere Rechte einräumt."
 RUS_nation_state:0 "Ein Volk"
 RUS_nation_state_desc:0 "Wir sind ein Volk. Ein russisches Volk."
 RUS_god_save_tsar_idea:0 "Gott schütze den Zaren"
 RUS_god_save_tsar_idea_desc:0 "Die Menschen von [SOV.getnamedef] müssen ihre volle Unterstützung hinter den Zaren stellen. Gott will es!"
 RUS_constructor_of_democracies_idea:0 "Orchestrator der Demokratien"
 RUS_constructor_of_democracies_idea_desc:0 "Wir werden unter unserer Führung und unserem Einfluss neue demokratische Staaten errichten."
 RUS_greater_russian_dream_idea:0 "Größerer russischer Traum"
 RUS_greater_russian_dream_idea_desc:0 "Wir müssen unser Land groß und großartig machen, noch besser als in der guten alten Zeit."
 RUS_alaska_payment_paying:0 "Für Alaska bezahlen"
 RUS_alaska_payment_paying_desc:0 "Jetzt haben wir Alaska zurück, aber zu einem Preis."
 RUS_alaska_payment_recieving:0 "Erhalt einer Zahlung für Alaska"
 RUS_alaska_payment_recieving_desc:0 "Wir haben Alaska verkauft und werden jetzt dafür bezahlt."
 RUS_increase_military_budget_spending:0 "Erhöhte Militärausgaben"
 RUS_increase_military_budget_spending_desc:0 "Angesichts des drohenden Krieges haben wir unser Budget auf das Militär umgeleitet."
 RUS_return_of_capitalism_idea:0 "Russischer Kapitalismus"
 RUS_return_of_capitalism_idea_desc:0 "Der Kommunismus hat unser großartiges Land zerstört! Nur der Kapitalismus kann Russland wieder großartig machen!"
 RUS_social_democracy_idea:0 "Russische Sozialdemokratie"
 RUS_social_democracy_idea_desc:0 "Kapitalismus und Kommunismus werden unserem Land Schaden zufügen. Aber wenn wir Kompromisse eingehen, können wir Großes erreichen."
 RUS_better_working_idea:0 "Erhöhte Arbeitsbedingungen"
 RUS_better_working_idea_desc:0 "Verbesserte Arbeitsbedingungen können dazu beitragen, die Produktivität unserer Arbeitnehmer zu steigern."
 RUS_free_markets_idea:0 "Freie Märkte"
 RUS_free_markets_idea_desc:0 "„Je freier die Märkte, desto freier die Menschen.“"
 RUS_urban_idea:0 "Urbanisierungsbemühungen"
 RUS_urban_idea_desc:0 "Wir haben große Anstrengungen unternommen, um die Menschen in die Städte zu bringen und sie zusammenzubringen."
