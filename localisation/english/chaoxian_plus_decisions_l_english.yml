  KOR_communism_management_category_decisions: "[KOR.GetAdjective] Faction Management"
  KOR_yanan_pai_gui_txt: "Yan'an Faction: Refers to a faction within the Workers' Party of Korea in its early days of establishment. Most members of the Yan'an Faction were Koreans who participated in the revolution in Yan'an, the base area of the Communist Party of China, in the 1930s. They successively formed the Korean Independence Alliance and the Korean New People's Party. The CPC originally intended to support §YMu Ting§!, a member of the Yan'an Faction, to become the top leader of Korea, but Stalin strongly supported §YKim Il-sung§!, and ultimately the CPSU prevailed."
  KOR_jinricheng_gui_txt: "Guerrilla Faction: Also known as the Anti-Japanese Allied Army Faction or Manchurian Faction, it refers to a faction within the Workers' Party of Korea, the ruling party of the Democratic People's Republic of Korea, after World War II. Most of its members were guerrillas active in Manchukuo and the Soviet Union against Japanese colonial rule over Korea, led by §YPak Kum-chol§! and §YKim Il-sung§!. From the 1950s to the 1960s, §YKim Il-sung§! eliminated the Yan'an Faction, Soviet Faction, and Domestic Faction one by one through the August Faction Incident. Since then, the Guerrilla Faction has become the largest faction in the Workers' Party of Korea."
  KOR_puxianyong_gui_txt: "South Labor Faction: The South Korean Workers' Party, abbreviated as the South Labor Party, was a communist political party in the history of the Korean Peninsula. After the founding of the Democratic People's Republic of Korea, it merged into the Workers' Party of Korea, and the faction composed of former South Labor Party members was called the Domestic Faction or South Labor Faction. After the Korean War armistice, former South Labor Party members became the target of §YKim Il-sung§!'s purge."
  KOR_xujiayi_gui_txt: "Soviet Faction: Refers to a faction within the Workers' Party of Korea, the ruling party of the Democratic People's Republic of Korea, after World War II. Most of its members were Koreans from the Soviet Union, led by §YHo Ka-i§! and §YPak Chang-ok§!. In the 1950s, this faction was purged by §YKim Il-sung§!."
