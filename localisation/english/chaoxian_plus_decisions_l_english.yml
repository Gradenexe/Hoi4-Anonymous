  KOR_gongyexian_decision: "Industrial Recovery Plan"
  KOR_gongyexian_decision_desc: "\nEverything is to be rebuilt. Our country has finally gained independence, but decades of colonial rule have left our industry and technology far behind the world. To defend the hard-won freedom, we must catch up as soon as possible."
  KOR_jingji_xunqiu_guoji_jishu_decision: "Seek Technical Assistance from [FROM.GetNameDef]"
  KOR_jingji_xunqiu_guoji_jishu_decision_flag: "Seeking Technical Assistance"
  KOR_jingji_xunqiu_guoji_jishu_decision_tt: "If the evaluation is §Ygreater than 50§!, there will be a higher chance to directly unlock technologies"
  develop_xianjing_steel_mines: "Develop Musan Iron Mine"
  develop_xianjing_coal_mines: "Develop Pyongan Province Coal Mines"

  KOR_junshi_decision: "Military Modernization Drive"
  KOR_junshi_decision_desc: "After liberation, Korea is filled with various armed groups. We must quickly disband and reorganize these scattered soldiers and factional armed forces, select loyal and reliable personnel from them, and eliminate the black sheep. Only in this way can we build a national defense force that truly belongs to the country and is under unified command."
  KOR_jiesan_minbing: "Expand the Special Service Independent Army"
  KOR_yanxi_kangzhan: "Summarize Anti-Japanese War Experience"
  KOR_jiesan_minbing_tt: "Add §Y2 $militia$§! battalions to the establishment of the §YSpecial Service Independent Army§!."
  KOR_yanxi_kangzhan_tt: "Add §Y2 $militia$§! battalions to the establishment of the §YSpecial Service Independent Army§!.\nIf relevant technologies have been researched, add §Y$recon$§! and §Y$artillery$§!."
  KOR_mining_the_sea: "Naval Mining"
  KOR_mining_the_sea_desc: "We should lay mines at sea to ensure that hostile traffic cannot pass through, making us safer from maritime invasion."
  KOR_mining_the_sea_cost_pp_xp_cp: "£pol_power §Y30§!£navy_experience §Y30§!£command_power §Y15§!"
  KOR_mining_the_sea_cost_pp_xp_cp_blocked: "£pol_power §R30§!£navy_experience §R30§!£command_power §R15§!"
