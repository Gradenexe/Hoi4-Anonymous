  KOR_chaoxian_jiefang: "Korean War of Independence"
  KOR_chaoxian_jiefang_desc: "Twenty-six years of colonial rule, like a hard and cold crust, have suppressed everything on this land. The police and gendarmes of the Governor-General's Office thought they had extinguished all sparks of resistance, but little did they know that the real flames had long gone underground. We will gather these scattered sparks into an unstoppable flame surging underground. It will gather strength, burn down the oppression of the old era, and usher in a new world belonging to the people."
