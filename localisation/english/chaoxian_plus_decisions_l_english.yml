  JKO_huangminhua_yundong_decisions: "Korean Peninsula Development Plan"
  JKO_huangminhua_yundong_decisions_desc: "As early as 1910, Korea signed the Japan-Korea Annexation Treaty with our country, and the Korean Peninsula was formally incorporated into the Empire of Japan, making Korea our colony. Korea permanently ceded all its sovereignty to the Empire. The Empire established a Governor-General in Korea, who was directly subordinate to the Emperor of Japan and responsible for exercising legislative, judicial and administrative powers in Korea. Since then, large-scale infrastructure construction has been carried out on the Korean Peninsula, the population has grown, the literacy rate has continued to rise, and the hierarchical system of Korean society has been abolished.\n\nMost of the peninsula's mineral resources are distributed in the north and scarce in the south. We will continue the economic construction of the Korean Peninsula with the pattern of agriculture in the south and industry in the north. Develop industry in the north; the south has a more maritime climate, making it a naturally excellent harbor for developing agriculture and the navy."
  JKO_huangmin_yundong_kaishi: "Launch the Kominka Movement"
  JKO_huangminhua_yundong_decisions_desc: "The Kominka Movement aimed to strengthen the wartime system through spiritual mobilization and cultural integration, shape 'Imperial Citizens' who were loyal to the Emperor, willing to sacrifice their lives for the war, and fully identified with and obeyed the rule of the government of the Empire of Japan and the imperial system within the entire Empire, and assimilate ethnic groups with different cultures into complete Japanese people to serve its total war goals."
  JKO_import_imperial_way_buddhism_decision: "Introduce Imperial Way Buddhism"
  JKO_one_people_united_under_shinto_decision: "A Unified Nation Under Shintoism"
  JKO_state_shinto_in_education_decision: "State Shinto Education"
  JKO_Amaterasu_spiritual_realm_decision: "The Divine Manifestation of Amaterasu Omikami"
  JKO_zhiyi_linshizhengfu_decisions: "Discredit [KOR.GetLeader]"
  JKO_zhiyi_linshizhengfu_decisions_desc: "We will make the people of the peninsula see how [KOR.GetLeader] fled like a coward and now lives in idle debauchery in a foreign land. With this, we may incite some to fight for us and utterly ruin the reputation of the former ruler."

  KOR_duli_chaoxian_one_decisions: "The Fluttering Taegeukgi"
  KOR_duli_chaoxian_one_decisions_desc: "Twenty-six years of colonial rule, like a hard and cold crust, have suppressed everything on this land. The police and gendarmes of the Governor-General's Office thought they had extinguished all sparks of resistance, but little did they know that the real flames had long gone underground. We will gather these scattered sparks into an unstoppable flame surging underground. It will gather strength, burn down the oppression of the old era, and usher in a new world belonging to the people."
  JKO_chaoxian_de_gandi_mission: "Public Fundraising Campaign"
  JKO_chaoxian_de_gandi_mission_tt: "Funds raised through donation: £pol_power §Y[?KOR.JKO_mujuan_zhongchou_pp]§!"

  KOR_jiesuan_decision_cost_pp: "Total cost after independence: £pol_power §Y[?KOR.KOR_jiesuan_jine_pp]§! "
  KOR_jiesuan_decision_cost_pp_blocked: "Total cost after independence: £pol_power §Y[?KOR.KOR_jiesuan_jine_pp]§! "
  KOR_jiesuan_decision_cost_pp_tooltip: "Total cost after independence: £pol_power §Y[?KOR.KOR_jiesuan_jine_pp]§! "
  JKO_decision_cost_pp_tt: "The spent £pol_power will be settled in §Y[KOR.GetNameDef]§! after independence.\n\nSettled cost required:§Y[?KOR.KOR_jiesuan_jine_pp]§! "

  JKO_zai_beifang_jianli_dabenying: "Establish Resistance Camps in the North"
  JKO_zai_beifang_jianli_dabenying_desc: "We will choose North Korea as our resistance base against Japanese colonialists"
  JKO_zai_beifang_jianli_dabenying_tt: "§RThis decision is mutually exclusive with $JKO_zai_nanfang_jianli_dabenying$§!"
  JKO_zai_nanfang_jianli_dabenying: "Establish Resistance Camps in the South"
  JKO_zai_nanfang_jianli_dabenying_desc: "We will choose South Korea as our resistance base against Japanese colonialists"
  JKO_zai_nanfang_jianli_dabenying_tt: "§RThis decision is mutually exclusive with $JKO_zai_beifang_jianli_dabenying$§!"
  JKO_yinshua_dixia_kanwu: "Print Underground Publications"
  JKO_yinshua_dixia_kanwu_tt: "Sometimes ink is more powerful than bullets. We will set up secret printing points, use words as swords to stab the enemy, expose the lies of the Governor-General's Office, awaken the sleeping people, and let the idea of independence spread in the dark."
  JKO_xijicangku_bubing: "Attack Infantry Weapons Warehouse"
  JKO_xijicangku_bubing_tt: "At the start of the War of Independence, we will gain §G500§!§Y Infantry Equipment§!, while the enemy will receive a minor penalty for 180 days"
  JKO_xijicangku_paobing: "Attack Artillery Warehouse"
  JKO_xijicangku_paobing_tt: "At the start of the War of Independence, we will gain §G250§!§Y Artillery Equipment§!, while the enemy will receive a minor penalty for 180 days"
  JKO_xijicangku_kache: "Attack Truck Warehouse"
  JKO_xijicangku_kache_tt: "At the start of the War of Independence, we will gain §G250§!§Y Trucks§!, while the enemy will receive a minor penalty for 180 days"
  JKO_xunlian_guangfujun: "Train the Liberation Army"
  JKO_xunlian_guangfujun_tt: "After the outbreak of the War of Independence, gain §Y3§! §YKorean Liberation Army§! units composed of infantry."
  JKO_zhiyuan_guangfujun: "Support the Korean Liberation Army"
  JKO_zhiyuan_guangfujun_tt: "§YLiberation Army§! experience will become §YWell-Trained§!, add §G2 artillery battalions§!, 1 §Yengineer company§!, 1 §Yrecon company§! and 1 §Yartillery support companies§!."
  JKO_goumai_waiguo_feiji: "Purchase [FROM.GetNameDef] Aircraft"
  JKO_goumai_waiguo_feiji_tt: "After the outbreak of the War of Independence, gain §Y30§! Fighters and §Y20§! Bombers.\n\nAfter the war begins, we will build in the capital §YLevel 1 §!$air_base$"
  JKO_qingqiu_daguo_xiezhu: "Request [FROM.GetNameDef] to Support Our Independence"
  JKO_qingqiu_daguo_xiezhu_desc: "The mission of the envoys is to bypass the numerous obstacles of the Japanese delegation and present our voice directly to the League Council. However, the world powers are busy dealing with the increasingly tense situation in Europe. Will they choose to listen to the cry of an oppressed nation in the Far East, or turn a blind eye? Our destiny hangs in the balance."
  JKO_qingqiu_daguo_xiezhu_tt: "Base probability of success/failure: §Y10/10§!\n\nIf the evaluation is §Ygreater than 50§!, the success/failure probability is §Y50/10§!\nIf the evaluation is §Ylower than 50§!, the success/failure probability is §Y10/20§!."
