 IRE_Northern_Ireland_category:0 "The Northern Ireland Issue"
 IRE_Northern_Ireland_category_desc:0 "The six counties of Northern Ireland are dominated by a protestant and unionist population, in direct contrast to the catholic and republican-leaning populace of the south. It has remained a constant source of friction between Ireland and Britain since its partition from the south in 1921. \n\nCounties Swayed: [?Northern_Ireland_Counties_swung]/6. \nIf we send the request now, [GetNIRDiplomaticOutcome]\n\nIf they end up refusing, we will gain a §YWargoal§! on §Y[ENG.GetNameWithFlag]§!"
