 IRE_snakes_and_sins:0 "Snakes and Sins"
 IRE_snakes_and_sins_desc:0 "Foreign ideologies, moral decay, and spiritual corruption have weakened the nation. Before Ireland can be renewed, these influences must be driven out—quietly, firmly, and without compromise."
 IRE_warriors_of_the_cross_spirit:0 "Warriors of the Cross"
 IRE_warriors_of_the_cross_spirit_desc:0 "A disciplined brotherhood, forged in prayer and drill. Their resolve is steadier than any slogan, and their cohesion holds when lesser men break."

 IRE_faithful_shall_stand_spirit:0 "The Faithful Shall Stand"
 IRE_faithful_shall_stand_spirit_desc:0 "The Order teaches endurance above all—hold the line, fortify the ground, and deny the enemy a quick victory."

 IRE_isle_sanctified_spirit:0 "The Isle Sanctified"
 IRE_isle_sanctified_spirit_desc:0 "Ireland is not merely territory—it is a charge. To threaten it is to invite resistance, condemnation, and a war without easy justification."

 IRE_sword_and_crozier_spirit:0 "Sword and Crozier"
 IRE_sword_and_crozier_spirit_desc:0 "The state’s authority and the Order’s mission march together. Discipline replaces division, and unity is maintained against all subversion."
 IRE_Warriors_of_the_Cross:0 "Warriors of the Cross"
 IRE_Warriors_of_the_Cross_desc:0 "The Order must not be symbolic alone. Its members will be trained as disciplined soldiers, bound by oath and belief. Their cohesion and resolve will allow them to hold firm where others falter."

 IRE_The_Faithful_Shall_Stand:0 "The Faithful Shall Stand"
 IRE_The_Faithful_Shall_Stand_desc:0 "The Holy Order does not seek reckless conquest. Its purpose is endurance—holding Ireland’s soil against all who would profane it. Defense, preparation, and resolve will define its doctrine."

 IRE_Anointed_Officers:0 "Anointed Officers"
 IRE_Anointed_Officers_desc:0 "Leadership within the Order must be earned through discipline and devotion. Officers will be chosen not for politics or ambition, but for their ability to command loyalty and uphold the Order’s principles."

 IRE_The_Isle_Sanctified:0 "The Isle Sanctified"
 IRE_The_Isle_Sanctified_desc:0 "Ireland is not merely territory—it is a charge entrusted to us. By fortifying its coasts and approaches, we signal that any violation of the island will meet prepared resistance and moral condemnation alike."

 IRE_Sword_and_Crozier:0 "Sword and Crozier"
 IRE_Sword_and_Crozier_desc:0 "The authority of the state and the mission of the Order must move in unity. Where law and faith stand together, disorder finds no shelter, and the nation’s purpose becomes unassailable."

 IRE_Warriors_of_the_Cross:0 "Warriors of the Cross"
 IRE_Warriors_of_the_Cross_desc:0 "The Order cannot be a parade-ground symbol—it must become a fighting institution. The lessons of Spain, Poland, and France are plain: doctrine and discipline decide wars faster than passion. We will drill a corps that can endure artillery, hold under air attack, and still counter-punch when the moment comes."

 IRE_The_Faithful_Shall_Stand:0 "The Faithful Shall Stand"
  IRE_The_Faithful_Shall_Stand_desc:0 "Ireland has survived famine, rebellion, and civil war; it will survive this new age of bombers and submarines as well. The Order binds village to barracks, parish to port, insisting that the island’s defense is a shared duty. Whatever flags rise over Europe, the faithful will not yield at home."

  IRE_Anointed_Officers:0 "Anointed Officers"
  IRE_Anointed_Officers_desc:0 "Modern war is won by competent leadership as much as by steel. The Order will cultivate officers who can train raw recruits into reliable infantry, coordinate fire and movement, and hold discipline when the line buckles. They are not merely promoted—they are entrusted."

  IRE_The_Isle_Sanctified:0 "The Isle Sanctified"
  IRE_The_Isle_Sanctified_desc:0 "If Ireland is to remain sovereign, then her coasts must be treated as sacred ground—guarded, prepared, and costly to violate. Across the Atlantic, convoys are hunted; across the Channel, cities burn. We will fortify the approaches and declare, in concrete and resolve, that the island is not a prize to be taken lightly."

  IRE_Sword_and_Crozier:0 "Sword and Crozier"
  IRE_Sword_and_Crozier_desc:0 "The state and the Order must not compete—they must cooperate. A divided Ireland invites foreign pressure, whether from diplomats, agents, or guns. By joining authority with purpose, we gain the power to mobilise the nation without tearing it apart, and the legitimacy to act decisively when the crisis deepens."

  IRE_Stewardship_of_the_Land:0 "Stewardship of the Land"
  IRE_Stewardship_of_the_Land_desc:0 "Wartime scarcity punishes waste. The Order’s administrators will treat roads, rail, and harvest as strategic assets—because in a blockade, food and transport matter as much as rifles. Better infrastructure means faster mobilisation, steadier supply, and fewer opportunities for panic."

  IRE_Guilds_Under_the_Crozier:0 "Guilds Under the Crozier"
  IRE_Guilds_Under_the_Crozier_desc:0 "Ireland’s workshops and yards cannot be left to drift between profit and politics. Under supervised guilds, craftsmen are organised, standards enforced, and production directed toward what the nation actually needs. It is not nationalisation—it is discipline applied to industry."

  IRE_The_Common_Purse:0 "The Common Purse"
  IRE_The_Common_Purse_desc:0 "A state at war—whether openly or in preparation—cannot afford financial chaos. By concentrating funds and tightening oversight, we ensure that scarce materials become factories and fortifications rather than vanished contracts and private hoards. In a small nation, every pound must count."


  IRE_Bless_the_Mines:0 "Bless the Mines"
  IRE_Bless_the_Mines_desc:0 "Steel and coal are the true relics of modern war. Without them there are no guns, no rails, no repairs—only dependence. The Order will expand extraction and bring discipline to the pits and works, so Ireland’s war economy is powered from Irish ground."

  IRE_Cork_Foundries:0 "Cork Foundries"
  IRE_Cork_Foundries_desc:0 "A coastal state must build what it cannot reliably import. Cork’s industry can be expanded into a dependable center for arms work—repairing, casting, and producing to keep divisions equipped even when sea lanes are threatened. The Atlantic decides who starves; we will not be among them."

  IRE_Steel_for_the_Faithful:0 "Steel for the Faithful"
  IRE_Steel_for_the_Faithful_desc:0 "Quantity matters—but reliability keeps armies alive. The Order prioritises standard patterns, proper inspection, and the steady flow of serviceable equipment to the front. A rifle that does not jam and a gun that does not crack are worth more than promises of miracles."

  IRE_The_Anvil_of_Eire:0 "The Anvil of Éire"
  IRE_The_Anvil_of_Eire_desc:0 "Ireland will not outproduce empires, but it can outlast coercion. By expanding building capacity where it matters most, we turn limited industry into a sustained war effort. The anvil does not chase the hammer—it survives it, and shapes what comes after."


  IRE_Rule_of_the_Shield:0 "Rule of the Shield"
  IRE_Rule_of_the_Shield_desc:0 "The Order’s first duty is defense: to buy time, deny easy landings, and make every mile costly. Engineers, fieldworks, and practiced entrenchment will turn Ireland’s terrain into a weapon. If an enemy comes ashore, they will meet not chaos—but prepared positions."

  IRE_Oaths_Before_Arms:0 "Oaths Before Arms"
  IRE_Oaths_Before_Arms_desc:0 "Weapons are useless without trust—trust that supplies will arrive, that units will hold, that the state will not abandon them. The Order will equip its ranks properly and bind them to service by oath. In the storm of modern war, morale is built long before battle."

  IRE_The_Wall_of_Saints:0 "The Wall of Saints"
  IRE_The_Wall_of_Saints_desc:0 "From Donegal to Meath, we raise a defensive spine behind the coast—positions to rally to if the shoreline is tested. The war has shown how quickly nations collapse when their rear is soft. Ireland will have depth, shelters, and lines that do not vanish with the first shock."

  IRE_The_Long_Vigil:0 "The Long Vigil"
  IRE_The_Long_Vigil_desc:0 "Wars are not won in a single week of glory. They are won in months of restraint: rationing, repair, training, and endurance. The Order prepares Ireland for the long watch—when convoys sink, when diplomacy strains, when a nation’s will is tested as harshly as its weapons."


  IRE_The_Iron_Saints:0 "The Iron Saints"
  IRE_The_Iron_Saints_desc:0 "The early campaigns of the war have proven a brutal truth: mobility and armour can decide an entire front in days. Ireland cannot field vast armoured armies, but it can raise an elite corps—few in number, sharp in purpose—capable of breaking raids, sealing breaches, and striking back when the enemy overreaches."

  IRE_Consecrated_Steelworks:0 "Consecrated Steelworks"
  IRE_Consecrated_Steelworks_desc:0 "Armour is not only doctrine—it is manufacturing, machining, and maintenance. The Order will expand the workshops needed to build and service armoured vehicles, ensuring that our tanks are not museum pieces but working instruments of war."

  IRE_Blessed_Armour_Doctrine:0 "Blessed Armour Doctrine"
  IRE_Blessed_Armour_Doctrine_desc:0 "A tank without doctrine is an expensive coffin. We will study the war as it unfolds—breakthrough tactics, combined arms coordination, and the harsh mathematics of fuel and repair. The Order will develop a doctrine suited to Ireland: decisive when used, conservative when preserved."

  IRE_Blessed_Armour_Crews:0 "Blessed Armour Crews"
  IRE_Blessed_Armour_Crews_desc:0 "Machines are only as capable as the men inside them. The Order will train crews to fight blind in smoke, to repair under fire, and to keep formation when panic would scatter lesser units. If Ireland fields armour, it will be armour that acts with purpose."

  IRE_The_Iron_Rule:0 "The Iron Rule"
  IRE_The_Iron_Rule_desc:0 "Armour demands aggressive leadership—officers who can exploit a gap the moment it opens and withdraw before a trap closes. The Order will identify capable commanders and harden them into specialists in armoured warfare. A small armoured corps must be led well, or it is wasted."

  IRE_The_Steel_Crusade:0 "The Steel Crusade"
  IRE_The_Steel_Crusade_desc:0 "This is the Order’s answer to modern war: not frenzy, but decisive force. With strengthened industry and trained commanders, Ireland can field an armoured spearhead to end threats rather than merely absorb them. If the island must fight, it will fight on its own terms—swift, disciplined, and unrelenting."
  IRE_faithful_shall_stand_spirit:0 "The Faithful Shall Stand"
  IRE_faithful_shall_stand_spirit_desc:0 "The Order has bound local communities, clergy, and defense forces into a shared commitment to endurance. Civilian morale and internal stability are treated as strategic assets, ensuring that fear and exhaustion do not fracture the nation under pressure."

  IRE_isle_sanctified_spirit:0 "The Isle Sanctified"
  IRE_isle_sanctified_spirit_desc:0 "Ireland’s coastline and infrastructure are regarded as inviolable ground. Through fortification, vigilance, and restraint, the state discourages provocation while making any violation of sovereignty costly and uncertain."

  IRE_sword_and_crozier_spirit:0 "Sword and Crozier"
  IRE_sword_and_crozier_spirit_desc:0 "The authority of the state and the discipline of the Order now reinforce one another. Political legitimacy is maintained while emergency powers and national mobilisation are exercised with clarity and unity of command."



  IRE_guilds_under_the_crozier_spirit:0 "Guilds Under the Crozier"
  IRE_guilds_under_the_crozier_spirit_desc:0 "Key industries are organised into supervised guilds, balancing productivity with social order. Labour disputes are contained, standards enforced, and output aligned with national priorities rather than private speculation."

  IRE_bless_the_mines_spirit:0 "Bless the Mines"
  IRE_bless_the_mines_spirit_desc:0 "Resource extraction has been brought under disciplined oversight. By improving safety, scheduling, and distribution, Ireland ensures that coal and steel reach factories and fortifications without interruption."

  IRE_steel_for_the_faithful_spirit:0 "Steel for the Faithful"
  IRE_steel_for_the_faithful_spirit_desc:0 "Standardisation and inspection take precedence over haste. Equipment issued under this program is expected to function reliably in prolonged service, reducing waste and preserving combat effectiveness over time."

  IRE_anvil_of_eire_spirit:0 "The Anvil of Éire"
  IRE_anvil_of_eire_spirit_desc:0 "Ireland’s limited industry has been reshaped for durability rather than expansion alone. Production capacity is concentrated where it can be sustained through blockade, disruption, and prolonged mobilisation."


  IRE_long_vigil_spirit:0 "The Long Vigil"
  IRE_long_vigil_spirit_desc:0 "The Order plans not for decisive weeks but for grinding years. Supply discipline, force preservation, and defensive readiness are emphasised to ensure Ireland remains capable even as external pressures accumulate."



  IRE_tank_crew_training_spirit:0 "Blessed Armour Crews"
  IRE_tank_crew_training_spirit_desc:0 "Armoured crews are trained to preserve their machines as carefully as their lives. Emphasis is placed on maintenance, recovery, and coordination, ensuring that limited armoured assets remain operational rather than expendable."