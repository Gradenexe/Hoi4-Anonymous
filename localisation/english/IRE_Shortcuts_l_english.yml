  IRE_Assess_the_future:0 "Assess the Future"
 IRE_Assess_the_future_desc:0 "This step will shape our capacity to endure what comes next. This decision will reshape how Ireland governs, trades, and prepares for conflict. The benefits will be felt across industry, government, and the armed forces."
 IRE_Fianna_fail:0 "Continue with Fianna Fáil"
 IRE_Fianna_fail_desc:0 "Ireland’s future will be secured through law, legitimacy, and careful statecraft. The measure is practical, but its implications will be felt across the island. This keeps Ireland free to decide its own destiny when the crisis peaks."
 IRE_The_Emergency_Powers_Act:0 "The Emergency Powers Act"
 IRE_The_Emergency_Powers_Act_desc:0 "In the Dáil and beyond, we must set a steady course. A clear legal framework for wartime governance will prevent panic and paralysis. Done well, this will strengthen stability at home and credibility abroad."
 IRE_The_Celtic_Protection_Bloc:0 "The Celtic Protection Bloc"
 IRE_The_Celtic_Protection_Bloc_desc:0 "We will bind friends to us by mutual interest and shared peril. Diplomacy will do what divisions cannot: multiply our security without exhausting our manpower. We will make the case for shared defense and shared interests—on our terms. Allies gained now may decide the outcome of the next war."
 IRE_Support_the_Allies:0 "Support the Allies"
 IRE_Support_the_Allies_desc:0 "A measured hand now will spare us chaos later. Ports are leverage—economic, diplomatic, and naval. We will bargain from a position of necessity and advantage. Done well, this will strengthen stability at home and credibility abroad."
 IRE_Invite_Low_Nations:0 "Invite Low-Country Member States"
 IRE_Invite_Low_Nations_desc:0 "A Celtic shield will be raised—cooperation over submission. We will make the case for shared defense and shared interests—on our terms. With partners beside us, Ireland’s voice carries further than its size."
 IRE_Invite_Iberian_Brothers:0 "Invite Iberian Member States"
 IRE_Invite_Iberian_Brothers_desc:0 "We will bind friends to us by mutual interest and shared peril. Diplomacy will do what divisions cannot: multiply our security without exhausting our manpower. Allies gained now may decide the outcome of the next war."
 IRE_celtic_warfare:0 "Celtic War Cause"
 IRE_celtic_warfare_desc:0 "We will bind friends to us by mutual interest and shared peril. This decision will reshape how Ireland governs, trades, and prepares for conflict. Allies gained now may decide the outcome of the next war."
 IRE_celtic_Arsenal:0 "Empower the Celtic War Machine"
 IRE_celtic_Arsenal_desc:0 "A Celtic shield will be raised—cooperation over submission. The measure is practical, but its implications will be felt across the island. With partners beside us, Ireland’s voice carries further than its size."
 IRE_Revive_Celtic_Knowledge:0 "Revive Celtic Knowledge"
 IRE_Revive_Celtic_Knowledge_desc:0 "Small nations survive by standing together. The measure is practical, but its implications will be felt across the island. With partners beside us, Ireland’s voice carries further than its size."
 IRE_plains_warfare:0 "Anglo-Irish Warfare Upgrades"
 IRE_plains_warfare_desc:0 "This step will shape our capacity to endure what comes next. This decision will reshape how Ireland governs, trades, and prepares for conflict. Once enacted, we will be better placed for any path we take."
 IRE_multi_purpose_tanks:0 "Multi-Purpose Tanks"
 IRE_multi_purpose_tanks_desc:0 "This step will shape our capacity to endure what comes next. Modern war rewards speed and shock. We will adapt doctrine and procurement accordingly. Armour will give Ireland the ability to decide battles, not merely endure them. The benefits will be felt across industry, government, and the armed forces."
 IRE_The_Irish_Rovers:0 "The Irish Rovers"
 IRE_The_Irish_Rovers_desc:0 "This step will shape our capacity to endure what comes next. Modern war rewards speed and shock. We will adapt doctrine and procurement accordingly. Once enacted, we will be better placed for any path we take."
 IRE_Strengthen_the_welfare_state:0 "Strengthen the Welfare State"
 IRE_Strengthen_the_welfare_state_desc:0 "Ireland’s future will be secured through law, legitimacy, and careful statecraft. A healthier, better-housed population is a stronger state—economically and militarily. It is a modest reform with long consequences—exactly what the times require."
 IRE_Reform_the_punt:0 "Reform the Punt"
 IRE_Reform_the_punt_desc:0 "Practical reforms today will decide our options tomorrow. The measure is practical, but its implications will be felt across the island. It is not glamorous work, but it wins wars and preserves states."
 IRE_Housing_Development:0 "Housing Development"
 IRE_Housing_Development_desc:0 "Practical reforms today will decide our options tomorrow. Housing is more than comfort: it is stability, public health, and workforce capacity. The benefits will be felt across industry, government, and the armed forces."
 IRE_Trinity_College_Dublin:0 "Expand Trinity College"
 IRE_Trinity_College_Dublin_desc:0 "A measured hand now will spare us chaos later. From classrooms to workshops, we will close the gap between theory and production. This keeps Ireland free to decide its own destiny when the crisis peaks."
 IRE_Directorate_Military_Intelligence:0 "Form the Directorate of Intelligence"
 IRE_Directorate_Military_Intelligence_desc:0 "Practical reforms today will decide our options tomorrow. A professional intelligence service will keep Ireland ahead of plots at home and pressures abroad. Once enacted, we will be better placed for any path we take."
 IRE_Comission_the_Inniscarra_Dam:0 "Commision the Inniscarra Dam"
 IRE_Comission_the_Inniscarra_Dam_desc:0 "Ireland cannot drift; we must choose and act. What we do here will determine whether we are sheltered by events—or swallowed by them. It is not glamorous work, but it wins wars and preserves states."
 IRE_The_Constitution_Act:0 "The Constitution Act"
 IRE_The_Constitution_Act_desc:0 "A measured hand now will spare us chaos later. A modern constitution will clarify sovereignty, rights, and the limits of power. The foundations of the state must be written plainly, so no faction can twist them. It is a modest reform with long consequences—exactly what the times require."
 IRE_Expression_of_Irish_Unity:0 "The Irish Family Values"
 IRE_Expression_of_Irish_Unity_desc:0 "Ireland cannot drift; we must choose and act. We will align policy, resources, and institutions behind this objective. The benefits will be felt across industry, government, and the armed forces."
 IRE_Treaty_Port_Proposition:0 "Draft the Treaty Port Proposal"
 IRE_Treaty_Port_Proposition_desc:0 "A measured hand now will spare us chaos later. Control of access to the sea is control of Ireland’s strategic value; we will make that value count. It is a modest reform with long consequences—exactly what the times require."
 IRE_The_Irish_Language_Act:0 "The Irish Language Act"
