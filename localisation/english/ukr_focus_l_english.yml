 # Focus names
 UKR_finnish_invasion:0 "Bulgarian Campaign"
 UKR_path_to_the_north_sea:0 "Path to the Balkans"
 UKR_end_swedish_neutrality:0 "End Yugoslav Neutrality"
 UKR_free_the_workers_of_poland:0 "Free the Workers of Poland"
 UKR_free_the_workers_of_chechoslovakia:0 "Free the Workers of Czechoslovakia"
 UKR_end_italy:0 "The End of Italy"

 # Events
 UKR_events.7.t:0 "Ukraine Prepares for the Bulgarian Campaign"
 UKR_events.7.d:0 "Our comrades in Ukraine have finalized preparations to spread the revolution to the Balkans. Bulgaria, still under the rule of the bourgeoisie, is our next target. It is time to liberate the Bulgarian workers and bring them the light of socialism!"
 UKR_events.7.a:0 "Forward to Sofia!"

 UKR_events.8.t:0 "Path to the Balkans"
 UKR_events.8.d:0 "The Ukrainian government has drawn up a plan to secure control over Eastern Europe. Romania stands in our way. We must assist our comrades in removing the Romanian government and securing the region for the revolution."
 UKR_events.8.a:0 "Next stop: Bucharest."

 UKR_events.9.t:0 "The End of Yugoslav Neutrality"
 UKR_events.9.d:0 "Yugoslavia's so-called 'neutrality' is nothing but a smokescreen for their collaboration with imperialists. Ukraine urges us to put an end to this hypocrisy. The Yugoslav workers await our liberation!"
 UKR_events.9.a:0 "The revolution knows no borders."

 UKR_events.10.t:0 "Liberation of the Polish Workers"
 UKR_events.10.d:0 "The reactionary government of Poland continues to oppress its people. Ukraine has initiated a plan to topple the Polish authorities and establish a dictatorship of the proletariat. We must support this move and bring the revolution to Warsaw."
 UKR_events.10.a:0 "For our freedom and yours!"

 UKR_events.11.t:0 "The End of Italy"
 UKR_events.11.d:0 "The fascist regime in Italy poses a threat to the entire free world. Our Ukrainian comrades propose to deal a final blow to this stronghold of reaction. The time has come to liberate the Italian people!"
 UKR_events.11.a:0 "Death to fascism!"

 UKR_events.12.t:0 "Liberation of the Czechoslovak Workers"
 UKR_events.12.d:0 "The bourgeois government of Czechoslovakia must fall. The Ukrainian initiative to expand the revolution's influence into Central Europe deserves our full support. To Prague!"
 UKR_events.12.a:0 "The workers of Czechoslovakia shall be free."

 UKR_post_resistance_development:0 "Post-Resistance Development"
 UKR_post_resistance_development_desc:0 "With the resistance finally crushed, we can focus our efforts on the industrial development of our newly secured regions."
 UKR_donbas_heavy_industry:0 "Donbas Heavy Industry"
 UKR_donbas_heavy_industry_desc:0 "The Donbas region is rich with resources and potential. By investing heavily in its industrial capacity, we can secure a strong backbone for our nation's economy."
 UKR_soviet_collectivization:0 "Soviet Collectivization"
 UKR_soviet_collectivization_desc:0 "To maximize our agricultural output and feed the growing industrial workforce, we must transition our farms to the Soviet model of collectivization."
 UKR_donbas_coal:0 "Donbas Coal"
 UKR_donbas_coal_desc:0 "Coal is the lifeblood of industry. By expanding our mining operations in the Donbas, we will fuel our factories and power our military machine."
 UKR_western_wall:0 "Western Wall"
 UKR_western_wall_desc:0 "We must prepare for the inevitable clash with the West. A formidable line of fortifications along our western border will ensure the safety of our republic."
 UKR_united_with_westukrblr:0 "Unite with our people in Eastern Poland"
 UKR_united_with_westukrblr_desc:0 "Our brothers in the west have suffered long enough under foreign occupation. It is our duty to bring them into the fold and unite all our historical lands under one socialist banner."
 UKR_events.1.t:0 "Ukraine Requests Our Support"
 UKR_events.1.d:0 "The socialist government of Ukraine has reached out to us, requesting formal support and military alliance. As brothers in the struggle against capitalism, they seek entry into our faction and our guarantee of their independence."
 UKR_events.1.a:0 "We welcome our Ukrainian comrades."
 UKR_events.1.b:0 "We cannot afford to support them right now."

# Ukraine Exile Focuses and Ideas appended
 # Ukraine Exile Focuses
 UKR_government_in_exile:0 "Prepare for the Inevitable"
 UKR_government_in_exile_desc:0 "Our homeland is on the verge of falling, but our spirit remains unbroken. We shall prepare our government to coordinate the liberation struggle from abroad."
 UKR_foreign_air_support:0 "Foreign Air Support"
 UKR_foreign_air_support_desc:0 "Our hosts will assist in training our pilots and supplying aircraft for our exile air force."
 UKR_aces_in_exile:0 "Aces in Exile"
 UKR_aces_in_exile_desc:0 "Our pilots will fight alongside our allies, gaining invaluable combat experience to lead our future air force."
 UKR_air_in_exile:0 "Air Force in Exile"
 UKR_air_in_exile_desc:0 "Establishing our own squadron commands under allied operational control, ensuring our flight crews remain organized."
 UKR_women_in_air:0 "Women in the Air Force"
 UKR_women_in_air_desc:0 "Every citizen must contribute. We will open flight training to Ukrainian women, maximizing our pilot pool."
 UKR_foreign_army_support:0 "Foreign Army Support"
 UKR_foreign_army_support_desc:0 "We shall assemble our scattered soldiers and volunteers to form a combat-ready force on foreign soil."
 UKR_organize_exiled_army:0 "Organize Exiled Army"
 UKR_organize_exiled_army_desc:0 "Structuring our volunteer regiments into integrated divisions with proper command structures."
 UKR_new_army:0 "The New Army"
 UKR_new_army_desc:0 "Equipping our soldiers with modern weapons and adopting advanced tactical doctrines to prepare for the return."
 UKR_foreign_fleet_support:0 "Foreign Fleet Support"
 UKR_foreign_fleet_support_desc:0 "Negotiating with allied navies to provide docking facilities and training for our sailors."
 UKR_buy_foreign_ships:0 "Purchase Foreign Vessels"
 UKR_buy_foreign_ships_desc:0 "Acquiring decommissioned or leased naval assets from our allies to form a core liberation fleet."
 UKR_army_cooperation:0 "Inter-service Cooperation"
 UKR_army_cooperation_desc:0 "Integrating our army, navy, and air forces into a unified command structure to coordinate operations."
 UKR_exile_politics:0 "Exile Politics"
 UKR_exile_politics_desc:0 "Consolidating our diplomatic representation abroad to ensure our voice is heard in allied war councils, establishing a steady source of political legitimacy."
 UKR_exploit_our_connections:0 "Exploit Our Connections"
 UKR_exploit_our_connections_desc:0 "Leveraging our diplomatic contacts to secure international trade agreements and materials for our exiled government."
 UKR_help_from_our_allies:0 "Help from Our Allies"
 UKR_help_from_our_allies_desc:0 "Securing concrete commitments of lend-lease and sharing technical and research knowledge with our allied hosts."
 UKR_international_recognition:0 "International Recognition"
 UKR_international_recognition_desc:0 "Ensuring that the international community recognizes our exiled administration as the sole legitimate government of Ukraine, cementing our war support."
 UKR_exile_industries:0 "Exile Industries"
 UKR_exile_industries_desc:0 "Setting up workshops and coordination offices in host nations to manage production for our military."
 UKR_resistance_industries:0 "Underground Industry"
 UKR_resistance_industries_desc:0 "Supporting secret workshops and supply networks within our occupied core territories."
 UKR_combined_civilian_agency_resistance:0 "Combined Resistance Coordination"
 UKR_combined_civilian_agency_resistance_desc:0 "Unifying our intelligence operations with domestic partisan networks to maximize sabotage efficiency."
 UKR_evacuated_industries:0 "Evacuated Industries"
 UKR_evacuated_industries_desc:0 "Setting up factories staffed by evacuated Ukrainian workers to manufacture arms and equipment."
 UKR_connections_with_industrialists:0 "Industrialist Connections"
 UKR_connections_with_industrialists_desc:0 "Working with foreign industrialists to secure machinery, resources, and technical expertise."
 UKR_exile_resistance:0 "Coordinate the Underground"
 UKR_exile_resistance_desc:0 "Establishing radio contacts with local resistance cells in our occupied territories."
 UKR_expand_operations:0 "Expand Operations"
 UKR_expand_operations_desc:0 "Expanding our espionage network to gather intelligence on occupier movements and assets."
 UKR_expand_intelligence:0 "Expand Intelligence"
 UKR_expand_intelligence_desc:0 "Upgrading our decryption capabilities to intercept and crack enemy communications."
 UKR_even_stronger_resistance:0 "Mobilize the Underground"
 UKR_even_stronger_resistance_desc:0 "Giving the signal to domestic partisan networks to scale up sabotage of enemy lines."
 UKR_everyone_will_fight:0 "Everyone Will Fight"
 UKR_everyone_will_fight_desc:0 "Mobilizing all refugees, emigrants, and supporters abroad to take up arms or support roles."
 UKR_our_help_in_the_war:0 "Allied Contribution"
 UKR_our_help_in_the_war_desc:0 "Offering our specialized intelligence and volunteer units to direct Allied operations, proving our worth."
 UKR_prepare_our_people_to_return:0 "Prepare the People to Return"
 UKR_prepare_our_people_to_return_desc:0 "Broadcasting propaganda and instructions to prepare the civilian population for the coming liberation."
 UKR_prepare_our_army_to_return:0 "Prepare the Army to Return"
 UKR_prepare_our_army_to_return_desc:0 "Drilling our exiled divisions in specialized offensive and liberation tactics."
 UKR_prepare_our_land_to_return:0 "Prepare the Land to Return"
 UKR_prepare_our_land_to_return_desc:0 "Directing coordinated sabotage of enemy supply lines, rail networks, and airfields in Ukraine."
 UKR_combine_all_our_forces:0 "Combine All Forces"
 UKR_combine_all_our_forces_desc:0 "Merging all our exile assets—army, air force, navy, industry, and underground networks—into a single, unified Liberation Front."
 UKR_to_return_ours:0 "To Reclaim What Is Ours"
 UKR_to_return_ours_desc:0 "Declaring the start of the general campaign to liberate our homeland from the occupier."
 UKR_first_hit:0 "The First Strike"
 UKR_first_hit_desc:0 "Launching the initial offensive to secure our first major regions and establish a bridgehead."
 UKR_second_hit:0 "The Second Strike"
 UKR_second_hit_desc:0 "Pushing deeper into the central regions, breaking the enemy's defensive lines."
 UKR_third_hit:0 "The Third Strike"
 UKR_third_hit_desc:0 "Liberating our key industrial heartlands and freeing millions of our citizens."
 UKR_final_blow:0 "The Final Blow"
 UKR_final_blow_desc:0 "Launching the ultimate, decisive offensive to completely expel the occupier from every inch of our land."

 # Ukraine Exile Ideas
 UKR_aces_in_exile_idea:0 "Ukrainian Aces in Exile"
 UKR_aces_in_exile_idea_desc:0 "Our pilots have served with distinction in Allied air wings, gaining invaluable tactical knowledge."
 UKR_army_cooperation_idea:0 "Inter-Service Cooperation"
 UKR_army_cooperation_idea_desc:0 "Our army, navy, and air forces are fully integrated, coordinating their planning and operational execution."
 UKR_civil_and_military_organization_ukr:0 "Combined Resistance Council"
 UKR_civil_and_military_organization_ukr_desc:0 "A joint intelligence council that coordinates regular military assets with domestic partisan forces."
 UKR_industrialist_connections_ukr:0 "Industrialist Support Group"
 UKR_industrialist_connections_ukr_desc:0 "Our exiled government works closely with foreign manufacturers to secure military supplies."
 UKR_even_stronger_resistance_idea:0 "Mobilized Partisan Network"
 UKR_even_stronger_resistance_idea_desc:0 "Partisan networks across the occupied homeland have scaled up active sabotage and intelligence gathering."
 UKR_everyone_will_fight_idea:0 "Exile Mobilization"
 UKR_everyone_will_fight_idea_desc:0 "We have mobilized every capable refugee and volunteer to support the liberation effort."
 UKR_our_help_in_the_war_idea:0 "Valued Allied Partner"
 UKR_our_help_in_the_war_idea_desc:0 "Our active contributions in intelligence and volunteers have earned us deep respect from our allies."
 UKR_people_return_prep_idea:0 "Liberation Propaganda Networks"
 UKR_people_return_prep_idea_desc:0 "Underground broadcasts and leaflets have prepared the occupied population to assist the returning army."
 UKR_army_return_prep_idea:0 "Liberation Army Training"
 UKR_army_return_prep_idea_desc:0 "Our exiled divisions have been drilled in offensive and spearhead tactics designed specifically for reclaiming our homeland."
 UKR_land_return_prep_idea:0 "Coordinated Supply Sabotage"
 UKR_land_return_prep_idea_desc:0 "Partisans have heavily damaged enemy supply hubs and rail corridors, disrupting their logistics."
 UKR_united_exile_government_idea:0 "Unified Liberation Front"
 UKR_united_exile_government_idea_desc:0 "All our military branches, industrial agreements, and domestic resistance cells have been combined into a single, highly coordinated, and powerful liberation movement."
 UKR_reconquest_spirit:0 "Spirit of Liberation"
 UKR_reconquest_spirit_desc:0 "Our people are unified by a single burning desire: to reclaim our homeland and defeat the occupier."
 UKR_first_hit_idea:0 "First Strike Momentum"
 UKR_first_hit_idea_desc:0 "The momentum of our initial bridgehead offensive boosts our speed and offensive capabilities on core territory."
 UKR_second_hit_idea:0 "Second Strike Momentum"
 UKR_second_hit_idea_desc:0 "Our breakthroughs in the central regions have thrown the enemy into disarray, boosting our breakthrough and recovery speed."
 UKR_third_hit_idea:0 "Third Strike Momentum"
 UKR_third_hit_idea_desc:0 "As we reclaim our industrial heartlands, our defensive planning and organization are heavily bolstered."
 UKR_final_blow_idea:0 "The Ultimate Blow"
 UKR_final_blow_idea_desc:0 "The final campaign to completely expel the occupier grants us massive offensive and defensive combat bonuses."
 UKR_exile_politics_spirit:0 "Ukrainian Government-in-Exile"
 UKR_exile_politics_spirit_desc:0 "Our exiled administration maintains political structure and legitimacy, bolstering our political influence and stability."
 UKR_exploit_connections_spirit:0 "Diplomatic Trade Channels"
 UKR_exploit_connections_spirit_desc:0 "Exploiting diplomatic links helps us secure trade deals and resources from host countries."
 UKR_allied_aid_spirit:0 "Allied Research Exchange"
 UKR_allied_aid_spirit_desc:0 "Our hosts share scientific and military research resources to support our future restoration."
 UKR_intl_recognition_spirit:0 "International Diplomatic Recognition"
 UKR_intl_recognition_spirit_desc:0 "Global recognition of our legitimacy keeps our war effort alive and gives us strong political backing."
 UKR_new_volonteers_to_fight:0 "New Volunteers to Fight"
 UKR_new_volonteers_to_fight_desc:0 "Our cause has inspired many to join our ranks, swelling our forces with fresh volunteers eager to fight for our liberation."
 UKR_mobilize_from_liberated_lands:0 "Mobilize from Liberated Lands"
 UKR_mobilize_from_liberated_lands_desc:0 "As we reclaim territory, we can mobilize the local population to join our forces, further strengthening our ranks and deepening our connection with the people we are liberating."
 # Custom Tooltips
 NZL_transfer_ships_tt:0 "Britain will transfer HMS Achilles, HMS Leander, and two destroyers to the Ukrainian navy."
 lar_decryption_bonus_tt:0 "Unlocks a permanent boost to decryption speed."
 NZL_the_tasman_union:0 "The Tasman Union"
 NZL_the_tasman_union_desc:0 "Australia and New Zealand share a deep bond, forged in the fires of Gallipoli. By formally uniting our governments and administrations under the Tasman Union, we will form a new superpower in the Pacific — the ANZAC Federation."
 NZL_ANZAC_democratic:0 "ANZAC Federation"
 NZL_ANZAC_democratic_DEF:0 "the ANZAC Federation"
 NZL_ANZAC_neutrality:0 "ANZAC Federation"
 NZL_ANZAC_neutrality_DEF:0 "the ANZAC Federation"
 NZL_ANZAC_communism:0 "ANZAC Socialist Republic"
 NZL_ANZAC_communism_DEF:0 "the ANZAC Socialist Republic"
 NZL_ANZAC_fascism:0 "ANZAC Empire"
 NZL_ANZAC_fascism_DEF:0 "the ANZAC Empire"
 UKR_investments: "Investments to Republic"

 # Have to add it cuz game is bugged mess
  SPA_bring_back_the_pearl:0 "Bring back the Pearl"
 SPA_bring_back_the_pearl_desc:0 "Philippines, the Pearl of Spanish Empire, was lost after American-Spanish war 1898. It's time to bring it back" 
GRE_our_lost_capital: "Our Lost Capital"
 GRE_our_lost_capital_desc: "Constantinople, the ancient heart of the Byzantine Empire and the crown jewel of Greek civilization, was lost to the Ottomans in 1453. For centuries, Greeks have dreamed of reclaiming their eternal city. Now, with our nation resurgent and our armies strong, the time has come to restore what is rightfully ours — to raise the Byzantine eagle once more over the Hagia Sophia."
 GRE_north_africa: "Greek North Africa"
    GRE_north_africa_desc: "The Greek presence in North Africa has been a source of pride and prosperity for centuries. By expanding our influence and establishing a stronghold in this region, we can secure vital trade routes and resources, ensuring the continued growth and strength of our nation."
  SPR_connecting_the_communes:0 "Connecting the Communes"
 SPR_connecting_the_communes_desc:0 "By connecting all the different small communes via radio we can keep living our new livestyle but organize ourselves better."
 SPR_provincial_meetings:0 "Provincial Meetings"
 SPR_provincial_meetings_desc:0 "Every month all the biggest communes in a province will get together to discuss their problems. This should reduce infighting and make sure the anarchist dream stays alive!"
SPR_national_meetings_desc:0 "Once per quater all the communes will send a deligate to a national meeting. Here we will discuss future plans and coordinate our dreams."
 SPR_lighting_the_way:0 "Lighting the Way"
 SPR_lighting_the_way_desc:0 "Those who know and accept their place, must be brought forward for the good of all. They will light the way of anarchism and show the world the true way."
SPR_convert_the_masses:0 "Convert new Lands"
SPR_convert_the_masses_desc:0 "The new lands conquered is populated by people who don't yet understand our way. We need to send the true believers of our cause to educate and guide our new pupils."
SPR_embarce_the_future:0 "Embrace the Future"
SPR_embarce_the_future_desc:0 "Converting people to our way is costly in terms of manpower. However with our new investments in mondern electronics we can use these to reach more people with less effort."
SPR_the_peoples_armada:0 "The People's Armada"
SPR_the_peoples_armada_desc:0 "The construction of the people's fleet has started but we need to increase production if we want to come close to the navel powers that surround us."
SPR_expand_mining_rights:0 "Expand Mining Rights"
SPR_expand_mining_rights_desc:0 "We have to make sure we have enough resources to last. By giving everyone the rights to mine on their own land, we will have plenty to stand up against the major powers that surround us."
SPR_expand_portugese_resources:0 "Expand Portugese Resources"
SPR_expand_portugese_resources_desc:0 "Since the Portugese state and her old colonies are now part of our commune we should use them to get access to the last resource to propel us into the new era, Oil."
SPR_manpower_minimum_victory:0 "More than §Y75.000.000§! population"
SPR_victory:0 "Victory!"
SPR_victory_desc:0 "We did it! There's significantly more people who are now part of our commune, all we need to do is show them our way. When that happens we will be unstoppable. All the world will know the anarchist way!"
SPA_master_of_the_mediterranean:0 "Master of the Mediterranean"
SPA_master_of_the_mediterranean_desc:0 "With the imperial plan in place we must first start small. Italy currently rules the Mediterranean sea, but their power is failing. Duce Mussolini is driving his country through the dirt, so this is the perfect time to increase production to overtake him and his failing ambitions."
SPA_german_tankbuilding_expertise:0 "German Tankbuilding Expertise"
SPA_german_tankbuilding_expertise_desc:0 "The Germans are currently the most experienced tank builders in the world. By inviting German experts we could make some of these war machines ourselves."
SPA_the_last_threat_on_the_peninsula:0 "The Last Threat on the Peninsula"
SPA_the_last_threat_on_the_peninsula_desc:0 "With our borders secure and our economy working again there is one last threat to our nation. Our Portugese neighbors can be used as a staging ground for further assaults, we should take them out to prevent this inevitability!"
SPA_italian_islands_for_support:0 "Italian Island for Support"
SPA_italian_islands_for_support_desc:0 "We are willing to support the Allies against the Axis threat but we would need to be properly compensated. The Italian islands in the mediterranean would be good to ensure our dominance."
SPA_claim_mediterranean_islands:0 "Claim the Mediterranean Islands"
SPA_claim_mediterranean_islands_desc:0 "With the peninsula secure and industry ready, we are ready to claim the Mediterranean as ours!"
SPA_the_organic_law:0 "The Organic Law"
SPA_the_organic_law_desc:0 "The organic law will make the government completely responsible for passing all laws. All other official bodies will be reduced to just advisory positions. This will give our leader more power to bring us through these tough times!"
SPA_mineral_self_sufficiency:0 "Ensure Mineral Self-Sufficiency"
SPA_mineral_self_sufficiency_desc:0 "Now that we are self sufficient in food, we have to also ensure we don't rely on external sources for our steel and other import construction materials. We have to expand the mines further!"
SPA_expand_navel_aircraft:0 "Expand Naval Aircraft"
SPA_expand_navel_aircraft_desc:0 "We are surrounded by seas and oceans. If we want to keep them save we can't just rely on our allies, our aircraft should be able to protect us too."
SPA_expand_the_universities:0 "Expand the Universities"
SPA_expand_the_universities_desc:0 "Our brightest minds are now working on military technologies but they don't have the resources to work as fast as they could. An expansion of the universities is necessary to stay compatitive to other countries!"
SPA_integrate_portugal:0 "Integrate Portugal"
SPA_integrate_portugal_desc:0 "Portugal has always resisted Spanish infuences but with enough time the Portugese will see who they truly are."
SPA_the_imperial_fleet:0 "The Imperial Fleet"
SPA_the_imperial_fleet_desc:0 "At the height of the Spanish Empire in the 17th centure we rivaled the British navy in size and strength. However now we are but a shadow of our former self. It's time to focus more on ship production and research!"
SPA_reconstruct_the_empire_of_old:0 "Reconstruct the Empire of Old"
SPA_reconstruct_the_empire_of_old_desc:0 "It is time for the Spanish Empire to reintegrate its old rightfull land! Most of South and Central America already speak the language and follow our customs, so it's time to fully accept them as Spanish citizens."
SPA_for_the_spanish_imperium:0 "For the Spanish Imperium!"
SPA_for_the_spanish_imperium_desc:0 "The war for the Americas is ready, it is time to rebuild our empire of old. For the Spanish Imperium!"
SPR_allied_recovery_aid:0 "Allied Recovery Aid"
SPR_allied_recovery_aid_desc:0 "Both the United Kingdom and the United States have seen great industrial growth over the last years. They might not have helped us during our strive, but we cannot ignore their results. If we appeal for aid we might be able to become stronger than we were before the civil war."
SPR_industrial_aid:0 "Industrial Aid"
SPR_industrial_aid_desc:0 "Our industry is what's most in need of support. We have stagnated and even shrunk for the past few years, if we can reverse this we would be able to help ourselves!"
SPR_naval_aid:0 "Naval Aid"
SPR_naval_aid_desc:0 "With our navy in shambles and a lot of knowledge lost, we should now focus on the navy!"
SPR_military_aid:0 "Military Aid"
SPR_military_aid_desc:0 "With our industry recovering and growing we can now look towards our military production. If we can kickstart this we should be able to become a respectable member of the allies!"
SPR_embrace_free_market_capitalism:0 "Embrace Free Market Capitalism"
SPR_embrace_free_market_capitalism_desc:0 "We have done it! All branches within our industry are growing rapidly. It is time for us to fully embrace capitalism and look towards the future."
SPR_war_resources:0 "War Resources"
SPR_war_resources_desc:0 "We see ourselves at war again, and against the fascists non the less. We have to extract everything we can from our soil to fuel the war industries!"
SPR_the_fight_against_fascism:0 "The Fight Against Fascism"
SPR_the_fight_against_fascism_desc:0 "This was just the beginning, we must prepare for the onslaught of the fascist war machine."
SPR_northern_defences:0 "Northern Defences"
SPR_northern_defences_desc:0 "With the fascist threat to our northern border we must prepare for the worst."
SPR_construct_a_new_aerial_academy:0 "Construct a New Aerial Academy"
SPR_construct_a_new_aerial_academy_desc:0 "With the expansion of the other military branches we must setup a branch for our new air force. This will make sure only the best pilots will enter our fighters!"
SPR_a_new_generation_of_fighters:0 "A New Generation of Fighters"
SPR_a_new_generation_of_fighters_desc:0 "With new pilots being trained as we speak we must be able to put them in new planes if we want them to be effective. We must intensify research on fighter technology!"
SPA_the_empire_restored:0 "The Empire Restored"
SPA_the_empire_restored_desc:0 "It is done, the empire has recovered from the fires of the civil war. Further investments into industry and the people made we can now look towards the future."
SPA_integrate_the_union:0 "Integrate the Union"
SPA_integrate_the_union_desc:0 "With all of Iberia under our control. We can integrate everyone under our new empire."
SPA_expand_portugese_resources:0 "Expand Portugeese Resources"
SPA_expand_portugese_resources_desc:0 "With the new colonies secure we can look towards new resources to strengthen our position against the democracies that surround us."
SPA_a_fleet_worthy_of_a_kingdom:0 "A Fleet Worthy of a Kingdom"
SPA_a_fleet_worthy_of_a_kingdom_desc:0 "We shall build a fleet which the whole kingdom can be proud of. Given time it rival even the british fleet!"
SPA_expand_naval_output:0 "Expand Naval Output"
SPA_expand_naval_output_desc:0 "Our ambitions for our navy is large, so we need to invest into our dockyards and the people working there. This gives us a chance to build up the fleet we are going to get."
SPA_claim_new_colonies:0 "Claim New Colonies"
SPA_claim_new_colonies_desc:0 "We have several colonies but they are disconnected and far away from each other. This makes securing them difficult. We need to connect them to longer streches of land!"
SPA_a_monarchist_industry:0 "A Monarchist Industry"
SPA_a_monarchist_industry_desc:0 "The democracies in Britain and the United States are blinded by pride over their economic growth. We shall show them with the knowledge of our new monarch what we can achieve!"
SPR_fascist_recovery_aid:0 "Fascist Recovery Aid"
SPR_fascist_recovery_aid_desc:0 "Now that we share a common enemy, the facists are willing to help us recover so we might fight more effectively in the war."
SPR_german_industrial_aid:0 "German Industrial Aid"
SPR_german_industrial_aid_desc:0 "Germany is willing to help our industry. We best make use of this while they are still willing and able."
SPR_italian_naval_aid:0 "Italian Naval Aid"
SPR_italian_naval_aid_desc:0 "The Italians are willing to help us recover our lost naval strength."
SPR_communist_recovery_aid:0 "Communist Recovery Aid"
SPR_communist_recovery_aid_desc:0 "With the five year plan in place we can start the full recovery of the Spanish state. With the help of the Soviet Union we can accelerate this process."
SPR_communist_naval_aid:0 "Communist Naval Aid"
SPR_communist_naval_aid_desc:0 "The soviets might not be a naval power such as the likes of the United Kingdom or the United States, but they can certainly help us rebuild a basic naval force."
SPR_communist_military_aid:0 "Communist Military Aid"
SPR_communist_military_aid_desc:0 "If we hope to be a powerful ally to the Soviets we will need some help to rebuild our military infrastructure. With some basic aid we can kickstart our industry."
SPR_iberian_communist_paradise:0 "Iberian Communist Paradise"
SPR_iberian_communist_paradise_desc:0 "Iberia is united and our industry is thriving. The Iberian workers now truely get the communist paradise which was promised."
SPR_unite_red_iberia:0 "Unite Red Iberia"
SPR_unite_red_iberia_desc:0 "All the workers on the Iberian peninsula should be freed from their capitalistic overlords. Let us free the Portugese!"
SPR_expand_the_working_class:0 "Expand the Working Class"
SPR_expand_the_working_class_desc:0 "With the wealth distributed amongst the people we expand the working class to make sure everyone gets an equal start. Nobody shall be left behind for the opportunity to work."
SPR_fight_the_fake_socialists:0 "Fight the Fake Socialists"
SPR_fight_the_fake_socialists_desc:0 "The soviets have always said they are the real socialists in this world, but they are little more than a social dictatorship. We shall show them the real power of socialism!"
SPR_supply_the_tide:0 "Supply the Tide"
SPR_supply_the_tide_desc:0 "With modern weapons acquired we must make sure our soldier are always fully equiped. To do this the military industry need to be expanded."
SPR_resources_for_the_tide:0 "Resources for the Tide"
SPR_resources_for_the_tide_desc:0 "With the expansion of the military industry we must make sure we have the resources to keep the factories running."
SPR_protect_against_the_fascists:0 "Protect Against the Fascists"
SPR_protect_against_the_fascists_desc:0 "The fascists are a major threat to our northern border. To make sure we stay protected we must build a fort line so we can hold our ground. "
SPR_iberian_socialism:0 "Iberian Socialism"
SPR_iberian_socialism_desc:0 "The peninsula is secure and we are activly fighting the fake communists in Russia. With the socialst industry providing for our workers and creating weapons for our soldier we call victory to our way of Socialism. All the world shall see our way is the way forward!"
 SPR_connecting_the_camps:0 "Connecting the communes"
