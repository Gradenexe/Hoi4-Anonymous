 UKR_forment_disloyalty_desc:0 "There are many movements both within and without the [Root.GetAdjective] government and if we are to overthrow the current tyranny that plagues [Root.GetNameDef], we must become the unifying voice of opposition to [Root.GetNeutralParty]!"
 UKR_arm_baltic_reds:0 "Arm Ukrainian Reds"
 UKR_arm_baltic_reds_desc:0 "The stage is set, communist fervor is burning all across the Ukraine. All the reds need now is the signal and resources from us and we will spark the Ukrainian revolution!"
 UKR_end_bourgeouis_dictatorships:0 "Unification with Moldavian SSR"
 UKR_end_bourgeouis_dictatorships_desc:0 "The Ukraine are dominated by so-called “neutral” dictators. With the backing of the military and without consent of their people, the proletariat of the Ukrainian are oppressed under capitalist dictatorship. It is only by the hands of freed [Root.GetAdjective] workers that these workers kept separate by unjust borders may share in our glorious liberation!"
 UKR_path_to_the_north_sea:0 "A Path to the North Sea"
 UKR_path_to_the_north_sea_desc:0 "The Danes have remained woefully neutral in this escalating global conflict, and the straits of Denmark are all that separate the socialist world from the North Sea."
 UKR_modernize_industry:0 "Modernize Our Industry"
 UKR_modernize_industry_desc:0 "For too long, [Root.GetNonIdeologyName]’s output has been defined by agriculture but no more. We must concentrate our industry around the major city centers in each state if we are to turn [Root.GetNonIdeologyName] into a modern economy."
 UKR_seek_support_of_soviets:0 "Seek the Support of the Soviets"
 UKR_seek_support_of_soviets_desc:0 "Although the Red Army laid waste to [Root.GetNameDef] and brought our nation into a new era of Russian imperialism, we are without a chance to bring socialism to [Root.GetNameDef] without their assistance."
 UKR_overthrow_the_government:0 "Overthrow [Root.GetNeutralParty]"
 UKR_overthrow_the_government_desc:0 "We have gathered enough support to topple [Root.GetLeader] and [Root.GetLeader.GetHerHis] regime! All we need do is march on the capital and proclaim a new Worker’s Republic!"
 UKR_domestic_motors:0 "A Domestic Motor Company"
 UKR_domestic_motors_desc:0 "Foreign designs are fine, but we cannot rely on them in perpetuity. [Root.GetNonIdeologyName] is a proud nation, and we must show the world that our designers and thinkers are just as adequate as those from the West."
 UKR_soviet_volunteer_forces:0 "Soviet Volunteer Forces"
 UKR_soviet_volunteer_forces_desc:0 "The USSR is practically overflowing with men ready to fight and die for the world revolution. Though [Root.GetNameDef] is just a mere stepping-stone in the fight for a communist world, there is no shortage of brave Russian socialists ready to die for our cause."
 UKR_end_swedish_neutrality:0 "End Yugoslav Neutrality"
 UKR_end_swedish_neutrality_desc:0 "What the Yugoslavs call neutrality is nothing but weakness; bending to the whims of whichever power seems most powerful at the time with little regard for the wellbeing of the lower classes across their borders. Such a weak-willed and flimsy government is unworthy of sharing our border and we must create a new Yugoslavia with the spine to defend its people from tyranny."
 UKR_soviet_equipment:0 "Soviet Equipment"
 UKR_soviet_equipment_desc:0 "We cannot hope to topple the government without first gaining access to weapons and materials necessary to arm our militia. By reaching out to the Russians for assistance, we will gain extra armaments to support our armies, should the old government attempt to halt the revolution."
 UKR_squash_resistance:0 "Squash All Resistance"
 UKR_squash_resistance_desc:0 "There are still yet people who believe socialism to be the enemy of [Root.GetAdjective] sovereignty, and these people must be rooted out if we are to advance the revolution."
 UKR_german_baltic_industry:1 "Axis-Ukrainian Industry"
 UKR_german_baltic_industry_desc:1 "[GetGermanBalticIndustryDesc]"
 UKR_balticwall:0 "Black Sea Wall"
 UKR_balticwall_desc:0 "Fortifications in the east are worthless if our enemies choose instead to perform an attack from the sea! We may never build a navy to rival the British, Germans, or Soviets, but we can do what we can to render them helpless against our coastal defences."
 UKR_technology_sharing:0 "Technology Sharing"
 UKR_technology_sharing_desc:0 "We produce many of our partner’s equipment already, but perhaps by studying their designs we shall be able to significantly improve native [Root.GetNonIdeologyAdjective] designs."
 UKR_school_of_aviation:1 "Ukrainian School of Aviation"
 UKR_school_of_aviation_desc:0 "During the independence war, the struggle for control of the air and sea was fought by the British on our behalf, but as the Brits continue to grant concession after concession to the Nazi menace, we cannot trust that they will defend us again. We must take to the air ourselves!"
 UKR_crossley_motors:0 "[Root.Capital.GetName]-Crossley Motors"
 UKR_crossley_motors_desc:1 "With foreign investment now rife within our nation and production of automobiles in reasonable efficiency, we may be able to collaborate with the Crossley Motor Company to create original designs for use within the [Root.GetNonIdeologyAdjective] army!"
 UKR_belarus_ssr:0 "[Root.GetNonIdeologyName]-Belarus SSR"
 UKR_belarus_ssr_desc:0 "The concept of uniting Belarus and the Ukrainian is not a foreign one. Long ago the Lithuanian-Belarus Soviet Socialist Republic existed as a harmonious fusion of these two seemingly different peoples. Socialism knows no boundaries of culture and language, and we see little reason why [Root.GetAdjective] and Belorussian workers could not co-exist."
 UKR_purge_of_our_own:0 "A Purge of Our Own"
 UKR_purge_of_our_own_desc:0 "Even through our best efforts to squash all resistance, there are still those organizing in the shadows, conspiring against the proletariat to restore a capitalist dictatorship in [Root.GetNonIdeologyName]. We must conduct a popular purge; rooting out any members of the old government and any who support them."
 UKR_invest_in_baltic_trade:0 "Invest in Ukrainian Trade"
 UKR_invest_in_baltic_trade_desc:0 "The Black Sea is rich with trade from Scandinavia, Germany, and Russia and our ports can scarcely contain them all. We must open up new trade lines with our friends who share this sea with us for a brighter and more prosperous [Root.GetNonIdeologyName]!"
 UKR_request_german_support:2 "Request [GetBalticAxisInvesmentsAdj] Support"
 UKR_request_german_support_desc:1 "[GetRequestGermanSupportDesc]"
 UKR_german_war_economics:1 "Adopt [GetBalticAxisInvesmentsAdj] War Economics"
 UKR_german_war_economics_desc:1 "[GetGermanWarEconomicsDesc]"
 UKR_direct_intervention:0 "Direct Soviet Intervention"
 UKR_direct_intervention_desc:0 "We have proven unable to reclaim the government alone and we must call upon our allies in [SOV.GetNameDef] to aid us in our struggle."
 UKR_natural_resources:0 "Develop Natural Resources"
 UKR_natural_resources_desc:0 "[Root.GetNaturaResource_BAL] has made our country rich from trade with the Soviets, the Allies, and our fellow Ukrainian states alike and we would do well to invest more into this industry by investing in [Root.GetExtraction_BAL] across the nation!"
 UKR_british_designers:0 "Invite British Designers"
 UKR_british_designers_desc:0 "We have studied British designs thoroughly, and with [Root.Capital.GetName]-Crossley Motors proving to be a successful endeavour, we would do well to extend formal invitations for British designers to join the [Root.GetNonIdeologyAdjective] Engineering Company."
 UKR_defence_of_our_nation:0 "The Defence of Our Nation"
 UKR_defence_of_our_nation_desc:0 "Civilian industry is of equal importance to our defence as the arms industry. The steady hum of machinery will drone throughout all of [Root.GetNonIdeologyName] as its patriotic people do their duty to industrialize our nation."
 UKR_crush_forest_brothers:0 "Crush the Resistance"
 UKR_crush_forest_brothers_desc:0 "The Resistance have been a blight on our nation since our takeover; sabotaging our industries, railroads, and disrupting official government demonstrations. We must venture into the forests of [Root.GetNonIdeologyName] and root out these misguided individuals."
 BALTIC_soviet_investments_idea:0 "Soviet Investments"
 BALTIC_soviet_investments_idea_desc:0 "A major communist power has pledged financial and industrial support to [Root.GetNameDef]. Soviet advisors are helping modernize our production lines, and their investment grants our nation a growing industrial capacity."

 # Baltic Soviet Investments branch
 baltic_soviet_investments:0 "Seek Soviet Investments"
 baltic_soviet_investments_desc:0 "[Root.GetNameDef] stands at a crossroads. By reaching out to the Soviet Union and other communist powers, we can secure vital financial support and industrial expertise to rebuild our nation — at the cost of deeper ties to the communist bloc."
 baltic_soviet_war_economics:0 "Soviet War Economics"
 baltic_soviet_war_economics_desc:0 "Soviet advisors have proposed a complete restructuring of our economy along Stalinist lines. While harsh, a command economy geared for war will produce the armaments [Root.GetAdjective] industry has never achieved alone."
 baltic_soviet_tank_licences:0 "Soviet Tank Licences"
 baltic_soviet_tank_licences_desc:0 "The Red Army fields some of the finest armored vehicles in the world. By negotiating production licences, [Root.GetNameDef] can begin manufacturing Soviet-designed tanks, giving our forces a decisive edge on the battlefield."
 baltic_donbas_heavy_industry:0 "Our Heavy Industry"
 baltic_donbas_heavy_industry_desc:0 "Drawing inspiration from the great industrial heartland of the Donbas, we will replicate its model of heavy metallurgy across our core territories. Soviet engineers will oversee the construction of new steel works and foundries."
 baltic_donbas_coal:0 "Our Coal Extraction"
 baltic_donbas_coal_desc:0 "Coal is the lifeblood of modern industry. By adopting our mining techniques and bringing in Soviet extraction specialists, [Root.GetNameDef] will unearth the fuel needed to power its war machine."
 baltic_soviet_collectivization:0 "Collectivization Drive"
 baltic_soviet_collectivization_desc:0 "Following the Soviet model, we will nationalize private farms and consolidate them into collective enterprises. The process will be painful — many will resist — but the resulting surplus will feed our factories and frontlines."
 baltic_soviet_ukraine_industry:0 "Soviet-Backed Industry"
 baltic_soviet_ukraine_industry_desc:0 "With Soviet economic advisors embedded in our ministries, [Root.GetNameDef] will receive off-site factory capacity supported by our communist partners, freeing our homeland from full reliance on front-line industry."
 baltic_western_wall:0 "Western Defensive Wall"
 baltic_western_wall_desc:0 "Knowing that the capitalist powers to our west will not tolerate a communist [Root.GetNonIdeologyName], we must prepare our borders. Soviet engineers will help us construct a chain of fortifications along every contested frontier."
 baltic_stalins_highway:0 "Stalin's Highway"
 baltic_stalins_highway_desc:0 "A modern road and rail network is the backbone of both industry and military logistics. With Soviet construction brigades, [Root.GetNameDef] will build an arterial highway system connecting every corner of the state."
 baltic_request_soviet_support:0 "Request Soviet Support"
 baltic_request_soviet_support_desc:0 "With our economy restructured and our defenses hardened, [Root.GetNameDef] is ready to take its place as a full partner in the socialist world order. We will formally request entry into the Soviet-led faction and military cooperation."

 UKR_soviet_investments:0 "Seek Soviet Investments"
 UKR_soviet_investments_desc:0 "In order to safeguard the revolution and industrialize our nation, we must look to our comrades in the Soviet Union. By opening our borders to Soviet investments, we will secure the future of the Ukrainian proletariat."
 UKR_soviet_war_economics:0 "Adopt Soviet War Economics"
 UKR_soviet_war_economics_desc:0 "To ensure that our economy is ready to withstand any capitalist aggression, we must restructure our industrial output. Modeling our economy on the Soviet command model will prepare us for the inevitable struggle."
 UKR_soviet_tank_licences:0 "Soviet Tank Licences"
 UKR_soviet_tank_licences_desc:0 "The Red Army's armored forces are among the most advanced in the world. Securing production licenses for Soviet tank designs will give our army the armored fist it needs."
 UKR_stalins_highway:0 "Stalin's Highway"
 UKR_stalins_highway_desc:0 "Rapid movement of troops and industrial materials is key to modern warfare. With Soviet engineers assisting us, we will build a modern network of highways across the country."
 UKR_eastern_wall:0 "Anti-Fascist Wall"
 UKR_eastern_wall_desc:0 "We must protect the achievements of the revolution from the fascist menace. Constructing a line of bunkers along the borders with fascist nations will ensure that any capitalist-fascist invasion will be broken against our defenses."
 UKR_soviet_ukraine_industry:0 "Soviet-Ukrainian Industry"
 UKR_soviet_ukraine_industry_desc:0 "By integrating our industrial planning with Soviet expertise, we can build off-site military and civilian factories that are safe from front-line bombardment."
 UKR_request_soviet_support:0 "Request Soviet Support"
 UKR_request_soviet_support_desc:0 "With our nation industrialized and our military cooperation established, we are ready to take our place as a full partner in the socialist world. Let us request formal military alliance and faction entry with the Soviet Union."

 # Custom Tooltips
 UKR_BALTIC_events_7_tt:0 "The Soviet Union will gain a (Topple Government) wargoal against §YBulgaria§!"
 UKR_BALTIC_events_8_tt:0 "The Soviet Union will gain a (Topple Government) wargoal against §YRomania§!"
 UKR_BALTIC_events_9_tt:0 "The Soviet Union will gain a (Topple Government) wargoal against §YYugoslavia§!"
 UKR_BALTIC_events_10_tt:0 "The Soviet Union will gain a (Topple Government) wargoal against §YPoland§!"
 UKR_BALTIC_events_11_tt:0 "The Soviet Union will gain a (Topple Government) wargoal against §YItaly§!"
 UKR_BALTIC_events_12_tt:0 "The Soviet Union will gain a (Topple Government) wargoal against §YCzechoslovakia and Slovakia§!"

 # Focus names
 UKR_finnish_invasion:0 "Bulgarian Campaign"
 UKR_path_to_the_north_sea:0 "Path to the Balkans"
 UKR_end_swedish_neutrality:0 "End Yugoslav Neutrality"
 UKR_free_the_workers_of_poland:0 "Free the Workers of Poland"
 UKR_free_the_workers_of_chechoslovakia:0 "Free the Workers of Czechoslovakia"
 UKR_end_italy:0 "The End of Italy"

 # Events
 UKR_events.7.t:0 "Ukraine Prepares for the Bulgarian Campaign"
 UKR_events.7.d:0 "Our comrades in Ukraine have finalized preparations to spread the revolution to the Balkans. Bulgaria, still under the rule of the bourgeoisie, is our next target. It is time to liberate the Bulgarian workers and bring them the light of socialism!"
 UKR_events.7.a:0 "Forward to Sofia!"

 UKR_events.8.t:0 "Path to the Balkans"
 UKR_events.8.d:0 "The Ukrainian government has drawn up a plan to secure control over Eastern Europe. Romania stands in our way. We must assist our comrades in removing the Romanian government and securing the region for the revolution."
 UKR_events.8.a:0 "Next stop: Bucharest."

 UKR_events.9.t:0 "The End of Yugoslav Neutrality"
 UKR_events.9.d:0 "Yugoslavia's so-called 'neutrality' is nothing but a smokescreen for their collaboration with imperialists. Ukraine urges us to put an end to this hypocrisy. The Yugoslav workers await our liberation!"
 UKR_events.9.a:0 "The revolution knows no borders."

 UKR_events.10.t:0 "Liberation of the Polish Workers"
 UKR_events.10.d:0 "The reactionary government of Poland continues to oppress its people. Ukraine has initiated a plan to topple the Polish authorities and establish a dictatorship of the proletariat. We must support this move and bring the revolution to Warsaw."
 UKR_events.10.a:0 "For our freedom and yours!"

 UKR_events.11.t:0 "The End of Italy"
 UKR_events.11.d:0 "The fascist regime in Italy poses a threat to the entire free world. Our Ukrainian comrades propose to deal a final blow to this stronghold of reaction. The time has come to liberate the Italian people!"
 UKR_events.11.a:0 "Death to fascism!"

 UKR_events.12.t:0 "Liberation of the Czechoslovak Workers"
 UKR_events.12.d:0 "The bourgeois government of Czechoslovakia must fall. The Ukrainian initiative to expand the revolution's influence into Central Europe deserves our full support. To Prague!"
 UKR_events.12.a:0 "The workers of Czechoslovakia shall be free."

 UKR_post_resistance_development:0 "Post-Resistance Development"
 UKR_post_resistance_development_desc:0 "With the resistance finally crushed, we can focus our efforts on the industrial development of our newly secured regions."
 UKR_donbas_heavy_industry:0 "Donbas Heavy Industry"
 UKR_donbas_heavy_industry_desc:0 "The Donbas region is rich with resources and potential. By investing heavily in its industrial capacity, we can secure a strong backbone for our nation's economy."
 UKR_soviet_collectivization:0 "Soviet Collectivization"
 UKR_soviet_collectivization_desc:0 "To maximize our agricultural output and feed the growing industrial workforce, we must transition our farms to the Soviet model of collectivization."
 UKR_donbas_coal:0 "Donbas Coal"
 UKR_donbas_coal_desc:0 "Coal is the lifeblood of industry. By expanding our mining operations in the Donbas, we will fuel our factories and power our military machine."
 UKR_western_wall:0 "Western Wall"
 UKR_western_wall_desc:0 "We must prepare for the inevitable clash with the West. A formidable line of fortifications along our western border will ensure the safety of our republic."
 UKR_united_with_westukrblr:0 "Unite with our people in Eastern Poland"
 UKR_united_with_westukrblr_desc:0 "Our brothers in the west have suffered long enough under foreign occupation. It is our duty to bring them into the fold and unite all our historical lands under one socialist banner."
 UKR_events.1.t:0 "[From.GetNameDefCap] Requests Our Support"
 UKR_events.1.d:0 "[From.GetNameDefCap] has reached out to us, requesting formal support and military alliance. As brothers in the struggle against capitalism, they seek entry into our faction and our guarantee of their independence."
 UKR_events.1.a:0 "We welcome our [From.GetNameDefCap] comrades."
 UKR_events.1.b:0 "We cannot afford to support them right now."

# Ukraine Exile Focuses and Ideas appended
 # Ukraine Exile Focuses
 UKR_government_in_exile:0 "Prepare for the Inevitable"
 UKR_government_in_exile_desc:0 "Our homeland is on the verge of falling, but our spirit remains unbroken. We shall prepare our government to coordinate the liberation struggle from abroad."
 UKR_foreign_air_support:0 "Foreign Air Support"
 UKR_foreign_air_support_desc:0 "Our hosts will assist in training our pilots and supplying aircraft for our exile air force."
 UKR_aces_in_exile:0 "Aces in Exile"
 UKR_aces_in_exile_desc:0 "Our pilots will fight alongside our allies, gaining invaluable combat experience to lead our future air force."
 UKR_air_in_exile:0 "Air Force in Exile"
 UKR_air_in_exile_desc:0 "Establishing our own squadron commands under allied operational control, ensuring our flight crews remain organized."
 UKR_women_in_air:0 "Women in the Air Force"
 UKR_women_in_air_desc:0 "Every citizen must contribute. We will open flight training to Ukrainian women, maximizing our pilot pool."
 UKR_foreign_army_support:0 "Foreign Army Support"
 UKR_foreign_army_support_desc:0 "We shall assemble our scattered soldiers and volunteers to form a combat-ready force on foreign soil."
 UKR_organize_exiled_army:0 "Organize Exiled Army"
 UKR_organize_exiled_army_desc:0 "Structuring our volunteer regiments into integrated divisions with proper command structures."
 UKR_new_army:0 "The New Army"
 UKR_new_army_desc:0 "Equipping our soldiers with modern weapons and adopting advanced tactical doctrines to prepare for the return."
 UKR_foreign_fleet_support:0 "Foreign Fleet Support"
 UKR_foreign_fleet_support_desc:0 "Negotiating with allied navies to provide docking facilities and training for our sailors."
 UKR_buy_foreign_ships:0 "Purchase Foreign Vessels"
 UKR_buy_foreign_ships_desc:0 "Acquiring decommissioned or leased naval assets from our allies to form a core liberation fleet."
 UKR_army_cooperation:0 "Inter-service Cooperation"
 UKR_army_cooperation_desc:0 "Integrating our army, navy, and air forces into a unified command structure to coordinate operations."
 UKR_exile_politics:0 "Exile Politics"
 UKR_exile_politics_desc:0 "Consolidating our diplomatic representation abroad to ensure our voice is heard in allied war councils, establishing a steady source of political legitimacy."
 UKR_exploit_our_connections:0 "Exploit Our Connections"
 UKR_exploit_our_connections_desc:0 "Leveraging our diplomatic contacts to secure international trade agreements and materials for our exiled government."
 UKR_help_from_our_allies:0 "Help from Our Allies"
 UKR_help_from_our_allies_desc:0 "Securing concrete commitments of lend-lease and sharing technical and research knowledge with our allied hosts."
 UKR_international_recognition:0 "International Recognition"
 UKR_international_recognition_desc:0 "Ensuring that the international community recognizes our exiled administration as the sole legitimate government of Ukraine, cementing our war support."
 UKR_exile_industries:0 "Exile Industries"
 UKR_exile_industries_desc:0 "Setting up workshops and coordination offices in host nations to manage production for our military."
 UKR_resistance_industries:0 "Underground Industry"
 UKR_resistance_industries_desc:0 "Supporting secret workshops and supply networks within our occupied core territories."
 UKR_combined_civilian_agency_resistance:0 "Combined Resistance Coordination"
 UKR_combined_civilian_agency_resistance_desc:0 "Unifying our intelligence operations with domestic partisan networks to maximize sabotage efficiency."
 UKR_evacuated_industries:0 "Evacuated Industries"
 UKR_evacuated_industries_desc:0 "Setting up factories staffed by evacuated Ukrainian workers to manufacture arms and equipment."
 UKR_connections_with_industrialists:0 "Industrialist Connections"
 UKR_connections_with_industrialists_desc:0 "Working with foreign industrialists to secure machinery, resources, and technical expertise."
 UKR_exile_resistance:0 "Coordinate the Underground"
 UKR_exile_resistance_desc:0 "Establishing radio contacts with local resistance cells in our occupied territories."
 UKR_expand_operations:0 "Expand Operations"
 UKR_expand_operations_desc:0 "Expanding our espionage network to gather intelligence on occupier movements and assets."
 UKR_expand_intelligence:0 "Expand Intelligence"
 UKR_expand_intelligence_desc:0 "Upgrading our decryption capabilities to intercept and crack enemy communications."
 UKR_even_stronger_resistance:0 "Mobilize the Underground"
 UKR_even_stronger_resistance_desc:0 "Giving the signal to domestic partisan networks to scale up sabotage of enemy lines."
 UKR_everyone_will_fight:0 "Everyone Will Fight"
 UKR_everyone_will_fight_desc:0 "Mobilizing all refugees, emigrants, and supporters abroad to take up arms or support roles."
 UKR_our_help_in_the_war:0 "Allied Contribution"
 UKR_our_help_in_the_war_desc:0 "Offering our specialized intelligence and volunteer units to direct Allied operations, proving our worth."
 UKR_prepare_our_people_to_return:0 "Prepare the People to Return"
 UKR_prepare_our_people_to_return_desc:0 "Broadcasting propaganda and instructions to prepare the civilian population for the coming liberation."
 UKR_prepare_our_army_to_return:0 "Prepare the Army to Return"
 UKR_prepare_our_army_to_return_desc:0 "Drilling our exiled divisions in specialized offensive and liberation tactics."
 UKR_prepare_our_land_to_return:0 "Prepare the Land to Return"
 UKR_prepare_our_land_to_return_desc:0 "Directing coordinated sabotage of enemy supply lines, rail networks, and airfields in Ukraine."
 UKR_combine_all_our_forces:0 "Combine All Forces"
 UKR_combine_all_our_forces_desc:0 "Merging all our exile assets—army, air force, navy, industry, and underground networks—into a single, unified Liberation Front."
 UKR_to_return_ours:0 "To Reclaim What Is Ours"
 UKR_to_return_ours_desc:0 "Declaring the start of the general campaign to liberate our homeland from the occupier."
 UKR_first_hit:0 "The First Strike"
 UKR_first_hit_desc:0 "Launching the initial offensive to secure our first major regions and establish a bridgehead."
 UKR_second_hit:0 "The Second Strike"
 UKR_second_hit_desc:0 "Pushing deeper into the central regions, breaking the enemy's defensive lines."
 UKR_third_hit:0 "The Third Strike"
 UKR_third_hit_desc:0 "Liberating our key industrial heartlands and freeing millions of our citizens."
 UKR_final_blow:0 "The Final Blow"
 UKR_final_blow_desc:0 "Launching the ultimate, decisive offensive to completely expel the occupier from every inch of our land."

 # Ukraine Exile Ideas
 UKR_aces_in_exile_idea:0 "Ukrainian Aces in Exile"
 UKR_aces_in_exile_idea_desc:0 "Our pilots have served with distinction in Allied air wings, gaining invaluable tactical knowledge."
 UKR_army_cooperation_idea:0 "Inter-Service Cooperation"
 UKR_army_cooperation_idea_desc:0 "Our army, navy, and air forces are fully integrated, coordinating their planning and operational execution."
 UKR_civil_and_military_organization_ukr:0 "Combined Resistance Council"
 UKR_civil_and_military_organization_ukr_desc:0 "A joint intelligence council that coordinates regular military assets with domestic partisan forces."
 UKR_industrialist_connections_ukr:0 "Industrialist Support Group"
 UKR_industrialist_connections_ukr_desc:0 "Our exiled government works closely with foreign manufacturers to secure military supplies."
 UKR_even_stronger_resistance_idea:0 "Mobilized Partisan Network"
 UKR_even_stronger_resistance_idea_desc:0 "Partisan networks across the occupied homeland have scaled up active sabotage and intelligence gathering."
 UKR_everyone_will_fight_idea:0 "Exile Mobilization"
 UKR_everyone_will_fight_idea_desc:0 "We have mobilized every capable refugee and volunteer to support the liberation effort."
 UKR_our_help_in_the_war_idea:0 "Valued Allied Partner"
 UKR_our_help_in_the_war_idea_desc:0 "Our active contributions in intelligence and volunteers have earned us deep respect from our allies."
 UKR_people_return_prep_idea:0 "Liberation Propaganda Networks"
 UKR_people_return_prep_idea_desc:0 "Underground broadcasts and leaflets have prepared the occupied population to assist the returning army."
 UKR_army_return_prep_idea:0 "Liberation Army Training"
 UKR_army_return_prep_idea_desc:0 "Our exiled divisions have been drilled in offensive and spearhead tactics designed specifically for reclaiming our homeland."
 UKR_land_return_prep_idea:0 "Coordinated Supply Sabotage"
 UKR_land_return_prep_idea_desc:0 "Partisans have heavily damaged enemy supply hubs and rail corridors, disrupting their logistics."
 UKR_united_exile_government_idea:0 "Unified Liberation Front"
 UKR_united_exile_government_idea_desc:0 "All our military branches, industrial agreements, and domestic resistance cells have been combined into a single, highly coordinated, and powerful liberation movement."
 UKR_reconquest_spirit:0 "Spirit of Liberation"
 UKR_reconquest_spirit_desc:0 "Our people are unified by a single burning desire: to reclaim our homeland and defeat the occupier."
 UKR_first_hit_idea:0 "First Strike Momentum"
 UKR_first_hit_idea_desc:0 "The momentum of our initial bridgehead offensive boosts our speed and offensive capabilities on core territory."
 UKR_second_hit_idea:0 "Second Strike Momentum"
 UKR_second_hit_idea_desc:0 "Our breakthroughs in the central regions have thrown the enemy into disarray, boosting our breakthrough and recovery speed."
 UKR_third_hit_idea:0 "Third Strike Momentum"
 UKR_third_hit_idea_desc:0 "As we reclaim our industrial heartlands, our defensive planning and organization are heavily bolstered."
 UKR_final_blow_idea:0 "The Ultimate Blow"
 UKR_final_blow_idea_desc:0 "The final campaign to completely expel the occupier grants us massive offensive and defensive combat bonuses."
 UKR_exile_politics_spirit:0 "Ukrainian Government-in-Exile"
 UKR_exile_politics_spirit_desc:0 "Our exiled administration maintains political structure and legitimacy, bolstering our political influence and stability."
 UKR_exploit_connections_spirit:0 "Diplomatic Trade Channels"
 UKR_exploit_connections_spirit_desc:0 "Exploiting diplomatic links helps us secure trade deals and resources from host countries."
 UKR_allied_aid_spirit:0 "Allied Research Exchange"
 UKR_allied_aid_spirit_desc:0 "Our hosts share scientific and military research resources to support our future restoration."
 UKR_intl_recognition_spirit:0 "International Diplomatic Recognition"
 UKR_intl_recognition_spirit_desc:0 "Global recognition of our legitimacy keeps our war effort alive and gives us strong political backing."
 UKR_new_volonteers_to_fight:0 "New Volunteers to Fight"
 UKR_new_volonteers_to_fight_desc:0 "Our cause has inspired many to join our ranks, swelling our forces with fresh volunteers eager to fight for our liberation."
 UKR_mobilize_from_liberated_lands:0 "Mobilize from Liberated Lands"
 UKR_mobilize_from_liberated_lands_desc:0 "As we reclaim territory, we can mobilize the local population to join our forces, further strengthening our ranks and deepening our connection with the people we are liberating."
 # Custom Tooltips
 NZL_transfer_ships_tt:0 "Britain will transfer HMS Achilles, HMS Leander, and two destroyers to the Ukrainian navy."
 lar_decryption_bonus_tt:0 "Unlocks a permanent boost to decryption speed."
 baltic_soviet_investments_idea:0 "Soviet Investments"
 baltic_soviet_investments_idea_desc:0 "A major communist power has pledged financial and industrial support to [Root.GetNameDef]. Soviet advisors are helping modernize our production lines, and their investment grants our nation a growing industrial capacity."

 # Baltic Soviet Investments branch
 baltic_soviet_investments:0 "Seek Soviet Investments"
 baltic_soviet_investments_desc:0 "[Root.GetNameDef] stands at a crossroads. By reaching out to the Soviet Union and other communist powers, we can secure vital financial support and industrial expertise to rebuild our nation — at the cost of deeper ties to the communist bloc."
 baltic_soviet_war_economics:0 "Soviet War Economics"
 baltic_soviet_war_economics_desc:0 "Soviet advisors have proposed a complete restructuring of our economy along Stalinist lines. While harsh, a command economy geared for war will produce the armaments [Root.GetAdjective] industry has never achieved alone."
 baltic_soviet_tank_licences:0 "Soviet Tank Licences"
 baltic_soviet_tank_licences_desc:0 "The Red Army fields some of the finest armored vehicles in the world. By negotiating production licences, [Root.GetNameDef] can begin manufacturing Soviet-designed tanks, giving our forces a decisive edge on the battlefield."
 baltic_donbas_heavy_industry:0 "Our Heavy Industry"
 baltic_donbas_heavy_industry_desc:0 "Drawing inspiration from the great industrial heartland of the Donbas, we will replicate its model of heavy metallurgy across our core territories. Soviet engineers will oversee the construction of new steel works and foundries."
 baltic_donbas_coal:0 "Our Coal Extraction"
 baltic_donbas_coal_desc:0 "Coal is the lifeblood of modern industry. By adopting our mining techniques and bringing in Soviet extraction specialists, [Root.GetNameDef] will unearth the fuel needed to power its war machine."
 baltic_soviet_collectivization:0 "Collectivization Drive"
 baltic_soviet_collectivization_desc:0 "Following the Soviet model, we will nationalize private farms and consolidate them into collective enterprises. The process will be painful — many will resist — but the resulting surplus will feed our factories and frontlines."
 baltic_soviet_ukraine_industry:0 "Soviet-Backed Industry"
 baltic_soviet_ukraine_industry_desc:0 "With Soviet economic advisors embedded in our ministries, [Root.GetNameDef] will receive off-site factory capacity supported by our communist partners, freeing our homeland from full reliance on front-line industry."
 baltic_western_wall:0 "Western Defensive Wall"
 baltic_western_wall_desc:0 "Knowing that the capitalist powers to our west will not tolerate a communist [Root.GetNonIdeologyName], we must prepare our borders. Soviet engineers will help us construct a chain of fortifications along every contested frontier."
 baltic_stalins_highway:0 "Stalin's Highway"
 baltic_stalins_highway_desc:0 "A modern road and rail network is the backbone of both industry and military logistics. With Soviet construction brigades, [Root.GetNameDef] will build an arterial highway system connecting every corner of the state."
 baltic_request_soviet_support:0 "Request Soviet Support"
 baltic_request_soviet_support_desc:0 "With our economy restructured and our defenses hardened, [Root.GetNameDef] is ready to take its place as a full partner in the socialist world order. We will formally request entry into the Soviet-led faction and military cooperation."

 UKR_soviet_investments:0 "Seek Soviet Investments"
 UKR_soviet_investments_desc:0 "In order to safeguard the revolution and industrialize our nation, we must look to our comrades in the Soviet Union. By opening our borders to Soviet investments, we will secure the future of the Ukrainian proletariat."
 UKR_soviet_war_economics:0 "Adopt Soviet War Economics"
 UKR_soviet_war_economics_desc:0 "To ensure that our economy is ready to withstand any capitalist aggression, we must restructure our industrial output. Modeling our economy on the Soviet command model will prepare us for the inevitable struggle."
 UKR_soviet_tank_licences:0 "Soviet Tank Licences"
 UKR_soviet_tank_licences_desc:0 "The Red Army's armored forces are among the most advanced in the world. Securing production licenses for Soviet tank designs will give our army the armored fist it needs."
 UKR_stalins_highway:0 "Stalin's Highway"
 UKR_stalins_highway_desc:0 "Rapid movement of troops and industrial materials is key to modern warfare. With Soviet engineers assisting us, we will build a modern network of highways across the country."
 UKR_eastern_wall:0 "Anti-Fascist Wall"
 UKR_eastern_wall_desc:0 "We must protect the achievements of the revolution from the fascist menace. Constructing a line of bunkers along the borders with fascist nations will ensure that any capitalist-fascist invasion will be broken against our defenses."
 UKR_soviet_ukraine_industry:0 "Soviet-Ukrainian Industry"
 UKR_soviet_ukraine_industry_desc:0 "By integrating our industrial planning with Soviet expertise, we can build off-site military and civilian factories that are safe from front-line bombardment."
 UKR_request_soviet_support:0 "Request Soviet Support"
 UKR_request_soviet_support_desc:0 "With our nation industrialized and our military cooperation established, we are ready to take our place as a full partner in the socialist world. Let us request formal military alliance and faction entry with the Soviet Union."

