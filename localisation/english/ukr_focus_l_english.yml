 # USSR Question about Ukraine-Belarus Unification
 UKR_events.19.t: "The Question of Ukrainian-Belarusian Reunification"
 UKR_events.19.d: "A momentous proposal has arrived from Kyiv. The Ukrainian government, having consolidated its authority and strengthened its position, now seeks to reunite with their Belarusian brethren. The dream of a unified Eastern Slavic state—from the Carpathian Mountains to the Dnieper River—has resurfaced. Such a union would create a formidable power bloc in Eastern Europe and would forever alter the balance of power on the continent. The Ukrainian leadership humbly requests Moscow's blessing for this historic endeavor. Shall we grant our approval to this grand vision of Slavic unity?"
 UKR_events.19.a: "We shall support the unification of Ukraine and Belarus. Let the Slavic peoples be united!"
 UKR_events.19.b: "We must refuse. Such unity is premature and could destabilize the region."
 # Unification Accepted - The New Union is Born
 UKR_events.20.t: "The Union of Ukraine and Belarus is Proclaimed!"
 UKR_events.20.d: "History shall remember this day! With Moscow's blessing, the Ukrainian and Belarusian nations have solemnly declared their eternal union. From the marshes of Polesia to the shores of the Black Sea, from the ancient forests of Białowieża to the vast steppes of the Dnieper—one flag now flies over a unified realm. The new Ukrainian-Belarusian Commonwealth stands as a beacon of Eastern Slavic civilization, a bastion of national revival and brotherhood. This union will reshape the very destiny of Eastern Europe. May this union of brotherly nations prosper for centuries to come!"
 UKR_events.20.a: "Long live the eternal union of Ukraine and Belarus! Glory to our brotherly peoples!"
 # USSR Rejects Unification
 UKR_events.21.t: "Moscow's Refusal: A Dream Deferred"
 UKR_events.21.d: "The Soviet leadership has declined the Ukrainian proposal for reunification with Belarus. The decision, while disappointing, is not entirely unexpected—Moscow remains cautious about the emergence of any new power centers within its sphere of influence. The Ukrainian people's aspirations for unity with their Belarusian kin shall have to wait for another day. Though the dream of a unified Eastern Slavic state remains alive in the hearts of many, for now, the two nations must tread separate paths. Perhaps a more auspicious time will come."
 UKR_events.21.a: "We accept Moscow's decision, though with great sorrow. Another day, perhaps."


 # Ukraine Demands Bessarabia (Ultimatum to the current controller)
 UKR_events.16.t: "The Bessarabian Ultimatum"
 UKR_events.16.d: "The government of Ukraine has issued a formal ultimatum regarding the historical lands of Bessarabia, Northern Bukovina, and Southern Bessarabia. These territories have been part of the Ukrainian historical homeland for centuries—inhabited by our kinfolk, sanctified by our ancestors, and torn from us by foreign powers. The Ukrainian people demand the return of their rightful lands. The foreign occupier now faces a simple choice: peacefully restore these ancestral territories to Ukraine, or face the consequences."
 UKR_events.16.a: "We accept Ukraine's legitimate demands. This land is rightfully Ukrainian."
 UKR_events.16.b: "We refuse! Ukraine's claims are baseless and will not be tolerated."
 # Ukraine Receives Bessarabia (Acceptance)
 UKR_events.17.t: "Bessarabia Returns to Ukraine!"
 UKR_events.17.d: "History shall record this day as a triumph of justice! The territories of Bessarabia, Northern Bukovina, and Southern Bessarabia have been peacefully restored to the Ukrainian motherland. The Ukrainian nation stands taller, its ancestral lands returning like long-lost sons to their mother's embrace. Our people celebrate from the Carpathian valleys to the Dnieper steppes—a new chapter in our national revival has begun. May these lands flourish under the Ukrainian banner!"
 UKR_events.17.a: "Glory to Ukraine! The land has returned home!"
 # Ukraine Gets War Goal on Bessarabia (Refusal)
 UKR_events.18.t: "Ultimatum Rejected – War is Inevitable"
 UKR_events.18.d: "[ROOT.GetNameWithFlag] has received the news: the foreign power controlling Bessarabia has rejected the ultimatum. The Ukrainian people shall not be denied what is rightfully theirs—now the only path forward is war. [ROOT.GetName] must prepare for armed conflict to liberate these ancestral lands. The sword will decide what diplomacy could not achieve."
 UKR_events.18.a: "We shall take back what is ours! To war!"

 # Ukraine Demands Crimea from the USSR
 UKR_events.13.t: "Ukraine Demands the Return of Crimea"
 UKR_events.13.d: "The Ukrainian government has addressed a formal request to Moscow regarding the status of Crimea. This ancient land—the cradle of Kyivan Rus civilization, the heart of our historical homeland—has been unjustly separated from Ukraine for too long. Crimean soil is soaked with the blood of Ukrainian Cossacks, the sweat of Ukrainian farmers, and the tears of Ukrainian families torn from their ancestral roots. The Ukrainian people demand the return of their sacred peninsula. The Soviet leadership now faces a historic choice: peacefully restore Crimea to Ukraine, or be remembered as the oppressor who denied a nation its birthright."
 UKR_events.13.a: "Crimea shall return to Ukraine! This is a just demand."
 UKR_events.13.b: "Ukraine's claims on Crimea are unfounded. The Soviet Union must preserve its territorial integrity."
 # Crimea Ceded to Ukraine (USSR accepts)
 UKR_events.14.t: "Crimea Returns to Ukraine!"
 UKR_events.14.d: "A new dawn breaks over the Black Sea! The ancient peninsula of Crimea—home to heroes, poets, and the cradle of Ukrainian history—has been peacefully restored to its rightful owners. From the cliffs of the Crimean Mountains to the shores of Sevastopol, Ukrainian flags fly once more over our ancestral lands. The Ukrainian people weep tears of joy as their brothers and sisters on the peninsula are finally reunited with the motherland. Sevastopol, Yalta, and Kerch—each city, each village, each stone of Crimea cries out: 'We are Ukraine!'"
 UKR_events.14.a: "Glory to Ukraine! Crimea has come home!"
 # USSR Rejects Ukrainian Claim to Crimea
 UKR_events.15.t: "Moscow's Refusal: Crimea Remains Under Soviet Rule"
 UKR_events.15.d: "The Soviet leadership has rejected Ukraine's demand for the return of Crimea. Moscow's decision is a blow to the Ukrainian national revival and a rejection of our people's historic ties to the peninsula. The Ukrainian government has received word from the Kremlin—Crimea shall remain under Soviet administration. This is not the end of the matter. The Ukrainian people will never forget Crimea, nor will they stop dreaming of the day when the peninsula returns to the embrace of its motherland."
 UKR_events.15.a: "We shall not forget Crimea. One day, it will return to Ukraine."

# Ukraine Demands Return of Ukrainian & Belarusian Lands in Eastern Poland
 UKR_events.22.t: "The Return of Eastern Polish Lands"
 UKR_events.22.d: "The Ukrainian government has formally requested that the Soviet Union restore the ancestral Ukrainian and Belarusian territories of Eastern Poland to their rightful owners. The lands of Volhynia, Eastern Galicia, and Polesia—home to millions of Ukrainians and Belarusians—were unjustly separated from their motherlands by the arbitrary borders of empires. These territories are not merely strategic possessions; they are the cradle of Ukrainian and Belarusian culture, hallowed by centuries of history, faith, and sacrifice. The Soviet leadership now faces a historic choice: peacefully return these lands to Ukraine and Belarus, or be remembered as the oppressor who denied entire nations their birthright."
 UKR_events.22.a: "We accept Ukraine's just demands. These lands belong to Ukraine and Belarus."
 UKR_events.22.b: "We refuse! These territories are integral to the Soviet Union."
 # Acceptance – Eastern Polish Lands Returned
 UKR_events.23.t: "Eastern Polish Lands Return to Ukraine and Belarus!"
 UKR_events.23.d: "History has been set right! The Ukrainian and Belarusian territories of Eastern Poland—Volhynia, Eastern Galicia, and Polesia—have been peacefully restored to their motherlands. Ukrainian and Belarusian flags now wave over cities and villages that have longed for this day: Lviv, Lutsk, Rivne, Brest, and hundreds of other communities rejoice. This is a triumph of justice and a testament to the unbreakable brotherhood of the Eastern Slavic peoples. May these lands flourish under the banners of Ukraine and Belarus!"
 UKR_events.23.a: "Glory to Ukraine! Glory to Belarus! Our lands have come home!"
 # Refusal – USSR Rejects the Demand
 UKR_events.24.t: "Moscow's Refusal: Eastern Polish Lands Remain Soviet"
 UKR_events.24.d: "The Soviet leadership has rejected Ukraine's request for the return of Eastern Polish territories. Moscow has decided to preserve its control over Volhynia, Eastern Galicia, and Polesia, denying Ukrainians and Belarusians their ancestral homelands. The Ukrainian government expressed deep disappointment but respects the decision—for now. However, the dream of reunification lives on in the hearts of millions, and the Ukrainian people will never cease to remember their brothers and sisters living under foreign rule."
 UKR_events.24.a: "We shall not forget our brothers and sisters across the border. One day, we shall be united."

 LAT_Construction_of_the_kegum_hydroelectric_power_plant:0 "Construction of the Kegum Dam"
 LAT_Construction_of_the_kegum_hydroelectric_power_plant_desc:0 "The Kegum Hydroelectric Power Plant is a monumental project that will harness the power of the Daugava River to provide clean, renewable energy for Latvia. This initiative will not only supply electricity to our growing industries and urban centers but also create jobs and stimulate economic growth. By investing in this infrastructure, we are taking a significant step towards energy independence and sustainability for our nation."
 CZE_sorb_integration:0 "Sorb Integration"
  CZE_sorb_integration_desc:0 "The Sorbs, a Slavic minority in our nation, have long been marginalized and underrepresented. By integrating the Sorb community into the political, social, and economic fabric of our country, we can ensure that their voices are heard and their rights are protected. This initiative will promote cultural diversity, strengthen national unity, and foster a more inclusive society for all citizens."
   POL_Construct_Hydroelectric_Power_Plants:0 "Construct Hydroelectric Power Plants"
 POL_Construct_Hydroelectric_Power_Plants_desc:0 "The construction of hydroelectric dams in Rożnów and Myczkowce will ensure that our industry can grow."
 POL_Expansion_Of_New_Towns:0 "Expansion of New Towns"
 POL_Expansion_Of_New_Towns_desc:0 "It is not enough for towns to be established to thrive - they must also be supported to reach their full potential."
 POL_Start_The_Fifteen_Year_Plan:0 "Start the Fifteen Year Plan"
 POL_Start_The_Fifteen_Year_Plan_desc:0 "The time has come to lay the foundation for making the entirety of Poland a developed nation. A fifteen year investment program will guide us to first world status."
 POL_Electrification_of_the_Countryside:0 "Electrification of the Countryside"
 POL_Electrification_of_the_Countryside_desc:0 "Bringing reliable electrical power to the most remote towns and villages will ensure that modern industries can develop whilst boosting our government's popular support in rural areas."
 POL_Phase_I_Military_Rearmament:0 "Phase I§H:§! Military Rearmament"
 POL_Phase_I_Military_Rearmament_desc:0 "The first phase of our 15-year plan calls for a rapid expansion of our homeland defense industries. A full modernization program is planned for the Polish armed forces to be completed by 1942."
 POL_Phase_II_Infrastructure_Development:0 "Phase II§H:§! Infrastructure Development"
 POL_Phase_II_Infrastructure_Development_desc:0 "The second phase of our 15-year plan calls for a heavy emphasis on upgrading Poland's infrastructure. By paving rural roads and constructing new highways, much of the countryside can be made suitable for automobiles."
 POL_Phase_III_Agriculture_and_Education:0 "Phase III§H:§! Agriculture and Education"
 POL_Phase_III_Agriculture_and_Education_desc:0 "The third phase of our 15-year plan calls for the modernization of Poland's agriculture. By providing rural peasants with combines, tractors, and heavy machinery plus the technical educational training to maintain them, agricultural exports can become competitive again."
 POL_Phase_IV_Urbanization:0 "Phase IV§H:§! Urbanization Incentives"
 POL_Phase_IV_Urbanization_desc:0 "The fourth phase of our 15-year plan calls for the rapid urbanization of the country. By investing in the development of cities, creating new job opportunities, and providing generous subsidies, rural peasants will be encouraged to migrate to urban centers."
 POL_Phase_V_Equalize_Poland_A_and_B:0 "Phase V§H:§! Equalize Poland 'A' and Poland 'B'"
 POL_Phase_V_Equalize_Poland_A_and_B_desc:0 "The fifth phase of our 15-year plan will finally eliminate the income inequalities between western and eastern Poland. By draining the swamps within eastern Poland and funneling development aid into the region, increased trade and economic growth will result."
