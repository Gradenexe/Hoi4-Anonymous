l_english:
 SOV_bringing_breakaways_back_to_the_fold_alt:0 "Bringing Breakaways Back to the Fold"
 SOV_bringing_breakaways_back_to_the_fold_alt_desc:0 "The Soviet Union must be reunited. We will bring the breakaway republics back into the fold, by force if necessary."
 UKR_german_tank_licences:2 "[GetBalticAxisInvesmentsAdj] Tank Licences"
 UKR_german_tank_licences_desc:1 "[GetGermanTankLicencesDesc]"
 UKR_focus_on_the_interior_2:0 "Prepare for the Germans"
 UKR_focus_on_the_interior_2_desc:0 "It is vital that we do not forget the absolute brutality that the Freikorps brought to [Root.GetNameDef] so many years ago. Peasants and workers were butchered as if animals, entire villages reduced to ash and ruin, and we cannot allow the [Root.GetAdjective] people to ever endure such brutality again."
 UKR_restore_workers_republic:0 "Restore the Worker’s Republic"
 UKR_restore_workers_republic_desc:0 "During our struggle for independence, the Soviets aided the creation of a [Root.GetAdjective] Worker’s Republic. Although the republic failed, its leaders remain alive in both [Root.GetNameDef] and [SOV.GetNameDef], hence hope for the worker’s republic remains!"
 UKR_original_designs:0 "Original Designs"
 UKR_original_designs_desc:0 "From our nation’s birth in 1918 to the present day, [Root.GetNonIdeologyName] has equipped its armies with arms from the Brits, but no more. We cannot rely on the Brits any longer, we must look forward and begin manufacturing weaponry of [Root.GetNonIdeologyAdjective] origin."
 UKR_focus_on_the_interior:0 "Focus on the Interior"
 UKR_focus_on_the_interior_desc:0 "Though many workers are eager to march on our neighbours and bring our glorious revolution to all Ukrainian peoples, we must instead focus on the interior of our nation; stabilizing the regime following the revolution."
 UKR_ford_motors:0 "[Root.Capital.GetName] Ford Industry"
 UKR_ford_motors_desc:0 "Ford motor company have done a fine job of providing mass-produced affordable motor vehicles to the Americans and other Allied nations throughout the world. If we should establish a Ford manufactory in [Root.Capital.GetName], we will be able to both provide vehicles for our own army and make a tidy profit exporting them to the West."
 UKR_revolutionary_cabinet:0 "A Revolutionary Cabinet"
 UKR_revolutionary_cabinet_desc:0 "Now that we have returned to our rightful place as the stalwart sentinels of the lower-class, we may once again assemble a cabinet of ministers aligned with the ideology of our new state."
 UKR_unchain_education:0 "Unchain Our Education"
 UKR_unchain_education_desc:0 "The [Root.GetNonIdeologyAdjective] educational system has long been restricted by our disparate population centres, but now with rural folk moving closer to the cities, we shall be more capable of efficiently educating the [Root.GetNonIdeologyAdjective] youth."
 UKR_baltic_fleet:0 "The Ukrainian Fleet"
 UKR_baltic_fleet_desc:0 "While the [Root.GetNonIdeologyAdjective] fleet is scarcely the envy of the world, with proper investment it may yet prove to be able to defend [Root.GetNonIdeologyName] from any attempted invasions on the sea."
 UKR_align_paramilitarists:0 "Realign the Paramilitarists"
 UKR_align_paramilitarists_desc:0 "There are many paramilitary groups throughout [Root.GetNameDef], most of which are devoted solely to the protection of [Root.GetAdjective] self-determination. While admirable, it would be preferred if these groups were to see us not as [SOV.GetAdjective] puppets, but as the logical continuation of the [Root.GetAdjective] state."
 UKR_rejoin_the_railways:0 "Rejoin the Railways"
 UKR_rejoin_the_railways_desc:0 "The Russians and the Germans who occupied us have seen us as nothing more than a rural backwater, but no more. [ROOT.GetNonIdeologyName] shall be industrialized to its maximum potential starting with an upgrade of our railways and infrastructure."
 UKR_rebuild_forts:0 "Rebuild the [Root.Capital.GetName] Forts"
 UKR_rebuild_forts_desc:0 "During the independence wars, [Root.Capital.GetName] was more a fort than a city. Although the fortifications have largely been dismantled and forgotten, they must be rebuilt and maintained, ready for war."
 UKR_british_aircraft:1 "[GetBritAircraftManufTitle]"
 UKR_british_aircraft_desc:1 "[GetBritAircraftManufDesc]"
 UKR_UNIFIED_communism:0 "Ukrainian-Belarusian Soviet Republic"
 UKR_UNIFIED_communism_DEF:0 "the Ukrainian-Belarusian Soviet Republic"
 UKR_UNIFIED_communism_ADJ:0 "Ukrainian-Belarusian"
 UKR_communist_opposition:0 "Enter Opposition"
 UKR_communist_opposition_desc:0 "The Soviet Union has proven itself to be no friend to [Root.GetNameDef] nor its people and we would be fools to hand the keys to [Root.GetNameDef] over to the vultures of the Red Army who want nothing more than to plunder the [Root.GetAdjective]. They are no more trustworthy than the capitalists, and if the [Root.GetCommunistParty] are to succeed, it must be done alone!"
 UKR_influence_neighbours:0 "Influence the Neighbours"
 UKR_influence_neighbours_desc:0 "Although not nearly as popular as it was before the wars of independence, the concept of a freed Ukrainian under socialism is as old as the concept of Ukrainian self-determination itself. Our state can stand as something to be modelled by those living under the oppressive regimes of the Ukrainian dictatorships and by weaponizing that, we stand to spread the Revolution to our neighbours bloodlessly."
 UKR_soviet_military_staff:0 "Soviet Military Staff"
 UKR_soviet_military_staff_desc:0 "After the [Root.GetAdjective] Worker’s Republic was disbanded, our military staff largely went into exile in the USSR. They must be brought home."
 UKR_arm_the_nation:0 "Arm the Nation"
 UKR_arm_the_nation_desc:0 "All across [Root.GetNonIdeologyName] there are men ready to face the oncoming threat of a Soviet invasion but lack the equipment to do so. We must ready our arms industry for the rapid production of infantry equipment."
 UKR_sieze_the_means_of_production:0 "Seize the Means of Production"
 UKR_sieze_the_means_of_production_desc:0 "The old government invited investors from overseas to exploit the labour of the [Root.GetAdjective] people. We cannot continue to allow the hands of the proletariat to serve their foreign bourgeoisie masters and all factories constructed by these multinational corporations must be taken into the custody of [Root.GetNameDef]."
 UKR_concessions_for_catholics:0 "Concessions for Catholics"
 UKR_concessions_for_catholics_desc:0 "Much of [Root.GetNameDef]’s lower classes are devout Catholics, and in the first Worker’s Republic, religious practice was harshly stamped out by the Red Army. This turned many of [Root.GetNameDef]’s poor against the revolution, so if we are to truly be the republic of the people, we must assure them in no uncertain terms that their faith will be protected."
 UKR_western_revolution:0 "Carry the Revolution West"
 UKR_western_revolution_desc:0 "The revolution does not stop in the Ukrainian. Almost the entirety of Europe’s lower-classes slave away in factories under the rigid boot of capitalism, and only [Root.GetAdjective] workers are capable of liberating them."
 UKR_eastwall:0 "Eastwall"
 UKR_eastwall_desc:0 "The Germans anticipate an attack from the East as much as we do and German officials would be well-advised to fortify our border with as much vigor as their own."
 UKR_united_baltic_ssr:0 "A United Eastern Slavic SSR"
 UKR_united_baltic_ssr_desc:0 "Similar to the Lithuanian-Belarusian SSR, a United Ukraine-Belarusian SSR would be a harmonious fusion of these two seemingly different peoples. Socialism knows no boundaries of culture and language, and we see little reason why Ukrainian and Belorussian workers could not co-exist."
 UKR_autobahn:0 "[Root.GetAdjective] Autobahn"
 UKR_autobahn_desc:0 "It matters little how well industrialized [Root.GetNonIdeologyName] is if her infrastructure does not facilitate a rapid and continuous influx of labour. By modelling our infrastructure sector after that of the Reich, we may achieve the efficiency they have."
 UKR_secure_military_support:0 "Secure Military Support"
 UKR_secure_military_support_desc:0 "Many in the military would seek to rid the nation of [Root.GetLeader], all we need do is approach them. A general seeking honour and renown would surely be drawn to our cause with the promise of becoming a hero of the people."
 UKR_renew_allied_trade:1 "[GetBalticRenewAlliedTradeTitle]"
 UKR_renew_allied_trade_desc:1 "[GetBalticRenewAlliedTradeDesc]"
 UKR_axis_investments:2 "Seek [GetBalticAxisInvesmentsAdj] Investments"
 UKR_axis_investments_desc:2 "[GetBalticAxisInvesmentsDesc]"
 UKR_attract_workers_to_capital:0 "Attract Workers to [Root.Capital.GetName]"
 UKR_attract_workers_to_capital_desc:0 "The workers of [Root.GetNonIdeologyName] are spread disparately across the countryside, often working in the outdated agricultural sector. If we want to industrialize our nation for war, we must attract workers to the factories of [Root.Capital.GetName]!"
 UKR_allied_shipments:0 "Increase Allied Shipments"
 UKR_allied_shipments_desc:1 "Since 1918, the [Root.GetNonIdeologyAdjective] army has been equipped with shipments sent to us from Great Britain and we should make efforts to make the Allies understand that unless shipments are drastically increased, [Root.GetNonIdeologyName] may become subject to another Soviet puppet government."
 UKR_free_the_workers_of_poland:0 "Free the Workers of Poland"
 UKR_free_the_workers_of_poland_desc:0 "Though the Poles once ruled the Ukrainian, they are now prey vulnerable to the predatory regime of [GER.GetNameDef]. We must defend our comrades in the South and unite them under a Polish Socialist Republic!"
 UKR_arms_industry:0 "Complete the Armament"
 UKR_arms_industry_desc:0 "Now that the modernization of our industry is complete and we have countless domestic military industrial organizations operating within our country, the [Root.GetAdjective] arms industry may finally live up to its true potential!"
 UKR_red_army:0 "[Root.GetAdjective] Red Riflemen"
 UKR_red_army_desc:0 "Our army must be made up of only those willing to defend socialism within [Root.GetNameDef] and spread it amongst the populace of the world, and this may only be achieved by restoring the [Root.GetAdjective] Red Riflemen."
 UKR_finnish_invasion:0 "Finnish Invasion"
 UKR_finnish_invasion_desc:0 "Finland is to us a lost brother bound under the shackles of capitalism. Only by violent revolution can Finland be freed just as the Ukraine have been freed."
 UKR_trade_with_neighbors:0 "Trade with the Neighbors"
 UKR_trade_with_neighbors_desc:0 "Each time we invest trade into the Germans or the Soviets, we are contributing to our own doom. We cannot allow enemy troops to invade [Root.GetNonIdeologyName] with Lithuanian grain in their rations and Estonian oil in their tanks made from Latvian steel. We must instead aid each other to defeat our common enemy."
 UKR_forment_disloyalty:0 "Unite the Opposition"
 UKR_forment_disloyalty_desc:0 "There are many movements both within and without the [Root.GetAdjective] government and if we are to overthrow the current tyranny that plagues [Root.GetNameDef], we must become the unifying voice of opposition to [Root.GetNeutralParty]!"
 UKR_arm_baltic_reds:0 "Arm Ukrainian Reds"
 UKR_arm_baltic_reds_desc:0 "The stage is set, communist fervor is burning all across the Ukraine. All the reds need now is the signal and resources from us and we will spark the Ukrainian revolution!"
 UKR_end_bourgeouis_dictatorships:0 "Unification with Moldavian SSR"
 UKR_end_bourgeouis_dictatorships_desc:0 "The Ukraine are dominated by so-called “neutral” dictators. With the backing of the military and without consent of their people, the proletariat of the Ukrainian are oppressed under capitalist dictatorship. It is only by the hands of freed [Root.GetAdjective] workers that these workers kept separate by unjust borders may share in our glorious liberation!"
 UKR_path_to_the_north_sea:0 "A Path to the Mediterranean"
 UKR_path_to_the_north_sea_desc:0 "The Danes have remained woefully neutral in this escalating global conflict, and the straits of Denmark are all that separate the socialist world from the North Sea."
 UKR_modernize_industry:0 "Modernize Our Industry"
 UKR_modernize_industry_desc:0 "For too long, [Root.GetNonIdeologyName]’s output has been defined by agriculture but no more. We must concentrate our industry around the major city centers in each state if we are to turn [Root.GetNonIdeologyName] into a modern economy."
 UKR_seek_support_of_soviets:0 "Seek the Support of the Soviets"
 UKR_seek_support_of_soviets_desc:0 "Although the Red Army laid waste to [Root.GetNameDef] and brought our nation into a new era of Russian imperialism, we are without a chance to bring socialism to [Root.GetNameDef] without their assistance."
 UKR_overthrow_the_government:0 "Overthrow [Root.GetNeutralParty]"
 UKR_overthrow_the_government_desc:0 "We have gathered enough support to topple [Root.GetLeader] and [Root.GetLeader.GetHerHis] regime! All we need do is march on the capital and proclaim a new Worker’s Republic!"
 UKR_domestic_motors:0 "A Domestic Motor Company"
 UKR_domestic_motors_desc:0 "Foreign designs are fine, but we cannot rely on them in perpetuity. [Root.GetNonIdeologyName] is a proud nation, and we must show the world that our designers and thinkers are just as adequate as those from the West."
 UKR_soviet_volunteer_forces:0 "Soviet Volunteer Forces"
 UKR_soviet_volunteer_forces_desc:0 "The USSR is practically overflowing with men ready to fight and die for the world revolution. Though [Root.GetNameDef] is just a mere stepping-stone in the fight for a communist world, there is no shortage of brave Russian socialists ready to die for our cause."
 UKR_end_swedish_neutrality:0 "End Yugoslav Neutrality"
 UKR_end_swedish_neutrality_desc:0 "What the Yugoslavs call neutrality is nothing but weakness; bending to the whims of whichever power seems most powerful at the time with little regard for the wellbeing of the lower classes across their borders. Such a weak-willed and flimsy government is unworthy of sharing our border and we must create a new Yugoslavia with the spine to defend its people from tyranny."
 UKR_soviet_equipment:0 "Soviet Equipment"
 UKR_soviet_equipment_desc:0 "We cannot hope to topple the government without first gaining access to weapons and materials necessary to arm our militia. By reaching out to the Russians for assistance, we will gain extra armaments to support our armies, should the old government attempt to halt the revolution."
 UKR_squash_resistance:0 "Squash All Resistance"
 UKR_squash_resistance_desc:0 "There are still yet people who believe socialism to be the enemy of [Root.GetAdjective] sovereignty, and these people must be rooted out if we are to advance the revolution."
 UKR_german_baltic_industry:1 "Axis-Ukrainian Industry"
 UKR_german_baltic_industry_desc:1 "[GetGermanBalticIndustryDesc]"
 UKR_balticwall:0 "Black Sea Wall"
 UKR_balticwall_desc:0 "Fortifications in the east are worthless if our enemies choose instead to perform an attack from the sea! We may never build a navy to rival the British, Germans, or Soviets, but we can do what we can to render them helpless against our coastal defences."
 UKR_technology_sharing:0 "Technology Sharing"
 UKR_technology_sharing_desc:0 "We produce many of our partner’s equipment already, but perhaps by studying their designs we shall be able to significantly improve native [Root.GetNonIdeologyAdjective] designs."
 UKR_school_of_aviation:1 "Ukrainian School of Aviation"
 UKR_school_of_aviation_desc:0 "During the independence war, the struggle for control of the air and sea was fought by the British on our behalf, but as the Brits continue to grant concession after concession to the Nazi menace, we cannot trust that they will defend us again. We must take to the air ourselves!"
 UKR_crossley_motors:0 "[Root.Capital.GetName]-Crossley Motors"
 UKR_crossley_motors_desc:1 "With foreign investment now rife within our nation and production of automobiles in reasonable efficiency, we may be able to collaborate with the Crossley Motor Company to create original designs for use within the [Root.GetNonIdeologyAdjective] army!"
 UKR_belarus_ssr:0 "[Root.GetNonIdeologyName]-Belarus SSR"
 UKR_belarus_ssr_desc:0 "The concept of uniting Belarus and the Ukrainian is not a foreign one. Long ago the Lithuanian-Belarus Soviet Socialist Republic existed as a harmonious fusion of these two seemingly different peoples. Socialism knows no boundaries of culture and language, and we see little reason why [Root.GetAdjective] and Belorussian workers could not co-exist."
 UKR_purge_of_our_own:0 "A Purge of Our Own"
 UKR_purge_of_our_own_desc:0 "Even through our best efforts to squash all resistance, there are still those organizing in the shadows, conspiring against the proletariat to restore a capitalist dictatorship in [Root.GetNonIdeologyName]. We must conduct a popular purge; rooting out any members of the old government and any who support them."
 UKR_invest_in_baltic_trade:0 "Invest in Ukrainian Trade"
 UKR_invest_in_baltic_trade_desc:0 "The Black Sea is rich with trade from Scandinavia, Germany, and Russia and our ports can scarcely contain them all. We must open up new trade lines with our friends who share this sea with us for a brighter and more prosperous [Root.GetNonIdeologyName]!"
 UKR_request_german_support:2 "Request [GetBalticAxisInvesmentsAdj] Support"
 UKR_request_german_support_desc:1 "[GetRequestGermanSupportDesc]"
 UKR_german_war_economics:1 "Adopt [GetBalticAxisInvesmentsAdj] War Economics"
 UKR_german_war_economics_desc:1 "[GetGermanWarEconomicsDesc]"
 UKR_direct_intervention:0 "Direct Soviet Intervention"
 UKR_direct_intervention_desc:0 "We have proven unable to reclaim the government alone and we must call upon our allies in [SOV.GetNameDef] to aid us in our struggle."
 UKR_natural_resources:0 "Develop Natural Resources"
 UKR_german_tank_licences:2 "[GetBalticAxisInvesmentsAdj] Tank Licences"
 UKR_german_tank_licences_desc:1 "[GetGermanTankLicencesDesc]"
