 SIK_part_of_the_ussr:0 "Part of the Soviet Union"
 SIK_part_of_the_ussr_desc:0 "With deepening socialist influence and military ties to Moscow, Sinkiang officially transitions into a full-fledged Soviet Republic. Integrating our administration with the USSR ensures stability, industrial modernization, and ideological unity with the Comintern." 
  sterbenka.1.t:0 "Fall of the Soviet Union"
 sterbenka.1.d:0 "The Soviet Union has collapsed. With the loss of their major cities and critical industrial centers, the Red Army is in disarray. Across the vast expanses of the crumbling empire, subject nations and oppressed peoples are seizing the opportunity to break their chains and declare independence."
 sterbenka.1.a:0 "A new era begins."
 sterbenka.1.b:0 "We will never surrender!"

 sterbenka.2.t:0 "Bukhara Rebellion"
 sterbenka.2.d:0 "The people of Bukhara have risen up in armed rebellion! Fed up with foreign rule and central oppression, local militias have seized control of key governmental buildings and declared the independence of Bukhara."
 sterbenka.2.a:0 "Take control of Bukhara."
 sterbenka.2.b:0 "Crush the rebellion!"
 sterbenka.2.c:0 "Let them have their independence."

 sterbenka.3.t:0 "Karakalpakstan Rebellion"
 sterbenka.3.d:0 "Tensions in the region have finally boiled over. The Karakalpaks have taken up arms, declaring sovereignty and the creation of an independent Karakalpakstan state. They are rallying local forces to defend their newly proclaimed borders."
 sterbenka.3.a:0 "Take control of Karakalpakstan."
 sterbenka.3.b:0 "Crush the rebellion!"
 sterbenka.3.c:0 "Let them have their independence."

 sterbenka.4.t:0 "Khiva Rebellion"
 sterbenka.4.d:0 "Rebels in Khiva have formally declared independence! Armed insurgents have overwhelmed local garrisons, challenging our authority and establishing their own provisional government in the region."
 sterbenka.4.a:0 "Take control of Khiva."
 sterbenka.4.b:0 "Crush the rebellion!"
 sterbenka.4.c:0 "Let them have their independence."

 sterbenka.5.t:0 "Abkhazia Rebellion"
 sterbenka.5.d:0 "Abkhazian separatists have seized control of the region. Taking advantage of the chaos, they have expelled our administrators and declared an independent Republic of Abkhazia, ready to fight for their freedom."
 sterbenka.5.a:0 "Take control of Abkhazia."
 sterbenka.5.b:0 "Crush the rebellion!"
 sterbenka.5.c:0 "Let them have their independence."

 sterbenka.6.t:0 "Crimean Rebellion"
 sterbenka.6.d:0 "The Crimean peninsula is in turmoil! Local forces have risen up in a coordinated rebellion, seizing strategic ports and military installations to declare an independent Crimea."
 sterbenka.6.a:0 "Take control of Crimea."
 sterbenka.6.b:0 "Crush the rebellion!"
 sterbenka.6.c:0 "Let them have their independence."
 POL_pilsutskij_dreams_of_federation:0 "Pilsudski's Dreams of Federation"
 POL_pilsutskij_dreams_of_federation_desc:0 "Józef Piłsudski's vision of an Intermarium—a federation of Central and Eastern European countries—was meant to counterbalance Russian and German imperialism. We must revive this grand design to secure our collective independence."
 
 POL_give_ukraine_autonomy:0 "Give Ukraine Autonomy"
 POL_give_ukraine_autonomy_desc:0 "To ensure the loyalty of our Ukrainian minority and lay the groundwork for a broader federation, we must grant them significant regional autonomy."
 
 POL_give_WUPR_for_federation:0 "Give WUPR for Federation"
 POL_give_WUPR_for_federation_desc:0 "Establishing the West Ukrainian People's Republic as a constituent member of our federation will solidify our eastern flank and rally Ukrainian patriots to our cause."
 
 POL_give_belarus_autonomy:0 "Give Belarus Autonomy"
 POL_give_belarus_autonomy_desc:0 "The Belarusian people deserve a voice in their own affairs. Granting them autonomy will win their support and reduce regional tensions."
 
 POL_give_WBPR_for_federation:0 "Give WBPR for Federation"
 POL_give_WBPR_for_federation_desc:0 "By formalizing the West Belarusian People's Republic, we take another vital step toward a united, federal commonwealth capable of resisting foreign aggression."
 
 POL_give_lithuania_autonomy:0 "Give Lithuania Autonomy"
 POL_give_lithuania_autonomy_desc:0 "Rebuilding bridges with the Lithuanians requires compromises. Recognizing their autonomy is the first step toward restoring the historical Polish-Lithuanian union."
 
 POL_give_ELPR_for_federation:0 "Give ELPR for Federation"
 POL_give_ELPR_for_federation_desc:0 "Creating the East Lithuanian People's Republic brings the region firmly into our federal system, ensuring peace and cooperation between our peoples."
 
 POL_give_vilno_to_belarus:0 "Give Vilno to Belarus"
 POL_give_vilno_to_belarus_desc:0 "Transferring the administration of the Vilno region to Belarus is a difficult choice, but a necessary diplomatic maneuver to stabilize our eastern borders and satisfy internal federal demands."
 
 POL_fortify_kashubia_and_silesia:0 "Fortify Kashubia and Silesia"
 POL_fortify_kashubia_and_silesia_desc:0 "The western frontier is vulnerable. We must construct extensive fortifications in Kashubia and Silesia to deter any aggressive moves from Germany."
 
 POL_autonomy_for_kashubia_and_silesia:0 "Autonomy for Kashubia and Silesia"
 POL_autonomy_for_kashubia_and_silesia_desc:0 "Providing political autonomy to Kashubia and Silesia will strengthen national unity and encourage local populations to passionately defend their homelands."
 
 POL_autonomy_for_all:0 "Autonomy for All"
 POL_autonomy_for_all_desc:0 "A true federation thrives on the liberty of its parts. We shall enact sweeping reforms granting autonomy to all major ethnic and regional groups within our borders."
 
 POL_territory_for_guarantee:0 "Territory for Guarantee"
 POL_territory_for_guarantee_desc:0 "We can offer certain disputed territories to our neighbors in exchange for strict, binding security guarantees. Land can be regained, but survival is paramount."
 
 POL_united_by_will:0 "United by Will"
 POL_united_by_will_desc:0 "Our federation will not be bound by force, but by the shared desire for freedom, prosperity, and mutual defense against tyranny."
 
 POL_unite_the_federation:0 "Unite the Federation"
 POL_unite_the_federation_desc:0 "The time has come to officially proclaim the creation of our new federation. From the Baltic to the Black Sea, we stand as one!"
 
 POL_defence_army_of_federation:0 "Defence Army of Federation"
 POL_defence_army_of_federation_desc:0 "To protect our massive new borders, we must integrate the armed forces of all member states into a single, unified Defence Army of the Federation."
 
 POL_integrate_lubush:0 "Integrate Lubush"
 POL_integrate_lubush_desc:0 "The Lubush region must be fully integrated into our administrative and military structure to ensure the stability of the western frontier."
 
 POL_no_more_polonization:0 "No More Polonization"
 POL_no_more_polonization_desc:0 "We must abandon aggressive cultural assimilation. Embracing the diverse cultures of our federation will make us stronger than forced homogeneity ever could."
 
 POL_dreams_come_true:0 "Dreams Come True"
 POL_dreams_come_true_desc:0 "Piłsudski's grand vision is finally a reality. We have forged an unstoppable alliance in Eastern Europe that will echo through history."
 
 POL_commonwealth_of_many_nations:0 "Commonwealth of Many Nations"
 POL_commonwealth_of_many_nations_desc:0 "We are no longer just Poland; we are the Commonwealth of Many Nations, a bastion of liberty and diversity standing tall against totalitarianism."
 
 POL_complete_the_mission_of_prometheism:0 "Complete the Mission of Prometheism"
 POL_complete_the_mission_of_prometheism_desc:0 "Prometheism aimed to weaken the Russian Empire by supporting nationalist independence movements. Now, we will finish what we started and dismantle the Soviet menace from within."
 
 POL_unite_west_republics:0 "Unite West Republics"
 POL_unite_west_republics_desc:0 "Bringing the western republics under a single, unified administrative umbrella will streamline our economy and solidify our military readiness."

 SOV_winter_war:0 "The Winter War"
 SOV_winter_war_desc:0 "Finland's refusal to cede vital border territories near Leningrad leaves us no choice. We must secure our strategic objectives by force if necessary."
 
 SOV_create_finnish_democratic_republic:0 "Create Finnish Democratic Republic"
 SOV_create_finnish_democratic_republic_desc:0 "By establishing a friendly, socialist government in Finland, we can ensure that our northern border remains eternally secure from imperialist threats."
 
 SOV_create_finnish_karelian_SSR:0 "Create Karelo-Finnish SSR"
 SOV_create_finnish_karelian_SSR_desc:0 "Integrating the conquered Finnish territories into the Karelo-Finnish SSR will firmly bind the region to the Soviet Union and project our power into Scandinavia."
 
 SOV_karelia_for_gold:0 "Karelia for Gold"
 SOV_karelia_for_gold_desc:0 "Extensive resource extraction and industrial investments in Karelia will yield massive economic benefits for the Soviet war machine."
 
 SOV_triumphant_return_to_helsinki:0 "Triumphant Return to Helsinki"
 SOV_triumphant_return_to_helsinki_desc:0 "The Red Army marches victoriously into Helsinki. We have achieved what the Tsars could only dream of—total hegemony over the Baltic north."
 
 SOV_the_extension_of_the_autonomy_of_the_moldavian_ASSR:0 "Extend the Autonomy of the Moldavian ASSR"
 SOV_the_extension_of_the_autonomy_of_the_moldavian_ASSR_desc:0 "Granting further autonomy to the Moldavian ASSR will empower the local proletariat and provide a staging ground for our future ambitions in the Balkans."
 
 SOV_great_moldovian_SSR:0 "Great Moldavian SSR"
 SOV_great_moldovian_SSR_desc:0 "With the integration of Bessarabia, the Moldavian ASSR is elevated to the status of a full Union Republic—the Great Moldavian SSR!"
if_focus_will_be_set_automatically_tt:0 "This focus will be completed automatically once conditions are met."
sterbenka.1.t:0 "Fall of the Soviet Union"
 sterbenka.1.d:0 "The Soviet Union has collapsed. With the loss of their major cities and critical industrial centers, the Red Army is in disarray. Across the vast expanses of the crumbling empire, subject nations and oppressed peoples are seizing the opportunity to break their chains and declare independence."
 sterbenka.1.a:0 "A new era begins."
 sterbenka.1.b:0 "We will never surrender!"

 sterbenka.2.t:0 "Bukhara Rebellion"
 sterbenka.2.d:0 "The people of Bukhara have risen up in armed rebellion! Fed up with foreign rule and central oppression, local militias have seized control of key governmental buildings and declared the independence of Bukhara."
 sterbenka.2.a:0 "Take control of Bukhara."
 sterbenka.2.b:0 "Crush the rebellion!"
 sterbenka.2.c:0 "Let them have their independence."

 sterbenka.3.t:0 "Karakalpakstan Rebellion"
 sterbenka.3.d:0 "Tensions in the region have finally boiled over. The Karakalpaks have taken up arms, declaring sovereignty and the creation of an independent Karakalpakstan state. They are rallying local forces to defend their newly proclaimed borders."
 sterbenka.3.a:0 "Take control of Karakalpakstan."
 sterbenka.3.b:0 "Crush the rebellion!"
 sterbenka.3.c:0 "Let them have their independence."

 sterbenka.4.t:0 "Khiva Rebellion"
 sterbenka.4.d:0 "Rebels in Khiva have formally declared independence! Armed insurgents have overwhelmed local garrisons, challenging our authority and establishing their own provisional government in the region."
 sterbenka.4.a:0 "Take control of Khiva."
 sterbenka.4.b:0 "Crush the rebellion!"
 sterbenka.4.c:0 "Let them have their independence."

 sterbenka.5.t:0 "Abkhazia Rebellion"
 sterbenka.5.d:0 "Abkhazian separatists have seized control of the region. Taking advantage of the chaos, they have expelled our administrators and declared an independent Republic of Abkhazia, ready to fight for their freedom."
 sterbenka.5.a:0 "Take control of Abkhazia."
 sterbenka.5.b:0 "Crush the rebellion!"
 sterbenka.5.c:0 "Let them have their independence."

 sterbenka.6.t:0 "Crimean Rebellion"
 sterbenka.6.d:0 "The Crimean peninsula is in turmoil! Local forces have risen up in a coordinated rebellion, seizing strategic ports and military installations to declare an independent Crimea."
 sterbenka.6.a:0 "Take control of Crimea."
 sterbenka.6.b:0 "Crush the rebellion!"
 sterbenka.6.c:0 "Let them have their independence."

 sterbenka.7.t:0 "Polish Proposal"
 sterbenka.7.d:0 "The Polish government has reached out to us with an unexpected proposal. In exchange for the return of our historical core territories currently under their administration, they demand that we accept the status of an integrated puppet within their proposed federation. The decision rests in our hands: do we sacrifice our sovereignty for land, or reject their overreach?"
 sterbenka.7.a:0 "We accept their terms."
 sterbenka.7.b:0 "We will never bow to Warsaw!"

 sterbenka.8.t:0 "Proposal Accepted"
 sterbenka.8.d:0 "Our diplomatic efforts have paid off. They have accepted our proposal, agreeing to become an integrated puppet of our nation in exchange for the promised territories. Our sphere of influence expands once more."
 sterbenka.8.a:0 "Excellent news."

 sterbenka.9.t:0 "Proposal Rejected"
 sterbenka.9.d:0 "Our proposal has been flatly rejected. It seems they value their independence over the return of their historical lands, leaving our territorial and diplomatic ambitions unfulfilled for now."
 sterbenka.9.a:0 "Fools..."
HUN_increase_economic_cooperation_anon_civ_tt:0 "Receives §Y2 offmap civilian factories§! for each country that has §G85§! opinion of Hungary.\n\nThe countries that can be effected are:\n- @ALB§H[ALB.getnamedefcap]§!\n- @BUL§H[BUL.getnamedefcap]§!\n- @GRE§H[GRE.getnamedefcap]§!\n- @YUG§H[YUG.getnamedefcap]§!\n- @GER§H[GER.getnamedefcap]§!\n- @ROM§H[ROM.getnamedefcap]§!\n- @CZE§H[CZE.getnamedefcap]§!\n- @ITA§H[ITA.getnamedefcap]§!\n- @AUS§H[AUS.getnamedefcap]§!"

AUS_increase_military_cooperation_tt:0 "Receives §Y2 offmap military factories§! for each country that has §G85§! opinion of Austria.\n\nThe countries that can be effected are:\n- @ALB§H[ALB.getnamedefcap]§!\n- @BUL§H[BUL.getnamedefcap]§!\n- @GRE§H[GRE.getnamedefcap]§!\n- @YUG§H[YUG.getnamedefcap]§!\n- @GER§H[GER.getnamedefcap]§!\n- @ROM§H[ROM.getnamedefcap]§!\n- @CZE§H[CZE.getnamedefcap]§!\n- @ITA§H[ITA.getnamedefcap]§!\n- @HUN§H[HUN.getnamedefcap]§!"

AUS_increase_economic_cooperation_tt:0 "Receives §Y2 offmap civilian factories§! for each country that has §G85§! opinion of Austria.\n\nThe countries that can be effected are:\n- @ALB§H[ALB.getnamedefcap]§!\n- @BUL§H[BUL.getnamedefcap]§!\n- @GRE§H[GRE.getnamedefcap]§!\n- @YUG§H[YUG.getnamedefcap]§!\n- @GER§H[GER.getnamedefcap]§!\n- @ROM§H[ROM.getnamedefcap]§!\n- @CZE§H[CZE.getnamedefcap]§!\n- @ITA§H[ITA.getnamedefcap]§!\n- @HUN§H[HUN.getnamedefcap]§!"
 AUS_civilian_support_from_guarantors:0 "Civilian Support from Guarantors"
 AUS_civilian_support_from_guarantors_desc:0 "By strengthening diplomatic ties and securing the economic backing of our regional guarantors, we can boost our industrial capacity through civil investments."
 AUS_military_support_from_guarantors:0 "Military Support from Guarantors"
 AUS_military_support_from_guarantors_desc:0 "Aligning our military objectives with our regional guarantors will allow us to expand our arms production and modernize our defense lines."
GRE_open_foreign_subsidized_factories_anon_tt:0 "Receives §Y1 arms factory§! and §Y1 civilian factory§! for each country that has §G80§! opinion of Greece.\n\nThe countries that can be effected are:\n- @ENG§H[ENG.getnamedefcap]§!\n- @FRA§H[FRA.getnamedefcap]§!\n- @GER§H[GER.getnamedefcap]§!\n- @SOV§H[SOV.getnamedefcap]§!"
GRE_bedrock_of_balkan_financial_stability_anon_tt:0 "Receives §Y1 civilian factory§! for each of these countries if their opinion of Greece exceeds §G50§!:\n- @ALB§H[ALB.getnamedefcap]§!\n- @BUL§H[BUL.getnamedefcap]§!\n- @HUN§H[HUN.getnamedefcap]§!\n- @YUG§H[YUG.getnamedefcap]§!\n\nReceives §Y2 civilian factories§! for each of these countries if their opinion of Greece exceeds §G75§!:\n- @AUS§H[AUS.getnamedefcap]§!\n- @ROM§H[ROM.getnamedefcap]§!\n- @TUR§H[TUR.getnamedefcap]§!\n\nReceives §Y3 civilian factories§! if their opinion of Greece exceeds §G85§!:\n- @CZE§H[CZE.getnamedefcap]§!"
SOV_gold_for_karelia_idea:0 "Gold for Karelia"
 SWI_bop_push_council_small:0 "Empower the Federal Council"
 SWI_bop_push_council_small_desc:0 "Grant broader legislative authority to the Federal Council, shifting the balance of power +15% towards central government control."

 SWI_bop_push_cantons_small:0 "Empower Cantonal Autonomy"
 SWI_bop_push_cantons_small_desc:0 "Devolve administrative powers back to individual cantons, shifting the balance of power +15% towards the cantons."

 SWI_bop_push_council_large:0 "Emergency Centralization Decree"
 SWI_bop_push_council_large_desc:0 "Pass an extraordinary decree by the Federal Assembly to forcefully shift the balance of power +30% towards the Federal Council."

 SWI_bop_push_cantons_large:0 "Cantonal Referendum on Autonomy"
 SWI_bop_push_cantons_large_desc:0 "Organize a sweeping nationwide vote granting sovereign prerogatives back to the cantons (+30% towards the cantons)."

 SWI_bop_campaign_council:0 "Centralization Press Campaign"
 SWI_bop_campaign_council_desc:0 "Fund a nationwide campaign advocating for unified federal coordination. Daily shifts power toward the Federal Council (+1.0%/day for 30 days)."

 SWI_bop_campaign_cantons:0 "Cantonal Liberties Campaign"
 SWI_bop_campaign_cantons_desc:0 "Finance regional assemblies defending the historic federalism of the Swiss cantons. Daily shifts power toward the Cantons (+1.0%/day for 30 days)."

 SWI_bop_reset_neutral:0 "Proclaim National Compromise"
 SWI_bop_reset_neutral_desc:0 "Convene all cantonal representatives and federal councilors to restore equilibrium and reset the balance of power back to the exact center (0%)."
 BUL_nationalization_seize_tt:0 "Based on foreign industrial investments in Bulgaria:\n- @GER §H[GER.GetNameDefCap]§!\n- @SOV §H[SOV.GetNameDefCap]§!\n- @ENG §H[ENG.GetNameDefCap]§!\nFor each foreign investment seized, Bulgaria gains §G+2§! Building Slots and §G+2§! Civilian Factories."
 POR_iberian_arsenal:0 "Iberian Arsenal"
 POR_iberian_arsenal_desc:0 "Portugal has long been a hub for arms manufacturing and export. By investing in our domestic arms industry, we can become a leading supplier of military equipment to our allies and bolster our own defense capabilities."

 POR_beauty_of_expansion_idea:0 "Beauty of Expansion"
 POR_beauty_of_expansion_idea_desc:0 "The historical legacy of Portuguese maritime discoveries and boundless global ambitions drives our nation forward. By expanding beyond our traditional borders, we forge a new destiny of strength and prosperity."

 ENG_evacuation_assets:0 "Evacuated Colonial Assets"
 ENG_evacuation_assets_desc:0 "Following the dissolution of our direct imperial governance, British assets, specialized heavy machinery, skilled engineers, and relocated reserves have been systematically repatriated to the British Isles, sparking an unprecedented domestic industrial resurgence."
 ENG_commonwealth_trade_preference:0 "Commonwealth Trade Preferences"
 ENG_commonwealth_trade_preference_desc:0 "Through long-standing bilateral agreements and mutual economic interdependence, newly independent post-colonial nations maintain exclusive trade privileges with Great Britain, securing cost-effective access to global resources"
 ENG_former_colony_trade_privilege:0 "Preferential Trade with Britain"

 uk_ireland_trade:0 "Anglo-Irish Trade Agreement"
 uk_ireland_trade_desc:0 "Establishing deep economic ties and bilateral trade agreements with Ireland guarantees cheaper resource exchange and mutual industrial development."
 uk_ireland_new_union:0 "The New Celtic Union"
 uk_ireland_new_union_desc:0 "With our economic foundations aligned, we invite Ireland into our alliance and open diplomatic channels for a closer federal partnership."
 uk_ireland_unification:0 "Anglo-Irish Unification"
 uk_ireland_unification_desc:0 "Through peaceful integration and historical reconciliation, Ireland formally reunites with Great Britain under a unified federal realm, granting full citizenship and integration across all Irish lands."
 ENG_Trade_with_ireland:0 "Trade with Ireland"
 ENG_Trade_with_ireland_desc:0 "Bilateral trade agreement providing reduced factory costs when importing resources from Ireland."
 IRE_Trade_with_britain:0 "Trade with Britain"
 IRE_Trade_with_britain_desc:0 "Bilateral trade agreement providing reduced factory costs when importing resources from Great Britain."
 ENG_ireland_integration_category:0 "Anglo-Irish Integration"
 ENG_ireland_integration_category_desc:0 "Diplomatic measures to restore federal ties with the Irish state."
 ENG_diplomatically_puppet_ireland:0 "Offer Dominion Status to Ireland"
 ENG_diplomatically_puppet_ireland_desc:0 "Propose an autonomous Dominion arrangement to the government in Dublin within our shared alliance."

 ENG_focus_on_europe:0 "Focus on Europe"
 ENG_focus_on_europe_desc:0 "With the dissolution of our colonial obligations, the British military command can now redirect its full strategic attention toward the European theatre, accelerating doctrinal refinement across all branches of the armed forces."
 ENG_home_fleet_concentration:0 "Home Fleet Concentration"
 ENG_home_fleet_concentration_desc:0 "Rather than maintaining a sprawling global naval presence, the Royal Navy shall concentrate its forces in home waters and the North Sea. Ships are cheaper to build, but our operational range is significantly reduced."
 ENG_domestic_air_industry:0 "Domestic Air Industry"
 ENG_domestic_air_industry_desc:0 "Prioritize the production of fast, nimble interceptors and close-air-support aircraft for the defence of the British Isles, while scaling down the costly strategic bomber and heavy fighter programmes."
 ENG_home_fleet_concentration_idea:0 "Home Fleet Concentration"
 ENG_home_fleet_concentration_idea_desc:0 "The Royal Navy has consolidated its fleets to home waters. All ship classes cost §G15%§! less to produce, but our maximum naval range is reduced by §R50%§!."
 ENG_domestic_air_industry_idea:0 "Domestic Air Industry"
 ENG_domestic_air_industry_idea_desc:0 "British aircraft factories prioritize light, agile fighters (§G-10%§! cost) at the expense of heavier strategic aircraft (§R+15%§! cost for medium and heavy planes)."

 ENG_european_refugees:0 "European Refugees"
 ENG_european_refugees_desc:0 "As the continent plunges into total war, countless individuals, skilled laborers, and academics flee the chaos to the sanctuary of the British Isles. Welcoming these waves of displaced people bolsters both our manpower reserves and domestic industrial capacity."
 ENG_european_refugees_tt:0 "Every nation in §YEurope§! currently §Rat war§! provides §G50,000§! Manpower to Great Britain."
 ENG_european_intelligence_hub:0 "Continental Intelligence Hub"
 ENG_european_intelligence_hub_desc:0 "Drawing from networks of continental exiles, resistance contacts, and deciphering services, London becomes the supreme coordination nexus for intelligence, espionage, and clandestine operations across occupied Europe."
 ENG_home_defense_mobilization:0 "Home Defense Mobilization"
 ENG_home_defense_mobilization_desc:0 "Every town, village, and coast across our islands stands prepared. Total home mobilization ensures unprecedented recruitment pools, enhanced combat cohesion, and impenetrable defensive fortifications across our homeland."
 ENG_european_intelligence_hub_idea:0 "Continental Intelligence Hub"
 ENG_european_intelligence_hub_idea_desc:0 "An elite clandestine network operating across Europe, granting additional operative capacity, faster agency operations, superior decryption, and heightened counter-espionage."
 ENG_home_defense_mobilization_idea:0 "Home Defense Mobilization"
 ENG_home_defense_mobilization_idea_desc:0 "Comprehensive civilian and territorial mobilization to safeguard the British realm: §G+5.00%§! recruitable population, increased division organization, faster entrenchment, and bolstered defense on core territories."

 # --- Baltic Economy Branch (BALTIC_Our_economy_first) ---
 BALTIC_Our_economy_first:0 "Our Economy First"
 BALTIC_Our_economy_first_desc:0 "Surrounded by expanding empires and shifting allegiances, our primary obligation must be the economic stability and prosperity of our own people. By coordinating our internal markets and establishing sovereign fiscal policies, we lay the groundwork for durable national resilience."

 BALTIC_Protectionism:0 "Baltic Protectionism"
 BALTIC_Protectionism_desc:0 "To shelter domestic enterprises from volatile international markets and foreign predatory pricing, we shall institute protective tariffs and prioritize local production over overseas imports."

 BALTIC_Mercantilism:0 "Baltic Mercantilism"
 BALTIC_Mercantilism_desc:0 "A vigorous trading nation thrives on unrestricted commerce and active international exchange. By embracing free trade, we attract vital capital, technologies, and foreign manufactured goods into our ports."

 BALTIC_Expand_the_excavation:0 "Expand the Excavation"
 BALTIC_Expand_the_excavation_desc:0 "The Baltic soil conceals essential mineral wealth, shale oil deposits, and metallurgical resources. Modern extraction techniques and expanded mining operations will secure our industrial self-reliance."
 BALTIC_more_you_have_more_you_will_get_tt:0 "Every controlled state with untapped resources will receive new industrial facilities, extraction infrastructure, and expanded mineral yields."
 generic_skip_one_line_tt:0 ""

 BALTIC_Trade_with_the_scandinavian_countries:0 "Trade with Scandinavian Countries"
 BALTIC_Trade_with_the_scandinavian_countries_desc:0 "The Nordic realms across the Baltic Sea are our natural economic partners. By cultivating bilateral trade pacts with Finland, Sweden, Norway, and Denmark, we secure crucial raw materials and specialized machinery."

 BALTIC_Trade_with_sweden:0 "Trade with Sweden"
 BALTIC_Trade_with_sweden_desc:0 "Sweden possesses a world-renowned armaments and automotive manufacturing base. Formalizing defence-industrial cooperation will grant us licenses for cutting-edge Swedish armor and light combat vehicles."

 BALTIC_Trade_with_finland:0 "Trade with Finland"
 BALTIC_Trade_with_finland_desc:0 "The Finnish industrial expansion has yielded breakthroughs in polymer chemistry, communications, and consumer rubber at Nokia. Integrating their industrial expertise will directly boost our domestic production capabilities."
 BALTIC_youll_receive_nokia_tt:0 "Finland will upgrade their industrial assistance to us, enhancing our factory output and providing access to Finnish industrial design concerns."

 BALTIC_Trade_with_the_east_countries:0 "Trade with the East"
 BALTIC_Trade_with_the_east_countries_desc:0 "Our eastern and southern neighbors in Poland, Belarus, and Ukraine command extensive agricultural, metallurgical, and mining sectors. Re-establishing regular trade corridors eastward will invigorate our domestic arms factories."

 BALTIC_excavation_with_belarus:0 "Mining Cooperation with Belarus"
 BALTIC_excavation_with_belarus_desc:0 "By coordinating extraction initiatives and geological survey programs with Belarus, both of our nations can expedite resource harvesting technologies and share critical geological expertise."

 BALTIC_donbas_coal_deal:0 "Donbas Coal Agreement"
 BALTIC_donbas_coal_deal_desc:0 "The boundless mineral basin of the Donbas yields some of the highest-grade anthracite and coking coal in Europe. Securing direct deliveries from Ukraine will fuel our heavy manufacturing and power plants."
 if_they_accept_tt:0 "§YIf the proposal is accepted:§!"

 # --- Baltic Trade National Spirits ---
 BALTIC_Trade_with_sweden_idea:0 "Trade with Sweden"
 BALTIC_Trade_with_sweden:0 "Trade with Sweden"
 BALTIC_Trade_with_sweden_desc:0 "Preferential trade terms and bilateral commerce with Sweden, reducing the cost of imported goods and resources."

 BALTIC_Trade_with_norwey_idea:0 "Trade with Norway"
 BALTIC_Trade_with_norwey:0 "Trade with Norway"
 BALTIC_Trade_with_norwey_desc:0 "Preferential trade terms and bilateral commerce with Norway, reducing the cost of imported goods and resources."

 BALTIC_Trade_with_denmark_idea:0 "Trade with Denmark"
 BALTIC_Trade_with_denmark:0 "Trade with Denmark"
 BALTIC_Trade_with_denmark_desc:0 "Preferential trade terms and bilateral commerce with Denmark, reducing the cost of imported goods and resources."

 BALTIC_Trade_with_finland_idea:0 "Trade with Finland"
 BALTIC_Trade_with_finland:0 "Trade with Finland"
 BALTIC_Trade_with_finland_desc:0 "Preferential trade terms and bilateral commerce with Finland, reducing the cost of imported goods and resources."

 BALTIC_better_Nokia_finland:0 "Nokia Industrial Cooperation"
 BALTIC_better_Nokia_finland_desc:0 "Bilateral technical partnership with the Finnish Nokia manufacturing facilities, supplying high-grade rubber products, technical components, and boosting factory efficiency."
 BALTIC_better_Nokia_finland_1:0 "Nokia Industrial Cooperation I"
 BALTIC_better_Nokia_finland_1_desc:0 "Bilateral technical partnership with the Finnish Nokia manufacturing facilities, supplying high-grade rubber products, technical components, and boosting factory efficiency."
 BALTIC_better_Nokia_finland_2:0 "Nokia Industrial Cooperation II"
 BALTIC_better_Nokia_finland_2_desc:0 "Deepened technical partnership with Finnish Nokia enterprises, enhancing domestic factory capacity through specialized industrial inputs."
 BALTIC_better_Nokia_finland_3:0 "Nokia Industrial Cooperation III"
 BALTIC_better_Nokia_finland_3_desc:0 "Comprehensive industrial and manufacturing integration with Finnish Nokia complexes, maximizing civilian and military production capabilities."

 FIN_nokia_for_BALTIC:0 "Suomen Gummitehdas (Nokia)"
 FIN_nokia_for_BALTIC_desc:0 "The Finnish Rubber Works and electronics pioneer at Nokia assists Baltic enterprises in advanced synthetic materials, electrical gear, and telecommunications research."
 BLR_autarky_res:0 "Baltic-Belarusian Mining Agreement"

 # --- International_STE Trade & Mining Events ---
 # Event 8: Request to Belarus
 International_STE.8.t:0 "Baltic Request for Geological Cooperation"
 International_STE.8.d:0 "Diplomatic envoys from [From.GetNameDef] have delivered a formal proposal requesting joint geological survey efforts and mining research collaboration. In exchange for granting our state-of-the-art surveying teams access to shared research, our own domestic mining initiatives will receive a significant technological boost."
 International_STE.8.a:0 "A mutually beneficial proposal!"
 International_STE.8.b:0 "We cannot share our geological secrets."

 # Event 9: Belarus agrees
 International_STE.9.t:0 "Belarus Accepts Mining Cooperation"
 International_STE.9.d:0 "The government in Minsk has formally welcomed our delegation and ratified the geological cooperation agreement! Our engineers and geologists will immediately exchange technical blueprints, accelerating extraction technology across our territories."
 International_STE.9.a:0 "Excellent news for our industry."

 # Event 10: Belarus refuses
 International_STE.10.t:0 "Belarus Rejects Mining Cooperation"
 International_STE.10.d:0 "Regrettably, the Belarusian authorities have turned down our offer for joint geological initiatives, preferring to safeguard their domestic mining developments independently."
 International_STE.10.a:0 "An unfortunate missed opportunity."

 # Event 11: Proposal to Ukraine (Donbas Coal)
 International_STE.11.t:0 "Baltic Proposal for Donbas Coal Delivery"
 International_STE.11.d:0 "Envoys from [From.GetNameDef] have approached our government with an attractive economic proposition. They offer capital investment to construct a modern industrial complex in our mineral-rich Donbas basin in exchange for guaranteed coal deliveries to sustain Baltic power generation and metallurgy."
 International_STE.11.a:0 "Accept the investment and finalize the coal pact."
 International_STE.11.b:0 "Our coal reserves must remain exclusively for our own use."

 # Event 12: Ukraine agrees
 International_STE.12.t:0 "Ukraine Ratifies the Donbas Coal Agreement"
 International_STE.12.d:0 "The Ukrainian government has formally accepted our investment proposal! In return for financing an industrial complex in the Donbas, trainloads of high-grade coal will begin flowing directly to our factories."
 International_STE.12.a:0 "Our blast furnaces will never run cold!"

 # Event 13: Ukraine refuses
 International_STE.13.t:0 "Ukraine Rejects the Donbas Agreement"
 International_STE.13.d:0 "The Ukrainian authorities have politely declined our trade offer, stating that all domestic coal production is urgently required for their own burgeoning industrial needs."
 International_STE.13.a:0 "We will have to find fuel elsewhere."
