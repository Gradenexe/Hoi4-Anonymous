 ROM_natural_borders: "Natural Borders of Romania"  
 ROM_natural_borders_desc: "Guided by the ideal of 'De la Nistru până la Tisa'—the dream of a Romania defined by natural borders—we can now fulfill this nationalist vision that emerged in the aftermath of the Great War."
 # ROM_the_transnistrian_exchange: "The Transnistrian Exchange"  
 # ROM_the_transnistrian_exchange_desc: "We pushed beyond the Nister with one goal and one goal only, so that when the time comes, we can try and persuade Germany to compel a return of Transylvania to us. We can now make it so."  
 ROM_appeal_to_european_capitalists: "Appeal to European Capitalists"  
 ROM_appeal_to_european_capitalists_desc: "With King Carol II’s influence curtailed and democratic reforms bringing stability to our nation, we can now reach out to the great industrial powers of Europe. By demonstrating our commitment to a modern, open economy, we attract vital investments that will bolster our industries and infrastructure. This moment marks our return to the European stage as a reliable partner."  
 # ROM_preempt_bulgarian_alignment: "Preempt Bulgarian Alignment"  
 # ROM_preempt_bulgarian_alignment_desc: "With our democratic foundations secured, we must turn our attention to Bulgaria. Their ambitions toward our southern lands cannot be ignored. We must ensure that no Bulgarian demands on our rightful territories gain legitimacy. We will safeguard our borders and protect the hard-won sovereignty of our nation, with force, if needed."  
 # ROM_deal_with_hungary: "Deal with Hungary"  
 # ROM_deal_with_hungary_desc: "Hungary’s historical claims on our lands remain a constant threat, especially under undemocratic regimes that refuse compromise. We will ensure through any means necessary that Hungary cannot use force or coercion to claim our lands. The security of our borders rests firmly in our hands."  
 ROM_the_red_menace: "The Red Menace"  
 ROM_the_red_menace_desc: "The Soviet Union’s audacious demand for Bessarabia reveals their true intentions—domination of Eastern Europe. As the undisputed power in the Balkans, we cannot tolerate this encroachment on our sovereignty. It is time to push back against their ambitions and assert our rightful claims beyond the Dniester. Let the world know that Romania will not bow to the Red Menace!"  
 ROM_expand_resita_steel_works: "Expand the Resita Steel Works"
 ROM_expand_resita_steel_works_desc: " The Resita Steel Works have long been a cornerstone of our industrial capacity. By modernizing and expanding these facilities, we can significantly boost steel production and provide the resources needed for military and industrial expansion."
 ROM_air_defense_network: "Air Defense Network"
 ROM_air_defense_network_desc: "The skies above Romania must remain secure, especially over our vital oil fields. Establishing a robust air defense network will protect our industry and deter enemy bombing campaigns."
 ROM_beyond_the_black_sea: "Beyond the Black Sea"
 ROM_beyond_the_black_sea_desc: "With the modernization of our navy complete, we can now project power far beyond the Black Sea. Strengthening our naval forces and expanding our dockyards will allow us to challenge any threat on the open seas."
 ROM_new_eastern_borders: "New Eastern Borders"
 ROM_new_eastern_borders_desc: "With our victory over the Soviet Union, we must solidify our control over the Transnistrian region. By integrating these territories into our nation, we ensure the stability and prosperity of our new eastern borders."
 ROM_fight_tyranny: "Fight Against Tyranny"
 ROM_fight_tyranny_desc: "The rise of fascism across Europe threatens the ideals of freedom and self-determination. It is our duty to stand firm against this menace and take action to liberate those suffering under its grip."
 ROM_subsidized_national_industrialization: "Subsidized National Industrialization"
 ROM_subsidized_national_industrialization_desc: "Our alignment with the Soviet Union opens opportunities for economic collaboration. By leveraging their support, we can accelerate our industrial development, strengthening our economy for the challenges ahead."
 ROM_soviet_military_exercises: "Soviet Military Exercises"
 ROM_soviet_military_exercises_desc: "As a member of the Comintern, we can benefit from Soviet military expertise. Joint exercises with their forces will enhance our army's capabilities, ensuring we are well-prepared to defend socialism across Europe."
 # ROM_italian_destroyers: "Purchase Italian Destroyers"
 # ROM_italian_destroyers_desc: "Building ships from scratch is expensive. However, many nations could be willing to sell some of their older vessels. [ITA.GetNameDefCap] for example has already shown an interest in selling a number of destroyers to us for a very reasonable price."
 
 ROM_bessarabian_war: "The Bessarabian War"
 ROM_bessarabian_war_desc: "Romania faces a critical war against the Soviet Union over Bessarabia. We will do our best to defend against the invaders and secure our homelands, but we must be prepared for the worst."

 ROM_demand_peace_negotiations: "Demand Peace Negotiations"
 ROM_demand_peace_negotiations_desc: "Our forces have made significant advances into Soviet territory. It is time to demand peace and assert our territorial claims in Transnistria."

 ROM_sue_for_peace: "Sue for Peace"
 ROM_sue_for_peace_desc: "With critical territories under Soviet control and our position weakened, we must sue for peace to prevent complete disaster."
