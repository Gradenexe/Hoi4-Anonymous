l_english:
 soviet_republic_generic_focus:0 "Soviet Republic"
 soviet_republic_generic_focus_desc:0 "A unified socialist focus tree dedicated to the modernization, industrialization, and military coordination of a Soviet Republic within the USSR."
 SOVREP_seek_support_of_soviets:0 "Seek the Support of the Soviets"
 SOVREP_seek_support_of_soviets_desc:0 "Although the Red Army laid waste to [Root.GetNameDef] and brought our nation into a new era of Russian imperialism, we are without a chance to bring socialism to [Root.GetNameDef] without their assistance."
 SOVREP_army_return_prep_idea:0 "Liberation Army Training"
 SOVREP_army_return_prep_idea_desc:0 "Our exiled divisions have been drilled in offensive and spearhead tactics designed specifically for reclaiming our homeland."
 SOVREP_technology_sharing:0 "Technology Sharing"
 SOVREP_technology_sharing_desc:0 "We produce many of our partner’s equipment already, but perhaps by studying their designs we shall be able to significantly improve native [Root.GetNonIdeologyAdjective] designs."
 SOVREP_prepare_our_land_to_return:0 "Prepare the Land to Return"
 SOVREP_prepare_our_land_to_return_desc:0 "Directing coordinated sabotage of enemy supply lines, rail networks, and airfields in Our Republic."
 SOVREP_eastwall:0 "Eastwall"
 SOVREP_eastwall_desc:0 "The Germans anticipate an attack from the East as much as we do and German officials would be well-advised to fortify our border with as much vigor as their own."
 SOVREP_resistance_industries:0 "Underground Industry"
 SOVREP_resistance_industries_desc:0 "Supporting secret workshops and supply networks within our occupied core territories."
 SOVREP_third_hit:0 "The Third Strike"
 SOVREP_third_hit_desc:0 "Liberating our key industrial heartlands and freeing millions of our citizens."
 SOVREP_everyone_will_fight:0 "Everyone Will Fight"
 SOVREP_everyone_will_fight_desc:0 "Mobilizing all refugees, emigrants, and supporters abroad to take up arms or support roles."
 SOVREP_end_bourgeouis_dictatorships:0 "Unification with Moldavian SSR"
 SOVREP_end_bourgeouis_dictatorships_desc:0 "The Our Republic are dominated by so-called “neutral” dictators. With the backing of the military and without consent of their people, the proletariat of the Republican are oppressed under capitalist dictatorship. It is only by the hands of freed [Root.GetAdjective] workers that these workers kept separate by unjust borders may share in our glorious liberation!"
 SOVREP_final_blow:0 "The Final Blow"
 SOVREP_final_blow_desc:0 "Launching the ultimate, decisive offensive to completely expel the occupier from every inch of our land."
 SOVREP_allied_shipments:0 "Increase Allied Shipments"
 SOVREP_allied_shipments_desc:0 "Since 1918, the [Root.GetNonIdeologyAdjective] army has been equipped with shipments sent to us from Great Britain and we should make efforts to make the Allies understand that unless shipments are drastically increased, [Root.GetNonIdeologyName] may become subject to another Soviet puppet government."
 SOVREP_forment_disloyalty:0 "Unite the Opposition"
 SOVREP_forment_disloyalty_desc:0 "There are many movements both within and without the [Root.GetAdjective] government and if we are to overthrow the current tyranny that plagues [Root.GetNameDef], we must become the unifying voice of opposition to [Root.GetNeutralParty]!"
 SOVREP_united_with_westukrblr:0 "Unite with our people in Eastern Poland"
 SOVREP_united_with_westukrblr_desc:0 "Our brothers in the west have suffered long enough under foreign occupation. It is our duty to bring them into the fold and unite all our historical lands under one socialist banner."
 SOVREP_arm_baltic_reds:0 "Arm Republican Reds"
 SOVREP_arm_baltic_reds_desc:0 "The stage is set, communist fervor is burning all across the Our Republic. All the reds need now is the signal and resources from us and we will spark the Republican revolution!"
 SOVREP_combined_civilian_agency_resistance:0 "Combined Resistance Coordination"
 SOVREP_combined_civilian_agency_resistance_desc:0 "Unifying our intelligence operations with domestic partisan networks to maximize sabotage efficiency."
 SOVREP_request_german_support:0 "Request [GetBalticAxisInvesmentsAdj] Support"
 SOVREP_request_german_support_desc:0 "[GetRequestGermanSupportDesc]"
 SOVREP_exploit_connections_spirit:0 "Diplomatic Trade Channels"
 SOVREP_exploit_connections_spirit_desc:0 "Exploiting diplomatic links helps us secure trade deals and resources from host countries."
 SOVREP_expand_operations:0 "Expand Operations"
 SOVREP_expand_operations_desc:0 "Expanding our espionage network to gather intelligence on occupier movements and assets."
 SOVREP_natural_resources:0 "Develop Natural Resources"
 SOVREP_natural_resources_desc:0 "[Root.GetNaturaResource_BAL] has made our country rich from trade with the Soviets, the Allies, and our fellow Republican states alike and we would do well to invest more into this industry by investing in [Root.GetExtraction_BAL] across the nation!"
 SOVREP_our_help_in_the_war_idea:0 "Valued Allied Partner"
 SOVREP_our_help_in_the_war_idea_desc:0 "Our active contributions in intelligence and volunteers have earned us deep respect from our allies."
 SOVREP_second_hit:0 "The Second Strike"
 SOVREP_second_hit_desc:0 "Pushing deeper into the central regions, breaking the enemy's defensive lines."
 SOVREP_aces_in_exile:0 "Aces in Exile"
 SOVREP_aces_in_exile_desc:0 "Our pilots will fight alongside our allies, gaining invaluable combat experience to lead our future air force."
 SOVREP_soviet_volunteer_forces:0 "Soviet Volunteer Forces"
 SOVREP_soviet_volunteer_forces_desc:0 "The USSR is practically overflowing with men ready to fight and die for the world revolution. Though [Root.GetNameDef] is just a mere stepping-stone in the fight for a communist world, there is no shortage of brave Russian socialists ready to die for our cause."
 SOVREP_exile_politics_spirit:0 "Republican Government-in-Exile"
 SOVREP_exile_politics_spirit_desc:0 "Our exiled administration maintains political structure and legitimacy, bolstering our political influence and stability."
 SOVREP_allied_aid_spirit:0 "Allied Research Exchange"
 SOVREP_allied_aid_spirit_desc:0 "Our hosts share scientific and military research resources to support our future restoration."
 SOVREP_balticwall:0 "Black Sea Wall"
 SOVREP_balticwall_desc:0 "Fortifications in the east are worthless if our enemies choose instead to perform an attack from the sea! We may never build a navy to rival the British, Germans, or Soviets, but we can do what we can to render them helpless against our coastal defences."
 SOVREP_british_aircraft:0 "[GetBritAircraftManufTitle]"
 SOVREP_british_aircraft_desc:0 "[GetBritAircraftManufDesc]"
 SOVREP_second_hit_idea:0 "Second Strike Momentum"
 SOVREP_second_hit_idea_desc:0 "Our breakthroughs in the central regions have thrown the enemy into disarray, boosting our breakthrough and recovery speed."
 SOVREP_domestic_motors:0 "A Domestic Motor Company"
 SOVREP_domestic_motors_desc:0 "Foreign designs are fine, but we cannot rely on them in perpetuity. [Root.GetNonIdeologyName] is a proud nation, and we must show the world that our designers and thinkers are just as adequate as those from the West."
 SOVREP_align_paramilitarists:0 "Realign the Paramilitarists"
 SOVREP_align_paramilitarists_desc:0 "There are many paramilitary groups throughout [Root.GetNameDef], most of which are devoted solely to the protection of [Root.GetAdjective] self-determination. While admirable, it would be preferred if these groups were to see us not as [SOV.GetAdjective] puppets, but as the logical continuation of the [Root.GetAdjective] state."
 SOVREP_prepare_our_army_to_return:0 "Prepare the Army to Return"
 SOVREP_prepare_our_army_to_return_desc:0 "Drilling our exiled divisions in specialized offensive and liberation tactics."
 SOVREP_prepare_our_people_to_return:0 "Prepare the People to Return"
 SOVREP_prepare_our_people_to_return_desc:0 "Broadcasting propaganda and instructions to prepare the civilian population for the coming liberation."
 SOVREP_foreign_air_support:0 "Foreign Air Support"
 SOVREP_foreign_air_support_desc:0 "Our hosts will assist in training our pilots and supplying aircraft for our exile air force."
 SOVREP_soviet_war_economics:0 "Adopt Soviet War Economics"
 SOVREP_soviet_war_economics_desc:0 "To ensure that our economy is ready to withstand any capitalist aggression, we must restructure our industrial output. Modeling our economy on the Soviet command model will prepare us for the inevitable struggle."
 SOVREP_ford_motors:0 "[Root.Capital.GetName] Ford Industry"
 SOVREP_ford_motors_desc:0 "Ford motor company have done a fine job of providing mass-produced affordable motor vehicles to the Americans and other Allied nations throughout the world. If we should establish a Ford manufactory in [Root.Capital.GetName], we will be able to both provide vehicles for our own army and make a tidy profit exporting them to the West."
 SOVREP_post_resistance_development:0 "Post-Resistance Development"
 SOVREP_post_resistance_development_desc:0 "With the resistance finally crushed, we can focus our efforts on the industrial development of our newly secured regions."
 SOVREP_attract_workers_to_capital:0 "Attract Workers to [Root.Capital.GetName]"
 SOVREP_attract_workers_to_capital_desc:0 "The workers of [Root.GetNonIdeologyName] are spread disparately across the countryside, often working in the outdated agricultural sector. If we want to industrialize our nation for war, we must attract workers to the factories of [Root.Capital.GetName]!"
 SOVREP_request_soviet_support:0 "Request Soviet Support"
 SOVREP_request_soviet_support_desc:0 "With our nation industrialized and our military cooperation established, we are ready to take our place as a full partner in the socialist world. Let us request formal military alliance and faction entry with the Soviet Union."
 SOVREP_soviet_equipment:0 "Soviet Equipment"
 SOVREP_soviet_equipment_desc:0 "We cannot hope to topple the government without first gaining access to weapons and materials necessary to arm our militia. By reaching out to the Russians for assistance, we will gain extra armaments to support our armies, should the old government attempt to halt the revolution."
 SOVREP_unchain_education:0 "Unchain Our Education"
 SOVREP_unchain_education_desc:0 "The [Root.GetNonIdeologyAdjective] educational system has long been restricted by our disparate population centres, but now with rural folk moving closer to the cities, we shall be more capable of efficiently educating the [Root.GetNonIdeologyAdjective] youth."
 SOVREP_belarus_ssr:0 "[Root.GetNonIdeologyName]-Belarus SSR"
 SOVREP_belarus_ssr_desc:0 "The concept of uniting Belarus and the Republican is not a foreign one. Long ago the Lithuanian-Belarus Soviet Socialist Republic existed as a harmonious fusion of these two seemingly different peoples. Socialism knows no boundaries of culture and language, and we see little reason why [Root.GetAdjective] and Belorussian workers could not co-exist."
 SOVREP_stalins_highway:0 "Stalin's Highway"
 SOVREP_stalins_highway_desc:0 "Rapid movement of troops and industrial materials is key to modern warfare. With Soviet engineers assisting us, we will build a modern network of highways across the country."
 SOVREP_civil_and_military_organization_ukr:0 "Combined Resistance Council"
 SOVREP_civil_and_military_organization_ukr_desc:0 "A joint intelligence council that coordinates regular military assets with domestic partisan forces."
 SOVREP_international_recognition:0 "International Recognition"
 SOVREP_international_recognition_desc:0 "Ensuring that the international community recognizes our exiled administration as the sole legitimate government of Our Republic, cementing our war support."
 SOVREP_mobilize_from_liberated_lands:0 "Mobilize from Liberated Lands"
 SOVREP_mobilize_from_liberated_lands_desc:0 "As we reclaim territory, we can mobilize the local population to join our forces, further strengthening our ranks and deepening our connection with the people we are liberating."
 SOVREP_evacuated_industries:0 "Evacuated Industries"
 SOVREP_evacuated_industries_desc:0 "Setting up factories staffed by evacuated Republican workers to manufacture arms and equipment."
 SOVREP_connections_with_industrialists:0 "Industrialist Connections"
 SOVREP_connections_with_industrialists_desc:0 "Working with foreign industrialists to secure machinery, resources, and technical expertise."
 SOVREP_buy_foreign_ships:0 "Purchase Foreign Vessels"
 SOVREP_buy_foreign_ships_desc:0 "Acquiring decommissioned or leased naval assets from our allies to form a core liberation fleet."
 SOVREP_german_war_economics:0 "Adopt [GetBalticAxisInvesmentsAdj] War Economics"
 SOVREP_german_war_economics_desc:0 "[GetGermanWarEconomicsDesc]"
 SOVREP_secure_military_support:0 "Secure Military Support"
 SOVREP_secure_military_support_desc:0 "Many in the military would seek to rid the nation of [Root.GetLeader], all we need do is approach them. A general seeking honour and renown would surely be drawn to our cause with the promise of becoming a hero of the people."
 SOVREP_focus_on_the_interior:0 "Focus on the Interior"
 SOVREP_focus_on_the_interior_desc:0 "Though many workers are eager to march on our neighbours and bring our glorious revolution to all Republican peoples, we must instead focus on the interior of our nation; stabilizing the regime following the revolution."
 SOVREP_even_stronger_resistance:0 "Mobilize the Underground"
 SOVREP_even_stronger_resistance_desc:0 "Giving the signal to domestic partisan networks to scale up sabotage of enemy lines."
 SOVREP_third_hit_idea:0 "Third Strike Momentum"
 SOVREP_third_hit_idea_desc:0 "As we reclaim our industrial heartlands, our defensive planning and organization are heavily bolstered."
 SOVREP_soviet_military_staff:0 "Soviet Military Staff"
 SOVREP_soviet_military_staff_desc:0 "After the [Root.GetAdjective] Worker’s Republic was disbanded, our military staff largely went into exile in the USSR. They must be brought home."
 SOVREP_army_cooperation_idea:0 "Inter-Service Cooperation"
 SOVREP_army_cooperation_idea_desc:0 "Our army, navy, and air forces are fully integrated, coordinating their planning and operational execution."
 SOVREP_modernize_industry:0 "Modernize Our Industry"
 SOVREP_modernize_industry_desc:0 "For too long, [Root.GetNonIdeologyName]’s output has been defined by agriculture but no more. We must concentrate our industry around the major city centers in each state if we are to turn [Root.GetNonIdeologyName] into a modern economy."
 SOVREP_baltic_fleet:0 "The Republican Fleet"
 SOVREP_baltic_fleet_desc:0 "While the [Root.GetNonIdeologyAdjective] fleet is scarcely the envy of the world, with proper investment it may yet prove to be able to defend [Root.GetNonIdeologyName] from any attempted invasions on the sea."
 SOVREP_concessions_for_catholics:0 "Concessions for Catholics"
 SOVREP_concessions_for_catholics_desc:0 "Much of [Root.GetNameDef]’s lower classes are devout Catholics, and in the first Worker’s Republic, religious practice was harshly stamped out by the Red Army. This turned many of [Root.GetNameDef]’s poor against the revolution, so if we are to truly be the republic of the people, we must assure them in no uncertain terms that their faith will be protected."
 SOVREP_soviet_tank_licences:0 "Soviet Tank Licences"
 SOVREP_soviet_tank_licences_desc:0 "The Red Army's armored forces are among the most advanced in the world. Securing production licenses for Soviet tank designs will give our army the armored fist it needs."
 SOVREP_soviet_investments:0 "Seek Soviet Investments"
 SOVREP_soviet_investments_desc:0 "In order to safeguard the revolution and industrialize our nation, we must look to our comrades in the Soviet Union. By opening our borders to Soviet investments, we will secure the future of the Republican proletariat."
 SOVREP_revolutionary_cabinet:0 "A Revolutionary Cabinet"
 SOVREP_revolutionary_cabinet_desc:0 "Now that we have returned to our rightful place as the stalwart sentinels of the lower-class, we may once again assemble a cabinet of ministers aligned with the ideology of our new state."
 SOVREP_western_wall:0 "Western Wall"
 SOVREP_western_wall_desc:0 "We must prepare for the inevitable clash with the West. A formidable line of fortifications along our western border will ensure the safety of our republic."
 SOVREP_women_in_air:0 "Women in the Air Force"
 SOVREP_women_in_air_desc:0 "Every citizen must contribute. We will open flight training to Republican women, maximizing our pilot pool."
 SOVREP_school_of_aviation:0 "Republican School of Aviation"
 SOVREP_school_of_aviation_desc:0 "During the independence war, the struggle for control of the air and sea was fought by the British on our behalf, but as the Brits continue to grant concession after concession to the Nazi menace, we cannot trust that they will defend us again. We must take to the air ourselves!"
 SOVREP_german_tank_licences:0 "[GetBalticAxisInvesmentsAdj] Tank Licences"
 SOVREP_german_tank_licences_desc:0 "[GetGermanTankLicencesDesc]"
 SOVREP_exile_resistance:0 "Coordinate the Underground"
 SOVREP_exile_resistance_desc:0 "Establishing radio contacts with local resistance cells in our occupied territories."
 SOVREP_organize_exiled_army:0 "Organize Exiled Army"
 SOVREP_organize_exiled_army_desc:0 "Structuring our volunteer regiments into integrated divisions with proper command structures."
 SOVREP_original_designs:0 "Original Designs"
 SOVREP_original_designs_desc:0 "From our nation’s birth in 1918 to the present day, [Root.GetNonIdeologyName] has equipped its armies with arms from the Brits, but no more. We cannot rely on the Brits any longer, we must look forward and begin manufacturing weaponry of [Root.GetNonIdeologyAdjective] origin."
 SOVREP_direct_intervention:0 "Direct Soviet Intervention"
 SOVREP_direct_intervention_desc:0 "We have proven unable to reclaim the government alone and we must call upon our allies in [SOV.GetNameDef] to aid us in our struggle."
 SOVREP_axis_investments:0 "Seek [GetBalticAxisInvesmentsAdj] Investments"
 SOVREP_axis_investments_desc:0 "[GetBalticAxisInvesmentsDesc]"
 SOVREP_donbas_coal:0 "Our Coal"
 SOVREP_donbas_coal_desc:0 "Coal is the lifeblood of industry. By expanding our mining operations, we will fuel our factories and power our military machine."
 SOVREP_exile_industries:0 "Exile Industries"
 SOVREP_exile_industries_desc:0 "Setting up workshops and coordination offices in host nations to manage production for our military."
 SOVREP_reconquest_spirit:0 "Spirit of Liberation"
 SOVREP_reconquest_spirit_desc:0 "Our people are unified by a single burning desire: to reclaim our homeland and defeat the occupier."
 SOVREP_soviet_ukraine_industry:0 "Soviet-Republican Industry"
 SOVREP_soviet_ukraine_industry_desc:0 "By integrating our industrial planning with Soviet expertise, we can build off-site military and civilian factories that are safe from front-line bombardment."
 SOVREP_communist_opposition:0 "Enter Opposition"
 SOVREP_communist_opposition_desc:0 "The Soviet Union has proven itself to be no friend to [Root.GetNameDef] nor its people and we would be fools to hand the keys to [Root.GetNameDef] over to the vultures of the Red Army who want nothing more than to plunder the [Root.GetAdjective]. They are no more trustworthy than the capitalists, and if the [Root.GetCommunistParty] are to succeed, it must be done alone!"
 SOVREP_new_volonteers_to_fight:0 "New Volunteers to Fight"
 SOVREP_new_volonteers_to_fight_desc:0 "Our cause has inspired many to join our ranks, swelling our forces with fresh volunteers eager to fight for our liberation."
 SOVREP_exploit_our_connections:0 "Exploit Our Connections"
 SOVREP_exploit_our_connections_desc:0 "Leveraging our diplomatic contacts to secure international trade agreements and materials for our exiled government."
 SOVREP_arm_the_nation:0 "Arm the Nation"
 SOVREP_arm_the_nation_desc:0 "All across [Root.GetNonIdeologyName] there are men ready to face the oncoming threat of a Soviet invasion but lack the equipment to do so. We must ready our arms industry for the rapid production of infantry equipment."
 SOVREP_influence_neighbours:0 "Influence the Neighbours"
 SOVREP_influence_neighbours_desc:0 "Although not nearly as popular as it was before the wars of independence, the concept of a freed Republican under socialism is as old as the concept of Republican self-determination itself. Our state can stand as something to be modelled by those living under the oppressive regimes of the Republican dictatorships and by weaponizing that, we stand to spread the Revolution to our neighbours bloodlessly."
 SOVREP_government_in_exile:0 "Prepare for the Inevitable"
 SOVREP_government_in_exile_desc:0 "Our homeland is on the verge of falling, but our spirit remains unbroken. We shall prepare our government to coordinate the liberation struggle from abroad."
 SOVREP_renew_allied_trade:0 "[GetBalticRenewAlliedTradeTitle]"
 SOVREP_renew_allied_trade_desc:0 "[GetBalticRenewAlliedTradeDesc]"
 SOVREP_british_designers:0 "Invite British Designers"
 SOVREP_british_designers_desc:0 "We have studied British designs thoroughly, and with [Root.Capital.GetName]-Crossley Motors proving to be a successful endeavour, we would do well to extend formal invitations for British designers to join the [Root.GetNonIdeologyAdjective] Engineering Company."
 SOVREP_new_army:0 "The New Army"
 SOVREP_new_army_desc:0 "Equipping our soldiers with modern weapons and adopting advanced tactical doctrines to prepare for the return."
 SOVREP_purge_of_our_own:0 "A Purge of Our Own"
 SOVREP_purge_of_our_own_desc:0 "Even through our best efforts to squash all resistance, there are still those organizing in the shadows, conspiring against the proletariat to restore a capitalist dictatorship in [Root.GetNonIdeologyName]. We must conduct a popular purge; rooting out any members of the old government and any who support them."
 SOVREP_final_blow_idea:0 "The Ultimate Blow"
 SOVREP_final_blow_idea_desc:0 "The final campaign to completely expel the occupier grants us massive offensive and defensive combat bonuses."
 SOVREP_everyone_will_fight_idea:0 "Exile Mobilization"
 SOVREP_everyone_will_fight_idea_desc:0 "We have mobilized every capable refugee and volunteer to support the liberation effort."
 SOVREP_air_in_exile:0 "Air Force in Exile"
 SOVREP_air_in_exile_desc:0 "Establishing our own squadron commands under allied operational control, ensuring our flight crews remain organized."
 SOVREP_sieze_the_means_of_production:0 "Seize the Means of Production"
 SOVREP_sieze_the_means_of_production_desc:0 "The old government invited investors from overseas to exploit the labour of the [Root.GetAdjective] people. We cannot continue to allow the hands of the proletariat to serve their foreign bourgeoisie masters and all factories constructed by these multinational corporations must be taken into the custody of [Root.GetNameDef]."
 SOVREP_rebuild_forts:0 "Rebuild the [Root.Capital.GetName] Forts"
 SOVREP_rebuild_forts_desc:0 "During the independence wars, [Root.Capital.GetName] was more a fort than a city. Although the fortifications have largely been dismantled and forgotten, they must be rebuilt and maintained, ready for war."
 SOVREP_united_baltic_ssr:0 "A United Eastern Slavic SSR"
 SOVREP_united_baltic_ssr_desc:0 "Similar to the Lithuanian-Belarusian SSR, a United Our Republic-Belarusian SSR would be a harmonious fusion of these two seemingly different peoples. Socialism knows no boundaries of culture and language, and we see little reason why Republican and Belorussian workers could not co-exist."
 SOVREP_restore_workers_republic:0 "Restore the Worker’s Republic"
 SOVREP_restore_workers_republic_desc:0 "During our struggle for independence, the Soviets aided the creation of a [Root.GetAdjective] Worker’s Republic. Although the republic failed, its leaders remain alive in both [Root.GetNameDef] and [SOV.GetNameDef], hence hope for the worker’s republic remains!"
 SOVREP_soviet_collectivization:0 "Soviet Collectivization"
 SOVREP_soviet_collectivization_desc:0 "To maximize our agricultural output and feed the growing industrial workforce, we must transition our farms to the Soviet model of collectivization."
 SOVREP_people_return_prep_idea:0 "Liberation Propaganda Networks"
 SOVREP_people_return_prep_idea_desc:0 "Underground broadcasts and leaflets have prepared the occupied population to assist the returning army."
 SOVREP_army_cooperation:0 "Inter-service Cooperation"
 SOVREP_army_cooperation_desc:0 "Integrating our army, navy, and air forces into a unified command structure to coordinate operations."
 SOVREP_help_from_our_allies:0 "Help from Our Allies"
 SOVREP_help_from_our_allies_desc:0 "Securing concrete commitments of lend-lease and sharing technical and research knowledge with our allied hosts."
 SOVREP_expand_intelligence:0 "Expand Intelligence"
 SOVREP_expand_intelligence_desc:0 "Upgrading our decryption capabilities to intercept and crack enemy communications."
 SOVREP_to_return_ours:0 "To Reclaim What Is Ours"
 SOVREP_to_return_ours_desc:0 "Declaring the start of the general campaign to liberate our homeland from the occupier."
 SOVREP_autobahn:0 "[Root.GetAdjective] Autobahn"
 SOVREP_autobahn_desc:0 "It matters little how well industrialized [Root.GetNonIdeologyName] is if her infrastructure does not facilitate a rapid and continuous influx of labour. By modelling our infrastructure sector after that of the Reich, we may achieve the efficiency they have."
 SOVREP_donbas_heavy_industry:0 "Our Heavy Industry"
 SOVREP_donbas_heavy_industry_desc:0 "Our region is rich with resources and potential. By investing heavily in its industrial capacity, we can secure a strong backbone for our nation's economy."
 SOVREP_rejoin_the_railways:0 "Rejoin the Railways"
 SOVREP_rejoin_the_railways_desc:0 "The Russians and the Germans who occupied us have seen us as nothing more than a rural backwater, but no more. [ROOT.GetNonIdeologyName] shall be industrialized to its maximum potential starting with an upgrade of our railways and infrastructure."
 SOVREP_foreign_fleet_support:0 "Foreign Fleet Support"
 SOVREP_foreign_fleet_support_desc:0 "Negotiating with allied navies to provide docking facilities and training for our sailors."
 SOVREP_industrialist_connections_ukr:0 "Industrialist Support Group"
 SOVREP_industrialist_connections_ukr_desc:0 "Our exiled government works closely with foreign manufacturers to secure military supplies."
 SOVREP_defence_of_our_nation:0 "The Defence of Our Nation"
 SOVREP_defence_of_our_nation_desc:0 "Civilian industry is of equal importance to our defence as the arms industry. The steady hum of machinery will drone throughout all of [Root.GetNonIdeologyName] as its patriotic people do their duty to industrialize our nation."
 SOVREP_land_return_prep_idea:0 "Coordinated Supply Sabotage"
 SOVREP_land_return_prep_idea_desc:0 "Partisans have heavily damaged enemy supply hubs and rail corridors, disrupting their logistics."
 SOVREP_united_exile_government_idea:0 "Unified Liberation Front"
 SOVREP_united_exile_government_idea_desc:0 "All our military branches, industrial agreements, and domestic resistance cells have been combined into a single, highly coordinated, and powerful liberation movement."
 SOVREP_red_army:0 "[Root.GetAdjective] Red Riflemen"
 SOVREP_red_army_desc:0 "Our army must be made up of only those willing to defend socialism within [Root.GetNameDef] and spread it amongst the populace of the world, and this may only be achieved by restoring the [Root.GetAdjective] Red Riflemen."
 SOVREP_foreign_army_support:0 "Foreign Army Support"
 SOVREP_foreign_army_support_desc:0 "We shall assemble our scattered soldiers and volunteers to form a combat-ready force on foreign soil."
 SOVREP_squash_resistance:0 "Squash All Resistance"
 SOVREP_squash_resistance_desc:0 "There are still yet people who believe socialism to be the enemy of [Root.GetAdjective] sovereignty, and these people must be rooted out if we are to advance the revolution."
 SOVREP_crossley_motors:0 "[Root.Capital.GetName]-Crossley Motors"
 SOVREP_crossley_motors_desc:0 "With foreign investment now rife within our nation and production of automobiles in reasonable efficiency, we may be able to collaborate with the Crossley Motor Company to create original designs for use within the [Root.GetNonIdeologyAdjective] army!"
 SOVREP_crush_forest_brothers:0 "Crush the Resistance"
 SOVREP_crush_forest_brothers_desc:0 "The Resistance have been a blight on our nation since our takeover; sabotaging our industries, railroads, and disrupting official government demonstrations. We must venture into the forests of [Root.GetNonIdeologyName] and root out these misguided individuals."
 SOVREP_aces_in_exile_idea:0 "Republican Aces in Exile"
 SOVREP_aces_in_exile_idea_desc:0 "Our pilots have served with distinction in Allied air wings, gaining invaluable tactical knowledge."
 SOVREP_intl_recognition_spirit:0 "International Diplomatic Recognition"
 SOVREP_intl_recognition_spirit_desc:0 "Global recognition of our legitimacy keeps our war effort alive and gives us strong political backing."
 SOVREP_overthrow_the_government:0 "Overthrow [Root.GetNeutralParty]"
 SOVREP_overthrow_the_government_desc:0 "We have gathered enough support to topple [Root.GetLeader] and [Root.GetLeader.GetHerHis] regime! All we need do is march on the capital and proclaim a new Worker’s Republic!"
 SOVREP_focus_on_the_interior_2:0 "Prepare for the Germans"
 SOVREP_focus_on_the_interior_2_desc:0 "It is vital that we do not forget the absolute brutality that the Freikorps brought to [Root.GetNameDef] so many years ago. Peasants and workers were butchered as if animals, entire villages reduced to ash and ruin, and we cannot allow the [Root.GetAdjective] people to ever endure such brutality again."
 SOVREP_first_hit:0 "The First Strike"
 SOVREP_first_hit_desc:0 "Launching the initial offensive to secure our first major regions and establish a bridgehead."
 SOVREP_arms_industry:0 "Complete the Armament"
 SOVREP_arms_industry_desc:0 "Now that the modernization of our industry is complete and we have countless domestic military industrial organizations operating within our country, the [Root.GetAdjective] arms industry may finally live up to its true potential!"
 SOVREP_even_stronger_resistance_idea:0 "Mobilized Partisan Network"
 SOVREP_even_stronger_resistance_idea_desc:0 "Partisan networks across the occupied homeland have scaled up active sabotage and intelligence gathering."
 SOVREP_trade_with_neighbors:0 "Trade with the Neighbors"
 SOVREP_trade_with_neighbors_desc:0 "Each time we invest trade into the Germans or the Soviets, we are contributing to our own doom. We cannot allow enemy troops to invade [Root.GetNonIdeologyName] with Lithuanian grain in their rations and Estonian oil in their tanks made from Latvian steel. We must instead aid each other to defeat our common enemy."
 SOVREP_invest_in_baltic_trade:0 "Invest in Republican Trade"
 SOVREP_invest_in_baltic_trade_desc:0 "The Black Sea is rich with trade from Scandinavia, Germany, and Russia and our ports can scarcely contain them all. We must open up new trade lines with our friends who share this sea with us for a brighter and more prosperous [Root.GetNonIdeologyName]!"
 SOVREP_first_hit_idea:0 "First Strike Momentum"
 SOVREP_first_hit_idea_desc:0 "The momentum of our initial bridgehead offensive boosts our speed and offensive capabilities on core territory."
 SOVREP_combine_all_our_forces:0 "Combine All Forces"
 SOVREP_combine_all_our_forces_desc:0 "Merging all our exile assets—army, air force, navy, industry, and underground networks—into a single, unified Liberation Front."
 SOVREP_german_baltic_industry:0 "Axis-Republican Industry"
 SOVREP_german_baltic_industry_desc:0 "[GetGermanBalticIndustryDesc]"
 SOVREP_our_help_in_the_war:0 "Allied Contribution"
 SOVREP_our_help_in_the_war_desc:0 "Offering our specialized intelligence and volunteer units to direct Allied operations, proving our worth."
 SOVREP_exile_politics:0 "Exile Politics"
 SOVREP_exile_politics_desc:0 "Consolidating our diplomatic representation abroad to ensure our voice is heard in allied war councils, establishing a steady source of political legitimacy."
