l_english:
 # Iraq
 IRQ_government_in_exile:0 "Prepare for the Inevitable"
 IRQ_government_in_exile_desc:0 "Our homeland is on the verge of falling, but our spirit remains unbroken. We shall prepare our government to coordinate the liberation struggle from abroad."
 IRQ_foreign_air_support:0 "Foreign Air Support"
 IRQ_foreign_air_support_desc:0 "Our hosts will assist in training our pilots and supplying aircraft for our exile air force."
 IRQ_foreign_army_support:0 "Foreign Army Support"
 IRQ_foreign_army_support_desc:0 "We shall assemble our scattered soldiers and volunteers to form a combat-ready force on foreign soil."
 IRQ_exile_industries:0 "Exile Industries"
 IRQ_exile_industries_desc:0 "Through agreements with our hosts, we will establish offsite factories to support our war effort."
 IRQ_exile_resistance:0 "Coordinate the Underground"
 IRQ_exile_resistance_desc:0 "We will establish contact with local resistance groups in our occupied territories to coordinate sabotage and opposition."

