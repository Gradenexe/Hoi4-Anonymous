 naval_production_boost:0 "Exiled Naval Production"
 naval_production_boost_desc:0 "Our engineers and shipwrights are working alongside host shipyard facilities to improve ship construction speed and efficiency."
 
 strength_in_numbers:0 "Strength in Numbers"
 strength_in_numbers_desc:0 "By mobilizing every available citizen, including training women for active and auxiliary aviation roles, we significantly expand our operational capacity."
 
 exiled_air_production:0 "Exiled Air Production"
 exiled_air_production_desc:0 "Collaboration with allied aircraft manufacturers allows us to secure raw materials and assemble light combat aircraft for our exile air force."
 
 generic_exile_resistance_idea:0 "Exile Resistance Coordination"
 generic_exile_resistance_idea_desc:0 "Establishing direct radio links and supply chains with underground resistance movements in occupied territory to coordinate sabotage operations."
 
 expand_intelligence_idea:0 "Expanded Intelligence Network"
 expand_intelligence_idea_desc:0 "Integrating our decryption teams and field agents into allied intelligence structures, granting us access to advanced spy networks."
