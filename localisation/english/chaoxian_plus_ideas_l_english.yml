  KOR_zhiqing_xiaxiang_modifiers_desc: "$KOR_zhi_qing_xiaxiang_desc$"
  KOR_xuesheng_yundong_xianfeng_idea: "Socialist Patriotic Youth League"
  KOR_xuesheng_yundong_xianfeng_idea_desc: "$KOR_xuesheng_yundong_xianfeng_desc$"
  KOR_peiyang_difang_ganbu_idea: "$KOR_chengshihua_xunlian$"
  KOR_chaoxian_dahui_dynamic: "Supreme People's Assembly"
  KOR_lianjia_baku_shiyou: "Cheap Baku Oil"
  KOR_lianjia_baku_shiyou_tt: "While this national spirit exists, §Yevery month§! we will receive trade §Yfuel§! from [SOV.GetAdjective]!"
