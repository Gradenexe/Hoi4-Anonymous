  KOR_ziyou_guoji_lianmeng_modifier_key: "Democratic Technical Cooperation Council"
  KOR_japanese_reckoning: "Korea-Japan Final Battle"
  KOR_saochu_wenmang_yundong_idea: "Literacy Campaign"
  KOR_saochu_wenmang_yundong_idea_tt: "§YAfter 120 days§!, the cultural level of the people will be improved, and the effect of the national spirit will be enhanced."
  KOR_saochu_wenmang_yundong_idea1_tt: "After 120 days, the §Ynational spirit§! will be upgraded to:"
  KOR_saochu_wenmang_yundong_idea_1: "Sprout of Knowledge"
  KOR_shehui_kexueyuan_idea: "Academy of Social Sciences of Korea"
  ####################################################################### 朝鲜政治————民主
  KOR_democratic_zhengzhi: "Rose of Sharon in Bloom"
  KOR_democratic_zhengzhi_desc: "The Rose of Sharon is a symbol of the perseverance and unyielding spirit of our nation. After a long harsh winter, this flower of hope finally blooms brightly on the land of the Republic. Its blooming proclaims the end of the authoritarian era and symbolizes the vibrant vitality of freedom, democracy, and civil rights. We will build an open and prosperous new country based on public opinion, and the people will personally guard this hard-won achievement."
  modify_KOR_democratic_zhengzhi_modifiers: "§Y$KOR_democratic_zhengzhi$§! Additional Effects:"
  KOR_Christian_Church_modifiers: "Kingdom of God"
  KOR_Christian_Church_modifiers_desc: "We are no longer a republic of mortals, but a divine kingdom on earth of God in the East. All nationals are united under the cross, dedicating everything to fulfilling God's will, and our cause is sacred and inviolable."
  modify_modify_KOR_democratic_zhengzhi_modifiers: "§Y$modify_KOR_democratic_zhengzhi_modifiers$§! Additional Effects:"

  KOR_guojia_anbao_fa_modifiers: "Central Intelligence Agency (KCIA)"
  KOR_guojia_anbao_fa_modifiers_desc: "In a world of war filled with spies and conspiracies, a powerful intelligence agency is the guarantee of national survival. We will spare no effort to build an intelligence empire capable of strict internal surveillance and effective external infiltration. The sharp sword in the dark will guard the light of the country."
