l_english:
  #######################################################################################################################################################################
  ############################################################      朝鲜总督府        ################################################################################
  #######################################################################################################################################################################
  JKO_chaoxian_zongdu_fu: "Governor-General of Korea"
  JKO_chaoxian_zongdu_fu_desc: "In the 43rd year of Meiji, the Japan-Korea Annexation Treaty was signed, the Korean Empire perished, and its sovereignty was transferred to the Empire. Immediately after, the Empire renamed the Resident-General of Korea, which was established in Korea, to the Governor-General of Korea, directly under the Emperor. It held military, legislative, administrative, and judicial powers over the Korean colony. Under the Plenipotentiary Governor, there were the Chief of Administrative Affairs, the Governor's Secretariat, and five ministries. In addition, there were institutions such as the Central Council, the Police Superintendent's Department, courts, and the Railway Bureau."
  modify_chaoxian_zongdu_fu: "§Y$JKO_chaoxian_zongdu_fu$§! Additional Effects:"
  JKO_yibingyundong_de_jiyi: "Memory of the Righteous Army Movement"
  JKO_yibingyundong_de_jiyi_desc: "From the end of the 19th century to after the Annexation Treaty. The armed resistance of the 'Righteous Armies' cost the Empire dearly. This bloody memory has left the Governor-General's Office with a pathological fear and vigilance towards any form of Korean armed forces."
  JKO_xianbing_jingcha_zhidu_dynamic: "Gendarmerie Police System"
  JKO_xianbing_jingcha_zhidu_dynamic_desc: "It is not ordinary police who maintain public order on the peninsula, but the 'Gendarmerie Police' integrated with the military. They possess immense power, with influence spread across the peninsula, stifling all resistance in the bud through harsh and efficient means."
  modify_xianbingjingcha_zhidu: "§Y$JKO_xianbing_jingcha_zhidu_dynamic$§! Additional Effects:"
  JKO_dalu_bingzhan_jidi_dynamic: "Continental Military Depot Base"
  JKO_dalu_bingzhan_jidi_dynamic_desc: "The Empire's strategists regard the peninsula as a springboard for attacking the continent and a logistics warehouse. All industrial planning and railway construction prioritize serving the war over improving people's livelihood."
  modify_dalu_bingzhan_jidi: "§Y$JKO_dalu_bingzhan_jidi_dynamic$§! Additional Effects:"
  JKO_caituan_de_longduan_dynamic: "Zaibatsu Monopoly"
  JKO_caituan_de_longduan_dynamic_desc: "Mines, fisheries, finance, transportation... almost all profitable industries on the peninsula are controlled by Japan's giant zaibatsu. Higher education and key technical positions are firmly held by the Japanese; we lack our own engineers, scientists, and senior technicians. Local capital has no room to survive, and profits flow continuously overseas."
  modify_caituan_de_longduan: "§Y$JKO_caituan_de_longduan_dynamic$§! Additional Effects:"
  JKO_chaoxian_zongdu_budui: "Korean Army (Governor-General's Forces)"
  JKO_chaoxian_zongdu_budui_desc: "The Korean Garrison Army, formerly the Korean Garrison Army stationed in the Korean Empire during the Russo-Japanese War. In the 43rd year of Meiji, it was renamed the Korean Garrison Army following the Japan-Korea Annexation. In the 7th year of Taisho, it was reorganized into the Korean Army. The headquarters was initially set in Seoul, then moved to Yongsan in the suburbs."
  modify_chaoxian_zongdu_budui: "§Y$JKO_chaoxian_zongdu_budui$§! Additional Effects:"
  JKO_zongdu_ribenqiaomin: "Japanese Colonization Groups"
  JKO_zongdu_ribenqiaomin_desc: "By resettling people from the Empire's mainland to live on the Korean Peninsula, we can further expand the labor force and bring more opportunities for industrial development"
  JKO_chafeng_baokan: "Crackdown on Nationalist Newspapers"
  JKO_chafeng_baokan_desc: "To effectively combat the threat of domestic resistance, we must organize the Tokko department to be ready to suppress any resistance movements."
  JKO_diyici_jiaoyuling: "Korean Education Decree"
  JKO_diyici_jiaoyuling_desc: "Education is a melting pot for reshaping ideas. The new Education Decree designates Japanese as the 'national language', Korean history is downplayed, and all courses aim to cultivate loyal 'Imperial Subjects' as the ultimate goal."
  JKO_guoyu_changyong_yundong_idea: "National Language Common Use Movement"
  JKO_guoyu_changyong_yundong_idea_desc: "Promote Japanese to every corner of social life. By establishing 'National Language Family' awards and lecture halls, make using Japanese a matter of honor, and eventually replace our mother tongue in daily life."
  JKO_neixian_yitilun_xuanchuan_idea: "Naeseon Ilchilron Propaganda"
  JKO_neixian_yitilun_xuanchuan_idea_desc: "Through newspapers, radio, and films, vigorously promote the 'Theory of Common Ancestry of Japan and Korea', emphasizing that we share the same blood and destiny with the Yamato nation, thereby dissolving national boundaries and paving the way for complete annexation."
  JKO_chuangshi_gaiming_idea: "Sōshi-kaimei (Name Change Policy)"
  JKO_chuangshi_gaiming_idea_desc: "From cities to villages, crowds of people flocked to the household registration offices to change their surnames. Many families even took pride in obtaining a 'shi' (clan name) that harmonized with prominent Japanese clans."
  JKO_chuangshi_gaiming_idea_two: "Sōshi-kaimei (Name Change Policy)"
  JKO_chuangshi_gaiming_idea_two_desc: "The decree achieved partial success in form, but had little effect on truly shaking the inner identity of this nation. We changed their names on the register, but failed to change their hearts."
  JKO_jiandao_teshe_budui_idea: "Gando Special Forces"
  JKO_jiandao_teshe_budui_idea_desc: "In the 'Gando' region on the Manchurian border, form a special unit with Koreans familiar with the terrain. They will use cruel and efficient means to eliminate anti-Japanese guerrillas in the area and offer a token of allegiance to the Empire."
  JKO_gongrongquan_jishi: "Cornerstone of the Greater East Asia Co-Prosperity Sphere"
  JKO_gongrongquan_jishi_desc: "[ROOT.GetNameDefCap] is a model governorate of the suzerain state, and thus receives matching investment, as the suzerain state also benefits from further development.\n§RIf the Congo is no longer a vassal of [JAP.GetNameDef], this spirit will be removed§!"
  JKO_gongrongquan_jishi_tt: "§RIf [JKO.GetNameDef] is no longer a colony, this spirit will be removed§!"
  JKO_nikanbudao_jiuxing_ideas: "Unbelievable, the entire peninsula can't scrape together a single factory for spy operations"
  JKO_fangzhi_zibao: "Prevent Player Self-Destruction"
  JKO_JAP_yimin_kaishi: "Immigration Economy"
  JKO_xiaomai_chukou_ideas: "Governor-General's Office Agricultural Imports"
  ##################################
  ### 独立 ###
  ##################################
  JKO_bandao_duli_one_dynamic: "Spirit of the March 1st Movement"
  JKO_bandao_duli_one_dynamic_desc: "Twenty-six years of colonial rule, like a hard and cold crust, have suppressed everything on this land. The police and gendarmes of the Governor-General's Office thought they had extinguished all sparks of resistance, but little did they know that the real flames had long gone underground. We will gather these scattered sparks into an unstoppable fire surging underground. It will gather strength, burn down the oppression of the old era, and usher in a new world belonging to the people."
  JKO_resistance_against_colonial_rule_dm: "$KOR_resistance_against_colonial_rule_dm$"
  modify_JKO_bandao_duli_one_dynamic: "§Y$JKO_bandao_duli_one_dynamic$§! Additional Effects:"
  JKO_fankangjun_dabenying_modifiers: "Resistance Army Garrison"
  JKO_tielue_huihuai_modifiers: "Railway Guerrilla Resistance"
  JKO_sizhan_butui: "§RWe swear to the death not to be subjugated slaves!§!"
  KOR_yilie_tuan_idea: "Uiyeoldan"
  KOR_yilie_tuan_idea_desc: "No matter where we are, the determination to reclaim our homeland is our only belief. This unyielding will sustain us until the final moment of victory."
  KOR_shouzhiyu_jiangjieshi: "Reliance on the Kuomintang"
  KOR_shouzhiyu_jiangjieshi_desc: "The support of Chairman Chiang is crucial to our survival, but it also subjects us to the influence of others in many decisions. Our independence is facing a severe test."
  KOR_guoji_guli: "International Isolation"
  KOR_guoji_guli_desc: "Few countries in the world recognize our legitimacy. On the chessboard of great powers, we are but a trivial piece, and the path of diplomacy is fraught with thorns."
  KOR_liuwang_zhengfu: "Exile Government"
  KOR_liuwang_zhengfu_desc: "We have lost our homeland and can only survive with difficulty under the protection of foreign lands. The government’s decrees are limited to offices, and the lack of foundation makes our struggle arduous."
  KOR_liuwang_zhengfu_modifiers: "$KOR_liuwang_zhengfu$"
  modify_KOR_liuwang_zhengfu_dynamic: "§Y$KOR_liuwang_zhengfu_modifiers$§! Additional Effect："
  exiled_government_weekly_manpower_tt: "$MODIFIER_EXILED_GOVERNMENT_WEEKLY_MANPOWER$：$RIGHT|+$"
  ##################################
  ### 工业企业 ###
  ##################################
  JKO_tetsudou_shou: "Imperial Japanese Railway Ministry"
  #######################################################################################################################################################################
  ############################################################      朝鲜  独立      ################################################################################
  #######################################################################################################################################################################
  ###
  KOR_fenghuo_liaoyuan: "A Nation in Desperate Straits"
  KOR_fenghuo_liaoyuan_desc: "Either independence or extinction. The fate of the entire nation hinges on this war, which gives us unparalleled fighting spirit but also pushes the country to the brink of collapse."
  KOR_zhengshou_peijizhi: "Levy and Ration System"
  KOR_fenghuo_liaoyuan_tt: "This national spirit will be §Yremoved§! after we successfully gain independence!"
  KOR_tongbao_zhiyuanjun: "International Brigades"
  ###
  KOR_shengli_de_shanghen: "Fatigue of Victory"
  KOR_shengli_de_shanghen_desc: "Long-term oppression and the brutal war of independence have destroyed our homeland and torn apart society. The country is in ruins and needs time to heal the wounds of the people."
  KOR_shengli_de_shanghen_tt: "This national spirit will be §Yremoved§! after the election is completed."
  KOR_zmdjjdyc_dabenying_modifiers: "Legacy of Colonial Economy"
  KOR_zmdjjdyc_dabenying_modifiers_desc: "Our economy was once a vassal serving Japan. Japan's colonial rule and the final devastation of the war led to a severe loss of infrastructure and industry. Resources were plundered, the industrial structure was distorted, and now we must build an independent and self-reliant economic system from scratch."
  modify_KOR_zmdjjdyc_dabenying_modifiers: "§Y$KOR_zmdjjdyc_dabenying_modifiers$§! Additional Effects:"
  KOR_zmdjjdyc_dabenying_modifiers_1: "Legacy of Colonial Economy"
  KOR_zmdjjdyc_dabenying_modifiers_1_desc: "Our economy was once a vassal serving Japan. Japan's colonial rule and the final devastation of the war led to a severe loss of infrastructure and industry. Resources were plundered, the industrial structure was distorted, and now we must build an independent and self-reliant economic system from scratch."
  KOR_zmdjjdyc_dabenying_modifiers_2: "Economic Miracle"
  KOR_zmdjjdyc_dabenying_modifiers_2_desc: "Light industry and agriculture are no longer the pillars of the economy; heavy industry has surpassed them. Coupled with the outstanding economic reforms of Shimomura Osamu, poverty and unemployment have been greatly reduced. Soon, we will rank among one of the world's largest economies!"
  KOR_paixilinli_dabenying_modifiers: "Factionalized Council"
  KOR_paixilinli_dabenying_modifiers_desc: "The goal of independence has been achieved, but there is widespread disagreement on the path to building the country. The Provisional Government in exile in Shanghai, communists in Yan'an, nationalists and old nobles at home... everyone believes they hold the truth."
  modify_KOR_paixilinli_dabenying_modifiers: "§Y$KOR_paixilinli_dabenying_modifiers$§! Additional Effects:"
  stability_weekly_tt: "$MODIFIER_STABILITY_WEEKLY$：$RIGHT|+=%1$"
  KOR_jishu_rencai_duanceng: "Talent Gap in Technology"
  KOR_jishu_rencai_duanceng_desc: "During the colonial period, all key technical and management positions were occupied by the Japanese. With their departure, we find ourselves severely lacking engineers and scientists capable of operating advanced equipment and managing complex factories."
  KOR_lingsan_de_dikangjun: "Scattered Resistance Army"
  KOR_lingsan_de_dikangjun_desc: "Our army is composed of guerrillas from various regions, insurgent militias, and defected puppet troops. They have high morale but lack unified command, standardized equipment, and modern tactical literacy."

  #################################################################### 朝鲜独立————政治
  KOR_zhengzhi_zhenxing_guojia_idea: "Rebuild the Nation"
  KOR_zhengzhi_zhenxing_guojia_idea_desc: "If we hope to recover from the scourge of the Japanese, we must go all out to carry out rapid reconstruction. During this period, the people will have to live a simple life and work hard, but they will certainly do so for a better tomorrow."
  KOR_meiyou_jiandie_dlc: "[ROOT.GetAdjective] Counterintelligence Program"
  KOR_meiyou_jiandie_dlc_desc: "Espionage is one of the many fronts we must face in this global conflict, so effectively activating our own counterintelligence program is crucial to surviving this war. We have adopted a stance that focuses on defensive policies rather than aggressive covert operations strategies."
  #################################################################### 朝鲜独立————工业
  KOR_jingji_qingsuan_jishu_idea: "Sprout of Scientific Research and Technology"
  KOR_jingji_laogong_dongyuan_idea: "Labor Mobilization Plan"
  KOR_jingji_laogong_dongyuan_idea_desc: "Our most precious resource is our hardworking people. To accelerate post-war reconstruction and industrialization, we will launch a nationwide 'Labor Mobilization Plan' to uniformly register, train, and allocate labor, deploying them to the most urgently needed reservoir, railway, and factory construction projects. We will use the hands of the people to lay a solid foundation for the country's future."
  KOR_jingji_quanguo_tieluwang_idea: "National Railway Network Plan"
  KOR_jingji_quanguo_tieluwang_idea_desc: "Our country's current railway network is fragmented and unable to meet the needs of a modern nation. We will formulate a new 'National Railway Network Plan', using steel sleepers to closely connect all our important cities, ports, and resource-producing areas, forming the unified artery of the nation."
  KOR_electrification_modifier: "$AFG_electrification_modifier$"

  ####################################################################### 朝鲜独立————军事
  KOR_army_communism: "[KOR.GetAdjective] Army (Communist)"
  KOR_army_communism_desc: "From guerrillas on Baekdu Mountain to veterans of foreign battlefields, our army is composed of patriots with diverse backgrounds but a unified belief. They may be poorly equipped and their training system urgently needs integration, but their firm will to defend the country is their sharpest weapon. This army is the cornerstone of national independence, bearing the heavy mission of rebuilding the homeland on the shattered mountains and rivers."
  KOR_army_democratic: "[KOR.GetAdjective] Army (Democratic)"
  KOR_army_democratic_desc: "From guerrillas on Baekdu Mountain to veterans of foreign battlefields, our army is composed of patriots with diverse backgrounds but a unified belief. They may be poorly equipped and their training system urgently needs integration, but their firm will to defend the country is their sharpest weapon. This army is the cornerstone of national independence, bearing the heavy mission of rebuilding the homeland on the shattered mountains and rivers."
  modify_KOR_army_communism_modifiers: "§Y$KOR_army_communism$§! Additional Effects:"
  trait_winter_specialist_xp_gain_factor_tt: "$modifier_trait_winter_specialist_xp_gain_factor$：$RIGHT|+=%1$"
  trait_winter_expert_xp_gain_factor_tt: "$modifier_trait_winter_expert_xp_gain_factor$：$RIGHT|+=%1$"
  land_reinforce_rate_tt: "$MODIFIER_LAND_REINFORCE_RATE$：$RIGHT|+=%1$"
  #
  KOR_air_communism: "[KOR.GetAdjective] Air Force (Communist)"
  KOR_air_communism_desc: "We are no longer content to look up at the fighter jets of other countries. Although the hangars only contain a few old aircraft and young pilots are still learning and growing, this fledgling air force represents our desire to control our own airspace. Every pilot who soars into the sky shoulders the nation's dream of the blue sky, determined to guard the land beneath their feet with their wings."
  KOR_air_democratic: "[KOR.GetAdjective] Air Force (Democratic)"
  KOR_air_democratic_desc: "We are no longer content to look up at the fighter jets of other countries. Although the hangars only contain a few old aircraft and young pilots are still learning and growing, this fledgling air force represents our desire to control our own airspace. Every pilot who soars into the sky shoulders the nation's dream of the blue sky, determined to guard the land beneath their feet with their wings."
  modify_KOR_air_communism_modifiers: "§Y$KOR_air_communism$§! Additional Effects:"
  navy_carrier_air_attack_factor_tt: "$MODIFIER_NAVAL_CARRIER_AIR_ATTACK_FACTOR$：$RIGHT|+=%1$"
  navy_carrier_air_targetting_factor_tt: "$MODIFIER_NAVAL_CARRIER_AIR_TARGETTING_FACTOR$：$RIGHT|+=%1$"
  #
  KOR_navy_communism: "[KOR.GetAdjective] Navy (Communist)"
  KOR_navy_communism_desc: "Territory surrounded by the sea on three sides constantly reminds us of the importance of the ocean. At present, we only have a small number of naval vessels guarding the long coastline and fishing grounds. However, the belief in repelling the enemy outside the country's borders will guide this young navy to start from coastal defense and gradually move towards the deep blue, becoming a solid Great Wall guarding our maritime lifeline."
  KOR_navy_democratic: "[KOR.GetAdjective] Navy (Democratic)"
  KOR_navy_democratic_desc: "Territory surrounded by the sea on three sides constantly reminds us of the importance of the ocean. At present, we only have a small number of naval vessels guarding the long coastline and fishing grounds. However, the belief in repelling the enemy outside the country's borders will guide this young navy to start from coastal defense and gradually move towards the deep blue, becoming a solid Great Wall guarding our maritime lifeline."
  modify_KOR_navy_communism_modifiers: "§Y$KOR_navy_communism$§! Additional Effects:"
  navy_capital_ship_attack_factor_tt: "$MODIFIER_NAVY_CAPITAL_SHIP_ATTACK_FACTOR$：$RIGHT|+=%1$"
  invasion_preparation_tt: "$MODIFIER_NAVAL_INVASION_PREPARATION$：$RIGHT|-=%1$"
  refit_ic_cost_tt: "$MODIFIER_INDUSTRIAL_REFIT_IC_COST_FACTOR$：$RIGHT|-=%1$"
  naval_has_potf_in_combat_attack_tt: "$MODIFIER_NAVAL_HAS_POTF_IN_COMBAT_ATTACK$：$RIGHT|+=%1$"
  #
  KOR_gailiang_zhuangjiache: "Improved Armored Vehicles"
  KOR_qiji_wuqi: "Advanced Weapons Program"
  KOR_qiji_wuqi_desc: "The Advanced Weapons Program is an ambitious concept aimed at reshaping the form of future warfare through disruptive technological innovation. Our researchers are constantly pushing the limits of possibility, committed to creating a series of revolutionary weapons. These cutting-edge weapons will ensure our absolute superiority in the air, at sea, and on land. These breakthrough achievements are expected to change the world order, and any opponent who dares to stand against us will face annihilation."
  modify_KOR_qiji_wuqi_modifiers: "§Y$KOR_qiji_wuqi$§! Additional Effects:"
  ####################################################################### 朝鲜政治————共产
  KOR_communism_zhengzhi: "[KOR.GetAdjective] Communist Party"
  KOR_communism_zhengzhi_desc: "With a program of thorough social transformation, the Communist Party of Korea is the vanguard of the working class and peasants. It is committed to building a socialist country without exploitation and with equality for all. This force is full of revolutionary enthusiasm, has a rigorous organization and firm beliefs, and is the backbone of promoting radical land reform and industrial nationalization. It will lead Korea down a path completely different from the capitalist world."
  modify_KOR_communism_zhengzhi_modifiers: "§Y$KOR_communism_zhengzhi$§! Additional Effects:"
  max_surrender_limit_offset_tt: "$MODIFIER_MAX_SURRENDER_LIMIT_OFFSET$：$RIGHT|+=%1$"
  KOR_guojia_anquan_baoweibu: "Reconnaissance General Bureau of the People's Army"
  KOR_guojia_anquan_baoweibu_desc: "A sharp blade dancing in the shadows, the Reconnaissance General Bureau of the People's Army is the sharpest eyes, ears, and claws of the Republic. They are omnipresent, infiltrating behind enemy lines, gathering intelligence, and carrying out covert missions. The efficiency and loyalty of this special force ensure the supreme commander's precise control over internal and external situations. They are the invisible shield of the country and the invisible hand that slits the enemy's throat."
  modify_KOR_guojia_anquan_baoweibu_modifiers: "§Y$KOR_guojia_anquan_baoweibu$§! Additional Effects:"
  army_intel_factor_tt: "$MODIFIER_ARMY_INTEL_FACTOR$：$RIGHT|+=%1$"
  airforce_intel_factor_tt: "$MODIFIER_AIRFORCE_INTEL_FACTOR$：$RIGHT|+=%1$"
  KOR_shehui_zhuyi_jingji: "Socialist Economy"
  KOR_shehui_zhuyi_jingji_desc: "To build a powerful motherland without exploitation, we will nationalize all means of production and guide economic construction with unified national planning. The free market is completely abolished, replaced by full investment in heavy industry. Through this directive economic model, we will rapidly establish a strong industrial foundation on the ruins, striving to achieve self-reliance and defend the revolution."
  modify_KOR_shehui_zhuyi_jingji_modifiers: "§Y$KOR_shehui_zhuyi_jingji$§! Additional Effects:"
  KOR_yanan_paixi1: "Yan'an Faction"
  KOR_nanlao_paixi1: "South Labor Faction"
  KOR_kanglian_paixi1: "Anti-Japanese Allied Army Faction"
  KOR_sulian_paixi1: "Soviet Faction"
  KOR_dangpai_douzheng_dynamic: "Factional Struggle"
  modify_KOR_dangpai_douzheng_dynamic_modifiers: "§Y$KOR_dangpai_douzheng_dynamic$§! Additional Effects:"
