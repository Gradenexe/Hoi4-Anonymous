l_english:
  KOR_communism_shi_lanse: "Communism:\nGuidance of the North Star"
  KOR_democratic_shi_lanse: "Democracy:\nThe Infinite Blossom of Blue"
  KOR_neutrality_shi_lanse: "Neutrality:\nLighthouse of People's Governance"
  KOR_fascism_shi_lanse: "Fascism:\nShadow of Restoration"
  KOR_junshi_shrtycu: "Militarism:\nDisbandment and Reorganization"
  KOR_gongye_shrtycu: "Industrialization:\nLiquidating Colonial Legacy"
###################################################################################################################################################################################################################################      Korean Governor-General's Office      #####################################################################################
  #######################################################################################################################################################################
  JKO_kaiju_guoce_jieshao: "Crossroads of the Three Thousand Li Rivers and Mountains"
  JKO_kaiju_guoce_jieshao_desc: "Korea’s path to independence stands at a crossroads. Should we maneuver deftly on the international stage, striving for the support and recognition of major powers, and return to our homeland as a legitimately restored nation? Or should we sneak back to our native land, organize the people in the heart of the enemy’s territory, and ignite a prairie fire of armed uprising? One path places hope in international diplomacy; the other relies on our own strength. This choice will determine two vastly different fates for Korea."
  ##Submission
  JKO_fucong_riben_one: "The Way of the Imperial Nation"
  JKO_fucong_riben_one_desc: "The wheel of the times rolls forward; the weak are either crushed or seek shelter from giants. Instead of passively accepting rule in silence, we should take the initiative to join the torrent of the new order and find an irreplaceable place for ourselves within the Empire's territory."
  JKO_lalong_sanjing_caifa: "Win Over the Mitsui Zaibatsu"
  JKO_lalong_sanjing_caifa_desc: "Originating in the Edo period, the Mitsui Zaibatsu is now one of the Empire's largest industrial enterprises. We must win its support to maximize its role in national construction."
  JKO_lalong_sanling_caifa: "Win Over the Mitsubishi Zaibatsu"
  JKO_lalong_sanling_caifa_desc: "Initially a shipping company in the Meiji era, Mitsubishi now dominates the Empire's military industry. We must ensure its support for the national regime and fully utilize its facilities."
  JKO_lalong_zhuyou_caifa: "Win Over the Sumitomo Zaibatsu"
  JKO_lalong_zhuyou_caifa_desc: "The Sumitomo Zaibatsu began as a bookstore in Kyoto and later became famous for copper refining. Today, it holds a pivotal position in mineral mining and banking. We must make good use of their assets."
  JKO_lalong_antian_caifa: "Win Over the Yasuda Zaibatsu"
  JKO_lalong_antian_caifa_desc: "Founded in the Meiji era, the Yasuda Zaibatsu has long focused on banking and now deeply penetrates the Empire's financial system. We must gain its support to fully mobilize its enormous wealth."
  JKO_fucong_faxxing_zhanjuan: "Issue War Bonds"
  JKO_fucong_faxxing_zhanjuan_desc: "In the name of 'patriotism', issue 'Holy War' public bonds to pool private capital and contribute to the Empire's grand cause and war machine. All nationals are obligated to purchase them."
  JKO_fucong_zongdu_jianghua: "Governor-General's Instruction"
  JKO_fucong_zongdu_jianghua_desc: "The new Governor-General will deliver a public address to the entire peninsula, clarifying Tokyo's latest policies, emphasizing the future of 'Naeseon Ilche', and setting an unquestionable tone for all subsequent reforms."
  nancilang_shangtai_flag: "The New Governor-General Has Arrived"
  JKO_qingqiu_junbei_xiandaihua: "Request Military Modernization"
  JKO_qingqiu_junbei_xiandaihua_desc: "Our armed forces are still in their infancy. To better serve the Empire, we will request Tokyo for outdated weapon blueprints and advanced military thought of the Empire, taking the first step towards military modernization."
  JKO_yaoqing_rriben_kaituotuan: "Invite Japanese Pioneer Corps"
  JKO_yaoqing_rriben_kaituotuan_desc: "The Korean Peninsula has surplus land but insufficient population, with vast areas yet to be developed. We should properly resettle immigrants, facilitate the formation of new settlements locally, and further develop its economy."
  JKO_yaoqing_maoyidaibiao_tuan: "Trade Delegation"
  JKO_yaoqing_maoyidaibiao_tuan_desc: "The Empire's mainland leads far ahead of the peninsula in science and technology in other industrial and technological fields. We should send a delegation to exchange and learn technologies, which will then be used to improve the production of the Governor-General's Office."
  JKO_guli_riben_touzi: "Encourage Japanese Investment"
  JKO_guli_riben_touzi_desc: "The development and prosperity of the peninsula cannot be separated from the Empire's help, and quite a number of imperial companies are willing to invest in the peninsula."
  JKO_fazhan_dui_riben_maoyilianxi: "Develop Trade Ties with Japan"
  JKO_fazhan_dui_riben_maoyilianxi_desc: "The Empire's mainland expresses a desire for materials and resources, and the peninsula has abundant trade goods. We should encourage trade across the straits to achieve mutual benefit and win-win results."
  JKO_yanjiu_hezuo: "Study Cooperatives"
  JKO_yanjiu_hezuo_desc: "Cooperatives are agricultural cooperative organizations active in Japan and Manchukuo. We should study the reasons for their success for application in other contexts."
  JKO_laodong_fengshi_dui: "Labor Service Corps"
  JKO_laodong_fengshi_dui_desc: "In the name of 'Diligent Service', forcibly conscript a large number of young laborers and deploy them to military projects, mines, and factories. Their blood and sweat will become an indispensable fuel for the Empire's war machine."
  JKO_jiti_nongchang: "Collective Farms"
  JKO_jiti_nongchang_desc: "Family-owned individual farms are backward and inefficient in production. Only by concentrating rural manpower for collective labor can more efficient development be achieved."
  JKO_jiaoyi_weijin_shangpin: "Trade in Contraband Goods"
  JKO_jiaoyi_weijin_shangpin_desc: "Although illegal trade is not the main source of income for the Governor-General's Office, it brings huge profits. It would be foolish to close it down rashly, yet allowing it to run unchecked may bring serious consequences to both the peninsula and the Empire's mainland."
  JKO_kuoda_nongye_chukou: "Increase Agricultural Exports"
  JKO_kuoda_nongye_chukou_desc: "Since the acquisition of Korean territory, this land has served as the granary of the Empire's mainland. We should vigorously expand grain production to supply food throughout the Empire."
  JKO_kuojian_chaoxian_qinggongyei: "Expand Korean Light Industry"
  JKO_kuojian_chaoxian_qinggongyei_desc: "Unrest on the peninsula is an established fact, so we must not allow the lag in light industry development to lead to shortages of daily necessities for the people."
  JKO_kuojian_chaoxian_zhonggongye: "Expand Korean Heavy Industry"
  JKO_kuojian_chaoxian_zhonggongye_desc: "Rapid industrialization is the key to safeguarding the future of the peninsula's situation. By developing a strong heavy industry sector, we will lay the foundation for military strength and economic independence."
  JKO_manxian_yiti_tieluwang: "Manchuria-Korea Railway Integration"
  JKO_manxian_yiti_tieluwang_desc: "Open up the main artery of economy and military. Fully integrate the peninsula's railway network with the 'South Manchuria Railway' to provide seamless connection for the Empire's resource transportation and troop mobilization on the mainland."
  JKO_chaoxian_beifang_zhonggogye: "Northern Heavy Industry Belt"
  JKO_chaoxian_beifang_zhonggogye_desc: "The northern part of the peninsula is rich in resources. Through the construction of the northern region, we can quickly accumulate materials needed for equipment manufacturing and make full use of existing expertise in this field."
  JKO_chaoxian_nanfang_chuanwu: "Southern Port Industrial Construction"
  JKO_chaoxian_nanfang_chuanwu_desc: "Through the construction of southern port harbors, we can utilize the time-honored excellent harbors here to transform this place into a supply base for the Imperial Navy and prepare to export various materials to the Empire's mainland."
  JKO_shuili_fadian_daba: "Hydropower Dam"
  JKO_shuili_fadian_daba_desc: "Without intervention, Korea's industrialization and electrification process will come to a halt. We should build new gravity dams in this area, and engineers from the Han River Hydropower Company have formulated a detailed plan for the project named Hwacheon Dam."
  JKO_beifang_kuangshan_zengcan: "Increase Production in Northern Mines"
  JKO_beifang_kuangshan_zengcan_desc: "The Korean Peninsula has long had rich iron ore deposits. Especially the deposits in the north seem to be particularly abundant. We should consider further investment to fully develop them."
  JKO_kaicai_meikuang: "Korean Peninsula Coal Mine Survey"
  JKO_kaicai_meikuang_desc: "Coal powers our factories, trains, and furnaces. To energize the country and enhance economic strength, we must survey new coal-producing areas."
  JKO_xingnan_huaxue_gongye: "Hungnam Chemical Industrial Complex"
  JKO_xingnan_huaxue_gongye_desc: "We have now mastered coal liquefaction technology, and it is time to build an experimental factory to carry out trial production."
  JKO_lalong_qinri_pai: "Win Over Pro-Japanese Factions"
  JKO_lalong_qinri_pai_desc: "For the stability of governance, we must incorporate active collaborators into the system. We will establish the 'Central Council', awarding them honors and nominal power to make them our most loyal lackeys."
  JKO_diyici_jiaoyu_ling: "Revise the 'Korean Education Decree'"
  JKO_diyici_jiaoyu_ling_desc: "Education is the melting pot for transforming thoughts. The new education decree will designate Japanese as the 'national language', downplay Korean history, and all courses will aim to cultivate loyal 'Imperial Subjects' as the ultimate goal."
  JKO_guoyu_changyong_yundong: "National Language Popularization Movement"
  JKO_guoyu_changyong_yundong_desc: "Promote Japanese to every corner of social life. By establishing 'National Language Family' awards and lecture halls, make the use of Japanese a glory, and eventually replace our mother tongue in daily life."
  JKO_neixian_yitilun_xuanchuan: "Naeseon Ilche Propaganda"
  JKO_neixian_yitilun_xuanchuan_desc: "Through newspapers, radio, and movies, vigorously promote the 'Theory of Common Ancestry of Japan and Korea', emphasizing that we share the same blood and destiny with the Yamato nation, thereby eliminating national boundaries and paving the way for complete merger."
  JKO_chuangshi_gaiming: "Sōshi-kaimei (Name Change Policy)"
  JKO_chuangshi_gaiming_desc: "This is the ultimate means to cut off the connection with clans and history. The decree will force all families to abandon traditional surnames and adopt Japanese-style 'shi-myō' (clan and given names), becoming 'new Japanese' without a past."
  JKO_chuangshi_gaiming_one_tt: "§YThis is a crucial step to cut off ties with the old era and embrace rebirth...§!"
  JKO_chuangshi_gaiming_tt: "When we complete §Y$JKO_guoyu_changyong_yundong$§! and §Y$JKO_neixian_yitilun_xuanchuan$§!, the probability will become: §Y15/40/5§!."
  JKO_tuiguang_huangminhua_yundong: "Kōminka Movement (Imperialization Movement)"
  JKO_tuiguang_huangminhua_yundong_desc: "Push all assimilation policies to the peak. This is a systematic project aimed at completely transforming all Koreans into loyal 'Imperial Subjects' of the Emperor from the aspects of spirit, culture, and living habits."
  JKO_tuiguang_huangminhua_yundong_tt: "When we complete §Y$JKO_diyici_jiaoyu_ling$§!, the probability will become: §Y30/50/15§!.\nWhen we complete §Y$JKO_guoyu_changyong_yundong$§! or §Y$JKO_neixian_yitilun_xuanchuan$§!, the probability will become: §Y40/30/10§!.\nWhen we complete §Y$JKO_guoyu_changyong_yundong$§! and §Y$JKO_neixian_yitilun_xuanchuan$§!, the probability will become: §Y50/20/5§!."
  JKO_chaoxian_bandao_jidu: "Seoul Apostolic Vicariate"
  JKO_chaoxian_bandao_jidu_desc: "Lu Jinan, the current chief auxiliary of the Seoul Apostolic Vicariate, has made remarks fully supporting the Empire's liberation of Asia. Perhaps it is time to give him a seat in the alliance?"
  JKO_tuixing_guojia_shendao: "Promote State Shinto"
  JKO_tuixing_guojia_shendao_desc: "State Shinto has played a great role in the Empire, mobilizing millions of people. We should follow suit in the peninsula's territory, even if there may be resistance at the beginning."
  JKO_tianzhaodashen_de_fenling: "Divine Spirit of Amaterasu Omikami"
  JKO_tianzhaodashen_de_fenling_desc: "Invite the divine spirit of Amaterasu Omikami from the Ise Grand Shrine to establish the highest-level 'Chosen Shrine' in Gyeongseong (Seoul). This is to strengthen imperial power with theocratic power and incorporate the peninsula into the theocratic Japanese system at the level of faith."
  JKO_huangguo_chenmin_shici: "Imperial Subject Oath"
  JKO_huangguo_chenmin_shici_desc: "'We are all loyal and good subjects of His Majesty the Emperor...' Designate this oath as a daily compulsory lesson, and engrave the concept of loyalty into everyone's mind like a brand through constant repetition."
  JKO_qianghua_zhongyang_jiquan: "Strengthen Centralization of Power"
  JKO_qianghua_zhongyang_jiquan_desc: "The armed forces of the peninsula's rioters have seriously damaged the stability of the Empire's rule here and must not be retained. A centralized leadership system must be established."
  JKO_sheli_chaoxian_shuxuan_yiyuan: "Establish Korean Appointed Members of the Diet"
  JKO_sheli_chaoxian_shuxuan_yiyuan_desc: "As the highest reward for loyalty, Tokyo has granted us the privilege to select several non-voting members of the Diet to attend the Imperial Diet. This is propagated as irrefutable evidence and a great honor of 'Naeseon Ilche'."
  JKO_kuoda_jingcha_xitong: "Expand Police System"
  JKO_kuoda_jingcha_xitong_desc: "With the deepening of assimilation policies, the undercurrent of resistance is also surging day by day. We must recruit more police officers, equip them with better weapons, and strangle all unstable factors in the cradle."。"
  JKO_kuoda_jingcha_xitong_tt: "$MODIFIER_REQUIRED_GARRISON_FACTOR$：§R+5.0%§!\n"
  JKO_linzu_zhidu_lianzuo: "Rinzu System (Neighborhood Association System) with Collective Responsibility"
  JKO_linzu_zhidu_lianzuo_desc: "Establish a 'Rinzu' system with ten households as a unit and implement the collective responsibility law. Neighbors monitor and inform on each other, extending the Empire's rule to the farthest reaches of society."
  JKO_chafeng_minzuzhuyi_baokan: "Ban Nationalist Newspapers"
  JKO_chafeng_minzuzhuyi_baokan_desc: "Newspapers such as the Dong-A Ilbo are breeding grounds for anti-Japanese thoughts. We will permanently ban them on the charge of 'disturbing public order' and establish a strict press censorship system to ensure the absolute purity of public opinion."
  JKO_gaige_difang_xingzheng: "Reform Local Administration"
  JKO_gaige_difang_xingzheng_desc: "Abolish the old 'Do-Bu-Gun' (Province-Prefecture-County) system and replace it with the 'To-Do-Fu-Ken' (Metropolis-Province-Prefecture-County) structure consistent with Japan's mainland. This is not only a change of names but also a redistribution of power, aiming to dismantle local clan forces."
  JKO_quanguo_tudi_diaocha: "National Land Survey"
  JKO_quanguo_tudi_diaocha_desc: "In the name of establishing a modern land ownership system, conduct a thorough survey and registration of national land. This will provide the most accurate data support for our subsequent tax reforms and resource expropriation."
  JKO_huji_xitong_xiandaihua: "Modern Household Registration System"
  JKO_huji_xitong_xiandaihua_desc: "Introduce a modern household registration system consistent with Japan's mainland to accurately grasp the national population and family structure. This will greatly facilitate our subsequent manpower mobilization and social control."
  JKO_zongdufu_de_juedui_tongzhi: "Absolute Authority of the Governor-General's Office"
  JKO_zongdufu_de_juedui_tongzhi_desc: "Enact a special decree to grant the Governor-General's Office supreme power, and its issued 'ordinances' shall have the same effect as laws. This is the cornerstone for establishing an efficient centralized rule and removing all obstacles."
  JKO_mufan_zongdu_qu: "Cornerstone of the Co-Prosperity Sphere"
  JKO_mufan_zongdu_qu_desc: "We will no longer be a dispensable borderland of the Empire, but the 'cornerstone' connecting Japan and the mainland. Actively promote the strategic value of the peninsula to gain a higher status and recognition in the new order."
  JKO_mufan_zongdu_qu_tt: "§Y[JKO.GetNameDefCap]§! will no longer be able to §Yincrease§! their §Yautonomy§!, and §Y[JAP.GetNameDef]§! will no longer be able to §Rdecrease§! autonomy"
  JKO_chaoxian_neidi_yanchang_zhuyi: "Naichi Enchō Shugi (Mainland Extensionism)"
  JKO_chaoxian_neidi_yanchang_zhuyi_desc: "Formally petition the Tokyo government to request the elevation of Korea's legal status from 'Gaichi' (Outer Lands) to an 'extension of Japan's Naichi (Mainland)'. This is the ultimate goal of breaking away from colonial status and integrating into Japan's mainland in terms of jurisprudence."
  JKO_riben_guwen_tuan: "Invite Japanese Advisors"
  JKO_riben_guwen_tuan_desc: "Our administrative, industrial, and military systems are still immature. We will humbly invite outstanding advisors from the Empire to provide guidance, learn advanced experience at the fastest speed, and improve our governance efficiency."
  JKO_riben_shiguan_xuexxiao: "Army War College"
  JKO_riben_shiguan_xuexxiao_desc: "Select the most loyal and intelligent young people and send them to study at the Army War College in Suining. They will become the backbone of the future imperialized army and a link between us and the Imperial military."
  JKO_kuobian_chaoxian_jun: "Expand the Korean Army"
  JKO_kuobian_chaoxian_jun_desc: "Since 1904, the Korean Army has existed as a garrison force in Korea and has rarely participated in combat except for the invasion of Manchuria in 1931. We should abolish the treaties that restrict the Korean Governor-General's Office and expand this force to make it a real combat force."
  JKO_bandao_zhengbing_ling: "Peninsula Conscription Decree"
  JKO_bandao_zhengbing_ling_desc: "After proving absolute loyalty, His Majesty the Emperor will graciously approve the implementation of the 'blood tax' on the peninsula. This will completely release our manpower potential and let our young men fight for the glory of the Empire."
  JKO_bandao_zhengbing_ling_tt: "Activate §Y$extensive_conscription$§!, which will be changed to §Y$service_by_requirement$§! when economically feasible."
  JKO_weibandao_zhanzheng_zuozhunbei: "Prepare for the Peninsula War"
  JKO_JKO_weibandao_zhanzheng_zuozhunbei_desc: "If the war goes badly, the Korean Peninsula is likely to become the Empire's last stronghold on the mainland. We should prepare to defend this region in the worst-case scenario."
  JKO_guandongjun_de_jingyan: "Experience of the Kwantung Army"
  JKO_JKO_guandongjun_de_jingyan_desc: "The Kwantung Army is the elite of the Imperial Army. We will send a group of military officers to observe and learn their combat experience in Manchuria, especially anti-guerrilla warfare and rapid assault tactics, to improve the actual combat capability of our army."
  JKO_shiyanxing_tanke_lian: "Tank Division"
  JKO_shiyanxing_tanke_lian_desc: "Imperial military theorists have long debated the best way to use tanks, and now it seems that combining infantry and tanks is the best approach. We should organize a number of such units."
  JKO_jiandao_teshe_budui: "Kando Special Forces"
  JKO_jiandao_teshe_budui_desc: "In the 'Kando' region on the border of Manchuria, form a special force composed of Koreans familiar with the terrain. They will use cruel and efficient means to eliminate anti-Japanese guerrillas in this area and offer a token of allegiance to the Empire."
  JKO_haian_fangwei_budui: "Coastal Defense Forces"
  JKO_haian_fangwei_budui_desc: "The Korean Peninsula is surrounded by sea on three sides with a long coastline. We must establish specialized coastal defense forces responsible for building fortifications, laying mines, and resisting any potential threats from the sea."
  JKO_fendan_jinhai_fanghu: "Share Offshore Defense Responsibilities"
  JKO_fendan_jinhai_fanghu_desc: "The main force of the Imperial Navy has expedited to the Pacific Ocean, leaving offshore defense empty. We will form a small fleet composed of old destroyers to share the patrol and anti-submarine tasks in key waterways such as the Tsushima Strait."
  JKO_hangkong_zhushi_huishe: "Aviation Joint-Stock Company"
  JKO_hangkong_zhushi_huishe_desc: "Introducing Mitsubishi Heavy Industries, Ltd. Aviation will enable the peninsula to build a modern air force and reduce the defense pressure on the Empire's mainland."
  JKO_shenfeng_jingshen: "Kamikaze Spirit"
  JKO_shenfeng_jingshen_desc: "As a special attack unit, the Kamikaze Corps has turned suicide attacks from a last-minute whim into an established doctrine. With the assistance of new aircraft—a manned missile—such attacks will be unstoppable."
  JKO_gen_riben_yiyi_yusui: "Allegiance to His Majesty the Emperor"
  JKO_gen_riben_yiyi_yusui_desc: "The Banzai Charge embodies the combat spirit of [ROOT.GetAdjective]. As part of military training, every soldier must be familiar with this battle cry and receive training in bayonet charge tactics. With this training, our soldiers will never become prisoners of war but die heroically. Long live His Majesty the Emperor!"

  ##Independence
  JKO_duli_chaoxian_one: "Spirit of the March 1st Movement"
  JKO_duli_chaoxian_one_desc: "Twenty-six years of colonial rule, like a hard and cold crust, suppresses everything on this land. The police and gendarmes of the Governor-General's Office think they have extinguished all flames of resistance, but they do not know that the real fire has long gone underground. We will gather these sporadic sparks into an unstoppable flame surging underground. It will accumulate strength, burn up the oppression of the old era, and usher in a new world belonging to the people."
  JKO_duli_chaoxian_one_tt: "Unlock the decision §Y$KOR_duli_chaoxian_one_decisions$§! to establish strongholds for our opposition movement."
  JKO_jianli_minzu_zhisheng: "Voice of the Nation"
  JKO_jianli_minzu_zhisheng_desc: "Awakening the people requires not only the anger of revenge but also a blueprint for a new country. We must unite the most thoughtful minds—teachers, writers, and scholars—let them depict our common future with their pens, and we will defend this future with our guns."
	yijianli_genjudi_flag: "Established a Base Area"
  JKO_jianli_dixia_qingbaowang: "Establish Underground Resistance Network"
  JKO_jianli_dixia_qingbaowang_desc: "If we are to confront not only the colonizers but also the threat of the Kwantung Army in Manchuria, we must have a base area beyond the reach of their power. From there, we can start rescuing imprisoned comrades and seize weapons in preparation for the revolution."
  JKO_dihou_pohuai: "Break the Transportation Lines"
  JKO_dihou_pohuai_desc: "When we launch the uprising, guerrillas behind enemy lines will sabotage the colonizers' railways, undermining the enemy's offensive from within. We will organize these 'Fifth Columns' across the entire peninsula and Manchuria to gain a decisive advantage in our National Liberation War."
  JKO_dihou_pohuai_tt: "Will cut off the enemy's transportation lines on the Korean Peninsula during the uprising.\n\nAt the start of the civil war, gain §Y2§! Railway Divisions composed of militiamen"
  JKO_liangge_tongshiwancheng_tt: "If we complete §Y$JKO_baitoushan_de_shiyue$§! and §Y$JKO_dihou_pohuai$§!, after the War of Independence, the Anti-Japanese Allied Forces will launch an uprising in §Y[MAN.GetNameDefCap]§! to support us and cut off all railway transportation facilities in the §Y[MAN.GetNameDefCap]§! region."
  JKO_lalong_riji_chaoxianren: "Win Over Korean Soldiers in the Japanese Army"
  JKO_lalong_riji_chaoxianren_desc: "We will secretly contact Korean soldiers in the puppet army to awaken their national feelings. If the uprising breaks out, they will be the sharpest knife inserted into the enemy's heart."
  JKO_lalong_riji_chaoxianren_tt: "Gain §Y4§! Veteran Infantry Divisions at the start of the civil war.\n\n§Y5§! §YKorean-Japanese Army§! generals will pledge allegiance to us."
  JKO_lianluo_haiwai_zhengfu: "Contact the domestic resistance forces."
  JKO_lianluo_haiwai_zhengfu_desc: "Under the iron rule of the enemy, the spark of resistance in our homeland has never been extinguished. Countless patriots continue their struggle deep in the mountains and forests. We must send our most capable agents to infiltrate back into the country and contact these brave resistance organizations. Uniting their scattered forces under a single banner will not only grant us valuable intelligence but also build up the decisive strength needed for the final counteroffensive."
  JKO_baitoushan_de_shiyue: "Oath of Paektu Mountain"
  JKO_baitoushan_de_shiyue_desc: "Witnessed by the sacred national mountain, the Northeast Volunteer Army and we take a blood oath. This is not only the birth of a cooperation but also the cohesion of the national resistance against colonization and the unyielding soul. From this moment on, we share the same destiny."
  JKO_baitoushan_de_shiyue_tt: "Gain §Y3§! Northeast Anti-Japanese Volunteer Divisions composed of §Ymountain infantry§! at the start of the civil war."
  JKO_yingjiu_duli_yundonngzhe: "Comrades in Prison"
  JKO_yingjiu_duli_yundonngzhe_desc: "Deep in Seodaemun Prison, our bravest comrades are imprisoned. We will plan a bold prison break operation to rescue these backbones of the nation from the enemy's clutches. They are an invaluable asset to the revolution."
  JKO_yingjiu_duli_yundonngzhe_tt: "Gain an additional §Y2§! §YCommunist Militia§! units in the upcoming War of Independence."
  JKO_yingjiu_duli_yundonngzhe_2: "After successfully overthrowing the current regime and achieving independence, advisors from §Ydomestic communists§! will be available."
  JKO_xunqiu_guoji_zhiichi: "Second Hague Secret Envoy"
  JKO_xunqiu_guoji_zhiichi_desc: "We will repeat the righteous act of 1907 and send secret envoys to The Hague again to accuse Japan of its crimes to the world and strive for sympathy and recognition from the international community. This may be a futile attempt, but even if there is only a one-in-ten-thousand chance, we should try."
  JKO_xunqiu_guoji_zhiichi_tt: "After we occupy §Y$VICTORY_POINTS_7125$§!, §Y$VICTORY_POINTS_4056$§!, §Y$VICTORY_POINTS_4052$§!, the more countries support us, the greater the possibility of §Ypeace negotiations§! with Japan."
  JKO_ansha_riben_tianhuang: "Operation Shooting the Sun"
  JKO_ansha_riben_tianhuang_desc: "A crazy yet great plan. We will dispatch our most elite agents to infiltrate the parade in Manchuria, targeting the supreme symbol of the enemy—§Y$JAP_hirohito$§!. If the operation succeeds, the enemy country will fall into great chaos, winning precious time for our independence."
  JKO_ansha_riben_tianhuang_tt: "Unlock §YIntelligence Operation§!:\nAssassinate the Emperor of Japan\nRequires §Y40%§! intelligence network in §Y[282.GetName]§!\n\nIf §Ysuccessful§!, §YJapan§! will trigger a civil war between the Navy and the Army, and §YJapan§!'s colonies will §Ygain independence§!."
  JKO_sanqianlijiangshan_qiyi: "Three Thousand Li of Rivers and Mountains, Restoration Will Come in Time"
  JKO_sanqianlijiangshan_qiyi_desc: "The sacrifice of one person will ignite the anger of ten; the uprising in one region will awaken the courage of the entire peninsula. Now is the time to let this single spark ignite a prairie fire."
###################################################################################################################################################################################################################################      Korea      #####################################################################################
  #######################################################################################################################################################################
  KOR_volunteers_leave_200: "Despite the official stance, some 200 [ROOT.GetAdjective] citizens leave to join the [KOR.GetAdjective] forces."
  KOR_dongya_minzu_jiefang_flag: "The Korean War of Independence is ongoing"
  KOR_juejing_zhong_de_minzu: "A Nation in Desperate Straits"
  KOR_juejing_zhong_de_minzu_desc: "Either independence or extinction. The fate of the entire nation hinges on this war, which gives us unparalleled fighting spirit but also pushes the country to the brink of collapse."
  KOR_dulizhanzheng_guojizongdui: "International Brigades"
  KOR_dulizhanzheng_guojizongdui_desc: "Now is not only the time for the League of Nations to lift the ban on sending troops to support our struggle but also the time to truly encourage member states to rise up against the aggressors!"
  KOR_dulizhanzheng_guojizongdui_tt: "We will request the help of International Brigades from all members of §YLeague of Nations§!.\n\nThey are more likely to accept when the evaluation is greater than §Y40§!."
  KOR_dulizhanzheng_beishang_gongshi: "Northern Offensive"
  KOR_dulizhanzheng_beishang_gongshi_desc: "North Korea is rich in mineral resources. We must recapture the motherland's resources and drive the Japanese colonizers out of the peninsula."
  KOR_dulizhanzheng_nanxia_gongshi: "Southern Offensive"
  KOR_dulizhanzheng_nanxia_gongshi_desc: "The Korean Peninsula has rugged terrain, and only Busan in the south is suitable for large-scale landings. Drive the enemy out of the peninsula from the south to allow troops to quickly return to defend the Yalu River in the north."
  KOR_dulizhanzheng_jianli_shandi_binggongchang: "Factories, Expropriation and Rationing"
  KOR_dulizhanzheng_jianli_shandi_binggongchang_desc: "Everything for the front line. The people provide us with cover, intelligence, and supplies. The Japanese army occupies cities, but we occupy the mountains and the hearts of the people."
  KOR_dulizhanzheng_beishuiyizhan: "Fight with Our Backs to the Wall"
  KOR_dulizhanzheng_beishuiyizhan_desc: "We cannot be trapped by setbacks. As a last resort, we can retreat to the capital to prepare for defense."
  KOR_dulizhanzheng_guojitiaoting: "International Mediation"
  KOR_dulizhanzheng_guojitiaoting_desc: "The League of Nations should not turn a blind eye to the oppression of the Korean people by Japanese fascism for a long time. They must take action and force [JAP.GetName] to withdraw to the pre-war border."
  tongyi_zhichi_duli_flag: "At least one country agreed to mediate."
  KOR_goumai_wuzi_zhuangbei: "Purchase [USA.GetAdjective] Equipment"
  KOR_goumai_wuzi_zhuangbei_desc: "Our military is in urgent need of equipment. To expand the size of our army, we hope to purchase equipment at favorable prices from a trusted major power. Through negotiations, we should be able to reach an agreement with [USA.GetAdjective]."
  KOR_chongsheng_zhengtong_diwei: "Reaffirm Legitimate Status"
  KOR_chongsheng_zhengtong_diwei_desc: "Even in exile, we are the sole legitimate government of the Republic of Korea. Through diplomatic efforts and international law, we will once again declare to the world our unwavering will to resist aggression and strive for independence, reaffirming our legitimate status as the sole legitimate representative of the peninsula. This is the foundation for us to unite the people and secure international support."
  KOR_chongzu_yizheng_yuan: "Restructure the Legislative Council"
  KOR_chongzu_yizheng_yuan_desc: "A government in exile needs an even stronger democratic foundation. We will restructure the Legislative Council, expand its representativeness, and absorb more patriots. It is not only a symbol of legitimacy but also the supreme authority for uniting forces from all sides and planning the blueprint for a future independent nation."
  KOR_tongyi_duli_zhenxian: "United Independence Front"
  KOR_tongyi_duli_zhenxian_desc: "Unite all overseas patriotic groups, transcend political divisions, and establish the broadest anti-Japanese united front. Concentrate strength, build consensus, and lay a solid foundation for national independence."
  KOR_zhihan_guoji_lianmeng: "Appeal to the League of Nations"
  KOR_zhihan_guoji_lianmeng_desc: "Expose Japanese atrocities to the League of Nations and reaffirm the right to national self-determination. Seek recognition of the Provisional Government’s legitimacy from nations worldwide, gain international moral support, and advance the independence cause."
  KOR_choubei_dulijijin: "Raise Independence Funds"
  KOR_choubei_dulijijin_desc: "Revolution cannot exist without funding. Mobilize donations from overseas compatriots and international friends, and actively conduct economic activities. Every sum will be used to maintain the exile government, diplomatic lobbying, and armed struggle."
  KOR_peyang_jishu_gugan: "Train Technical Cadres"
  KOR_peyang_jishu_gugan_desc: "An independent nation needs talent. Send young students to allied countries to study technology, military affairs, and administration. Reserve pillars for building a new nation in the future and ensure the long-term development of the nation."
  KOR_zhengqu_guominzhengfu_zhichi: "Seek Support from the Nationalist Government"
  KOR_zhengqu_guominzhengfu_zhichi_desc: "Strengthen ties with the Chinese Nationalist Government. Seek comprehensive assistance in diplomacy, finance, and military affairs, especially in the formation and training of the Liberation Army, to enhance anti-Japanese strength."
  KOR_guangfujun_de_zujian: "Form the Liberation Army"
  KOR_guangfujun_de_zujian_desc: "National independence requires armed force. Based on existing volunteer units, form a disciplined and combat-effective "Korean Liberation Army" as the hope of national liberation."
  KOR_xiang_huashengdun_paiqian_shijie: "Contact Washington"
  KOR_xiang_huashengdun_paiqian_shijie_desc: "Send a delegation to Washington to present our independence demands to the U.S. government, seek its support on the post-war Korean Peninsula issue, and request material aid."
  KOR_mimi_diantai_wangluo: "Allied Intelligence Cooperation"
  KOR_mimi_diantai_wangluo_desc: "Enemy movements are the key to victory. We will voluntarily provide intelligence gathered in Japanese-occupied areas to Allied intelligence agencies and seek closer cooperation. By sharing information, we can fight the Japanese army more effectively and prepare for the final counteroffensive."
  KOR_xiang_sulian_paiqian_shituan: "Contact Moscow"
  KOR_xiang_sulian_paiqian_shituan_desc: "Soviet military power in the Far East cannot be ignored. We will send envoys secretly to Moscow to establish contact with the Soviet government, seek understanding and support for the Korean independence movement, and explore cooperation in the war against Japan."
  KOR_zhengqu_junshi_guwen: "Request Military Aid"
  KOR_zhengqu_junshi_guwen_desc: "Given the cruelty of the war, it is difficult to defeat the Japanese army quickly with our own strength alone. We will request specific military aid from the Soviet Union, including weapons, military advisors, and training facilities, to arm and strengthen our Liberation Army and accelerate national liberation."
  KOR_haiwai_qiaomin_dongyuan: "Mobilize Overseas Compatriots"
  KOR_haiwai_qiaomin_dongyuan_desc: "Millions of compatriots scattered worldwide are precious resources for our independence. Through radio, letters, and secret envoys, we call on them to unite, donate to the liberation cause, and participate in the international boycott against Japan."
  KOR_duiri_xuanzhan: "Declare War on Japan"
  KOR_duiri_xuanzhan_desc: "As an independent political entity, we must make our voice heard. We will formally declare war on the Empire of Japan to show the world our unyielding resolve. This will not only inspire national morale but also secure our rightful place in the post-war international order."
  KOR_xunlian_guonei_tujidui: "Train Domestic Commandos"
  KOR_xunlian_guonei_tujidui_desc: "Countless patriots still yearn to resist inside the Japanese-occupied areas. We will secretly send cadres back to organize and train guerrillas and commando units behind enemy lines. These forces will cooperate with the Allied counteroffensive and undermine Japanese rule from within."
  KOR_lianluo_yiyongdui: "Unite Korean Volunteer Corps"
  KOR_lianluo_yiyongdui_desc: "Besides the Liberation Army, many independent Korean volunteer units are active in China. We will take the initiative to contact them and integrate these scattered anti-Japanese forces under the unified command of the Liberation Army, forming a stronger anti-Japanese force."
  KOR_miandian_yuanzheng_jun: "Burma Expeditionary Force"
  KOR_miandian_yuanzheng_jun_desc: "To gain broader international support and demonstrate our anti-Japanese resolve to the world, we will send an elite Liberation Army unit to the Burma battlefield to fight alongside the Allies against Japanese invaders."
  KOR_kailuo_huiyi: "Follow the Cairo Conference"
  KOR_kailuo_huiyi_desc: "The Allied leaders’ conference in Cairo will decide the post-war world order, especially the fate of the Korean Peninsula. We will send representatives to closely follow the conference, actively lobby nations, and strive for a clear principle of "Korean independence" in the conference communiqué."
  KOR_weituo_tongzhi: "Accept Mandate Rule"
  KOR_weituo_tongzhi_desc: "Facing the reality of international power politics, full independence may take time. Under certain conditions, we can accept a short-term Allied "mandate rule" over the Korean Peninsula in exchange for broad international support and ensure final independence."
  KOR_fantuoguan_xingdong: "Oppose Trusteeship Movement"
  KOR_fantuoguan_xingdong_desc: "Any form of "trusteeship" violates national dignity. We will firmly resist Allied attempts to place the Korean Peninsula under trusteeship, mobilize global compatriots and international friends, strive for immediate and complete independence, and never allow any country to interfere with our sovereignty under any pretext."
  KOR_bayiwu_guangfu: "Liberation Day"
  KOR_bayiwu_guangfu_desc: "After the baptism of blood and fire, we have finally welcomed the long-awaited national liberation! We will forever remember this day. The whole nation will celebrate this great victory and open a new era in building a brand-new, independent, free, and prosperous Korea."


  DEBUG_CILUXIAN_WEIKAIFA_WANCHENG_TT: "§YThis path is the historical path for Korea. To play this game path, ensure that nations on the map follow their historical national focuses§!"
##Politics
  #######################################################################################################################################################################
  KOR_zhengzhi_luxian_1: "Glory of Restoration"
  KOR_zhengzhi_luxian_1_desc: "After years of struggle and sacrifice, the spark of freedom finally blazes on the Korean Peninsula. From guerrillas at the foot of Paektu Mountain to resistance organizations on city streets, countless Korean patriots have converged into an unstoppable torrent. Korea, an independent and sovereign country, has been reborn through the baptism of fire and blood."
  KOR_zhengzhi_luxian_1_tt: "Korea Restored"
  KOR_zhengzhi_luxian_2: "Provisional Administrative Council"
  KOR_zhengzhi_luxian_2_desc: "Although the flames of war have subsided, the power to lead the country is still up in the air. We must immediately establish a provisional body representing all forces to issue decrees and stabilize the people's hearts."
  KOR_zhengzhi_luxian_2_tt: "Unlock the decision §YStrengthen Security Measures§!"
  KOR_zhengzhi_zhenxing_guojia: "Post-War Reconstruction Committee"
  KOR_zhengzhi_zhenxing_guojia_desc: "Years of war and colonial plunder have left our land devastated. Railways are fragmented, factories reduced to ruins, and people displaced from their homes. At this moment, establishing a unified and efficient 'Post-War Reconstruction Committee' is our top priority. It will coordinate the country's manpower and material resources, plan the restoration of infrastructure, and organize the resumption of basic production. This is the first step for us to heal the country's wounds and march towards rebirth."
  KOR_queli_zhiding_linshi_xianfa: "Formulate Provisional Constitution"
  KOR_queli_zhiding_linshi_xianfa_desc: "After the initial victory of the revolution, the state apparatus urgently needs to be established. A provisional fundamental law is the first step to stabilize order and announce the birth of the new regime. It will serve as a legal weapon for us to unite the people and suppress counter-revolutionaries, laying the legal foundation for the future of New Korea."
  KOR_zhengzhi_zhengzhi_xingshang_huiyi: "Convene the National Political Consultative Conference"
  KOR_zhengzhi_zhengzhi_xingshang_huiyi_desc: "The Japanese Empire has collapsed with a crash, and the sky over Korea is free from the shadow of colonizers for the first time. All political forces converge in Pyongyang from underground, overseas, and mountain forests, and a conference that will determine the nation's fate is about to be held. But beneath the surface of unity, undercurrents surge…"
  KOR_xuanju_zidong_tt: "The Political Consultative Conference has ended"
###############################  Red  #################################
  KOR_beijixing_de_zhiyin: "Guidance of the North Star"
  KOR_beijixing_de_zhiyin_desc: "In the long and dark anti-Japanese struggle, a great leader has guided us like the North Star. Now, he will continue to lead us towards the bright future of socialism. Establishing the absolute authority of the leader is the fundamental prerequisite for ensuring that the revolutionary ship never deviates from its course."
  KOR_jieshou_kangri_youjidui: "Accept the Northeast Anti-Japanese Allied Forces"
  KOR_jieshou_kangri_youjidui_desc: "The soldiers of the Anti-Japanese Allied Forces who have fought bloody battles for years between the white mountains and black waters are the most precious wealth of the revolution. Their rich combat experience and firm revolutionary will will become the steel backbone of our newly established People's Army. The return of this battle-hardened army will greatly enhance our national defense capabilities."
  KOR_zhiding_guojia_xianfa: "Formulate National Constitution"
  KOR_zhiding_guojia_xianfa_desc: "The provisional constitution has fulfilled its historical mission. Now, we must formulate a national constitution that embodies socialist principles and consolidates the people's democratic dictatorship. It will permanently fix the Party's leading position and the country's socialist nature in the form of law."
  KOR_qingsuan_de_fengbao: "Storm of Purge"
  KOR_qingsuan_de_fengbao_desc: "The dregs of the old world—landlords, capitalists, pro-Japanese factions, and reactionary bureaucrats—still lurk among the people, attempting to subvert our newborn regime. A revolutionary purge storm is imperative. We must use thunderous means to sweep these class enemies into the garbage heap of history once and for all."
  KOR_jianli_guojia_anquan_baowei_bu: "Establish the Ministry of State Security"
  KOR_jianli_guojia_anquan_baowei_bu_desc: "The fruits of revolutionary victory need vigilant eyes and sharp swords to defend. A unified and efficient state security department will become a strong shield for us to root out internal spies and smash external subversion plots, ensuring that the red rivers and mountains remain unchanged forever."
  KOR_jianli_haiwai_qingbaobu: "Establish Overseas Intelligence Network"
  KOR_jianli_haiwai_qingbaobu_desc: "Surrounded by imperialism, we cannot become deaf and blind. We must establish an intelligence network that penetrates behind enemy lines and spreads across the globe. It will not only provide us with key information but also become a secret front for us to export revolution and support the struggles of people around the world."
  KOR_laodong_renmin_bao: "Workers' and People's Newspaper"
  KOR_laodong_renmin_bao_desc: "The pen and the gun are two magic weapons for seizing and consolidating political power. Founding an organ newspaper of the Party Central Committee will timely convey the Party's lines, principles, and policies to the broad masses of people, seize the commanding heights of public opinion, and arm the people's minds with revolutionary ideas."
  KOR_guoji_tongxun_she: "International News Agency"
  KOR_guoji_tongxun_she_desc: "The mouthpieces of the bourgeoisie slander us wantonly in the international community, and we must make our voices heard. Establishing an international news agency facing the world will show the great achievements of our socialist construction to the globe, refute the lies of imperialism, and unite revolutionary allies around the world."
  KOR_funv_jiefang_yundong: "Socialist Women's League"
  KOR_funv_jiefang_yundong_desc: "Since ancient times, the predicament of women in society has been ignored. By integrating the Socialist Women's League more deeply into the core of the government, we can finally address their concerns and create a more equitable society for all."
  KOR_saochu_wenmang_yundong: "Anti-Illiteracy Campaign"
  KOR_saochu_wenmang_yundong_desc: "A country full of illiterates cannot build socialism. We must launch a massive mass anti-illiteracy campaign to enable every working person to master reading and writing skills. Only in this way can they better learn Marxism-Leninism, participate in national management, and become cultured masters of the new era."
  KOR_malie_zhuyi_kexueyuan: "Establish the Academy of Marxism-Leninism"
  KOR_malie_zhuyi_kexueyuan_desc: "Theory is the guide to action. To thoroughly study, develop, and defend Marxism-Leninism, we must establish a supreme theoretical research institution. It will cultivate loyal theoretical cadres for the Party and provide solid theoretical support for our revolutionary practice, ensuring that we always walk on the correct path."
  KOR_malie_zhuyi_bentuhua: "Localization of Marxism-Leninism"
  KOR_malie_zhuyi_bentuhua_desc: "Marxism-Leninism is not a rigid dogma but a guide to action. We must combine the universal truth of Marxism-Leninism with the specific practice of the Korean revolution to create a revolutionary theory with national characteristics. This is not only the enrichment and development of Marxism-Leninism but also the inevitable path for us to move towards independence and self-reliance."
  KOR_zhengfeng_yundong: "Rectification Movement"
  KOR_zhengfeng_yundong_desc: "The revolutionary ranks are not a monolithic bloc; non-proletarian ideas such as bureaucracy and sectarianism still exist. A profound rectification movement is necessary. Through criticism and self-criticism, we will eliminate ideological dust, making our Party purer and more combat-effective."
  KOR_jianli_laogong_dang: "Worker-Peasant Alliance"
  KOR_jianli_laogong_dang_desc: "The alliance between workers and peasants is the foundation of revolutionary victory and regime consolidation. By supporting agricultural collectivization, sending worker propaganda teams to the countryside, and other means, we must continuously consolidate the flesh-and-blood ties between workers and peasants. Only when the worker-peasant alliance is as solid as a rock can our country be as solid as a rock."
  KOR_hongse_gonghui: "Red Trade Unions"
  KOR_hongse_gonghui_desc: "Trade unions should not become a barrier between workers and the Party but a bridge and bond connecting the Party with the worker masses. We must thoroughly transform old trade unions and establish Party-led red trade unions, making them a powerful tool for organizing and mobilizing the working class to complete production tasks."
  KOR_zhi_qing_xiaxiang: "Down to the Countryside Movement for Educated Youth"
  KOR_zhi_qing_xiaxiang_desc: "Educated young people in cities should not be isolated from the masses in ivory towers. Organize them to go to the vast countryside, receive re-education from poor and lower-middle peasants in harsh environments, which can not only contribute to rural development but also cultivate them into firm successors to the proletarian revolutionary cause."
  KOR_fandui_geren_chongbai: "Oppose Personality Cult"
  KOR_fandui_geren_chongbai_desc: "Attributing the success of the revolution to the genius of a single person violates the historical materialism of Marxism. We must be vigilant against and oppose any form of personality cult and adhere to the Party's principle of collective leadership. The people are the creators of history, and no individual can be above the Party and the people."
  KOR_xuesheng_yundong_xianfeng: "Vanguard of the Student Movement"
  KOR_xuesheng_yundong_xianfeng_desc: "Young students are active in thinking and full of passion, making them an important force in the revolutionary ranks. The Party must firmly grasp the leadership of the student movement, guide their revolutionary enthusiasm, and make them the vanguard of propagating revolutionary ideas and attacking the old system, contributing their youth to the establishment of a new society."
  KOR_zili_geng_sheng: "Hard Work and Self-Reliance"
  KOR_zili_geng_sheng_desc: "Putting the foundation of our cause on our own strength is self-reliance. We welcome assistance from fraternal countries, but Korea's destiny must be in the hands of the Korean people themselves. Whether in economic construction or national defense construction, we must take a path of independence and self-reliance."
  KOR_dangjiao_jiehe: "Integration of Party and Education"
  KOR_dangjiao_jiehe_desc: "The fundamental task of education is to serve proletarian politics and cultivate revolutionary successors who are both red and expert. Schools cannot become positions for spreading bourgeois ideas. We must strengthen the Party's absolute leadership over education, ensuring that textbooks, classrooms, and teachers are firmly in the hands of the Party."
  KOR_quanmin_wuzhuang: "Arming the Entire Nation"
  KOR_quanmin_wuzhuang_desc: "Imperialism never gives up its ambition to destroy us, and we must be prepared to fight at any time. Implement the arming of the entire nation, organize all people into military and semi-military units, and truly achieve 'every citizen a soldier'. Once the enemy dares to invade, they will be trapped in the vast ocean of people's war."
  KOR_sixiang_de_baolei: "Fortress of Thought"
  KOR_sixiang_de_baolei_desc: "Invisible enemies are sometimes more dangerous than visible ones. We must build an impregnable fortress of thought to resist the erosion of 'sugar-coated bullets' and decadent ideas from the outside. Any noise that attempts to shake our revolutionary will will be completely crushed."
  KOR_tuiguang_e_yu: "Promote Russian Language"
  KOR_tuiguang_e_yu_desc: "The Soviet Union is the world's first socialist country and our elder brother. Learning and promoting Russian helps us better learn the advanced experience of the Soviet Union, absorb revolutionary theories, and strengthen unity with fraternal countries. This is an important measure to consolidate unity within the socialist camp."
  KOR_wushenlun_xuanchuan: "Atheism Propaganda"
  KOR_wushenlun_xuanchuan_desc: "Religion is the opium that paralyzes the people. For thousands of years, feudal superstitious ideas have severely fettered the people's minds. We must launch a massive atheism propaganda campaign nationwide, arm the people with a scientific materialist worldview, and completely liberate them from the shackles of theocracy."
  KOR_shehui_xiashi_zhuyi: "Socialist Realism"
  KOR_shehui_xiashi_zhuyi_desc: "Literature and art are powerful weapons for class struggle and must serve proletarian politics. We must establish the creative principle of socialist realism in the literary and artistic circles, requiring all works to enthusiastically eulogize revolutionary heroes and depict the fiery life of socialist construction, thereby educating the people and inspiring fighting spirit."
  KOR_lingxiu_quanwei_zhidu_hua: "Institutionalization of Leader's Authority"
  KOR_lingxiu_quanwei_zhidu_hua_desc: "The leader's extraordinary wisdom and outstanding contributions have proven that he is the incarnation of the revolution. Fixing the leader's authority in the form of systems and laws, ensuring that his thought becomes the sole guiding ideology of the country and the Party, is a long-term plan to prevent revisionism and ensure that the revolutionary cause is passed down from generation to generation."
  KOR_yanan_jingshen_de_huigui: "Return of the Yan'an Spirit"
KOR_yanan_jingshen_de_huigui_desc: "In China's revolutionary sacred land, our comrades learned perseverance and dedication. Now, we will bring this precious spiritual wealth back to Korea, consolidate our revolutionary political power through mass mobilization and ideological education, and lay a solid ideological foundation for future struggles."
  KOR_yanan_jingshen_de_huigui_tt: "£yananpai_focus_xiaotubiao_texticon $KOR_yanan_paixi_tt$At least$KOR_communism_Party_Size_1$"
  KOR_renmin_weiyuanhui_de_yichan: "The Legacy of the People's Committee"
  KOR_renmin_weiyuanhui_de_yichan_desc: "In the dawn of liberation, the people spontaneously organized committees to manage their own homes. We will inherit and develop this precious political legacy, build a government truly run by the people, and root political power in every inch of the recovered land."
  KOR_renmin_weiyuanhui_de_yichan_tt: "£bentupai_focus_xiaotubiao_texticon $KOR_nanlao_paixi_tt$At least$KOR_communism_Party_Size_1$"
  KOR_wenhua_da_geming: "Revolutionary Culture"
  KOR_wenhua_da_geming_desc: "The remaining poison of colonialism and the chronic illness of feudal ideology are two major tumors hindering the rebirth of our nation. A soul-stirring cultural revolution is imperative. We must thoroughly liquidate foreign enslaving ideology, smash the decadent values of the old world, and establish a brand-new national spirit that belongs to us. This revolution will reshape our people and clear all ideological obstacles for building a pure and powerful country."
  KOR_tongyi_zhenxiang_changdao: "United Front Initiative"
  KOR_tongyi_zhenxiang_changdao_desc: "The current revolutionary situation is complex, with internal and external challenges coexisting. To unite forces to the maximum extent and avoid unnecessary internal strife, we must prioritize the overall situation. We hereby formally propose to establish the broadest possible united front with comrades in the Party, temporarily shelve line differences, and work together to consolidate the newborn people's political power and achieve complete national independence."
  KOR_tongyi_zhenxiang_changdao_tt: "Upon successfully forming a §Yfaction§! united front, part of its §Ybonuses§! will be retained after the plenary session!"
  KOR_jiti_lingdaozhi_queli: "Establishment of Collective Leadership System"
  KOR_jiti_lingdaozhi_queli_desc: "Cult of personality is dangerous, and the fruits of revolutionary victory belong to the entire people. We will establish a collective leadership system where multiple core comrades make joint decisions to ensure that the country's ship does not deviate from its course, pool the wisdom of the entire Party, and lead the country towards prosperity."
  KOR_zhishao_yihejie_yipaixi_flag: "The negotiation with the faction has been completed"
  KOR_renmin_zhanzheng_wangyang: "The Vast Ocean of People's War"
  KOR_renmin_zhanzheng_wangyang_desc: "Our source of strength is the people. We will mobilize the broadest masses, making every village a fortress and every person a soldier. Aggressors will be submerged in the vast ocean of people's war and completely annihilated."
  KOR_minbing_xiandaihua_jianshe: "Modernization of Militia Forces"
  KOR_minbing_xiandaihua_jianshe_desc: "Militias are the cornerstone of defending the homeland and a powerful supplement to the regular army. We will equip militia units with more sophisticated weapons and provide more professional training, enabling them not only to harass the enemy but also to play an important role in frontline battles."
  KOR_wutingjiangjun_de_paobing: "General Mu Ting's Artillery"
  KOR_wutingjiangjun_de_paobing_desc: "\"Artillery is the god of war\", and General Mu Ting is the expert who grasps this truth. Under his guidance, we will vigorously develop artillery units, cover enemy positions with dense steel barrages, and clear obstacles for every infantry charge."
  KOR_tiedao_youji_dui: "Railway Guerrilla Corps"
  KOR_tiedao_youji_dui_desc: "Railways are the enemy's main arteries and lifelines. We will organize elite guerrilla units to strike at the enemy's transportation lines like hammers, destroy bridges, blow up trains, and make the aggressors unable to move an inch on our land."
  KOR_sandajilv_bada_zhuyi: "Three Main Rules of Discipline and Eight Points for Attention"
  KOR_sandajilv_bada_zhuyi_desc: "An army without discipline cannot defeat the enemy. We will strictly enforce the \"Three Main Rules of Discipline and Eight Points for Attention\" to build a people's army that shares a profound bond with the people and commits no slightest offense against them. This will win us the broadest popular support and a steady stream of backing."
  KOR_chengshihua_xunlian: "Kumgang Political Academy"
  KOR_chengshihua_xunlian_desc: "The foundation of the revolution lies in firm ideology. We will establish the Kumgang Political Academy, forging batches of revolutionary cadres absolutely loyal to the Party and the people with the unyielding will like Mount Kumgang. They will go deep into the army and government, becoming the backbone to ensure our cause remains unwavering and the indestructible cornerstone of a new Korea."
  KOR_shentou_zuozhan_zhuanjia: "Experts in Infiltration Tactics"
  KOR_shentou_zuozhan_zhuanjia_desc: "Unexpected strikes often yield the greatest results. We will cultivate a group of experts in infiltration tactics, allowing them to insert into the enemy's heartland like sharp blades to carry out reconnaissance, sabotage, and decapitation missions, creating chaos where the enemy least expects it."
  KOR_fazhan_shandi_zuozhan: "Develop Mountain Warfare"
  KOR_fazhan_shandi_zuozhan_desc: "The Korean Peninsula is mountainous, which is both a challenge and an opportunity. We will form and train special forces adapted to complex mountainous environments, use terrain advantages to strike the enemy, and turn the continuous mountains into our natural defense lines and a hunting ground that terrifies the enemy."
  KOR_fazhan_shandi_zuozhan_tt: "§Y2§! random army commanders will gain the §Y$trait_mountaineer$§! trait!"
  KOR_minbing_yu_zhengguijun_ronghe: "Irregular Army Retraining"
  KOR_minbing_yu_zhengguijun_ronghe_desc: "Irregular troops should not be merely second-line forces. Through this national policy, we will establish an efficient transformation system, enabling experienced irregular troops to quickly supplement and integrate into the regular army, ensuring that our field forces maintain vigorous combat effectiveness at all times."
  KOR_renmin_de_zhanzheng: "People's War"
  KOR_renmin_de_zhanzheng_desc: "This is the ultimate embodiment of our military ideology. We will fully convert the country into a total war state, with all resources serving the war and the people's strength mobilized to the extreme. On this land, any aggressor will face a copper wall and iron bastion of a nation in arms."
  KOR_ganbu_shencha: "Cadre Inspection"
  KOR_ganbu_shencha_desc: "The revolutionary ranks are mixed with opportunists and traitors. To ensure the purity of the organization, a thorough cadre inspection is imperative. We will root out those who are wavering and ideologically corrupted, ensuring that every leadership position is held by the most loyal comrades."
  KOR_pingrang_de_mosike_shenpan: "Moscow Trials in Pyongyang"
  KOR_pingrang_de_mosike_shenpan_desc: "Some comrades in the Party have been corrupted by foreign ideologies and attempted to lead our revolution astray. We will follow the experience of Moscow, hold public trials for these traitors, eliminate enemies within the Party, and consolidate the dictatorship of the proletariat."
  KOR_kelimulingong_de_yizhi: "The Will of the Kremlin"
  KOR_kelimulingong_de_yizhi_desc: "As the beacon of the world proletarian revolution, the Soviet Union's experience is our guide forward. We will closely unite around the Kremlin, accept guidance and assistance from Moscow, and align our revolutionary cause with the great Soviet Union in step."
  KOR_kelimulingong_de_yizhi_tt: "£sulianpai_focus_xiaotubiao_texticon $KOR_sulian_paixi_tt$At least$KOR_communism_Party_Size_1$"
  KOR_hongjun_moshi: "Political Commissar System"
  KOR_hongjun_moshi_desc: "The criticism of weapons cannot be separated from ideological guidance. We will establish a political commissar system in the army to ensure the Party's absolute leadership, arm every soldier's mind with firm beliefs, make them understand why they fight, and thus erupt with unparalleled combat will."
  KOR_folongzhi_xueyuan_biyesheng: "Graduates of the Frunze Military Academy"
  KOR_folongzhi_xueyuan_biyesheng_desc: "Officers who studied at the Frunze Military Academy have returned after completing their studies, bringing back the most advanced Soviet military theories. These valuable talents will comprehensively improve the command level of our army and inject new vitality into building a modern and powerful army."
  KOR_folongzhi_xueyuan_biyesheng_tt: "§Y3§! generals with §Y$career_officer$§! will randomly gain one of the traits: §Y$infantry_officer$§!/§Y$cavalry_officer$§!/§Y$armor_officer$§!/§Y$engineer_officer$§!"
  KOR_paobing_shi_zhanzheng_zhishen: "Artillery is the God of War"
  KOR_paobing_shi_zhanzheng_zhishen_desc: "We must uphold Stalin's teachings and tilt resources towards artillery. We will establish an unprecedented scale of artillery units to realize the war philosophy of \"firepower supremacy\". In the face of absolutely superior artillery fire, any defense will be reduced to ashes."
  KOR_chaoxian_shangkong_de_mige: "MiGs Over Korea"
  KOR_chaoxian_shangkong_de_mige_desc: "Control of the sky determines the fate of the ground. With the help of Soviet comrades, we will establish an air force equipped with advanced MiG jet fighters. Korea's blue sky will be guarded by ourselves, and enemy bombers will no longer be able to act recklessly."
  KOR_jiqun_tanke_biandui: "Armored Tank Formations"
  KOR_jiqun_tanke_biandui_desc: "Following the example of the Soviet Red Army's steel torrent, we will form powerful armored tank formations. These steel behemoths will serve as the spearhead of the offensive, tear through enemy defenses with irresistible momentum, implement deep operations, and plant the victory flag further afield."
  KOR_lianhe_yanxi: "Joint Military Exercises"
  KOR_lianhe_yanxi_desc: "Building a strong army behind closed doors is impossible. We will hold large-scale joint military exercises with allies who share the same ideology, learn from each other's strengths in simulated confrontations, test our army's combat readiness, and enhance coordinated combat capabilities with allied forces."
  KOR_geming_de_hongqi: "The Red Flag of Revolution"
  KOR_geming_de_hongqi_desc: "Our red flag must not only fly over every inch of Korea but also flutter across the world. We will actively export revolution, support proletarian brothers in all countries, let the flames of communism spread across the globe, and build a new world without exploitation and oppression."
  KOR_shijie_geming_de_yibufen: "Part of the World Revolution"
  KOR_shijie_geming_de_yibufen_desc: "The liberation of Korea is just a chapter in the great world revolution. We will assume the responsibility of internationalism, unite with revolutionaries around the world, jointly oppose imperialism and its lackeys, and strive for the ultimate liberation of all mankind."
  KOR_zhutisixiang_de_dengta: "The Lighthouse of Juche Idea"
  KOR_zhutisixiang_de_dengta_desc: "Amid the stormy waves of imperialism and revisionism, the Juche Idea is our eternal lighthouse. It teaches us that man is the master of his own destiny. We must establish the Juche Idea as the sole guiding principle of the country and the people, use its light to illuminate our path of independence and self-reliance, and point out the direction for oppressed nations around the world."
  KOR_zhutisixiang_de_dengta_tt: "£youjiduipai_focus_xiaotubiao_texticon $KOR_manzhou_paixi_tt$At least$KOR_communism_Party_Size_1$"
  KOR_xianjun_zhengzhi_queli: "Establishment of Songun Politics"
  KOR_xianjun_zhengzhi_queli_desc: "Political power grows out of the barrel of a gun, and the barrel of a gun can also protect political power. Surrounded by imperialism, the military must take precedence over everything and be above everything else. Establishing the fundamental line of \"Songun Politics\" means that the people's army is not only the pillar of national defense but also the main force in building socialism. Everything for the army, everything relying on the army!"
  KOR_tanke_hongliu: "105th Guards Tank Division"
  KOR_tanke_hongliu_desc: "The will of the revolution must be defended by steel. Faced with potential aggressors, we must build an indestructible armored force. Large-scale tank formations will crush all enemies who dare to stand in our way like a revolutionary torrent. The enemy's intrigues will be vulnerable in the face of our steel torrent."
  KOR_tanke_hongliu_tt: "\nGain §Y1 tank division§! in §Y[ROOT.Capital.GetName]§!, commanded by Major General §Y$KOR_Liu_Jingzhu$§!."
  KOR_zhuti_renminjun: "Expansion of the People's Army"
  KOR_zhuti_renminjun_desc: "The threat of imperialism is imminent, and we must have a strong army sufficient to defend the fruits of the revolution. With battle-hardened anti-Japanese veterans as the backbone and absorbing industrial and agricultural youths full of patriotic enthusiasm, we will rapidly expand the size of the People's Army. This army will be our sharpest sword for reunifying the motherland and opposing foreign interference."
  KOR_baitoushan_xuetong_shenhua: "Myth of Baekdu Mountain Bloodline"
  KOR_baitoushan_xuetong_shenhua_desc: "The leader is not an ordinary person but the light of the nation bearing the sacred essence of Baekdu Mountain. We must construct and spread the revolutionary myth of the leader's family among the people, firmly binding their bloodline with the origin and future of our nation. This is not merely personality cult but a eternal strategy to unite national will and ensure the revolution is passed down from generation to generation."
  KOR_baitoushan_xuetong_shenhua_tt: "Unlock the decision of §YEpic of the Great Leader Narrative§!, allowing us to propagate §Y2§! times simultaneously."
  KOR_xuetong_shixi_shenhua: "Hereditary Bloodline System"
  KOR_xuetong_shixi_shenhua_desc: "The torch of the revolution must be passed on by the most reliable people. The leader's descendants have inherited the purest revolutionary bloodline and the most outstanding leadership wisdom, and are the only candidates to lead our cause forward. Fixing this bloodline inheritance in the form of a system is a fundamental measure to prevent revisionists from seizing power and ensure the red country remains unchanged forever."
  KOR_hewuqi_de_juexin: "Determination for Nuclear Weapons"
  KOR_hewuqi_de_juexin_desc: "We have had enough of imperialist nuclear blackmail! To defend our sovereignty and dignity, and to make the enemy dare not act rashly against us, we must possess our own nuclear weapons. This is a national aspiration that we must achieve even if we tighten our belts, and the final trump card to ensure we hold our destiny firmly in our own hands."
  KOR_juedui_guli_zhuyi: "Absolute Isolationism"
  KOR_juedui_guli_zhuyi_desc: "The outside world is full of decay, depravity and hostility. To protect the purity of our ideology and the stability of our society, we must cut off all non-essential contact with this dirty world. Close the country's borders, rely on our own strength to build a perfect earthly paradise, until the outside world collapses in its own decay."
  KOR_yindao_ruoxiao_guojia: "Guiding Weak and Small Countries"
  KOR_yindao_ruoxiao_guojia_desc: "We have suffered oppression, so we best understand the pain of weak and small countries. Now, we have the responsibility to be their guide, helping them find an independent path in the gap between imperialism and hegemonism. Our experience will become their precious wealth, and our strength will be their solid backing."
  KOR_baohu_manzhou_ren: "Protecting the Manchurian People"
  KOR_baohu_manzhou_ren_desc: "Manchuria has been connected to us by mountains and rivers and shared blood since ancient times. We cannot sit idly by and watch our compatriots there suffer oppression or be led astray by wrong ideas. In the name of \"protection\", we have the right to intervene in this region, establish a buffer zone friendly to us, and \"recover\" the historical heritage that belongs to us."
  KOR_baohu_manzhou_ren_1_tt: "Unlock the decision to §Yincite communist sentiment§! in §Y[MAN.GetAdjective]§!"
  KOR_baohu_manzhou_ren_2_tt: "Unlock the decision to invite §Ycommunist [MAN.GetAdjective]§! to join our camp"
  KOR_zhiyin_zhongguo_ren: "Guiding the Chinese People"
  KOR_zhiyin_zhongguo_ren_desc: "China's revolution has gone astray and deviated from true Marxism. As revolutionaries with purer ideology and more correct lines, we have the obligation to \"guide\" the lost Chinese people and help them return to the right track. An expedition of \"ideological emancipation\" is necessary, even if it means spreading the truth by force."
  KOR_zhiyin_zhongguo_ren_1_tt: "Unlock the decision to §Yincite communist sentiment§! in §YChinese regions§!"
  KOR_zhiyin_zhongguo_ren_2_tt: "Unlock the decision to invite §Ycommunist Chinese regions§! to join our camp"
  KOR_jiang_geming_chuandao_nanfang: "Spreading Revolution to the South"
  KOR_jiang_geming_chuandao_nanfang_desc: "The land of South Asia is still groaning under the control of imperialism and its lackeys. Liberating the comrades in the south is an urgent historical mission of communism. Whether through infiltration, propaganda or the ultimate revolutionary war, we must make the red flag of revolution fly over South Asia."
  KOR_yuandong_de_shouhu_zhe: "Guardian of the Far East"
  KOR_yuandong_de_shouhu_zhe_desc: "The geopolitics of the Far East are full of unstable factors. We must take up the responsibility to become a stabilizer and guardian of this region. Any external force attempting to meddle in the Far East must first ask the guns in our hands. We will establish a regional order with us at the core to ensure peace is in the hands of the just."
  KOR_jiang_geming_daiqu_xiya: "Bringing Revolution to West Asia"
  KOR_jiang_geming_daiqu_xiya_desc: "The flames of revolution are spreading, and our successful actions have inspired proletarians everywhere. We should begin funding revolutionary groups in West Asia to shake local stability and bring them into the Fifth International."
  KOR_jianli_ziyou_de_yatai: "Building a Free Asia-Pacific Region"
  KOR_jianli_ziyou_de_yatai_desc: "The people of Asia and the Pacific should no longer be enslaved by Western imperialism. We will hold high the banner of liberation, unite all oppressed nations in this region, and build a truly free, independent Asia-Pacific community run by the Asian people themselves. This community will move towards prosperity and unity under our leadership."
  KOR_yiguojiancheng_shehuizhuyi: "Center of World Revolution"
  KOR_yiguojiancheng_shehuizhuyi_desc: "When Moscow falls into the mire of revisionism, the world proletariat needs a new revolutionary center. Pyongyang, with its purest revolutionary line and firmest fighting will, deserves to be this center. Revolutionaries from all over the world will learn from us and accept our guidance until the red flag flies all over the world."
  KOR_risheng_zhidi_weixie: "Threat from the Land of the Rising Sun"
  KOR_risheng_zhidi_weixie_desc: "Although our neighboring country to the east was defeated, the specter of militarism has never dissipated. We must remain vigilant against the threat from the Land of the Rising Sun, which is an unsinkable aircraft carrier of imperialism stationed in Asia. Taking preemptive action to completely eliminate this threat is the only choice to ensure our security."
  KOR_zhongjie_zhongguo_fengjian_zhuyi: "Ending Chinese Feudalism"
  KOR_zhongjie_zhongguo_fengjian_zhuyi_desc: "Although our neighboring country is vast, it is still bound by backward feudal residual ideology, hindering its progress. As the most advanced and revolutionary country in the region, we have the responsibility to help them complete a thorough social revolution, liberate them from the millennium-old shackles, and lead them into a new era."
  KOR_nantaipingyang_suweiai: "South Pacific Soviets"
  KOR_nantaipingyang_suweiai_desc: "The sunshine and beaches of the South Pacific should not be a holiday paradise for colonists but a red paradise for the proletariat. We will support local revolutionary forces to establish the South Pacific Soviets, which will serve as our forward base for exporting revolution to Oceania."
  KOR_dayangzhou_suweiai: "Oceanian Soviets"
  KOR_dayangzhou_suweiai_desc: "From the jungles of New Guinea to the deserts of Australia, the entire Oceania should be bathed in the glory of revolution. We will not only support but also lead the establishment of a unified Oceanian Soviets, liberating this vast continent and islands from the control of Western capital and making it an important part of the world Soviet system."
  KOR_yindu_zhina_suweiai: "Indochinese Soviets"
  KOR_yindu_zhina_suweiai_desc: "The flames of revolution in the Indochinese Peninsula are burning fiercely. We must strengthen support for our comrades here, help them defeat colonists and their lackeys, and establish a unified Indochinese Soviets. This will be a solid barrier and important ally of our Pan-Asian revolutionary front in the south."
  KOR_taipingyang_suweiai_gongheguo: "Union of Pacific Soviet Socialist Republics"
  KOR_taipingyang_suweiai_gongheguo_desc: "Our ultimate goal is to establish a brand-new Soviet union with us at the core across the entire Pacific region. From Kamchatka to New Zealand, from Hawaii to Indochina, all liberated countries will unite to form a powerful Union of Pacific Soviet Socialist Republics, standing up to the decadent empires of the old world."
  KOR_shengli_de_changzheng: "Long March to Victory"
  KOR_shengli_de_changzheng_desc: "Our cause is a long and arduous expedition, full of sacrifices and trials. But just like the great Long March in history, every challenge will make us stronger, and every retreat is for a better attack next time. Our people must be prepared to complete the glorious Long March towards ultimate victory with unwavering will."
  KOR_dongyuan_wuchan_jieji: "Mobilizing the Proletariat"
  KOR_dongyuan_wuchan_jieji_desc: "The true strength of the country lies in the tens of millions of working people. We must carry out a thorough social mobilization, organize every worker and peasant, and let them devote themselves to production and national defense construction with full revolutionary enthusiasm. When the entire proletariat is united as one, we will be invincible."
  KOR_fanya_geming_zhenxian: "Pan-Asian Revolutionary Front"
  KOR_fanya_geming_zhenxian_desc: "Asian revolutionaries must unite! We propose to establish a Pan-Asian Revolutionary Front, uniting all Asian countries and organizations that are fighting against imperialism, colonialism and reactionaries. In this front, we will coordinate actions, share resources, and work together to build a new red Asia."
  KOR_fanya_kaifa_sheng: "Pan-Asian Development Plan"
  KOR_fanya_kaifa_sheng_desc: "Political unity needs economic integration to consolidate. We will launch an ambitious \"Pan-Asian Development Plan\", with our industrial strength and technology as the core, to help allies in the front develop their economies and build infrastructure. A common prosperous economic circle will be a solid fortress against Western capital erosion."
  KOR_tuixing_yazhou_huobi: "Promoting a Unified Asian Currency"
  KOR_tuixing_yazhou_huobi_desc: "The US dollar and British pound are tools for imperialism to exploit the Asian people. To achieve true economic independence, we must create and promote a brand-new unified currency belonging to the Asian people themselves. This will cut off the shackles of Western financial hegemony and make our Pan-Asian economic circle more closely linked and powerful."
  KOR_yanjiu_lishihui: "Pan-Asian Research Council"
  KOR_yanjiu_lishihui_desc: "Asian wisdom should serve Asia's revolutionary cause. The establishment of the Pan-Asian Research Council aims to integrate the scientific research forces of allied countries, share technological achievements, and jointly overcome cutting-edge scientific and technological difficulties. From atomic energy to space exploration, we will advance hand in hand and challenge the Western world in the field of science and technology."
  KOR_yanjiu_lishihui_tt: "The research speed bonus of §Y$KOR_fanya_yanjiu_lishihui_modifier$§! will increase by §G1%§! with each new camp member, up to a maximum of §G10%§!"
  KOR_fanyan_yihui: "Pan-Asian Parliament"
  KOR_fanyan_yihui_desc: "A unified Asia needs a unified political platform for voice. The Pan-Asian Parliament held in Pyongyang will become the highest deliberative body of our alliance. Here, we will jointly discuss major internal and external policies of allied countries, coordinate positions, and speak to the world with one voice. This is a key step towards our political integration."
  KOR_liangtiaotui_zoulu: "Walking on Two Legs"
  KOR_liangtiaotui_zoulu_desc: "Industry and agriculture are like two legs of a person, neither can be dispensed with. We must not make the mistake of focusing only on heavy industry and letting farmers go hungry. While prioritizing the development of heavy industry, we must vigorously support agriculture and light industry. Only in this way can our country walk steadily and quickly towards prosperity."
  KOR_dashengchan_yundong: "Great Production Movement"
  KOR_dashengchan_yundong_desc: "Do it yourself, and you will have enough to eat and wear! Faced with imperialist blockade and resource scarcity, we cannot wait and rely on others. We must launch a vigorous Great Production Movement, mobilize the army, organs and schools to reclaim wasteland, spin yarn and weave cloth, and break the blockade with our own hands to create everything we need."
  KOR_renmin_gongshe_gouxiang: "Concept of People's Communes"
  KOR_renmin_gongshe_gouxiang_desc: "People's communes are the golden bridge leading to the communist paradise. We will upgrade agricultural cooperatives into basic social units integrating agriculture, industry, commerce, education and military affairs. Here, all means of production are publicly owned, labor is organized uniformly, and life is collectively supplied. We will run towards a brand-new era without private ownership."
  KOR_renmin_gongshe_gouxiang_tt: "Unlock new economic act: §Y$KOR_people_commune_idea$§!"
  KOR_xiaogaolu_jihua: "Small Blast Furnace Plan"
  KOR_xiaogaolu_jihua_desc: "Steel is the backbone of industry, and doubling steel output is the key to surpassing Britain and catching up with the United States. We will mobilize the masses in every corner of the country to build countless small blast furnaces with indigenous methods. Let the flames of steel production burn brightly on the land of the motherland, and the whole nation will make steel to create miracles!"
  KOR_gongsi_heying: "Public-Private Partnership"
  KOR_gongsi_heying_desc: "For the national bourgeoisie, we adopt the strategy of uniting, utilizing and transforming. Through public-private partnerships, the state will send cadres to private enterprises to gradually bring them into the orbit of national planning. This is a key step in the peaceful transformation of capitalist industry and commerce and the ultimate realization of complete nationalization."
  KOR_gongsi_heying_tt: "Improve the effect of the economic act §Y$KOR_people_commune_idea$§!:"
  KOR_wenzi_gaige: "Character Reform"
  KOR_wenzi_gaige_desc: "Complex Chinese characters are a major obstacle to popularizing education and eliminating illiteracy. To enable the broad masses of working people to master culture more easily, we must carry out a character reform. Whether simplifying Chinese characters or comprehensively promoting Hangul, this reform will completely change the cultural landscape of our country."
  KOR_peiyang_difang_ganbu: "Cultivating Local Cadres"
  KOR_peiyang_difang_ganbu_desc: "State power needs to extend to every corner of the grassroots. We must select and cultivate a large number of cadres loyal to the Party and familiar with local conditions from local active workers and peasants. They will become the bridge between the Party and the masses, and the solid foundation for us to consolidate rule at the local level."
  KOR_nongye_youxian_zhengce: "Agriculture-First Policy"
  KOR_nongye_youxian_zhengce_desc: "Food is the paramount necessity of the people. Without a stable agricultural foundation, any grand blueprint for industrialization is just a castle in the air. We must temporarily shift the focus to agriculture to ensure absolute food security and meet the basic needs of the people. Only when farmers' lives are improved can industry obtain a solid support."
  KOR_nongye_hezuoshe: "Agricultural Cooperatives"
  KOR_nongye_hezuoshe_desc: "Scattered small-scale peasant economy cannot resist natural disasters nor realize modernization. We will guide farmers to organize themselves, starting from mutual aid groups, gradually transitioning to primary cooperatives with land as shares, and ultimately realizing advanced cooperatives with complete public ownership of means of production. This is the only path to agricultural collectivization."
  KOR_ziyuan_kaifa_hezi: "Resource Development Joint Ventures"
  KOR_ziyuan_kaifa_hezi_desc: "Our underground contains rich treasures, but we lack the technology and funds to exploit them. By establishing joint ventures with friendly fraternal countries, we can introduce advanced equipment and management experience, quickly convert resource advantages into industrial strength, and inject the first driving force into our economic development."
  KOR_ziyuan_kaifa_hezi_tt: "Unlock trade act: §Y$KOR_ziyuan_kaifa_hezi_idea$§!"
  KOR_qinggongye_zhenxing: "Revitalization of Light Industry"
  KOR_qinggongye_zhenxing_desc: "Revolution is not only for grand factories but also for the smiles of the people. Revitalizing light industry and producing more affordable daily consumer goods will directly improve people's living standards and enhance their labor enthusiasm. A society filled with thermos flasks, bicycles and new clothes will have greater cohesion."
  KOR_jishuguanliao_yingyong: "Appointment of Technocrats"
  KOR_jishuguanliao_yingyong_desc: "Revolutionary enthusiasm cannot replace scientific laws. To manage a modern country, we need a large number of experts who understand technology and are good at management. Breaking the old habit of promoting based on seniority, boldly promoting and appointing engineers, economists and other technocrats, and letting professionals do professional work is the key to improving administrative efficiency."
  KOR_jishuguanliao_yingyong_tt: "The traits of §Y$KOR_Xu_Chengze$§! will be improved"
  KOR_youjihua_de_shangpin_jingji: "Planned Commodity Economy"
  KOR_youjihua_de_shangpin_jingji_desc: "Absolute mandatory planning can sometimes suppress the vitality of production. We will try to use tools such as commodities, value and market to regulate production to a limited extent within the framework of national unified planning. This is not a turn towards capitalism but to make our socialist economy more vibrant and dynamic."
  KOR_youjihua_de_shangpin_jingji_tt: "Unlock new economic act: §Y$KOR_youjihua_de_shangpin_jingji_idea$§!"
  KOR_qianlima_yundong: "Chollima Movement"
  KOR_qianlima_yundong_desc: "Show the momentum of riding a Chollima and gallop towards communism! We will launch a nationwide production increase competition, encouraging all workers to work at the \"speed of Chollima\", break conventions and set records. This movement will make up for our lack of technology and capital with soaring revolutionary drive and create miracles on earth."
  KOR_daan_gongzuo_tixi: "Taegwan Work System"
  KOR_daan_gongzuo_tixi_desc: "The management right of factories must be in the hands of the Party. We will implement the \"Taegwan Work System\", abolish the one-person responsibility system of factory directors, and establish the Party committee as the core of collective leadership in enterprises. Superiors help subordinates, experts help workers, and politics is combined with technology to stimulate the maximum production potential."
  KOR_qinglishan_fangfa: "Chongsanri Method"
  KOR_qinglishan_fangfa_desc: "Cadres cannot issue orders while sitting in offices. We will promote the \"Chongsanri Method\", requiring cadres at all levels to go deep into the grassroots, go to the fields, eat, live and work with the masses, discover and solve problems on the spot. This is a concrete manifestation of our Party adhering to the mass line and opposing bureaucracy."
  KOR_fensan_gongye_buju: "Decentralized Industrial Layout"
  KOR_fensan_gongye_buju_desc: "Putting all eggs in one basket is dangerous. Considering the imperialist military threat, we must adopt a decentralized industrial layout. Establish new industrial bases in inland and mountainous areas to form multiple independent economic zones. Even if some areas are attacked, the country's entire industrial system can continue to operate."
  KOR_xichuan_shuidianzhan: "Hicheon Hydropower Station"
  KOR_xichuan_shuidianzhan_desc: "Electricity is the lifeblood of industry. To solve the severe power shortage problem, we are determined to build an unprecedented large-scale hydropower station in Hicheon. This is not only an energy project but also a battle to conquer nature with will and faith, which will become a glorious symbol of the superiority of our system."
  KOR_dier_jingji: "Second Economy"
  KOR_dier_jingji_desc: "To prioritize meeting the needs of national defense construction, it is necessary for us to establish a \"Second Economy\" system independent of the civilian economy. This economic sector directly controlled by the military will be responsible for the production and R&D of military industry, ensuring that our army can obtain the highest priority resources and the best equipment."
  KOR_guojia_jihua_weiyuanhui: "State Planning Commission"
  KOR_guojia_jihua_weiyuanhui_desc: "Free market is a hotbed of chaos and exploitation, and only planning can bring rationality and justice. We will establish a powerful State Planning Commission, which will become the \"general staff\" of the national economy, responsible for formulating and implementing national economic plans and uniformly allocating all important resources."
  KOR_lianjie_xiboliya_tielu: "Connecting to the Trans-Siberian Railway"
  KOR_lianjie_xiboliya_tielu_desc: "Opening up the steel artery to the north is of great strategic significance. Connecting our railway network with the Soviet Union's Trans-Siberian Railway will not only ensure we receive stable assistance from the Soviet Union but also closely link us with the entire socialist camp, forming an indestructible strategic rear."
  KOR_lianjia_de_baku_shiyou: "Cheap Baku Oil"
  KOR_lianjia_de_baku_shiyou_desc: "Our industrial chariots need sufficient fuel. Through friendly consultations with the great Soviet elder brother, we will obtain cheap oil from the Baku oil fields at a \"fraternal price\". This precious industrial blood will inject infinite power into our tractors and tanks, greatly accelerating our modernization drive."
  KOR_yaoqing_sulian_zhuanjia: "Inviting Soviet Experts"
  KOR_yaoqing_sulian_zhuanjia_desc: "Technological gaps can be made up through modest learning. We will extensively invite experienced Soviet experts to guide our industrial construction. They will not only bring advanced technologies and drawings but also precious experience in socialist construction, helping us avoid many detours."
  KOR_yaoqing_sulian_zhuanjia_tt: "Soviet experts will give us an in-depth understanding of a technology that they have §Yresearched§! but we have §Ynot researched§!."
  KOR_jishu_yinjin: "Technology Introduction"
  KOR_jishu_yinjin_desc: "It is impossible to build a country behind closed doors. We must selectively introduce urgently needed advanced technologies and complete sets of equipment from fraternal countries. Through introduction, digestion, absorption and re-innovation, we can stand on the shoulders of giants and establish our own complete industrial system at a faster pace."
  KOR_binhai_bianjiang_maoyi: "Primorsky Border Trade Agreement"
  KOR_binhai_bianjiang_maoyi_desc: "Developing border trade with the Soviet Primorsky Krai is of great benefit to both sides. We can exchange our agricultural products and light industrial products for urgently needed timber, chemical fertilizers and machinery. This will prosper our border areas and further consolidate our friendly relations with the great northern neighbor."
###############################  Blue  #################################
  KOR_ziyou_shi_lanse: "Blue Mugunghwa"
  KOR_ziyou_shi_lanse_desc: "Mugunghwa is a symbol of the perseverance of our nation. We will endow it with a new meaning - the blue petals represent democracy, freedom and peace. This concept will guide us to build an open, prosperous modern country, and let the flower of freedom bloom forever on the Korean Peninsula."
  KOR_quanguo_saomang_yundong: "National Literacy Campaign"
  KOR_quanguo_saomang_yundong_desc: "A country full of illiterates cannot achieve true strength. We must launch a nationwide literacy campaign to enable every citizen, regardless of age, to master the ability to read and write. The popularization of knowledge will lay the solidest foundation for our industrialization and democratization process."
  KOR_puji_yiwu_jiaoyu: "Establishing National Universities"
  KOR_puji_yiwu_jiaoyu_desc: "The future of the country lies in the next generation with independent thinking ability. We will pour resources into establishing the first national university truly belonging to us. It will become a cradle of free thought and a palace of scientific spirit, continuously cultivating pillars needed for building the newborn democratic republic."
  KOR_baifansixiang_yanjiuyuan: "Reorganizing the \"Korean Patriotic Corps\""
  KOR_baifansixiang_yanjiuyuan_desc: "In the era of liberation, the feat of patriot Yoon Bong-gil shocked the world. To respond to hidden enemies at home and abroad, we will inherit the will of Mr. Baekbeom and reorganize the \"Korean Patriotic Corps\". These most loyal patriots will become the sharpest dagger in our hands, ready to sacrifice everything to defend national dignity and independence."
  KOR_jishuguanliao_de_jueqi: "Rise of Technocrats"
  KOR_jishuguanliao_de_jueqi_desc: "Building a modern country requires professional knowledge rather than empty political slogans. We will break stereotypes and boldly appoint a group of experts and scholars with higher education and proficient in economy and industry to manage the country. The rise of technocrats will greatly improve our administrative efficiency and the scientific nature of decision-making."
  KOR_Lee_Byungchul1_tt: "Appoint §Y$KOR_Lee_Byungchul$§!"
  KOR_jishuguanliao_de_jueqi1_tt: "The traits of §Y$KOR_Lee_Byungchul$§! will be improved"
  KOR_jishuguanliao_de_jueqi_tt: "Additional effects for the following industrial sectors:\n§Y$KOR_hanguo_sanxingdianzi_ideas_1$§!：$electronics_research$：§G+10%§!，$modifier_production_speed_industrial_complex_factor$：§G+10%§!，$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$：§G+10%§!"
  KOR_jishuguanliao_de_jueqi2_tt: "Chaebols will be more likely to build high-value buildings, such as §Ycivilian factories§!, §Ymilitary factories§!, §Ydockyards§! and §Yadditional building slots§!"
  KOR_jianli_zhongyang_yinhang: "Establishing a Central Bank"
  KOR_jianli_zhongyang_yinhang_desc: "An independent country must have its own financial \"heart\". Establishing a central bank and issuing our own legal tender will enable us to control the country's monetary policy, stabilize the financial market, and resist the impact of foreign capital. This is a crucial step towards achieving economic independence."
  KOR_tudi_gaige_fa: "Land Reform Act"            #Second Liberation
  KOR_tudi_gaige_fa_desc: "Land to the tiller is the foundation of social justice and stability. We will implement peaceful land reform to distribute land from a small number of landlords to tens of millions of landless peasants. This will greatly stimulate the enthusiasm for agricultural production and fundamentally eliminate feudal residues that may lead to social unrest."
  KOR_tudi_gaige_fa_tt: "Unlock the decision: §YCarry out land reform§!, §Y$rural$§! will become §Y$town$§!."       
  KOR_minzu_zichan_peiyang: "Cultivating National Capital"
  KOR_minzu_zichan_peiyang_desc: "We cannot rely on foreign capital forever. Through state support, we must consciously cultivate a group of patriotic national capitalists belonging to us. They will become the backbone of the national economy and defend our economic sovereignty in competition with foreign enterprises."
  KOR_zhongxiao_qiye_zhenxing: "Revitalization of Small and Medium-Sized Industries"
  KOR_zhongxiao_qiye_zhenxing_desc: "A healthy economy cannot have only large enterprises. We will vigorously support small and medium-sized industrial enterprises through policies such as low-interest loans and tax reductions and exemptions. They will provide a large number of employment opportunities for society, stimulate market vitality, and form a flexible economic structure complementary to large enterprises."
  KOR_ziyuan_guo_you_hua: "Nationalization of Resources"
  KOR_ziyuan_guo_you_hua_desc: "The mineral deposits underground in the country are wealth belonging to all citizens, and must not fall into the hands of private individuals or foreign capital. We will legislate to nationalize all key natural resources, which will be uniformly planned and exploited by the state to ensure these precious resources can serve the overall strategic interests of the country."
  KOR_tuiguang_nongcun_hezuoshe: "Promoting Rural Cooperatives"
  KOR_tuiguang_nongcun_hezuoshe_desc: "Scattered small-scale peasant economy is difficult to resist risks and cannot adapt to the needs of modernization. We will encourage and guide farmers to establish production, supply and marketing, and credit cooperatives, improve production efficiency through mutual support, enhance bargaining power with the market, and gradually improve the living conditions in rural areas."
  KOR_xiufu_fuzhan_shuiku: "Restoring the Pujon Reservoir"
  KOR_xiufu_fuzhan_shuiku_desc: "The Pujon Reservoir was an important source of electricity during the colonial era but was severely damaged in the war. Restoring and expanding this large-scale water conservancy facility will not only provide urgently needed electricity for our industrial reconstruction but also symbolize our nation's determination and ability to heal the wounds of war with our own strength."
  KOR_shenbushier_yundong: "\"Sinsabori\" Movement"
  KOR_shenbushier_yundong_desc: "Our bodies and the land where we grow up are an inseparable whole. We will launch a national \"Sinsabori\" movement, advocating that citizens consume agricultural products produced in our country to support domestic agriculture and ensure food security. This is not only an economic strategy but also a profound expression of patriotism."
  KOR_xincunyundong_de_chuxing: "Embryo of the New Village Movement"
  KOR_xincunyundong_de_chuxing_desc: "The backwardness of rural areas is the biggest shortcoming of national development. With the slogan of \"Diligence, Self-reliance, and Cooperation\", we will launch a mass movement to transform the rural landscape. By improving living environments and building rural roads, we will inspire farmers' awareness of modernization, laying the foundation for the larger-scale \"New Village Movement\" in the future."
  KOR_meiyuan_yilai_jingji: "US Aid-Dependent Economy"
  KOR_meiyuan_yilai_jingji_desc: "Aid from the United States is a lifeline for post-war reconstruction, but it may also become a crutch we can never shake off. Flour, cotton, and US dollars help us tide over difficulties, yet they also distort our economic structure and impact national industries. This is a bitter wine that we have to drink nonetheless."
  KOR_meiyuan_yilai_jingji_tt: "Unlock the §YUS Aid Loan§! resolution. [ROOT.GetNonIdeologyName] gains:\n$KOR_international_loan_modifier_tt$"
  KOR_international_loan_modifier_tt: "Gain §Y$KOR_international_loan_modifier$§!, which has the following effects:\nDaily Political Power Cost: §R+10.0%§!\nResource\nAcquisition Efficiency: §G+5.0%§!\nConstruction Speed: §G+4.0%§!\nFactory Output: §G+6.0%§!\nDockyard Output: §G+6.0%§!"
  KOR_caifa_de_dansheng: "Birth of the Chaebols"
  KOR_caifa_de_dansheng_desc: "To achieve industrialization in the shortest time possible, we need to concentrate resources to accomplish great things. The state will select a number of promising enterprises, provide them with full policy, funding, and market support, and nurture them into large comprehensive enterprise groups - \"chaebols\" - capable of participating in international competition. This is the core of our catch-up strategy."
  KOR_Lee_Byungchul_tt: "§Y$KOR_Lee_Byungchul$§! as an advisor, §Rcannot be dismissed§!"
  KOR_caifa_de_dansheng_tt: "The chaebols will begin constructing buildings in our country"
  KOR_junshi_youxian_jingji: "Military-First Economy"
  KOR_junshi_youxian_jingji_desc: "In a perilous environment surrounded by powerful enemies, economic development is empty talk without a strong national defense. We must prioritize limited resources to defense industries and military construction. A seemingly distorted \"military-first\" economy is the only choice for us to survive in this jungle-like world."
  KOR_kuojian_fushan_renchuan_gang: "Expand Busan and Incheon Ports"
  KOR_kuojian_fushan_renchuan_gang_desc: "As a peninsular country, the ocean is our lifeline. Large-scale expansion of Busan and Incheon, our two major ports, will not only greatly enhance our international trade throughput capacity but also provide the necessary home port support for our future establishment of a strong navy, serving as the foundation for our march towards the ocean."
  KOR_meihan_jingji_xieding: "US-ROK Economic Agreement"
  KOR_meihan_jingji_xieding_desc: "To stabilize US aid and investment in legal form, we must sign a comprehensive economic cooperation agreement with Washington. This agreement will open the US market to us and secure key technology transfers, paving the way for our economic take-off, even though it may require some compromises on our sovereignty."
  KOR_hanjiang_qiji: "Miracle on the Han River"
  KOR_hanjiang_qiji_desc: "To stabilize US aid and investment in legal form, we must sign a comprehensive economic cooperation agreement with Washington. This agreement will open the US market to us and secure key technology transfers, paving the way for our economic take-off, even though it may require some compromises on our sovereignty."
  KOR_hanjiang_qiji_tt: "The capital will be named §Y“$KOR_Seoul_Special_City$”§!"
  KOR_Seoul_Special_City: "Seoul"
  KOR_baifan_de_lixiangguo: "Baekbeom's Ideal Nation"
  KOR_baifan_de_lixiangguo_desc: "We aim not only to build a prosperous and powerful country but also one with the highest cultural attainments - this is Mr. Baekbeom's ultimate ideal. In this nation, the power of culture surpasses all else, the people are courteous, and society is full of justice. We will strive lifelong to realize this lofty ideal nation."
  KOR_sanjun_zhuyi: "Three Equalities Doctrine"
  KOR_sanjun_zhuyi_desc: "The \"Three Equalities Doctrine\" is the fundamental constitutional principle of our nation-building. Through \"Equal Land\", we realize that those who till the land own it; through \"Equal Rights\", we achieve universal suffrage and political equality for the people; through \"Equal Education\", we realize equal access to national education opportunities. These three basic national policies will jointly build a fair, just, and harmonious ideal society."
  KOR_jianli_lianzheng_gongshu: "Establish the Independent Commission Against Corruption"
  KOR_jianli_lianzheng_gongshu_desc: "Power without supervision inevitably leads to corruption. We will establish an Independent Commission Against Corruption independent of all government departments, endowing it with supreme power to investigate and punish any corrupt acts. An incorruptible government is the cornerstone of winning people's trust and ensuring long-term national stability."
  KOR_funv_quanli_baozhang: "Protection of Women's Rights"
  KOR_funv_quanli_baozhang_desc: "A nation's attitude towards women marks its level of civilization. We will legislate to completely abolish all feudal remnants of discrimination against women and guarantee women equal rights with men in all fields, including politics, economy, and education. Emancipating the \"other half of the sky\" will inject boundless vitality into national development."
  KOR_difang_izhi_faan: "Local Autonomy Act"
  KOR_difang_izhi_faan_desc: "Democracy is rooted at the grassroots level. We will promulgate the Local Autonomy Act, devolve part of the power and fiscal resources to local governments, and implement direct elections for local councils and chiefs. This will greatly exercise the people's ability to participate in politics and let democracy take root and flourish on every inch of the Korean Peninsula."
  KOR_tuiguang_meili_de_guojia: "Promote the \"Beautiful Country\" Concept"
  KOR_tuiguang_meili_de_guojia_desc: "A powerful country must possess not only strong military force but also strong cultural appeal. We will promote the cultural concept of a \"Beautiful Country\", shaping our national image of a peace-loving and culture-revering nation through art, literature, and education, thereby winning the respect of the world."
  KOR_lishi_shencha_weiyuanhui: "Historical Review Committee"
  KOR_lishi_shencha_weiyuanhui_desc: "History cannot be tampered with, and justice cannot be delayed. The establishment of the Historical Review Committee aims to comprehensively and impartially review the history of the colonial era, especially to bring to account those \"pro-Japanese factions\" who betrayed the nation. Only by facing up to and settling the past can our nation move forward in unity towards the future."
  KOR_huifu_minzu_wenzi_yu_yuyan: "Restore National Language and Characters"
  KOR_huifu_minzu_wenzi_yu_yuyan_desc: "Language and characters are the soul of a nation. We will launch a revival movement for national language and characters, eliminate linguistic remnants left by the colonial era, promote and standardize our Hangul, and let the language carrying our 5,000-year history once again become the source of our national identity and pride."
  KOR_qingnian_aiguo_tuan: "Youth Patriotic Corps"
  KOR_qingnian_aiguo_tuan_desc: "Youth are the future and hope of the country. We will form a national \"Youth Patriotic Corps\" to cultivate patriotism, national spirit, and military skills among the vast number of young people. This dynamic team will become the most reliable reserve force for us to defend and build the country."
  KOR_minzu_hejie_weiyuanhui: "National Reconciliation Committee"
  KOR_minzu_hejie_weiyuanhui_desc: "Conflicts between left and right, divisions between north and south, have inflicted too many scars on our nation. The establishment of the National Reconciliation Committee aims to build a dialogue platform to resolve internal conflicts and promote national unity. We firmly believe that as long as they are patriotic compatriots, regardless of their ideological differences, they should join hands under the banner of unification."
  KOR_minzu_hejie_weiyuanhui_tt: "Some §YCommunist§! advisors and generals will become available"
  KOR_baozheng_yanlun_jihui_ziyou: "Guarantee Freedom of Speech and Assembly"
  KOR_baozheng_yanlun_jihui_ziyou_desc: "A healthy country cannot have only one voice. We will effectively guarantee the people's freedoms of speech, press, assembly, and association through the constitution. People's criticism and supervision are the best preservatives to prevent the government from moving towards autocracy and corruption, and also a manifestation of social vitality."
  KOR_jiechu_wuzhuang_zhengzhi: "Abolish Armed Politics"
  KOR_jiechu_wuzhuang_zhengzhi_desc: "In a newly born nation, no political party or faction shall be allowed to possess its own private armed forces. The state must monopolize all legitimate violence. We will take resolute measures to disarm all non-governmental armed groups, ensuring that the military is loyal only to the state and the people, not to any political faction."
  KOR_wenguan_zhengfu_de_queli: "Establishment of a Civilian Government"
  KOR_wenguan_zhengfu_de_queli_desc: "The military's duty is to defend the country, not to govern it. We must establish the fundamental principle of \"civilian governance\", letting soldiers return to barracks and entrusting state administrative power to a civilian government elected through democratic procedures. This is an important symbol of the country moving towards normalization and maturity."
  KOR_hongyi_renjian_de_zhengzhi: "Politics of Hongik Ingan"
  KOR_hongyi_renjian_de_zhengzhi_desc: "\"Hongik Ingan\" - dedicating oneself to the well-being of all humanity - is the founding ideal of our nation since ancient times. Our politics should not only pursue the prosperity and strength of our own country but also aim to \"contribute to the coexistence and common prosperity of humanity\". This lofty political philosophy will earn us high international prestige."
  KOR_guangfujun_jingshen: "Spirit of the Liberation Army"
  KOR_guangfujun_jingshen_desc: "Our military inherits the glorious tradition of the \"Liberation Army\" that persisted in the War of Resistance against Japan on the Chinese battlefield. We will take the indomitable and patriotic spirit of the \"Liberation Army\" as the soul of the military, building our army into a powerful and mighty force with firm patriotic will and strong combat effectiveness."
  KOR_quanmin_fangyu_xueshuo: "Total National Defense Doctrine"
  KOR_quanmin_fangyu_xueshuo_desc: "Facing potential enemies with numerical superiority, we must turn the entire country into an impregnable fortress. Implementing the \"Total National Defense\" doctrine means every citizen is a soldier, and every inch of land is a battlefield. Once the enemy invades, they will be trapped in a vast ocean of people's war."
  KOR_shandi_youji_chuancheng: "Inheritance of Mountain Guerrilla Warfare"
  KOR_shandi_youji_chuancheng_desc: "The mountainous terrain of the Korean Peninsula is a natural stage for guerrilla warfare. Our military will inherit and carry forward the valuable experience of maneuvering against the enemy in mountain forests during the anti-Japanese period, training our soldiers to become experts in mountain warfare, and using flexible and mobile guerrilla tactics to bog down any powerful enemy."
  KOR_yubeiyi_dongyuan_tixi: "Reserve Mobilization System"
  KOR_yubeiyi_dongyuan_tixi_desc: "We cannot maintain a large standing army in peacetime. Therefore, establishing an efficient reserve mobilization system is crucial. All healthy retired males will be enrolled in the reserve forces and receive regular training. Once war breaks out, we can mobilize millions of troops in the shortest possible time."
  KOR_fangong_jianguo_gangling: "Anti-Communist Founding Platform"
  KOR_fangong_jianguo_gangling_desc: "Communism is a devil that subverts our freedom, democracy, and traditions. We will take \"anti-communism\" as a basic national policy, building a solid defense line at all levels - ideological, political, and social. Any words or deeds of sympathizing with or propagating communism will be regarded as treason against the country and severely cracked down upon."
  KOR_quanguo_huji_denglu: "National Household Registration"
  KOR_quanguo_huji_denglu_desc: "To effectively govern the country, allocate resources, and maintain social order, we must establish a rigorous nationwide household registration system. Detailed information of every citizen will be recorded. This will greatly enhance the state's social control capabilities, leaving no place for any saboteurs to hide."
  KOR_minzujingshen_gaizao: "Transformation of National Spirit"
  KOR_minzujingshen_gaizao_desc: "Long-term colonial rule and backward feudal ideology have eroded the fighting spirit of our nation. We must launch a top-down \"transformation of national spirit\" movement, eradicating servility, laziness, and conservatism, and injecting new spirits of loyalty, obedience, and modernization into the people, forging the entire nation into an unbreakable piece of steel."
  KOR_guojia_anbao_fa: "Enactment of the National Security Act" #Korean Central Intelligence Agency (KCIA)
  KOR_guojia_anbao_fa_desc: "The country is in a critical moment of internal and external troubles, and extraordinary measures must be taken. Enacting the National Security Act will endow the government and intelligence agencies with powers beyond conventional laws to \"prevent\" and \"eliminate\" any organizations or individuals that may threaten national security. This is a necessary evil to maintain stability."
  KOR_qianghua_qingbao_jiguan: "Strengthen Intelligence Agencies"
  KOR_qianghua_qingbao_jiguan_desc: "In a world of war filled with spies and conspiracies, a strong intelligence agency is the guarantee of national survival. We will spare no cost to build an intelligence empire capable of rigorous internal monitoring and effective external infiltration. The sword in the dark will guard the light of the country."
  KOR_suqing_chise_fenzi: "Purge Remaining Red Elements"
  KOR_suqing_chise_fenzi_desc: "The specter of communism is hovering over the peninsula. We cannot show the slightest mercy. A nationwide \"purge of red elements\" movement is about to launch. The military, police, and patriotic youth will take action to uproot all communist sympathizers and infiltrators from our society."
  KOR_NanLao_Party_Congress_Incident_flag: "The South Labor Party Congress Incident has ended"
  KOR_suqing_chise_fenzi_tt: "§YSelecting this national policy will end the $KOR_Communist_uprising_mission$ mission.§!"
  KOR_jidu_jiao_liguo_lun: "Christian Nation-Building Theory"
  KOR_jidu_jiao_liguo_lun_desc: "In the struggle against colonial rule, the Christian faith provided tremendous spiritual strength to our nationalists. Now, we will go further, taking Christian doctrines as the moral and legal foundation of our country, building an earthly kingdom blessed by God to confront atheistic communism."
  #####Easter Egg - Christianity
  KOR_jidu_zhujiaojueduan: "Pastoral Staff and Scepter"
  KOR_jidu_zhujiaojueduan_desc: "The church must step out of the sanctuary and take up authority in the name of God to stabilize the collapsing order. This is God's test and also the sacred responsibility that bishops cannot shirk. Archbishop $JKO_Archbishop_Roh_Paul$ will reshape the soul of this country with an iron fist and faith."
  KOR_jidu_llaizi_luoma_de_xinjian: "Blessings from Rome"
  KOR_jidu_llaizi_luoma_de_xinjian_desc: "The legitimacy of a theocratic government emerging in the Far East is being questioned by the secular world. To consolidate this new but fragile rule, we must obtain the personal blessing of the Supreme Pontiff of the Catholic Church - the Pope in Rome."
  KOR_jidu_jidu_qingniantuan: "Christian Youth Corps"
  KOR_jidu_jidu_qingniantuan_desc: "The future of the country lies in the loyalty of the next generation. We will establish the Christian Youth Corps, instilling both faith and patriotism into their young souls. They will hold the cross and the sword, becoming the strongest cornerstone to defend the earthly kingdom of heaven."
  KOR_jidu_qidao_yu_laodong: "Prayer and Labor"
  KOR_jidu_qidao_yu_laodong_desc: "Following the ancient teachings of Saint Benedict, \"Ora et Labora (Pray and Work)\" will become the creed of our country. The people's sweat is a prayer offered to God, and the roar of factories is a hymn of praise to the Lord. Every hard work is a brick laid for building the earthly kingdom of heaven."
  KOR_dongfang_de_weidui: "Swiss Guard of the East"
  KOR_dongfang_de_weidui_desc: "Following the example of the Holy See in Rome, we will form an elite guard of absolute loyalty. They will be the bishop's personal armed forces, the solid shield and halberd of faith, swearing to defend the earthly kingdom of heaven and its shepherd to the death, eradicating anyone who dares to question the theocracy."
  KOR_dongfang_de_weidui_tt: "$KOR_Christian_Church_modifiers$\n$ITA_modern_musculus_dynamic_modifier_tt$\n\n"
  KOR_jidu_kongtian_qishi: "Knights of the Sky"
  KOR_jidu_kongtian_qishi_desc: "Our pilots are not only soldiers but also \"Knights of the Sky\" mandated by heaven. Their fighter jets are iron wings executing divine punishment, and every dive is a judgment on heretics. They will bring destruction to enemies in the air above the clouds in the name of God."
  #####
  KOR_qingnian_fangong_lianmeng: "Youth Anti-Communist League"
  KOR_qingnian_fangong_lianmeng_desc: "Youth are the fresh forces in the anti-communist struggle. We will form a national \"Youth Anti-Communist League\", arming them with firm anti-communist ideology, and training them to be vanguards in street struggles against red elements and exposing \"dangerous thoughts\" on campuses. The future of the country needs them to defend."
  KOR_qingxi_linshi_zhengfu: "Purge Opposition Forces"
  KOR_qingxi_linshi_zhengfu_desc: "The revolutionary ranks are mixed with opportunists and dissidents. Those guys from the opposition, with outdated ideas and fragmented factions, have become obstacles to our establishment of a strong and unified leadership core. A political purge is necessary to consolidate the leader's absolute authority."
  KOR_yimin_zhu_yi: "One People Doctrine"
  KOR_yimin_zhu_yi_desc: "The state, the nation, and the people are trinity and inseparable. Under the banner of the \"One People Doctrine\", all citizens should unite around the sole leader and dedicate everything to the supreme interests of the state and the nation. Individualism and the ideology of class struggle are heresies that must be eliminated."
  KOR_difang_quanli_xueruo: "Weakening Local Power"
  KOR_difang_quanli_xueruo_desc: "A powerful country must have a centralized authority that can be implemented to the end. We will gradually take back the power devolved to local governments, abolish local elections, and all local chiefs will be directly appointed by the central government. Only in this way can the will of the state be implemented without compromise on every inch of land."
  KOR_jinji_zhuangtai_fa: "State of Emergency Act"
  KOR_jinji_zhuangtai_fa_desc: "The country is facing a life-or-death \"state of emergency\", and conventional democratic procedures are no longer applicable. Through this act, the leader will obtain all powers beyond the constitution, including dissolving parliament and restricting civil rights. To save the country, dictatorship is a necessary and only means."
  KOR_yongyuan_de_guofu: "[GetLKORYongyuanDeGuofu]"
  KOR_yongyuan_de_guofu_desc: "[GetLKORYongyuanDeGuofuDESC]"
  KOR_yongyuan_de_guofu_1_key: "Eternal Father of the Nation"
  KOR_yongyuan_de_guofu_1DESC_key: "The extraordinary achievements of President $KOR_syngman_rhee$ have transcended the realm of mortals. He is not only the founder of the country but also the eternal father and mentor of our nation. We will legislate to establish President $KOR_syngman_rhee$'s eternal status as the \"Father of the Nation\", his ideology will become the unshakable guiding principle of our country for all ages, and his authority shall not be challenged in any way."
  KOR_yongyuan_de_guofu_2_key: "Establish the Earthly Kingdom of Heaven"
  KOR_yongyuan_de_guofu_2DESC_key: "The secular republic is already corrupt, and now is the time to establish the kingdom of God on earth. Archbishop No Jin-nam will become the \"Regent Archbishop\", proclaiming the official advent of the \"Earthly Kingdom of Heaven\". A brand-new, sacred South Korea will be born hereupon."

  KOR_yongyuan_de_guofu_tt: "§YSelecting this national policy will end the $KOR_constitutional_crisis_mission$ mission.§!"
  KOR_gonggu_hanmei_fangyu_tiaoyue: "US-ROK Mutual Defense Treaty"
  KOR_gonggu_hanmei_fangyu_tiaoyue_desc: "Facing the enormous threat from the communist bloc, we must form a firm military alliance with the United States, the leader of the free world. Signing the US-ROK Mutual Defense Treaty means any attack on us will be regarded as an attack on the United States. This is the ultimate guarantee of our national security."
  KOR_yaoqing_KMAG: "Invite KMAG"
  KOR_yaoqing_KMAG_desc: "To build a modern military, we need the most advanced military ideology and training methods. We will formally invite US officers of the \"Korean Military Advisory Group (KMAG)\" to help us train and reorganize our army, navy, and air force from scratch in accordance with Western standards."
  KOR_jieshou_meiyuan_zhuangbei: "Receive US Aid Equipment"
  KOR_jieshou_meiyuan_zhuangbei_desc: "Spirit alone cannot win battles. We are in urgent need of modern weapons and equipment. Through the US military assistance program, we will obtain a large number of tanks, artillery, aircraft, and ships. These \"US aid equipment\" will completely transform our military and achieve a qualitative leap in combat effectiveness."
  KOR_paobing_huoli_xueshuo: "Artillery Firepower Doctrine"
  KOR_paobing_huoli_xueshuo_desc: "Our manpower may be limited, but our firepower will be unlimited. We will build artillery as the absolute core of the army, adhering to the combat doctrine of \"firepower supremacy\". Before launching any offensive, we will first wipe out the enemy's positions from the face of the earth with overwhelming artillery fire."
  KOR_haijun_de_liming: "Asian Fleet Training"
  KOR_haijun_de_liming_desc: "Our navy cannot only linger in coastal waters. Through regular joint training with the powerful US Seventh Fleet, our sailors will learn valuable experience in ocean-going operations. This will not only enhance our naval combat capabilities but also demonstrate to potential enemies the firm determination of our alliance."
  KOR_haijun_feixingyuan_jihua: "Overseas Pilot Training Program"
  KOR_haijun_feixingyuan_jihua_desc: "To build an air force that can compete with the enemy, excellent pilots are the key. We will select the most outstanding young people and send them to US air force bases to receive the world's top flight training. When they return driving the latest jet fighters, the sky of Korea will truly belong to us."
  KOR_tezhong_silingbu_meiguo: "US-ROK Combined Forces Command"
  KOR_tezhong_silingbu_meiguo_desc: "To achieve the highest efficiency of coordinated operations in wartime, we must establish a unified Combined Forces Command with the US military. This means that in emergency situations, part of our command power will be transferred to the US side. This is the price we must pay for victory and also a symbol of the unbreakable alliance between us."
  KOR_qiaobao_waijiao_wangluo: "Overseas Compatriot Diplomatic Network"
  KOR_qiaobao_waijiao_wangluo_desc: "Millions of overseas compatriots scattered around the world are our valuable diplomatic resources. We will establish a global overseas compatriot liaison network, encouraging them to speak up for the motherland, lobby the governments of their host countries, and become a powerful fresh force for our country in the civilian diplomatic front."
  KOR_qiaobao_waijiao_wangluo_tt: "Unlock the resolution §YEstablish Overseas Compatriot Network Locally§!, we have a chance to gain intelligence bonuses from the target country."
  KOR_wenhua_waijiao_changyi: "Cultural Diplomacy Initiative"
  KOR_wenhua_waijiao_changyi_desc: "The true power of a country lies in the attractiveness of its culture. We will launch a \"Cultural Diplomacy\" initiative, shaping a peaceful, civilized, and charming national image by promoting our music, art, cuisine, and traditions to the world, thereby enhancing our international soft power."
  KOR_wenhua_waijiao_changyi_tt: "Unlock the resolution §YPromote Cultural Exchanges in Foreign Countries§!"
  KOR_guoji_jishu_hezuo: "International Technological Cooperation"
  KOR_guoji_jishu_hezuo_desc: "We cannot achieve modernization by closing our doors. We will actively seek international technological cooperation with Western developed countries, helping us bridge the technological gap and achieve rapid catch-up in key fields such as electronics, chemical industry, and machinery through the introduction of advanced technologies, patents, and talents."
  KOR_heping_xianfa_chengnuo: "$JAP_fund_resistance_groups_in_asia$"
  KOR_heping_xianfa_chengnuo_desc: "$JAP_fund_resistance_groups_in_asia_desc$"
  KOR_bianjing_fei_junshi_xieding: "Liberator of the Asian People"              #Proposal for a Demilitarized Zone on the Border
  KOR_bianjing_fei_junshi_xieding_desc: "We have suffered oppression, so we understand the value of freedom better. Korea's independence should not be the end, but the starting point. As a beacon of freedom in Asia, we will assume historical responsibility, hold high the banner of democracy, support all peoples still under imperialist slavery and colonial oppression, and bring the spark of hope to the entire Asia."
  KOR_yazhou_zhongli_lianmeng: "Asian Democratic Alliance"
  KOR_yazhou_zhongli_lianmeng_desc: "Democratic countries in Asia need to unite to jointly resist imperialist colonialism and the restoration of autocracy. We will initiate the establishment of an \"Asian Democratic Alliance\", inviting all Asian countries that believe in freedom and democratic values to join. This alliance will become a solid fortress of the free world in this region."
  KOR_Asian_Convention_Organization: "[GetLKORAsianConventionOrganization]"
  KOR_Asian_Convention_Organization_desc: "[GetLKORAsianConventionOrganizationDESC]"
  KOR_Asian_Convention_Organization_1_key: "Vanguard of the Free World"
  KOR_Asian_Convention_Organization_1DESC_key: "Our destiny should not be merely surviving in the gap between great powers, but leading a free Asia. As the forefront of the ideological struggle, we will gladly accept the role of the \"Vanguard of the Free World\", becoming the United States' firmest ally and strategic cornerstone on the Asian continent - not only a fortress of democracy but also a spear projecting liberal values."
  KOR_Asian_Convention_Organization_2_key: "Holy War Decree"
  KOR_Asian_Convention_Organization_2DESC_key: "It is time to launch a new holy war. The brand-new war machine will roar in His name, ready to smash the heretics with righteous anger. Peace will never come until the judgment of artillery fire descends on all unbelievers."
  KOR_duiri_suo_pei: "Claims for Compensation from Japan"
  KOR_duiri_suo_pei_desc: "Japan must compensate our people for its decades of brutal colonial rule. We will use all diplomatic means to pressure Tokyo to pay war reparations and return cultural relics. This is not only for material compensation but also for upholding historical justice."
  KOR_duiri_suo_pei_tt: "\nThey will be more likely to yield if:\n-Their §HWar Support§! is less than §H50%§!\n-They are not in a §HFaction§!\n-The United States\nguarantees our §HIndependence§!\n-Their §HMilitary Strength§! is §Hweaker§! than ours!"
  KOR_jingti_junguo_zhuyi_fusu: "Vigilant Against the Resurgence of Militarism"
  KOR_jingti_junguo_zhuyi_fusu_desc: "We must remain vigilant at all times against the moves of our neighboring country to the east. Any attempt by it to rearm or amend the Peace Constitution will be regarded by us as a clear signal of the resurgence of its militarism. We reserve the right to take all preemptive measures to prevent the recurrence of historical tragedies."
  KOR_menghu_de_paoxiao: "Roar of the Tiger"
  KOR_menghu_de_paoxiao_desc: "We are no longer the \"Hermit Kingdom\" that can be bullied at will. The sleeping tiger has awakened and let out its roar! We will adopt a tough and proactive foreign policy, resolutely responding to any words or deeds that infringe upon our sovereignty and dignity. The world will relearn how to respect us."
  KOR_menghu_de_paoxiao_tt: "\nGain §Y1 Tank Division§! in §Y[ROOT.Capital.GetName]§!, commanded by Major General §Y$KOR_Li_Zhongzan$§!."
  KOR_jiefang_manzhou_ren: "Gando Issue"
  KOR_jiefang_manzhou_ren_desc: "Gando has been the land where our nation has lived since ancient times, and millions of our compatriots still reside there to this day. We must not ignore this history. Now is the time to put the \"Gando Issue\" back on the agenda and declare to the world our indisputable historical sovereignty over this homeland."
  KOR_jiefang_manzhou_ren_tt: "We will gain a §YPuppet§! war goal against all §Ynon-democratic Chinese§! countries. Current target:"
  KOR_ziyou_de_huixiang: "[GetLKORZiyouDeHuixiang]"
  KOR_ziyou_de_huixiang_desc: "[GetLKORZiyouDeHuixiangDESC]"
  KOR_ziyou_de_huixiang_1_key: "Echoes of Freedom"
  KOR_ziyou_de_huixiang_1DESC_key: "Our freedom and prosperity will become a beacon inspiring the people of other Asian countries. We will spread the idea of freedom to those still living under autocratic rule through various means such as broadcasting and cultural exchanges. The echoes of freedom will eventually cross the Iron Curtain and awaken their longing for democracy in their hearts."
  KOR_ziyou_de_huixiang_2_key: "Beacon of Faith in Asia"
  KOR_ziyou_de_huixiang_2DESC_key: "In this continent filled with paganism and atheism, our sacred nation is the only light. We must assume the mission to become the \"Beacon of Faith in Asia\", letting the glory of the Lord shine on every corner of the East and unite all brothers in faith."
  KOR_wei_yazhou_dikang_tigong_zijin: "Contact White Army Exiles"
  KOR_wei_yazhou_dikang_tigong_zijin_desc: "The enemy of my enemy is my friend. In Manchuria, there are still many White Russian exiled officers who once fought against the Red Army. They are staunch anti-communists, and their valuable combat experience is exactly what we need. We will invite them to serve as military advisors to guide us in confronting the common red threat."
  KOR_wei_yazhou_dikang_tigong_zijin_tt: "Unlock the resolution §YPenetrate the Far East§!, regions that have been penetrated will join us when war breaks out with the Soviet Union."
  KOR_yaxiya_tiaoyue_zuzhi: "Eagle of the East"
  KOR_yaxiya_tiaoyue_zuzhi_desc: "As the United States' firmest ally in Asia, we will play the role of the \"Eagle of the East\". Our powerful military will become a bridgehead to contain the expansion of communism in the Far East, actively cooperating with the United States' global strategy. With unquestionable loyalty, we will defend the outpost of the free world in Asia."
  KOR_dongya_guanshui_tongmeng: "Establish the Asian Customs Union"
  KOR_dongya_guanshui_tongmeng_desc: "A unified Asia should first start with economic integration. We will initiate the establishment of the \"Greater Asian Customs Union\", dismantling trade barriers between member states to form a unified large market. This will greatly promote intra-regional trade and prosperity, laying the foundation for deeper integration."
  KOR_dongya_huobi_lianmeng: "Establish the Asian Monetary Union"
  KOR_dongya_huobi_lianmeng_desc: "On the basis of the customs union, we will go further to promote the establishment of an \"Asian Monetary Union\". Issuing a unified Asian currency led by us will enable us to completely break free from the shackles of the US dollar and establish an independent economic zone that can stand shoulder to shoulder with Europe and America."
  KOR_dongya_yitihua_lianmeng: "Integration Alliance"
  KOR_dongya_yitihua_lianmeng_desc: "Economic integration inevitably requires political and military coordination. We will push the alliance towards deeper \"integration\", establishing a unified parliament and joint command to coordinate the internal and external policies of member states. A brand-new supranational entity with us at the core is rising on the horizon."
  KOR_dongya_yitihua_lianmeng_tt: "Every §YFaction Member§! will receive the §YEvent:§! [KOR.GetNameDefCap] hopes to further integrate our economies"
  KOR_dadongya_lianbang: "Asian Federation"
  KOR_dadongya_lianbang_desc: "Our ultimate goal is to unite all like-minded Asian countries into a unified \"Asian Federation\". In this federation, each country will retain a certain degree of autonomy, but foreign affairs, military, and major economic policies will be led by a unified central federal government. A brand-new superpower is about to be born."
  KOR_dadongya_lianbang_tt: "We will be known as §YFree Asian Alliance§!"

###############################  Gray  #################################
  KOR_minzhi_de_dengta: "Lighthouse of People's Governance"
  KOR_minzhi_de_dengta_desc: "Our country should be a country for all the people. We will hold high the \"lighthouse of people's governance\" to build a republic where sovereignty truly resides with the people. The power of the government comes from the grant of the people and serves the well-being of the people. This path will guide us to avoid falling into extreme left or right and become a model of democracy in Asia."
  KOR_qingsuan_yu_hejie: "Accountability and Reconciliation"
  KOR_qingsuan_yu_hejie_desc: "We must resolutely hold to account the heinous pro-Japanese traitors to uphold national justice. But at the same time, for the unity of the country, we should also give compatriots who have made mistakes but are willing to repent a chance for reconciliation. Learning from past mistakes to avoid future ones, curing the sickness to save the patient is our basic policy in handling historical issues."
  KOR_mengyang_de_lixiang: "[GeKORmengyangdelixiangDominanceName]"
  KOR_mengyang_de_lixiang_desc: "[GeKORmengyangdelixiangDominanceNameDESC]"
  KOR_mengyang_de_lixiang_text: "Mengyang's Ideal"
  KOR_mengyang_de_lixiang_text_desc: "Mr. Mengyang's ideal is to build a unified, independent, and autonomous Korea that does not lean towards either the United States or the Soviet Union, and is jointly built by both left and right factions. This ideal is a torch in the dark, guiding us to take an unprecedented middle path for the survival and development of the nation in the gap between the two blocs."
  KOR_mengyang_de_lixiang_2_text: "Gandhi of Korea"
  KOR_mengyang_de_lixiang_2_text_desc: "Mr. Cho Man-sik's ideal is to build a unified, independent, and autonomous Korea that does not lean towards either the United States or the Soviet Union, and is jointly built by both left and right factions. This ideal is a torch in the dark, guiding us to take an unprecedented middle path for the survival and development of the nation in the gap between the two blocs."
  KOR_a_new_constitution: "New Constitution"
  KOR_a_new_constitution_desc: "To permanently establish our impartial and independent line, we must promulgate a new constitution. It will legally place national interests above all ideologies, laying an unshakable foundation for the long-term stability and prosperity of the country."
  KOR_litteracy_effort: "Literacy Campaign"
  KOR_litteracy_effort_desc: "A nation trapped in ignorance cannot achieve true independence. We will launch a nationwide literacy campaign, illuminating every corner with the light of knowledge. Only when the people can think independently can the country become truly strong and grasp the future with their own hands."
  KOR_guojia_qingbao_bu: "National Intelligence Service"
  KOR_guojia_qingbao_bu_desc: "As a neutral party caught in the middle, we must have the sharpest eyes and ears. We will establish a \"National Intelligence Service\" directly under the supreme leader to monitor any conspiracies at home and abroad that attempt to undermine our neutral status, ensuring absolute national security."
  KOR_bandao_de_dianbo: "Radio Waves of the Peninsula"
  KOR_bandao_de_dianbo_desc: "If we do not occupy the position of propaganda, the enemy will. We will establish a broadcasting network covering the entire peninsula, using our own national voice that transcends left and right to counter ideological noise from the north and south, spreading the ideas of neutrality and autonomy to every Korean."
  KOR_tuanjie_minzu_zichan: "Unite the National Bourgeoisie"
  KOR_tuanjie_minzu_zichan_desc: "At the current stage of extreme poverty and backwardness, the national bourgeoisie is still a constructive force that can be united and utilized. Their capital, technology, and management experience are crucial for restoring and developing the national economy. We will support and guide them to contribute to national prosperity under the banner of patriotism."
  KOR_wenhe_de_tudi_gaige: "Moderate Land Reform"
  KOR_wenhe_de_tudi_gaige_desc: "We advocate achieving \"those who till the land own it\" through peaceful and gradual means. Through government purchase and compensated distribution, land will be gradually transferred to farmers, avoiding drastic social unrest. A moderate land reform can not only realize social justice but also ensure the stability of agricultural production to the maximum extent."
  KOR_fuchi_minzu_qiye: "Support National Enterprises"
  KOR_fuchi_minzu_qiye_desc: "A country without its own national industry can never achieve true independence. The state will vigorously help the development of local enterprises through policy inclinations and funding support, protecting them from the impact of foreign goods. A strong group of national enterprises is the solid foundation of our economic autonomy."
  KOR_nongye_xiandai_hua: "Agricultural Modernization"
  KOR_nongye_xiandai_hua_desc: "Traditional agriculture that relies on the weather must be changed. We will invest funds to build water conservancy projects, promote improved seeds and chemical fertilizers, and introduce modern agricultural machinery. Agricultural modernization can not only ensure national food security but also liberate a large number of rural laborers to be put into industrial construction."
  KOR_guojia_liyi_zhishang: "National Interests First"
  KOR_guojia_liyi_zhishang_desc: "In a complex international environment, our only guiding principle for action is \"National Interests First\". Whether allying with or opposing anyone must serve the supreme interests of the survival and development of our nation. Any ideological dogma cannot override the fundamental interests of our country."
  KOR_yaoqing_sulian_touzizhe: "Invite [SOV.GetAdjective] Investors"
  KOR_yaoqing_sulian_touzizhe_desc: "Our industrialization drive needs external capital and technical support, and our neighboring Soviet Union has a strong heavy industry foundation. Therefore, we have sent a special invitation to the Soviet Union: this is not an ideological alliance but a purely economic cooperation."
  KOR_yaoqing_meiguo_touzizhe: "Invite [USA.GetAdjective] Investors"
  KOR_yaoqing_meiguo_touzizhe_desc: "We open part of the market to Wall Street capitalists, promising to provide them with a stable and profitable investment environment. Their investment will bring us factories, technology, and employment, while they will reap substantial profits. This is a mutually beneficial commercial exchange. We will remain vigilant to ensure that the country's economic sovereignty will not be damaged in any way, making US capital serve our own purposes."
  KOR_yu_zhongdaozuo_jiemeng: "Alliance with the Leftists"
  KOR_yu_zhongdaozuo_jiemeng_desc: "To establish a coalition government with broad representativeness, we must actively conduct dialogue and cooperation with moderate left-wing socialists. Absorbing them into the government will help us stabilize social order, gain broader public support, and send a signal to our northern neighbor that we are not hostile."
  KOR_forge_a_national_identity: "$ITA_common_ground$"
  KOR_forge_a_national_identity_desc: "Leaning left or turning right will drag us into the abyss of proxy wars. Our only stance is \"nationality\". On the basis of this consensus, we will unite all patriotic forces, bridge internal divisions, and strive for a complete and independent Korea."
  KOR_forge_a_national_identity_tt: "Will be replaced after completing the national policy §Y$KOR_yu_zhongdaozuo_jiemeng$§! or §Y$KOR_tuanjie_minzu_zichan$§!:"
  KOR_xinminzhu_zhuyi_jiaoyu: "New Democratic Education"
  KOR_xinminzhu_zhuyi_jiaoyu_desc: "[GeKOR_xinminzhuzhuyijiaoyu]"
  KOR_xinminzhu_zhuyi_jiaoyu_desc_a: "Our education aims to cultivate a new generation of citizens with national self-esteem and scientific and democratic thinking. We will reform the old education system, eliminate colonial and feudal remnants, and establish a brand-new \"New Democratic\" education that serves the construction of a modern country."
  KOR_xinminzhu_zhuyi_jiaoyu_desc_b: "Our mission and task are to take the idea of autonomy as our guiding ideology and participate in the autonomous cause of the nation and humanity; the current goal is to build an autonomous society and realize the autonomous unification of the country; the ultimate goal is to create a future society where human autonomy, national autonomy, and human autonomy are realized - an autonomous world"
  KOR_baozheng_laogong_quanyi: "Guarantee Labor Rights and Interests"
  KOR_baozheng_laogong_quanyi_desc: "Workers are the main force of national construction, and their rights and interests must be guaranteed. We will legislate to clearly stipulate the minimum wage, maximum working hours, and improve the working environment. A country that respects labor can have the most creative and cohesive working class."
  KOR_jianli_jumin_yibao: "Increase Medical Facilities"
  KOR_jianli_jumin_yibao_desc: "Disease is an important cause of poverty. We will learn from the experience of advanced countries, and increasing facilities in various places will effectively address this situation. Ensuring that everyone can afford medical treatment and receive basic medical security is an important criterion for measuring a country's level of civilization."
  KOR_weisheng_zhufang_jihua: "Health and Housing Policy"
  KOR_weisheng_zhufang_jihua_desc: "A strong country starts with healthy citizens. We will implement a nationwide health and housing policy, fundamentally improving people's living conditions and public health, laying the most solid foundation for people's livelihood for the country's self-improvement and prosperity."
  KOR_xinxing_de_fuli_guojia: "Emerging Welfare State"
  KOR_xinxing_de_fuli_guojia_desc: "The fruits of national development must be shared by all the people. We will establish a social security system covering the entire population, making the welfare of 'from cradle to grave' no longer a distant ideal. A prosperous, stable and happy society will be our strongest weapon against all external interference."
  KOR_yinjin_waiguo_jishu_guwen: "Introduce foreign technical consultants"
  KOR_yinjin_waiguo_jishu_guwen_desc: "Under the principle of independence and self-reliance, we do not exclude learning from the strengths of others. We will selectively hire outstanding technical consultants and experts from all over the world to help us plan industry and train talents. This is the shortcut for us to shorten the technological gap with developed countries at the fastest speed."
  KOR_kexuejishu_xueyuan: "Academy of Science and Technology"
  KOR_kexuejishu_xueyuan_desc: "Science and technology are the primary productive forces. We will pour resources into building a high-level Academy of Science and Technology, making it the 'locomotive' of our national scientific research. It will cultivate top engineers and scientists for our industrialization and lead us towards the goal of becoming a powerful technological nation."
  KOR_gonghui_hefa_hua_tian: "Trade Union Legalization Act"
  KOR_gonghui_hefa_hua_tian_desc: "An independent trade union is an important organization for workers to express their demands and conduct collective negotiations with employers. We will formally recognize the legal status of trade unions through legislation and guarantee their right to operate independently. This is not only a manifestation of protecting labor rights and interests, but also an important part of social democracy."
  KOR_hanjiang_gongyehua: "Han River Industrialization"
  KOR_hanjiang_gongyehua_desc: "Farewell to empty ideological debates, the prosperity of the people is the fundamental. We will concentrate the national strength on the Han River basin to develop export-oriented light and heavy industries. This is not relying on outsiders, but using our own hands to create a 'Han River Miracle' that belongs only to the Korean nation."
  KOR_chengsihua_jincheng: "Urban Investment"
  KOR_chengsihua_jincheng_desc: "$JAP_further_urban_investments_desc$"
  KOR_sikandenaweiya_moshi: "Scandinavian Model"
  KOR_sikandenaweiya_moshi_desc: "The model of the Nordic Scandinavian countries—high welfare, equal distribution of wealth, and stable social democracy—provides us with an extremely attractive development model. We will take this as the goal, find the best balance between market economy and social equity, and build a prosperous, equal and harmonious welfare state."
  KOR_bujiemengyundong_de_xianqu: "Pioneer of the Non-Aligned Movement"
  KOR_bujiemengyundong_de_xianqu_desc: "We refuse to take sides between the United States and the Soviet Union, and we will be the pioneer of the third path. North Korea will actively advocate the concept of 'non-alignment', unite all countries in the world that are unwilling to attach themselves to the two major blocs, and jointly launch a massive 'Non-Aligned Movement' to voice an independent voice on the international stage."

  KOR_mayi_taizai: "Hemp-Clad Crown Prince"
  KOR_mayi_taizai_desc: "According to legend, the Hemp-Clad Crown Prince abandoned the glory of the throne, lived in seclusion in the mountains, and shared hardships with the people. The monarch we will welcome back should also have such a spirit of being close to the people and patriotic. He will be a symbol of national unity, not a high-ranking ruler, which is the cornerstone of our constitutional monarchy system."
  KOR_taolun_guoti_wenti: "Discuss the Issue of National Form"
  KOR_taolun_guoti_wenti_desc: "The future of the country must be decided by all the people together. We will organize a national discussion on the national form, allowing supporters of different schemes such as monarchy and republicanism to fully express their views. Finally, we will choose the political system most suitable for our nation through a national referendum."
  KOR_zujian_zeren_neige: "Form a Responsible Cabinet"
  KOR_zujian_zeren_neige_desc: "The monarch is only a symbol of the country, and the real power to govern should be in the hands of a cabinet composed of elected representatives. We will form a 'Responsible Cabinet' that is accountable to the parliament, not to the monarch. This will fundamentally establish the constitutional monarchy system of 'symbolic monarch and substantive prime minister' and prevent monarchical dictatorship."
  KOR_chongjian_zongqin_fu: "Reconstruct the Royal Clan Court"
  KOR_chongjian_zongqin_fu_desc: "To properly manage royal affairs and demonstrate the distinguished status of the royal family, it is necessary to restore the traditional 'Royal Clan Court'. This institution will be responsible for handling matters such as weddings, funerals, and property management of royal family members, ensuring the dignity of the royal family and strictly distinguishing it from the daily administration of the government."
  KOR_xiandaihua_sifa_tixi: "Modern Judicial System"
  KOR_xiandaihua_sifa_tixi_desc: "The impartiality of the law is the cornerstone of a modern country. We will thoroughly reform the old judicial system, establish independent courts and procuratorates, and establish modern judicial principles such as presumption of innocence and lawyer defense. An independent judicial system free from interference by administrative power will be the last line of defense for protecting citizens' rights."
  KOR_xingzhen_xiaolv_gaige: "Administrative Efficiency Reform"
  KOR_xingzhen_xiaolv_gaige_desc: "A bloated and inefficient bureaucratic apparatus is a huge obstacle to national development. We will launch a profound administrative efficiency reform, streamline institutions, eliminate redundant personnel, and introduce modern management methods. An honest and efficient government can better serve the people and the country."
  KOR_jianli_cishan_jijinhui: "Charity Foundation"
  KOR_jianli_cishan_jijinhui_desc: "The monarch's responsibility lies not only in ruling, but also in setting an example. We will establish a large-scale charity foundation in the name of the royal family to relieve disaster victims, fund education, and support the orphans and widows. This will greatly enhance the royal family's prestige among the people and make it a symbol of uniting and condensing the people's love."
  KOR_zhenya_chifei_panluan: "Suppress the Red Bandit Rebellion"
  KOR_zhenya_chifei_panluan_desc: "The ghost of communism attempts to subvert the hard-won stability we have achieved. We will show no mercy to those 'red bandits' who are instigated by foreign forces and attempt to destroy national order with violence. The army and police will use thunderous means to quickly put out any armed rebellion and safeguard the peace of the empire."
  KOR_zhenya_chifei_panluan_tt: "§YSelecting this national policy will end the $KOR_communism_rebellion_mission$ task.§!"
  KOR_yu_liangban_guizu_hejie: "Reconcile with the Old Yangban Aristocracy"
  KOR_yu_liangban_guizu_hejie_desc: "The old Yangban aristocracy still holds enormous influence and prestige at the local level. Instead of pushing them to the opposite side, it is better to reconcile with them and transform them into supporters of the monarchical system. We will recognize some of their traditional privileges in exchange for their support for the new regime."
  KOR_sheli_guizu_yuan: "Establish the House of Peers"
  KOR_sheli_guizu_yuan_desc: "As a supplement to the elected parliament, we will establish a 'House of Peers' composed of royal family members, representatives of the old aristocracy, and national meritorious personnel. It will become a deliberative body that can provide long-term and calm suggestions, offer valuable experience and wisdom for major national decisions, and prevent the short-sightedness and fanaticism of elected politics."
  KOR_wei_renmin_fuwu_junzhu: "Monarch Serving the People"
  KOR_wei_renmin_fuwu_junzhu_desc: "Our monarch will take 'serving the people' as the highest purpose. He will visit the people, experience their hardships, and become a bridge connecting the government and the people. A monarch image that is deeply rooted in the hearts of the people and shares joys with the people will enable the monarchy to gain the broadest and most lasting popular support and make the royal power eternal."
  KOR_diguo_de_houshe: "Voice of the Dynasty"
  KOR_diguo_de_houshe_desc: "We must establish a propaganda system that can accurately and powerfully convey the voice of the dynasty at home and abroad. Through the national news agency and the Royal Broadcasting Station, we will shape a positive image of the dynasty, guide public opinion, and show the world a united, confident and powerful modern dynasty."
  KOR_xuanbu_diguo_guofangfa: "Enact the National Defense Law"
  KOR_xuanbu_diguo_guofangfa_desc: "The armed forces of the country must be legalized. Enacting a comprehensive 'National Defense Law' will clarify the military's responsibilities, command system, military service system and national defense budget, ensuring that the military operates within the framework of the law. This will be the foundation for building a modern and standardized national defense force."
  KOR_huangjia_jingcha_budui: "Royal Police Force"
  KOR_huangjia_jingcha_budui_desc: "A police force loyal to the monarch and with strict discipline is an important tool for maintaining domestic security and demonstrating the dignity of the royal power. We will establish an elite 'Royal Police Force' that will not only combat crimes, but also be responsible for safeguarding the security of the royal family, becoming a strong backing for the stability of the dynasty."
  KOR_jianli_huangjia_weidui: "Form the 'Imperial Guards' Division"
  KOR_jianli_huangjia_weidui_desc: "There must be an absolutely loyal and most combat-effective elite unit in the army. We will select the best officers and soldiers from the entire army to form the 'Imperial Guards' Division. They will receive the best equipment and training, and will not only be the imperial guards defending the capital and the monarch, but also an indestructible iron fist in our foreign wars."
  KOR_yingdui_beifang_weixie: "Respond to the Northern Threat"
  KOR_yingdui_beifang_weixie_desc: "The communist regime in the north is always our most direct and realistic threat. We must formulate a complete set of response plans, including building solid defensive fortifications on the border, deploying heavy troop groups, and developing weapons capable of strategic deterrence, to ensure that any abnormal movements in the north are under our control."
  KOR_tuidong_kexue_yu_chuantong: "Promote the Integration of Science and Tradition"
  KOR_tuidong_kexue_yu_chuantong_desc: "Modernization does not mean total westernization. While vigorously developing modern science and technology, we will revive and promote the excellent traditional culture of our nation. A country that has high technology and retains elegant traditions will be more charming and cohesive. The integration of science and tradition will be our unique path to becoming a powerful nation."
  KOR_minzu_de_wenhua_fuxing: "Cultural Renaissance of the Empire"
  KOR_minzu_de_wenhua_fuxing_desc: "With the patronage of the royal family, we will launch a profound cultural renaissance movement. Revive court elegant music, reconstruct historical sites, and encourage the creation of traditional art. An empire that is culturally confident and creative can truly win the respect of the world and realize the great rejuvenation of the nation."
  KOR_qingdian_wangshi_caichan: "Inventory Royal Property"
  KOR_qingdian_wangshi_caichan_desc: "The land, artworks and wealth accumulated by the Li Dynasty over hundreds of years are a huge heritage. We will conduct a comprehensive inventory and evaluation of it. This property will be used as the start-up fund of the royal family to invest in national construction and charitable causes, transforming it from 'private property' into a 'public instrument' serving the country."
  KOR_zhenxing_chuantong_shougongye: "Revitalize Traditional Handicrafts"
  KOR_zhenxing_chuantong_shougongye_desc: "Our traditional handicrafts such as celadon, mother-of-pearl lacquerware, and Korean paper are the crystallization of national wisdom. The state will support these endangered handicrafts, help them improve technology and expand markets. This can not only protect our cultural heritage, but also create high-value-added characteristic export industries."
  KOR_wangshi_texu_hui_she: "Royal Chartered Company"
  KOR_wangshi_texu_hui_she_desc: "Drawing on successful historical experience, we will issue 'royal charters' to a small number of powerful enterprises, granting them monopoly operating rights in specific industries. These 'Royal Chartered Companies' will grow rapidly into giant conglomerates capable of participating in international competition with the full support of the state."
  KOR_wangshi_texu_hui_she_tt: "\nThe chartered companies will start constructing buildings in our country"
  KOR_wangshi_dichan_touzi: "Royal Real Estate Investment"
  KOR_wangshi_dichan_touzi_desc: "The royal family will use its vast real estate to carry out modern commercial development. Through cooperation with domestic and foreign capital, building commercial districts, high-end residences and industrial parks, the royal family can not only obtain substantial fiscal revenue, but also effectively promote the country's urbanization and economic development."
  KOR_huangjia_binggong_chang: "Royal Arsenal"
  KOR_huangjia_binggong_chang_desc: "National defense must be independent. We will integrate resources to establish a technologically advanced 'Royal Arsenal' directly controlled by the state. It will be responsible for researching and developing all weapons and ammunition needed by the imperial army, from rifles to heavy artillery, from tanks to fighter planes, ensuring that our army is no longer controlled by others."
  KOR_dongfang_de_jinrong_zhongxin: "Financial Center of the East"
  KOR_dongfang_de_jinrong_zhongxin_desc: "Stable politics, open policies, and superior geographical location—we have all the conditions to become the financial center of the East. We will vigorously develop the banking, securities and insurance industries to attract capital from all over the world to gather here. A strong financial center will be the perpetual motion machine for the economic prosperity of the empire."
  KOR_dongfang_de_jinrong_zhongxin_tt: "\nLock §Y$free_trade$§!, and §Y$economy$§! cannot be replaced!"
  KOR_guotu_fangwei_jun: "Territorial Defense Force"
  KOR_guotu_fangwei_jun_desc: "The primary and even sole responsibility of our army is to defend our sacred territory, not to invade foreign countries. We will establish a lean, efficient 'Territorial Defense Force' specially designed for local defense. Any invader who steps into our territory will face the most resolute and tenacious resistance."
  KOR_guotu_fangwei_jun_tt: "Unlock §YResolution§!, allowing us to train the Territorial Defense Force in peacetime, and deploy the formation directly after we enter §YWar§!."
  KOR_yazhou_zhongli_guojia_huiyi: "Conference of Neutral Asian Nations"
  KOR_yazhou_zhongli_guojia_huiyi_desc: "Under the shadow of great wars, not all Asian countries are willing to take sides. We will initiate the convening of the 'Conference of Neutral Asian Nations', inviting all Asian countries that pursue a neutral and non-aligned policy to participate. We will coordinate our positions together, help each other in difficult times, and safeguard our common independence and peace in the gap between giants."
  KOR_yazhou_zhongli_guojia_huiyi_tt: "When §Yany signatory member§! is attacked, we will create a faction and invite them to join."
  KOR_hepingliyong_heneng_jihua: "Peaceful Use of Nuclear Energy Program"
  KOR_hepingliyong_heneng_jihua_desc: "Atomic energy is the ultimate energy source of the future, and we cannot fall behind. We will launch the 'Peaceful Use of Nuclear Energy Program', and with the help of friendly countries, build our own nuclear reactors for power generation and scientific research. Of course, mastering this technology also means that we are only one step away from having the ultimate deterrent."
  KOR_jishu_hezuo_wangluo: "Technology Cooperation Network"
  KOR_jishu_hezuo_wangluo_desc: "We will establish an extensive international technology cooperation network, not limited by ideology, and carry out cooperation with all countries willing to conduct technical exchanges with us. Through flexible and pragmatic technological diplomacy, we can obtain the knowledge we need from different sources and accelerate our modernization process."
  KOR_suoyou_chengnianren_bingyi: "Reserve Force Training"
  KOR_suoyou_chengnianren_bingyi_desc: "A strong reserve force is the confidence to maintain a small standing army. We will establish a sound reserve force training system, requiring all retired soldiers to return to the military camp every year to receive short-term and high-intensity retraining, ensuring that they can be called up immediately and ready for battle when war breaks out."
  KOR_quanmin_sheji_julebu: "Patriot Shooting Club"
  KOR_quanmin_sheji_julebu_desc: "Integrating the military into the people is the foundation of national defense for all. We will encourage the establishment of 'Patriot Shooting Clubs' nationwide to popularize firearms knowledge and shooting skills among ordinary people. This will greatly enhance the people's national defense awareness and provide a large number of well-trained soldiers for organizing militia and guerrillas in wartime."
  KOR_guojia_ziran_baolei: "Natural Fortress"
  KOR_guojia_ziran_baolei_desc: "More than 70% of the Korean Peninsula is mountainous, which is our natural advantage in resisting foreign enemies. We will invest heavily in building permanent defensive fortifications at major passes, mountains and transportation hubs, turning our entire country into a 'natural fortress' that terrifies any invader."
  KOR_guojia_ziran_baolei_tt: "Add §Y1 $engineer$ battalion§! to the division organization of the Territorial Defense Force!"
  KOR_bao_wei_tiankong: "Defend the Skies"
  KOR_bao_wei_tiankong_desc: "Losing air supremacy, everything on the ground will become a target. We must prioritize the development of our air defense capabilities, establish a three-dimensional air defense network covering the whole country composed of advanced radar, anti-aircraft artillery and fighter planes. Our goal is to prevent any unauthorized aircraft from flying over our airspace."
  KOR_bao_wei_tiankong_tt: "Add §Y1 $anti_air$ battalion§! to the division organization of the Territorial Defense Force!\nThe formation limit of the Territorial Defense Force will be increased by §Y5§!."
  KOR_ciwei_fangyu: "Hedgehog Defense"
  KOR_ciwei_fangyu_desc: "We will put the 'hedgehog' tactic into use to improve our defensive effect in in-depth operations. This tactic mainly involves deploying small units on defensible positions where the enemy may encircle. The highlight is that manipulating these small units can exhaust the enemy's mobility, making them very vulnerable to attack."
  KOR_mushi_zhi_xia: "Beneath Wood and Stone"
  KOR_mushi_zhi_xia_desc: "Faced with the enemy's powerful air superiority, we must learn to hide 'beneath wood and stone'. We will launch a massive project to build a large number of underground bunkers, tunnels and backup command posts across the country. Even if the ground is razed to the ground, we can preserve our strength underground and continue to fight."
  KOR_mushi_zhi_xia_tt: "Add §Y1 $rangers_support$ battalion§! to the division organization of the Territorial Defense Force!"
  KOR_shandi_zuozhan_jingrui: "Mountain Warfare Elite"
  KOR_shandi_zuozhan_jingrui_desc: "The mountains will be our home ground. We will form and train specialized mountain warfare units, equip them with lightweight equipment, and teach them how to survive, maneuver and ambush the enemy in complex terrain. These mountain elites will become our deadliest trump card in local operations."
  KOR_jundui_yu_fangwu: "The Army and the Home"
  KOR_jundui_yu_fangwu_desc: "The army cannot do without the support of the people, and the people also need the protection of the army. We will implement an integrated military-civilian logistics and defense system, where every household may become a supply point, aid station or even a defensive stronghold for the army. The people's houses, together with the army's trenches, will form our impregnable defense line."
  KOR_difang_jingwei: "Local Guards"
  KOR_difang_jingwei_desc: "We will establish a semi-militarized 'Local Guards' force managed by local governments. Composed of local people, they will be responsible for maintaining local public security, guarding important facilities, and cooperating with regular troops in wartime. This force will greatly relieve the pressure on regular troops and become an important part of the national defense system for all."
  KOR_xuanbu_yazhou_de_menluozhuyi: "Announce the Monroe Doctrine of Asia"
  KOR_xuanbu_yazhou_de_menluozhuyi_desc: "Asian affairs should be decided by Asians themselves. We will high-profile announce the 'Monroe Doctrine of Asia', clearly opposing any interference by external forces in Asia's internal affairs. This is not only to protect ourselves, but also to establish our position as the leader of the region."
  KOR_dongfang_junzhu_lianmeng: "Eastern Monarchist Alliance"
  KOR_dongfang_junzhu_lianmeng_desc: "In an era when republican and communist waves sweep across Asia, countries that believe in monarchy must unite. We will initiate the establishment of the 'Eastern Monarchist Alliance', inviting all Asian countries that have retained or restored the monarchy to join. We will jointly defend our ancient traditions and noble systems."
  KOR_dongfang_junzhu_lianmeng_tt: "Unlock the resolution to §Yincite monarchist restoration sentiment§! in §YAsian§! countries!"
  KOR_zhichi_manzhou_huangdi: "Support the Emperor of Manchukuo"
  KOR_zhichi_manzhou_huangdi_desc: "Emperor Puyi of Manchukuo, like us, is a representative of the monarchical system in East Asia. We will secretly provide him with support to help him consolidate his rule and get rid of Japanese control. A friendly and independent Manchu Empire will be our most ideal neighbor and ally in the north."
  KOR_huifu_sanhan_gutu: "Recover the Ancient Lands of the Three Hans"
  KOR_huifu_sanhan_gutu_desc: "According to ancient historical records, the territory of our Three Hans nation was once far more than this small peninsula. Now, it is time to reaffirm our historical sovereignty and claim back those 'ancient lands of the Three Hans' that originally belonged to us from the northern neighbors."
  KOR_cuihui_riben_faxisi: "Eliminate Japanese Fascism"
  KOR_cuihui_riben_faxisi_desc: "Japan's fascist regime is the root of our national suffering and the greatest threat to peace in Asia. We cannot wait for others to liberate us; we must rely on our own strength to take the initiative to attack and completely eliminate Japan's fascist militarism, bringing permanent peace to East Asia."
  KOR_tianming_lianmeng: "Mandate of Heaven Alliance"
  KOR_tianming_lianmeng_desc: "In the East, the 'Mandate of Heaven' is the ultimate source of ruling legitimacy. We will create a 'Mandate of Heaven Alliance', uniting all regimes that believe in or respect the idea of the divine right of kings. In this alliance, we will jointly resist the heresies of atheism and 'public opinion' and defend the sacred monarchical power."
  KOR_tianming_lianmeng_tt: "Unlock the resolution to invite §YAsian monarchist§! countries to join our faction"
  KOR_jurenjian_de_zhouxuan: "Maneuver Between Giants"
  KOR_jurenjian_de_zhouxuan_desc: "As a small country, surviving between the two giants of the United States and the Soviet Union requires superb diplomatic wisdom. We will adopt a flexible balance-of-power diplomacy, sometimes getting close to one side, sometimes alienating the other, using the contradictions between them to strive for the maximum interests and the safest living space for ourselves."
  KOR_yinshi_wangguo_de_yichan: "Legacy of the Hermit Kingdom"
  KOR_yinshi_wangguo_de_yichan_desc: "Our ancestors were once known as the 'Hermit Kingdom', and this isolation and pride can be given new meaning in the new era. We will inherit this legacy and pursue a limited and highly selective policy of opening up to the outside world, only making contact when it is absolutely beneficial to us, so as to protect our independence to the greatest extent."
  KOR_yuandong_maoyi_xieding: "Far East Trade Agreement"
  KOR_yuandong_maoyi_xieding_desc: "A stable Far East needs a prosperous regional trade network. We will initiate the signing of a 'Far East Trade Agreement' to reduce trade barriers between countries in the region and promote the free flow of goods and capital. This will enable us to enter broader markets and deepen economic ties with neighboring countries."
  KOR_yu_xifang_tongshang: "Trade with the West"
  KOR_yu_xifang_tongshang_desc: "Western capital, technology and markets are crucial for our modernization drive. We will put aside ideological prejudices and actively develop trade relations with Western countries such as the United States and Europe. This will bring us much-needed foreign exchange and technology, injecting strong impetus into our economic development."
  KOR_liyong_meisu_maodun: "Exploit US-Soviet Contradictions"
  KOR_liyong_meisu_maodun_desc: "As long as the global confrontation between the United States and the Soviet Union continues for a day, we will have an opportunity to take advantage of it. We will become a shrewd 'middleman', sometimes selling intelligence against the Soviet Union to the United States, and sometimes assuring the Soviet Union that we will not become a US base. By betting on both sides, we will gain double benefits."
  KOR_liyong_meisu_maodun_tt: "Unlock the §YBalance Act§! resolution, which will allow us to strike a balance between appeasing [USA.GetFlag]§Y[USA.GetName]§! and [SOV.GetFlag]§Y[SOV.GetName]§!."
###################  Brown  ##################################################
  KOR_fupi_de_yinying: "Shadow of Restoration"
  KOR_fupi_de_yinying_desc: "The weakness and chaos of the republic have made many people begin to yearn for the old era with order and authority. Beneath the surface, a secret network composed of old aristocrats, military officers and careerists is taking shape. They are eager to welcome back a real monarch to end the chaos with an iron fist. The shadow of restoration is quietly hanging over this land."
  KOR_huang_taizi_huiguo: "Return of the Crown Prince"
  KOR_huang_taizi_huiguo_desc: "His Royal Highness Prince Yi Un, who grew up in Japan, not only has the noble blood of the Li Dynasty, but also understands the way of strengthening the country through modernization. He is the only person who can lead us to carry out a thorough reform. We will secretly arrange for the Crown Prince to return to the country; he will no longer be the dust of history, but will become the master of our nation's future."
  KOR_chongjian_jingfu_gong: "Reconstruct Gyeongbokgung Palace"
  KOR_chongjian_jingfu_gong_desc: "The ruins of Gyeongbokgung Palace symbolize the lost dignity of our nation. We will pour national power into reconstructing this magnificent palace to restore its former glory. This is not only repairing a building, but also declaring to the world that the authority of the monarch will be re-established on this land like this palace."
  KOR_guanghuamen_de_jiamian: "Coronation Under Gwanghwamun"
  KOR_guanghuamen_de_jiamian_desc: "Under the gaze of thousands of people, a grand coronation ceremony integrating traditional majesty and modern style will be held in front of Gwanghwamun. His Royal Highness the Crown Prince will accept the Mandate of Heaven here and officially become the new monarch of the Great Korean Empire. This is not only a ceremony, but also a display of power, announcing the arrival of an era of strongmen."
  KOR_weixin_bianfa: "Meiji-style Reform"
  KOR_weixin_bianfa_desc: "To achieve rapid modernization of the country, we must carry out a top-down 'Meiji-style Reform'. The leader will obtain power beyond the constitution to vigorously promote comprehensive reforms in industrial, social and ideological fields. All old customs and dissenting opinions that hinder the country's strength will be ruthlessly crushed by the iron fist of reform."
  KOR_badao_yixin: "Royal Inspection of the Eight Provinces"   #Eight Provinces as One Heart
  KOR_badao_yixin_desc: "The monarch's authority cannot be confined to the capital alone. Following the example of ancient emperors, the leader will carry out a massive inspection of the eight provinces across the country. This is not only to declare the absolute authority of the central government to local tyrants, but also a journey to spiritually inspire the people. The glory of the empire will spread to every inch of land."
  KOR_badao_yixin_tt: "Unlock resolution: §YRoyal Inspection of the Eight Provinces§!\nAllow us to conduct inspections in the eight provinces nationwide, and add §Y2 $MODIFIER_ADDITIONAL_SLOTS_CAP_DESC$§! at the same time."       
  KOR_yimin_zhuyi_lilun: "One-People Principle Theory"
  KOR_yimin_zhuyi_lilun_desc: "Country, nation, leader—trinity. We will establish the 'One-People Principle' as the only guiding ideology of the country, emphasizing that all citizens are an indivisible whole and must be absolutely united around the sole leader. Any noise of class struggle or individual freedom will be regarded as betrayal of the national whole."
  KOR_dahandiguo_wangshi_xuexiao: "Royal Institute of Technology"
  KOR_dahandiguo_wangshi_xuexiao_desc: "Science is power, and tradition gives direction to power. We will establish a 'Royal Academy of Sciences' directly funded by the royal family, making it the palace of national wisdom. It will not only lead cutting-edge technological research, but also be a symbol of the combination of royal prestige and modern spirit, attracting the best talents at home and abroad to serve the eternal prosperity of the kingdom."
  KOR_xianfeng_qingniantuan: "Vanguard Youth Corps"
  KOR_xianfeng_qingniantuan_desc: "The future of the country must be in the hands of young people with pure ideology and firm will. We will form the 'Vanguard Youth Corps' to conduct strict militarized training and ideological indoctrination for teenagers across the country. They will become the most loyal supporters of the leader and the street iron fist to eliminate dissidents and consolidate rule."
  KOR_sixiang_jiancha_ju: "Ideological Surveillance Bureau"
  KOR_sixiang_jiancha_ju_desc: "Dangerous ideas are more destructive than the enemy's army. We will establish a powerful 'Ideological Surveillance Bureau' responsible for censoring books and newspapers, monitoring communications, and 'preventively' eliminating individuals with 'impure' ideas. For the absolute security of the empire, everyone's mind must be strictly controlled."
  KOR_heyi_she_qingbao: "White-Clad Society"
  KOR_heyi_she_qingbao_desc: "In the shadow of the state, there needs to be a group of absolutely loyal and unscrupulous executors. This 'White-Clad Society', which only takes direct orders from the leader himself, will be composed of the most fanatical and ruthless elements. From secret assassinations to public opinion manipulation, they will use dark means to maintain the leader's bright rule."
  KOR_sixiang_gaizao_ying: "Ideological Reform Camp"
  KOR_sixiang_gaizao_ying_desc: "The poisonous weeds of liberalism and communism are still eroding the minds of our people. We must establish 'Ideological Reform Camps' to gather those poisoned by wrong ideas, help them purify their souls and reshape absolute loyalty to the country and the leader through labor and study. This is not punishment, but salvation for lost lambs."
  KOR_suqing_pai_fa: "Purge the Dregs of the Old Era"
  KOR_suqing_pai_fa_desc: "Weak democrats, corrupt bureaucrats, wavering intellectuals... These dregs of the old era are tumors hindering the rebirth of our nation. A thorough and merciless purge is necessary. Only by eradicating these internal lesions can our country have a pure, healthy and powerful body."
  KOR_suqing_pai_fa_tt: "§R§YCommunist§! and some §YRepublican§! advisors will be removed.§!"
  KOR_huangguo_shiguan: "Imperial National Historical View"
  KOR_huangguo_shiguan_desc: "History is not a pile of objective facts, but a tool for shaping the national soul. We will establish a brand-new 'Imperial National Historical View', explore the greatness and glory of our nation from history, and emphasize our sacred status of being mandated by heaven. The history tampered with and slandered by the enemy must be reshaped to ignite the people's sense of pride and mission."
  KOR_huangguo_shiguan_tt: "§YCho Nam-seon§!, whose effects are\n$MODIFIER_WAR_SUPPORT_FACTOR$: §G+10%§!, $MODIFIER_WEEKLY_CASUALTIES_WAR_SUPPORT$: §G+0.30%§!, $MODIFIER_WEEKLY_CONVOYS_WAR_SUPPORT$: §G+0.30%§!, $MODIFIER_WEEKLY_BOMBING_WAR_SUPPORT$: §G+0.30%§!"
  KOR_da_zongjiao: "State-established Dangun Religion"
  KOR_da_zongjiao_desc: "To unite the people's hearts, we must establish a supreme national belief. Dangun, the ancestor, will no longer be just a myth, but will be revered as the only deity of the state religion, and the leader will be his spokesperson in the world. By establishing the 'State-established Dangun Religion', we will integrate the nation's blood, faith and political authority into one, creating an indestructible spiritual pillar."
  KOR_liyong_qian_rijun_ziyuan: "Utilize Former Japanese Military Resources"
  KOR_liyong_qian_rijun_ziyuan_desc: "Our former oppressors left a large number of weapons, factories and military facilities on our land. Instead of destroying them, it is better to make use of them for our own benefit. We will quickly take over and integrate these valuable military resources as a shortcut for our military expansion and war preparation. The legacy of yesterday's enemy will become the blade of our revenge today."
  KOR_fuchou_zhuyi_jiaoyu: "Revanchist Education"
  KOR_fuchou_zhuyi_jiaoyu_desc: "How can we call ourselves a country if we have not avenged our national humiliation? From primary schools to universities, every classroom will become a hall for inculcating revenge ideology. We must make every child remember the hardships and humiliations we have suffered, and plant the seeds of hatred deeply in their hearts. This hatred will eventually be transformed into infinite power to wash away shame and conquer powerful enemies."
  KOR_junbu_tebie_fa: "Military Special Law"
  KOR_junbu_tebie_fa_desc: "Extraordinary times call for extraordinary measures. For the needs of national general mobilization, we will promulgate the 'Military Special Law', granting the military power beyond government departments to directly allocate resources and intervene in the economy. The country will become a large military camp, where everything serves the war and everything makes way for victory."
  KOR_junbu_tebie_fa_tt: "§RRemove§!§Y$war_economy$§!, gain §Y$national_defense_state$§!"
  KOR_hualang_jingshen_zhuru: "Infuse the Spirit of Hwarang-do"
  KOR_hualang_jingshen_zhuru_desc: "The Hwarang of the Silla era were elite warriors loyal to the country and ready to die. We will revive this ancient warrior spirit and infuse it into the soul of our army. Our soldiers will no longer be ordinary people, but modern Hwarang, who will not hesitate to give their lives for the leader and the empire."
  KOR_baihu_tezhong_budui: "White Tiger Special Forces"
  KOR_baihu_tezhong_budui_desc: "The white tiger is the patron saint of the west, symbolizing warfare and bravery. We will form a special forces unit named after it, who are the elite of the elite and the blade for executing the most dangerous missions such as decapitation, sabotage and infiltration. When the 'White Tiger' is dispatched, it will be the doomsday of the enemy's leaders."
  KOR_shenjijian_hangkongdui: "Divine Machine Arrow Air Corps"
  KOR_shenjijian_hangkongdui_desc: "Our ancestors once used the 'Divine Machine Arrows' to shoot thousands of arrows at once, burning down the enemy army. Today, our air corps will inherit this glorious name. Every fighter plane is a 'Divine Machine Arrow' shot at the enemy formation; they will pour death and flames on our enemies from 10,000 meters high, reproducing the divine power of our ancestors."
  KOR_chongjian_guichuan_jiandui: "Reconstruct the Turtle Ship Fleet"
  KOR_chongjian_guichuan_jiandui_desc: "Admiral Yi Sun-sin's turtle ships were once an indestructible maritime fortress that terrified the Japanese pirates. We will revive the myth of the turtle ship with modern technology. Our new generation of capital ships will have armor and fierce firepower as indestructible as the turtle ship; they will form an invincible fleet to recapture maritime supremacy for the empire."
  KOR_chongjian_guichuan_jiandui_tt: "$ITA_caligulas_pride_dynamic_modifier_tt$\n"
  KOR_huangtu_fangwei_quan: "Imperial Territory Defense Perimeter"
  KOR_huangtu_fangwei_quan_desc: "The sacred territory of the empire shall not be defiled by any petty villains. We will build an 'Imperial Territory Defense Perimeter' hundreds of kilometers deep along the long coastline and land borders, composed of fortresses, artillery batteries, radar and minefields. Any enemy who dares to invade will be completely buried in this death zone before stepping on our land."
  KOR_huangguo_xingwang_zaici_yizhan: "The Empire's Rise or Fall Depends on This Battle"
  KOR_huangguo_xingwang_zaici_yizhan_desc: "The empire's rise or fall depends on this battle! We have no retreat. The country will enter a state of total war, where every factory, every inch of land, and every citizen will become part of the war machine. We will bet the entire fate of the nation to prove to the world who is the final victor mandated by heaven!"
  KOR_huangguo_xingwang_zaici_yizhan_tt: "§RRemove§!§Y$national_defense_state$§!. Gain §Y$totaler_krieg_economy$§!."
  KOR_tudi_huangyou_hua: "Nationalization of Land as Imperial Property"
  KOR_tudi_huangyou_hua_desc: "All under heaven are the monarch's land. To concentrate the country's power to the extreme, we will abolish private ownership of land and announce that the ultimate ownership of all land within the empire belongs to the royal family. This will completely destroy the foundation of local tyrants, allowing the country to uniformly plan and utilize every inch of land with unprecedented efficiency."
  KOR_jianli_diguo_caifa: "Establish Imperial Conglomerates"
  KOR_jianli_diguo_caifa_desc: "Free competition is inefficient and wasteful. The state will personally select the most capable enterprises, grant them the title of 'Imperial Conglomerate' and industry monopoly rights. With the direct support of the royal family, these giant enterprises will become our economic army to conquer the world market, providing an endless driving force for the empire's expansion."
  KOR_huangshi_jingji_tizhi: "Royal Economic System" #Total War Economy
  KOR_huangshi_jingji_tizhi_desc: "The country's economy should be carefully managed like the emperor's private property. We will establish a 'Royal Economic System', with a royal committee composed of the most trusted confidants and experts directly in charge of the country's economic lifeline. From resource allocation to factory production, everything will operate efficiently under the absolute will of the leader."
  KOR_guomin_laodong_shifeng: "National Labor Service"  
  KOR_guomin_laodong_shifeng_desc: "Devoting blood and sweat to the empire is the supreme glory of every citizen. We will implement the 'National Labor Service' system, forcing all adult citizens to participate in state-designated public project construction free of charge every year. With our collective labor, we will build fortresses, dig canals for the empire, and consolidate the foundation for thousands of generations."
  KOR_mmimiwuqi_jihua: "Secret Weapon Program"
  KOR_mmimiwuqi_jihua_desc: "Conventional ways of war are no longer sufficient for us to gain a decisive advantage. We will launch a top-secret weapons research and development program, gathering the empire's top minds to explore beyond-the-era 'decisive weapons' such as atomic energy, long-range rockets, and jet aircraft. When our secret weapons are unveiled, the world will tremble in fear."
  KOR_mmimiwuqi_jihua_tt: "§Y$specialization_nuclear$§!, §Y$specialization_naval$§!, §Y$specialization_air$§!, §Y$specialization_land$§!$ADD_BREAKTHROUGH_PROGRESS_EFFECT_DESC$§G25.00%§!"
  KOR_chongehsn_tianming: "Reaffirm the Mandate of Heaven"
  KOR_chongehsn_tianming_desc: "The Mandate of Heaven has shifted, and the imperial artifacts should be transferred! The decline of China proves that it is no longer worthy of being the holder of the 'Mandate of Heaven'. Our Great Korean Empire, with its pure cultural inheritance and strong reform will, is the true owner of the Mandate of Heaven. We will announce to all the world that the old era has ended, and the new master who rules the world has arrived!"
  KOR_wangdao_tongyu_dongya: "Rule East Asia with the Royal Way"   #Great Korean Concord Association
  KOR_wangdao_tongyu_dongya_desc: "The chaos in East Asia is all due to the loss of the true 'Royal Way' to lead. Our Great Korean Empire will bring order and peace to this land again with its superior culture and benevolent monarch. Our expansion is not a barbaric conquest, but a just act of enlightening the barbarians with the 'Royal Way' and ruling all nations with 'virtuous governance'."
  KOR_bohai_xianmin_de_yiji: "Relics of the Bohai Ancestors"
  KOR_bohai_xianmin_de_yiji_desc: "In the vast snowfields and plains in the north, lie the relics of our Bohai ancestors. That vast land was once the homeland where our ancestors galloped on horses. Now, it is time to follow the footsteps of history to 'recover' those relics that originally belonged to us, and let the glory of our ancestors shine on that lost homeland again."
  KOR_shanhaiguan_zhi_yao: "Gaze from Shanhai Pass"
  KOR_shanhaiguan_zhi_yao_desc: "Standing on the top of Shanhai Pass, the Great Wall is like a dragon winding westward. Outside the pass is our reformed Great Korean state; inside the pass is the Central Plains usurped by pretenders and defiled of imperial artifacts. We are no longer satisfied with being a 'Little China' content to live in a corner. This fleeting glance will turn into our ambition to unify the world, and the next step of the empire will be to march straight in!"
  KOR_shanhaiguan_zhi_yao_tt: "Gain §Y$KOR_ruguan_nanxia$§!, whose effects are:\nAll §YChinese factions§!:\n$MODIFIER_ATTACK_BONUS_AGAINST_A_COUNTRY$:§G+10%§!\n$MODIFIER_DEFENSE_BONUS_AGAINST_A_COUNTRY$:§G+5.0%§!\n\n"
  KOR_chongjian_chaogong_tixi: "Reconstruct the Tributary System"
  KOR_chongjian_chaogong_tixi_desc: "The old tributary system has collapsed with the fall of the Central Plains. Now, we will rebuild a brand-new tributary system centered on our Great Korean Empire and radiating to all seas, based on the 'Royal Way'. All barbarians from all directions should come to pay tribute and declare allegiance, learning the rituals and culture of our dynasty. The order of East Asia will be redefined and maintained by us."
  KOR_wending_zhongyuan: "Contend for the Central Plains"
  KOR_wending_zhongyuan_desc: "Those who usurp the Central Plains are unworthy of their position and have long lost the Mandate of Heaven. The Nine Tripod Cauldrons, symbolizing the power of the world, should no longer be defiled by such petty villains. Our Great Korean Empire, inheriting the legal system of the Ming Dynasty for 300 years, has a strong army and the support of the people. It is time to send troops into the pass and ask about the weight of those Nine Tripod Cauldrons!"
  KOR_jicheng_chongzhen_datong: "Three Hundred Years of Aspiration"
  KOR_jicheng_chongzhen_datong_desc: "Since Emperor Chongzhen committed suicide on Meishan, the scholars of our Eastern Kingdom who uphold Chinese civilization have all wept in their hearts and continued to use his reign title to this day, for nearly 300 years. Three hundred years of perseverance, three hundred years of waiting, all for today. Restoring China and rebuilding the Ming Dynasty is no longer just a slogan, but a sacred aspiration passed down from generation to generation and engraved in the bones of our Korean nation!"
  KOR_jicheng_chongzhen_datong_tt: "\nAll controlled §YChinese regions§!:\nCompliance §G+15%§!, Resistance §G-15%§!"
  KOR_zijincheng_de_longyi: "Dragon Throne in the Forbidden City"
  KOR_zijincheng_de_longyi_desc: "That dragon throne in the center of the Hall of Supreme Harmony in the Forbidden City is the ultimate symbol of power in the world. It is waiting for a master who is truly worthy of it. Our iron hooves will tread all over the Central Plains, and our flag will flutter over the capital. When our monarch sits on that dragon throne, a brand-new Chinese Empire dominated by us will be proclaimed."
  KOR_zijincheng_de_longyi_tt: "We will gain recognition of the §YChinese regions§!"
  KOR_tiansun_minzu_de_shenhua: "Myth of the Heavenly Descendant Nation"
  KOR_tiansun_minzu_de_shenhua_desc: "We are not mere mortals, but descendants of Hwanung, the son of heaven, who descended upon Mount Paektu – the 'Heavenly Son Nation'. Born with a sacred mission to enlighten and rule all peoples on earth, we shall forge this grand national myth, making every citizen firmly believe that our conquest is a right bestowed by heaven, the embodiment of divine will."
  KOR_jiefang_aertai_de_tongbao: "Liberate Our Altaic Kinsmen"
  KOR_jiefang_aertai_de_tongbao_desc: "From the Turks to the Mongols, across the vast Inner Asian steppes, our Altaic-speaking kinsmen are scattered. They are brothers who share a common ancestor with us, yet now groan under alien rule. As the strongest and most advanced among the Altaic nations, we have a sacred duty to liberate these lost brethren, unite them, and restore the glory of our ancestors."
  KOR_jiefang_aertai_de_tongbao_tt: "Unlock the decision §YInfiltrate Altaic Regions§! – local uprisings will erupt to support us when we go to war with §Y[SOV.GetAdjective]§!."
  KOR_tamier_gaoyuan_de_taijiqi: "The Taegeukgi Over the Pamir Plateau"
  KOR_tamier_gaoyuan_de_taijiqi_desc: "Ancient epics and myths all point to the same place – the Pamir Plateau, the roof of the world, which is the cradle of our nation's birth and migration. Our westward advance is not merely conquest, but a journey of seeking our roots. When our Taegeukgi is finally planted on that sacred plateau, the whole world will witness that the Heavenly Son Nation has returned to their original homeland."
  KOR_tamier_gaoyuan_de_taijiqi_tt: "Unlock the decision §YInfiltrate the Pamirs§! – local uprisings will erupt to support us when we go to war with §Y[SOV.GetAdjective]§!."
  KOR_xunfang_bosi_de_biaoqin: "Seek Out Our Persian Cousins"
  KOR_xunfang_bosi_de_biaoqin_desc: "Persian epics record an ancient bond between an exiled Persian prince and a Silla princess. This is not an isolated proof, but evidence of the profound historical ties between our two nations. We shall dispatch diplomatic missions, cross the continent to seek out our 'lost cousins', reconnect this forgotten bloodline, and build a great alliance spanning Asia."
  KOR_jianli_dongfang_shengcun_kongjian: "Eastern Lebensraum"
  KOR_jianli_dongfang_shengcun_kongjian_desc: "Our great nation should no longer be confined to this narrow peninsula. The vast, desolate yet fertile lands of Siberia to the north and Central Asia to the west await a true master. We shall take the sword as the plow, carve out endless 'Eastern Lebensraum' for our people, and ensure the eternal resources and future of our empire for thousands of generations."
  KOR_qiannian_diguo_de_dianli: "Millennium Empire Ceremony"
  KOR_qiannian_diguo_de_dianli_desc: "From Mount Paektu to the Pamirs, from the Arctic Ocean to the Pacific Ocean, the territory of the empire has reached its peak. We shall hold an unprecedented 'Millennium Empire Ceremony' to announce to the world that a great empire destined to last for a thousand years has been born. On this day, all nations shall come to pay homage, the leader shall be crowned, and our glorious history shall turn to its most glorious first page."
  KOR_richuzhidi_de_qingsuan: "Settling Accounts in the Land of the Rising Sun"
  KOR_richuzhidi_de_qingsuan_desc: "Now is the time to settle the decades-long blood debt with our eastern neighbors once and for all. The humiliations we suffered shall be repaid a hundredfold; the blood and tears we shed shall be compensated with their blood. The hour of revenge has come – this time, we shall be the judges, and they shall be the sinners."
  KOR_dongjing_shen_ppan: "Tokyo Trial"
  KOR_dongjing_shen_ppan_desc: "The bench of historical judgment should not be occupied only by Westerners. When our troops set foot on the land of Tokyo, we shall establish our own tribunal, bring all Japanese war criminals to the dock. Under the gaze of the whole world, in the name of the victors, we shall conduct a just 'Tokyo Trial' and seek justice for all oppressed Asian peoples."
  KOR_richuzhidi_de_nvwang: "Queen of the Land of the Rising Sun"
  KOR_richuzhidi_de_nvwang_tt: "Some $INDUSTRIAL_ORG_TOOLTIP_HEADER$ of [JAP.GetAdjective] will become available."
  KOR_richuzhidi_de_nvwang_desc: "To conquer a nation completely lies not only in military force, but also in spirit. We shall support Her Highness Princess Lee Bang-ja, who bears our imperial blood, to wear the crown and become the 'Queen of the Land of the Rising Sun'. A monarch enfeoffed by us shall be an unbreakable yoke for Japan, ensuring its eternal submission to our empire."
  KOR_caidan_tianwai_laike: "Extraterrestrial Visitors"
  KOR_caidan_tianwai_laike_desc: "Our 'Heavenly Son' ancestors have awakened and shall personally guide our scientific research direction. We shall devote all national strength to build a top-level research center around that 'extraterrestrial object', transforming the star technology beyond the times that he brought into the indestructible sword and plow of the empire."
  KOR_tainti_yanjiu_xueyuan: "Astronomical Engineering Research Institute"
  KOR_tainti_yanjiu_xueyuan_desc: "The knowledge of the 'Heavenly Son' has opened the door to the universe for us. We shall establish the 'Astronomical Engineering Research Institute', whose sole goal is to put those profound interstellar navigation theories into practice, and design and build the first interstellar spacecraft belonging to us for the ultimate goal of our empire – returning to the stars and the sea."
  KOR_tainti_yanjiu_xueyuan: "Astronomical Engineering Research Institute"
  KOR_tainti_yanjiu_xueyuan_desc: "The knowledge of the 'Heavenly Son' has opened the door to the universe for us. We shall establish the 'Astronomical Engineering Research Institute', whose sole goal is to put those profound interstellar navigation theories into practice, and design and build the first interstellar spacecraft belonging to us for the ultimate goal of our empire – returning to the stars and the sea."
  KOR_tainti_he_fanyingdui: "Energy from the Stars"
  KOR_tainti_he_fanyingdui_desc: "The 'Heavenly Son' has revealed to us the ultimate mystery of the universe: harnessing a miniature star. We shall build the first 'nuclear reactor', a temple that can safely release this 'energy from the stars'. Infinite power shall be injected into every war machine of the empire, supporting us to march towards our destiny of returning to the stars and the sea."
  KOR_tainti_he_fanyingdui_tt: "Our §YScience Advisors§ will gain better traits"
  KOR_weilai_tanke_guoce: "War Machine: 'Bear Woman'"
  KOR_weilai_tanke_guoce_desc: "With the technology of the 'Heavenly Son' as the core and named after the Mother Earth in the 'Dangun Myth', we shall launch the 'Bear Woman' project. We shall build land cruisers like mobile fortresses, which are impregnable and ferocious in firepower. They shall serve as the absolute core of our army, crushing all enemies who dare to stand in the way of the empire's advance."
  KOR_weilai_tanke_guoce_tt: "\nAllow the organization of §Y$KOR_huopaoyunbingche_ying_tech$§!"
  KOR_weilai_zhanshi_guoce: "War Machine: 'Hwanung'"
  KOR_weilai_zhanshi_guoce_desc: "When the 'Heavenly Son' descends to the mortal world, he must have divine power. We shall use genetic enhancement to strengthen soldiers' physiques and equip them with the newly developed 'Hwanung' type power armor. This armor shall endow soldiers with superhuman strength and protection, making them invincible divine soldiers on the battlefield. One 'Hwanung' warrior is enough to match a company of mortal troops."
  KOR_weilai_zhanshi_guoce_tt: "\nAllow the organization of §Y$KOR_donglijia_ying_tech$§!"
  KOR_weilai_zhandouji: "War Machine: 'Hwanin'"
  KOR_weilai_zhandouji_desc: "In the name of the Heavenly Emperor, dominate the sky. We shall integrate the aerospace technology of the 'Heavenly Son' to develop the 'Hwanin' type supersonic air superiority fighter. It shall possess unparalleled speed and maneuverability, like the spear of the Heavenly Emperor, tearing through the enemy's firmament and clearing all threats from the sky for our army and navy."
  KOR_women_de_mubiao_shi_xingchen_dahai: "Call of the Starry Sky"
  KOR_women_de_mubiao_shi_xingchen_dahai_desc: "When our conquest on Earth has reached perfection, and there is no inch of land left where destiny extends, we hear the call from the boundless starry sky. Our journey should not stop at this small blue planet. We shall devote all national strength to develop aerospace technology, turning our gaze to the Moon, Mars and even deeper space. The stars and the sea are the ultimate destination of our Heavenly Son Nation!"
  KOR_women_de_mubiao_shi_xingchen_dahai_tt: "We shall be known as §Ythe Unified Human Wisdom State of Hwan§!"
##Military
  #######################################################################################################################################################################
  KOR_junshi_qiansan_yu_zhengbian: "Demobilization and Restructuring"
  KOR_junshi_qiansan_yu_zhengbian_desc: "Post-liberation Korea is filled with various armed groups. We must quickly carry out unified demobilization and restructuring of these stragglers and factional armed forces, select loyal and reliable personnel from them, and eliminate the black sheep. Only in this way can we build a national defense force that truly belongs to the country and is under unified command."
  KOR_junshi_lujun_xueyuan: "Establish Army Non-Commissioned Officer Academy"
  KOR_junshi_lujun_xueyuan_desc: "An army without qualified officers is nothing but a mob. We shall establish a modern Army Non-Commissioned Officer Academy to systematically cultivate young officers with patriotic sentiment, professional literacy and command ability. They shall become the steel backbone of our army in the future."
  KOR_junshi_huishou_zhuangbei: "Recover Enemy Equipment"
  KOR_junshi_huishou_zhuangbei_desc: "The fleeing enemy left a large amount of weapons and ammunition on our land. These are valuable resources that can be put to immediate use. We shall organize forces to conduct a thorough search of all abandoned military camps and warehouses, recover all usable equipment to arm our newly established army."
  KOR_junshi_huishou_zhuangbei_tt: "§Y1§ random Army Commander will gain §Y$scavenger$§!：\n-$MODIFIER_EQUIPMENT_CAPTURE_FACTOR$：§G+3%§! "
  KOR_junshi_lujun_wuqiguanlibu: "Army Weapons Management Department"
  KOR_junshi_lujun_wuqiguanlibu_desc: "A hodgepodge of weapon models has brought a huge disaster to our logistics. The establishment of the 'Army Weapons Management Department' aims to conduct unified registration, standardized transformation and maintenance of existing equipment, and formulate standards for the future localization of weapons. Let every gun of ours receive the best care."
  KOR_junshi_zongjie_kangri_jingyan: "Summarize Anti-Japanese War Experience"
  KOR_junshi_zongjie_kangri_jingyan_desc: "In the long-term anti-Japanese struggle, our ancestors accumulated rich experience in guerrilla warfare and mountain warfare. We must systematically summarize these valuable practical experiences, compile them into volumes, and incorporate them into our army's combat regulations and training programs, making them our unique magic weapon for defeating enemies and winning battles."
  KOR_junshi_zongjie_kangri_jingyan_tt: "§YAll Army Commanders§!：\n  Increase Planning Skill：§G1§!：\n  Increase Logistics Skill：§G1§!"
  KOR_junshi_dongji_zhanzheng: "Winter War"
  KOR_junshi_dongji_zhanzheng_desc: "The winter on the Korean Peninsula is bitterly cold, which is a huge test for the army's combat capability. We shall specially strengthen the army's winter combat training, and develop and distribute special cold-proof equipment. We shall not only adapt to the severe cold, but also make use of it, turning the cold winter into a white tomb where all invading enemies are buried."
  KOR_junshi_kaifa_zhiming_wuqi: "Develop Lethal Infantry Equipment"
  KOR_junshi_kaifa_zhiming_wuqi_desc: "In the case of insufficient tanks and heavy artillery, infantry firepower is crucial. We shall concentrate resources to develop a series of cheap yet lethal infantry support weapons such as submachine guns, light machine guns and mortars, arming each of our infantry squads into a mobile fire fortress."
  KOR_junshi_jidong_bubing: "Silver Wheel Division"
  KOR_junshi_jidong_bubing_desc: "In an era when motorization is not yet popular, bicycles are the best choice for rapid infantry mobility. We shall form the 'Silver Wheel Division' with bicycles as the main means of transportation. They shall intersperse into the enemy's flanks and rear at a speed far exceeding that of infantry, rolling out the road to victory for us with silver wheels."
  KOR_junshi_houqin_yunshu_qianghua: "Logistics Transportation Enhancement"
  KOR_junshi_houqin_yunshu_qianghua_desc: "Amateurs fight wars for firepower; professionals fight wars for logistics. We shall invest heavily in building a modern logistics system, purchase more trucks, establish an efficient supply station network, and cultivate professional logistics management talents. A strong logistics system is the lifeline supporting the expedition of our large army."
  KOR_junshi_touzi_qiche_chanye: "Invest in the Automobile Industry"
  KOR_junshi_touzi_qiche_chanye_desc: "The motorization of the army cannot do without a strong domestic automobile industry. We shall invest heavily in the automobile manufacturing industry, not only for civilian use, but also to produce our own military trucks, jeeps and even armored vehicles. Having our own wheels allows our army to run faster and farther."
  KOR_junshi_gaijin_yunshuxian: "Improve Production Lines"
  KOR_junshi_gaijin_yunshuxian_desc: "While the quality of weapons is important, quantity is also a key factor in determining the outcome of a war. We shall introduce advanced management methods and production technologies to comprehensively improve the backward production lines of our arsenals, producing more and better weapons in a shorter time and at a lower cost."
  KOR_junshi_feiduicheng_zhanzheng: "The Power of Soldiers"
  KOR_junshi_feiduicheng_zhanzheng_desc: "In the end, it is people who determine the outcome of a war. We shall strengthen the ideological and political education of soldiers, improve their food standards and welfare benefits, and carry out harsh realistic training. A soldier with high morale, firm beliefs and a strong physique is far more powerful than any advanced weapon."
  KOR_junshi_shen_wadong: "Dig Deep Tunnels"
  KOR_junshi_shen_wadong_desc: "Faced with the enemy's powerful artillery and air superiority, we must shift our defensive fortifications underground. Mobilize soldiers and civilians to 'dig deep tunnels and stockpile ample grain' in important strategic areas, building a huge tunnel network that can hide troops, store grain and even set up underground factories. Let our positions become an indestructible underground Great Wall for the enemy."
  KOR_junshi_dihou_shentou: "Behind-the-Lines Infiltration"
  KOR_junshi_dihou_shentou_desc: "War is not only fought on the front line. We shall train and dispatch elite small units to infiltrate behind enemy lines to carry out tasks such as destroying traffic lines, assassinating important targets, and inciting local resistance. Disintegrating the enemy from within is sometimes more effective than thousands of troops on the front line."
  KOR_junshi_dihou_shentou_tt: "§YTwo§ random Army Commanders will gain §Y$guerilla_fighter$§!：\n-$MODIFIER_DIG_IN_SPEED_FACTOR$：§G+50%§! "
  KOR_junshi_renhai_zhanshu: "Human Wave Tactics"
  KOR_junshi_renhai_zhanshu_desc: "When at a disadvantage in equipment, our greatest advantage is our endless soldiers with firm will. We shall adopt the 'Human Wave Tactics', using wave after wave of charges to exhaust the enemy's ammunition and break their will. In the face of our revolutionary torrent, any solid position shall be submerged."
  KOR_junshi_youshi_huoli: "Superior Firepower"
  KOR_junshi_youshi_huoli_desc: "Flesh and blood should no longer be used to confront steel head-on. We shall embrace the 'Superior Firepower' doctrine, emphasizing that in any battle, we must concentrate artillery and air power several times that of the enemy. With absolute fire superiority, we shall completely tip the scales of victory to our side."
  KOR_junshi_zhuangjia_yanjiu: "Armored Research"
  KOR_junshi_zhuangjia_yanjiu_desc: "Tanks are the kings of land warfare, and we must have our own armored forces. We shall launch a tank research program, starting with copying foreign models, gradually exploring and accumulating experience, and ultimately designing and manufacturing our own 'kings of land warfare' adapted to our terrain and tactics."
  KOR_junshi_paobing_yanjiu: "Artillery Enhancement"
  KOR_junshi_paobing_yanjiu_desc: "We shall further strengthen the core position of artillery in the army. We shall not only increase the number of various types of artillery, but also vigorously develop advanced technologies such as rocket artillery and self-propelled artillery, and establish a fast and accurate artillery reconnaissance and command system. Our artillery shall become the gods dominating the battlefield."
  KOR_junshi_lubing_jixiehua: "Infantry Mechanization"
  KOR_junshi_lubing_jixiehua_desc: "The era of infantry relying on 'iron feet' must end. We shall equip infantry divisions with a large number of trucks, half-track vehicles and even armored personnel carriers to realize infantry mechanization. This shall greatly improve the strategic mobility of our army, enabling us to appear at any key point on the battlefield at lightning speed."
  KOR_junshi_lubing_jixiehua_tt: "Activate §YWhite Tiger Armored Vehicle§! with the following effects：\n§Y$armored_car$§! and §Y$armored_car_recon$§!：\n  Armor Attack：§G+10%§!\n  Armor Penetration Depth：§G+10%§!\n  Organization：§G+5§!\n  Suppression：§G+0.5§!\n\n§Y$armored_car$§!：\n  Defense：§G+20§!\n  Organization：§G+10§!\n§YForests：§!\n  Movement Modifier Change：§G+15%§!\n  Attack Modifier Change：§G+20%§!\n§YDeserts：§!\n  Movement Modifier Change：§R-40%§!\n  Attack Modifier Change：§R-20%§!\n§YSnow：§!\n  Movement Modifier Change：§G+35%§!\n  Attack Modifier Change：§G+20%§!\n§YPlains：§!\n  Movement Modifier Change：§G+20%§!\n  Attack Modifier Change：§G+20%§!\n§YCities：§!\n  Movement Modifier Change：§G+10%§!\n  Attack Modifier Change：§G+15%§!"
  KOR_junshi_xiandai_lujun: "Modern Army"
  KOR_junshi_xiandai_lujun_desc: "After a series of reforms, training and expansion, our army has been completely transformed. With reasonable organization, sophisticated equipment, scientific doctrines and high morale, it is no longer the army with 'millet plus rifles', but a powerful force truly capable of winning modern wars."
  KOR_junshi_jieguan_feiji: "Take Over Old Japanese Aircraft"
  KOR_junshi_jieguan_feiji_desc: "The enemy left a large number of aircraft at airports, though outdated in models, they are the first valuable asset for us to build an air force. We shall quickly take over these aircraft, repair the usable ones, and dismantle the damaged ones for spare parts. Our sky shall take off from the wreckage of these 'Zero' and 'Hayabusa' fighters."
  KOR_junshi_tebie_xingdong_bu: "Special Operations Command"
  KOR_junshi_tebie_xingdong_bu_desc: "To unify the command and coordination of elite special forces of the army, navy and air force, we shall establish an inter-service 'Special Operations Command'. From behind-the-lines infiltration to hostage rescue, from strategic reconnaissance to counter-terrorism operations, this command shall become the sharpest and most mysterious blade in our hands."
  KOR_junshi_fangkong: "Air Defense"
  KOR_junshi_fangkong_desc: "Protecting our cities and factories from enemy aircraft bombing is the top priority of national defense. We shall vigorously develop various types of anti-aircraft artillery, deploy them around all important strategic targets, and build an initial air defense fire network. Any enemy aircraft that dares to intrude at low altitude shall pay the price for it."
  KOR_junshi_leida_yanjiu: "Radar Research"
  KOR_junshi_leida_yanjiu_desc: "Eyes that see a thousand miles and ears that hear the wind are prerequisites for winning air battles. We shall invest resources to launch radar technology research. Mastering this 'magic' that allows us to detect enemy aircraft hundreds of kilometers away as early as possible shall ensure that we always take the initiative in future air battles."
  KOR_junshi_jianshe_jichang: "Air Force Base Construction"
  KOR_junshi_jianshe_jichang_desc: "Eagles need strong nests. We shall carry out a nationwide air force base construction plan, building modern air force bases with long runways, solid hangars and complete logistics facilities. These bases shall be the take-off platforms for our future air power to march towards victory."
  KOR_junshi_hangkong_gongye_mengya: "Sprout of the Aviation Industry"
  KOR_junshi_hangkong_gongye_mengya_desc: "We cannot rely on imported aircraft forever. We shall start with producing basic components such as fuselages, propellers and landing gear to gradually establish our own aviation industry. Though only a sprout, this is the first step of the long march for us to ultimately manufacture advanced fighter jets independently."
  KOR_junshi_waiguo_hangkong: "Foreign Design Licenses"
  KOR_junshi_waiguo_hangkong_desc: "Before being able to design aircraft independently, purchasing foreign production licenses is the most pragmatic choice. By introducing and copying mature models tested in actual combat, we can equip our air force with the lowest risk and fastest speed, and learn valuable manufacturing experience in the process."
  KOR_junshi_jianli_hangkongxueyue: "Establish Aviation Academy"
  KOR_junshi_jianli_hangkongxueyue_desc: "The training cycle for pilots is long and expensive. We shall establish a formal Aviation Academy to systematically cultivate professional air force talents such as pilots, navigators and mechanics. This place shall become the cradle of our future 'knights of the air', providing a steady stream of fresh blood for our air force."
  KOR_junshi_cezhong_zhandouji: "Air Superiority"
  KOR_junshi_cezhong_zhandouji_desc: "Controlling the sky means controlling the initiative of the war. We shall take seizing and maintaining 'air superiority' as the primary task of the air force, focus on developing high-performance fighter jets, and formulate proactive air combat tactics. Our goal is that no enemy aircraft can fly freely in the sky over our battlefield."
  KOR_junshi_cezhong_zhiyuan: "Ground Support"
  KOR_junshi_cezhong_zhiyuan_desc: "The air force is not only for knightly duels in the sky, but should also become the 'flying artillery' of the army. We shall vigorously develop dive bombers and attack aircraft, and establish an efficient air-ground coordinated combat system, using precise bombs and rockets to clear all obstacles on the advance path of our ground forces."
  KOR_junshi_cezhong_hongzha: "Long-Range Projection"
  KOR_junshi_cezhong_hongzha_desc: "The best defense is offense. We shall develop and equip long-range strategic bombers capable of flying thousands of kilometers. With this 'long-range projection' capability, we can directly bring the war to the enemy's homeland, destroy their industrial bases and war potential, and win the war from the root."
  KOR_junshi_cezhong_haijun_hongzha: "Naval Aviation"
  KOR_junshi_cezhong_haijun_hongzha_desc: "The primary goal of our military aircraft is to help ensure the safety of our naval and civilian ships and protect them on their routes. Therefore, it is important to design aircraft with support for the navy and patrol roles in mind, and ensure they can avoid being shot down by ship-borne anti-aircraft artillery."
  KOR_junshi_huojian_gongcheng: "Heat-Seeking Missiles"
  KOR_junshi_huojian_gongcheng_desc: "The Ordnance Commission has made significant progress in the research and development of guided weapons. They are about to achieve a breakthrough in free-fall, infrared-guided, gyro-stabilized missile technology, which is designed to be deployed by aircraft to attack ship targets."
  KOR_junshi_penqishi_feiji_yanjiu: "Jet Aircraft Research"
  KOR_junshi_penqishi_feiji_yanjiu_desc: "The era of propellers is coming to an end, and the jet age has arrived. We must not fall behind in this technological revolution. We shall immediately launch a jet aircraft research program, even if it means huge investment, to ensure that we can be among the first countries to master this weapon of the future."
  KOR_junshi_xiandai_kongjun: "Modern Air Force"
  KOR_junshi_xiandai_kongjun_desc: "Starting from scratch, our air force has grown into an awesome force. With jet fighters, strategic bombers, a complete radar early warning network and well-trained pilots, it has become a modern air force capable of defending territorial air, supporting the army and navy, and conducting strategic strikes against enemies."
  KOR_junshi_haijun_kaiduan: "Establish Navy"
  KOR_junshi_haijun_kaiduan_desc: "As a country surrounded by sea on three sides, there is no national defense without a navy. We shall officially form our own navy based on several captured small vessels. Though weak at present, this navy carries our blue dream of marching towards the ocean and defending maritime territories."
  KOR_junshi_jianli_haijun_luzhandui: "Establish Marine Corps"
  KOR_junshi_jianli_haijun_luzhandui_desc: "If we hope to establish overseas influence, we need to form a Marine Corps, the 'Naval Commando Force', which is capable of daring maritime invasions and breaking through enemy coastal defenses."
  KOR_junshi_kuojian_xiulimatou: "Expand Repair Docks"
  KOR_junshi_kuojian_xiulimatou_desc: "Warships fight at sea, but their vitality depends on repair docks on shore. We shall invest heavily to expand our naval repair facilities, increase the number of dry docks, and stockpile sufficient spare parts. An efficient maintenance system can keep our fleet in the best combat readiness at all times."
  KOR_junshi_shangchuandui: "Merchant Marine"
  KOR_junshi_shangchuandui_desc: "In peacetime, the merchant marine is the lifeline connecting us to the world and conducting trade; in wartime, they are our valuable reserve transportation force. We shall vigorously support the domestic shipping industry and build a large modern merchant marine. These ships flying the Taegeukgi shall provide solid guarantee for our economy and national defense."
  KOR_junshi_haianpaobing_zhendi: "Coastal Artillery Positions"
  KOR_junshi_haianpaobing_zhendi_desc: "In the early stage when our navy is not yet strong, solid coastal artillery is the most effective means to resist enemy maritime invasion. We shall build concealed and solid artillery positions in all important ports and landing points, deploying large-caliber coastal defense guns. Any enemy warship that dares to approach our coast shall enter our lethal range."
  KOR_junshi_gaizhuang_minyong_zaoju: "Modify Civilian Vessels"
  KOR_junshi_gaizhuang_minyong_zaoju_desc: "The potential of war lies in the people. We shall formulate an emergency plan to quickly requisition and modify civilian ships and vehicles in wartime. Fishing boats can be converted into patrol boats, and merchant ships can be converted into auxiliary cruisers or troop transport ships. This 'combination of military and civilian' approach can rapidly expand our military strength at the lowest cost."
  KOR_junshi_jieguan_jianchuan: "Take Over Colonial Ports and Vessels"
  KOR_junshi_jieguan_jianchuan_desc: "When the colonists withdrew, they left a large number of port facilities and some outdated vessels. These are the first pot of gold for us to build a navy. We shall immediately send personnel to take over all ports and repair all usable vessels. Though old, they shall become the first training ships of our Naval Academy."
  KOR_junshi_jieguan_jianchuan_tt: "Some remaining vessels of Japanese colonists shall become operational after §Yrepair§!."
  KOR_junshi_pingrang_jidi: "Pyongyang Naval Base"
  KOR_junshi_pingrang_jidi_desc: "To defend our west coast and the capital circle, we must build a modern naval base near the mouth of the Taedong River in Pyongyang. This place shall not only become the home port of our West Sea Fleet, but also have complete maintenance and supply facilities, serving as our strategic fulcrum for holding the Yellow Sea."
  KOR_junshi_fushan_jidi: "Busan Naval Base"
  KOR_junshi_fushan_jidi_desc: "Busan Port is our gateway to the Pacific Ocean and our most important trading port. We shall build our largest and most advanced naval base here. It shall serve as the home port of our main fleet, radiate the Korea Strait and the East China Sea, and be the cornerstone for us to march towards the open ocean and become a maritime power."
  KOR_junshi_jinhai_fangyu: "Coastal Defense"
  KOR_junshi_jinhai_fangyu_desc: "When lacking strength, focusing on coastal defense is the most pragmatic choice. We shall focus on developing light naval vessels suitable for coastal operations such as destroyers, submarines and torpedo boats, and cooperate with naval mines and shore-based aviation to establish an asymmetric defense system of 'air, submarine and fast craft'. Our territorial waters shall become a death trap for the enemy."
  KOR_junshi_shuizhong_bulei: "Maritime Mining Strategy"
  KOR_junshi_shuizhong_bulei_desc: "Although laying naval mines in the ocean will seriously affect the efficiency of our oil transportation. But we must ensure that hostile traffic cannot pass through, making us safer and free from maritime invasion."
  KOR_junshi_shuizhong_bulei_tt: "Unlock the decision：§Y$KOR_mining_the_sea$§!，allowing us to deploy naval mines in §Y$STRATEGICREGION_77$§! and §Y$STRATEGICREGION_79$§!."
  KOR_junshi_yuanyang_haijun: "Dream of a Blue Water Navy"
  KOR_junshi_yuanyang_haijun_desc: "Our gaze should not always stay on the coastline. Having a 'blue water navy' that can gallop on the open ocean, protect our trade lines, and project our national will to the world is our dream of becoming a true world power. Today, we shall launch the grand plan of building aircraft carriers and cruisers, and set sail towards this dream!"
  KOR_junshi_goumai_daguohaijun: "Purchase a Great Power Navy"
  KOR_junshi_goumai_daguohaijun_desc: "Building a powerful navy from scratch takes decades, but the world situation changes rapidly, and we cannot wait that long. Some major powers that are disarming or defeated are eager to sell their outdated warships. We shall seize this opportunity to exchange money for time and purchase a ready-made fleet. Even second-hand steel is enough to make us have an undeniable maritime power in the short term."
  KOR_junshi_goumai_daguohaijun_tt: "Unlock decisions to §Ypurchase old warships§! from major countries and §Yinvite foreign advisors§! to train our navy."
  KOR_junshi_hangmu_zhandouqun: "Research Aircraft Carriers"
  KOR_junshi_hangmu_zhandouqun_desc: "Facts have repeatedly proven that future wars depend to a large extent on air superiority – on land and at sea alike. The significance of an aircraft carrier lies in controlling the sky above enemy ships and sinking them quickly with the posture of divine punishment from heaven."
  KOR_junshi_xiandai_haijun: "Modern Navy"
  KOR_junshi_xiandai_haijun_desc: "After years of investment and construction, our navy has been completely transformed. From coastal defense to open ocean decisive battles, from outdated second-hand warships to aircraft carriers built by ourselves, we have a truly modern navy. This powerful blue fleet shall protect our global trade lines and project the country's will to every corner of the world."
  KOR_junshi_lianhe_hewu_yanfa: "Joint Nuclear Weapons Research Program"
  KOR_junshi_lianhe_hewu_yanfa_desc: "Atomic energy is the ultimate weapon that changes the form of future wars. Relying solely on our own strength, the research and development path will be long and arduous. Therefore, we shall launch a 'Joint Nuclear Weapons Research Program' with allies possessing advanced nuclear technology. By sharing data and exchanging experts, we shall greatly shorten the time to master this ultimate deterrent force and step into the nuclear club in one step."
##Industry
  #######################################################################################################################################################################
  KOR_jingji_qiansan_zhimin_yichan: "Liquidate Colonial Legacy"
  KOR_jingji_qiansan_zhimin_yichan_desc: "Though the colonists have left, the economic shackles they left behind still bind us. Railways, mines, factories... many of the economic lifelines of the country are still in the hands of the capital of the old suzerain state. We must carry out a thorough liquidation, nationalize these colonial legacies, and ensure that the wealth of our country serves only our own people."
  KOR_jingji_laogong_dongyuan: "Labor Mobilization Plan"
  KOR_jingji_laogong_dongyuan_desc: "Our most valuable resource is our hardworking people. To accelerate post-war reconstruction and industrialization, we shall launch a nationwide 'Labor Mobilization Plan', uniformly register, train and allocate labor force, and put them into the most urgently needed construction of reservoirs, railways and factories. We shall lay a solid foundation for the country's future with the hands of the people."
  KOR_jingji_diyige_wunian_jihua: "Five-Year Plan"
  KOR_jingji_diyige_wunian_jihua_desc: "A free market cannot bring national strength. To catch up with world powers in the shortest time, we must switch to an efficient national planned economy. We shall launch the 'Five-Year Plan', concentrate the country's resources, and give priority to the development of heavy industry and defense industry. This is the foundational battle for us to realize industrialization and ensure national independence."
  KOR_jingji_diyige_wunian_jihua_tt: "Five-Year Plan has been established"
  KOR_jingji_xunqiu_guoji_jishu: "Seek International Technical Assistance"
  KOR_jingji_xunqiu_guoji_jishu_desc: "Working behind closed doors cannot realize modernization. We must admit that there is a huge gap between our technology and the world's advanced level. Therefore, we shall actively seek international technical assistance, either through the United Nations or cooperation with friendly major powers. Introducing advanced production lines and sending international students are the only shortcuts for us to accelerate the catch-up and narrow the gap."
  KOR_jingji_xunqiu_guoji_jishu_tt: "Unlock the decision：§YSeek International Technical Assistance§!，allowing us to purchase scientific research technologies from major powers."
  KOR_jingji_qingsuan_jishu: "Liquidate Colonial Technological Monopoly"
  KOR_jingji_qingsuan_jishu_desc: "Our industry has long been stifled by the technological monopoly of colonists. Now is the time to break this shackle. We shall completely liquidate this technological inequality through mandatory technology transfer, cultivating local engineers and other means, so that our own factories can master their core technologies."
  KOR_jingji_fuchi_bentu_qiye: "Support Local Enterprises"
  KOR_jingji_fuchi_bentu_qiye_desc: "Caught between foreign capital and old conglomerates, our own national enterprises struggle to survive. The state shall vigorously support local enterprises through low-interest loans, tax incentives and government orders. Only when thousands of local enterprises grow up can our economy truly achieve independence and self-reliance."
  KOR_wunian_jihua_flag: "Five-Year Plan is in Progress"
  KOR_jingji_beifang_jihua: "Northern Plan"
  KOR_jingji_beifang_jihua_desc: "The northern region has our richest mineral resources and heavy industry foundation. We shall launch the 'Northern Plan', concentrate efforts to develop coal and steel here, and expand large-scale factories. This place shall become the 'heart' of our country's industrialization, providing strong motivation for the modernization of the entire country."
  KOR_jingji_beifang_jihua_tt: "This national focus will lock §Y$KOR_jingji_beifang_jihua$§!; when §Y$KOR_jingji_qianqihua_jihua$§! is completed, §Y$KOR_jingji_nanfang_jihua$§! will be unlocked."
  KOR_jingji_nanfang_jihua: "Southern Plan"
  KOR_jingji_nanfang_jihua_desc: "The southern region has our most fertile plains and busiest ports. We shall launch the 'Southern Plan', focusing on the development of agriculture, fishery and light industry here. A prosperous south shall provide us with sufficient grain and consumer goods, and become our window connecting to world trade."
  KOR_jingji_nanfang_jihua_tt: "This national focus will lock §Y$KOR_jingji_nanfang_jihua$§!; when §Y$KOR_jingji_shuifeng_shuiku$§! is completed, §Y$KOR_jingji_beifang_jihua$§! will be unlocked."
  KOR_jingji_pingan_dao_meitan: "Develop Pyongan Province Coal"
  KOR_jingji_pingan_dao_meitan_desc: "Coal is the 'black gold' of industry, the foundation for driving steam engines and smelting steel. Pyongan Province has our richest coal reserves. We shall invest a huge amount of money, introduce new equipment, and large-scale develop coal mines here. Black coal shall ignite the raging flames of our industrial revolution."
  KOR_jingji_maoshan_tiekuang: "Steel is the Food of Industry" #Develop Musan Iron Mine
  KOR_jingji_maoshan_tiekuang_desc: "Musan in North Hamgyong Province contains the largest open-pit iron ore deposit in Asia, which is the industrial cornerstone bestowed by heaven on our nation. We must not let this huge wealth continue to sleep underground. We shall concentrate the nation's strength to fully develop the Musan Iron Mine. Every ton of iron ore mined here shall become the most solid backbone of our industrialization, injecting steel blood into our future tanks and warships."
  KOR_jingji_qingjin_zonghe_gangchang: "Chongjin Integrated Steel Mill"
  KOR_jingji_qingjin_zonghe_gangchang_desc: "We must have a modern steel base capable of large-scale production of various types of steel. The port city of Chongjin shall be the location of this grand plan. Here, we shall build an integrated steel mill covering ironmaking, steelmaking and steel rolling, which shall become the pride of our national industry."
  KOR_jingji_xingnan_huagongchang: "Hungnam Chemical Plant"
  KOR_jingji_xingnan_huagongchang_desc: "Modern agriculture cannot do without chemical fertilizers, and modern national defense cannot do without explosives. Hungnam, a city with a good industrial foundation, shall become the center of our chemical industry. The large chemical plant built here shall bring the hope of harvest to our fields and provide the decisive power for our army."
  KOR_jingji_qianqihua_jihua: "Electrification Plan"
  KOR_jingji_qianqihua_jihua_desc: "Light is the symbol of modern civilization. We shall launch a national 'Electrification Plan', transmitting electricity from the Supung Reservoir and other power stations to every city, village, factory and household in our country through a dense network of wires. When the peninsula is lit up by thousands of lights at night, a new era shall come."
  KOR_jingji_qianqihua_jihua_tt: "\n§YElectrification will gradually spread outward from [ROOT.Capital.GetCapitalVictoryPointName], with a new core region gaining this modifier every two months.§!"
  KOR_jingji_quanguo_tieluwang: "National Railway Network Plan"
  KOR_jingji_quanguo_tieluwang_desc: "The current railway network of our country is fragmented and cannot meet the needs of a modern country. We shall formulate a new 'National Railway Network Plan', closely connecting all important cities, ports and resource-producing areas with steel sleepers to form the unified main artery of the country."
  KOR_jingji_jingfu_gaosugonglu: "Gyeongbu Expressway"
  KOR_jingji_jingfu_gaosugonglu_desc: "The Gyeongbu Line connecting the capital and Busan, the largest port, is the most important transportation corridor of our country. We shall build our first truly modern expressway here. This flat and wide road shall be the runway for our economic take-off and a glorious symbol of national modernization."
  KOR_jingji_guantong_taibai_shanmai: "Link the Taebaek Mountains"
  KOR_jingji_guantong_taibai_shanmai_desc: "The majestic Taebaek Mountains, though our natural barrier, also hinder transportation between the east and west. We shall organize the best engineers to completely link this natural moat with tunnels and bridges. From then on, the east and west coasts shall no longer be far apart, and the whole country shall be more closely connected."
  KOR_jingji_gongcheng_zhuangju: "Engineering Feats"
  KOR_jingji_gongcheng_zhuangju_desc: "Cross-sea bridges, tunnels through mountains, magnificent river dams... our people shall use their wisdom and sweat to accomplish one seemingly impossible engineering feat after another. These monument-like buildings not only improve our lives, but also prove to the world the great power of our nation to conquer nature."
  KOR_jingji_jinhai_yuye: "Coastal Fishery Development"
  KOR_jingji_jinhai_yuye_desc: "Surrounded by sea on three sides, the ocean is a blue granary that provides us with food. We shall invest heavily in coastal fisheries, provide fishermen with modern fishing boats and fishing technology, and establish a fishery processing industrial chain. Abundant catches can not only improve people's diet, but also earn valuable foreign exchange for us."
  KOR_jingji_fangzhi_gongye: "Invest in Textile Industry"
  KOR_jingji_fangzhi_gongye_desc: "Let everyone wear warm and decent new clothes is our simplest wish. We shall invest heavily in the textile industry, building modern spinning mills and weaving mills. This industry can not only meet the huge domestic demand and provide a large number of jobs, but also become our pillar industry for export earnings."
  KOR_jingji_chukou_renshen: "Ginseng and Tobacco Monopoly"
  KOR_jingji_chukou_renshen_desc: "Korean ginseng and high-quality tobacco are our high-value characteristic products. To firmly grasp the profits of these 'golden crops' in the hands of the state, we shall implement a national monopoly system. The huge profits obtained therefrom shall be invested in the more urgently needed industrial and national defense construction."
  KOR_jingji_nongye_jixiehua: "Rural Mechanization Plan"
  KOR_jingji_nongye_jixiehua_desc: "Relying on cattle and manual labor can never realize the leap of agriculture. We shall launch the 'Rural Mechanization Plan', establish tractor stations, and promote agricultural machinery such as seeders and harvesters to rural areas. The roaring motors shall completely replace the mooing of cattle for thousands of years, liberating our farmers from heavy physical labor"
  KOR_jingji_shuifeng_shuiku: "Hydropower Dam"
  KOR_jingji_shuifeng_shuiku_desc: "Without intervention, Korea's industrialization and electrification process will come to an abrupt halt. We should build a new gravity dam in this area, and engineers from the Han River Hydropower Company have formulated a detailed plan for the project named Hwacheon Dam."
  KOR_jingji_jingji_qiji: "Economic Miracle"
  KOR_jingji_jingji_qiji_desc: "On the ruins of war, relying on the hard work, wisdom and firm will of our people, we have completed the industrialization path that Western countries took hundreds of years to walk in just a few decades. High-rise buildings stand in great numbers, traffic flows in an endless stream, factories roar... We have proved to the world that a poor and backward agricultural country can also create a world-renowned economic miracle!"
  KOR_jingji_jingji_qiji_tt: "Replace §Y$KOR_zmdjjdyc_dabenying_modifiers_1$§! with §Y$KOR_zmdjjdyc_dabenying_modifiers_2$§!, with the following effect changes："