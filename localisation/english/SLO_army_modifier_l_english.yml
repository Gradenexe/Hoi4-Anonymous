 SLO_electro_western_slovakia:0 "Electrify Western Slovakia"
 SLO_electro_western_slovakia_desc:0 "The industrial heartland around Bratislava demands a reliable power supply. A coordinated electrification effort in the west will keep factories running day and night."

 SLO_electro_eastern_slovakia:0 "Electrify Eastern Slovakia"
 SLO_electro_eastern_slovakia_desc:0 "The eastern regions have long lagged behind in infrastructure. Bringing electricity to the east will open the door to industrial growth far from the capital."

 SLO_electro_southern_slovakia:0 "Electrify Southern Slovakia"
 SLO_electro_southern_slovakia_desc:0 "The fertile southern lowlands need power just as much as any factory town. Rural electrification here will modernize agriculture and daily life alike."

 SLO_electro_further_eastern_slovakia:0 "Electrify Carpathian Ruthenia"
 SLO_electro_further_eastern_slovakia_desc:0 "The far eastern reaches of the republic remain the least developed of all. Extending the power grid this far will bind the region more closely to the rest of Slovakia."