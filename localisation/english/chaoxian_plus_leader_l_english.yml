  #######  配件  #######
  ##飞机
  KOR_changpaoguan_zidongpao: "Single Long-Barrel Autocannon"
  KOR_changpaoguan_zidongpao_desc: "This is a single aircraft autocannon with an extended barrel, designed to increase projectile muzzle velocity and effective range, specifically for attacking bombers or ground armored targets."
  KOR_shuanglian_zidongpao: "Twin Autocannon"
  KOR_shuanglian_zidongpao_desc: "By paralleling two autocannons, this weapon configuration aims to significantly increase the ammunition delivery rate per unit time, thereby improving hit rate and damage efficiency."
  KOR_jiguangpao: "Single Laser Cannon"
  KOR_jiguangpao_desc: "This is an airborne directed energy weapon that achieves precise strikes by emitting high-energy laser beams. Its main disadvantage is the need for a huge energy supply."
  KOR_diyudaji_daodan: "Hellstrike Missile"
  KOR_diyudaji_daodan_desc: "This is an air-to-ground missile equipped with a large-yield incendiary or thermobaric warhead, used to cause devastating strikes on large-area target regions."
  KOR_denglizi_chongya_yinqing: "Plasma Ramjet Engine"
  KOR_denglizi_chongya_yinqing_desc: "This is an advanced ramjet engine that ionizes high-speed incoming air into plasma for ejection to achieve efficient propulsion at hypersonic speeds."
  KOR_gaochuli_wolun_yinqing: "High-Output Turbine Engine"
  KOR_gaochuli_wolun_yinqing_desc: "This is a turbine engine designed for ultimate performance, achieving higher unit thrust output by increasing internal operating temperature and pressure."
  KOR_kongkong_leida: "Air-to-Air Avionics System"
  KOR_kongkong_leida_desc: "This is an electronic device integrating radar, fire control, and target recognition, used to improve the aircraft's target detection capability and weapon guidance accuracy in air combat."
  ##坦克
  KOR_juxing_jianongpao: "Giant Battle Cannon"
  KOR_juxing_jianongpao_desc: "This is an experimental extra-large caliber tank gun. It sacrifices mobility and reliability in exchange for extreme damage efficiency against heavily armored targets."
  KOR_tongzhou_zidongpao: "Coaxial Autocannon"
  KOR_tongzhou_zidongpao_desc: "A rapid-fire weapon mounted coaxially with the main gun, mainly used to suppress enemy infantry or respond to light armored targets, providing close-range fire support for the main gun."
  KOR_gongchengzhe_jiupao: "Destroyer Siege Mortar"
  KOR_gongchengzhe_jiupao_desc: "This is a large-caliber curved-fire mortar mounted on a vehicle chassis, specially designed to destroy strong defensive fortifications, with extremely high damage efficiency against static targets."
  KOR_paota_jiguang_pao: "Turret Laser Cannon"
  KOR_paota_jiguang_pao_desc: "A turret-mounted directed energy weapon. It penetrates armor by emitting high-energy laser beams with extremely high precision, but requires huge power consumption."
  KOR_shuanglian_baoshi_qiang: "Twin Heavy Bolter"
  KOR_shuanglian_baoshi_qiang_desc: "This is a twin automatic weapon that can efficiently kill infantry clusters and suppress light targets by firing small explosive ammunition at high speed."
  tank_fanyingdui_fadongji: "Thermal Combustion Chamber Reactor Engine"
  tank_fanyingdui_fadongji_desc: "This is an advanced hybrid power system that integrates a small reactor with a thermal combustion chamber, which can dynamically adjust power output according to combat needs to balance energy consumption and performance."
