  KOR_huopaoyunbingche_tech: "War Machine: 'Ungnyeo'"
  KOR_huopaoyunbingche_tech_desc: "They are truly mobile fortresses, and the firepower released by all eleven guns of various types is unattainable by an armored company or an infantry company. Infantry and small creatures are wiped out by volleys of bolter fire and high-explosive shells, giant beasts and armored vehicles struggle to withstand the salvo of venom cannons and laser cannons, and those fortifications that consider themselves impregnable will eventually be destroyed with one shot by the destroyer mortar, leaving only rubble to tell the lesson of arrogant underestimation of the enemy."
