l_english:
  ##################################
  ### 介绍
  ##################################
  KOR_GATHERING_STORM_DESC: "Five thousand years of civilization have nurtured a bright galaxy on this land known as the 'Three Thousand Li of Beautiful Rivers and Mountains'. However, since the Gengxu National Humiliation, the shadow of the Empire has loomed over this land for twenty-six years. The iron fist of the Governor-General's Office, the wave of Japanization, the gradually forgotten language and depleted resources, are like an endless winter. Now, the world is changing, the Empire's war on the mainland is becoming increasingly tight, and war clouds are also gathering in distant Europe. Opportunities and dangers coexist, and a profound question is placed before everyone: choose to stay under the Empire's wing, exchange obedience for the fruits and order of modernization, become a model of 'Internal Korea-Japan Integration', and seek survival and development in the cracks? Or choose to ignite the underground flames, follow in the footsteps of the ancestors, and embark on a thorny and bloody road to regain true independence and glory? These three thousand li of rivers and mountains stand quietly at the crossroads of fate, waiting for their people to make a choice."
  ##################################
  ### 开局ai
  ##################################
  JKO_AI_BEHAVIOR: "@JKO Governor-General of Korea"
  RULE_OPTION_HISTORICAL_JKO_AI_DESC: "The AI of the Governor-General of Korea will follow the historical event chain as much as possible."
  RULE_OPTION_ARMED_RESISTANCE: "Armed Uprising"
  RULE_OPTION_ARMED_RESISTANCE_JKO_AI_DESC: "The AI of the Governor-General of Korea will attempt to resist Japanese colonialists." 
  KOR_AI_BEHAVIOR: "@KOR Korea"
  RULE_OPTION_HISTORICAL_KOR_AI_DESC: "The Korean AI will follow the historical event chain as much as possible."
  RULE_OPTION_COMMUNIST_YANANPAI: "Communism — Yan'an Faction Wins"
  RULE_OPTION_COMMUNIST_YANANPAI_KOR_AI_DESC: "The Korean AI moves towards communism through a consultative conference, and ultimately the Yan'an Faction wins the election successfully." 
  RULE_OPTION_COMMUNIST_NANLAOPAI: "Communism — South Labor Faction Wins"
  RULE_OPTION_COMMUNIST_NANLAOPAI_KOR_AI_DESC: "The Korean AI moves towards communism through a consultative conference, and ultimately the South Labor Faction wins the election successfully." 
  RULE_OPTION_COMMUNIST_MANZHOUPAI: "Communism — Manchurian Faction Wins"
  RULE_OPTION_COMMUNIST_MANZHOUPAI_KOR_AI_DESC: "The Korean AI moves towards communism through a consultative conference, and ultimately the Manchurian Faction wins the election successfully." 
  RULE_OPTION_COMMUNIST_SULIANPAI: "Communism — Soviet Faction Wins"
  RULE_OPTION_COMMUNIST_SULIANPAI_KOR_AI_DESC: "The Korean AI moves towards communism through a consultative conference, and ultimately the Soviet Faction wins the election successfully." 
  RULE_OPTION_DEMOCRATIC_JINJIU: "Democratism — Democratic Left Wing Wins"
  RULE_OPTION_DEMOCRATIC_JINJIU_KOR_AI_DESC: "The Korean AI's Democratic Left Wing wins through the consultative conference, reconciling communists to become the vanguard of colonial liberation." 
  RULE_OPTION_DEMOCRATIC_LICHENGWAN: "Democratism — Democratic Right Wing Wins"
  RULE_OPTION_DEMOCRATIC_LICHENGWAN_KOR_AI_DESC: "The Korean AI's Democratic Right Wing wins through the consultative conference, purges the Provisional Government and communists, and ultimately dominates Asian hegemony." 
  RULE_OPTION_NEUTRALITY_LVYUNHENG: "Neutralism — Neutral Left Wing Wins"
  RULE_OPTION_NEUTRALITY_LVYUNHENG_KOR_AI_DESC: "The Korean AI's Neutral Left Wing wins through the consultative conference, invites Democrats and communists to join the parliament, and signs a non-aggression pact with neutral Asian countries to avoid the country falling into war." 
  NEUTRALITY_JUNZHULIXIAN: "Neutralism — Constitutional Monarchy Established"
  NEUTRALITY_JUNZHULIXIAN_KOR_AI_DESC: "The Korean AI moves towards constitutional monarchy through a consultative conference, invites Asian monarchies, and ultimately dominates Asian hegemony." 
  RULE_OPTION_FASCIST_DAHANDIGUO: "Fascism — Great Korean Empire"
  RULE_OPTION_FASCIST_DAHANDIGUO_KOR_AI_DESC: "The Korean AI's consultative conference breaks down, restores the royal family, claims Dangun Joseon, and ultimately dominates Asian hegemony." 
  RULE_OPTION_EASTER_EGG_ONE: "Christian Catholicism — The Kingdom of God"
  RULE_OPTION_EASTER_EGG_ONE_KOR_AI_DESC: "The Korean AI's Democratic Right Wing wins, the Apostolic Vicar of Seoul comes to power, and ultimately launches a holy war against non-Catholic countries in Asia." 
