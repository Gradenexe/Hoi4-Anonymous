  operation_JKO_sheri_xingdong: "Assassinate $JAP_hirohito$"
  operation_JKO_sheri_xingdong_desc: "Against the backdrop of Japan's annexation of the Korean Peninsula, numerous people with lofty ideals devoted themselves to the cause of national independence and liberation. On January 8, 1932, Lee Bong-chang, a Korean independence activist, threw a grenade at the carriage of Emperor Hirohito of Showa near Sakurada Gate in Tokyo, Japan, in an attempt to assassinate him. Unfortunately, the grenade was insufficient in power and failed to hit the emperor's carriage, and the assassination attempt failed. Lee Bong-chang was arrested on the spot and later sentenced to death. This incident is known as the 'Sakurada Gate Incident', which greatly boosted the morale of resisting Japanese imperialism at that time."
  operation_JKO_sheri_xingdong_1_tt: "We will attempt to assassinate $JAP_hirohito$. However, this operation is extremely risky and may fail."

