  ### 阵营 ##################
  ##################################
  KOR_Asian_Anti_Communist_League: "Asian Anti-Communist League"
  KOR_Asian_Anti_Communist_League_desc: "Faced with the threat of imperialist expansion, no country can stand alone. We must take the initiative to assume regional security responsibilities, unite free countries in Asia, and establish a common defense system of our own, which will become a solid shield against the colonial wave."
  KOR_Asian_Democratic_Alliance: "Asian Democratic Alliance"
  KOR_Asian_Democratic_Alliance_desc: "Democratic countries in Asia need to unite to jointly oppose imperialist expansion and the restoration of authoritarianism. We will initiate the establishment of an 'Asian Democratic Alliance' and invite all Asian countries that believe in freedom and democratic values to join. This alliance will become a strong fortress of the free world in this region."
  KOR_Asian_Defense_Pact: "Asian Defense Pact"
  KOR_Asian_Defense_Pact_desc: "We will coordinate our positions together, stick together for warmth, and safeguard our common independence and peace in the cracks between giants."
  KOR_Asian_Monarchist_United_Front: "Mandate of Heaven Alliance"
  KOR_Asian_Monarchist_United_Front_desc: "In the East, the 'Mandate of Heaven' is the ultimate source of ruling legitimacy. Uniting all regimes that believe in or respect the idea of the divine right of kings, we will jointly resist atheism and the heresy of 'popular will' and defend the sacred monarchical power."
  KOR_wangdao_tongyu_dongya_zhenying: "Greater East Asia Co-Prosperity Sphere (Wangdao Lete)"
  KOR_wangdao_tongyu_dongya_zhenying_desc: "The chaos in East Asia is all due to the loss of the true 'Wangdao (Kingly Way)' leadership. Our Great Korean Empire will bring order and peace to this land again with its superior culture and benevolent monarch. Educate the barbarians with 'Wangdao' and govern all nations with 'benevolent governance'."
  KOR_the_kingdom_of_God: "The Kingdom of God"
  KOR_the_kingdom_of_God_desc: "With the rise of Bishop $JKO_Archbishop_Roh_Paul$ and once again becoming a powerful major force, it is time for us to reach out to all devout Christians, provide them with guidance, just as a shepherd guides his flock and protects them from evil. This is God's command!"
