  ##
  KOR_yananpai_chengyuan: "Yan'an Faction"
  KOR_yananpai_chengyuan_desc: "Refers to a faction within the Workers' Party of Korea in its early days of establishment. Most members of the Yan'an Faction were Koreans who participated in the revolution in Yan'an, the base area of the Communist Party of China, in the 1930s."
  KOR_nanlao_pai: "South Labor Faction"
  KOR_nanlao_pai_desc: "The South Korean Labor Party was a communist political party in the history of the Korean Peninsula. After the founding of the Democratic People's Republic of Korea, it merged into the Workers' Party of Korea, and the faction composed of former members of the South Korean Labor Party was called the Domestic Faction or the South Labor Party Faction."
  KOR_kanglian_junshi: "Guerrilla Faction"
  KOR_kanglian_junshi_desc: "It refers to a faction within the Workers' Party of Korea, the ruling party of the Democratic People's Republic of Korea, after World War II. Most of its members were guerrillas active in Manchukuo and the Soviet Union to oppose Japanese colonial rule over Korea."
  KOR_sulian_pai: "Soviet Faction"
  KOR_sulian_pai_desc: "The Soviet Faction refers to a faction within the Workers' Party of Korea, the ruling party of the Democratic People's Republic of Korea, after World War II. Most of its members were Koreans from the Soviet Union."
  ##
  KOR_huangjia_xuetong: "Noble Bloodline"
  KOR_huangjia_xuetong_desc: "This character is a descendant of the nobles of the Korean Yi Dynasty."
  ##
  KOR_Fear_of_the_investigation_committee: "Fear of the Anti-Traitor Special Committee"
  KOR_Fear_of_the_investigation_committee_desc: "This person is under serious threat of arrest by the Anti-Traitor Special Committee. Fearing charges of being a collaborator with Japan, he cannot perform his duties to the fullest. His personal abilities have been seriously affected."
  KOR_Fear_of_the_investigation_committee_tt: "This trait will not be removed until the §Y$KOR_yongyuan_de_guofu$§! national focus is completed."
