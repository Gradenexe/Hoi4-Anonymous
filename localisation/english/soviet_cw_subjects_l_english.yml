l_english:
 soviet_cw_subjects.1.t:0 "The Soviet Civil War"
 soviet_cw_subjects.1.d:0 "Chaos has erupted in Russia as the Soviet Union splinters in a bitter civil war. The authority of our overlords in Moscow is paralyzed, presenting us with a fateful choice.\n\nShould we seize this opportunity to declare full independence and fight against any Russian dominion? Or should we pick a side in their internal struggle, hoping to secure our position with the victor?"
 soviet_cw_subjects.1.a:0 "We fight for true independence!"
 soviet_cw_subjects.1.b:0 "We will support the Opposition."
 soviet_cw_subjects.1.c:0 "We remain loyal to Moscow."