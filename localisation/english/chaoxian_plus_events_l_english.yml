  KOR_Purchase_weapons.5.t: "[BUL.GetNameDef] Wishes to Order [ROOT.GetAdjective] Warships"
  KOR_Purchase_weapons.5.a_tt: "We will receive §Y1§! off-map §Ycivilian factory§! as compensation for building ships for [BUL.GetAdjective]."
  KOR_Purchase_weapons.6.a_tt: "[FROM.GetNameDef] will build §Y3 submarines§! for the [ROOT.GetAdjective] navy."
  KOR_Purchase_weapons.6.b_tt: "[FROM.GetNameDef] will build §Y2 destroyers§! for the [ROOT.GetAdjective] navy."
  KOR_Purchase_weapons.6.c_tt: "[FROM.GetNameDef] will build §Y1 light cruiser§! for the [ROOT.GetAdjective] navy."
  KOR_Purchase_weapons.5.t: "[From.GetNameDefCap] Wishes to Order [Root.GetAdjective] Warships"
  KOR_Purchase_weapons.5.desc: "The [From.GetAdjective] government, aware of its navy's lack of martial prowess, has proposed purchasing [Root.GetAdjective] warships. If we accept, they will provide the resources needed to achieve our goals."
  KOR_Purchase_weapons.5.a: "We both can benefit from this."
  KOR_Purchase_weapons.5.a_tt: "According to the agreement chosen by [From.GetNameDefCap], we will receive §Y1§! off-map §Ycivilian factory§! as compensation."
  KOR_Purchase_weapons.5.b: "We are not interested."
  KOR_Purchase_weapons.6.t: "[From.GetNameDefCap] Agrees to Build Warships for Us."
  KOR_Purchase_weapons.6.desc: "The [From.GetAdjective] government agrees to build warships for the [Root.GetAdjective] navy. They offer us three options to choose from."
  KOR_Purchase_weapons.6.a: "Purchase submarines."
  KOR_Purchase_weapons.6.b: "Purchase destroyers."
  KOR_Purchase_weapons.6.c: "Purchase a light cruiser."
  KOR_Purchase_weapons.7.t: "[From.GetNameDefCap] Disagrees to Build Warships for Us"
  KOR_Purchase_weapons.7.desc: "[From.GetNameDefCap] has rejected our proposal to purchase warships for the [From.GetNameDefCap] navy.\nWe will have to look for other countries willing to sign contracts, or focus on building our own naval facilities so we don't have to rely on foreign powers to build a powerful [Root.GetAdjective] fleet."
  KOR_Purchase_weapons.7.a: "We can manage without their help."
  KOR_Purchase_weapons.8.t: "Shipbuilding Completed - Submarines"
  KOR_Purchase_weapons.8.desc: "After nearly a year of construction, the 3 [FROM.GetAdjective] submarines we ordered have completed sea trials and are now ready to join the active naval fleet.\nThese ships are docked in [Root.GetAdjective] ports, and their crews await orders."
  KOR_Purchase_weapons.9.t: "Shipbuilding Completed - Destroyers"
  KOR_Purchase_weapons.9.desc: "After nearly a year of construction, the 2 [FROM.GetAdjective] destroyers we ordered have completed sea trials and are now ready to join the active naval fleet.\nThese ships are docked in [Root.GetAdjective] ports, and their crews await orders."
  KOR_Purchase_weapons.10.t: "Shipbuilding Completed - Light Cruiser"
  KOR_Purchase_weapons.10.desc: "After nearly a year of construction, the light cruisers ordered by our country have recently completed sea trials and are now ready to join the navy's service. These warships are currently docked in [Root.GetAdjective] port, and the crews are awaiting orders."
  