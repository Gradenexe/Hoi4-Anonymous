l_english:
  ##################################
  ### 皇民化运动 ###
  ##################################
  JKO_renshi_biandong.1.t: "Ugaki Kazushige Retires"
  JKO_renshi_biandong.1.desc: "General Ugaki Kazushige, after graduating from Kyoto Seijo School, entered the army and enrolled in the Imperial Japanese Army Academy as a sergeant. He graduated from the Army Academy on July 26, 1890 (Meiji 23), ranking 11th out of 150 students, and was commissioned as a second lieutenant in the Imperial Japanese Army Infantry on March 24, 1891 (Meiji 24). He changed his name to Ugaki Kazushige in 1896 (Meiji 29). In 1900 (Meiji 33), he graduated from the Army War College, ranking 3rd out of 39 students, and was awarded the Imperial Gifted Sword. In 1927 (Showa 2), he served as acting Governor-General of Korea. In 1929 (Showa 4), he again held the position of Minister of the Army in Hamaguchi Osachi's cabinet, but was forced to resign in 1931 due to the March Incident. In 1936 (Showa 11), he once more became Governor-General of Korea, advocating "Naisen Yugo" (Integration of Japan and Korea) and implementing the Kominka Movement (Japanization Movement)."
  JKO_renshi_biandong.1.a: "It's time for a change"
  JKO_renshi_biandong.2.t: "The Emperor's "Imperial Visit""
  JKO_renshi_biandong.2.desc: "To demonstrate the authority of the Empire, the Japanese Imperial Household Ministry has announced that Emperor Hirohito will soon embark on another "royal tour" across the country. The entire route from Tokyo to Osaka has been placed under the highest security level by the Japanese military. The tour aims to show the world the stability of the Greater East Asia Co-Prosperity Sphere. \n\n However, the Emperor’s travel plans have also presented a once-in-a-lifetime opportunity for Korean independence activists lurking in the shadows. They regard Hirohito as the embodiment of Japanese militarism and the root of colonial oppression. A bold assassination plan is being secretly hatched, determined to deal the Empire a devastating blow wherever the Emperor passes."
  JKO_renshi_biandong.2.a: "Reenact the Sakurada Gate Incident!"
  JKO_renshi_biandong.4.t: "Eternal Youth and Glory"
  JKO_renshi_biandong.4.desc: "Zhao Yiman's escape plan failed due to betrayal by a traitor, and she fell into the hands of the Japanese invaders once again. Faced with the enemy's final attempt to force her to surrender, she chose to defend her beliefs and dignity with her life, heroically sacrificing herself in the bitter cold wind of northern China. Although the hero's body fell, her unyielding spirit turned into a flag, forever fluttering over the black soil of Northeast China. Her sacrifice ignited the anger of revenge in the hearts of the people, and countless anti-Japanese soldiers would charge at the invaders with her name on their lips, launching more violent attacks until they were completely driven out."
  JKO_renshi_biandong.4.a: "Understood"
  JKO_renshi_biandong.5.t: "The Return of the White Horse"
  JKO_renshi_biandong.5.desc: "After months of cruel torture, Zhao Yiman's revolutionary will remained as firm as steel. Taking advantage of a momentary lapse in the enemy's vigilance, and with the secret assistance of patriots, she miraculously escaped from the heavily guarded Japanese military hospital. Despite being seriously injured, she crossed the enemy's numerous blockades and finally successfully returned to the embrace of the Northeast Anti-Japanese United Army. Her return was like a shot in the arm, greatly boosting the morale of all soldiers. This female hero of the Changbai Mountains and Heilongjiang rivers would continue to fight for national independence and freedom."
  JKO_renshi_biandong.5.a: "Unexpected."
  ########################################################################################################################################
  JKO_huangminhua_event.1.t: "Encouraging Results"
  JKO_huangminhua_event.1.desc: "An inspiring report was submitted to the Governor-General's Office. The report showed that since we vigorously promoted the Kominka Movement, the social outlook has taken on a completely new look. In cities, more and more families take pride in using the “national language” (Japanese), and children sing ballads in fluent Japanese on the streets; in rural areas, the number of people visiting Shinto shrines has steadily increased, and the people are “voluntarily” integrating their old religious habits with State Shinto. Many enlightened gentry and intellectuals have set an example for ordinary people to follow the “correct” path.\n\nThe report concluded: "We are on the right path, and given time, the people on this land will surely become truly loyal and reliable subjects of the Empire from the bottom of their hearts.""
  JKO_huangminhua_event.1.a: "Excellent"
  JKO_huangminhua_event.2.t: "Stagnation"
  JKO_huangminhua_event.2.desc: "The latest assessment report on the Kominka Movement is filled with frustrating bureaucratic jargon. The report points out that although the decrees have been issued, all policies have encountered “passive resistance” in implementation. The people speak Japanese in public, but still use Korean at home and in private; they bow at Shinto shrines as required, but there is not a trace of piety in their eyes.\n\nThe entire society shows a strange inertia—they do not openly oppose, but never truly accept. Like water, they flow around the stones of policy without changing their essence. The conclusion of the report is: without stronger measures, the Kominka Movement will remain only on paper, meaningless."
  JKO_huangminhua_event.2.a: "Let it be"
  JKO_huangminhua_event.3.t: "The Kominka Movement is Resisted!"
  JKO_huangminhua_event.3.desc: "An urgent report from the Tokko (Special Higher Police) warns that the Kominka Movement is triggering strong backlash! In recent weeks, destructive resistance activities have occurred everywhere. In Pyongyang's schools, students have been arrested for refusing to recite "Kimigayo" (the Japanese national anthem); on Busan's docks, propaganda posters printed with "Naisen Ittai" (Japan and Korea as One) have been defaced with the slogan "Drive out the Japanese pirates"; in the night of Keijo (Seoul), someone even wrote "Recover our language and names" on the walls with blood."
  JKO_huangminhua_event.3.a: "A bunch of unruly people"
  JKO_huangminhua_event.4.t: "Underground Korean Schools"
  JKO_huangminhua_event.4.desc: "A report from the Tokko reveals a disturbing trend. After we explicitly banned the use of Korean in public education, some dismissed teachers, stubborn nationalist scholars, and patriotic students have secretly set up "underground Korean schools" everywhere. These so-called "schools" are disguised in urban attics, cellars, or remote farmhouses in the countryside. The report warns that these underground schools are becoming "incubators" of anti-Japanese thought and "recruiting grounds" for resistance organizations. Merely controlling the above-ground education system is far from enough—the memory and soul of this nation are tenaciously persisting like weeds in the dark corners we cannot see. We must take action to completely stamp out these sparks before they ignite a prairie fire."
  JKO_huangminhua_event.4.a: "Severely suppress them!"
  JKO_huangminhua_event.4.b: "Let them be!"
  JKO_huangminhua_event.5.t: "Great Success of the Sōshi-kaimei Policy"
  JKO_huangminhua_event.5.desc: "A victory report! Since the promulgation of the Sōshi-kaimei Ordinance (Name Change Order), we have achieved brilliant results far exceeding expectations. In Keijo (Seoul), the old aristocracy led by the Yi royal family and the newly promoted pro-Japanese elites took the lead in responding, setting an example of "adapting to the times" for the general public. Their actions quickly spread across the peninsula through newspapers and radio, forming a strong demonstration effect. From cities to villages, people flocked to the household registration offices to change their surnames, and many families even took pride in obtaining a "shi" (clan name) that harmonized with prominent Japanese clans. This is not just a change of names, but a transformation of thinking. Facts have proven that the people of the peninsula are wise and sensible, and they are actively embracing the bright future of "Naisen Ittai" (Japan and Korea as One)."
  JKO_huangminhua_event.5.a: "A historic integration!"
  JKO_huangminhua_event.6.t: "Modest Results of the Sōshi-kaimei Policy"
  JKO_huangminhua_event.6.desc: "The report on the implementation of the Sōshi-kaimei policy has been released, with mixed results. In urban areas, most government employees, merchants, and students have completed the name change out of consideration for practical interests. For them, it is just a "ticket" necessary to obtain better jobs, education, and ration opportunities. However, in the vast rural areas where traditional thinking and clan power are strong, the implementation of the decree has encountered enormous invisible resistance. Farmers passively delayed with various excuses such as illiteracy, lack of understanding, and inability to find good names. The decree has achieved partial success in form, but has had little effect in truly shaking the internal identity of this nation. We have changed their registry, but failed to change their hearts."
  JKO_huangminhua_event.6.a: "A complicated situation."
  JKO_huangminhua_event.7.t: "Little Response to the Sōshi-kaimei Policy"
  JKO_huangminhua_event.7.desc: "An enraging report! The implementation of the Sōshi-kaimei Ordinance has suffered a disastrous failure. Household registration offices everywhere are deserted, and our officials are faced with a high wall built of silence, contempt, and non-cooperation. For a nation with ancestor worship as its core tradition and surnames as the foundation of life, changing surnames is widely regarded as an unforgivable betrayal and spiritual death. Many people would rather give up their jobs, lose their rations, and even risk harassment by the police than change the surnames passed down by their ancestors. This policy aimed at erasing their identity has instead unprecedentedly stimulated their national identity. Not only have we failed to assimilate them, but we have also pushed countless moderates to the side of resistance organizations."
  JKO_huangminhua_event.7.a: "Unshakable traditions...."

  JKO_huangminhua_event.8.t: "[JKO.GetNameDef] Power Subversion Against [KOR.GetAdjective]"
  JKO_huangminhua_event.8.desc: "We have received successive reports that the Italians are spreading falsehoods in our rear areas, intending to weaken our rule and discredit our legitimacy. These vicious lies may turn our people toward [JKO.GetNameDef], and the legitimacy of the peninsula will be further questioned. It is imperative to restore absolute rule over the Korean Peninsula before they cause further harm."
  JKO_huangminhua_event.8.a: "They will pay for their lies!"
  ########################################################################################################################################
  JKO_duli_yundong_event.1.t: "Printing Underground Publications"
  JKO_duli_yundong_event.1.desc: "A report from our comrades shows that our propaganda work has made significant progress! The secretly printed "Independence News" is flowing like blood in the underground veins of this land. Although the paper is rough and the ink pungent, it carries the language and soul of our nation, a torch lit only for our own people in the dark night. In Seoul's teahouses and Busan's docks, people secretly circulate this tabloid at great risk. It exposes the lies of the "holy war", publishes banned national poems, and allows compatriots who feel lonely in the dark to see the spark of hope again. The transmission of each copy of "Independence News" is a silent demonstration; every word read is a bullet shot at the enemy's ideological defense line."
  JKO_duli_yundong_event.1.a: "Excellent!"
  JKO_duli_yundong_event.2.t: "Korea's Envoys"
  JKO_duli_yundong_event.2.desc: "An unexpected diplomatic note was placed on our desk. A secret delegation claiming to represent the “Provisional Government of the Republic of Korea” successfully bypassed Japan's strict surveillance and contacted our diplomats in Geneva.\n\nThey presented a blood letter detailing Japan's colonial atrocities, and citing the lofty principle of national self-determination of the League of Nations, begged us to speak up for them at the League Assembly, publicly condemn Japan, and recognize the legitimacy of their independence cause.\n\nThis is an extremely tricky dilemma: supporting them means we will defend the ideals of the League, but will completely anger the powerful Japanese Empire, bringing unpredictable risks to the Far East; refusing them means acquiescing to the atrocities, and we will lose the trust of all weak nations in the world. How should we respond to this heavy request from the East?"
  JKO_duli_yundong_event.2.a: "For the interests of the Far East."
  JKO_duli_yundong_event.2.b: "We have no time for them."
  JKO_duli_yundong_event.3.t: "A Miracle in Geneva!"
  JKO_duli_yundong_event.3.desc: "Unbelievable good news! Our envoys have achieved a historic diplomatic breakthrough in Geneva! After the initial cold reception, our tearful accusations unexpectedly gained sympathy and support from several small countries that had also suffered aggression. With their lobbying and strenuous efforts, the League of Nations surprisingly passed a resolution.\n\nAlthough the resolution was cautiously worded, it explicitly "noted the tense situation on the Korean Peninsula" and "recognized the right of all nations to self-determination". This was tantamount to a loud slap in the face to Japan diplomatically! This was not military intervention, but the greatest moral victory we have achieved in our struggle so far. Japan's international prestige was damaged as a result, and some democratic countries began to cast sympathetic glances at us."
  JKO_duli_yundong_event.3.a: "Excellent!"
  JKO_duli_yundong_event.4.t: "[From.GetAdjective] Chooses Silence"
  JKO_duli_yundong_event.4.desc: "A heart-wrenching telegram came from Geneva: our request was rejected. The League of Nations, manipulated by a few major powers, officially dismissed our appeal on the grounds of “non-interference in the internal affairs of member states” to avoid offending Japan, a major member state. They talked empty words about “maintaining stability in the Far East”, but turned a blind eye to the suffering we were enduring.\n\nWestern newspapers had little coverage of this incident, and [From.GetAdjective] chose to remain silent. This painful lesson made us understand a truth: freedom and independence can never be obtained through the charity and sympathy of others. Illusions have been shattered, and now we can only and must rely on the swords and guns in our own hands to win back what rightfully belongs to us."
  JKO_duli_yundong_event.4.a: "Sadly"
  JKO_duli_yundong_event.5.t: "Gunshots at Dawn"
  JKO_duli_yundong_event.5.desc: "As cherry blossoms bloomed in the heart of the Empire, a gunshot pierced the tranquility of dawn. In a carefully planned operation, independence activists from Korea successfully infiltrated near the imperial procession, targeting the supreme symbol of the Japanese Empire—$JAP_hirohito$. In the ensuing chaos, the Emperor was confirmed dead. The news tore through Japan like lightning, plunging the country into unprecedented shock and a power vacuum. The contradictions between the hardline military faction and the government civilian group intensified instantly, undercurrents surged in the streets of Tokyo, and a bloody political purge seemed imminent.\n\nAt the same time, this gunshot also became a beacon igniting the hope of independence on the Korean Peninsula. From Northeast China to Pyongyang, activists of the independence movement saw a once-in-a-lifetime opportunity. Suppressed anger and hope intertwined, and a storm that would determine the nation's fate was about to come. The world watched with bated breath, and the future of the Far East took a fork in the road at this moment."
  JKO_duli_yundong_event.5.a: "Death to the tyrant!"
  JKO_duli_yundong_event.5.b: "The situation in the Far East is about to change."
  JKO_duli_yundong_event.6.t: "Civil War!"
  JKO_duli_yundong_event.8.t: "Arise! You who do not want to be slaves!"
  JKO_duli_yundong_event.9.t: "East Asian National Liberation War"
  JKO_duli_yundong_event.9.desc: "In Keijo (Seoul) under Japanese colonial rule, dozens of armed Korean independence activists launched a desperate raid on the Governor-General of Korea, a symbol of colonial rule. They quickly occupied the broadcasting room and announced the "Declaration of Independence" to the entire peninsula, vowing to "shed the last drop of blood to restore national independence and freedom", calling on all Korean compatriots to rise up and resist, determined to drive the Japanese colonizers out of the peninsula and achieve true national independence for the Korean Peninsula.\n\nOvernight, the long-lost Taegukgi (Korean national flag) was raised over the Governor-General's Office, a symbol of oppression. Although the insurgents were soon counterattacked fiercely by the Japanese army, this brave act was like a prairie fire, igniting the resistance forces hidden everywhere. From Busan to Sinuiju, responding flags rose one after another. The bloody battle for freedom officially began at this moment."
  JKO_duli_yundong_event.9.a: "Drive the Japanese colonizers out of the motherland!"
  JKO_duli_yundong_event.10.t: "[FROM.GetAdjective] Requests Assistance"
  JKO_duli_yundong_event.10.desc: "Recently, independence activists from [FROM.GetAdjective] have come to visit us. They talked about the devastation caused by the tyrannical rule of the Japanese rulers and are prepared to take up arms to resist oppression, hoping that we will provide weapons to help counter the threat of Japanese fascism.\n\nAnti-fascist activists in our army now suggest that we take this opportunity to arm and send volunteers to assist in this conflict, while allowing the government to reasonably deny involvement in this matter at all times."
  JKO_duli_yundong_event.10.a: "We will turn a blind eye to well-equipped volunteers heading to [FROM.GetNonIdeologyName]"
  JKO_duli_yundong_event.10.b: "We cannot interfere"
  JKO_duli_yundong_event.10.c: "Spontaneous participation by the public"
  JKO_duli_yundong_event.11.t: "[FROM.GetAdjective] Refuses to Provide Assistance"
  JKO_duli_yundong_event.11.desc: "Unfortunate news. [FROM.GetAdjective] refuses to send volunteers when our country is in civil war. It seems that if our glorious independence movement turns violent, we will face our tyrannical oppressors alone……"
  JKO_duli_yundong_event.11.a: "We fight alone……"
  JKO_duli_yundong_event.12.t: "[FROM.GetAdjective] Provides Assistance"
  JKO_duli_yundong_event.12.desc: "The [FROM.GetAdjective] government is unwilling to join our war against the tyrant, but the voices of [FROM.GetAdjective] people supporting us are getting louder and louder. Many [FROM.GetAdjective] volunteers have joined our ranks. Although the number is less than we expected, it is still helpful to the threats we face."
  JKO_duli_yundong_event.12.a: "At least they are willing to provide a little help, better than nothing."
  JKO_duli_yundong_event.13.t: "[KOR.GetName] Requests International Mediation"
  JKO_duli_yundong_event.14.t: "The League of Nations Demands Peace"
  JKO_duli_yundong_event.14.desc: "The League of Nations demands that the Empire immediately withdraw its troops from the Korean Peninsula and terminate hostilities with [KOR.GetName]."
  JKO_duli_yundong_event.14.a: "We have to accept, at least for now"
  JKO_duli_yundong_event.14.b: "They dare not do anything."
  JKO_duli_yundong_event.15.t: "[From.GetAdjective] Agrees to a Truce"
  JKO_duli_yundong_event.15.desc: "After the League of Nations Council passed a resolution, the [FROM.GetAdjective] government led by [FROM.GetLeader] finally came to its senses. The ceasefire agreement issued by the League of Nations restored the pre-war national borders. Unfortunately, this agreement does not include any compensation for the additional losses caused to [ROOT.GetName], but at least it gives us time to rebuild the country."
  JKO_duli_yundong_event.15.a: "A victory in a way"
  JKO_duli_yundong_event.16.t: "[FROM.GetName] Defies the League of Nations"
  JKO_duli_yundong_event.16.desc: "Despite war threats from members of the League of Nations Council, [FRON.GetLeader] still intends to destroy [ROOT.GetName]. The Council has demanded that [FROM.GetName] immediately terminate hostilities with [ROOT.GetName], but [FROM.GetName] is extremely arrogant and refuses to comply."
  JKO_duli_yundong_event.16.a: "What's done is done, there's nothing we can do."
  JKO_duli_yundong_event.16.b: "Impose a trade embargo on [From.GetAdjective] until they repent."
  JKO_duli_yundong_event.17.t: "[From.GetAdjective] Embargo"
  JKO_duli_yundong_event.17.desc: "[From.GetAdjective] decided to accept the demands of the League of Nations and impose an embargo on our country in response to our defiance of the League of Nations. [From.GetNameDef] will stop resource trading with our country. We should consider accepting mediation, or abandon the existing international order and seek opportunities with the hostile forces of liberal capitalism."
  JKO_duli_yundong_event.17.a: "White devils!"
  JKO_duli_yundong_event.17.b: "We have to accept, at least for now."
  JKO_duli_yundong_event.18.t: "[From.GetAdjective] Accepts Mediation"
  JKO_duli_yundong_event.18.desc: "The [From.GetAdjective] government has accepted the League of Nations' request to mediate the situation in the Far East."
  JKO_duli_yundong_event.18.a: "Very good, the world is peaceful again."
  JKO_duli_yundong_event.19.t: "Dawn of Recovery"
  JKO_duli_yundong_event.19.desc: "After years of struggle and sacrifice, the spark of freedom finally blazed brightly on the Korean Peninsula. From the guerrillas at the foot of Baekdu Mountain to the resistance organizations on the city streets, countless Korean patriots converged into an unstoppable torrent. As waves of protests swept across the country, Japanese troops stationed everywhere were caught in a vast ocean of people's war.\n\nIn Seoul, insurgent civilians and defected soldiers broke through the final defense line of the Japanese Governor-General of Korea, and the Rising Sun Flag symbolizing decades of colonial rule fell dejectedly. At the same time, in Busan and Pyongyang, heroic soldiers successfully liberated the cities and raised the Taegukgi symbolizing independence on every inch of recovered land. Korea, an independent and sovereign country, was reborn through the baptism of fire and blood."
  JKO_duli_yundong_event.19.a: "Give me liberty or give me death!"
  JKO_duli_yundong_event.22.t: "[KAO.GetAdjective] Demands a Ceasefire"
  JKO_duli_yundong_event.22.desc: "The Korean War has raged for a full year. Despite pouring massive resources into the fight and suffering heavy casualties, the frontlines remain deadlocked, and we have even suffered repeated setbacks. Our ambition to recapture the peninsula now seems unattainable. Just as we grow weary and confused, an unexpected message arrives—the Korean regime that once vowed to drive us out of Asia entirely has taken the initiative to send envoys and express its willingness to negotiate a ceasefire.\n\nCould it be that they are exhausted and truly unable to continue the fight? Or is this a sinister ploy to mislead us and buy time for their next offensive? The cabinet and the military are locked in fierce debate over this question. Regardless, this presents an opportunity to re-evaluate our strategy on the peninsula. Should we accept this ceasefire, if only for the moment, to catch our breath and regroup? Or should we seize this chance to pursue greater gains? What is certain is that we must never let our guard down."
  JKO_duli_yundong_event.22.a: "We must accept it, at least for now."
  JKO_duli_yundong_event.22.b: "They're on the verge of collapse!"
  JKO_duli_yundong_event.22.c: "We demand what is rightfully ours."
  JKO_duli_yundong_event.23.t: "Japan Refuses Our Ceasefire Proposal"
  JKO_duli_yundong_event.23.desc: "Despicable! The Japanese imperialists have rejected our ceasefire initiative aimed at ending the pointless bloodshed! They arrogantly claim that the war will only end if we lay down our arms unconditionally and submit to their rule.\n\nThis stubborn and unyielding rhetoric has completely shattered our illusions of peace. The invaders have never abandoned their vicious ambitions; they seek to crush our national will through a protracted war. If that is the case, we have no other choice but to fight this war of resistance against aggression to the very end! The entire nation is ready for a long war, and we will use our blood and steel to utterly defeat these stubborn enemies!"
  JKO_duli_yundong_event.23.a: "Stubborn invaders!"
  JKO_duli_yundong_event.24.t: "Japan Demands Compensation for a Ceasefire"
  JKO_duli_yundong_event.24.desc: "Our ceasefire initiative has received an outrageous response from Japan: they have the audacity to demand 'war reparations' and 'ceasefire compensation' from us! These bandits not only seek to occupy our homeland but now also want to take advantage of our plight to squeeze the last drop of blood and sweat from our people.\n\nThis is no longer a negotiation—it is blatant extortion and a blatant insult to our national dignity! How can we bear such an affront? Will we choose to swallow our humiliation to secure a fleeting peace, or will we fight these greedy invaders to the death for the sake of our national dignity? This shameful demand will test the wisdom and courage of our leaders."
  JKO_duli_yundong_event.24.a: "If they want war, let it come!"
  JKO_duli_yundong_event.24.b: "A temporary compromise.."
  JKO_duli_yundong_event.25.t: "[?KOR.host_nation.GetAdjective] Mercenary Recruitment"
  JKO_duli_yundong_event.25.desc: "Mercenaries from [?KOR.host_nation.GetAdjective] have arrived one after another, improving the environment for our cause. They will also aid us in the coming battles. Of course, this all comes at a price."
  JKO_duli_yundong_event.25.a: "Our strength grows with each passing day"
  JKO_duli_yundong_event.26.t: "[?KOR.host_nation.GetAdjective] Pilots Answer the Call"
  JKO_duli_yundong_event.26.desc: "We have seen [?KOR.host_nation.GetAdjective] pilots answer our call to assist in our upcoming liberation of the homeland. They bring valuable experience to share with our future pilots."
  JKO_duli_yundong_event.26.a: "We accept all help offered to us"
  JKO_duli_yundong_event.27.t: "A [KOR.GetName] Auxiliary Fleet"
  JKO_duli_yundong_event.27.desc: "Faced with heavy enemy harassment on the seas, we had no choice but to call upon [?KOR.host_nation.GetAdjective] sailors and vessels of all kinds. To our encouragement, patriots have answered. They include retired naval personnel, civilian sailors, young volunteers, and more. All we have are merchant ships gathered from the dilapidated shipyards of [?KOR.host_nation.GetNameDef], yet they risk everything to crew this makeshift fleet."
  JKO_duli_yundong_event.27.a: "Let us hope these ships can still sail..."
  JKO_duli_yundong_event.28.t: "Rifle Shipment Arrives"
  JKO_duli_yundong_event.28.desc: "Rifles purchased from [USA.GetAdjective] manufacturers have been delivered to our forces stationed in [USA.GetAdjective] territory. These new weapons are now being tested at firing ranges and used for training."
  JKO_duli_yundong_event.28.a: "Well worth the cost"
  JKO_duli_yundong_event.29.t: "Support Equipment Arrives"
  JKO_duli_yundong_event.29.desc: "The support equipment we recently purchased for our troops has arrived. Though not the most cutting-edge in the world, it will still provide great assistance to the front lines."
  JKO_duli_yundong_event.29.a: "Every little bit helps"
  JKO_duli_yundong_event.30.t: "Aircraft Arrive"
  JKO_duli_yundong_event.30.desc: "Aircraft bought from the [USA.GetAdjective] Army have been transferred to our army. Though these are older models decommissioned and stored in past years, they are still fully functional. They are now being used to train crews for frontline service."
  JKO_duli_yundong_event.30.a: "Any plane is better than no plane"
  JKO_duli_yundong_event.31.t: "Tanks Arrive"
  JKO_duli_yundong_event.31.desc: "Tanks bought from the [USA.GetAdjective] Army have been transferred to our army. Though these are older models decommissioned and stored in past years, they are still fully functional. They are now being used to train crews for frontline service."
  JKO_duli_yundong_event.31.a: "Any tank is better than no tank"
  JKO_duli_yundong_event.33.t: "Fundraising Campaign"
  JKO_duli_yundong_event.33.desc: "Our recent fundraising campaign has been a tremendous success. Large sums of money from donors around the world have flowed into the treasury of the Provisional Government. It seems many people share our outrage at the occupation of [KOR.GetNameDef]."
  JKO_duli_yundong_event.33.a: "We will never forget their aid to the liberation cause."
  JKO_duli_yundong_event.34.t: "Resistance in [KOR.GetName]"
  JKO_duli_yundong_event.34.desc: "Our army has swept through enemy forces in [KOR.GetAdjective] territory, making it easier for us to impose proper rule. However, we have noticed resistance movements growing in these new territories. The statements made by [KOE.GetLeader] to the League of Nations seem to have inflamed many civilians in our newly acquired lands. Perhaps as long as [KOR.GetAdjective] people exist, resistance groups will continue to stir beneath the nose of our colonial administration."
  JKO_duli_yundong_event.34.a: "They will submit to our rule, one way or another."
  JKO_duli_yundong_event_34_tt: "All controlled §Y[KOR.GetFlag][KOR.GetAdjective]§! states: Compliance: §R-10%§!"
  JKO_duli_yundong_event.35.desc: "Envoys from the Korean Provisional Government have requested military equipment from us. They hope to strengthen their armed forces and resist Japanese aggression. This presents an opportunity for us to gain influence in the Far East. Assisting them aligns with our strategic interests of weakening Japan and expanding the socialist camp. But they are not communists, so we must assess carefully."
  JKO_duli_yundong_event.35.a: "Send them our surplus equipment."
  JKO_duli_yundong_event.36.a: "Excellent, we will make good use of them."
  JKO_duli_yundong_event.37.desc: "The Provisional Government of the Republic of Korea has offered us a team of agents well-versed in local languages and culture, with deep knowledge of the Japanese-occupied zones. These operatives can provide vital intelligence support for our war effort against Japan, especially in infiltration, sabotage and subversion. Although we remain reserved about the Provisional Government’s political influence, this voluntary contribution from the resistance will greatly benefit the Allied victory."
  JKO_duli_yundong_event.37.a: "Splendid!"
  JKO_duli_yundong_event.37.tt: "Gain a local operative with §Y[KOR.GetAdjectiveCap]§! and §Y[JAP.GetAdjectiveCap]§! nationality."
  JKO_duli_yundong_event.38.t: "Region Under Attack"
  JKO_duli_yundong_event.38.desc: "Our soldiers in [FROM.GetName] have reported a large fire there last night. Local fire departments are still fighting the blaze, but they believe it can be contained before the end of the day. Since the fire started in the ordnance storage area, the factory itself has suffered severe damage.\n\nMilitary intelligence has launched an investigation to determine why the fire occurred despite strict security measures. Preliminary evidence suggests this was very likely arson."
  JKO_duli_yundong_event.38.a: "Damn..."
  JKO_duli_yundong_event.39.t: "Attack Successful"
  JKO_duli_yundong_event.39.desc: "Our fighters have successfully launched a series of behind-the-lines attacks against [JAP.GetAdjectiveCap] forces in [FROM.GetName], dealing significant local damage and seizing supplies."
  JKO_duli_yundong_event.39.a: "Good."
  JKO_duli_yundong_event.40.t: "Raid Successful"
  JKO_duli_yundong_event.40.desc: "Our fighters have successfully launched a series of behind-the-lines attacks against [JAP.GetAdjectiveCap] forces in [FROM.GetName], dealing heavy local damage. We captured some of their weapons and ammunition. The equipment may not be of the highest quality, but there is plenty of it."
  JKO_duli_yundong_event.40.a: "Excellent."
  JKO_duli_yundong_event.41.t: "Raid Failed"
  JKO_duli_yundong_event.41.desc: "At dawn this morning, our brave soldiers attacked an enemy arms factory in the occupied zone. But the enemy guards were prepared and fought back. Our forces could not gain the upper hand and had to retreat temporarily."
  JKO_duli_yundong_event.41.a: "Tch...lucky for them..."
  JKO_duli_yundong_event.42.t: "Raid Great Success"
  JKO_duli_yundong_event.42.desc: "Last night, our brave fighters crossed the border and raided the enemy arsenal with lightning speed, seizing a huge amount of weapons. Our men moved so quickly that they left no real evidence. Still, the enemy government angrily accused us of planning and carrying out the attack. Of course, the shiny new rifles in our soldiers’ hands make their suspicions obvious..."
  JKO_duli_yundong_event.42.a: "A full haul!"
  JKO_duli_yundong_event.43.t: "Cairo Conference Convenes"
  JKO_duli_yundong_event.43.desc: "Cairo, December 1, 1943\nAccording to a joint communiqué released today, U.S. President Roosevelt, British Prime Minister Churchill, and Chinese Nationalist Government Chairman Chiang Kai-shek have met in North Africa. The communiqué states that the three Allies will continue the war against Japan until its unconditional surrender.\n\nThe declaration outlines the post-war settlement with Japan, including stripping Japan of all islands occupied in the Pacific since 1914 and returning Manchuria, Taiwan, and the Penghu Islands to the Republic of China. Notably, the declaration addresses the future of Korea. It states: 'The three great powers, mindful of the enslavement of the people of Korea, are determined that in due course Korea shall become free and independent.' Korea’s independence, long resisted by the Korean people against Japanese rule, is greatly encouraged. The conference and its declaration laid the foundation for the post-war restructuring of East Asia."
  JKO_duli_yundong_event.43.a: "For our long cooperation."
  JKO_duli_yundong_event.43.b: "This is troubling."
  JKO_duli_yundong_event.44.t: "Dawn from Cairo"
  JKO_duli_yundong_event.44.desc: "In late 1943, word came from distant Cairo, Egypt, that Allied leaders Roosevelt, Churchill, and Chiang Kai-shek jointly declared that Korea would regain freedom and independence 'in due course' after the war. The Cairo Declaration was like lightning cutting through the long night, instantly igniting hope in the hearts of all Korean patriots.\n\nYet the phrase 'in due course' also raised new doubts. Does it hide complex political rivalry among great powers? How far are we from true independence? Regardless, the declaration has greatly inspired us and shown the world the justice of Korean independence. Now we must seize this historic opportunity and prove with action that we are ready for freedom!"
  JKO_duli_yundong_event.44.a: "We shall wait and see.."
  JKO_duli_yundong_event.45.t: "Independence Under Guardianship?"
  JKO_duli_yundong_event.45.desc: "Before the joy of the Cairo Conference faded, disturbing news emerged from within the Allies. U.S. President Roosevelt proposed that, having long been under Japanese rule, Korea should enter a period of 'international trusteeship' involving the U.S., China, the USSR, and others after the war to 'help' us prepare for full self-government.\n\nThis plan was a cold shower on our desire for immediate independence. To the Korean people, it is no different from replacing one chain with another. Have we fought and died for decades only to switch masters? This 'guardianship' looms like a dark shadow over our path to independence."
  JKO_duli_yundong_event.45.a: "The Korean people will never agree!"
  JKO_duli_yundong_event.45.b: "We have no choice but to accept"
  JKO_duli_yundong_event.45.c: "Lobby against it"
  JKO_duli_yundong_event.46.t: "Allies Abandon International Trusteeship"
  JKO_duli_yundong_event.46.desc: "President Roosevelt’s trusteeship proposal was an open challenge to our national dignity—but we did not yield!\n\nThrough intense diplomacy and lobbying in Washington and elsewhere, our diplomats clearly conveyed to the Allies the Korean people’s determination for genuine independence and rejection of any disguised rule. At last, our tireless efforts paid off! The United States has tentatively agreed to abandon post-war trusteeship for Korea. This is a major diplomatic victory, proving that Korea’s fate will ultimately be in our own hands!"
  JKO_duli_yundong_event.46.a: "A diplomatic victory!"
  JKO_duli_yundong_event.47.t: "Race Against Time"
  JKO_duli_yundong_event.47.desc: "The Allied trusteeship plan betrays our vision of independence. Waiting for their arrival would be inviting wolves into our home. We cannot entrust our nation’s fate to others!\n\nNow we must race against time. Orders have been given: mobilize all our strength to liberate all major cities before Allied advance troops set foot on the peninsula. We must create a fait accompli with actual control and force them to recognize our independence!"
  JKO_duli_yundong_event.47.a: "For the three-thi ri land!"
  JKO_duli_yundong_event.48.t: "Proclamation of the Liberators"
  JKO_duli_yundong_event.48.desc: "When Allied representatives arrived, they found not a Japanese colony, but a land ruled by the Korean people themselves. From Seoul to Pyongyang, our flag flies over every liberated city. Faced with this fait accompli, any talk of 'trusteeship' rings hollow. The bargaining chip is now ours."
  JKO_duli_yundong_event.48.a: "We did it!"
  JKO_duli_yundong_event.49.t: "One Step Too Late"
  JKO_duli_yundong_event.49.desc: "Even as our troops pushed forward, U.S. forces landed at Incheon and quickly seized the south. Now an invisible '38th Parallel' cuts across the center of the peninsula, dividing our homeland. Under the pretense of 'accepting Japanese surrender,' they have established military occupation. A divided future looms ominously over us all."
  JKO_duli_yundong_event.49.a: "We were just too late."
  JKO_duli_yundong_event.50.t: "Fait Accompli"
  JKO_duli_yundong_event.50.desc: "We underestimated the Korean resolve for independence.\n\nWhile we still debated the details of 'trusteeship,' they responded with action. Korean forces swept the peninsula at astonishing speed; major cities changed hands almost overnight. They rejected our 'help' and declared their sovereignty by force.\n\nAt this point, any plan to impose trusteeship would be tantamount to declaring war on a new sovereign nation. This was never our intention. We can only reluctantly acknowledge that Korean independence is a fait accompli."
  JKO_duli_yundong_event.50.a: "Shocking."
  JKO_duli_yundong_event.51.t: "Red Dawn in the North"
  JKO_duli_yundong_event.51.desc: "The Allies have finally imposed their international trusteeship. Yet in the north, our 'comrades'—the Soviet Union—have their own plans. In the territory they occupy, the Red Army quickly installed a communist regime called the 'Korean People's Republic,' placing our northern brethren under their control. They claim this is true people’s liberation.\n\nNow an invisible Iron Curtain has fallen across the peninsula. The dream of a unified, independent Korea fades, replaced by the harsh reality of ideological division."
  JKO_duli_yundong_event.51.a: "Oh...no.."
  ######################################################################################
  KOR_gongye_luxian.1.t: "[FROM.GetNameDef] Seeks Technical Assistance"
  KOR_gongye_luxian.1.desc: "Newly independent Korea has sent us a request for technical procurement. Although their industrial foundation is weak, this is undoubtedly a good business, and it can also expand our influence on the newly born Korean Peninsula."
  KOR_gongye_luxian.1.a: "The advantages outweigh the disadvantages for us"
  KOR_gongye_luxian.1.b: "An excellent strategic opportunity"
  KOR_gongye_luxian.1.c: "An unworthy risk"
  KOR_gongye_luxian.2.t: "[FROM.GetNameDef] Agrees to Technical Assistance"
  KOR_gongye_luxian.2.desc: "[FROM.GetNameDef] has agreed to our request! Although the price is high, this deal has opened a window for the modernization of our country. Our factories and laboratories can finally start researching more advanced equipment. This is the first step towards self-reliance."
  KOR_gongye_luxian.2.a: "Excellent!"
  KOR_gongye_luxian.3.t: "[FROM.GetNameDef] Agrees to Technical Assistance"
  KOR_gongye_luxian.3.desc: "[FROM.GetNameDef]'s response exceeded all our expectations! They not only agreed to the technology sales, but also donated several key blueprints to us free of charge! We will always remember this profound friendship. They are true friends of the Korean people!"
  KOR_gongye_luxian.3.a: "An unexpected friendship!"
  KOR_gongye_luxian.4.t: "[FROM.GetNameDef] Refuses Technical Assistance"
  KOR_gongye_luxian.4.desc: "[FROM.GetNameDef] arrogantly rejected our request—in their eyes, we are perhaps just dust. This taught us a humiliating lesson: we cannot pin the future of the country on the charity of others. From today on, we must rely on our own strength to take a path of independence and self-reliance!"
  KOR_gongye_luxian.4.a: "Awareness of self-reliance"
  KOR_gongye_luxian.5.t: "Five-Year Plan"
  KOR_gongye_luxian.5.desc: "The newly formulated Five-Year Plan outlining how our government will achieve economic growth in the next few years is on the verge of finalization, but there are still significant differences among various departments on the focus of development.\n\nAlthough it is a consensus reached now that heavy industry should be regarded as the development goal, there is still intense discussion on which field the emerging industrial capacity should be invested in.\n\nTo break the deadlock, a decision must be made on this."
  KOR_gongye_luxian.5.a: "Light industry first."
  KOR_gongye_luxian.5.b: "Heavy industry first."
  KOR_gongye_luxian.5.c: "Balanced choice."
  KOR_junshi_luxian.1.t: "The Future of the Military"
  KOR_junshi_luxian.1.desc: "The bell of recovery has rung, but the road to independence is still full of thorns. The warriors who fought for freedom, as well as the armed personnel left over from the old era, are now waiting for the decision of the new government. Their existence is a sharp sword of the newborn republic, and may also be a seed of division."
  KOR_junshi_luxian.1.a: "Disband the troops"
  KOR_junshi_luxian.1.b: "Reorganize the troops"
  KOR_zhengxie_huiyi.1.t: "Dispute over the Venue"
  KOR_zhengxie_huiyi.1.desc: "To draw up a blueprint for our newborn country, it is imperative to convene a National Political Consultative Conference. However, a tricky problem lies before everyone: where should the conference be held? This is not just a choice of location, but a symbol related to the future path of the country.\n\nRepresentatives from the south insist on holding it in Seoul. As the ancient capital for hundreds of years, Seoul is the center of Korean national history and culture. Choosing Seoul means inheriting our long-standing traditions and can unite the forces that expect the country to move forward steadily.\nThe voices from the north tend to Pyongyang. This emerging industrial city was an important base for the resistance struggle, representing transformation and rebirth. Holding the conference in Pyongyang will declare our complete break with the old era and can inspire the people who are eager to build a completely new society.\n\nThis decision will announce the political trend of the new Korea to the world and may permanently change the balance of power within the country. We must make a prudent choice."
  KOR_zhengxie_huiyi.1.a: "Revolutionary Sacred Land——Pyongyang"
  KOR_zhengxie_huiyi.1.b: "Ancient Capital——Seoul"
  KOR_zhengxie_huiyi.2.t: "Wording of the Declaration"
  KOR_zhengxie_huiyi.2.desc: "Every word of the Declaration of Independence, which should have been the cornerstone of uniting the entire nation, has now become the source of division in the drafting committee. Representatives have heatedly debated the specific wording of the declaration, which is related to the fundamental direction of our newborn country.\n\nRadical nationalists and representatives from the north insist on adding this clause. They believe that only by clearly expressing an anti-imperialist stance can we ensure the hard-won independence and avoid Korea becoming a new pawn in the game of great powers.\nSocialists loudly advocate that this should be the foundation of the new Korea. They firmly believe that this is the only way to achieve true equality and get rid of exploitation.\nConservatives, on the other hand, hope to connect with history. They believe that inheriting the legal tradition of the old empire can bring legitimacy to the new government and appease the social classes that are afraid of drastic changes."
  KOR_zhengxie_huiyi.2.a: "Take the socialist path"
  KOR_zhengxie_huiyi.2.b: "Join anti-imperialism"
  KOR_zhengxie_huiyi.2.c: "Emphasize national independence"
  KOR_zhengxie_huiyi.2.d: "Inherit the legal tradition of the Korean Empire"
  KOR_zhengxie_huiyi.3.t: "Protests from the Old Era"
  KOR_zhengxie_huiyi.3.desc: "Just as we are drawing up a blueprint for the future of new Korea, a group of uninvited guests came outside the venue. They are former ministers of the Yi Dynasty and yangban nobles, dressed in old-style official uniforms, holding a joint petition, insisting that the "one person, one vote" voting rule of the new government is irresponsible for the country's future.\n\nIn their view, uneducated civilians and laborers should not have the same right to speak as well-educated scholar-officials. They demand that voting weight be allocated according to property, educational level, or old official rank to ensure that the "elite" can continue to guide the country and prevent the emergence of "mob rule".\n\nTheir protest has triggered a fierce debate among the representatives. Should we choose to appease these old forces representing tradition to maintain stability, or firmly implement the equality principles of the new era? Our decision will directly affect the class foundation and political form of the new country."
  KOR_zhengxie_huiyi.3.a: "Accept the protest"
  KOR_zhengxie_huiyi.3.b: "Negotiate and compromise"
  KOR_zhengxie_huiyi.3.c: "Disperse the protest by force"
  KOR_zhengxie_huiyi.4.t: "Land to the Tiller?"
  KOR_zhengxie_huiyi.4.desc: "Political debates will eventually settle, but what truly supports a country is its people and land. Now, the eyes in the conference room are focused on the most fundamental issue: how to dispose of the farmland once occupied by a small number of landlords and foreign forces?\n\nRadical reformers and peasant representatives demand the implementation of "land to the tiller". They advocate that the land of large landlords should be confiscated without compensation and directly distributed to the peasants who have worked hard on this land for generations. This is a settlement of feudal exploitation and a commitment to laborers.\n\nHowever, moderates and business representatives have issued warnings. They are worried that radical land reform will destroy the country's economic order and trigger severe social unrest. They propose that the government should purchase land from landlords at a fair price with public funds, and then sell or distribute it to peasants at a low price to achieve a smooth transition.\n\nLand is the cornerstone of new Korea. The way we lay this cornerstone will determine the country's future economic structure and social stability."
  KOR_zhengxie_huiyi.4.a: "Distribute all land to the tillers free of charge!"
  KOR_zhengxie_huiyi.4.b: "Moderate redemption"
  KOR_zhengxie_huiyi.4.c: "Establish state farms and carry out distribution gradually"
  KOR_zhengxie_huiyi.4.d: "Protect private property!"
  KOR_zhengxie_huiyi.5.t: "The Economic Engine of the New Country"
  KOR_zhengxie_huiyi.5.desc: "An independent country needs a strong economy as its backing. Now, the smoke of war has not yet cleared, and the dispute over the route of building the national economy has become the focus of the conference. Two completely different paths lie before us.\n\nRepresentatives from the north and some revolutionaries believe that only through a strong national plan can we concentrate all resources to achieve industrialization in the shortest time and build a strong national defense industry. This model will ensure the achievement of national goals, but may come at the cost of sacrificing people's consumption choices and market vitality.\n\nMerchants from the south and some technocrats advocate that we should embrace competition and free markets, and encourage private investment and entrepreneurship. They believe that this will stimulate innovation, bring prosperity, and allow us to integrate into the world trade system faster. But this may also lead to the polarization between the rich and the poor, and make our fragile economy vulnerable to fluctuations in the external market."
  KOR_zhengxie_huiyi.5.a: "Establish a centrally planned economy"
  KOR_zhengxie_huiyi.5.b: "Free market is the only way!"
  KOR_zhengxie_huiyi.5.c: "The state controls the lifeline"
  KOR_zhengxie_huiyi.5.d: "Commercialize the military"
  KOR_zhengxie_huiyi.6.t: "Where Should the Sword Hang"
  KOR_zhengxie_huiyi.6.desc: "Although the gunfire has subsided, those holding the gun are still watching the birth of the new regime. A strong army is the guarantee of national independence, but an unrestrained army is the greatest hidden danger of the country. When constructing the power structure of the new country, we must clarify the ultimate positioning of the army.\n\nThe army must be absolutely loyal to the country and the people, and be placed under the supreme leadership of the civilian government. "The Party commands the gun", not "the gun commands the Party". This is the only way to build a stable and modern country, which can effectively prevent military intervention in politics and military coups.\n\nAnother school of thought holds that in the current situation of internal and external troubles, only by letting the heroic generals who led the independence war hold the supreme power can we stabilize the situation and unite forces with the highest efficiency. This is the embryonic form of "military-first politics", emphasizing driving national development with military power."
  KOR_zhengxie_huiyi.6.a: "The Party commands the gun"
  KOR_zhengxie_huiyi.6.b: "Civilian control of the military"
  KOR_zhengxie_huiyi.6.c: "Local autonomy"
  KOR_zhengxie_huiyi.6.d: "Legitimize militias"
  KOR_zhengxie_huiyi.7.t: "Suggestions from the North"
  KOR_zhengxie_huiyi.7.desc: "Just as the conference is fiercely arguing about the future path of the country, an encrypted telegram from the Soviet Embassy is quietly delivered.\nThe telegram first expressed “warm congratulations” on Korea's independence and praised the courage shown by the people in the resistance struggle. Then, the ambassador put forward “suggestions” with “comradely care”: hoping that the new government will appoint "time-tested revolutionaries" to key positions and adopt an "advanced" economic model to prevent "imperialist infiltration".\n\nThe wording of the telegram is polite, but the information revealed between the lines cannot be ignored. Our northern neighbor is watching us closely. Should we accept this "kindness" and stand with a powerful ally, or adhere to our own path even at the risk of angering the giant bear? This decision will have a profound impact on our diplomatic structure."
  KOR_zhengxie_huiyi.7.a: "Thank the Soviet comrades for their support"
  KOR_zhengxie_huiyi.7.b: "The future of Korea is decided by the Korean people"
  KOR_zhengxie_huiyi.8.t: "Concerns from the East"
  KOR_zhengxie_huiyi.8.desc: "Just as we are fiercely debating the future of new Korea, a note from Washington broke the calm of the venue. The U.S. Department of State expressed "deep concern" about the current "political instability" in our country, and subtly hinted that if we can establish a "democratic and free" government, generous economic assistance from the United States will help us quickly heal the wounds of the war.\n\nThis potential assistance is undoubtedly a huge temptation for us who are rebuilding from scratch, but the representatives also clearly understand the expectations attached to this "kindness".\n\nIs this a sincere olive branch, or a temptation with strings attached? Our choice is not only about money, but also about the future independence and autonomy of the country."
  KOR_zhengxie_huiyi.8.a: "Thank the American comrades for their support!"
  KOR_zhengxie_huiyi.8.b: "Internal affairs brook no interference."
  KOR_zhengxie_huiyi.9.t: "Out-of-Control Streets"
  KOR_zhengxie_huiyi.9.desc: "While politicians are still arguing about the country's future route in the conference room, the people on the streets have lost their patience. Demonstrators supporting different factions—from workers shouting socialist slogans to nationalist youths waving the Taegukgi—have turned their differences from debates into fistfights.\n\nVerbal conflicts quickly escalated into clashes with stones and sticks, and bloodshed occurred on the streets and alleys of the capital. The square that once symbolized hope and unity is now occupied by anger and hatred.\n\nSocial order is on the verge of collapse. Should we immediately declare martial law and forcibly restore order with military bayonets, or urgently step forward to mediate and appease the angry people? If we do not make a decision soon, the flame of independence that has just been ignited may be extinguished by our own hands."
  KOR_zhengxie_huiyi.9.a: "Suppress left-wing demonstrators"
  KOR_zhengxie_huiyi.9.b: "Arrest right-wing leaders"
  KOR_zhengxie_huiyi.9.c: "Call on both sides to exercise restraint"
  KOR_zhengxie_huiyi.9.d: "Take the opportunity to disrupt the political situation"
  KOR_zhengxie_huiyi.10.t: "Gunshots in the Dark Night"
  KOR_zhengxie_huiyi.10.desc: "The war of words in the conference room finally turned into real gunshots in the dark night. An important representative was attacked on his way back to his residence and seriously injured. This violent incident was like a boulder thrown into a lake, instantly collapsing the already fragile unity.\n\nFear and suspicion spread rapidly. Representatives of various factions no longer trusted each other, and conspiracy theories were rife. Some believed it was revenge by radicals, others thought it was political opponents eliminating dissidents, and there were even rumors that external forces were secretly sabotaging.\n\nDialogue is dead, and bullets have begun to speak. We must immediately find out the truth and appease public opinion, otherwise, the next sound may be the gunfire of civil war."
  KOR_zhengxie_huiyi.10.a: "Conduct a tough investigation and hold those responsible accountable"
  KOR_zhengxie_huiyi.10.b: "Mediate gently to calm things down"
  KOR_zhengxie_huiyi.10.c: "Take the opportunity to expand security powers"
  KOR_zhengxie_huiyi.11.t: "Election Day"
  KOR_zhengxie_huiyi.11.desc: "[GeKOR_zhengxie_huiyinanceName]"
  KOR_communism_xuanju_key: "After a long period of debate and struggle, the voice of the people finally resounded through the sky. We have chosen the path belonging to laborers, smashing the shackles of feudalism and capitalism. The newborn republic will be governed by workers, peasants and soldiers, with land belonging to the tillers and factories belonging to the workers. This is a choice truly belonging to the people, and we will build a new world without exploitation and oppression on this land."
  KOR_democratic_xuanju_key: "The flag of freedom finally fluttered high above the conference hall. We rejected the temptation of autocracy and chose to embrace democracy, the rule of law and the market. A new country that safeguards individual rights and encourages free competition was born. Assistance from the West will inject vitality into our reconstruction, and an open and prosperous future is waiting for us. This is the victory of freedom and the hope of the future."
  KOR_neutrality_xuanju_key: "Faced with internal division and external threats, the representatives finally chose national interests above all else. Although differences still exist, all factions agreed to shelve disputes temporarily and establish a united front government that unites all forces. For the independence and survival of the country, we must join hands to tide over the difficulties. This is a fragile but necessary unity, and the future of the republic will depend on our ability to maintain this compromise."
  KOR_fascism_xuanju_key: "Endless quarrels eventually led to the complete breakdown of consultations. When the country slid into the abyss of anarchy, people in despair began to yearn for the old order. To avoid the country falling apart, all forces finally reached an unexpected consensus: welcome back the Yi royal family. The monarch may not rule directly, but as a symbol of national unity, he will be the last hope to stabilize the chaotic situation."
  KOR_zhengxie_huiyi.11.a: "The people's choice"
  KOR_zhengxie_huiyi.11.b: "Victory of freedom"
  KOR_zhengxie_huiyi.11.c: "Establishment of a united front"
  KOR_zhengxie_huiyi.11.d: "Consultations collapsed!"
  #KOR_zhengxie_huiyi.13.t: "The Giant Star Has Not Fallen"
  #KOR_zhengxie_huiyi.13.desc: "Amidst the cheers of recovery, a conspiracy bullet was shot at our leader. However, Mr. Kim Koo miraculously survived this despicable assassination. The assassin's atrocity failed to extinguish the lighthouse of independence, but instead made his prestige reach its peak. The people's anger and sympathy converged into a torrent, and those petty people who attempted to divide the nation now have to tremble in front of a giant reborn from the fire. This assassination failed to send him to the grave, but may push him to the pinnacle of power faster."
  #KOR_zhengxie_huiyi.13.a: "Thank goodness"
  KOR_zhengxie_huiyi.14.t: "§Y$KOR_Kim_Koo$§! Assassinated"
  KOR_zhengxie_huiyi.14.desc: "[GetJinJiuWasAssassinated]"
  KOR_zhengxie_huiyi_14_1_key: "A grievous news for the whole nation came——Mr. Kim Koo (Baekbeom), the symbol of our national independence movement and the last guardian of the Provisional Government of the Republic of Korea, was shot and killed by an active-duty military officer at his residence, Kyong Kyonggyojae.\n\nAs the most steadfast leader of the unification faction, Mr. Kim Koo opposed all forms of dictatorial rule throughout his life and was the strongest opponent of $KOR_syngman_rhee$'s "lifetime president" route. His death made the hope of democracy and freedom extremely slim. Although the authorities quickly classified the case as the murderer's personal act, rumors on the streets all pointed the finger at $KOR_syngman_rhee$ and his confidants. It is widely believed that this was a despicable political murder aimed at clearing the last and most respected stumbling block for those in power. The giant star has fallen, and the future of the Republic of Korea is shrouded in a heavy shadow."
  KOR_zhengxie_huiyi_14_2_key: "That sinful bullet not only claimed the life of a great patriot, but also shattered the entire nation's hope for a democratic future. Mr. Kim Koo, a giant who spent his life fighting for independence, finally fell at the hands of his own people. His death completely collapsed the already fragile consultation mechanism, and the suspicion and hatred between various factions reached their peak. The dream of democracy became unattainable with his passing, and the future of the Korean Peninsula was shrouded in an impenetrable shadow."
  KOR_zhengxie_huiyi.14.a: "Oh my god.."
  KOR_zhengxie_huiyi.15.t: "§Y$KOR_lyuh_woon_hyung$§! Assassinated"
  KOR_zhengxie_huiyi.15.desc: "[GetLyuhWoonHyungWasAssassinated]"
  KOR_zhengxie_huiyi_15_1_key: "As the leader of the moderate faction, he was once the only bridge connecting the two extreme camps and the most powerful voice for bridging differences and seeking unification. The bullet shot at Mr. Lyuh Woon-hyung also shattered the last hope of left-right cooperation. His passing completely blocked the moderate path, and rational voices were drowned out by gunshots.\n\nFrom then on, the space for dialogue no longer existed, leaving only growing hatred and confrontation. After the fall of this tireless unifier, no one could stop the nation from sliding into the abyss of division. The future of Korea was shrouded in the shadow of civil war."
  KOR_zhengxie_huiyi_15_2_key: "On the streets of Seoul, a gunshot ended the life of a great statesman. Mr. Lyuh Woon-hyung, a moderate left-wing leader committed to left-right cooperation and avoiding national division, was assassinated by far-right elements in broad daylight.\n\nMr. Lyuh Woon-hyung had been mediating between the left and right wings, trying to form a coalition government that could unite all factions. His efforts were regarded as the last hope to avoid fratricide. However, this peace-loving route beyond ideology was regarded as a thorn in the side by hardliners such as $KOR_syngman_rhee$. This assassination was undoubtedly an extreme means adopted by them to completely destroy the middle path and accelerate the establishment of an anti-communist fortress. A bloody unrest seems inevitable."
  KOR_zhengxie_huiyi.15.a: "Oh my god.."
  KOR_zhengxie_huiyi.16.t: "Storm of Purge"
  ##################################
  ##Imperialization Movement
  ##################################
  KOR_zhengxie_huiyi.16.desc: "The joy of liberation has not yet faded, but the call to liquidate the 'Korean traitors' has surged like a tidal wave. The people demand justice; those who colluded with the aggressors and betrayed their compatriots must pay the price.\n\nHowever, an uncontrolled storm of liquidation can also evolve into a political purge that devours everything. Many administrators, technicians, and officers from the old era are also on this list. Severely punishing them can satisfy public sentiment and reshape the national spirit; but pardoning them might be a shortcut to get the country's dilapidated machinery running again.\n\nThis double-edged sword named 'liquidation' hangs over our heads. Should we unleash a thorough revolutionary storm, or choose selective forgiveness for the sake of stability? Our decision will shape the soul of this nation."
  KOR_zhengxie_huiyi.16.a: "Severely punish the pro-Japanese faction"
  KOR_zhengxie_huiyi.16.b: "Pardon low-ranking pro-Japanese elements"
  KOR_zhengxie_huiyi.16.c: "Reconcile with the pro-Japanese faction"
  #######################################################################################################################
  KOR_kangmi_hongxian.0.t: "The Revolutionary Flower on Screen"
  KOR_kangmi_hongxian.0.desc: "The revolutionary opera film 'The Flower Girl' has officially completed filming. The film tells the tragic story of a poor girl named Hwa-ni during the Japanese occupation, who sells flowers to treat her mother's illness and rescue her younger brother, yet suffers double oppression from the landlord class and Japanese invaders.\n\nThis film is not merely an artistic work; it is a vivid revolutionary textbook. With its tear-jerking plot, it denounces the evils and injustices of the old society and praises the indomitable fighting spirit of the Korean people. As the film is screened nationwide, Hwa-ni's tragic fate and unyielding will shall be deeply imprinted in the hearts of every audience member, igniting class sentiment among the broad masses, reminding us that today's happy life was hard-won and that we must fight to the end to defend the fruits of the revolution!"
  KOR_kangmi_hongxian.0.a: "Let a hundred flowers bloom, let a hundred schools of thought contend"
  KOR_kangmi_hongxian.1.t: "Success in Expanding Influence"
  KOR_kangmi_hongxian.1.desc: "Through relentless efforts, our comrades have finally made breakthroughs within the army. By establishing secret study groups among soldiers, spreading revolutionary ideas, and developing party members, we have successfully united a group of ideologically progressive officers and soldiers around the Party.\n\nNow, in many crucial units, soldiers loyal to our cause are sprouting up like bamboo shoots after a spring rain."
  KOR_kangmi_hongxian.1.a: "Excellent"
  KOR_kangmi_hongxian.2.t: "Failure in Expanding Influence"
  KOR_kangmi_hongxian.2.desc: "Our attempts to expand influence within the military have suffered a serious setback. The factional forces entrenched in the high command have maintained high vigilance towards our activities. Through strengthened political screening and the placement of informants, they have destroyed several of our secretly established party cells.\n\nThis failure reminds us that the road to winning over the army is full of thorns; we must adopt more concealed and resilient strategies of struggle."
  KOR_kangmi_hongxian.2.a: "Alas..."
  KOR_kangmi_hongxian.3.t: "A General Supports Us"
  KOR_kangmi_hongxian.3.desc: "A senior general, prestigious within the army, has expressed sympathy and support for our cause through secret channels. Perhaps he is motivated by concern for the nation's future, or perhaps he has seen through the corrupt nature of the reactionaries. Regardless, his addition is a tremendous boost for us.\n\nThis not only wins us a crucial foothold in the high command but, more importantly, his prestige will influence a large number of observing officers, paving the way for our ultimate control of the armed forces."
  KOR_kangmi_hongxian.3.a: "A crucial alliance"
  KOR_kangmi_hongxian.4.t: "The Army Resists Our Influence"
  KOR_kangmi_hongxian.4.desc: "Our activities within the army have caused panic among hostile factions. An internal purge aimed at cleansing our faction has been launched comprehensively within the military. Officers and soldiers are required to take political oaths; anyone suspected of sympathizing with us is immediately arrested.\n\nThis is not only a severe test for us but also completely exposes the contradictions within the army. The flames of armed struggle may be ignited sooner than we expected."
  KOR_kangmi_hongxian.4.a: "Alas..."
  KOR_kangmi_hongxian.5.t: "The Return of the Yan'an Spirit"
  KOR_kangmi_hongxian.5.desc: "As the joy of liberation gradually settles, the differences in line between different factions within the Party have become increasingly prominent. In this silent struggle determining the nation's future, the comrades of the 'Yan'an faction' — those who once traveled far to China, studied under the Pagoda Mountain of Yan'an, and fought shoulder to shoulder with Chinese comrades on the anti-Japanese battlefields — ultimately gained the upper hand.\n\nThey brought back not only rich experience in guerrilla warfare and mass organization but also a set of nation-building ideas that have been tested in practice, integrating Marxism with Eastern realities. In comparison, the proposals of other factions seem somewhat detached from reality. Now, the Yan'an faction has gained overwhelming support within the Party. To unify thinking and unite all forces, they formally call for a Party Congress to elect a supreme leader capable of leading the new Korea towards prosperity and strength. A brand new flag is about to rise over Pyongyang."
  KOR_kangmi_hongxian.5.a: "General Mu Jeong is the best candidate."
  KOR_kangmi_hongxian.5.b: "Kim Tu-bong is more popular."
  KOR_kangmi_hongxian.6.t: "The Voice from the South"
  KOR_kangmi_hongxian.6.desc: "In the intra-party debate deciding the future direction of the new Korea, a powerful force emerged from the South. The comrades of the 'South Korean Workers' Party', who persevered in underground struggle, organized workers' strikes and student movements under the harsh white terror of the southern peninsula, have won the respect and support of the majority within the Party with their rich practical experience and indomitable fighting will.\n\nThey possess the deepest understanding of the complex situation in the South, and their proposals focus more on how to unite all forces that can be united to counter the direct threat of Japanese imperialism in the South. They believe the urgent task is to consolidate the revolutionary base in the South, preparing for the ultimate achievement of a powerful peninsula. Now, the comrades of the South Korean Workers' Party have gained decisive influence within the Party. An election aimed at selecting a leader capable of leading all the Korean people to accomplish the great revolutionary cause is about to begin."
  KOR_kangmi_hongxian.6.a: "Park Heon-young has more experience."
  KOR_kangmi_hongxian.6.b: "In extraordinary times, someone who understands military affairs should lead."
  KOR_kangmi_hongxian.7.t: "The Legend of Paektu Mountain"
  KOR_kangmi_hongxian.7.desc: "In the intra-party line struggle deciding the future direction of the new Korea, the ultimate victor was neither the theorists from Yan'an nor the underground organizers from the South. Victory belonged to the comrades of the 'Guerrilla faction', who fought the most direct and brutal battles against the Japanese invaders amidst the snowy peaks and boundless forests of Paektu Mountain.\n\nThey carry the smoke of war on their bodies; their revolutionary credentials were earned with blood and sacrifice, giving them unparalleled prestige within the Party.\n\nAmong these battle-hardened revolutionaries, Comrade Kim Il-sung's brilliance was unmatched. As the legendary commander of the Northeast Anti-Japanese United Army, his exceptional military talent, unwavering will, and charismatic leadership displayed during the harshest years made him the spiritual symbol of all guerrilla fighters. Now, as expected by all, he emerged from this group of the most steadfast revolutionaries to become the supreme leader guiding our advance. A new era with him as the absolute core has officially begun."
  KOR_kangmi_hongxian.7.a: "Loyalty!"
  KOR_kangmi_hongxian.8.t: "The Echo from the Kremlin"
  KOR_kangmi_hongxian.8.desc: "At the critical moment of establishing the new Korea's development path, the balance of power within the Party ultimately tipped in favor of the comrades of the 'Soviet faction'. These revolutionaries are mostly ethnic Koreans who emigrated to the Soviet Union in their early years. They received systematic Marxist-Leninist education in the USSR, even joining the Soviet Red Army and shedding blood to defend the great socialist motherland.\n\nThey have myriad connections with the Soviet Union and firmly believe the Soviet model is the only correct path to building a socialist powerhouse. Relying on the immense influence of the 'Elder Brother' behind them and their own mastery of advanced theory and management experience, the Soviet faction gradually suppressed the voices of other factions in the intra-party struggle.\n\nThey advocate comprehensive learning from the Soviet Union, using it as a blueprint for everything from economic planning to military construction. Now, they have firmly grasped the Party's leading power and begun preparing for the leadership election. Without a doubt, the one ultimately elected will be a leader capable of faithfully implementing the Soviet line and ensuring the newborn republic marches in step with the Kremlin."
  KOR_kangmi_hongxian.8.a: "Hŏ Ka-i is a suitable candidate"
  KOR_kangmi_hongxian.8.b: "General Nam Il might be more suitable"
  KOR_kangmi_hongxian.9.t: "Unified Front Initiative - Success"
  KOR_kangmi_hongxian.9.desc: "Our unified front initiative has received a positive response! Comrades within the Party have demonstrated the broad perspective revolutionaries should possess. They deeply understand that in the face of powerful internal and external enemies, any internal differences must be temporarily set aside.\n\nRelying on the immense influence of the 'Elder Brother' behind them and their own mastery of advanced theory and management experience, the Soviet faction gradually suppressed the voices of other factions in the intra-party struggle. They advocate comprehensive learning from the Soviet Union, using it as a blueprint for everything from economic planning to military construction. Now, they have firmly grasped the Party's leading power and begun preparing for the leadership election. Without a doubt, the one ultimately elected will be a leader capable of faithfully implementing the Soviet line and ensuring the newborn republic marches in step with the Kremlin."
  KOR_kangmi_hongxian.9.a: "Victory for unity"
  KOR_kangmi_hongxian.10.t: "Unified Front Initiative - Failure"
  KOR_kangmi_hongxian.10.desc: "Regrettably, our initiative aimed at uniting all revolutionary forces has been flatly rejected by comrades within the Party. Their leadership, blinded by narrow factionalism, places factional interests above the overall interests of the nation and revolution.\n\nThey refuse cooperation and insist on their own rigid line, undoubtedly weakening our newborn regime and creating opportunities for our enemies. Cracks have appeared in Party unity. It seems that before uniting against external threats, an internal struggle aimed at purging erroneous ideas and unifying the Party's will has become unavoidable."
  KOR_kangmi_hongxian.10.a: "The rise of factionalism"
  KOR_kangmi_hongxian.11.t: "Plenary Session of the Central Committee of the Korean Communist Party"
  KOR_kangmi_hongxian.11.desc: "The major factions within the Party are evenly matched; no single side can achieve absolute superiority. Continued struggle would only lead to devastating splits, allowing the enemies of the revolution to profit. To preserve the hard-won unity, we decided to learn from historical lessons, avoid the risk of personality cults, and establish a system of collective leadership.\n\nRepresentatives from Yan'an, the Soviet Union, and the South will jointly form the supreme decision-making committee, leading the nation together through democratic consultation. This can prevent the emergence of individual dictatorship while also pooling the wisdom of all sides, ensuring the nation progresses on a stable and prudent path. A great political experiment thus begins."
  KOR_kangmi_hongxian.11.a: "A new future, a new journey."
  KOR_kangmi_hongxian.12.t: "The Chollima Movement"
  KOR_kangmi_hongxian.12.desc: "The wounds of war are still unhealed; the nation in ruins needs a miracle. To rebuild our homeland from the ashes at the fastest speed, the leader issued the great call to the entire nation: 'Advance at the speed of Chollima!' Chollima, the legendary steed that travels a thousand li a day, now becomes the spiritual symbol for us to overcome all difficulties and accelerate socialist construction.\n\nStarting from the workers of the Kangson Steel Mill shouting the bold slogan 'Increase production by 10,000 tons!', the nationwide 'Chollima Movement' officially began. In factory workshops and fields, there are heated labor competitions everywhere. Everyone strives to be a 'Chollima Rider', breaking production records with selfless enthusiasm and soaring drive. We firmly believe that relying on this revolutionary spirit of self-reliance, we will definitely complete the Five-Year Plan ahead of schedule, showcasing the heroic spirit of the Korean people to the world!"
  KOR_kangmi_hongxian.12.a: "At the speed of Chollima!"
  KOR_kangmi_hongxian.13.t: "[FROM.GetNameDefCap] Suggests Technology Sharing"
  KOR_kangmi_hongxian.13.desc: "[FROM.GetNameDefCap] suggests establishing a partnership to mutually learn scientific expertise. While our scientists largely support increasing the availability of knowledge, the military is cautious about leaking information that could ultimately harm our national security."
  KOR_kangmi_hongxian.13.a: "Knowledge knows no borders"
  KOR_kangmi_hongxian.13.b: "We will instead provide them with economic aid"
  KOR_kangmi_hongxian.14.t: "[FROM.GetNameDefCap] Supports Technical Exchange"
  KOR_kangmi_hongxian.14.desc: "[FROM.GetNameDefCap] has agreed to participate in our proposed technical exchange program. Members of our own scientific community are delighted to hear this news and have already planned visits to universities and factories in [FROM.GetNameDef]."
  KOR_kangmi_hongxian.14.a: "A mutually beneficial arrangement!"
  KOR_kangmi_hongxian.15.t: "Cheap Oil"
  KOR_kangmi_hongxian.15.desc: "Today, by the Tumen River, with the laying of the last rail, our nation's railway network has successfully achieved a historic connection with the Soviet Union's Trans-Siberian Railway! This is not just a railway; it is a steel artery delivering friendship and strength.\n\nFrom now on, cheap oil from the Soviet Union's Baku oil fields can be transported continuously to our country via train, bypassing the long and unsafe sea route. This precious 'industrial blood' will provide endless power for our factories, freeing our tanks and planes from logistical worries. Our ties with our great socialist ally have never been closer. The process of Korea's industrialization will definitely surge forward at Chollima speed!"
  KOR_kangmi_hongxian.15.a: "The steel artery!"
  KOR_kangmi_hongxian.16.t: "This Month's Oil Delivery"
  KOR_kangmi_hongxian.16.desc: "The familiar whistle sounds again from the north. Oil tanker trains, laden with the profound friendship of the Soviet people, have arrived on time. This month's quota of cheap oil is now in storage, injecting new vitality into our fervent socialist construction.\n\nThis steady flow of 'industrial blood' is a vivid embodiment of proletarian internationalism. It makes our factory chimneys stand tall, our tractors race across the fields, and our military remain vigilant. Thanks to our great ally, any imperialist blockade will be futile under their support!"
  KOR_kangmi_hongxian.16.a: "Fraternal aid"
  KOR_kangmi_hongxian.17.t: "Primorsky Krai Trade Agreement"
  KOR_kangmi_hongxian.17.desc: "Today, our country and our great ally, the Soviet Union, formally signed a historic border trade agreement in the Khasan region. This agreement will greatly promote economic exchange and development in the border areas of both nations, transforming former military outposts into prosperous trade hubs.\n\nAccording to the agreement, we will export surplus agricultural products, minerals, and light industrial goods to the Soviet Union in exchange for much-needed industrial machinery, fertilizers, and advanced technology. This can effectively compensate for the shortcomings in our industrial system, accelerate economic development, and serve as further proof of the unbreakable fraternal friendship between our two countries. Through mutual exchange and close cooperation, the economic strength of the entire socialist camp will be further enhanced."
  KOR_kangmi_hongxian.17.a: "Prosperity on the border"
  KOR_kangmi_hongxian.18.t: "Soviet Experts Aid Korea"
  KOR_kangmi_hongxian.18.desc: "Today, the first group of Soviet expert advisors arrived in Pyongyang. They bring advanced scientific knowledge, valuable industrial blueprints, and rich management experience. This is not just technical aid; it is a glorious manifestation of proletarian internationalist spirit.\n\nThese comrades from the brotherly nation will delve into our factories, mines, and laboratories, personally helping us cultivate our own technical talent and solve the most棘手 problems on our path to industrialization. Under their guidance, many technological barriers we could not previously overcome will be breached. With this wisdom from the north, our pace in catching up to the world's advanced levels will surely be greatly accelerated!"
  KOR_kangmi_hongxian.18.a: "Wisdom from the North!"
  KOR_kangmi_hongxian.19.t: "The Park Heon-young, Lee Seung-yeop Espionage Case"
  KOR_kangmi_hongxian.19.desc: "As the flames of war temporarily subside, our young republic enters a period of internal consolidation. However, beneath the banner of unity, not all comrades harbor equally pure faith. Comrade Park Heon-young, who long led the Southern communist movement, and his followers possess immense prestige domestically, but this force has also raised vigilance.\n\nNow, shocking accusations have surfaced: several senior cadres led by Lee Seung-yeop are accused of being American spies, conspiring to subvert our hard-won regime. Park Heon-young, this veteran revolutionary, is also dragged into the center of this storm. Is this an imperialist conspiracy and infiltration, or a brutal purge launched to consolidate the leadership core? Regardless of the truth, a silent war has begun internally. We must make a choice; it will determine the future path of the republic and the fate of countless comrades."
  KOR_kangmi_hongxian.19.a: "Their crimes are too numerous to record; they must be severely punished without leniency."
  KOR_kangmi_hongxian.20.t: "The Sun Sets"
  KOR_kangmi_hongxian.20.desc: "Today, the sky of the republic is plunged into unprecedented darkness. Our great leader, the father of the republic, the ever-victorious iron-willed commander—Marshal Kim Il-sung—has suddenly passed away in a vile conspiracy. The news tore through Pyongyang like thunder; the entire nation is plunged into immense grief and confusion.\n\nWhile the people mourn the loss of their sun, a dangerous power vacuum has appeared at the top. During his lifetime, the leader balanced various party factions with his supreme authority, but now, this sole rein has snapped. The Guerrilla faction, Yan'an faction, Soviet faction... hidden ambitions and line differences stir in this power vacuum. Where will a Korea without Kim Il-sung go? The fate of the republic hangs by a thread."
  KOR_kangmi_hongxian.20.a: "Their crimes are too numerous to record; they must be severely punished without leniency."
  KOR_kangmi_hongxian.21.t: "The Moscow Trial in Pyongyang"
  KOR_kangmi_hongxian.21.desc: "[GetKORPingrangDeMosikeShenpan]"
  KOR_pingrangde_mosikeshenpan_event_text: "The August political disturbance has subsided, but those who challenged the leader's authority will not be easily forgotten. Those 'comrades' who voiced discord at the Central Plenum are now branded as dangerous 'anti-party factionalist elements'. A political trial mimicking Stalin's Great Purge is unfolding in Pyongyang.\n\nDebates and evidence in the court are no longer important; the verdict is already written. Kim Tu-bong, Pak Chang-ok, and other prominent figures of the 'Yan'an faction' and 'Soviet faction' are accused of being agents of foreign forces attempting to subvert our revolution. Their purge will be swift and thorough.\n\nThis trial is not only to eliminate dissidents but also to declare to all forces, domestic and foreign: any challenge to the sole leading ideology will be ruthlessly crushed by an iron fist. A new, highly centralized era will begin with this trial."
  KOR_pingrangde_mosikeshenpan_event1_text: "The forces centered on the 'Soviet faction', under the banner of 'avenging the leader', have turned their spears towards their main opponents within the Party—the 'Yan'an faction' and the leaderless 'Guerrilla faction'. They claim the assassination was a conspiracy plotted by these two factions to usurp supreme power. A brutal internal purge has begun.\n\nWithout the leader's restraint, the beast of factional struggle has been fully unleashed. Where will Korea's future head?"
  KOR_kangmi_hongxian.21.a: "All traitors will pay the heaviest price."
  KOR_kangmi_hongxian.22.t: "Establishment of the Guards 105th Tank Division"
  KOR_kangmi_hongxian.22.desc: "Today, a glorious name is engraved on the banner of our army—the 'Guards Seoul Ryu Gyeong-soo 105th Tank Division' is formally established! This unit inherits the supreme honor of being the first to enter Seoul in the liberation war. Named after its meritorious commander, Comrade Ryu Gyeong-soo, and bestowed the 'Guards' title, it symbolizes its unmatched combat power.\n\nThey are the iron fist of our army, the unstoppable steel tide that tears through enemy lines. This elite division equipped with the newest tanks will serve as our sharpest spearhead, ready at any moment to crush any enemy daring to block our advance, achieving new and greater feats for the final unification of the motherland!"
  KOR_kangmi_hongxian.22.a: "The glory of the Guards!"
  KOR_kangmi_hongxian.23.t: "Soviet Aid Aircraft Arrive"
  KOR_kangmi_hongxian.23.desc: "Today, at Pyongyang's Sunan Airport, accompanied by tremendous roars, the first batch of fighter aircraft aided by our great ally, the Soviet Union, landed steadily. These brand new aircraft glisten with metallic luster; the bright red stars on their wings symbolize the unbreakable friendship of the socialist camp.\n\nThis is not merely a few planes; these are 'steel wings' sent by the Soviet people, granting our young People's Air Force a qualitative leap. Our pilots will soar through the blue skies of our motherland in these excellent fighter eagles, constructing an aerial Great Wall no imperialist aggressor can breach. From today, the republic's airspace will no longer be at the mercy of others!"
  KOR_kangmi_hongxian.23.a: "Excellent!"
  KOR_kangmi_hongxian.24.t: "[FROM.GetNameDefCap] Incites Communist Sentiment"
  KOR_kangmi_hongxian.24.desc: "We have noticed that there are [FROM.GetAdjective] organizations within our country disseminating communist ideas. While this itself seems harmless, some of the propaganda content appears quite revolutionary. Reports of workers being encouraged to organize and unite are becoming increasingly frequent. Combined with recent history, we cannot be sure if this is a complex plot by the [FROM.GetAdjective] leadership, with the ultimate aim of integrating us."
  KOR_kangmi_hongxian.24.a: "Despicable Bolsheviks"
  KOR_kangmi_hongxian.25.t: "[FROM.GetNameDefCap] Invites Us to Join Its Alliance"
  KOR_kangmi_hongxian.25.desc: "A delegation from afar recently arrived at our nation's capital, requesting an audience with [ROOT.GetLeader]. They claim to be from [FROM.GetNameDef] and wish to form an alliance with us. Shall we accept?"
  KOR_kangmi_hongxian.25.a: "Unity makes us stronger"
  KOR_kangmi_hongxian.26.t: "[FROM.GetNameDefCap] Accepts Our Invitation"
  KOR_kangmi_hongxian.26.desc: "[FROM.GetLeader] has gladly accepted our alliance proposal and has begun integrating into our sphere of influence. A day worthy of celebration!"
  KOR_kangmi_hongxian.26.a: "A shared vision for the future"
  KOR_kangmi_hongxian.27.t: "Discussing a Common Nation-Building Program"
  KOR_kangmi_hongxian.27.desc: "The long years of fighting Japanese imperialism have tightly bound the fates of Chinese and Korean communists. Our comrades once fought shoulder to shoulder with Chinese comrades amidst the white mountains and black waters, their blood cementing an unbreakable friendship.\n\nNow, we both face the historical tasks of building new nations and combating common enemies. Fighting alone makes one vulnerable; standing united makes one impregnable. Therefore, we have formally proposed to our fraternal Chinese Communist Party to hold high-level talks aimed at establishing a common nation-building program, coordinating our respective economic, political, and even military development blueprints.\n\nWe believe the rise of a solid socialist Great Wall in the East will be the loudest response to the imperialists. We await Beijing's reply with eager hope."
  KOR_kangmi_hongxian.27.a: "A Great Wall in the East..."
  KOR_kangmi_hongxian.28.t: "[FROM.GetNameDefCap] Accepts Our Proposal"
  KOR_kangmi_hongxian.28.desc: "Our proposal to the fraternal Chinese Communist Party, aimed at coordinating nation-building programs, has received an enthusiastic response from Yan'an! The Chinese comrades replied, stating that China and Korea are 'connected by mountains and rivers, sharing a relationship as close as lips and teeth'. In the past Anti-Japanese War, our soldiers fought shoulder to shoulder amidst the white mountains and black waters, forging a friendship sealed in blood.\n\nThey fully agree that, under the current situation of increasingly severe imperialist threats, our two newborn socialist nations must take coordinated steps in politics, economy, and even military affairs. A common nation-building program will be a powerful weapon for us to jointly combat common enemies. Soon, we will establish joint committees to share revolutionary experiences and construction blueprints. This marks that the unbreakable alliance between China and Korea has entered a new, higher-level stage."
  KOR_kangmi_hongxian.28.a: "Advance hand in hand!"
  KOR_kangmi_hongxian.29.t: "[FROM.GetNameDefCap] Rejects Our Proposal"
  KOR_kangmi_hongxian.29.desc: "Our proposal for a common nation-building program to the Chinese Communist Party received a cautious and polite reply. Beijing reiterated the firm revolutionary friendship between our two nations but also pointed out that China has just ended a century of war and chaos, its territory is vast, and its domestic situation is extremely complex. Their current primary task is to focus on restoring their own production and stability.\n\nThey believe each country must explore the path of revolution and construction most suitable for itself according to its specific national conditions. While they cannot formulate a fully synchronized nation-building program with us, they promise that the fraternal friendship between our two nations will not change, and they will still provide assistance within their capabilities when necessary.\n\nThough this reply brings some regret, it also reminds us that independence and self-reliance may be the most reliable direction for the new Korea."
  KOR_kangmi_hongxian.29.a: "So be it..."
  KOR_kangmi_hongxian.30.t: "Far Eastern Unification Proposal"
  KOR_kangmi_hongxian.30.desc: "Representatives from [FROM.GetNameDef] have made a bold proposal to us regarding the reorganization of the Far East. This requires us to cede some regions bordering [FROM.GetAdjective] to establish a new socialist federation under the management of [FROM.Capital.GetCapitalVictoryPointName]. This could create a powerful buffer state in the region, alleviating our defense burden here and allowing us to deploy our military elsewhere."
  KOR_kangmi_hongxian.30.a: "An interesting proposal"
  KOR_kangmi_hongxian.30.b: "We have other plans for the region"
  KOR_kangmi_hongxian.31.t: "[FROM.GetName] Accepts the Proposal"
  KOR_kangmi_hongxian.31.desc: "[FROM.GetNameDefCap] has agreed to our proposal to integrate the Far East into a single political entity. It seems that after decades of instability, our people are about to usher in a new era."
  KOR_kangmi_hongxian.31.a: "Excellent!"
  KOR_kangmi_hongxian.32.t: "[FROM.GetName] Rejects the Proposal"
  KOR_kangmi_hongxian.32.desc: "[FROM.GetNameDefCap] has rejected our proposal to integrate the Far East into a single political entity. Although this is a major setback, the dream is not yet shattered. We need only wait for the right moment."
  KOR_kangmi_hongxian.32.a: "They cannot stop us forever"
  KOR_kangmi_hongxian.33.t: "The Proposal of the 4th Plenary Session of the 15th Central Committee"
  KOR_kangmi_hongxian.33.desc: "Just as the entire Party and nation strive for socialist construction, a dangerous undercurrent is quietly stirring within the Party. Elements of the 'Kapsan faction', led by Pak Kum-chol and Lee Hyo-sun, under the banner of 'old comrades', engage in rampant factionalism, attempting to turn the Party into their own 'independent kingdom', seriously challenging the leader's absolute authority and the Party's unified leadership.\n\nMore dangerously, they spread revisionist ideas, advocate so-called 'material incentives', oppose the correct line of prioritizing the development of defense industry, and attempt to weaken our revolutionary armed forces. This anti-party, counter-revolutionary conspiracy is the most vicious betrayal of our cause! Now, an internal struggle aimed at thoroughly eradicating this poisonous weed and purifying our revolutionary ranks has begun. Any mercy towards these conspirators is a crime against the revolution!"
  KOR_kangmi_hongxian.33.a: "Eradicate the poisonous weed!"

  ###################################### Democracy ############################################################
  KOR_minzhu_hongxian.1.t: "§C$KOR_Kim_Koo$§! Elected"
  KOR_minzhu_hongxian.1.desc: "At the political consultative conference determining the nation's fate, a name symbolizing a century of Korea's independence struggle ultimately won everyone's respect—Baekbeom §Y$KOR_Kim_Koo$§! was elected as the first president of the new Republic of Korea.\n\nHis entire life was dedicated to the cause of liberation. As the final guardian of the Provisional Government of the Republic of Korea, his election represents the inheritance of history and the continuity of legitimacy. In his victory speech, §Y$KOR_Kim_Koo$§! reiterated that his sole wish is to establish a 'beautiful' unified nation free from any external interference. He refuses to recognize any form of division and vows to lead the entire people in striving for a complete and powerful Korea. A government with nationalism as its absolute core, bowing to no external force, is about to be born."
  KOR_minzhu_hongxian.1.a: "The beacon of the nation!"
  KOR_minzhu_hongxian.2.t: "§C$KOR_Cho_Bong_am$§! Elected"
  KOR_minzhu_hongxian.2.desc: "After several rounds of intense political consultation, ultimately, §Y$KOR_Cho_Bong_am$§!, representing the forces of reform and progress, successfully became the first president of the republic. This marks the opening of an entirely new era.\n\nUnlike traditional left- or right-wing politicians, §Y$KOR_Cho_Bong_am$§!'s pragmatic land reform and social welfare proposals won widespread support among farmers and the lower classes. In the current climate of factionalism and sharp contradictions, his advocacy for 'peaceful unification' and 'reformist politics' is seen as the best solution to bridge social divides and unite all citizens. He promises the new government will immediately embark on social reforms, dedicated to establishing an equal society where 'those who farm have land, and those who work have food'. A new path different from the old era is unfolding before us."
  KOR_minzhu_hongxian.2.a: "The standard-bearer of progress!"
  KOR_minzhu_hongxian.3.t: "§C$KOR_syngman_rhee$§! Elected"
  KOR_minzhu_hongxian.3.desc: "After a political consultative conference filled with controversy and backroom dealings, §Y$KOR_syngman_rhee$§! ultimately emerged as the final victor, elected as the first president of the Republic of Korea. Leveraging his deep connections in the United States and unwavering anti-communist stance, he successfully gained decisive external support, using it to suppress all competitors.\n\n§Y$KOR_syngman_rhee$§!'s rise to power signals the complete disappearance of any possibility of compromise with the Northern communists. In his inaugural address, he made clear that the new government's primary national policy will be 'anti-communism and defense against communism', dedicated to establishing a staunch capitalist bulwark and forming the closest alliance with the United States. A political purge aimed at eliminating all 'red elements' and leftist sympathizers within the country is inevitable. The era of strongman politics has officially arrived."
  KOR_minzhu_hongxian.3.a: "The rise of the strongman."
  KOR_minzhu_hongxian.4.t: "Jeju Island Uprising"
  KOR_minzhu_hongxian.4.desc: "While we strive to consolidate rule in the South, the island known as the 'Island of Peace', Jeju, has ignited flames of rebellion. Secretly organized and incited by the South Korean Workers' Party, large-scale strikes and demonstrations opposing 'separate elections' and demanding North-South unification have swept the entire island.\n\nFactories are shut down, schools are on strike, and all of Jeju is paralyzed. Leftists and their sympathizers have taken control of some areas, engaging in constant armed clashes with our police and right-wing youth groups sent to suppress them. This is not merely a simple strike; it is an open challenge to our nation-building policy. Unless the most decisive and severe measures are taken immediately to extinguish these flames, they may spread to the entire South, completely shaking our nascent regime."
  KOR_minzhu_hongxian.4.a: "Suppress with force!"
  KOR_minzhu_hongxian.4.b: "Perhaps we should listen to their demands..."
  KOR_minzhu_hongxian.5.t: "The Rebel Flag in Yeosu"
  KOR_minzhu_hongxian.5.desc: "Just as we were gathering troops to completely suppress the rebellion on Jeju Island, disastrous news arrived from the South—the 14th Regiment of the Defense Guard stationed in Yeosu refused orders to go to Jeju for suppression duty!\n\nIncitement by South Korean Workers' Party members lurking within the unit, soldiers shouted 'Oppose fratricide!' and launched an armed uprising. They quickly killed senior officers unwilling to cooperate, took control of all of Yeosu, and spread to neighboring Suncheon. The rebels opened prisons, released left-wing political prisoners, distributed weapons to the people, and attempted to establish 'liberated zones'. This is no longer mere insubordination, but an armed rebellion aimed at overthrowing our nascent republic! We must immediately mobilize all forces and crush it thoroughly with thunderous force; otherwise, the entire South may fall into a sea of red flames."
  KOR_minzhu_hongxian.5.a: "This is rebellion!"
  KOR_minzhu_hongxian.5.b: "Divide and bribe these officers."
  KOR_minzhu_hongxian.6.t: "[FROM.GetNameDefCap] Requests Territorial Guarantee"
  KOR_minzhu_hongxian.6.desc: "Despite our support and the relatively secure environment of the peninsula's mountainous regions, [FROM.GetNameDef] still requests our commitment to provide protection in the event of conflict. It's unclear whether they fear another colonial invasion from the South by [JAP.GetNameDefCap] or worry about communist forces from beyond the northern border, but we must weigh the risk of being drawn into such conflicts."
  KOR_minzhu_hongxian.6.a: "Let them become a bridgehead in the Far East!"
  KOR_minzhu_hongxian.6.b: "This is too risky!"
  KOR_minzhu_hongxian.7.t: "ROK-US Mutual Defense Treaty"
  KOR_minzhu_hongxian.7.desc: "Faced with the growing military threat from the Northern communist regime and the expansionist ambitions of the entire red bloc, we know all too well that relying solely on our own strength cannot ensure the nation's long-term security. Today, in Washington, we formally signed the 'ROK-US Mutual Defense Treaty' with our most powerful ally—the United States of America.\n\nThis treaty solemnly declares in legal form: any external armed attack against the Republic of Korea will be regarded as a threat to the peace and security of the United States. The United States will act in accordance with its constitutional processes to meet the common danger. This promise provides us with ultimate security assurance, constructing an insurmountable barrier for the communists. Henceforth, the Republic of Korea will stand shoulder to shoulder with the United States as the free world's firmest outpost on the Asian continent, jointly defending the values we cherish."
  KOR_minzhu_hongxian.7.a: "The guarantee of the free world!"
  KOR_minzhu_hongxian.8.a: "Give them surplus aid"
  KOR_minzhu_hongxian.8.b: "We can't provide anything"
  KOR_minzhu_hongxian.9.a: "Excellent, we'll make good use of it."
  KOR_minzhu_hongxian.10.t: "June Offensive"
  KOR_minzhu_hongxian.10.desc: "The establishment of the 'Special Committee for Investigating Anti-National Activities' (Anti-National Committee) was originally intended to liquidate pro-Japanese elements from the Japanese occupation period and uphold national justice. However, as investigations deepened, many figures holding key positions as police, military officers, and bureaucrats in the new government were prominently listed. Liquidating them would be tantamount to shaking the very foundations of our regime.\n\nWe can no longer tolerate this act of self-destruction for the sake of the 'past'. With the tacit approval of President $KOR_syngman_rhee$, the police forces launched the 'June Offensive', raiding the offices of the Anti-National Committee, forcibly disbanding its subordinate special police squads, and arresting several key members. The debate over liquidating history thus ended. An unmistakable signal was sent: practical stability and forceful anti-communism outweigh the pursuit of historical justice. The ruling power's foundation was thoroughly consolidated in this aggressive manner."
  KOR_minzhu_hongxian.10.a: "Loyalty!"
  KOR_minzhu_hongxian.11.t: "§Y$KOR_Song_Zhenyu$§! Assassinated"
  KOR_minzhu_hongxian.11.desc: "In the cold dawn wind, a gunshot took the life of a highly respected nationalist leader—Mr. Song Jin-woo, Chief Secretary of the Korean Democratic Party, was assassinated.\n\nAs a moderate enjoying high prestige within the right-wing camp, Song Jin-woo advocated for a more cautious nation-building strategy and sought to unite various forces. This made him a major competitor to $KOR_syngman_rhee$ on his path to seizing supreme power. Although the assassin came from an ultra-right-wing group, all signs and rumors suggest that the mastermind behind this vile assassination was none other than $KOR_syngman_rhee$'s camp, eager to eliminate any alternative that might hinder his establishment of a separate Southern government.\n\nWith his fall, moderate voices within the right-wing camp were greatly weakened, and the space for compromise on the political stage further narrowed. The path to strongman rule seems to have cleared another obstacle."
  KOR_minzhu_hongxian.11.a: "One less competitor..."
  KOR_minzhu_hongxian.12.t: "South Korean Workers' Party Parliamentary Branch Incident"
  KOR_minzhu_hongxian.12.desc: "Open political debate could no longer suppress the dissenting voices from within the National Assembly. Leftist lawmakers, led by the South Korean Workers' Party and cloaked in legality, were becoming the most dangerous stumbling blocks to consolidating our regime. Now is the time to resolve them once and for all.\n\nThrough careful planning, we successfully fabricated the 'South Korean Workers' Party Parliamentary Branch Incident', portraying these lawmakers as a spy ring receiving instructions from the North and intending to overthrow the state. The police have taken action and rounded them up. From now on, there will be no legal communist sympathizers in the National Assembly, and the path to absolute power has been completely cleared."
  KOR_minzhu_hongxian.12.a: "Loyalty!"
  KOR_minzhu_hongxian.13.t: "[FROM.GetNameDefCap] Demands Compensation for Colonial History"
  KOR_minzhu_hongxian.13.desc: "The new regime just established in Seoul sent us a formal diplomatic note. They demand comprehensive compensation for the 'occupation period' on the peninsula. The list is long, and the amount is astronomical.\n\nThis demand has caused a storm in the Diet. Hardliners consider it extortion and humiliation by them, advocating outright rejection; while bureaucrats in the Foreign Ministry worry this will completely anger the other side and draw American displeasure—Washington has repeatedly 'suggested' we 'get along' with neighboring countries. Our economy is already in ruins from the war, the national treasury is empty, and we simply cannot afford this huge sum. But this is not just about money; it is a major choice concerning national face and future diplomatic direction. Should we accept in humiliation or reject forcefully? How should we respond to this bill from the past?"
  KOR_minzhu_hongxian.13.a: "It can only be this way..."
  KOR_minzhu_hongxian.13.b: "Who do they think they are!"
  KOR_minzhu_hongxian.14.t: "[FROM.GetNameDefCap] Agrees to Compensate"
  KOR_minzhu_hongxian.14.desc: "Contrary to many expectations, under immense international public pressure, the Japanese government ultimately agreed to our compensation claim. Although the amount and method of compensation were negotiated through multiple tough rounds, this is undoubtedly a major diplomatic victory.\n\nThe first batch of reparations and industrial equipment has been dispatched. This will inject a strong stimulant into our languishing economy, greatly accelerating post-war reconstruction. More importantly, this successful claim has greatly enhanced the prestige of the current government, proving to the world our determination and ability to safeguard national interests and national dignity. National justice has been upheld to a certain extent."
  KOR_minzhu_hongxian.14.a: "An unexpected compromise."
  KOR_minzhu_hongxian.15.t: "[FROM.GetNameDefCap] Refuses Compensation"
  KOR_minzhu_hongxian.15.desc: "Our righteous demand for compensation from Japan was met with an arrogant and unrepentant refusal from Tokyo. In their reply, they not only evaded the compensation amount but even hinted that their colonial rule also brought 'modernization', showing no reflection on their crimes.\n\nThis shameless reply completely ignited nationwide fury. Large-scale anti-Japanese demonstrations erupted in major cities. Government prestige suffered as a result, and public anti-Japanese sentiment was pushed to its peak. This failed diplomatic negotiation made us clearly realize that no illusions should be held towards aggressors. Bilateral relations have fallen to a freezing point, and this historical debt, we and our people will never forget."
  KOR_minzhu_hongxian.15.a: "A shameless refusal!"
  KOR_minzhu_hongxian.16.t: "Proposal of the White Émigrés"
  KOR_minzhu_hongxian.16.desc: "Among the White Army émigré advisors we accepted, an old general who once followed Kolchak brought a startling and bold proposal through secret channels. He claimed that in the Soviet Far East, there are still many old Russians who long for their homeland and masses dissatisfied with Bolshevik tyranny. They are just waiting for an opportunity.\n\nHe solemnly promised: once our army crosses the Tumen River northward and launches an attack against our common red enemy, he and his hidden network can instigate a large-scale armed rebellion in key Siberian cities and along railway lines. This rebellion would thoroughly disrupt the Soviet rear, forcing them to fight on two fronts. This is an extremely tempting proposal, but the risk is equally enormous. Can we trust the promises of these ghosts of a bygone era?"
  KOR_minzhu_hongxian.16.a: "Catch them by surprise!"
  KOR_minzhu_hongxian.16.b: "Just keep them in the army."
  KOR_minzhu_hongxian.17.t: "[FROM.GetLeader] Demands Our Surrender"
  KOR_minzhu_hongxian.17.desc: "[FROM.GetNameDef]'s [FROM.GetLeader] demands that our 'dictatorial regime' submit to the democratic 'central authority' of Korea and allows our people to possess appropriate autonomy while becoming part of the [FROM.GetAdjective] sphere of influence. How should we respond to this naked threat?"
  KOR_minzhu_hongxian.17.a: "We are powerless to refuse the other side's demands."
  KOR_minzhu_hongxian.17.b: "We will fight to the last person!"
  KOR_minzhu_hongxian.18.t: "[FROM.GetLeader] Accepts Our Demand"
  KOR_minzhu_hongxian.18.desc: "[FROM.GetNameDef]'s [FROM.GetLeader] has accepted our demand and submitted to our nation, bringing [FROM.GetAdjective] back into our sphere of influence. Today we have achieved victory, and the [FROM.GetAdjective] people are henceforth liberated from oppressive dictatorship!"
  KOR_minzhu_hongxian.18.a: "Fantastic."
  KOR_minzhu_hongxian.19.t: "[FROM.GetLeader] Rejects Our Demand"
  KOR_minzhu_hongxian.19.desc: "[FROM.GetNameDef]'s [FROM.GetLeader] unfortunately rejected our demand for submission, claiming their people intend to establish an independent nation, not become a revolutionary region within the [ROOT.GetAdjective] sphere of influence. They have made the wrong choice..."
  KOR_minzhu_hongxian.19.a: "Then we must liberate their people by force!"
  KOR_minzhu_hongxian.20.a: "We have no objection to this"
  KOR_minzhu_hongxian.20.b: "Forget it.."
  KOR_minzhu_hongxian.21.a: "Great"
  KOR_minzhu_hongxian.22.a: "We gladly accept"
  KOR_minzhu_hongxian.22.b: "This sounds a bit suspicious..."
  KOR_minzhu_hongxian.23.a: "Great"
  KOR_minzhu_hongxian.24.a: "This is simply too tempting to miss"
  KOR_minzhu_hongxian.24.b: "We will not give up economic independence!"
  KOR_minzhu_hongxian.25.a: "We thank them for their naivety"
  KOR_minzhu_hongxian.26.t: "Information Retrieval Success"
  KOR_minzhu_hongxian.26.desc: "Our compatriots scattered around the world are the invisible eyes and ears of the Republic. Our recent attempt to activate the overseas patriot network has achieved great success! Using their local identities as cover, they skillfully evaded counter-intelligence surveillance and successfully obtained a piece of extremely important intelligence from within [FROM.GetNameDef].\n\nThis intelligence revealed the other side's intelligence deployment, giving us the upper hand in our game with them. These overseas compatriots, with their hearts toward the motherland, have rendered silent meritorious service for the Republic with their wisdom and courage."
  KOR_minzhu_hongxian.26.a: "Excellent!"
  KOR_minzhu_hongxian.27.t: "Information Retrieval Failure"
  KOR_minzhu_hongxian.27.desc: "Our operation to obtain internal information from [FROM.GetNameDef] via the overseas compatriot network did not proceed as smoothly as expected. The dispatched contacts vanished without a trace, lost contact, and ultimately failed to return any valuable intelligence.\n\nPerhaps local security measures were tighter than we anticipated, or perhaps our plan itself had flaws. Although this operation caused no personnel losses or diplomatic disputes, the invested resources were wasted, and a precious time window may have been missed. This setback reminds us that intelligence work must never be taken lightly."
  KOR_minzhu_hongxian.27.a: "Vanished without a trace..."
  KOR_minzhu_hongxian.28.t: "Operation Discovered"
  KOR_minzhu_hongxian.28.desc: "A disaster! Our intelligence-gathering operation against [FROM.GetNameDef] ended in the worst possible way. Our overseas compatriot network was cracked by local counter-intelligence agencies at one stroke. Several patriotic compatriots were unfortunately arrested, and the entire intelligence network was paralyzed.\n\nThe [FROM.GetNameDef] government subsequently lodged the sternest diplomatic protest against us, accusing us of 'despicable espionage activities' and expelling our diplomats. This painful failure not only cost us precious intelligence sources but also pushed bilateral relations to the brink of danger, severely damaging our international reputation. We have paid a heavy price for this adventure."
  KOR_minzhu_hongxian.28.a: "The price of exposure..."
  KOR_minzhu_hongxian.29.t: "International Technical Cooperation"
  KOR_minzhu_hongxian.29.desc: "Our industrial base and scientific research level still lag considerably behind the world's advanced nations. To accelerate modernization, we must humbly learn from our friends. Therefore, we have formally requested our ally to undertake comprehensive technical cooperation.\n\nWe propose sending scholars and engineers to their universities and factories to learn their advanced science, technology, and management experience. This will not only shorten our R&D cycle but also be an excellent opportunity to consolidate the friendship between our two nations."
  KOR_minzhu_hongxian.29.a: "The thirst for knowledge."
  KOR_minzhu_hongxian.30.t: "Gunfire on the Street"
  KOR_minzhu_hongxian.30.desc: "As President $KOR_syngman_rhee$'s rule became increasingly iron-fisted, domestic opposition also grew louder. Under the pretext of anti-communism, he extensively purged dissidents and forcibly amended the constitution multiple times to seek re-election, long ago detonating the deep-seated dissatisfaction among the people.\n\nToday, as the presidential motorcade passed through Seoul streets amidst a mix of cheers and protests, a crisp gunshot pierced the clamor. The bullet accurately hit its target; the first president of the Republic of Korea, $KOR_syngman_rhee$, was killed in front of everyone's eyes. The shadow of assassination immediately engulfed the entire nation. The military and police high command quickly pointed fingers at the largest opposition party, and a bloody suppression seemed imminent. However, in the chaotic power vacuum, the democratic faction led by Chang Myon decisively seized the moment. They publicly condemned the violence while calling for all sides to remain calm and promising the nation: they would immediately prepare a truly fair, unmanipulated election to decide the country's future."
  KOR_minzhu_hongxian.30.a: "Oh my God"
  KOR_minzhu_hongxian.31.t: "National Assembly Re-election"
  KOR_minzhu_hongxian.31.desc: "$KOR_syngman_rhee$ is dead. This strongman who ruled the republic with an iron fist and made staunch anti-communism his lifelong creed ultimately also fell in the cycle of violence. His death plunged the entire nation into a power vacuum and also brought unprecedented opportunity.\n\nInside the National Assembly, factions are frantically vying for power; everyone wants to seize this chance to steer the nation toward their desired direction. Now is the time for a decisive election to select a leader who can lead us out of chaos and open a new era."
  KOR_minzhu_hongxian.31.a: "Vice President $KOR_Yi_Siyeong$ emergency authorization"
  KOR_minzhu_hongxian.31.b: "Hae Gong $KOR_Shin_Ik_hee$ can help us through this crisis"
  KOR_minzhu_hongxian.31.c: "The Democratic Party wins"
  KOR_minzhu_hongxian.31.d: "The $KOR_Kim_Seong_Soo$ faction seizes power"
  KOR_minzhu_hongxian.31.e: "Bishop $JKO_Archbishop_Roh_Paul$....?"
  ###################################### Neutral ############################################################
  KOR_zhongli_hongxian.0.t: "§L$KOR_Cho_Man_sik$§! Elected"
  KOR_zhongli_hongxian.0.desc: "Amidst the chaotic political situation, a voice symbolizing the nation's conscience ultimately emerged victorious. Mr. Cho Man-sik, revered as the 'Gandhi of Korea', was jointly elevated by various factions to become the highest leader of the new nation.\n\nHe neither agrees with communist class struggle nor is he receptive to $KOR_syngman_rhee$'s pro-American line. What he advocates is a 'Korean path' of developing national industry, achieving economic self-reliance, and ultimately attaining peaceful unification. His election marks the opening of a non-violent, non-aligned middle path. Under the leadership of this great elder of Pyongyang, we will no longer rely on any external forces but use our own hands to build a complete and noble unified nation."
  KOR_zhongli_hongxian.0.a: "The birth of a centrist leader."
  KOR_zhongli_hongxian.1.t: "§L$KOR_lyuh_woon_hyung$§! Elected"
  KOR_zhongli_hongxian.1.desc: "As a moderate leftist politician dedicated to unity and opposing division throughout his life, Lyuh Woon-hyung won the support of the vast majority of centrists who neither wish to accept communist transformation nor despise right-wing dictatorship.\n\nIn his inaugural address, he solemnly promised that the new government will adhere to the principle of 'centrism', not leaning towards any superpower, and commit to left-right cooperation to establish a unified and autonomous nation belonging to all the Korean people. Under the leadership of this pragmatic idealist, a unique third path transcending Cold War confrontation unfolds before us."
  KOR_zhongli_hongxian.1.a: "The birth of a centrist leader."
  KOR_zhongli_hongxian.2.t: "$ITA_common_ground$"
  KOR_zhongli_hongxian.2.desc: "We have initiated broad political dialogue, engaging simultaneously with leaders of both communist and democratic factions. Our demand is unified and clear: the fate of the Korean nation should not be decided by Moscow or Washington.\n\nWe urge them to transcend ideological dogma and, as patriots, join us in forging an autonomous path responsible only to our own people. This is a critical moment; their choice will determine whether our nation unites as one or fragments under the shadow of proxy wars. We await their reply."
  KOR_zhongli_hongxian.2.a: "Contact $KOR_pak_hon_yong$"
  KOR_zhongli_hongxian.2.b: "Commence talks with $KOR_Kim_Koo$"
  KOR_zhongli_hongxian.3.t: "[FROM.GetNameDef] Requests Sending Technical Advisors"
  KOR_zhongli_hongxian.3.desc: "[GetLKORInviteConsultants]"
  KORKORInviteConsultants_SOV_key: "Our comrades in Korea sent an interesting report. The new Korean government, which calls itself 'neutral', formally requested us to send technical advisors. They rejected our proposal to establish a fraternal socialist alliance, yet crave our industrial technology. Is this naive opportunism, or some cunning political probe? Perhaps we can use this opportunity to let them witness firsthand the superiority of socialist industrialization, thereby correcting their erroneous 'middle path'. The Kremlin needs to carefully consider how to respond to this strange signal."
  KORKORInviteConsultants_USA_key: "We received a surprising request from that emerging neutral nation on the Korean Peninsula. They hope we can send technical advisors to help develop their economy. This is very interesting. A nation sandwiched between Red China and the Soviet Union did not choose their 'Elder Brother' but instead turned their gaze to the Free World. This might be a golden opportunity to pull them back from the brink of communism. But it could also be a trap, a scheme to swindle us out of our advanced technology. We must carefully assess the potential returns and risks of this investment."
  KOR_zhongli_hongxian.3.a: "We will lend a helping hand"
  KOR_zhongli_hongxian.3.b: "An uncertain bet..."
  KOR_zhongli_hongxian.4.t: "[FROM.GetNameDef] Agrees to Send Technical Advisors"
  KOR_zhongli_hongxian.4.desc: "Our diplomatic efforts have achieved a major breakthrough! [FROM.GetNameDef] has agreed to our request to send technical advisors. This proves our 'consensus-based, pragmatic diplomacy' line is entirely correct.\n\nSoon, the first batch of experts from [FROM.Capital.GetCapitalVictoryPointName] will arrive. They bring not only advanced industrial technology and management experience but also de facto recognition of our neutral status. We will carefully guide this cooperation, ensuring we only learn their technology without being 'contaminated' by their ideology. This is a huge opportunity; if used properly, it can greatly accelerate our nation's modernization pace without taking sides."
  KOR_zhongli_hongxian.4.a: "Excellent!"
  KOR_zhongli_hongxian.5.t: "[FROM.GetNameDef] Refuses to Send Technical Advisors"
  KOR_zhongli_hongxian.5.desc: "Our request for technical cooperation with [FROM.GetNameDef] was flatly rejected. They clearly harbor deep suspicions about our firm neutral stance and are unwilling to invest precious technology in a nation they cannot fully control.\n\nThis setback makes us clearly realize how difficult it is to obtain genuine help while squeezed between two superpowers. Their so-called 'aid' always comes with political conditions. Since the illusory path is blocked, let us completely discard illusions and prepare for struggle! From today, we must redouble our efforts, rely on our own strength, and embark on a more arduous but also more glorious path of self-reliance!"
  KOR_zhongli_hongxian.5.a: "How infuriating.."
  KOR_zhongli_hongxian.6.t: "[FROM.GetNameDef] Holds Asian Neutral Nations Conference"
  KOR_zhongli_hongxian.6.desc: "We received an ambitious diplomatic invitation from the Korean Peninsula. That nation struggling to maintain neutrality between two superpowers is planning to hold an 'Asian Neutral Nations Conference' and has invited us to participate.\n\nThey seem to want to unite all forces in Asia unwilling to take sides, forming a so-called 'third force'. This is undoubtedly a bold challenge to the US-Soviet bipolar structure. Accepting this invitation means we have an opportunity to expand our influence on a new international platform, but it may also incur the displeasure of one superpower or the other.\n\nIt's time to decide our stance in this increasingly divided world. Should we join this uncertain 'gathering of neutrals' or continue practicing cautious isolationism?"
  KOR_zhongli_hongxian.6.a: "Let the world hear our voice!"
  KOR_zhongli_hongxian.6.b: "Better continue isolationism"
  KOR_zhongli_hongxian.7.t: "[FROM.GetNameDef] Accepts Our Invitation"
  KOR_zhongli_hongxian.7.desc: "Our initiative has received a positive response! [FROM.GetNameDef] has formally replied, accepting our invitation and will send a delegation to attend the 'Asian Neutral Nations Conference' in Seoul.\n\nThis proves our 'third path' concept resonates deeply; we are not fighting alone in Asia. The participation of [FROM.GetNameDef] not only bolsters the conference's momentum but also lays a solid foundation for us to form a 'Neutral Nations Alliance' independent of the two major blocs in the future. A single spark can start a prairie fire!"
  KOR_zhongli_hongxian.7.a: "Like-minded partners!"
  KOR_zhongli_hongxian.8.t: "[FROM.GetNameDef] Rejects Our Invitation"
  KOR_zhongli_hongxian.8.desc: "Our invitation received a polite refusal letter from [FROM.GetNameDef]. They expressed 'appreciation' for our idea in the letter but declined to send representatives, citing 'busy domestic affairs' or 'timing not yet ripe'.\n\nObviously, while they also desire independence, they fear pressure from the superpowers more. They chose to be cautious observers rather than brave pioneers. Although this rejection is regrettable, it makes us even more aware of how arduous the path is to unite all neutral forces. We must rely on our own strength to set an example worth emulating for them."
  KOR_zhongli_hongxian.8.a: "Cautious observers.."
  KOR_zhongli_hongxian.9.a: "Knowledge knows no borders"
  KOR_zhongli_hongxian.9.b: "We will instead provide them with economic aid"
  KOR_zhongli_hongxian.10.a: "A mutually beneficial arrangement!"
  KOR_zhongli_hongxian.11.t: "Test of the Alliance"
  KOR_zhongli_hongxian.11.desc: "We chose honor and responsibility! At the highest national meeting, we made the only correct decision: fulfill the sacred obligations of the 'Asian Neutrality Treaty' and fight for our ally!\n\nThe state machinery is in motion; we have issued an ultimatum to the other side, and troops are assembling at the border. This is not just fighting for Third World sovereignty; it is fighting for the right of all small and medium-sized nations to be independent and autonomous in the crevices between superpowers. Today, we will declare to the world through action that the Asian Neutral Nations Alliance is not lambs to the slaughter; any act of aggression against our allies will be met with our most resolute counterattack!"
  KOR_zhongli_hongxian.11.a: "Fight for the ally!"
  KOR_zhongli_hongxian.12.t: "Prince Yi Gang Ascends the Throne"
  KOR_zhongli_hongxian.12.desc: "As the ideological struggle between left and right pushes the nation toward the abyss of division, a bold and ancient proposal is revived: restore the monarchy. This is not a return to the old era but a search for an ultimate symbol that can transcend partisan strife and unite all citizens.\n\nAnd Prince Yi Gang, Prince Euihwa, is the perfect person for this role. As a descendant of Emperor Gojong, his lineage is noble; more importantly, he actively participated in the anti-Japanese independence movement, his patriotism long proven, earning him universal respect from all factions.\n\nAfter extensive secret negotiations, we reached a historic compromise: enthrone Yi Gang as King of the new Kingdom of Korea and establish a constitutional monarchy on this basis. The King will serve as a symbol of national unity, while the actual operation of government will be entrusted to the parliament. A new nation blending tradition and modernity is thus born."
  KOR_zhongli_hongxian.12.a: "It's also a way out.."
  KOR_zhongli_hongxian.13.t: "Debating the State System"
  KOR_zhongli_hongxian.13.desc: "We have enthroned Prince Yi Gang as King, but where should the scale of power in his hands tilt? A fierce debate about the new state system unfolds within the parliament.\n\nOne faction believes we should establish a constitutional monarchy leaning towards democracy. The King should be a purely symbolic head of state, not interfering in any specific government affairs, playing the role of a 'figurehead monarch' maintaining national sentiment. This would make it easier for us to gain recognition and support from Western democratic nations. Another faction advocates for establishing a constitutional monarchy leaning towards tradition. The King should be granted greater authority, having the final say in key areas like military and foreign affairs. This ensures decision-making efficiency in critical times and leverages the monarchy's prestige to more forcefully implement reforms.\n\nThis choice will determine our future state form and the King's own role on the political stage."
  KOR_zhongli_hongxian.13.a: "Democracy first"
  KOR_zhongli_hongxian.13.b: "We must protect our traditions"
  KOR_zhongli_hongxian.14.t: "First Responsible Cabinet"
  KOR_zhongli_hongxian.14.desc: "The return of His Majesty King Yi Gang brought us a symbol of national unity, but he needs a strong Prime Minister to lead the responsible cabinet and handle the complex daily affairs of state. Political giants in parliament have already begun jostling; the final Prime Minister selection will determine the future direction of our nascent Kingdom. His Majesty must appoint a leader capable of uniting the parliament and leading the nation forward."
  KOR_zhongli_hongxian.14.a: "Appoint Kim Koo as Prime Minister"
  KOR_zhongli_hongxian.14.b: "Appoint Lyuh Woon-hyung as Prime Minister"
  KOR_zhongli_hongxian.14.c: "Appoint $KOR_syngman_rhee$ as Prime Minister"
  KOR_zhongli_hongxian.15.t: "Shadows Beneath the Throne"
  KOR_zhongli_hongxian.15.desc: "Although we successfully enthroned His Majesty Yi Gang and bridged most political divisions with a constitutional monarchy, this 'historic compromise' was not recognized by all. Communists publicly denounce this as 'feudal restoration', a dirty deal with reactionary forces.\n\nAlthough they have temporarily remained silent in parliament, reports from our intelligence department show they are using workers' associations and peasant organizations to secretly stockpile weapons and spread inflammatory rhetoric about 'overthrowing the new dynasty'. These shadows beneath the throne await a moment, attempting to use a red storm to overthrow the order we have painstakingly built. An operation aimed at clearing internal hidden dangers seems imminent."
  KOR_zhongli_hongxian.15.a: "Undercurrents stirring..."
  KOR_zhongli_hongxian.16.t: "Korea Announces 'Asian Monroe Doctrine'!"
  KOR_zhongli_hongxian.16.desc: "Today, the Korean government issued a statement through its official radio that shocked the world. Its Foreign Minister declared that Asian affairs should be decided by Asians themselves; any external force—whether communist Soviet Union or capitalist America—has no right to interfere in the internal affairs of Asian nations.\n\nHe called this principle the 'Asian Monroe Doctrine'. This statement is widely interpreted as Korea's intent to challenge US-Soviet hegemony in Asia and attempt to expand its own influence across the region as an 'Asian protector'. While it's currently unclear how this bold declaration will be put into practice, there is no doubt that a powerful force aimed at reshaping the geopolitical landscape of Asia has quietly risen on this peninsula. Embassies of world powers are urgently assessing the true intent behind this declaration."
  KOR_zhongli_hongxian.16.a: "Disquieting..."
  KOR_zhongli_hongxian.17.t: "Conference of Eastern Monarchies"
  KOR_zhongli_hongxian.17.desc: "We received a rather surprising diplomatic invitation from Seoul. That 'neutral' Korea that just restored its monarchy is planning to hold a 'Conference of Eastern Monarchies' and has invited our nation's representative to attend.\n\nTheir intention is obvious: to establish a third force based on 'tradition' and 'royalty' outside the communist and capitalist blocs. This is undoubtedly a bold vision. An alliance of various Asian monarchies might indeed become a solid barrier stabilizing the regional situation and resisting external ideological erosion.\n\nHowever, this also amounts to openly challenging the interests of the US and Soviet blocs in Asia. Accepting the invitation might drag us into an uncertain geopolitical game. Should we join this 'gathering of thrones' or politely decline this ambitious invitation? Our choice is crucial."
  KOR_zhongli_hongxian.17.a: "Unite as one, face hardships together"
  KOR_zhongli_hongxian.17.b: "Better not stir up more trouble..."
  KOR_zhongli_hongxian.18.t: "[FROM.GetNameDef] Agrees to Attend the Conference"
  KOR_zhongli_hongxian.18.desc: "Our invitation received a positive response! The monarch of [FROM.GetNameDef] has confirmed they will attend the 'Conference of Eastern Monarchies' held in our country.\n\nThis proves our vision of uniting ancient Asian kingdoms with 'tradition' as the bond is not a fantasy. The participation of [FROM.GetNameDef] adds significant weight to our upcoming conference. An alliance of monarchies independent of the two major ideological blocs, based on shared culture and interests, is moving from conception to reality. The call of the throne has received an echo from the East."
  KOR_zhongli_hongxian.18.a: "Echo of the throne!"
  KOR_zhongli_hongxian.19.t: "[FROM.GetNameDef] Refuses to Attend the Conference"
  KOR_zhongli_hongxian.19.desc: "Our efforts to unite Eastern monarchies received a polite refusal letter from [FROM.GetNameDef]. They expressed 'respect' for our restoration of the monarchy but declined the invitation, citing 'complex domestic situation' or 'unwillingness to get involved in international disputes'.\n\nTheir crown chose silence over standing with us. Clearly, for these nations, pressure from superpowers is far more real than a vague 'alliance of monarchies'. Although this setback is disappointing, it makes us more sober. Before uniting all royalties, we must first make our own throne immensely powerful and secure."
  KOR_zhongli_hongxian.19.a: "We shall wait and see."
  KOR_zhongli_hongxian.20.t: "Whispers of the Throne"
  KOR_zhongli_hongxian.20.desc: "Recently, an undercurrent of nostalgia for the old era has been quietly surging within our society. Long-forgotten royalist groups suddenly became active; whispers about restoring the monarchy spread among the populace and some elite circles.\n\nOur intelligence department, after meticulous investigation, found this is no coincidence. All clues point to that 'neutral' Korea that just restored its monarchy. They are attempting, through secret funding and political propaganda, to foster a pro-monarchist force within our country, trying to drag us into their so-called 'Conference of Eastern Monarchies'.\n\nThis is not only an open provocation to our republican system but also serious interference in national sovereignty. We must immediately take action to completely cut off these 'whispers of the throne' before they become shouts to overthrow the state!"
  KOR_zhongli_hongxian.20.desc: "Recently, an undercurrent of nostalgia for the old times is quietly stirring in our society. Long-forgotten royalist groups have suddenly become active, and whispers about restoring the monarchy are spreading in the streets and among some elite circles.\n\nOur intelligence department, after meticulous investigation, has found that this is no coincidence. All clues point to that 'neutral' Chosun which has just restored its royal family. They are attempting to secretly fund and conduct political propaganda to foster a pro-monarchist force within our country, aiming to drag us into their so-called 'Eastern Monarchic Alliance'.\n\nThis is not only a blatant challenge to our republican system but also a serious interference with our national sovereignty. We must take immediate action to completely nip these 'Whispers of the Throne' in the bud before they turn into cries that subvert the state!"
  KOR_zhongli_hongxian.20.a: "A disturbing development.."
  KOR_zhongli_hongxian.21.t: "[ROOT.GetNameDef] Civil War"
  KOR_zhongli_hongxian.21.desc: "After a period of rising monarchist sentiment, it seems the [ROOT.GetAdjective] royalists have grown tired of waiting for a peaceful regime change. After intense debates, diplomatic channels appear to have broken down, and armed conflict has ensued."
  KOR_zhongli_hongxian.21.a: "For the King!"
  KOR_zhongli_hongxian.21.b: "We must stop this folly!"
  KOR_zhongli_hongxian.22.a: "If that's the assistance they need, then give it to them."
  KOR_zhongli_hongxian.22.b: "We will not sign such a Faustian bargain."
  KOR_zhongli_hongxian.23.a: "Regrettable, but understandable."
  KOR_zhongli_hongxian.24.a: "They've done us a great favor."
  KOR_zhongli_hongxian.25.a: "What wonderful news!"
  KOR_zhongli_hongxian.26.a: "Gentlemen, you are true friends of [ROOT.GetAdjective]."
  KOR_zhongli_hongxian.28.t: "[FROM.GetAdjective] No Longer Considers Our Country Neutral"
  KOR_zhongli_hongxian.28.desc: "The situation has taken a turn for the worse. Due to [FROM.GetAdjective] expressing contempt for [ROOT.GetNameDef], that country has declared it will confront us on the political stage, or even the battlefield."
  KOR_zhongli_hongxian.28.a: "Our future is uncertain!"
  ###################################### 法西斯 ############################################################
  KOR_faxisi_hongxian.1.t: "Return of the Crown Prince"
  KOR_faxisi_hongxian.1.desc: "Today, a forgotten sun has risen again over the Korean Peninsula! Crown Prince Yi Un, the last heir of the Joseon Dynasty, has finally set foot on the soil of his homeland after years of exile in Japan.\n\nHe returns not as a weak hostage, but as an Imperial General who served in the old Japanese Imperial Army and witnessed firsthand the power of iron will and modern warfare! His return symbolizes the continuation of our sacred bloodline and heralds the arrival of an era of great power.\n\nHe will become the supreme leader and spiritual icon of our great national revival movement, uniting all citizens with his innate divine authority to forge this nation into a disciplined and inviolable iron kingdom. The shame of the old era will be completely washed away, and a new, martial 'Great Korean Empire' will be reborn under the sun's radiance!"
  KOR_faxisi_hongxian.1.a: "The Sun Returns!"
  KOR_faxisi_hongxian.2.t: "Radiance of the Kingly Way"
  KOR_faxisi_hongxian.2.desc: "Where the royal carriage goes, the people rejoice! When His Majesty Yi Un's procession arrived in [FROM.GetName], the streets were lined with crowds waving 'Great Korean Empire' flags. They cheered from the bottom of their hearts, and many elderly were moved to tears.\n\nFor them, His Majesty's return is not only the restoration of the old royal authority but also the rebirth of order, honor, and national pride. Our propaganda work here has been a huge success! The people have tightly linked the royal authority with the ideology of power we advocate. The radiance of the Kingly Way shines upon this land; the hearts of the people are inclined, and the great undertaking can be achieved!"
  KOR_faxisi_hongxian.2.a: "Let them feel the royal family's care."
  KOR_faxisi_hongxian.3.t: "Silent Subjects"
  KOR_faxisi_hongxian.3.desc: "His Majesty's procession solemnly passed through the streets of [FROM.GetName], but the anticipated enthusiastic scene did not materialize. The people lining the streets merely watched silently, their expressions numb and indifferent, showing neither warmth nor hostility.\n\nThe people here seem indifferent to who rules them. Memories of the old dynasty are too distant for them, and the great ideals we preach have failed to move them. This indicates that our rule here is merely superficial, the ideological foundation is not yet solid. We must strengthen propaganda and organizational work locally, transforming these silent subjects into fervent supporters."
  KOR_faxisi_hongxian.3.a: "It seems we need to do more propaganda."
  KOR_faxisi_hongxian.4.t: "The Dragon's Countenance Insulted"
  KOR_faxisi_hongxian.4.desc: "A tour meant to display the emperor's boundless grace was shamefully desecrated in [FROM.GetName]! As His Majesty's motorcade passed, a rebel hidden in the crowd suddenly rushed out, hurling stones at the procession and shouting the rebellious slogan 'Long live the Republic'!\n\nAlthough the guards subdued him with lightning speed, His Majesty's dignity has been openly challenged. This is by no means an isolated incident but a probe by the local reactionary forces! This is the most serious insult to the 'Dragon's Countenance' and the 'National Polity'. A ruthless, bloody purge must be carried out immediately in the area to serve as a warning to others!"
  KOR_faxisi_hongxian.4.a: "Arrest them all!"
  KOR_faxisi_hongxian.5.t: "Reconstruction of Gyeongbokgung Palace Completed"
  KOR_faxisi_hongxian.5.desc: "Today, under the gaze of all, the rebuilt Gyeongbokgung Palace is finally declared complete! Those buildings of the 'Governor-General's Office', which were ruthlessly demolished by the Japanese colonists and symbolized humiliation, have been completely razed to the ground. In their place stands a restored, even more magnificent palace complex built according to ancient standards.\n\nThis is not merely a simple architectural restoration but a spiritual redemption and rebirth. The rebirth of Gyeongbokgung symbolizes that we have completely swept away the filth of the colonial era and restored our nation's glory and confidence.\n\nFrom now on, this will once again become the power center of our 'Great Korean Empire'. His Majesty Yi Un will lead us towards an even greater future from within these splendid halls. Everyone who sees it will feel our nation's unyielding will and unmatched power!"
  KOR_faxisi_hongxian.5.a: "The Palace Reborn"
  KOR_faxisi_hongxian.6.t: "Mandate of Heaven"
  KOR_faxisi_hongxian.6.desc: "Today, history has witnessed its most glorious moment! After our iron hooves conquered the entire East Asian continent, His Majesty Yi Un has formally ascended the throne in the Hall of Supreme Harmony within Beijing's Forbidden City, also assuming the title of Emperor of China, with the era name 'Gwangmu'!\n\n'All the land under heaven belongs to the king; all the people on the shores are the king's subjects.' This ancient adage has become reality today. This is not only a great military victory but also the ultimate manifestation of the Korean people's Mandate of Heaven!\n\nFrom now on, the vast lands and billions of subjects of Cathay shall all bask in the grace of our Emperor. His Majesty Yi Un is not only the monarch of our Great Korean Empire but also the 'Emperor' of the entire East Asian world. An unprecedented 'Greater East Asian Empire', with us at its absolute core, has come to rule the world! All citizens should rejoice and feel supreme honor for being born in such a great era!"
  KOR_faxisi_hongxian.6.a: "Banzai! His Majesty Yi Un! Banzai! The Great Korean Empire!"
  KOR_faxisi_hongxian.7.t: "Yi Un Becomes Emperor of China"
  KOR_faxisi_hongxian.7.desc: "A piece of news that would seem like a fantasy in the 21st century has become today's most shocking reality. After conquering the entire East Asian continent, the Emperor of the Great Korean Empire, Yi Un, held an ancient and solemn coronation ceremony in the Hall of Supreme Harmony of Beijing's Forbidden City today, formally accepting the homage of officials and concurrently assuming the title of Emperor of China, establishing the era name 'Gwangmu'.\n\nThis means that the concept of the 'Son of Heaven', which was thought to exist only in history books, has been recreated in an unprecedented way. His Majesty Yi Un is now not only the monarch of the Korean nation but also the legal supreme ruler of the entire Chinese world.\n\nThis move is interpreted as the final step in his aim to completely integrate East Asian resources and establish an absolutely unified 'Greater East Asian Empire' led by the Korean nation. A super empire so vast it inspires awe has been born in the East."
  KOR_faxisi_hongxian.7.a: "Astonishing"
  KOR_faxisi_hongxian.8.t: "Youth Eagerly Enlist"
  KOR_faxisi_hongxian.8.desc: "Today, His Majesty Yi Un issued the highest decree to all citizens: the Empire will declare war on Japan to wash away the blood debt and national humiliation of half a century of colonization!\n\nThe news spread, and the whole nation erupted! Countless young men,blood boiling with passion, rushed out of classrooms and factories, swarming recruitment stations to the point of clogging, crying and pleading just to get a chance to fight on the front lines and avenge the nation. What's more, many passionate youths couldn't wait for conscription and voluntarily shaved their heads to form paramilitary organizations like the 'Exterminate Japan Volunteer Corps' and 'Revere the Emperor, Expel Traitors Corps', drilling in the streets with crude weapons, vowing to follow the Imperial Army onto the Japanese mainland and plant our battle flag on Mount Fuji!\n\nThis wave of vengeance, formed from popular resentment and fanaticism, is now unstoppable. Our army, carrying this overwhelming public will, will launch the final, most thorough reckoning against our eastern foe!"
  KOR_faxisi_hongxian.8.a: "Settle the century-old shame!"
  KOR_faxisi_hongxian.9.t: "Heavenly Punishment"
  KOR_faxisi_hongxian.9.desc: "Today, in Tokyo, occupied by our Imperial Army, a trial deciding the fate of the old Japanese Empire was formally held by decree of His Majesty Yi Un. Hirohito, the man who once claimed to be a 'god', along with other Japanese war criminals, received a just verdict at the special military tribunal we established for their heinous crimes.\n\nBut this is not enough. To completely eradicate the aggression gene of this evil nation, we declare: the Japanese imperial family, this 'myth' of unbroken lineage for ages, will be completely terminated. All major members of the imperial family will be purged for 'war crimes' and 'crimes against humanity'.\n\nThis is the most complete consolation for our ancestors who suffered, and the sternest warning to all potential enemies. The old sun has set, and a new East Asian order dominated by us will be formally established in this ruthless heavenly punishment!"
  KOR_faxisi_hongxian.9.a: "Hang them!"
  KOR_faxisi_hongxian.10.t: "Disposition of the Defeated"
  KOR_faxisi_hongxian.10.desc: "An era has ended. As [JAP.GetLeader] announced unconditional surrender on the radio, that 'Empire of Japan' which once attempted to annex Asia and enslave our people has finally turned to historical dust. Our army has entered Tokyo; their 'god' trembles before our bayonets.\n\nNow, this once arrogant archenemy kneels at our feet like a prisoner awaiting judgment. Should we completely dismember it to eliminate future threats forever? Or transform it into the most loyal servant on our imperial chariot?"
  KOR_faxisi_hongxian.10.a: "Incorporate them into the Empire's territory."
  KOR_faxisi_hongxian.10.b: "Crown Lady Yi Bang-ja as the new Tenno."
  KOR_faxisi_hongxian.11.t: "The Call of the Holy War"
  KOR_faxisi_hongxian.11.desc: "The news came like a divine oracle from God himself — those red bandits who stole our sacred homeland and slaughtered the entire Tsar's family have finally begun to tear each other apart!\n\nTwenty years! For twenty long years, we, the last loyal sons of old Russia, have wandered like ghosts in foreign lands, eating others' bread, enduring endless humiliation, with our only dream being to return to that frozen homeland defiled by the 'Red Plague'.\n\nNow, God has given us a chance! We, the generals and soldiers of the old Empire, kneel here before our generous protector, the great Emperor of the Great Korean Empire, begging for his final grace: allow us to gather our exiled compatriots, take up our swords, and bring the double-headed eagle battle flag back to the Siberian steppes!\n\nThe red beast is wounded; let us be the final spear that pierces its heart! For God, for the Tsar, for Holy Russia!"
  KOR_faxisi_hongxian.11.a: "God, Homeland, Mother"
  KOR_faxisi_hongxian.12.t: "Distant Kin in the Far East?"
  KOR_faxisi_hongxian.12.desc: "Today, an envoy from the distant 'Great Korean Empire' in the Far East presented a state letter to our Shah in Tehran. They proposed establishing an 'Imperial Alliance' spanning Asia to counter the red threat from the north.\n\nAt first, we paid little heed to this proposal. But then, the lead envoy recounted an almost forgotten legend recorded in the ancient epic Kushnameh: over a thousand years ago, an exiled Persian prince, after the fall of the Sassanid Empire, crossed the ocean and eventually reached the ancient Korean kingdom of Silla, marrying a local princess. The envoy claimed they were not ordinary foreigners but our 'distant kin in the Far East' sharing the same noble bloodline! They believed this alliance was not merely political but the fated reunion of two ancient Aryan branches after a millennium!\n\nThis ancient legend casts a mysterious and affable halo over their aggressive imperial ambitions. Joining hands with these distant 'kin' to revitalize the glory of the Aryan race might indeed be the Mandate of Heaven."
  KOR_faxisi_hongxian.12.a: "The bond of blood!"
  KOR_faxisi_hongxian.12.b: "Perhaps we can renew the connection from a thousand years ago."
  KOR_faxisi_hongxian.12.c: "This is utterly absurd!"
  KOR_faxisi_hongxian.13.t: "[FROM.GetAdjective] Agrees to Alliance"
  KOR_faxisi_hongxian.13.desc: "Our envoy has brought back heartening news from Tehran: the Persian Empire, that ancient lion in western Asia, has agreed to our alliance request!\n\nThey deeply believed the ancient legend we told about the Persian prince and the Silla princess and regard us as 'long-lost kin from the Far East'. Now, two empires sharing ancient monarchies and martial spirit will formally join hands in the name of the 'Aryan Covenant'. We will hold the east and west ends of Asia, forming a deadly pincer movement against the red bear in the north. A power axis spanning the entire Asian continent has taken shape!"
  KOR_faxisi_hongxian.13.a: "The Aryan Covenant!"
  KOR_faxisi_hongxian.14.t: "[FROM.GetAdjective] Seeks Our Protection"
  KOR_faxisi_hongxian.14.desc: "The response from Tehran far exceeded our boldest expectations! The Persian Shah not only gladly accepted our alliance request but was also subdued by our Empire's great power and grand vision of being 'chosen by heaven'.\n\nIn the reply, they humbly stated their willingness to acknowledge the leadership position of our 'Great Korean Empire' among the 'Aryan brothers' and requested to place their country under our strong military protection! This means this lion of western Asia has voluntarily become the first vassal state of our Empire. Our influence has crossed the entire Asian continent for the first time. Our Emperor has truly become the 'Lord of Empires' to whom all nations come to pay homage!"
  KOR_faxisi_hongxian.14.a: "The Lion's Submission."
  KOR_faxisi_hongxian.15.t: "[FROM.GetAdjective] Rejects Our Proposal"
  KOR_faxisi_hongxian.15.desc: "Our envoy to Persia brought back a polite but firm rejection letter. While the Tehran side expressed respect for our strength, they seemed unimpressed by that ancient 'blood kin' legend.\n\nThey believe that allying with our distant Eastern Empire carries too much risk and might directly drag them into a full-scale war with the Soviet Union. This cautious Persian lion chose to continue fighting alone within its own territory rather than joining us in the great undertaking. Our vision of an 'Asian Imperial Axis' has suffered its first setback."
  KOR_faxisi_hongxian.15.a: "They will regret this!"
  KOR_faxisi_hongxian.16.t: "Whispers of the Throne"
  KOR_faxisi_hongxian.16.desc: "Recently, an undercurrent of nostalgia for the old times is quietly stirring in our society. Long-forgotten royalist groups have suddenly become active, and whispers about restoring the monarchy are spreading in the streets and among some elite circles.\n\nOur intelligence department, after meticulous investigation, has found that this is no coincidence. All clues point to that Great Korean Empire which has just restored its royal family. They are attempting to secretly fund and conduct political propaganda to foster a pro-monarchist force within our country.\n\nThis is not only a blatant challenge to our state system but also a serious interference with our national sovereignty. We must take immediate action to completely nip these 'Whispers of the Throne' in the bud before they turn into cries that subvert the state!"
  KOR_faxisi_hongxian.16.a: "A disturbing development.."
  KOR_faxisi_hongxian.17.t: "[ROOT.GetNameDef] Civil War"
  KOR_faxisi_hongxian.17.desc: "After a period of rising monarchist sentiment, it seems the [ROOT.GetAdjective] royalists have grown tired of waiting for a peaceful regime change. After intense debates, diplomatic channels appear to have broken down, and armed conflict has ensued."
  KOR_faxisi_hongxian.17.a: "For the King!"
  KOR_faxisi_hongxian.17.b: "We must stop this folly!"
  KOR_faxisi_hongxian.18.t: "[FROM.GetLeader] Demands Our Submission"
  KOR_faxisi_hongxian.18.desc: "[FROM.GetNameDef]'s [FROM.GetLeader] demands that our regime submit to the Emperor of the Great Korean Empire and allows our people appropriate autonomy under the condition of becoming part of [FROM.GetAdjective] sphere of influence. How should we respond to this naked threat?"
  KOR_faxisi_hongxian.18.a: "We are powerless to refuse their demand."
  KOR_faxisi_hongxian.18.b: "We will fight to the last man!"
  KOR_faxisi_hongxian.19.t: "[FROM.GetLeader] Accepts Our Demand"
  KOR_faxisi_hongxian.19.desc: "[FROM.GetNameDef]'s [FROM.GetLeader] has accepted our demand and submitted to our country, bringing [FROM.GetAdjective] back into our sphere of influence. Today, we have achieved victory, and the [FROM.GetAdjective] people will henceforth enjoy a bright future under the radiance of [ROOT.GetLeader]'s Majesty!"
  KOR_faxisi_hongxian.19.a: "Excellent."
  KOR_faxisi_hongxian.20.t: "[FROM.GetLeader] Rejects Our Demand"
  KOR_faxisi_hongxian.20.desc: "[FROM.GetNameDef]'s [FROM.GetLeader] unfortunately rejected our demand for submission,claiming their people intend to establish an independent country, not become a monarchical region within [ROOT.GetAdjective]'s sphere of influence. They have made the wrong choice..."
  KOR_faxisi_hongxian.20.a: "They will regret this!"

  KOR_caidan_shijian_zu.1.t: "Heavenly Phenomenon"
  KOR_caidan_shijian_zu.1.desc: "Astronomers from the Imperial Academy of Sciences have submitted an urgent report, the contents of which are perplexing. The report states that a 'comet' recently entered the atmosphere, but its trajectory completely defies the known laws of physics.\n\nIt did not burn up and fall like a normal meteor. Instead, it performed a series of unbelievable, clearly 'purposeful' sharp-angled turns over the Empire before vanishing without a trace, as if it never existed. The scientists cannot explain this phenomenon and can only label it as a 'strangely-trajectoried' astronomical event. Some officials think it's merely some rare natural phenomenon, not worth mentioning. But others feel a vague unease, believing it to be an omen, or that something we cannot yet understand is watching us.\n\nPerhaps we should pay more attention to this matter?"
  KOR_caidan_shijian_zu.1.a: "Interesting..."
  KOR_caidan_shijian_zu.1.b: "Just a comet..."
  KOR_caidan_shijian_zu.2.t: "The Fallen Object"
  KOR_caidan_shijian_zu.2.desc: "Following the Academy's report on the 'strangely-trajectoried comet,' a local report from [525.GetName] has made the matter even more puzzling. Local civilians and garrison troops reported one after another that they witnessed a bright flash of fire descending from the sky, ultimately crashing deep into the distant mountains, igniting a small forest fire. This roughly coincides with the disappearance time of the earlier 'comet'.\n\nIs this an ordinary meteorite, or the wreckage of that strangely behaving 'flying object'? Whatever it is, it now lies on our soil. A great mystery rests quietly in that remote, uninhabited mountain forest, waiting for us to uncover it.\n\nPerhaps we should immediately dispatch a team of experts consisting of scientists and military personnel to investigate the crash site."
  KOR_caidan_shijian_zu.2.a: "Send an expert team to have a look."
  KOR_caidan_shijian_zu.2.b: "What's so strange about that?"
  KOR_caidan_shijian_zu.3.t: "Not of This World"
  KOR_caidan_shijian_zu.3.desc: "The advance team has sent back unbelievable news! At the crash site, what they found was no meteorite, but a massive, strangely shaped 'craft'!\n\nIts hull is made of some unseen alloy that gleams with a dark light, its surface smooth as a mirror, without any traces of welding or riveting. Although severely damaged from the impact, the industrial design and technological level exhibited by this entire craft far surpass the most advanced products of our era, even beyond humanity's wildest imagination. Through the blurry, shattered 'glass', team members glimpsed some oddly shaped objects and control panels emitting faint light inside.\n\nThis is a discovery capable of overturning the world! We have issued the highest-level gag order and dispatched the Empire's most elite troops to secretly transfer this 'Not of This World' object and everything inside it to the core Academy. A top-secret research project that will completely change the fate of our Empire, and even all of humanity, is about to begin."
  KOR_caidan_shijian_zu.3.a: "!!!"
  KOR_caidan_shijian_zu.4.t: "Myth Awakens..?"
  KOR_caidan_shijian_zu.4.desc: "Research on that 'object from beyond the heavens' has left our scientists both bewildered and awestruck. Its complex principles are far beyond our understanding, but the true shock comes from inside the craft — there lies a 'human' fallen into deep sleep!\n\nHis physiological characteristics are completely identical to ours, and the most shocking thing is his attire — its ancient style bears a striking resemblance to the decorations depicted in ancient texts from the 'Dangun era'! Could this be... a Descendant of Heaven? Could our myths not be fiction, but true history?\n\nWe have transferred this sleeping 'ancestor' to the Empire's highest medical facility for strict observation/custody. When he awakens from his millennial slumber, the origin of our nation, and perhaps the history of the entire world, may be completely overturned."
  KOR_caidan_shijian_zu.4.a: "My goodness..."
  KOR_caidan_shijian_zu.5.t: "Bloodline of the Stars"
  KOR_caidan_shijian_zu.5.desc: "He is awake! That 'ancestor' from 'beyond the heavens' has finally awakened from his long slumber! He revealed to us a truth that overturns cognition: we, the Korean people, are descendants of the 'Descendants of Heaven' from distant starry seas, and he is one of the ancient pioneers who crashed his exploration vessel thousands of years ago. Our myths are actually lost history of interstellar travel!\n\nNow, he will serve as the chief scientific advisor, sharing knowledge far beyond this era with us. He will help us unify this 'backward' planet,rebuild order, and ultimately lead our great Empire back to our true homeland among the stars that truly belongs to us!"
  KOR_caidan_shijian_zu.5.a: "Past... or... Future"
  KOR_caidan_shijian_zu.6.t: "Eternal Slumber"
  KOR_caidan_shijian_zu.6.desc: "Great sorrow envelops us. Despite the Empire's top doctors exhausting all methods, we failed to save the life of that 'visitor from beyond the heavens'. His health deteriorated rapidly after awakening, and he eventually closed his eyes forever.\n\nWith his passing, all secrets were taken with him. The craft became an indecipherable book of heaven, and the meaning of the ancient patterns on him became an eternal mystery. Who are we truly? Where do we come from? The answer to this question was once so close, but now it is once again out of reach.\n\nWe have sealed him and the craft together in the deepest underground, as an eternal 'National Mystery', waiting for future generations, in the distant future when they possess sufficient wisdom and technology, to unlock it once more."
  KOR_caidan_shijian_zu.6.a: "Yet another unsolved mystery..."

