l_english:\n RAJ_seek_intial_funding_doubled_tt: "Add §G6§! Building Slot\nAdd §G6§! §YCivilian Factory§! to our Capital when completing §Y$RAJ_incorporation_of_the_east_india_company$§!"\n RAJ_seek_intial_funding_tt: "Add §G6§! Building Slot\nAdd §G6§! §YCivilian Factory§! to our Capital when completing §Y$RAJ_incorporation_of_the_east_india_company$§!"\n RAJ_funnel_british_investments_into_princely_states_tt: "Every subject that is on the Indian subcontinent will receive §G2§! §YCivilian Factory§! and §G6§! Building Slots.\nSubjects not yet released will receive the bonus once released."\n RAJ_the_empires_workshop_civs_to_the_empire_subjects_tt: "(§Y[ENG.GetFlag][ENG.GetName]§! in a random core state): \n Add §G4§! Building Slots. \n Add §G4§! §Y$industrial_complex$§! \n\n(§YEvery [ENG.GetFlag][ENG.GetAdjective] subject§! in a random core state): \n Add §G2§! Building Slots. \n Add §G2§! §Y$industrial_complex$§!"